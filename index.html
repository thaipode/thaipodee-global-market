<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThaiPodee — สลับบัญชี</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100vh; overflow: hidden; background: #000; color: #fff; }

        /* === พื้นหลังเบลอเมื่อเมนูเปิด === */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            display: none;
        }

        /* === กล่องสลับบัญชี === */
        .account-switcher {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #1c1c1e;
            border-radius: 20px 20px 0 0;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            padding: 20px 16px 30px;
        }
        .account-switcher.open {
            transform: translateY(0);
        }

        .switcher-header {
            text-align: center;
            position: relative;
            margin-bottom: 24px;
        }
        .switcher-title {
            font-size: 17px;
            font-weight: 600;
        }
        .close-btn {
            position: absolute;
            right: 0; top: 50%; transform: translateY(-50%);
            font-size: 22px;
            color: #888;
            background: none; border: none; cursor: pointer;
        }

        /* === รายการบัญชี === */
        .account-item {
            display: flex;
            align-items: center;
            padding: 14px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .account-item:hover, .account-item.active {
            background: #2c2c2e;
        }
        .account-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: #333; margin-right: 12px;
            overflow: hidden; flex-shrink: 0;
        }
        .account-avatar img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .account-info {
            flex: 1;
        }
        .account-name {
            font-size: 15px; font-weight: 500;
        }
        .account-check {
            color: #00f080; font-size: 20px; font-weight: bold;
        }
        .badge {
            background: #ff2442; color: #fff; font-size: 11px;
            padding: 2px 6px; border-radius: 10px;
            margin-left: 8px;
        }
        .add-account {
            margin-top: 8px;
        }
        .add-icon {
            width: 44px; height: 44px; border-radius: 50%;
            background: #2c2c2e; display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #888; margin-right: 12px; flex-shrink: 0;
        }

        /* === ปุ่มเปิดเมนู === */
        .open-switcher-btn {
            position: fixed;
            top: 12px; left: 12px;
            background: #2c2c2e; border: none; color: #fff;
            padding: 8px 12px; border-radius: 8px;
            font-size: 14px; cursor: pointer;
            z-index: 50;
        }
    </style>
</head>
<body>

<!-- ปุ่มเปิดสลับบัญชี -->
<button class="open-switcher-btn" onclick="openSwitcher()">สลับบัญชี</button>

<!-- พื้นหลังปิดได้ -->
<div class="overlay" id="overlay" onclick="closeSwitcher()"></div>

<!-- กล่องสลับบัญชี -->
<div class="account-switcher" id="switcher">
    <div class="switcher-header">
        <div class="switcher-title">สลับบัญชี</div>
        <button class="close-btn" onclick="closeSwitcher()">×</button>
    </div>

    <!-- บัญชีที่ใช้อยู่ -->
    <div class="account-item active" data-account="main" onclick="selectAccount(this)">
        <div class="account-avatar">
            <img src="https://picsum.photos/seed/thaipodee-logo/100/100">
        </div>
        <div class="account-info">
            <div class="account-name">podee.office.cancel</div>
        </div>
        <div class="account-check">✓</div>
    </div>

    <!-- บัญชีที่ 2 -->
    <div class="account-item" data-account="music" onclick="selectAccount(this)">
        <div class="account-avatar">
            <img src="https://picsum.photos/seed/thaipodee-music/100/100">
        </div>
        <div class="account-info">
            <div class="account-name">thaipodee.music.band <span class="badge">9+</span></div>
        </div>
        <div></div>
    </div>

    <!-- บัญชีที่ 3 -->
    <div class="account-item" data-account="kom" onclick="selectAccount(this)">
        <div class="account-avatar">
            <img src="https://picsum.photos/seed/kompodee/100/100">
        </div>
        <div class="account-info">
            <div class="account-name">kompodee <span class="badge">9+</span></div>
        </div>
        <div></div>
    </div>

    <!-- เพิ่มบัญชีใหม่ -->
    <div class="account-item add-account" onclick="addNewAccount()">
        <div class="add-icon">+</div>
        <div class="account-info">
            <div class="account-name" style="color:#888;">เพิ่มบัญชี</div>
        </div>
        <div></div>
    </div>
</div>

<script>
function openSwitcher() {
    document.getElementById('overlay').style.display = 'block';
    document.getElementById('switcher').classList.add('open');
}

function closeSwitcher() {
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('switcher').classList.remove('open');
}

function selectAccount(item) {
    // ลบถูกจากทุกอัน
    document.querySelectorAll('.account-item').forEach(el => {
        el.classList.remove('active');
        const check = el.querySelector('.account-check');
        if (check) check.remove();
    });
    // ใส่ถูกให้อันที่เลือก
    item.classList.add('active');
    const checkMark = document.createElement('div');
    checkMark.className = 'account-check';
    checkMark.textContent = '✓';
    item.appendChild(checkMark);

    const accountName = item.querySelector('.account-name').textContent.split(' ')[0];
    alert('สลับไปใช้บัญชี: ' + accountName);
    closeSwitcher();
}

function addNewAccount() {
    alert('เปิดฟอร์มเพิ่ม/เข้าสู่ระบบบัญชีใหม่');
}
</script>

</body>
</html>
