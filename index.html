<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="thaipodee">

  <link rel="icon" type="image/png" sizes="192x192" href="./thaipodee_logo_icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./thaipodee_logo_icon.png">

  <title>thaipodee Global Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; background: #000; color: #fff;
      font-family: sans-serif;
      -webkit-overflow-scrolling: touch;
    }
    .version-tag {
      position: fixed; top: 10px; right: 10px;
      background: rgba(0,0,0,0.6); color: #10b981;
      font-size: 11px; padding: 3px 8px; border-radius: 10px;
      z-index: 100;
    }
    .status-bar {
      position: fixed; top: 10px; left: 10px; right: 80px;
      background: rgba(22, 163, 74, 0.2); color: #4ade80;
      font-size: 12px; padding: 6px 10px; border-radius: 6px;
      z-index: 100; display: none;
    }
    .status-bar.show { display: block; }
    .page {
      display: none; min-height: 100vh; padding-bottom: 80px; padding-top: 45px;
    }
    .page.active { display: block; }
    .splash {
      position: fixed; inset: 0; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 200; transition: opacity 0.4s ease;
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .logo {
      width: 180px; height: 180px;
      background: url('./thaipodee_logo_icon.png') no-repeat center;
      background-size: contain; margin-bottom: 16px;
    }
    .logo-text { font-size: 22px; font-weight: bold; }
    .logo-sub { font-size: 13px; color: #888; margin-top: 6px; }

    .post-card {
      border-bottom: 1px solid #222; padding: 16px; background: #000;
    }
    .video-container {
      width: 100%; aspect-ratio: 9/16; background: #111; border-radius: 8px;
      position: relative; overflow: hidden; cursor: pointer;
    }
    .video-container video {
      width: 100%; height: 100%; object-fit: cover;
    }
    .play-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.3); transition: opacity 0.3s;
    }
    .play-overlay.hidden { opacity: 0; pointer-events: none; }
    .play-overlay i { font-size: 64px; color: #fff; }
    .meta { font-size: 12px; color: #888; margin: 6px 0; }
    .title { font-weight: bold; font-size: 15px; margin: 6px 0; }

    .right-buttons {
      position: absolute; right: 12px; bottom: 15%;
      display: flex; flex-direction: column; gap: 24px; z-index: 10;
    }
    .r-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .r-btn i { font-size: 24px; }
    .r-btn span { font-size: 10px; margin-top: 2px; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000;
      display: flex; justify-content: space-around; align-items: center;
      border-top: 1px solid #222; z-index: 50;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .nav-item i { font-size: 22px; }
    .nav-item span { font-size: 10px; margin-top: 2px; }
    .plus-btn {
      width: 48px; height: 34px; background: linear-gradient(90deg, #ff2e55, #ff6b4a);
      border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .progress-bar {
      width: 100%; height: 6px; background: #333; border-radius: 3px; margin-top: 10px; display: none;
    }
    .progress-bar.show { display: block; }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, #10b981, #34d399);
      border-radius: 3px; width: 0%; transition: width 0.3s ease;
    }
  </style>
</head>
<body>

<div class="status-bar" id="statusBar"></div>
<div class="version-tag">v4.7.7</div>

<div id="splash" class="splash">
  <div class="logo"></div>
  <div class="logo-text">thaipodee</div>
  <div class="logo-sub">Global Market — ตลาดโลก</div>
</div>

<div id="home" class="page active">
  <div id="postsContainer"></div>

  <div class="bottom-nav">
    <div class="nav-item" data-page="home"><i class="fas fa-home"></i><span>หน้าแรก</span></div>
    <div class="nav-item"><i class="fas fa-search"></i><span>ค้นหา</span></div>
    <div class="nav-item" data-page="upload"><div class="plus-btn"><i class="fas fa-plus"></i></div></div>
    <div class="nav-item"><i class="far fa-comment-dots"></i><span>ข้อความ</span></div>
    <div class="nav-item" data-page="profile"><i class="far fa-user"></i><span>ฉัน</span></div>
  </div>
</div>

<div id="upload" class="page">
  <div class="p-4">
    <button class="mb-4 text-lg" data-page="home"><i class="fas fa-arrow-left"></i> กลับ</button>
    <h3 class="text-xl font-bold mb-4">โพสต์วิดีโอ / รูปภาพ</h3>
    <input type="file" id="fileInput" accept="video/*,image/*" class="w-full p-3 bg-gray-800 rounded-lg mb-3">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <button id="postBtn" class="w-full py-3 rounded-lg font-bold bg-gradient-to-r from-pink-600 to-orange-500 mt-3">เผยแพร่</button>
  </div>
</div>

<div id="profile" class="page">
  <div class="p-4">
    <button class="mb-4 text-lg" data-page="home"><i class="fas fa-arrow-left"></i> กลับ</button>
    <h3 class="text-xl font-bold mb-3">โปรไฟล์</h3>
    <p class="text-gray-400 mb-2">ชื่อ: thaipodee</p>
    <p class="text-gray-400 mb-2">จำนวนโพสต์: <span id="postCount">0</span></p>
    <p class="text-gray-400">เริ่มใช้งาน: 21 กันยายน 2569</p>
  </div>
</div>

<script>
let posts = [];

// โหลดโพสต์ — ใช้แบบกลาง ทุกเครื่องเห็นเหมือนกัน
function loadPosts() {
  const saved = localStorage.getItem('thaipodee_posts');
  if (saved) {
    posts = JSON.parse(saved);
  } else {
    posts = [{
      id: 'welcome',
      title: 'ยินดีต้อนรับสู่ thaipodee Global Market',
      author: 'thaipodee',
      date: '21 ก.ย. 69',
      type: 'video',
      aspect: '9:16',
      source: 'ต้นฉบับ',
      videoUrl: null,
      thumbnail: null
    }];
    savePosts();
  }
  renderPosts();
}

function savePosts() {
  localStorage.setItem('thaipodee_posts', JSON.stringify(posts));
}

function renderPosts() {
  const container = document.getElementById('postsContainer');
  container.innerHTML = '';
  
  posts.forEach(p => {
    let mediaHtml = '';
    
    if (p.type === 'video' && p.videoUrl) {
      mediaHtml = `
        <div class="video-container" id="vid-${p.id}">
          <video src="${p.videoUrl}" playsinline loop muted></video>
          <div class="play-overlay" id="ply-${p.id}">
            <i class="fas fa-play-circle"></i>
          </div>
          <div class="right-buttons">
            <div class="r-btn"><i class="fas fa-user"></i><span>${p.author}</span></div>
            <div class="r-btn"><i class="far fa-heart"></i><span>0</span></div>
            <div class="r-btn"><i class="far fa-comment"></i><span>0</span></div>
            <div class="r-btn"><i class="far fa-bookmark"></i><span>บันทึก</span></div>
            <div class="r-btn" onclick="shareThis()"><i class="fas fa-share"></i><span>แชร์</span></div>
            <div class="r-btn"><i class="fas fa-ellipsis-v"></i><span>เพิ่มเติม</span></div>
          </div>
        </div>
      `;
    } else if (p.type === 'image' && p.videoUrl) {
      mediaHtml = `
        <div class="video-container" style="background-image: url('${p.videoUrl}'); background-size: cover;">
          <div class="right-buttons">
            <div class="r-btn"><i class="fas fa-user"></i><span>${p.author}</span></div>
            <div class="r-btn"><i class="far fa-heart"></i><span>0</span></div>
            <div class="r-btn"><i class="far fa-comment"></i><span>0</span></div>
            <div class="r-btn"><i class="far fa-bookmark"></i><span>บันทึก</span></div>
            <div class="r-btn" onclick="shareThis()"><i class="fas fa-share"></i><span>แชร์</span></div>
            <div class="r-btn"><i class="fas fa-ellipsis-v"></i><span>เพิ่มเติม</span></div>
          </div>
        </div>
      `;
    } else {
      mediaHtml = `
        <div class="video-container">
          <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1a1a1a;">
            <i class="fas fa-film" style="font-size:48px;color:#666;"></i>
          </div>
          <div class="right-buttons">
            <div class="r-btn"><i class="fas fa-user"></i><span>${p.author}</span></div>
            <div class="r-btn"><i class="far fa-heart"></i><span>0</span></div>
            <div class="r-btn"><i class="far fa-comment"></i><span>0</span></div>
            <div class="r-btn"><i class="far fa-bookmark"></i><span>บันทึก</span></div>
            <div class="r-btn" onclick="shareThis()"><i class="fas fa-share"></i><span>แชร์</span></div>
            <div class="r-btn"><i class="fas fa-ellipsis-v"></i><span>เพิ่มเติม</span></div>
          </div>
        </div>
      `;
    }

    container.innerHTML += `
      <div class="post-card">
        <div class="meta">${p.author} · ${p.date} · ${p.source}</div>
        <div class="title">${p.title}</div>
        ${mediaHtml}
        <div class="meta">${p.aspect} · พร้อมใช้งาน</div>
      </div>
    `;
  });

  document.getElementById('postCount').textContent = posts.length;
  
  // ผูกปุ่มเล่นวิดีโอ
  posts.forEach(p => {
    if (p.type === 'video' && p.videoUrl) {
      const vid = document.querySelector(`#vid-${p.id} video`);
      const ply = document.getElementById(`ply-${p.id}`);
      const container = document.getElementById(`vid-${p.id}`);
      
      if (vid && ply && container) {
        container.onclick = () => {
          if (vid.paused) {
            vid.muted = false;
            vid.play();
            ply.classList.add('hidden');
          } else {
            vid.pause();
            ply.classList.remove('hidden');
          }
        };
      }
    }
  });
}

function showStatus(text, duration = 2000) {
  const bar = document.getElementById('statusBar');
  bar.textContent = text;
  bar.classList.add('show');
  if (duration > 0) setTimeout(() => bar.classList.remove('show'), duration);
}

function shareThis() {
  const txt = `✅ Thaipodee Global Market
🔗 ลิงก์:
https://thaipodee-global-market-v2026-new.onrender.com/
📌 เปิดใน Chrome → กดจุด 3 → เพิ่มไปที่หน้าจอหลัก`;
  if (navigator.share) navigator.share({title: 'thaipodee', text: txt});
  else navigator.clipboard.writeText(txt).then(() => alert('คัดลอกแล้ว ✅'));
}

setTimeout(() => {
  document.getElementById('splash').classList.add('hide');
  loadPosts();
}, 1200);

document.querySelectorAll('[data-page]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(btn.dataset.page).classList.add('active');
    window.scrollTo(0, 0);
  });
});

document.getElementById('postBtn').addEventListener('click', async () => {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return alert('เลือกไฟล์ก่อนครับ');

  showStatus('กำลังเตรียมไฟล์...', 0);
  document.getElementById('progressBar').classList.add('show');

  let progress = 0;
  const fill = document.getElementById('progressFill');
  const timer = setInterval(() => {
    progress += Math.random() * 12;
    if (progress > 95) progress = 95;
    fill.style.width = progress + '%';
  }, 200);

  // แปลงไฟล์เป็นลิงก์ใช้งานได้
  const videoUrl = URL.createObjectURL(file);
  const isVideo = file.type.startsWith('video');

  setTimeout(() => {
    clearInterval(timer);
    fill.style.width = '100%';
    
    const now = new Date();
    const dateStr = `${now.getDate()} ก.ย. ${String(now.getFullYear()).slice(-2)}`;
    
    posts.unshift({
      id: Date.now(),
      title: file.name.replace(/\.[^/.]+$/, ''),
      author: 'thaipodee',
      date: dateStr,
      type: isVideo ? 'video' : 'image',
      aspect: '9:16',
      source: 'ต้นฉบับ',
      videoUrl: videoUrl
    });
    
    savePosts();
    renderPosts();
    showStatus('เผยแพร่สำเร็จ ✅ เล่นได้เลย!');
    
    setTimeout(() => {
      document.getElementById('progressBar').classList.remove('show');
      fill.style.width = '0%';
      document.getElementById('fileInput').value = '';
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('home').classList.add('active');
    }, 1000);
  }, 2000);
});
</script>
</body>
</html>
