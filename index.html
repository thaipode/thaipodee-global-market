<script>
// ===== 1. อัปโหลดไฟล์ขึ้นคลาวด์จริง =====
const CLOUD_STORAGE = {
  baseUrl: "https://thaipodee-global-market-v2026-new.onrender.com/uploads/",
  upload: async function(file) {
    const formData = new FormData();
    formData.append("file", file);
    
    try {
      const res = await fetch("/api/upload", {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      if (data.success) {
        return { success: true, url: this.baseUrl + data.filename };
      }
      return { success: false, error: "อัปโหลดไม่สำเร็จ" };
    } catch (err) {
      return { success: false, error: err.message };
    }
  }
};

// ===== 2. ซิงค์ข้อมูลผู้ใช้และสถิติ =====
const SYNC_DATA = {
  profile: {
    username: "ThaipodeeGlobalMarket",
    displayName: "Thaipodee Global Market",
    bio: "แพลตฟอร์มตลาดออนไลน์แห่งประเทศไทย",
    followers: 0,
    following: 0,
    likes: 0
  },
  
  saveProfile: function() {
    localStorage.setItem("tp_profile", JSON.stringify(this.profile));
    // ส่งไปคลาวด์ด้วย
    fetch("/api/profile", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(this.profile)
    });
  },
  
  loadProfile: function() {
    const local = localStorage.getItem("tp_profile");
    if (local) {
      this.profile = JSON.parse(local);
      this.renderProfile();
    }
    // ดึงข้อมูลล่าสุดจากคลาวด์
    fetch("/api/profile")
      .then(r => r.json())
      .then(data => {
        this.profile = { ...this.profile, ...data };
        localStorage.setItem("tp_profile", JSON.stringify(this.profile));
        this.renderProfile();
      });
  },
  
  renderProfile: function() {
    const el = document.getElementById("usernameDisplay");
    if (el) el.textContent = "@" + this.profile.username;
  }
};

// ===== 3. แชร์ลิงก์ให้เปิดได้ทุกเครื่อง =====
const SHARE_LINK = {
  create: function(postId) {
    const base = window.location.origin;
    return `${base}/post.html?id=${postId}`;
  },
  
  copy: function(postId) {
    const link = this.create(postId);
    navigator.clipboard.writeText(link)
      .then(() => alert("คัดลอกลิงก์เรียบร้อย:\n" + link))
      .catch(() => alert("คัดลอกไม่ได้ กรุณาลองใหม่"));
  },
  
  loadPostFromUrl: function() {
    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");
    if (postId) {
      fetch(`/api/post/${postId}`)
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            // แสดงโพสต์จากคลาวด์
            displayPost(data.post);
          }
        });
    }
  }
};

// ===== ช่วยแสดงโพสต์ =====
function displayPost(post) {
  const container = document.getElementById("videoContainer");
  if (!container) return;
  
  container.innerHTML = ""; // ล้างของเดิม
  
  if (post.type === "video") {
    const video = document.createElement("video");
    video.src = post.cloudUrl; // ใช้ลิงก์จากคลาวด์โดยตรง
    video.controls = true;
    video.autoplay = true;
    video.loop = true;
    container.appendChild(video);
  } else {
    const img = document.createElement("img");
    img.src = post.cloudUrl; // ใช้ลิงก์จากคลาวด์โดยตรง
    img.style.maxWidth = "100%";
    img.style.maxHeight = "100%";
    container.appendChild(img);
  }
  
  // อัปเดตชื่อ/คำอธิบาย
  const un = document.getElementById("usernameDisplay");
  if (un) un.textContent = "@" + post.username;
}

// ===== เริ่มทำงานเมื่อโหลดหน้า =====
document.addEventListener("DOMContentLoaded", function() {
  SYNC_DATA.loadProfile();
  SHARE_LINK.loadPostFromUrl();
  
  // เชื่อมปุ่มแชร์
  const shareBtn = document.getElementById("shareBtn");
  if (shareBtn) {
    shareBtn.addEventListener("click", function() {
      SHARE_LINK.copy("latest-post");
    });
  }
});
</script>
