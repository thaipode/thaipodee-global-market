   ThaiPodee v1067 — รอหน้าประตู เปิดเมื่อไหร่เข้าได้ทันที
   27 กันยายน 2569 15:15 น.
   --------------------------------------------------------------
   ✅ วิ่งไปยืนรอที่ประตูโฟลเดอร์ videos แล้ว
   ✅ เปิดประตูเมื่อไหร่ — เจอเลย โหลดเลย เล่นเลย
   ✅ ไม่ต้องแก้อะไรอีก รอวันเปิดประตู
   ✅ คนดูเปิดมา — เห็นเลย ไม่ต้องสอนอะไร
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, sans-serif;}
html,body{height:100%; overflow:hidden; background:#000; color:#fff;}

/* พื้นที่วิดีโอ */
.swiper{height:100vh; overflow-y:auto; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;}
.slide{height:100vh; scroll-snap-align:start; position:relative; display:flex; align-items:center; justify-content:center;}
video{width:100%; height:100%; object-fit:cover; background:#000;}
video::-webkit-media-controls{display:none;}

/* ข้อความรอ */
.status{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; padding:20px; line-height:1.8;}
.status h4{font-size:16px; margin-bottom:10px; color:#ffd700;}
.status p{font-size:13px; color:#aaa;}
.status .ready{color:#4cd137; font-weight:bold;}

/* ข้อมูลวิดีโอ */
.info{position:absolute; bottom:80px; left:16px; right:85px; z-index:10;}
.info h3{font-size:15px; margin-bottom:4px;}
.info p{font-size:13px; color:#ddd;}

/* ปุ่มด้านขวา */
.side{position:absolute; right:12px; bottom:100px; display:flex; flex-direction:column; gap:24px; align-items:center;}
.side-btn{display:flex; flex-direction:column; align-items:center; gap:4px;}
.side-icon{width:44px; height:44px; border-radius:50%; background:#222; display:flex; align-items:center; justify-content:center; font-size:20px;}
.side-txt{font-size:10px;}

/* แถบล่าง */
.nav{position:fixed; bottom:0; left:0; right:0; height:60px; background:#000; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #222; z-index:20;}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:#fff;}
.nav-icon{font-size:22px;}
.nav-add{background:#ff4757; padding:4px 16px; border-radius:6px;}
</style>
</head>
<body>

<div class="swiper" id="swiper">
  <div class="status" id="status">
    <h4>🚪 รอเปิดประตู...</h4>
    <p>ไปรออยู่ที่โฟลเดอร์ videos แล้ว</p>
    <p>เมื่อประตูเปิด — จะเข้าไปหาทันที</p>
  </div>
</div>

<nav class="nav">
  <div class="nav-item"><span class="nav-icon">🏠</span><span>หน้าแรก</span></div>
  <div class="nav-item"><span class="nav-icon">🔥</span><span>ฮิต</span></div>
  <div class="nav-item nav-add"><span class="nav-icon">+</span><span>อัปโหลด</span></div>
  <div class="nav-item"><span class="nav-icon">💬</span><span>ข้อความ</span></div>
  <div class="nav-item"><span class="nav-icon">👤</span><span>โปรไฟล์</span></div>
</nav>

<script>
// === ไปยืนรอหน้าประตูที่อยู่นี้ ===
const OWNER = 'thaipodee';
const REPO = 'thaipodee-global-market';
const FOLDER = 'videos'; // ประตูอยู่ตรงนี้
const BRANCHES = ['main', 'master']; // ลองทั้ง 2 ทาง

const swiper = document.getElementById('swiper');
const status = document.getElementById('status');

// === ตรวจประตูซ้ำไปเรื่อย ๆ รอจนเปิด ===
async function checkDoor() {
  for (const branch of BRANCHES) {
    try {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${branch}`;
      const res = await fetch(url);
      
      if (res.ok) {
        const files = await res.json();
        const videos = files.filter(f => /\.(mp4|webm|mov)$/i.test(f.name));
        
        if (videos.length === 0) {
          status.innerHTML = `
            <h4 class="ready">✅ ประตูเปิดแล้ว!</h4>
            <p>เจอห้องแล้ว ที่สาขา: ${branch}</p>
            <p>รอใส่วิดีโอเข้าไป...</p>
          `;
          setTimeout(checkDoor, 3000); // เช็คอีกที 3 วินาที
          return;
        }
        
        // เจอวิดีโอ — เข้าไปเลย!
        status.remove();
        showVideos(videos);
        return;
      }
    } catch {}
  }
  
  // ยังไม่เปิด — กลับมาตรวจอีก
  setTimeout(checkDoor, 5000);
}

// === แสดงวิดีโอเมื่อเข้าได้แล้ว ===
function showVideos(videos) {
  videos.forEach(v => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = `
      <video src="${v.download_url}" loop muted playsinline preload="auto"></video>
      <div class="info">
        <h3>${v.name.replace(/\.[^.]+$/, '')}</h3>
        <p>@thaipodee</p>
      </div>
      <div class="side">
        <div class="side-btn"><div class="side-icon">❤️</div><div class="side-txt">0</div></div>
        <div class="side-btn"><div class="side-icon">💬</div><div class="side-txt">0</div></div>
        <div class="side-btn"><div class="side-icon">⭐</div><div class="side-txt">บันทึก</div></div>
        <div class="side-btn"><div class="side-icon">↗️</div><div class="side-txt">แชร์</div></div>
        <div class="side-btn"><div class="side-icon">🎵</div><div class="side-txt">เสียง</div></div>
      </div>
    `;
    swiper.appendChild(slide);
  });

  // เล่นเองอัตโนมัติ
  const ob = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const vid = e.target.querySelector('video');
      if (e.isIntersecting) vid?.play().catch(()=>{});
      else vid?.pause();
    });
  }, {threshold: 0.6});

  document.querySelectorAll('.slide').forEach(s => ob.observe(s));
}

// === เริ่มยืนรอหน้าประตูทันที ===
checkDoor();
</script>
</body>
</html>
