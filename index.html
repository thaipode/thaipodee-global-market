<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
    }

    .app {
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .feed {
        flex: 1;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
    }

    .item {
        height: 100vh;
        position: relative;
        scroll-snap-align: start;
        background: #000;
    }

    .item-bg {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        inset: 0;
    }

    .item-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,.1) 0%, transparent 30%, transparent 70%, rgba(0,0,0,.5) 100%);
    }

    /* ข้อมูลซ้ายล่าง */
    .info {
        position: absolute;
        left: 16px;
        right: 90px;
        bottom: 100px;
        z-index: 10;
    }

    .info-user {
        font-weight: 700;
        font-size: 15px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .info-tag {
        background: #25f;
        color: #fff;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 11px;
    }

    .info-desc {
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 8px;
    }

    /* ❌ ซ่อนราคาและปุ่มใส่ตะกร้าหน้าแรก */
    .info-price,
    .info-btn {
        display: none !important;
    }

    /* ปุ่มขวา */
    .actions {
        position: absolute;
        right: 12px;
        bottom: 120px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        z-index: 10;
    }

    .action {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
    }

    .action-icon {
        font-size: 32px;
    }

    .action-num {
        font-size: 11px;
    }

    .music-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(45deg, #00c6ff, #ff0080);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: spin 3s linear infinite;
        font-size: 20px;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* ✅ เมนูล่างอยู่กับที่ ไม่หายไปไหน */
    .nav {
        position: relative;
        z-index: 9999;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 12px 0 34px;
        background: #000;
        border-top: 1px solid #222;
        min-height: 78px;
    }

    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        cursor: pointer;
        position: relative;
    }

    .nav-icon {
        font-size: 26px;
    }

    .nav-label {
        font-size: 11px;
        color: #888;
    }

    .nav-item.active .nav-label {
        color: #fff;
    }

    .nav-cart-badge {
        position: absolute;
        top: -2px;
        right: -8px;
        background: #f00;
        color: #fff;
        font-size: 10px;
        min-width: 16px;
        height: 16px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
    }

    .nav-add {
        width: 45px;
        height: 32px;
        background: #fff;
        border-radius: 8px;
        position: relative;
    }

    .nav-add::before,
    .nav-add::after {
        content: '';
        position: absolute;
        background: #000;
    }

    .nav-add::before {
        width: 18px;
        height: 2px;
        top: 15px;
        left: 13px;
    }

    .nav-add::after {
        width: 2px;
        height: 18px;
        left: 21px;
        top: 7px;
    }

    /* ซ่อนหน้าอื่นๆ */
    .page {
        display: none;
        position: absolute;
        inset: 0;
        background: #000;
        z-index: 30;
        padding: 20px;
        overflow-y: auto;
    }

    .page.show {
        display: block;
    }

    .page-title {
        font-size: 22px;
        font-weight: 700;
        margin: 40px 0 20px;
    }

    .page-close {
        position: absolute;
        top: 40px;
        right: 20px;
        font-size: 24px;
        cursor: pointer;
    }

    input,
    textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 8px;
        border: none;
        background: #222;
        color: #fff;
        font-size: 16px;
    }

    button {
        cursor: pointer;
    }
</style>
