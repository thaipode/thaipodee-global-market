<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="application-name" content="ThaiPodee">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<meta name="description" content="ThaiPodee — แอปวิดีโอไทย">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/png" sizes="512x512" href="thaipodee_logo.png">
<title>ThaiPodee</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
body{background:#000;color:#fff;height:100vh;overflow:hidden;}
.page{position:absolute;inset:0;display:none;flex-direction:column;}
.page.active{display:flex;}
.main-page{z-index:1;}
.profile-page{z-index:2;background:#000;padding:15px;overflow-y:auto;}
.back-btn{background:transparent;color:#fff;border:none;font-size:16px;padding:10px 0;cursor:pointer;display:flex;align-items:center;gap:5px;margin-bottom:10px;}
.status-bar{font-size:12px;text-align:center;padding:6px;margin-bottom:8px;border-radius:4px;color:#90EE90;}
.video-area{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:#000;width:100%;overflow:hidden;}
.play-box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;}
.play-box.hidden{display:none;}
.play-icon{font-size:64px;color:#fff;margin-bottom:12px;cursor:pointer;}
.play-text{font-size:15px;color:#888;margin-bottom:20px;line-height:1.6;text-align:center;padding:0 20px;}
.video-player{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:100%;object-fit:contain;z-index:1;display:none;}
.video-player.active{display:block;}
.upload-btn{background:#ff2e44;color:#fff;border:none;padding:12px 24px;border-radius:25px;font-size:15px;cursor:pointer;}
.upload-input{display:none;}

/* ===== ไอคอนด้านขวา 6 ตัว ตรงรูป ===== */
.right-bar{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:28px;align-items:center;z-index:10;}
.side-btn{border:none;background:transparent;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.side-icon{font-size:26px;line-height:1;}
.side-num{font-size:11px;color:#fff;min-height:14px;}

/* ===== แถบล่าง 5 ปุ่ม ตรงรูป ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#000;display:flex;justify-content:space-around;align-items:center;padding:0 8px;border-top:1px solid #222;z-index:10;}
.nav-btn{border:none;background:transparent;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nav-icon{font-size:22px;}
.nav-label{font-size:10px;color:#aaa;}
.nav-btn.active .nav-label{color:#fff;}
.plus-center{width:46px;height:34px;background:#ff2e44;border-radius:8px;font-size:24px;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center;}

.profile-header{text-align:center;margin-bottom:25px;padding-bottom:20px;border-bottom:1px solid #222;}
.avatar-large{width:90px;height:90px;border-radius:50%;border:3px solid #fff;margin:0 auto 12px;overflow:hidden;cursor:pointer;background:#333;display:flex;align-items:center;justify-content:center;font-size:40px;}
.profile-name{font-size:20px;font-weight:bold;margin-bottom:8px;}
.edit-name-input{background:#222;border:1px solid #444;color:#fff;padding:8px 12px;border-radius:8px;font-size:16px;text-align:center;width:220px;margin-bottom:10px;display:none;}
.btn{background:#ff2e44;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer;margin:4px;}
.video-list{display:flex;flex-direction:column;gap:12px;}
.video-item{display:flex;align-items:center;gap:12px;padding:12px;background:#1a1a1a;border-radius:10px;cursor:pointer;}
.video-thumb{width:80px;height:45px;background:#333;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background-size:cover;background-position:center;}
.video-info{flex:1;}
.video-title{font-size:14px;margin-bottom:2px;}
.video-meta{font-size:11px;color:#888;}
.delete-btn{background:#cc0000;color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;}
.empty-text{text-align:center;color:#666;padding:40px 20px;}
.loading-text{color:#60a5fa;font-size:13px;margin-top:10px;}
.video-info-overlay{position:absolute;bottom:75px;left:12px;right:80px;z-index:5;pointer-events:none;}
.video-author{font-weight:bold;font-size:14px;margin-bottom:2px;}
.video-desc{font-size:13px;color:#eee;}
.progress-bar{width:100%;height:4px;background:#333;border-radius:2px;margin-top:8px;overflow:hidden;display:none;max-width:280px;}
.progress-fill{height:100%;background:#ff2e44;width:0%;transition:width 0.3s;}
</style>
</head>
<body>

<div class="page main-page active" id="pageMain">
  <div class="status-bar" id="statusBar">กำลังเชื่อมต่อผู้ใช้ ThaiPodee</div>
  
  <div class="video-area" id="videoArea">
    <div class="play-box" id="playBox">
      <p class="play-text">ยินดีต้อนรับสู่ ThaiPodee<br>เลือกวิดีโอเพื่อเริ่มใช้งาน</p>
      <button class="upload-btn" id="btnUpload">📂 เลือกวิดีโอจากเครื่อง</button>
      <input type="file" class="upload-input" id="fileInput" accept="video/*">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="loading-text" id="loadingText" style="display:none;">กำลังส่งขึ้นที่เก็บกลาง...</p>
    </div>
    
    <video class="video-player" id="videoPlayer" controls playsinline preload="auto" loop muted></video>
    
    <div class="video-info-overlay" id="videoOverlay" style="display:none;">
      <div class="video-author" id="currAuthor">@ผู้ใช้ ThaiPodee</div>
      <div class="video-desc" id="currDesc"></div>
    </div>
  </div>

  <!-- ===== ไอคอนขวา 6 ตัว ตรงรูป ===== -->
  <div class="right-bar">
    <button class="side-btn" id="btnAvatar"><span class="side-icon">👤</span></button>
    <button class="side-btn" id="btnLike"><span class="side-icon">🤍</span><span class="side-num" id="numLike">0</span></button>
    <button class="side-btn" id="btnComment"><span class="side-icon">💬</span><span class="side-num" id="numComment">0</span></button>
    <button class="side-btn" id="btnSave"><span class="side-icon">🔖</span><span class="side-num" id="numSave">0</span></button>
    <button class="side-btn" id="btnShare"><span class="side-icon">↗️</span><span class="side-num" id="numShare">0</span></button>
    <button class="side-btn" id="btnMusic"><span class="side-icon">🎵</span><span class="side-num" id="numMusic"></span></button>
  </div>

  <!-- ===== แถบล่าง 5 ปุ่ม ตรงรูป ===== -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="Main"><span class="nav-icon">🏠</span><span class="nav-label">หน้าแรก</span></button>
    <button class="nav-btn" data-page="Shop"><span class="nav-icon">🛍️</span><span class="nav-label">ร้านค้า</span></button>
    <button class="nav-btn" data-page="Upload"><span class="plus-center">+</span></button>
    <button class="nav-btn" data-page="Messages"><span class="nav-icon">💬</span><span class="nav-label">ข้อความ</span></button>
    <button class="nav-btn" data-page="Profile"><span class="nav-icon">👤</span><span class="nav-label">โปรไฟล์</span></button>
  </nav>
</div>

<div class="page profile-page" id="pageProfile">
  <button class="back-btn" id="btnBack">◀ กลับ</button>
  <div class="profile-header">
    <div class="avatar-large" id="avatarLarge"><span id="avatarPlaceholder">👤</span></div>
    <h2 class="profile-name" id="profileName">ผู้ใช้ ThaiPodee</h2>
    <input type="text" class="edit-name-input" id="editNameInput" placeholder="พิมพ์ชื่อของคุณ">
    <div>
      <button class="btn" id="btnEditName">✏️ เปลี่ยนชื่อ</button>
      <button class="btn" id="btnSaveName" style="display:none;">✅ บันทึก</button>
    </div>
    <p style="font-size:11px;color:#666;margin-top:8px;">รหัสผู้ใช้: 1000054316</p>
  </div>
  <h3 style="font-size:18px;font-weight:bold;margin-bottom:15px;">วิดีโอทั้งหมด <span id="postCount">(0)</span></h3>
  <div class="video-list" id="videoList">
    <p class="empty-text">ยังไม่มีวิดีโอ — กด + เพื่อโพสต์</p>
  </div>
</div>

<script>
// ==============================================================
// 🔑 v1061 — คีย์ตรง + ไอคอนครบ + วิดีโอตรงกลางจอ
// ==============================================================
const JSONBIN_API_KEY = '$2a$10$5XfCSwqLcQvkEU0skpcNZ.USLuU8TgId..q5WMsnlZcSAlYaQPhmO';
const JSONBIN_BIN_NAME = 'thaipodee-v1061';
const JSONBIN_URL = 'https://api.jsonbin.io/v3/b';

const STORAGE_KEY = 'thaipodee_cloud_v1061';
const PROFILE_KEY = 'thaipodee_profile_v1061';
const SYNC_CHANNEL = new BroadcastChannel('thaipodee_sync_v1061');

let allPosts = [];
let myProfile = { id: 'u_1000054316', name: 'ผู้ใช้ ThaiPodee', avatar: null };
let currentIndex = -1;
let binId = null;

// === ค้นหาหรือสร้างกล่องเก็บข้อมูล ===
async function getOrCreateBin() {
  try {
    const res = await fetch(`${JSONBIN_URL}?name=${encodeURIComponent(JSONBIN_BIN_NAME)}`, {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0) {
      binId = data[0].id;
      return true;
    }
  } catch (e) { console.log('สร้างกล่องใหม่'); }
  
  try {
    const res = await fetch(JSONBIN_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY,
        'X-Bin-Name': JSONBIN_BIN_NAME
      },
      body: JSON.stringify({ posts: [], created: Date.now() })
    });
    const data = await res.json();
    if (data.id) { binId = data.id; return true; }
  } catch (e) { console.log('ใช้เฉพาะในเครื่อง'); }
  return false;
}

// === โหลดข้อมูล ===
async function loadFromCloud() {
  const hasBin = await getOrCreateBin();
  if (!hasBin) {
    loadFromLocal();
    return;
  }
  
  try {
    const res = await fetch(`${JSONBIN_URL}/${binId}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    if (res.ok) {
      const data = await res.json();
      if (data.record?.posts) allPosts = data.record.posts;
    }
  } catch (e) { loadFromLocal(); return; }
  
  renderVideoList();
  renderProfile();
}

function loadFromLocal() {
  const saved = localStorage.getItem(STORAGE_KEY);
  const prof = localStorage.getItem(PROFILE_KEY);
  if (saved) allPosts = JSON.parse(saved);
  if (prof) myProfile = JSON.parse(prof);
  renderProfile();
  renderVideoList();
}

// === บันทึกขึ้นคลาวด์ ===
async function saveToCloud() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(allPosts));
  localStorage.setItem(PROFILE_KEY, JSON.stringify(myProfile));
  if (!binId) return;
  
  try {
    await fetch(`${JSONBIN_URL}/${binId}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify({ posts: allPosts, updated: Date.now() })
    });
  } catch (e) { console.log('บันทึกสำเร็จในเครื่อง'); }
  SYNC_CHANNEL.postMessage({ type: 'SYNC' });
}

SYNC_CHANNEL.onmessage = () => loadFromCloud();
window.addEventListener('storage', e => {
  if (e.key === STORAGE_KEY || e.key === PROFILE_KEY) loadFromCloud();
});

function renderProfile() {
  document.getElementById('profileName').textContent = myProfile.name;
}

function renderVideoList() {
  const list = document.getElementById('videoList');
  document.getElementById('postCount').textContent = `(${allPosts.length})`;
  
  if (allPosts.length === 0) {
    list.innerHTML = '<p class="empty-text">ยังไม่มีวิดีโอ — กด + เพื่อโพสต์</p>';
    return;
  }
  
  list.innerHTML = '';
  [...allPosts].reverse().forEach((post, dispIdx) => {
    const realIdx = allPosts.length - 1 - dispIdx;
    const isMine = post.authorId === myProfile.id;
    
    const el = document.createElement('div');
    el.className = 'video-item';
    el.style.borderLeft = isMine ? '3px solid #ff2e44' : '3px solid #444';
    el.innerHTML = `
      <div class="video-thumb" style="background-image:${post.thumb ? `url(${post.thumb})` : 'none'}">▶</div>
      <div class="video-info">
        <div class="video-title">${post.name}</div>
        <div class="video-meta">${post.date} — ${post.authorName} ${isMine ? '(คุณ)' : ''}</div>
      </div>
      ${isMine ? `<button class="delete-btn" data-idx="${realIdx}">🗑️</button>` : ''}
    `;
    el.onclick = () => { showPage('main'); playVideoAt(realIdx); };
    if (isMine) el.querySelector('.delete-btn').onclick = e => {
      e.stopPropagation();
      if (confirm('ลบวิดีโอนี้?')) {
        allPosts.splice(realIdx, 1);
        saveToCloud();
        renderVideoList();
        if (currentIndex === realIdx) resetVideo();
      }
    };
    list.appendChild(el);
  });
}

function resetVideo() {
  document.getElementById('videoPlayer').classList.remove('active');
  document.getElementById('playBox').classList.remove('hidden');
  document.getElementById('videoOverlay').style.display = 'none';
  document.getElementById('videoPlayer').src = '';
  currentIndex = -1;
}

function playVideoAt(idx) {
  const post = allPosts[idx];
  if (!post) return;
  
  currentIndex = idx;
  const player = document.getElementById('videoPlayer');
  
  document.getElementById('currAuthor').textContent = '@' + post.authorName;
  document.getElementById('currDesc').textContent = post.name;
  document.getElementById('videoOverlay').style.display = 'block';
  document.getElementById('playBox').classList.add('hidden');
  
  player.src = post.localUrl;
  player.classList.add('active');
  player.load();
  player.play().catch(() => { player.muted = true; player.play(); });
  
  // อัปเดตตัวเลข
  document.getElementById('numLike').textContent = post.likes || 0;
  document.getElementById('numComment').textContent = post.comments || 0;
  document.getElementById('numShare').textContent = post.shares || 0;
}

// === อัปโหลดวิดีโอใหม่ ===
document.getElementById('fileInput').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  
  document.getElementById('loadingText').style.display = 'block';
  document.getElementById('progressBar').style.display = 'block';
  
  let progress = 0;
  const fill = document.getElementById('progressFill');
  const interval = setInterval(() => {
    progress = Math.min(95, progress + Math.random() * 12);
    fill.style.width = progress + '%';
  }, 200);
  
  const localUrl = URL.createObjectURL(file);
  
  // สร้างรูปหน้าปก
  const video = document.createElement('video');
  video.src = localUrl;
  video.preload = 'metadata';
  await new Promise(r => { video.onloadedmetadata = r; });
  video.currentTime = Math.min(1, video.duration / 3);
  await new Promise(r => { video.onseeked = r; });
  
  const c = document.createElement('canvas');
  c.width = 160; c.height = 90;
  const ctx = c.getContext('2d');
  ctx.drawImage(video, 0, 0, 160, 90);
  const thumb = c.toDataURL('image/png');
  
  const now = new Date();
  const dateStr = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  
  allPosts.push({
    id: Date.now(),
    name: file.name.replace(/\.[^/.]+$/, ''),
    date: dateStr,
    authorName: myProfile.name,
    authorId: myProfile.id,
    localUrl: localUrl,
    thumb: thumb,
    likes: 0, comments: 0, shares: 0
  });
  
  clearInterval(interval);
  fill.style.width = '100%';
  
  await saveToCloud();
  renderVideoList();
  playVideoAt(allPosts.length - 1);
  
  document.getElementById('loadingText').style.display = 'none';
  document.getElementById('progressBar').style.display = 'none';
  fill.style.width = '0%';
  e.target.value = '';
};

// === กดถูกใจ ===
document.getElementById('btnLike').onclick = () => {
  if (currentIndex === -1) return;
  allPosts[currentIndex].likes = (allPosts[currentIndex].likes || 0) + 1;
  document.getElementById('numLike').textContent = allPosts[currentIndex].likes;
  saveToCloud();
};

// === แชร์ ===
document.getElementById('btnShare').onclick = () => {
  if (currentIndex === -1) return;
  allPosts[currentIndex].shares = (allPosts[currentIndex].shares || 0) + 1;
  document.getElementById('numShare').textContent = allPosts[currentIndex].shares;
  saveToCloud();
  const url = window.location.href;
  if (navigator.share) navigator.share({title: 'ThaiPodee', url});
  else { navigator.clipboard.writeText(url); alert('คัดลอกลิงก์แล้ว ✅ ส่งให้เพื่อนได้เลย'); }
};

// === เปลี่ยนหน้า ===
function showPage(name) {
  const main = document.getElementById('pageMain');
  const prof = document.getElementById('pageProfile');
  if (name === 'main') {
    main.classList.add('active'); prof.classList.remove('active');
    document.querySelectorAll('.nav-btn')[0].classList.add('active');
    document.querySelectorAll('.nav-btn')[4].classList.remove('active');
  } else {
    main.classList.remove('active'); prof.classList.add('active');
    document.querySelectorAll('.nav-btn')[0].classList.remove('active');
    document.querySelectorAll('.nav-btn')[4].classList.add('active');
  }
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => {
    const page = btn.dataset.page;
    if (page === 'Main') showPage('main');
    else if (page === 'Profile') showPage('profile');
    else if (page === 'Upload') document.getElementById('fileInput').click();
  };
});
document.getElementById('btnBack').onclick = () => showPage('main');
document.getElementById('btnUpload').onclick = () => document.getElementById('fileInput').click();

// === เปลี่ยนชื่อ ===
document.getElementById('btnEditName').onclick = () => {
  document.getElementById('profileName').style.display = 'none';
  document.getElementById('editNameInput').style.display = 'block';
  document.getElementById('btnEditName').style.display = 'none';
  document.getElementById('btnSaveName').style.display = 'inline-block';
  document.getElementById('editNameInput').value = myProfile.name;
};
document.getElementById('btnSaveName').onclick = () => {
  myProfile.name = document.getElementById('editNameInput').value.trim() || 'ผู้ใช้ ThaiPodee';
  saveToCloud();
  renderProfile();
  document.getElementById('editNameInput').style.display = 'none';
  document.getElementById('btnSaveName').style.display = 'none';
  document.getElementById('profileName').style.display = 'block';
  document.getElementById('btnEditName').style.display = 'inline-block';
};

window.onload = loadFromCloud;
</script>
</body>
</html>
