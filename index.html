   อ้างอิงจาก: v1024
   --------------------------------------------------------------
   ✅ กดปุ่มโปรไฟล์ → เปิดหน้าประวัติ
   ✅ แสดงรายการวิดีโอที่อัปโหลดทั้งหมด
   ✅ กดที่รายการ → เล่นวิดีโอนั้น
   ✅ ส่วนอื่นเหมือน v1024 ทุกประการ ไม่แก้

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ThaiPodee</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #000000; color: #ffffff; height: 100vh; overflow: hidden; }

/* ===== หน้าหลัก ===== */
.page { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; }
.page.active { display: flex; }
.main-page { z-index: 1; }
.profile-page { z-index: 2; background: #000; padding: 15px; overflow-y: auto; }

/* ===== ปุ่มย้อนกลับ ===== */
.back-btn {
  background: transparent; color: #fff; border: none; font-size: 16px; padding: 10px 0; cursor: pointer;
  display: flex; align-items: center; gap: 5px; margin-bottom: 10px;
}

/* ===== รายการวิดีโอในโปรไฟล์ ===== */
.profile-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
.video-list { display: flex; flex-direction: column; gap: 12px; }
.video-item {
  display: flex; align-items: center; gap: 12px; padding: 12px; background: #1a1a1a; border-radius: 10px; cursor: pointer;
}
.video-item-thumb {
  width: 80px; height: 45px; background: #333; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.video-item-info { flex: 1; }
.video-item-name { font-size: 14px; margin-bottom: 2px; }
.video-item-date { font-size: 11px; color: #888; }
.empty-text { text-align: center; color: #666; padding: 40px 20px; }

/* ===== พื้นที่วิดีโอ — เหมือนเดิม ===== */
.video-area {
  position: relative; flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #000;
}
.play-box { text-align: center; width: 100%; max-width: 100%; padding: 10px; }
.play-icon { font-size: 64px; color: #ffffff; margin-bottom: 12px; }
.play-text { font-size: 15px; color: #888888; margin-bottom: 20px; }
.playing .play-icon { color: #ff2442; }
.video-player { max-width: 100%; max-height: 60vh; border-radius: 8px; display: none; }
.has-video .play-box { display: none; }
.has-video .video-player { display: block; margin: 0 auto; }
.upload-btn {
  background: #ff2442; color: #fff; border: none; padding: 10px 20px; border-radius: 25px; font-size: 14px; cursor: pointer; margin-top: 10px;
}
.upload-input { display: none; }

/* ===== ไอคอนด้านขวา 6 ตัว — เหมือนเดิม ===== */
.right-bar {
  position: fixed;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 28px;
  align-items: center;
  z-index: 5;
}
.side-btn {
  border: none; background: transparent; color: #fff; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.side-icon { font-size: 26px; line-height: 1; }
.side-num { font-size: 11px; color: #fff; min-height: 14px; }
.avatar-wrap { position: relative; width: 44px; height: 44px; }
.avatar-circle {
  width: 44px; height: 44px; border-radius: 50%;
  background: #333; display: flex; align-items: center; justify-content: center;
  font-size: 22px; border: 2px solid #fff;
}
.plus-red {
  position: absolute; bottom: -3px; right: -3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #ff2442; color: #fff; font-size: 13px; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #000; line-height: 1;
}

/* ===== แถบล่าง 5 ปุ่ม — เหมือนเดิม ===== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0; height: 60px;
  background: #000; display: flex; justify-content: space-around; align-items: center;
  border-top: 1px solid #222; z-index: 5;
}
.nav-btn {
  border: none; background: transparent; color: #fff; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.nav-icon { font-size: 22px; }
.nav-label { font-size: 10px; color: #aaa; }
.nav-btn.active .nav-label { color: #fff; }
.plus-center {
  width: 46px; height: 34px; background: #ff2442; border-radius: 8px;
  font-size: 24px; font-weight: bold; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>

<!-- ===== หน้าหลัก ===== -->
<div class="page main-page active" id="mainPage">
  <div class="video-area" id="videoArea">
    <div class="play-box" id="playBox">
      <div class="play-icon" id="playIcon">▶</div>
      <p class="play-text" id="playText">กดเพื่อเลือกวิดีโอ</p>
      <button class="upload-btn" id="uploadBtn">📂 เลือกวิดีโอจากเครื่อง</button>
      <input type="file" class="upload-input" id="uploadInput" accept="video/*">
    </div>
    <video class="video-player" id="videoPlayer" controls playsinline></video>
  </div>

  <div class="right-bar">
    <button class="side-btn" id="btnAvatar">
      <div class="avatar-wrap">
        <div class="avatar-circle">👤</div>
        <div class="plus-red">+</div>
      </div>
    </button>
    <button class="side-btn" id="btnLike">
      <span class="side-icon" id="likeIcon">🤍</span>
      <span class="side-num" id="likeNum">0</span>
    </button>
    <button class="side-btn" id="btnComment">
      <span class="side-icon">💬</span>
      <span class="side-num" id="commentNum">0</span>
    </button>
    <button class="side-btn" id="btnSave">
      <span class="side-icon">🔖</span>
      <span class="side-num" id="saveNum">0</span>
    </button>
    <button class="side-btn" id="btnShare">
      <span class="side-icon">↗️</span>
      <span class="side-num" id="shareNum">0</span>
    </button>
    <button class="side-btn" id="btnMusic">
      <span class="side-icon">🎵</span>
    </button>
  </div>
</div>

<!-- ===== หน้าโปรไฟล์ ประวัติวิดีโอ ===== -->
<div class="page profile-page" id="profilePage">
  <button class="back-btn" id="backBtn">◀ กลับ</button>
  <h2 class="profile-title">วิดีโอที่บันทึกไว้</h2>
  <div class="video-list" id="videoList">
    <p class="empty-text" id="emptyText">ยังไม่มีวิดีโอที่บันทึก</p>
  </div>
</div>

<!-- แถบล่าง -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="navHome">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">หน้าหลัก</span>
  </button>
  <button class="nav-btn" id="navShop">
    <span class="nav-icon">🛍️</span>
    <span class="nav-label">ร้านค้า</span>
  </button>
  <button class="nav-btn" id="navAdd">
    <span class="plus-center">+</span>
  </button>
  <button class="nav-btn" id="navMsg">
    <span class="nav-icon">💬</span>
    <span class="nav-label">ข้อความ</span>
  </button>
  <button class="nav-btn" id="navProfile">
    <span class="nav-icon">👤</span>
    <span class="nav-label">โปรไฟล์</span>
  </button>
</nav>

<script>
let isPlaying = false;
let liked = false, likeCount = 0;
let commentCount = 0, saveCount = 0, shareCount = 0;
let savedVideos = JSON.parse(localStorage.getItem('thaipodeeVideoList') || '[]');

const mainPage = document.getElementById('mainPage');
const profilePage = document.getElementById('profilePage');
const videoArea = document.getElementById('videoArea');
const videoPlayer = document.getElementById('videoPlayer');
const uploadInput = document.getElementById('uploadInput');
const uploadBtn = document.getElementById('uploadBtn');
const videoList = document.getElementById('videoList');
const emptyText = document.getElementById('emptyText');

// ===== แสดงรายการวิดีโอในโปรไฟล์ =====
function renderVideoList() {
  videoList.innerHTML = '';
  if (savedVideos.length === 0) {
    videoList.innerHTML = '<p class="empty-text">ยังไม่มีวิดีโอที่บันทึก</p>';
    return;
  }
  savedVideos.forEach((vid, idx) => {
    const item = document.createElement('div');
    item.className = 'video-item';
    item.innerHTML = `
      <div class="video-item-thumb">▶</div>
      <div class="video-item-info">
        <div class="video-item-name">วิดีโอ #${idx + 1}</div>
        <div class="video-item-date">${vid.date}</div>
      </div>
    `;
    item.onclick = () => playSelectedVideo(idx);
    videoList.appendChild(item);
  });
}

// ===== เล่นวิดีโอที่กดจากรายการ =====
function playSelectedVideo(index) {
  const vid = savedVideos[index];
  if (!vid) return;
  videoPlayer.src = vid.url;
  videoArea.classList.add('has-video');
  showPage('main');
}

// ===== เปลี่ยนหน้า =====
function showPage(page) {
  mainPage.classList.toggle('active', page === 'main');
  profilePage.classList.toggle('active', page === 'profile');
}

// ===== โหลดรายการเมื่อเข้า =====
document.getElementById('navProfile').addEventListener('click', () => {
  renderVideoList();
  showPage('profile');
  setActiveNav('navProfile');
});

document.getElementById('backBtn').addEventListener('click', () => {
  showPage('main');
  setActiveNav('navHome');
});

// ===== โหลดวิดีโอล่าสุด =====
window.addEventListener('load', () => {
  if (savedVideos.length > 0) {
    videoPlayer.src = savedVideos[savedVideos.length - 1].url;
    videoArea.classList.add('has-video');
  }
});

// ===== เลือกไฟล์ใหม่ =====
uploadBtn.addEventListener('click', () => uploadInput.click());
uploadInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const now = new Date();
  const dateStr = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  
  // เพิ่มลงรายการ
  savedVideos.push({ url, date: dateStr, name: file.name });
  localStorage.setItem('thaipodeeVideoList', JSON.stringify(savedVideos));
  
  // แสดงทันที
  videoPlayer.src = url;
  videoArea.classList.add('has-video');
});

// ===== กดเล่น/หยุด =====
videoArea.addEventListener('click', (e) => {
  if (e.target === uploadBtn || e.target === uploadInput) return;
  if (!videoPlayer.src) return;
  if (videoPlayer.paused) { videoPlayer.play(); isPlaying = true; videoArea.classList.add('playing'); }
  else { videoPlayer.pause(); isPlaying = false; videoArea.classList.remove('playing'); }
});

// ===== ปุ่มขวา =====
document.getElementById('btnLike').onclick = () => {
  liked = !liked; likeCount += liked ? 1 : -1;
  document.getElementById('likeNum').textContent = likeCount;
  document.getElementById('likeIcon').textContent = liked ? '❤️' : '🤍';
};
document.getElementById('btnComment').onclick = () => { commentCount++; document.getElementById('commentNum').textContent = commentCount; };
document.getElementById('btnSave').onclick = () => { saveCount++; document.getElementById('saveNum').textContent = saveCount; };
document.getElementById('btnShare').onclick = () => { shareCount++; document.getElementById('shareNum').textContent = shareCount; };
document.getElementById('btnMusic').onclick = () => alert('เปลี่ยนเพลงประกอบ');
document.getElementById('btnAvatar').onclick = () => alert('เปลี่ยนรูปโปรไฟล์');

// ===== แถบล่าง =====
function setActiveNav(id) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.getElementById('navHome').onclick = () => { showPage('main'); setActiveNav('navHome'); };
document.getElementById('navShop').onclick = () => setActiveNav('navShop');
document.getElementById('navAdd').onclick = () => alert('เพิ่มโพสต์วิดีโอ');
document.getElementById('navMsg').onclick = () => setActiveNav('navMsg');
</script>

</body>
</html>
