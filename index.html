<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThaiPodee Market</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cloudinary-core/4.1.0/cloudinary-core-shrinkwrap.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        html, body { height: 100dvh; width: 100vw; overflow: hidden; background: #000; color: #fff; }
        
        .page { display: none; position: absolute; inset: 0; width: 100vw; height: 100dvh; overflow: hidden; }
        .page.active { display: block; }

        /* ฟีดหลัก */
        .feed-container { position: absolute; inset: 0; overflow: hidden; }
        .feed-slider { transition: transform 0.4s ease-out; height: 100%; }
        .post-slide { 
            position: relative; 
            width: 100vw; 
            height: 100dvh; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        /* แสดงรูป/วิดีโอ เต็มจอ */
        .media-area { 
            width: 100vw; height: 100dvh; 
            display: flex; align-items: center; justify-content: center; 
            background: #000;
        }
        .media-area img, .media-area video { 
            max-width: 100vw; max-height: 100dvh; 
            width: auto; height: auto; 
            object-fit: contain; background: #000;
        }

        .empty-state { 
            text-align: center; padding-top: 50vh; 
            color: #888; line-height: 2; font-size: 16px;
        }

        /* ข้อมูลด้านซ้ายล่าง */
        .info-left { 
            position: absolute; left: 16px; bottom: 90px; right: 90px; z-index: 10;
        }
        .acc-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .desc-text { font-size: 13px; color: #ddd; margin-bottom: 4px; }
        .music-row { font-size: 12px; color: #bbb; margin-top: 6px; }

        /* เมนูด้านขวา */
        .menu-right { 
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%); 
            display: flex; flex-direction: column; gap: 24px; align-items: center; z-index: 20;
        }
        .menu-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .avatar { 
            width: 48px; height: 48px; border-radius: 50%; 
            background: linear-gradient(135deg, #f5a623, #f76b1c); 
            border: 2px solid #fff; margin-bottom: 4px;
        }
        .icon { font-size: 28px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
        .num { font-size: 11px; margin-top: 2px; }

        /* หน้าโปรไฟล์ */
        .profile-page { background: #000; overflow-y: auto; padding-bottom: 80px; }
        .profile-header { padding: 40px 20px 20px; text-align: center; }
        .profile-avatar { 
            width: 90px; height: 90px; border-radius: 50%; 
            background: linear-gradient(135deg, #f5a623, #f76b1c); 
            border: 3px solid #fff; margin: 0 auto 12px;
        }
        .profile-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .profile-username { color: #888; margin-bottom: 20px; }
        .profile-stats { display: flex; justify-content: center; gap: 40px; margin-bottom: 20px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 20px; font-weight: 700; }
        .stat-label { font-size: 11px; color: #888; margin-top: 2px; }
        .posts-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 0 2px;
        }
        .grid-item { 
            aspect-ratio: 1; overflow: hidden; background: #1a1a1a; cursor: pointer;
        }
        .grid-item img, .grid-item video { 
            width: 100%; height: 100%; object-fit: cover;
        }
        .empty-grid { 
            grid-column: 1 / -1; text-align: center; padding: 60px 20px; 
            color: #666; line-height: 1.8;
        }

        /* หน้าเลือกเสียง */
        .sound-page { background: #000; padding: 16px; min-height: 100dvh; }
        .sound-header { 
            display: flex; align-items: center; justify-content: space-between; 
            margin-bottom: 30px; padding-top: 10px;
        }
        .back-btn { font-size: 22px; cursor: pointer; padding: 8px; }
        .sound-title { font-size: 18px; font-weight: 600; }
        .section-title { 
            font-size: 15px; font-weight: 600; margin: 20px 0 12px; color: #aaa;
        }
        .local-area { 
            background: #1a1a2e; border-radius: 12px; padding: 18px; 
            display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 16px;
        }
        .hidden-input { display: none; }
        .audio-name { font-size: 13px; color: #888; margin-top: 4px; }
        .post-btn { 
            background: #ff2442; color: #fff; border: none; padding: 16px; 
            border-radius: 25px; font-size: 16px; width: 100%; 
            font-weight: 700; cursor: pointer; margin-top: 20px;
        }
        .post-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { 
            margin-top: 12px; font-size: 13px; text-align: center; 
            min-height: 40px; line-height: 1.5;
        }
        .status.warn { color: #facc15; }
        .status.ok { color: #4ade80; }

        /* ============================================== */
        /* ✅ ปุ่มเมนูล่าง — คงที่เสมอ ไม่หาย */
        /* ============================================== */
        .nav-bottom { 
            position: absolute; bottom: 0; left: 0; right: 0; 
            height: 70px; display: flex; justify-content: space-around; 
            align-items: center; padding: 8px 10px 20px; 
            background: #000; border-top: 1px solid #222; 
            z-index: 9999; /* แน่นอนที่สุด ไม่มีอะไรบัง */
        }
        .nav-col { 
            display: flex; flex-direction: column; align-items: center; 
            gap: 2px; min-width: 60px; cursor: pointer;
        }
        .nav-col.active .nav-label { color: #fff; font-weight: 600; }
        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 10px; color: #888; }

        /* ✅ ปุ่ม + กลางล่าง — คงที่ ไม่หาย */
        .upload-col { position: relative; display: flex; align-items: center; justify-content: center; }
        .upload-box { 
            width: 50px; height: 35px; background: #fff; border-radius: 6px; 
            position: relative; cursor: pointer; z-index: 10000;
        }
        .upload-box::before, .upload-box::after { 
            content: ''; position: absolute; background: #000;
        }
        .upload-box::before { 
            width: 22px; height: 2px; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .upload-box::after { 
            width: 2px; height: 22px; left: 50%; top: 50%; transform: translate(-50%, -50%);
        }
        .file-input { 
            position: absolute; inset: 0; opacity: 0; cursor: pointer; 
            z-index: 10001; /* กดได้แน่นอน */
        }
    </style>
</head>
<body>

<!-- หน้าแรก -->
<div id="page-feed" class="page active">
    <div class="feed-container">
        <div class="feed-slider" id="feed-slider">
            <div class="empty-state">
                ☁️ กดปุ่ม + ด้านล่างเพื่อโพสต์แรก<br>
                ทุกคนเห็นจากทุกเครื่อง
            </div>
        </div>
    </div>
</div>

<!-- หน้าโปรไฟล์ -->
<div id="page-profile" class="page profile-page">
    <div class="profile-header">
        <div class="profile-avatar"></div>
        <h1 class="profile-name">ThaiPodee Market</h1>
        <p class="profile-username">@thaipodee_market</p>
        <div class="profile-stats">
            <div class="stat-item"><div class="stat-num" id="stat-posts">0</div><div class="stat-label">โพสต์</div></div>
            <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">ผู้ติดตาม</div></div>
            <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">ถูกใจ</div></div>
        </div>
    </div>
    <div class="posts-grid" id="posts-grid">
        <div class="empty-grid">ยังไม่มีโพสต์<br>กด + ด้านล่างเพื่อโพสต์แรก</div>
    </div>
</div>

<!-- หน้าเลือกเสียง -->
<div id="page-sound" class="page sound-page">
    <div class="sound-header">
        <span class="back-btn" id="back-btn">← กลับ</span>
        <span class="sound-title">เพิ่มเสียงเพลง</span>
        <span></span>
    </div>
    <div class="section-title">🎵 จากไฟล์ในเครื่อง</div>
    <label class="local-area">
        <span style="font-size:24px">🎵</span>
        <div>
            <div>แตะเลือกไฟล์เสียง/เพลง</div>
            <div class="audio-name" id="audio-name">ข้ามได้ถ้าไม่มี</div>
        </div>
        <input type="file" accept="audio/*" id="audio-input" class="hidden-input">
    </label>
    <div class="status" id="status">พร้อมโพสต์</div>
    <button class="post-btn" id="post-btn">☁️ โพสต์ขึ้นคลาวด์เลย</button>
</div>

<!-- ✅ เมนูล่าง — ปุ่ม + คงที่ ไม่หายแน่นอน -->
<div class="nav-bottom">
    <div class="nav-col active" data-page="page-feed">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าแรก</span>
    </div>
    <div class="nav-col" data-page="">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">ค้นหา</span>
    </div>
    <div class="nav-col upload-col">
        <div class="upload-box">
            <input type="file" accept="video/*,image/*" id="media-input" class="file-input">
        </div>
    </div>
    <div class="nav-col" data-page="">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
    </div>
    <div class="nav-col" data-page="page-profile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<script>
// =====================================================
// ☁️ เชื่อมระบบ
// =====================================================
const cld = cloudinary.Cloudinary.new({ cloud_name: 'orpjnytt' });

const firebaseConfig = {
  apiKey: "AIzaSyCt-wPPDeopLnjCv4QQvdYLQu2G_VxWYE",
  authDomain: "thaipodee-market.firebaseapp.com",
  projectId: "thaipodee-market",
  storageBucket: "thaipodee-market.firebasestorage.app",
  messagingSenderId: "802626775100",
  appId: "1:802626775100:web:c126e82059d124d19c39"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let posts = [];
let currentSlide = 0;
let pendingMedia = null;
let pendingAudio = null;
let isLoading = false;

// เปลี่ยนหน้า
function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-col').forEach(n => n.classList.remove('active'));
    if (pageId) {
        document.getElementById(pageId).classList.add('active');
        const activeNav = document.querySelector(`[data-page="${pageId}"]`);
        if (activeNav) activeNav.classList.add('active');
    }
}

// โหลดโพสต์จาก Firebase
async function loadPostsFromFirebase() {
    try {
        const snapshot = await db.collection('posts').orderBy('createdAt', 'desc').get();
        posts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderFeed();
        renderProfile();
    } catch (err) {
        console.error('โหลดไม่ได้:', err);
    }
}

// อัปโหลดไฟล์ไป Cloudinary
async function uploadToCloudinary(file, resourceType) {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', 'ml_default');
    
    const res = await fetch(
        `https://api.cloudinary.com/v1_1/orpjnytt/${resourceType}/upload`,
        { method: 'POST', body: form }
    );
    
    if (!res.ok) {
        const info = await res.json().catch(() => null);
        console.error('Cloudinary:', info || res.status);
        if (info?.error?.message?.includes('preset')) {
            throw new Error('⚠️ เปิดสิทธิ์ก่อน: Cloudinary → Upload → ml_default → เปิด Unsigned Upload');
        }
        throw new Error(`อัปโหลดไม่ได้ (${res.status})`);
    }
    return await res.json();
}

// บันทึกลง Firebase
async function savePostToFirebase(data) {
    await db.collection('posts').add({
        ...data,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
}

// แสดงฟีด
function renderFeed() {
    const slider = document.getElementById('feed-slider');
    if (posts.length === 0) {
        slider.innerHTML = `<div class="empty-state">☁️ กดปุ่ม + ด้านล่างเพื่อโพสต์แรก<br>ทุกคนเห็นจากทุกเครื่อง</div>`;
        return;
    }
    slider.innerHTML = posts.map((p, i) => `
        <div class="post-slide" style="transform: translateY(${i * 100}dvh)">
            <div class="media-area">
                ${p.type === 'video'
                    ? `<video id="vid-${i}" loop playsinline muted controls><source src="${p.url}"></video>`
                    : `<img src="${p.url}" alt="">`
                }
                ${p.audioUrl ? `<audio id="aud-${i}" loop src="${p.audioUrl}">` : ''}
            </div>
            <div class="info-left">
                <div class="acc-name">ThaiPodee Market</div>
                <div class="desc-text">โพสต์จากคลาวด์ — ทุกคนเห็นพร้อมกัน</div>
                ${p.audioName ? `<div class="music-row">🎵 ${p.audioName}</div>` : ''}
            </div>
            <div class="menu-right">
                <div class="menu-btn"><span class="avatar"></span></div>
                <div class="menu-btn"><span class="icon">❤️</span><span class="num">0</span></div>
                <div class="menu-btn"><span class="icon">💬</span><span class="num">0</span></div>
                <div class="menu-btn"><span class="icon">⭐</span><span class="num">0</span></div>
                <div class="menu-btn"><span class="icon">↗️</span><span class="num">0</span></div>
            </div>
        </div>`
    ).join('');
    goToSlide(0);
}

// เลื่อนฟีด
function goToSlide(index) {
    if (index < 0 || index >= posts.length) return;
    currentSlide = index;
    document.getElementById('feed-slider').style.transform = `translateY(-${index * 100}dvh)`;
    posts.forEach((_, i) => {
        const v = document.getElementById(`vid-${i}`);
        const a = document.getElementById(`aud-${i}`);
        if (i === index) { v?.play().catch(()=>{}); a?.play().catch(()=>{}); }
        else { v?.pause(); a?.pause(); }
    });
}

// แสดงโปรไฟล์
function renderProfile() {
    const grid = document.getElementById('posts-grid');
    document.getElementById('stat-posts').textContent = posts.length;
    if (posts.length === 0) {
        grid.innerHTML = `<div class="empty-grid">ยังไม่มีโพสต์<br>กด + ด้านล่างเพื่อโพสต์แรก</div>`;
        return;
    }
    grid.innerHTML = posts.map((p, i) => `
        <div class="grid-item" data-idx="${i}">
            ${p.type === 'video' ? `<video src="${p.url}" muted></video>` : `<img src="${p.url}" alt="">`}
        </div>`
    ).join('');
    grid.querySelectorAll('.grid-item').forEach(it => {
        it.onclick = () => { goToSlide(+it.dataset.idx); showPage('page-feed'); };
    });
}

// --- เหตุการณ์ ---

// เปลี่ยนหน้าเมนู
document.querySelectorAll('[data-page]').forEach(b => {
    b.onclick = () => showPage(b.dataset.page || 'page-feed');
});

// กดเลือกไฟล์ — ปุ่ม + ทำงานแน่นอน
document.getElementById('media-input').onchange = e => {
    pendingMedia = e.target.files[0];
    if (pendingMedia) {
        console.log('เลือกไฟล์ได้:', pendingMedia.name);
        showPage('page-sound');
    }
};

// เลือกเสียง
document.getElementById('audio-input').onchange = e => {
    pendingAudio = e.target.files[0];
    document.getElementById('audio-name').textContent = pendingAudio?.name || 'ข้ามได้ถ้าไม่มี';
};

// กลับ
document.getElementById('back-btn').onclick = () => {
    pendingMedia = pendingAudio = null;
    document.getElementById('media-input').value = '';
    document.getElementById('audio-input').value = '';
    document.getElementById('audio-name').textContent = 'ข้ามได้ถ้าไม่มี';
    showPage('page-feed');
};

// โพสต์
document.getElementById('post-btn').onclick = async () => {
    if (!pendingMedia) return alert('กดปุ่ม + เลือกไฟล์ก่อนครับ');
    if (isLoading) return;
    
    isLoading = true;
    const btn = document.getElementById('post-btn');
    const status = document.getElementById('status');
    btn.disabled = true;
    status.textContent = '☁️ กำลังอัปโหลด...';
    status.className = 'status';
    
    try {
        const type = pendingMedia.type.startsWith('video') ? 'video' : 'image';
        
        status.textContent = '☁️ ส่งไฟล์ไปคลาวด์...';
        const mediaRes = await uploadToCloudinary(pendingMedia, type);
        if (!mediaRes.secure_url) throw new Error('ไม่ได้ที่อยู่ไฟล์');
        
        let audioUrl = null, audioName = null;
        if (pendingAudio) {
            status.textContent = '☁️ ส่งไฟล์เสียง...';
            const aRes = await uploadToCloudinary(pendingAudio, 'raw');
            audioUrl = aRes.secure_url;
            audioName = pendingAudio.name;
        }
        
        status.textContent = '☁️ บันทึกรายการ...';
        await savePostToFirebase({ type, url: mediaRes.secure_url, audioUrl, audioName });
        
        status.textContent = '✅ สำเร็จ! ทุกคนเห็นแล้ว';
        status.className = 'status ok';
        await loadPostsFromFirebase();
        
        pendingMedia = pendingAudio = null;
        document.getElementById('media-input').value = '';
        document.getElementById('audio-input').value = '';
        document.getElementById('audio-name').textContent = 'ข้ามได้ถ้าไม่มี';
        
        setTimeout(() => {
            showPage('page-feed');
            status.textContent = 'พร้อมโพสต์';
            status.className = 'status';
            btn.disabled = false;
            isLoading = false;
        }, 1500);
        
    } catch (err) {
        console.error('ผิดพลาด:', err);
        status.textContent = err.message;
        status.className = 'status warn';
        btn.disabled = false;
        isLoading = false;
    }
};

// เลื่อนฟีดด้วยนิ้ว
let touchStartY = 0;
document.addEventListener('touchstart', e => {
    if (e.target.closest('.post-slide')) touchStartY = e.touches[0].clientY;
});
document.addEventListener('touchend', e => {
    if (!touchStartY) return;
    const diff = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(diff) > 60) {
        if (diff > 0) goToSlide(currentSlide + 1);
        else goToSlide(currentSlide - 1);
    }
    touchStartY = 0;
});

// เริ่มทำงาน
window.onload = () => {
    loadPostsFromFirebase();
};
</script>
</body>
</html>
