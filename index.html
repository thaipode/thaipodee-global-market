<!-- ==============================================================
   Thaipodee Market — v58
   วันที่: 23 กันยายน 2569 08:05 น.
   ตรงตามรูป: 6 ปุ่มด้านขวา + เมนูล่าง 5 ปุ่ม ครบ
   ============================================================== -->

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ThaiPodee Market</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  /* แถบบน */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 44px;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
  }
  .tab { padding: 0 12px; font-size: 14px; color: #999; }
  .tab.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 4px; }

  /* พื้นที่เนื้อหาวิดีโอ */
  .video-area {
    position: absolute;
    top: 44px;
    left: 0;
    right: 0;
    bottom: 60px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 15px;
  }

  /* ข้อความบน视频 */
  .video-overlay-text {
    position: absolute;
    left: 12px;
    bottom: 80px;
    right: 80px;
    font-size: 13px;
    line-height: 1.4;
    color: #fff;
  }

  /* ===== 6 ปุ่มด้านขวา ตามรูปเป๊ะ! ===== */
  .side-buttons {
    position: fixed;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    z-index: 150;
  }

  .side-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    cursor: pointer;
  }

  .side-icon {
    font-size: 22px;
    line-height: 1;
  }

  .side-num {
    font-size: 11px;
    margin-top: 2px;
  }

  /* รูปโปรไฟล์วงกลม */
  .profile-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #333;
    border: 2px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .profile-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ปุ่มเพลง */
  .music-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* เมนูล่าง 5 ปุ่ม */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: #000;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid #222;
    z-index: 99999;
  }

  .nav-btn {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #999;
    cursor: pointer;
  }

  .nav-btn.active { color: #fff; }
  .nav-icon { font-size: 20px; line-height: 1; }
  .nav-label { font-size: 10px; margin-top: 2px; }

  /* ปุ่มกลาง + */
  .plus-wrap {
    display: flex; align-items: center; justify-content: center;
  }

  .plus-btn {
    width: 46px; height: 32px;
    background: #fff; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: bold; color: #000;
    position: relative;
  }

  .plus-btn::before {
    content: '';
    position: absolute;
    width: 40px; height: 40px;
    background: #fff; border-radius: 50%;
    top: -4px; z-index: -1;
  }
</style>
</head>
<body>

<!-- แถบบน -->
<div class="top-bar">
  <span class="tab">กำลังติดตาม</span>
  <span class="tab active">สำหรับคุณ</span>
</div>

<!-- พื้นที่วิดีโอ -->
<div class="video-area">
  <p>เริ่มใช้งาน ThaiPodee Market</p>
</div>

<!-- ข้อความใต้วิดีโอทางซ้าย -->
<div class="video-overlay-text">
  <strong>ชื่อผู้ใช้</strong><br>
  คำอธิบายวิดีโอจะอยู่ที่นี่ คุณสามารถเพิ่มข้อความได้ตามต้องการ<br>
  <span style="color:#aaa; font-size:12px;">เสียง · ชื่อเพลง</span>
</div>

<!-- ===== 6 ปุ่มด้านขวา ตามรูปเลย! ===== -->
<div class="side-buttons">

  <!-- 1. โปรไฟล์ / คนหาเจอ -->
  <div class="side-btn">
    <div class="profile-circle">
      <img src="https://i.pravatar.cc/150?img=23" alt="profile">
    </div>
  </div>

  <!-- 2. กดถูกใจ -->
  <div class="side-btn">
    <span class="side-icon">❤️</span>
    <span class="side-num">28.4K</span>
  </div>

  <!-- 3. คอมเมนต์ -->
  <div class="side-btn">
    <span class="side-icon">💬</span>
    <span class="side-num">412</span>
  </div>

  <!-- 4. บันทึก -->
  <div class="side-btn">
    <span class="side-icon">⭐</span>
    <span class="side-num">8.0K</span>
  </div>

  <!-- 5. แชร์ -->
  <div class="side-btn">
    <span class="side-icon">↗️</span>
    <span class="side-num">แชร์</span>
  </div>

  <!-- 6. เพลง / เสียง -->
  <div class="side-btn">
    <div class="music-btn">
      <span class="side-icon">🎵</span>
    </div>
  </div>

</div>

<!-- เมนูล่าง 5 ปุ่ม -->
<nav class="bottom-nav">
  <div class="nav-btn active">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">หน้าหลัก</span>
  </div>
  <div class="nav-btn">
    <span class="nav-icon">🛒</span>
    <span class="nav-label">ร้านค้า</span>
  </div>
  <div class="plus-wrap">
    <div class="plus-btn">+</div>
  </div>
  <div class="nav-btn">
    <span class="nav-icon">📥</span>
    <span class="nav-label">กล่องข้อความ</span>
  </div>
  <div class="nav-btn">
    <span class="nav-icon">👤</span>
    <span class="nav-label">ฉัน</span>
  </div>
</nav>

<script>
// เปลี่ยนหน้าเมื่อกดเมนูล่าง
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// กดปุ่ม + เพิ่มวิดีโอ
document.querySelector('.plus-btn').addEventListener('click', () => {
  alert('✅ เปิดหน้าเพิ่มวิดีโอ');
});
</script>

</body>
</html>
