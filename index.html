<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThaiPodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body {
            height: 100vh; overflow: hidden; background: #000; color: #fff;
            position: fixed; inset: 0; width: 100%;
        }

        /* === ล็อก: วิดีโอยันขอบจอ ไม่มีขอบดำ === */
        .video-wrap {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1; cursor: pointer; background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        #main-media {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center center;
            background: #000;
        }

        /* === ล็อก: แถบเลื่อนจับได้ === */
        .progress-container {
            position: fixed; bottom: 70px; left: 12px; right: 12px; z-index: 15;
            height: 32px; display: flex; align-items: center;
        }
        .progress-bar {
            width: 100%; height: 3px; background: rgba(255,255,255,0.25);
            border-radius: 3px; cursor: pointer; position: relative;
        }
        .progress-fill {
            height: 100%; background: #fff; border-radius: 3px; width: 0%;
            transition: width 0.1s linear;
        }
        .progress-dot {
            position: absolute; right: 0; top: 50%; transform: translate(50%, -50%);
            width: 12px; height: 12px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        /* === ล็อก: เงาเพื่ออ่านข้อความชัดขึ้น === */
        .shade-bottom {
            position: fixed; bottom: 0; left: 0; right: 0; height: 180px;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
            z-index: 2; pointer-events: none;
        }

        .sound-sign {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 48px; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; z-index: 20; text-shadow: 0 0 12px rgba(0,0,0,0.8);
        }
        .sound-sign.show { opacity: 1; }

        /* === ล็อก: ข้อความลอยบนวิดีโอ === */
        .info-left {
            position: fixed; left: 16px; bottom: 95px; right: 95px; z-index: 10;
        }
        .acc-name {
            font-weight: 700; font-size: 15px; margin-bottom: 6px; word-break: break-word;
            text-shadow: 0 0 8px rgba(0,0,0,0.9);
        }
        .desc-text {
            font-size: 14px; line-height: 1.5; margin-bottom: 8px; color: #f0f0f0;
            word-break: break-word; text-shadow: 0 0 8px rgba(0,0,0,0.9);
        }
        .music-row {
            display: flex; align-items: center; gap: 6px; font-size: 13px; color: #eee;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            text-shadow: 0 0 8px rgba(0,0,0,0.9);
        }

        /* === ล็อก: เมนูขวาลอยบนวิดีโอ ขนาดพอดี === */
        .menu-right {
            position: fixed; right: 10px; bottom: 120px;
            display: flex; flex-direction: column; align-items: center; gap: 18px; z-index: 10;
        }
        .menu-btn {
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .avatar-box { position: relative; width: 40px; height: 40px; }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff;
            object-fit: cover;
        }
        .follow-plus {
            position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 18px; background: #ff2442; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: #fff; line-height: 1;
        }
        .icon {
            font-size: 24px; pointer-events: none;
            text-shadow: 0 0 8px rgba(0,0,0,0.9);
        }
        .num {
            font-size: 11px; pointer-events: none; color: #fff;
            text-shadow: 0 0 8px rgba(0,0,0,0.9);
        }
        .music-disc {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(45deg, #00c6ff, #ff0080);
            display: flex; align-items: center; justify-content: center;
            animation: spin 3s linear infinite; font-size: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* === ล็อก: แถบล่างโปร่งแสง ลอยบนวิดีโอ === */
        .nav-bottom {
            position: fixed; bottom: 0; left: 0; right: 0; height: 68px;
            background: rgba(0,0,0,0.72);
            display: flex; justify-content: space-around; align-items: flex-end;
            padding: 10px 15px 18px; border-top: 1px solid rgba(255,255,255,0.08);
            z-index: 99;
        }
        .nav-col {
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
            position: relative;
        }
        .nav-icon {
            font-size: 23px; pointer-events: none;
            text-shadow: 0 0 6px rgba(0,0,0,0.9);
        }
        .nav-label {
            font-size: 10px; color: #fff; pointer-events: none;
            text-shadow: 0 0 6px rgba(0,0,0,0.9);
        }
        .add-btn {
            width: 46px; height: 30px; background: #fff; border-radius: 8px;
            position: relative; cursor: pointer; margin-bottom: 5px;
        }
        .add-btn::before {
            content: ''; position: absolute; width: 18px; height: 2px; background: #000;
            top: 14px; left: 14px;
        }
        .add-btn::after {
            content: ''; position: absolute; width: 2px; height: 18px; background: #000;
            left: 22px; top: 6px;
        }
        .badge {
            position: absolute; top: -3px; right: -8px;
            background: #ff2442; color: #fff; font-size: 9px;
            min-width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; pointer-events: none;
        }

        #upload-input { display: none; }
    </style>
</head>
<body>

<div class="video-wrap" id="vidWrap" onclick="toggleAudio()">
    <video id="main-media" autoplay loop muted playsinline>
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
    </video>
</div>

<!-- แถบเลื่อน -->
<div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-dot" id="progressDot"></div>
    </div>
</div>

<div class="shade-bottom"></div>
<div class="sound-sign" id="soundHint">🔇</div>

<div class="info-left">
    <div class="acc-name">@ThaiPodee_Official</div>
    <div class="desc-text">ยินดีต้อนรับสู่ ThaiPodee Global Market — แพลตฟอร์มของคนไทย ✨</div>
    <div class="music-row">
        <span>🎵</span>
        <span>เสียงต้นฉบับ • ThaiPodee Original</span>
    </div>
</div>

<div class="menu-right">
    <div class="menu-btn" onclick="alert('โปรไฟล์')">
        <div class="avatar-box">
            <img class="avatar" src="https://picsum.photos/seed/thaipodee/100/100" alt="โปรไฟล์">
            <span class="follow-plus" onclick="event.stopPropagation(); alert('ติดตาม')">+</span>
        </div>
    </div>
    <div class="menu-btn" onclick="toggleHeart(this)">
        <span class="icon">❤️</span>
        <span class="num">0</span>
    </div>
    <div class="menu-btn" onclick="alert('คอมเมนต์')">
        <span class="icon">💬</span>
        <span class="num">0</span>
    </div>
    <div class="menu-btn" onclick="toggleStar(this)">
        <span class="icon">⭐</span>
        <span class="num">บันทึก</span>
    </div>
    <div class="menu-btn" onclick="doShare()">
        <span class="icon">➡️</span>
        <span class="num">แชร์</span>
    </div>
    <div class="menu-btn" onclick="alert('เพลง')">
        <div class="music-disc">🎵</div>
        <span class="num" style="font-size:10px; margin-top:4px;">11</span>
    </div>
</div>

<div class="nav-bottom">
    <div class="nav-col" onclick="alert('หน้าหลัก')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าหลัก</span>
    </div>
    <div class="nav-col" onclick="alert('ร้านค้า')">
        <span class="nav-icon">🛍️</span>
        <span class="nav-label">ร้านค้า</span>
    </div>
    <div class="nav-col" onclick="document.getElementById('upload-input').click()">
        <div class="add-btn"></div>
        <input type="file" id="upload-input" accept="video/*,image/*" onchange="doUpload(event)">
    </div>
    <div class="nav-col" onclick="alert('ข้อความ')">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
        <span class="badge">99+</span>
    </div>
    <div class="nav-col" onclick="alert('โปรไฟล์')">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<script>
let isMuted = true;
const progressFill = document.getElementById('progressFill');
const progressBar = document.getElementById('progressBar');
let vid = document.getElementById('main-media');

// === ฟังก์ชันผูกเหตุการณ์แถบเลื่อน ===
function bindVideoEvents(videoEl) {
    videoEl.addEventListener('timeupdate', () => {
        if (videoEl.duration) {
            const pct = (videoEl.currentTime / videoEl.duration) * 100;
            progressFill.style.width = pct + '%';
        }
    });
    // กดเลื่อนเวลา
    progressBar.onclick = (e) => {
        const rect = progressBar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        if (videoEl.duration) {
            videoEl.currentTime = pct * videoEl.duration;
        }
    };
}

// เปลี่ยนเสียง
function toggleAudio() {
    const hint = document.getElementById('soundHint');
    isMuted = !isMuted;
    vid.muted = isMuted;
    hint.textContent = isMuted ? '🔇' : '🔊';
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 700);
}

bindVideoEvents(vid);

// === โหลดวิดีโอที่บันทึกไว้เมื่อเปิดหน้า ===
window.addEventListener('load', () => {
    const savedData = localStorage.getItem('thaipodee_video_data');
    const savedType = localStorage.getItem('thaipodee_video_type');
    if (savedData && savedType) {
        renderMedia(savedData, savedType);
    }
});

// === แสดงวิดีโอ/ภาพ และบันทึกไว้ ===
function renderMedia(dataUrl, mimeType) {
    const wrap = document.getElementById('vidWrap');
    if (mimeType.startsWith('video/')) {
        wrap.innerHTML = `<video id="main-media" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;">
            <source src="${dataUrl}" type="${mimeType}">
        </video>`;
        vid = document.getElementById('main-media');
        isMuted = true;
        bindVideoEvents(vid);
    } else {
        wrap.innerHTML = `<img id="main-media" src="${dataUrl}" style="width:100%; height:100%; object-fit:cover;">`;
        progressFill.style.width = '0%';
    }
}

// === อัปโหลดไฟล์ใหม่ → บันทึกอัตโนมัติ ===
function doUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const dataUrl = ev.target.result;
        // บันทึกลงเครื่อง — รีเฟรชก็ไม่หาย
        localStorage.setItem('thaipodee_video_data', dataUrl);
        localStorage.setItem('thaipodee_video_type', file.type);
        // แสดงผล
        renderMedia(dataUrl, file.type);
    };
    reader.readAsDataURL(file);
}

function toggleHeart(el) {
    el.style.color = el.style.color === 'red' ? '' : 'red';
}

function toggleStar(el) {
    el.style.color = el.style.color === 'gold' ? '' : 'gold';
}

function doShare() {
    if (navigator.share) {
        navigator.share({title:'ThaiPodee Global Market', url:window.location.href});
    } else {
        prompt('คัดลอกลิงก์:', window.location.href);
    }
}
</script>

</body>
</html>
