<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>ThaiPodee — ของไทย ไปไกลทั่วโลก</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, sans-serif;}
html,body{height:100%; overflow:hidden; background:#000; color:#fff;}

.swiper{height:calc(100vh - 65px); overflow-y:auto; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;}
.slide{height:100vh; scroll-snap-align:start; position:relative; display:flex; align-items:center; justify-content:center; background:#000;}
video{width:100%; height:100%; object-fit:cover; background:#000;}
video::-webkit-media-controls{display:none;}

.empty{text-align:center; position:absolute; z-index:5;}
.empty h2{font-size:26px; color:#FFB800; margin-bottom:8px;}
.empty p{font-size:14px; color:#aaa; margin:4px 0;}
.hi{color:#FF6B00; font-weight:600;}

.info{position:absolute; bottom:85px; left:16px; right:90px; z-index:10;}
.info h3{font-size:16px; margin-bottom:4px;}
.info p{font-size:13px; color:#999;}

/* ปุ่มขวา — วงกลมทุกอัน */
.side{position:absolute; right:12px; bottom:120px; display:flex; flex-direction:column; gap:22px; align-items:center; z-index:20;}
.side-btn{display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;}
.side-icon{width:44px; height:44px; border-radius:50%; background:#222; display:flex; align-items:center; justify-content:center; font-size:20px; transition:transform .15s;}
.side-btn:active .side-icon{transform:scale(.9); background:#333;}
.side-txt{font-size:10px; color:#ccc;}

/* ปุ่มล่าง — คงที่ */
.nav{position:fixed; bottom:0; left:0; right:0; height:65px; background:#000; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #222; z-index:50;}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; cursor:pointer;}
.nav-icon{font-size:20px;}
.nav-add{background:#FF4757; padding:8px 22px; border-radius:6px; font-weight:600; color:#fff; font-size:12px;}

.modal{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; display:none;}
.modal.show{display:flex;}
.mbox{background:#111; border-radius:16px; padding:25px; width:100%; max-width:340px; border:1px solid #333;}
.mbox h4{font-size:17px; margin-bottom:15px; text-align:center;}
.mbtn{width:100%; padding:12px; border:none; border-radius:8px; font-size:15px; cursor:pointer; margin-top:10px;}
.mbtn.ok{background:#FF4757; color:#fff;}
.mbtn.close{background:#333; color:#fff;}
</style>
</head>
<body>

<div class="swiper" id="swiper"></div>

<nav class="nav">
  <div class="nav-item"><span class="nav-icon">🏠</span><span>หน้าแรก</span></div>
  <div class="nav-item"><span class="nav-icon">🧺</span><span>ตะกร้า</span></div>
  <div class="nav-item nav-add" onclick="uploadOpen()"><span class="nav-icon">+</span><span>อัปโหลด</span></div>
  <div class="nav-item" onclick="msgOpen()"><span class="nav-icon">💬</span><span>ข้อความ</span></div>
  <div class="nav-item" onclick="profileOpen()"><span class="nav-icon">👤</span><span>ฉัน</span></div>
</nav>

<input type="file" id="fileInput" accept="video/mp4" style="display:none;">

<div class="modal" id="uploadModal">
  <div class="mbox" style="text-align:center;">
    <h4>อัปโหลดวิดีโอ</h4>
    <p style="color:#999; margin:10px 0;">เลือกไฟล์ .mp4</p>
    <button class="mbtn ok" onclick="document.getElementById('fileInput').click()">เลือกไฟล์</button>
    <button class="mbtn close" onclick="uploadModal.classList.remove('show')">ปิด</button>
  </div>
</div>

<div class="modal" id="profileModal">
  <div class="mbox">
    <h4>โปรไฟล์</h4>
    <p style="color:#ccc; text-align:center;">ชื่อ: ผู้ใช้ ThaiPodee</p>
    <button class="mbtn close" onclick="profileModal.classList.remove('show')">ปิด</button>
  </div>
</div>

<div class="modal" id="msgModal">
  <div class="mbox">
    <h4>ข้อความ</h4>
    <p style="color:#888; text-align:center;">ยังไม่มีข้อความ</p>
    <button class="mbtn close" onclick="msgModal.classList.remove('show')">ปิด</button>
  </div>
</div>

<script>
let videos = [];
let likes = {};

function loadAll(){
  try{
    const saved = localStorage.getItem('tp_videos');
    if(saved) videos = JSON.parse(saved);
  }catch{ videos = []; }
  render();
}

function saveAll(){
  localStorage.setItem('tp_videos', JSON.stringify(videos));
  render();
}

function render(){
  const sw = document.getElementById('swiper');
  sw.innerHTML = '';

  if(!videos.length){
    sw.innerHTML = `<div class="slide">
      <div class="empty">
        <h2>ThaiPodee</h2>
        <p>ของไทย ไปไกลทั่วโลก</p>
        <p>กด <span class="hi">+ อัปโหลด</span> เพื่อเพิ่มวิดีโอ</p>
      </div>
      <!-- ปุ่มขวา ตรงลำดับ: 👤 ❤️ 💬 ⭐ ↗️ 🎵 -->
      <div class="side">
        <div class="side-btn" onclick="profileOpen()"><div class="side-icon">👤</div><div class="side-txt">โปรไฟล์</div></div>
        <div class="side-btn"><div class="side-icon">❤️</div><div class="side-txt">0</div></div>
        <div class="side-btn"><div class="side-icon">💬</div><div class="side-txt">0</div></div>
        <div class="side-btn"><div class="side-icon">⭐</div><div class="side-txt">บันทึก</div></div>
        <div class="side-btn" onclick="shareDummy()"><div class="side-icon">↗️</div><div class="side-txt">แชร์</div></div>
        <div class="side-btn"><div class="side-icon">🎵</div><div class="side-txt">เสียง</div></div>
      </div>
    </div>`;
    return;
  }

  videos.forEach((v, i) => {
    if(!likes[i]) likes[i] = v.likes || 0;
    const d = document.createElement('div');
    d.className = 'slide';
    d.innerHTML = `
      <video src="${v.url}" loop muted playsinline preload="auto"></video>
      <div class="info">
        <h3>${v.name.replace(/\.[^.]+$/, '')}</h3>
        <p>@ThaiPodee</p>
      </div>
      <div class="side">
        <div class="side-btn" onclick="profileOpen()"><div class="side-icon">👤</div><div class="side-txt">โปรไฟล์</div></div>
        <div class="side-btn" onclick="likeThis(${i})"><div class="side-icon">❤️</div><div class="side-txt" id="lk${i}">${likes[i]}</div></div>
        <div class="side-btn"><div class="side-icon">💬</div><div class="side-txt">0</div></div>
        <div class="side-btn"><div class="side-icon">⭐</div><div class="side-txt">บันทึก</div></div>
        <div class="side-btn" onclick="shareVid(${i})"><div class="side-icon">↗️</div><div class="side-txt">แชร์</div></div>
        <div class="side-btn"><div class="side-icon">🎵</div><div class="side-txt">เสียง</div></div>
      </div>`;
    sw.appendChild(d);
  });

  new IntersectionObserver(ents => {
    ents.forEach(e => {
      const vid = e.target.querySelector('video');
      e.isIntersecting ? vid?.play().catch(()=>{}) : vid?.pause();
    });
  }, { threshold: 0.6 }).observe(document.querySelectorAll('.slide'));
}

function shareDummy(){ alert('กด + เพิ่มวิดีโอก่อนนะ'); }
function likeThis(i){ likes[i]++; document.getElementById('lk'+i).textContent = likes[i]; }
function shareVid(i){
  if(navigator.share) navigator.share({title: videos[i].name});
  else prompt('คัดลอกลิงก์:','');
}

document.getElementById('fileInput').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  videos.unshift({
    name: f.name,
    url: URL.createObjectURL(f),
    time: Date.now(),
    likes: 0
  });
  saveAll();
  uploadModal.classList.remove('show');
  fileInput.value = '';
  alert('✅ อัปโหลดเรียบร้อย');
};

function uploadOpen(){ uploadModal.classList.add('show'); }
function profileOpen(){ profileModal.classList.add('show'); }
function msgOpen(){ msgModal.classList.add('show'); }

loadAll();
</script>
</body>
</html>
