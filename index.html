   ปัญหาที่พบ:
   1. ข้อมูลโพสต์หายเมื่อเปลี่ยนเครื่อง — เก็บแค่ในเครื่อง
   2. ยังไม่ได้ตั้งค่า Cloud Name / Upload Preset — อัปโหลดไม่ได้
   3. ไม่มีไอคอนแอป — ติดตั้งเป็นแอปไม่ได้
   4. ไม่มีข้อมูลเวอร์ชัน — สับสนอันไหนเก่า-ใหม่

   วิธีการแก้ไข:
   1. ตั้งค่าครบแล้ว:
      - CLOUD_NAME = 'nsole'
      - UPLOAD_PRESET = 'thaipodee'
   2. เพิ่มไอคอนโลโก้ — มือถือ / เดสก์ท็อป
   3. เพิ่ม PWA manifest — ติดตั้งเป็นแอปได้
   4. คงรูปแบบหน้าจอเดิมทุกประการ

   คำเตือน:
   - ห้ามแก้ไขส่วนนี้โดยไม่จำเป็น — ค่าได้รับการยืนยันแล้ว
   - ไฟล์ thaipodee_logo_icon.png ต้องอยู่ในโฟลเดอร์เดียวกัน

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thaipodee">
  <meta name="description" content="Thaipodee Global Market — แพลตฟอร์มวิดีโอและการค้า">
  
  <!-- 📱 ไอคอนแอป -->
  <link rel="apple-touch-icon" href="thaipodee_logo_icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="thaipodee_logo_icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="thaipodee_logo_icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="thaipodee_logo_icon.png">
  <link rel="icon" href="thaipodee_logo_icon.png">
  
  <!-- 📋 ตั้งค่าแอป -->
  <link rel="manifest" href="manifest.json">
  
  <title>Thaipodee Global Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    .hidden { display: none !important; }

    .feed { height: calc(100vh - 60px); overflow-y: auto; scroll-snap-type: y mandatory; }
    .post-slide { min-height: calc(100vh - 60px); scroll-snap-align: start; position: relative; padding-bottom: 120px; }
    .media { width: 100%; max-height: calc(100vh - 260px); object-fit: contain; background: #000; display: block; margin: 0 auto; }

    .info-left { position: absolute; bottom: 70px; left: 12px; max-width: 70%; z-index: 10; }
    .username { font-weight: bold; font-size: 15px; margin-bottom: 2px; }
    .caption { font-size: 14px; opacity: 0.9; margin: 4px 0; }
    .meta-row { font-size: 12px; color: #aaa; line-height: 2; margin-top: 6px; }
    .meta-row span { display: inline-block; margin-right: 12px; }
    .del-btn { background: #e53935; color: #fff; border: none; border-radius: 4px; padding: 5px 12px; font-size: 12px; cursor: pointer; margin-top: 8px; }

    .side-menu { position: absolute; bottom: 160px; right: 12px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 20; }
    .side-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
    .side-btn i { font-size: 26px; color: #fff; }
    .side-btn span { font-size: 11px; color: #fff; }
    .profile-user i { font-size: 36px; }
    .liked { color: #ff4757; }

    .music-icon {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #9333ea, #4c1d95);
      display: flex; align-items: center; justify-content: center;
    }
    .music-icon i { font-size: 20px; }

    .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 50; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; position: relative; }
    .nav-btn i { font-size: 20px; color: #fff; }
    .nav-btn span { font-size: 10px; color: #fff; }
    .add-btn { background: #fff; color: #000; width: 48px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; }
    .badge { position: absolute; top: -4px; right: -8px; background: red; color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 10px; }

    .overlay { position: absolute; inset: 0; background: #000; z-index: 100; padding: 20px; overflow-y: auto; }
    .back-btn { display: inline-flex; align-items: center; color: #fff; text-decoration: none; margin-bottom: 20px; }
    .back-btn i { margin-right: 6px; }
    .page-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
    
    .file-info { background: #1a1a1a; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    .file-name { font-size: 15px; margin-bottom: 10px; }
    .file-meta { font-size: 13px; color: #aaa; line-height: 1.8; }
    .file-meta .ok { color: #4ade80; margin-left: 6px; }
    
    .audio-section { margin-bottom: 25px; }
    .audio-label { font-size: 14px; margin-bottom: 12px; }
    .audio-option { border: 2px solid transparent; border-radius: 8px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
    .audio-option.active { border-color: #facc15; background: #2a2500; }
    .audio-option input { margin-right: 10px; transform: scale(1.2); }
    .audio-option-title { font-weight: bold; margin-bottom: 3px; }
    .audio-option-desc { font-size: 12px; color: #aaa; }
    
    .publish-btn { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; background: linear-gradient(90deg, #e53935, #f97316); color: #fff; cursor: pointer; margin-bottom: 10px; }
    .publish-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; margin-bottom: 15px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #e53935, #f97316); width: 0%; transition: width 0.3s; }
    .upload-status { text-align: center; color: #aaa; font-size: 14px; padding: 10px; }

    video { background: #000; display: block; width: 100%; height: 100%; }
    .empty-icon { display: flex; align-items: center; justify-content: center; height: 100%; color: #555; }

    @media (orientation: landscape) {
      .bottom-bar { width: 100px; height: auto; flex-direction: column; top: 0; bottom: 0; border-right: 1px solid #222; border-top: none; }
      .info-left { left: 120px; }
      .side-menu { right: 20px; bottom: 40px; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

<div id="feedPage">
  <div class="feed" id="feedList"></div>
  <div class="bottom-bar">
    <div class="nav-btn" onclick="goFeed()"><i class="fa fa-home"></i><span>หน้าหลัก</span></div>
    <div class="nav-btn" onclick="goShop()"><i class="fa fa-shopping-bag"></i><span>ร้านค้า</span></div>
    <div class="nav-btn add-btn" onclick="openPostBox()">+</div>
    <div class="nav-btn" onclick="goInbox()">
      <i class="fa fa-bell"></i><span>กล่องข้อความ</span><span class="badge">99+</span>
    </div>
    <div class="nav-btn" onclick="goProfile()"><i class="fa fa-user-o"></i><span>โปรไฟล์</span></div>
  </div>
</div>

<div id="postBox" class="overlay hidden">
  <a href="#" class="back-btn" onclick="closePostBox(); return false;">
    <i class="fa fa-arrow-left"></i> กลับ
  </a>
  <h2 class="page-title">โพสต์วิดีโอ / รูปภาพ</h2>
  
  <input type="file" id="fileChoose" accept="image/*,video/*" class="hidden">
  <button onclick="document.getElementById('fileChoose').click()" 
          class="w-full py-3 bg-gray-800 rounded-lg mb-4 text-left px-4">
    <i class="fa fa-folder-open mr-2"></i> เลือกไฟล์
  </button>

  <div id="fileInfo" class="file-info hidden">
    <div class="file-name" id="showFileName"></div>
    <div class="file-meta">
      <div>ขนาด: <span id="showFileSize"></span> <span class="ok">✓ ขนาดเหมาะสม</span></div>
      <div>ระยะเวลา: <span id="showDuration"></span></div>
      <div>อัตราส่วน: <span id="showRatio"></span></div>
    </div>
  </div>

  <div class="audio-section" id="audioSection" style="display:none;">
    <div class="audio-label">เลือกเสียง:</div>
    <label class="audio-option active" id="optOriginal">
      <input type="radio" name="audio" value="original" checked>
      <div>
        <div class="audio-option-title">🔊 เสียงต้นฉบับ</div>
        <div class="audio-option-desc">ใช้เสียงจากไฟล์เดิม</div>
      </div>
    </label>
    <label class="audio-option" id="optNew">
      <input type="radio" name="audio" value="new">
      <div>
        <div class="audio-option-title">✨ เพิ่มเสียงใหม่</div>
        <div class="audio-option-desc">ใส่ชื่อเพลง/เสียงที่ต้องการ</div>
      </div>
    </label>
  </div>

  <div class="progress-bar" id="progressContainer" style="display:none;">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div id="uploadStatus" class="upload-status"></div>

  <button id="publishBtn" class="publish-btn" onclick="doPublish()">เผยแพร่</button>
</div>

<script>
// =====================================================
// 🔑 ตั้งค่าคลาวด์ — ยืนยันแล้ว
// =====================================================
const CLOUD_NAME = 'nsole';
const UPLOAD_PRESET = 'thaipodee';

let postData = [];
let selectedFile = null;
let previewUrl = null;
let videoDuration = 0;
const cloudPostsKey = 'tpd_cloud_posts';

function formatFileSize(bytes) {
  if (!bytes) return '-- MB';
  const mb = (bytes / (1024*1024)).toFixed(1);
  return `${mb} MB`;
}
function formatDuration(sec) {
  if (!sec) return '--:--';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function formatDate(timestamp) {
  const d = new Date(timestamp);
  return d.toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' });
}
function formatTime(timestamp) {
  const d = new Date(timestamp);
  return d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
}

function loadPostsList() {
  try {
    const saved = localStorage.getItem(cloudPostsKey);
    postData = saved ? JSON.parse(saved) : [];
  } catch(e) { postData = []; }
  renderFeed();
}
function savePostsList() {
  localStorage.setItem(cloudPostsKey, JSON.stringify(postData));
}

function deletePost(id) {
  if (!confirm('ต้องการลบโพสต์นี้?')) return;
  postData = postData.filter(p => p.id !== id);
  savePostsList();
  renderFeed();
}

function renderFeed() {
  const list = document.getElementById('feedList');
  list.innerHTML = '';

  if (postData.length === 0) {
    list.innerHTML = 
      '<div class="post-slide">' +
        '<div class="empty-icon"><p>กด + เพื่อโพสต์</p></div>' +
        '<div class="info-left">' +
          '<div class="username">Thaipodee Master</div>' +
          '<div class="caption">ยินดีต้อนรับสู่ Thaipodee Global Market</div>' +
        '</div>' +
        '<div class="side-menu">' +
          '<div class="side-btn profile-user"><i class="fa fa-user-circle-o"></i></div>' +
          '<div class="side-btn"><i class="fa fa-heart-o"></i><span>0</span></div>' +
          '<div class="side-btn"><i class="fa fa-comment-o"></i><span>0</span></div>' +
          '<div class="side-btn"><i class="fa fa-bookmark-o"></i><span>0</span></div>' +
          '<div class="side-btn"><i class="fa fa-share-alt"></i><span>แชร์</span></div>' +
          '<div class="side-btn music-icon"><i class="fa fa-music"></i></div>' +
        '</div>' +
      '</div>';
    return;
  }

  postData.forEach(function(p) {
    const slide = document.createElement('div');
    slide.className = 'post-slide';

    let mediaHtml = '';
    if (p.cloudUrl) {
      if (p.isVideo) {
        mediaHtml = 
          '<video class="media" src="' + p.cloudUrl + '" ' +
          'autoplay muted loop playsinline controls preload="auto"></video>';
      } else {
        mediaHtml = '<img class="media" src="' + p.cloudUrl + '" alt="">';
      }
    }

    slide.innerHTML = 
      mediaHtml +
      '<div class="info-left">' +
        '<div class="username">' + p.name + '</div>' +
        '<div class="caption">' + (p.desc || '') + '</div>' +
        '<div class="meta-row">' +
          '<span>📄 ' + p.filename + '</span><br>' +
          '<span>📅 ' + formatDate(p.id) + '</span>' +
          '<span>🕐 ' + formatTime(p.id) + '</span><br>' +
          '<span>💾 ' + formatFileSize(p.fileSize) + '</span>' +
          '<span>⏱ ' + formatDuration(p.duration) + '</span>' +
        '</div>' +
        '<button class="del-btn" onclick="deletePost(' + p.id + ')">ลบโพสต์นี้</button>' +
      '</div>' +
      '<div class="side-menu">' +
        '<div class="side-btn profile-user"><i class="fa fa-user-circle-o"></i></div>' +
        '<div class="side-btn" onclick="toggleLike(' + p.id + ')">' +
          '<i class="fa ' + (p.liked ? 'fa-heart liked' : 'fa-heart-o') + '"></i>' +
          '<span>' + p.likeCount + '</span>' +
        '</div>' +
        '<div class="side-btn"><i class="fa fa-comment-o"></i><span>0</span></div>' +
        '<div class="side-btn"><i class="fa fa-bookmark-o"></i><span>0</span></div>' +
        '<div class="side-btn"><i class="fa fa-share-alt"></i><span>แชร์</span></div>' +
        '<div class="side-btn music-icon"><i class="fa fa-music"></i></div>' +
      '</div>';
    list.appendChild(slide);
  });
}

function openPostBox() {
  selectedFile = null;
  videoDuration = 0;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = null;
  
  document.getElementById('fileChoose').value = '';
  document.getElementById('fileInfo').classList.add('hidden');
  document.getElementById('audioSection').style.display = 'none';
  document.getElementById('progressContainer').style.display = 'none';
  document.getElementById('uploadStatus').innerText = '';
  document.getElementById('publishBtn').disabled = false;
  document.getElementById('publishBtn').innerText = 'เผยแพร่';
  
  document.querySelectorAll('.audio-option').forEach(o => o.classList.remove('active'));
  document.getElementById('optOriginal').classList.add('active');
  document.querySelector('#optOriginal input').checked = true;
  
  document.getElementById('postBox').classList.remove('hidden');
}

function closePostBox() {
  document.getElementById('postBox').classList.add('hidden');
  if (previewUrl) URL.revokeObjectURL(previewUrl);
}

document.getElementById('fileChoose').addEventListener('change', async function(e) {
  if (!e.target.files || !e.target.files[0]) return;
  selectedFile = e.target.files[0];
  
  document.getElementById('showFileName').innerText = selectedFile.name;
  document.getElementById('showFileSize').innerText = formatFileSize(selectedFile.size);
  
  if (selectedFile.type.startsWith('video/')) {
    previewUrl = URL.createObjectURL(selectedFile);
    const vid = document.createElement('video');
    vid.src = previewUrl;
    vid.preload = 'metadata';
    
    vid.onloadedmetadata = function() {
      videoDuration = vid.duration;
      const ratio = vid.videoWidth + ':' + vid.videoHeight;
      document.getElementById('showDuration').innerText = formatDuration(vid.duration);
      document.getElementById('showRatio').innerText = ratio;
      document.getElementById('fileInfo').classList.remove('hidden');
      document.getElementById('audioSection').style.display = 'block';
    };
  } else {
    document.getElementById('showDuration').innerText = '--:--';
    document.getElementById('showRatio').innerText = 'รูปภาพ';
    document.getElementById('fileInfo').classList.remove('hidden');
    document.getElementById('audioSection').style.display = 'none';
  }
});

document.querySelectorAll('.audio-option').forEach(opt => {
  opt.addEventListener('click', function() {
    document.querySelectorAll('.audio-option').forEach(o => o.classList.remove('active'));
    this.classList.add('active');
    this.querySelector('input').checked = true;
  });
});

async function doPublish() {
  const btn = document.getElementById('publishBtn');
  const progressContainer = document.getElementById('progressContainer');
  const progressFill = document.getElementById('progressFill');
  const uploadStatus = document.getElementById('uploadStatus');
  
  if (!selectedFile) { 
    alert('กรุณาเลือกไฟล์ก่อน'); 
    return; 
  }
  
  btn.disabled = true;
  btn.innerText = 'กำลังอัปโหลด...';
  progressContainer.style.display = 'block';
  progressFill.style.width = '0%';
  uploadStatus.innerText = '⏳ กำลังอัปโหลด...';
  
  try {
    const formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('upload_preset', UPLOAD_PRESET);
    
    const uploadUrl = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;
    
    const res = await axios.post(uploadUrl, formData, {
      onUploadProgress: (p) => {
        const percent = Math.round((p.loaded * 100) / p.total);
        progressFill.style.width = percent + '%';
        uploadStatus.innerText = `⏳ กำลังอัปโหลด... ${percent}%`;
      }
    });

    postData.unshift({
      id: Date.now(),
      filename: selectedFile.name,
      cloudUrl: res.data.secure_url,
      publicId: res.data.public_id,
      isVideo: selectedFile.type.startsWith('video/'),
      name: 'Thaipodee Master',
      desc: '',
      fileSize: selectedFile.size,
      duration: videoDuration,
      likeCount: 0,
      liked: false
    });

    savePostsList();
    closePostBox();
    renderFeed();
    
    alert('✅ อัปโหลดสำเร็จ!\n\nทุกคนจะเห็นโพสต์นี้ทันที');
    
  } catch (err) {
    console.error(err);
    uploadStatus.innerText = '❌ ไม่สำเร็จ';
    alert('❌ ผิดพลาด:\n' + (err.response?.data?.error?.message || err.message));
  } finally {
    btn.disabled = false;
    btn.innerText = 'เผยแพร่';
  }
}

function toggleLike(postId) {
  const p = postData.find(x => x.id === postId);
  if (p) {
    p.liked = !p.liked;
    p.likeCount += p.liked ? 1 : -1;
    savePostsList();
    renderFeed();
  }
}

function goFeed() { window.scrollTo({top:0,behavior:'smooth'}); }
function goShop() { alert('ร้านค้า — พร้อมทำงาน'); }
function goInbox() { alert('กล่องข้อความ — พร้อมทำงาน'); }
function goProfile() { alert('โปรไฟล์ — พร้อมทำงาน'); }

document.addEventListener('DOMContentLoaded', loadPostsList);
</script>

</body>
</html>
