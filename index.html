<!-- ==============================================================
   ThaiPodee v1127 — แก้ข้อ1+ข้อ2 เท่านั้น
   อัปเดต: 29 กันยายน 2569 23:00 น.
   --------------------------------------------------------------
   ✅ ข้อที่1: จัดวางบนสุด — v1127 ขึ้นบนสุด ไม่มีกุญแจ
              แว่นขยายลงมา ห่างกัน กดได้ถนัด
   ✅ ข้อที่2: เปลี่ยนรูป+ชื่อโปรไฟล์ได้ — ตั้งชื่อแยกเครื่องได้
   ⚠️ ไม่แก้จุดอื่น — ปลอดภัย ไม่ล่ม
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
  body { background:#000; color:#fff; min-height:100vh; overflow:hidden; }

  /* ===== ข้อที่1: ส่วนบนสุด — จัดวางใหม่ ===== */
  .top-version {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 13px;
    color: #888;
    z-index: 100;
  }
  .search-icon {
    position: absolute;
    top: 36px; /* ลงมาห่างจากเวอร์ชัน */
    right: 16px;
    font-size: 20px;
    cursor: pointer;
    z-index: 100;
  }
  .tabs {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    font-size: 15px;
  }
  .tabs span { opacity: 0.5; }
  .tabs span.active { opacity: 1; border-bottom: 2px solid #fff; padding-bottom: 2px; }

  /* ===== วิดีโอพื้นที่ ===== */
  .video-container {
    position: absolute;
    top: 70px;
    bottom: 80px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-btn { font-size: 60px; opacity: 0.8; cursor: pointer; }

  /* ===== ไอคอนด้านขวา ===== */
  .side-icons {
    position: absolute;
    right: 12px;
    bottom: 100px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: center;
  }
  .side-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    gap: 4px;
  }
  .side-icon.p-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #333;
    overflow: hidden;
    border: 2px solid #555;
  }
  .side-icon.p-avatar img { width:100%; height:100%; object-fit:cover; }
  .side-icon span { font-size: 11px; opacity: 0.7; }

  /* ===== แถบล่าง ===== */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 75px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: #000;
    border-top: 1px solid #222;
  }
  .nav-item { text-align: center; cursor: pointer; }
  .nav-item .plus-btn {
    width: 48px; height: 32px;
    background: #f00;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
  }

  /* ===== ข้อที่2: หน้าแก้ไขโปรไฟล์ ===== */
  .edit-profile-overlay {
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.92);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
  }
  .edit-profile-overlay.show { display: flex; }
  .edit-avatar {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: #333;
    margin-bottom: 20px;
    overflow: hidden;
    border: 3px solid #666;
    cursor: pointer;
  }
  .edit-avatar img { width:100%; height:100%; object-fit:cover; }
  .edit-input {
    width: 100%;
    max-width: 320px;
    padding: 12px 16px;
    font-size: 16px;
    background: #222;
    border: 1px solid #444;
    color: #fff;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .edit-buttons {
    display: flex; gap: 12px;
  }
  .edit-btn {
    padding: 10px 24px;
    border-radius: 6px;
    border: none;
    font-size: 15px;
    cursor: pointer;
  }
  .edit-btn.save { background: #00c853; color: #fff; }
  .edit-btn.cancel { background: #444; color: #fff; }

  /* ===== ข้อมูลล่างวิดีโอ ===== */
  .video-info {
    position: absolute;
    bottom: 90px;
    left: 12px;
    right: 70px;
  }
  .video-info .acc-name { font-weight: bold; margin-bottom: 4px; }
  .video-info .desc { font-size: 13px; opacity: 0.8; }
</style>
</head>
<body>

<!-- ข้อที่1: บนสุด — ไม่มีกุญแจ -->
<div class="top-version">v1127</div>

<div class="tabs">
  <span>กำลังติดตาม</span>
  <span class="active">สำหรับคุณ</span>
</div>

<!-- แว่นขยายลงมา ห่างกัน -->
<div class="search-icon" onclick="alert('ค้นหา — จะเพิ่มเติมในรุ่นต่อไป')">🔍</div>

<!-- วิดีโอตรงกลาง -->
<div class="video-container">
  <div class="play-btn">▶</div>
</div>

<!-- ข้อมูลใต้วิดีโอ -->
<div class="video-info">
  <div class="acc-name" id="display-name">@ThaiPodee</div>
  <div class="desc">Lamai Plai Mat Nights — สินค้าและบริการ</div>
</div>

<!-- ไอคอนด้านขวา -->
<div class="side-icons">
  <div class="side-icon p-avatar" onclick="openEditProfile()">
    <img id="avatar-img" src="https://via.placeholder.com/100" alt="โปรไฟล์">
  </div>
  <div class="side-icon">❤️<span id="like-count">27</span></div>
  <div class="side-icon">💬<span>0</span></div>
  <div class="side-icon">📌<span>0</span></div>
  <div class="side-icon">↗️<span>0</span></div>
  <div class="side-icon">🎵<span>3:02</span></div>
</div>

<!-- แถบล่าง -->
<div class="bottom-nav">
  <div class="nav-item">🏠<br>หน้าหลัก</div>
  <div class="nav-item">🛒<br>ร้านค้า</div>
  <div class="nav-item"><div class="plus-btn">+</div></div>
  <div class="nav-item">💬<br>ข้อความ</div>
  <div class="nav-item" onclick="openEditProfile()">👤<br>โปรไฟล์</div>
</div>

<!-- ข้อที่2: หน้าแก้ไขโปรไฟล์ -->
<div class="edit-profile-overlay" id="edit-profile-panel">
  <h3 style="margin-bottom:20px">ตั้งค่าโปรไฟล์</h3>
  <div class="edit-avatar" onclick="changeAvatar()">
    <img id="edit-avatar-preview" src="https://via.placeholder.com/100" alt="รูป">
  </div>
  <input type="text" class="edit-input" id="name-input" placeholder="ตั้งชื่อ เช่น เครื่องที่ 1">
  <div class="edit-buttons">
    <button class="edit-btn cancel" onclick="closeEditProfile()">ยกเลิก</button>
    <button class="edit-btn save" onclick="saveProfile()">บันทึก</button>
  </div>
</div>

<script>
// โหลดที่บันทึกไว้
let savedName = localStorage.getItem('userDisplayName') || '@ThaiPodee';
let savedAvatar = localStorage.getItem('userAvatar') || 'https://via.placeholder.com/100';

document.getElementById('display-name').textContent = savedName;
document.getElementById('avatar-img').src = savedAvatar;
document.getElementById('edit-avatar-preview').src = savedAvatar;
document.getElementById('name-input').value = savedName.replace('@','');

// เปิด-ปิด แก้ไข
function openEditProfile() {
  document.getElementById('edit-profile-panel').classList.add('show');
}
function closeEditProfile() {
  document.getElementById('edit-profile-panel').classList.remove('show');
}

// เปลี่ยนรูป (ตัวอย่าง — ใส่ลิงก์รูปได้เลย)
function changeAvatar() {
  const newUrl = prompt('ใส่ลิงก์รูปภาพ (หรือวางที่อยู่รูปของคุณ):');
  if (newUrl && newUrl.trim()) {
    savedAvatar = newUrl.trim();
    document.getElementById('avatar-img').src = savedAvatar;
    document.getElementById('edit-avatar-preview').src = savedAvatar;
    localStorage.setItem('userAvatar', savedAvatar);
  }
}

// บันทึกชื่อ
function saveProfile() {
  let name = document.getElementById('name-input').value.trim();
  if (!name) { alert('กรุณาใส่ชื่อ'); return; }
  if (!name.startsWith('@')) name = '@' + name;
  savedName = name;
  document.getElementById('display-name').textContent = savedName;
  localStorage.setItem('userDisplayName', savedName);
  closeEditProfile();
  alert('บันทึกแล้ว! ตอนนี้ชื่อ: ' + savedName);
}
</script>

</body>
</html>
