   เวอร์ชัน: v90 จบปัญหา
   วันที่: 24 ก.ย. 2569
   แก้: 1.เปลี่ยนชื่อได้  2.โพสต์วิดีโอได้ ปกขึ้น
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiPodee</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
html,body{height:100%;background:#fff;}

.top-bar{height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid #eee;}
.profile{padding:16px;text-align:center;}
.avatar{width:90px;height:90px;border-radius:50%;margin:0 auto 10px;overflow:hidden;cursor:pointer;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.p-name{font-size:16px;font-weight:bold;color:#d00;margin-bottom:4px;}
.p-user{font-size:13px;color:#666;margin-bottom:8px;cursor:pointer;}
.p-bio{font-size:13px;color:#333;margin-bottom:12px;}

.stats{display:flex;justify-content:center;gap:32px;margin-bottom:12px;}
.stat-num{font-size:18px;font-weight:bold;}
.stat-label{font-size:11px;color:#666;}

.btns{display:flex;justify-content:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.btn-red{background:#d00;color:#fff;border:none;padding:8px 24px;border-radius:6px;cursor:pointer;}
.btn-grey{background:#eee;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;}
.btn-edit{background:#fff9c4;border:1px solid #fdd835;padding:8px 16px;border-radius:6px;cursor:pointer;}

.tabs{display:flex;justify-content:center;border-bottom:1px solid #eee;margin-bottom:4px;}
.tab{padding:10px 16px;font-size:13px;color:#666;cursor:pointer;}
.tab.active{border-bottom:2px solid #000;color:#000;font-weight:bold;}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;}
.thumb{aspect-ratio:9/16;background:#f0f0f0;overflow:hidden;cursor:pointer;position:relative;}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;}
.play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;color:#fff;text-shadow:0 0 4px #000;pointer-events:none;}
.empty{display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;border:1px dashed #ddd;}

.player{position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column;}
.player.active{display:flex;}
.p-top{padding:12px 16px;display:flex;align-items:center;background:rgba(0,0,0,.7);}
.back{color:#fff;font-size:22px;cursor:pointer;margin-right:12px;}
.p-body{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;}
.p-media{max-width:100%;max-height:85vh;}

.bottom{position:fixed;bottom:0;left:0;right:0;height:65px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #eee;background:#fff;}
.b-item{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#666;gap:2px;cursor:pointer;}
.b-item.active{color:#000;}
.b-add{width:48px;height:36px;background:#000;color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;}

.hidden{display:none;}
</style>
</head>
<body>

<div class="top-bar">
  <span></span><span>thaipodee</span><span>⋮</span>
</div>

<div class="profile">
  <div class="avatar" id="avtBtn">
    <img id="avtImg" src="https://picsum.photos/id/1012/100/100">
  </div>
  <div class="p-name" id="pName">THAIPODEE PRODUCT ENGINEERING</div>
  <div class="p-user" id="pUser">@thaipodee-official</div>
  <div class="p-bio" id="pBio">รับจ้างผลิตชิ้นงานกลึง มิลลิ่ง เชื่อม ประกอบชุดงาน</div>

  <div class="stats">
    <div><div class="stat-num" id="sPost">1</div><div class="stat-label">โพสต์</div></div>
    <div><div class="stat-num" id="sFollow">1,238</div><div class="stat-label">ผู้ติดตาม</div></div>
    <div><div class="stat-num" id="sFollowing">2,748</div><div class="stat-label">กำลังติดตาม</div></div>
  </div>

  <div class="btns">
    <button class="btn-red">กดติดตาม</button>
    <button class="btn-grey" id="shareBtn">แชร์โปรไฟล์</button>
    <button class="btn-edit" id="editBtn">✏️ แก้ไข</button>
  </div>

  <div class="tabs">
    <div class="tab active">โพสต์</div>
    <div class="tab">วิดีโอ</div>
    <div class="tab">ถูกใจ</div>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="player" id="player">
  <div class="p-top"><span class="back" id="backBtn">←</span></div>
  <div class="p-body">
    <video id="vVid" controls playsinline class="p-media" style="display:none;"></video>
    <img id="vImg" class="p-media" style="display:none;">
  </div>
</div>

<div class="bottom">
  <div class="b-item"><span>🏠</span><span>หน้าหลัก</span></div>
  <div class="b-item"><span>🔍</span><span>ค้นหา</span></div>
  <div class="b-item" id="addBtn"><span class="b-add">+</span></div>
  <div class="b-item"><span>💬</span><span>ข้อความ</span></div>
  <div class="b-item active"><span>👤</span><span>โปรไฟล์</span></div>
</div>

<input type="file" id="avtInput" accept="image/*" class="hidden">
<input type="file" id="fileInput" accept="image/*,video/*,.mp4,.mov" class="hidden">

<script>
let P = {
  avt: localStorage.avt || 'https://picsum.photos/id/1012/100/100',
  name: localStorage.pname || 'THAIPODEE PRODUCT ENGINEERING',
  user: localStorage.puser || '@thaipodee-official',
  bio: localStorage.pbio || 'รับจ้างผลิตชิ้นงานกลึง มิลลิ่ง เชื่อม ประกอบชุดงาน',
  post: localStorage.cPost || '1',
  follow: localStorage.cFollow || '1,238',
  following: localStorage.cFollowing || '2,748'
};
let list = JSON.parse(local.plist || '[]');
let idx = -1;

function save(){
  localStorage.avt=P.avt;localStorage.pname=P.name;localStorage.puser=P.user;
  localStorage.pbio=P.bio;localStorage.cPost=P.post;localStorage.cFollow=P.follow;
  localStorage.cFollowing=P.following;localStorage.plist=JSON.stringify(list);
}

function show(){
  document.getElementById('avtImg').src=P.avt;
  document.getElementById('pName').textContent=P.name;
  document.getElementById('pUser').textContent=P.user;
  document.getElementById('pBio').textContent=P.bio;
  document.getElementById('sPost').textContent=P.post;
  document.getElementById('sFollow').textContent=P.follow;
  document.getElementById('sFollowing').textContent=P.following;

  let g=document.getElementById('grid');g.innerHTML='';
  if(!list.length){
    for(let i=0;i<3;i++){
      let d=document.createElement('div');d.className='thumb empty';
      d.textContent='กด + เพิ่ม';g.appendChild(d);
    }
    return;
  }
  list.forEach((it,i)=>{
    let d=document.createElement('div');d.className='thumb';
    if(it.t==='vid'){
      d.innerHTML=`<video src="${it.src}" muted preload="metadata"></video><span class="play-icon">▶</span>`;
    }else{
      d.innerHTML=`<img src="${it.src}">`;
    }
    d.onclick=()=>openVid(i);
    g.appendChild(d);
  });
}

function openVid(i){
  idx=i;let it=list[i];
  document.getElementById('vVid').style.display='none';
  document.getElementById('vImg').style.display='none';
  document.getElementById('vVid').pause();
  if(it.t==='vid'){
    document.getElementById('vVid').src=it.src;
    document.getElementById('vVid').style.display='block';
    document.getElementById('vVid').play().catch(()=>{});
  }else{
    document.getElementById('vImg').src=it.src;
    document.getElementById('vImg').style.display='block';
  }
  document.getElementById('player').classList.add('active');
}
document.getElementById('backBtn').onclick=()=>{
  document.getElementById('player').classList.remove('active');
  document.getElementById('vVid').pause();
  document.getElementById('vVid').src='';
  idx=-1;
};

// เปลี่ยนรูป
document.getElementById('avtBtn').onclick=()=>document.getElementById('avtInput').click();
document.getElementById('avtInput').onchange=e=>{
  let f=e.target.files[0];if(!f)return;
  let r=new FileReader();r.onload=ev=>{P.avt=ev.target.result;save();show();alert('✅ เปลี่ยนรูปแล้ว');};
  r.readAsDataURL(f);
};

// แก้ไขทั้งหมด — ชื่อผู้ใช้เปลี่ยนได้แน่นอน
document.getElementById('editBtn').onclick=()=>{
  let n=prompt('ชื่อแสดง:',P.name);if(n)P.name=n.trim();
  let u=prompt('ชื่อผู้ใช้:',P.user);if(u)P.user=u.trim();
  let b=prompt('คำอธิบาย:',P.bio);if(b)P.bio=b.trim();
  let s=prompt('จำนวนโพสต์:',P.post);if(s)P.post=s.trim();
  let f=prompt('ผู้ติดตาม:',P.follow);if(f)P.follow=f.trim();
  let g=prompt('กำลังติดตาม:',P.following);if(g)P.following=g.trim();
  save();show();alert('✅ อัปเดตเรียบร้อย');
};

// เพิ่มวิดีโอ/รูป — ปกขึ้นทันที
document.getElementById('addBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{
  let f=e.target.files[0];if(!f)return;
  let isVid=f.type.startsWith('video/');
  let r=new FileReader();r.onload=ev=>{
    list.unshift({src:ev.target.result,t:isVid?'vid':'img'});
    P.post=String(list.length);
    save();show();alert('✅ เพิ่มเรียบร้อย — ปกขึ้นแล้ว กดเพื่อเล่น');
  };
  r.readAsDataURL(f);
};

// แชร์
document.getElementById('shareBtn').onclick=()=>{
  navigator.clipboard.writeText(location.href).then(()=>alert('✅ คัดลอกลิงก์แล้ว'));
};

show();
</script>
</body>
</html>
