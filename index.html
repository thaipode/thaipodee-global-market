<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="ThaiPodee — วิดีโอ & ช้อปปิ้ง">
<meta name="version" content="ver.1">
<title>ThaiPodee</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;color:#fff;overflow:hidden;font-family:-apple-system,Segoe UI,Roboto,sans-serif}

/* หน้าหลัก */
.app-container{width:100%;height:100%;position:relative}
.video-feed{width:100%;height:100vh;position:relative}
.video-card{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}

/* วิดีโอ */
video{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}

/* ข้อมูลวิดีโอ */
.video-info{position:absolute;bottom:110px;left:16px;right:90px;z-index:10}
.user-name{font-weight:bold;font-size:15px;margin-bottom:6px}
.video-desc{font-size:13px;color:#eee;line-height:1.4;margin-bottom:8px}
.music-line{font-size:12px;color:#ddd;display:flex;align-items:center;gap:6px}

/* ปุ่มด้านขวา */
.side-actions{position:absolute;right:12px;bottom:120px;display:flex;flex-direction:column;align-items:center;gap:22px;z-index:10}
.action-btn{display:flex;flex-direction:column;align-items:center;color:#fff;text-decoration:none;font-size:11px;gap:4px}
.action-icon{font-size:24px;line-height:1}
.avatar{width:44px;height:44px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;margin-bottom:4px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.music-disc{width:44px;height:44px;border-radius:50%;background:linear-gradient(45deg,#f60,#c00);display:flex;align-items:center;justify-content:center;animation:spin 3s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* แถบเมนูล่าง */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{display:flex;flex-direction:column;align-items:center;color:#fff;text-decoration:none;font-size:10px;gap:3px}
.nav-icon{font-size:22px;line-height:1}
.nav-center{width:44px;height:30px;background:linear-gradient(180deg,#fff,#ddd);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold;font-size:16px}

/* ซ่อนข้อความรอโหลด */
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#aaa;font-size:14px;z-index:5}
</style>
</head>
<body>
<!-- ThaiPodee ver.1 — อัปโหลดขึ้น GitHub/Render ได้เลย -->

<div class="app-container">
  <div class="video-feed">
    <div class="video-card">
      
      <!-- วิดีโอ: เปลี่ยนชื่อไฟล์ตามที่อัปโหลดจริง -->
      <video id="mainVideo" muted loop playsinline preload="auto">
        <source src="vid1.mp4" type="video/mp4">
        <source src="https://firebasestorage.googleapis.com/v0/b/thai-podee.appspot.com/o/sample.mp4?alt=media" type="video/mp4">
        ไม่รองรับวิดีโอ
      </video>

      <div class="loading" id="loadingMsg">กำลังโหลด...</div>
      
      <!-- ข้อมูล -->
      <div class="video-info">
        <div class="user-name">@ThaiPodee_Official</div>
        <div class="video-desc">ยินดีต้อนรับสู่ ThaiPodee! 🎉<br>วิดีโอทดลอง — แทนที่ด้วยวิดีโอของคุณเองได้เลย</div>
        <div class="music-line">🎵 เสียงเพลงตัวอย่าง — ThaiPodee</div>
      </div>

      <!-- ปุ่มด้านขวา -->
      <div class="side-actions">
        <div class="avatar">👤</div>
        <a class="action-btn" href="javascript:;">
          <span class="action-icon">❤️</span>
          <span>1.2K</span>
        </a>
        <a class="action-btn" href="javascript:;">
          <span class="action-icon">💬</span>
          <span>89</span>
        </a>
        <a class="action-btn" href="javascript:;">
          <span class="action-icon">⭐</span>
          <span>บันทึก</span>
        </a>
        <a class="action-btn" href="javascript:;">
          <span class="action-icon">📤</span>
          <span>แชร์</span>
        </a>
        <div class="music-disc">🎵</div>
      </div>
    </div>
  </div>
</div>

<!-- เมนูล่าง -->
<nav class="bottom-nav">
  <a class="nav-item" href="javascript:;">
    <span class="nav-icon">🏠</span>
    <span>หน้าแรก</span>
  </a>
  <a class="nav-item" href="javascript:;">
    <span class="nav-icon">🔍</span>
    <span>ค้นหา</span>
  </a>
  <a class="nav-item" href="javascript:;">
    <span class="nav-center">+</span>
  </a>
  <a class="nav-item" href="javascript:;">
    <span class="nav-icon">🛒</span>
    <span>ร้านค้า</span>
  </a>
  <a class="nav-item" href="javascript:;">
    <span class="nav-icon">👤</span>
    <span>โปรไฟล์</span>
  </a>
</nav>

<script>
const video = document.getElementById('mainVideo');
const loading = document.getElementById('loadingMsg');

// เปิดผ่านลิงก์เว็บ → แตะครั้งเดียวเล่นได้เลย
document.addEventListener('click', function startPlay() {
  video.play()
    .then(() => { loading.style.display = 'none'; })
    .catch(err => { loading.textContent = 'แตะหน้าจอเพื่อเล่น'; });
}, { once: true });

// โหลดเสร็จซ่อนข้อความ
video.addEventListener('canplay', () => {
  loading.style.display = 'none';
});
</script>

</body>
</html>
