<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="thaipodee">

  <link rel="icon" type="image/png" sizes="192x192" href="./thaipodee_logo_icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./thaipodee_logo_icon.png">

  <title>thaipodee Global Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; background: #000; color: #fff;
      font-family: sans-serif;
      -webkit-overflow-scrolling: touch;
    }
    .version-tag {
      position: fixed; top: 10px; right: 10px;
      background: rgba(0,0,0,0.6); color: #10b981;
      font-size: 11px; padding: 3px 8px; border-radius: 10px;
      z-index: 100;
    }
    .status-bar {
      position: fixed; top: 10px; left: 10px; right: 80px;
      background: rgba(22, 163, 74, 0.2); color: #4ade80;
      font-size: 12px; padding: 6px 10px; border-radius: 6px;
      z-index: 100; display: none;
    }
    .status-bar.show { display: block; }
    .page {
      display: none; min-height: 100vh; padding-bottom: 80px; padding-top: 45px;
    }
    .page.active { display: block; }
    .splash {
      position: fixed; inset: 0; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 200; transition: opacity 0.4s ease;
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .logo {
      width: 180px; height: 180px;
      background: url('./thaipodee_logo_icon.png') no-repeat center;
      background-size: contain; margin-bottom: 16px;
    }
    .logo-text { font-size: 22px; font-weight: bold; }
    .logo-sub { font-size: 13px; color: #888; margin-top: 6px; }

    .post-card {
      border-bottom: 1px solid #222; padding: 16px;
    }
    .media-box {
      width: 100%; aspect-ratio: 9/16; background: #1a1a1a; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; margin: 10px 0;
      position: relative; overflow: hidden;
    }
    .media-box i { font-size: 48px; color: #666; }
    .media-box.has-thumbnail {
      background-size: cover; background-position: center;
    }
    .media-box.has-thumbnail i {
      background: rgba(0,0,0,0.5); border-radius: 50%; padding: 20px;
    }
    .meta { font-size: 12px; color: #888; margin: 4px 0; }
    .title { font-weight: bold; font-size: 15px; margin: 6px 0; }

    .right-buttons {
      position: fixed; right: 12px; bottom: 15%;
      display: flex; flex-direction: column; gap: 22px; z-index: 50;
    }
    .r-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .r-btn i { font-size: 26px; }
    .r-btn span { font-size: 10px; margin-top: 3px; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000;
      display: flex; justify-content: space-around; align-items: center;
      border-top: 1px solid #222; z-index: 50;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .nav-item i { font-size: 22px; }
    .nav-item span { font-size: 10px; margin-top: 2px; }
    .plus-btn {
      width: 48px; height: 34px; background: linear-gradient(90deg, #ff2e55, #ff6b4a);
      border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .progress-bar {
      width: 100%; height: 6px; background: #333; border-radius: 3px; margin-top: 10px; display: none;
    }
    .progress-bar.show { display: block; }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, #10b981, #34d399);
      border-radius: 3px; width: 0%; transition: width 0.3s ease;
    }
  </style>
</head>
<body>

<div class="status-bar" id="statusBar"></div>
<div class="version-tag">v4.7.4</div>

<!-- หน้าเริ่มต้น -->
<div id="splash" class="splash">
  <div class="logo"></div>
  <div class="logo-text">thaipodee</div>
  <div class="logo-sub">Global Market — ตลาดโลก</div>
</div>

<!-- หน้าหลัก -->
<div id="home" class="page active">
  <div class="right-buttons">
    <div class="r-btn" data-to="profile"><i class="fas fa-user"></i><span>โปรไฟล์</span></div>
    <div class="r-btn"><i class="far fa-heart"></i><span id="likeCount">0</span></div>
    <div class="r-btn"><i class="far fa-comment"></i><span>0</span></div>
    <div class="r-btn"><i class="far fa-bookmark"></i><span>บันทึก</span></div>
    <div class="r-btn" id="shareBtn"><i class="fas fa-share"></i><span>แชร์</span></div>
    <div class="r-btn"><i class="fas fa-ellipsis-v"></i><span>เพิ่มเติม</span></div>
  </div>

  <div id="postsContainer" style="padding: 12px;">
    <!-- โพสต์จะแสดงที่นี่ -->
  </div>

  <div class="bottom-nav">
    <div class="nav-item" data-to="home"><i class="fas fa-home"></i><span>หน้าแรก</span></div>
    <div class="nav-item"><i class="fas fa-search"></i><span>ค้นหา</span></div>
    <div class="nav-item" data-to="upload"><div class="plus-btn"><i class="fas fa-plus"></i></div></div>
    <div class="nav-item"><i class="far fa-comment-dots"></i><span>ข้อความ</span></div>
    <div class="nav-item" data-to="profile"><i class="far fa-user"></i><span>ฉัน</span></div>
  </div>
</div>

<!-- หน้าอัปโหลด -->
<div id="upload" class="page">
  <div class="p-4">
    <button class="mb-4 text-lg" data-to="home"><i class="fas fa-arrow-left"></i> กลับ</button>
    <h3 class="text-xl font-bold mb-4">โพสต์วิดีโอ / รูปภาพ</h3>
    <input type="file" id="fileInput" accept="video/*,image/*" class="w-full p-3 bg-gray-800 rounded-lg mb-3">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <button id="postBtn" class="w-full py-3 rounded-lg font-bold bg-gradient-to-r from-pink-600 to-orange-500 mt-3">เผยแพร่</button>
  </div>
</div>

<!-- หน้าโปรไฟล์ -->
<div id="profile" class="page">
  <div class="p-4">
    <button class="mb-4 text-lg" data-to="home"><i class="fas fa-arrow-left"></i> กลับ</button>
    <h3 class="text-xl font-bold mb-3">โปรไฟล์</h3>
    <p class="text-gray-400 mb-2">ชื่อ: thaipodee</p>
    <p class="text-gray-400 mb-2">จำนวนโพสต์: <span id="postCount">0</span></p>
    <p class="text-gray-400">เริ่มใช้งาน: 21 กันยายน 2569</p>
  </div>
</div>

<script>
let posts = [];

// === โหลดโพสต์ที่บันทึกไว้ ===
function loadPosts() {
  const saved = localStorage.getItem('thaipodee_posts');
  if (saved) {
    posts = JSON.parse(saved);
  } else {
    posts = [{
      id: 'welcome',
      title: 'ยินดีต้อนรับสู่ thaipodee Global Market',
      author: 'thaipodee',
      date: '21 ก.ย. 69',
      type: 'video',
      aspect: '9:16',
      source: 'original',
      thumbnail: null
    }];
    savePosts();
  }
  renderPosts();
}

function savePosts() {
  localStorage.setItem('thaipodee_posts', JSON.stringify(posts));
}

function renderPosts() {
  const container = document.getElementById('postsContainer');
  container.innerHTML = '';
  
  posts.forEach(p => {
    const thumbStyle = p.thumbnail 
      ? `background-image: url('${p.thumbnail}');` 
      : '';
      
    container.innerHTML += `
      <div class="post-card">
        <div class="meta">${p.author} · ${p.date} · ${p.source === 'original' ? 'ต้นฉบับ' : 'เพิ่มเสียง'}</div>
        <div class="title">${p.title}</div>
        <div class="media-box ${p.thumbnail ? 'has-thumbnail' : ''}" style="${thumbStyle}">
          <i class="fas fa-${p.type === 'video' ? 'play-circle' : 'image'}"></i>
        </div>
        <div class="meta">${p.aspect || '9:16'} · พร้อมใช้งาน</div>
      </div>
    `;
  });
  
  document.getElementById('postCount').textContent = posts.length;
}

// === แสดงสถานะ ===
function showStatus(text, duration = 2000) {
  const bar = document.getElementById('statusBar');
  bar.textContent = text;
  bar.classList.add('show');
  if (duration > 0) {
    setTimeout(() => bar.classList.remove('show'), duration);
  }
}

// === หน้าเริ่มต้นหายไปเอง ===
setTimeout(() => {
  document.getElementById('splash').classList.add('hide');
  loadPosts();
}, 1200);

// === เปลี่ยนหน้า ===
document.querySelectorAll('[data-to]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(btn.dataset.to).classList.add('active');
    window.scrollTo(0, 0);
  });
});

// === แชร์ลิงก์ ===
document.getElementById('shareBtn').addEventListener('click', async () => {
  const link = `✅ Thaipodee Global Market
🔗 ลิงก์:
https://thaipodee-global-market-v2026-new.onrender.com/

📌 เปิดใน Chrome → กดจุด 3 → เพิ่มไปที่หน้าจอหลัก`;
  if (navigator.share) {
    await navigator.share({title: 'thaipodee', text: link});
  } else {
    await navigator.clipboard.writeText(link);
    alert('คัดลอกข้อความแล้ว ✅');
  }
});

// === อัปโหลดพร้อมแถบสถานะ ===
document.getElementById('postBtn').addEventListener('click', async () => {
  const fileInput = document.getElementById('fileInput');
  const file = fileInput.files[0];
  
  if (!file) {
    alert('เลือกไฟล์วิดีโอหรือรูปภาพก่อนครับ');
    return;
  }

  showStatus('กำลังอ่านไฟล์...', 0);
  document.getElementById('progressBar').classList.add('show');
  
  // จำลองความคืบหน้า
  let progress = 0;
  const progressFill = document.getElementById('progressFill');
  const progressInterval = setInterval(() => {
    progress += Math.random() * 15;
    if (progress > 90) progress = 90;
    progressFill.style.width = progress + '%';
  }, 200);

  // สร้างรูปหน้าปกวิดีโอ
  let thumbnail = null;
  if (file.type.startsWith('video')) {
    try {
      thumbnail = await generateVideoThumbnail(file);
    } catch (e) {
      console.log('สร้างรูปปกไม่สำเร็จ');
    }
  }

  // จำลองการอัปโหลดเสร็จ
  setTimeout(() => {
    clearInterval(progressInterval);
    progressFill.style.width = '100%';
    
    const now = new Date();
    const dateStr = `${now.getDate()} ก.ย. ${String(now.getFullYear()).slice(-2)}`;
    
    posts.unshift({
      id: Date.now(),
      title: file.name.replace(/\.[^/.]+$/, ''),
      author: 'thaipodee',
      date: dateStr,
      type: file.type.startsWith('video') ? 'video' : 'image',
      aspect: '9:16',
      source: 'original',
      thumbnail: thumbnail
    });
    
    savePosts();
    renderPosts();
    
    showStatus('เผยแพร่สำเร็จ ✅');
    setTimeout(() => {
      document.getElementById('progressBar').classList.remove('show');
      progressFill.style.width = '0%';
      fileInput.value = '';
      
      // กลับหน้าแรก
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('home').classList.add('active');
    }, 1000);
  }, 2000);
});

// === สร้างรูปปกวิดีโออัตโนมัติ ===
function generateVideoThumbnail(file) {
  return new Promise((resolve) => {
    const video = document.createElement('video');
    video.src = URL.createObjectURL(file);
    video.currentTime = 1; // ที่วินาทีที่ 1
    video.crossOrigin = 'anonymous';
    
    video.onloadeddata = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 320;
      canvas.height = 568;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(video.src);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    
    // ถ้าโหลดไม่ได้ ให้ข้าม
    setTimeout(() => resolve(null), 3000);
  });
}
</script>
</body>
</html>
