  <div class="popup-buttons">
    <button class="popup-btn btn-cancel" id="cancel-name-btn">ยกเลิก</button>
    <button class="popup-btn btn-save" id="save-name-btn">บันทึก</button>
  </div>
</div>

<script>
const DB_NAME = 'ThaiPodeeDB';
const STORE_NAME = 'videos';
let videoList = [];
let currentIndex = 0;
let isPlaying = false;
let deferredPrompt = null;

// ติดตั้งแอป
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  } else {
    alert('กดจุด 3 จุด มุมขวาบน ⋮ → เพิ่มในหน้าจอหลัก → ติดตั้ง');
  }
  document.getElementById('install-banner').style.display = 'none';
});
document.getElementById('later-btn').addEventListener('click', () => {
  document.getElementById('install-banner').style.display = 'none';
});

// ฐานข้อมูล IndexedDB
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        store.createIndex('timestamp', 'timestamp');
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = reject;
  });
}
async function saveVideoToDB(videoData) {
  const db = await openDB();
  return new Promise(resolve => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).add({ ...videoData, timestamp: Date.now() });
    tx.oncomplete = () => { db.close(); resolve(); };
  });
}
async function loadAllVideos() {
  const db = await openDB();
  return new Promise(resolve => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = e => {
      db.close();
      resolve(e.target.result.sort((a,b) => b.timestamp - a.timestamp));
    };
  });
}
async function deleteVideoFromDB(id) {
  const db = await openDB();
  return new Promise(resolve => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => { db.close(); resolve(); };
  });
}

// โปรไฟล์
let profileName = localStorage.getItem('profileName') || 'ThaiPodee';
let displayName = localStorage.getItem('displayName') || '@thaipodee';
document.getElementById('profile-name-text').textContent = profileName;
document.getElementById('display-username').textContent = displayName;

document.getElementById('edit-name-btn').addEventListener('click', () => {
  document.getElementById('new-name-input').value = profileName;
  document.getElementById('name-popup').style.display = 'block';
});
document.getElementById('cancel-name-btn').addEventListener('click', () => {
  document.getElementById('name-popup').style.display = 'none';
});
document.getElementById('save-name-btn').addEventListener('click', () => {
  const newName = document.getElementById('new-name-input').value.trim();
  if (newName) {
    profileName = newName;
    displayName = '@' + newName.replace(/\s+/g, '_');
    localStorage.setItem('profileName', profileName);
    localStorage.setItem('displayName', displayName);
    document.getElementById('profile-name-text').textContent = profileName;
    document.getElementById('display-username').textContent = displayName;
  }
  document.getElementById('name-popup').style.display = 'none';
});

// เปลี่ยนรูปโปรไฟล์
document.getElementById('profile-avatar-box').addEventListener('click', () => {
  document.getElementById('avatar-input').click();
});
document.getElementById('avatar-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    const src = evt.target.result;
    document.getElementById('avatar-display').src = src;
    document.getElementById('profile-avatar-img').src = src;
  };
  reader.readAsDataURL(file);
});

// อัปโหลดวิดีโอ
document.getElementById('upload-btn').addEventListener('click', () => {
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file || !file.type.startsWith('video/')) {
    alert('ไม่ใช่ไฟล์วิดีโอ');
    return;
  }
  const url = URL.createObjectURL(file);
  await saveVideoToDB({ name: file.name, type: file.type, size: file.size, url });
  videoList = await loadAllVideos();
  renderVideoGrid();
  currentIndex = 0;
  loadVideo(0);
  alert(`อัปโหลดสำเร็จ! รวม ${videoList.length} รายการ`);
});

// แสดงวิดีโอ
function loadVideo(idx) {
  if (!videoList[idx]) return;
  const v = videoList[idx];
  const video = document.getElementById('main-video');
  video.src = v.url;
  video.style.display = 'block';
  document.getElementById('play-overlay').style.display = 'none';
  document.getElementById('video-desc').textContent = v.name;
  isPlaying = true;
}

// เล่น-หยุด แตะหน้าจอ
document.getElementById('video-container').addEventListener('click', () => {
  const video = document.getElementById('main-video');
  if (!video.src) return;
  if (isPlaying) {
    video.pause();
    document.getElementById('play-overlay').style.display = 'flex';
    isPlaying = false;
  } else {
    video.play();
    document.getElementById('play-overlay').style.display = 'none';
    isPlaying = true;
  }
});
document.getElementById('play-overlay').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('main-video').play();
  document.getElementById('play-overlay').style.display = 'none';
  isPlaying = true;
});

// สไลด์เปลี่ยนวิดีโอ
let touchStartY = 0;
document.getElementById('video-container').addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
});
document.getElementById('video-container').addEventListener('touchend', e => {
  const touchEndY = e.changedTouches[0].clientY;
  const diff = touchStartY - touchEndY;
  if (Math.abs(diff) > 50) {
    if (diff > 0 && currentIndex < videoList.length - 1) {
      currentIndex++;
      loadVideo(currentIndex);
    } else if (diff < 0 && currentIndex > 0) {
      currentIndex--;
      loadVideo(currentIndex);
    }
  }
});

// แสดงตารางวิดีโอในโปรไฟล์
function renderVideoGrid() {
  const grid = document.getElementById('videos-grid');
  grid.innerHTML = '';
  videoList.forEach((v, idx) => {
    const thumb = document.createElement('div');
    thumb.className = 'video-thumb';
    thumb.innerHTML = `
      <video src="${v.url}" muted></video>
      <button class="delete-thumb-btn" data-id="${v.id}">×</button>
    `;
    thumb.addEventListener('click', e => {
      if (!e.target.classList.contains('delete-thumb-btn')) {
        currentIndex = idx;
        loadVideo(idx);
        document.getElementById('profile-page').style.display = 'none';
      }
    });
    grid.appendChild(thumb);
  });
  // ปุ่มลบ
  document.querySelectorAll('.delete-thumb-btn').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      if (confirm('ลบวิดีโอนี้?')) {
        await deleteVideoFromDB(id);
        videoList = await loadAllVideos();
        renderVideoGrid();
        if (videoList.length === 0) {
          document.getElementById('main-video').src = '';
          document.getElementById('main-video').style.display = 'none';
          document.getElementById('play-overlay').style.display = 'flex';
          document.getElementById('video-desc').textContent = 'กดปุ่ม + เพื่ออัปโหลดวิดีโอของคุณ';
        }
      }
    });
  });
  document.getElementById('following-count').textContent = videoList.length;
}

// เปิด-ปิดหน้าโปรไฟล์
async function openProfile() {
  videoList = await loadAllVideos();
  renderVideoGrid();
  document.getElementById('profile-page').style.display = 'flex';
}
document.getElementById('profile-icon').addEventListener('click', openProfile);
document.getElementById('profile-nav-btn').addEventListener('click', openProfile);
document.getElementById('profile-back').addEventListener('click', () => {
  document.getElementById('profile-page').style.display = 'none';
});

// โหลดรายการเมื่อพร้อม
document.addEventListener('DOMContentLoaded', async () => {
  videoList = await loadAllVideos();
  if (videoList.length > 0) loadVideo(0);
});
</script>
