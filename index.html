<!-- ==============================================================
   เวอร์ชัน: v99 — เพิ่มแถบสีเทาด้านบนสุด ไอคอนครบ / เปลี่ยนรูป+ชื่อได้
   วันที่: 24 ก.ย. 2569
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiPodee v99</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;}
html,body{height:100%;background:#fff;}

/* แถบสีเทาด้านบนสุด — ตามรูป */
.top-grey-bar{position:sticky;top:0;background:#e9e9e9;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:100;}
.grey-left{display:flex;align-items:center;gap:14px;}
.grey-icon{font-size:20px;cursor:pointer;}
.grey-center{font-size:15px;color:#666;}
.grey-right{display:flex;align-items:center;gap:14px;}

/* โลโก้ + ปุ่ม + สีฟ้า */
.avatar-wrap{position:relative;display:inline-block;margin:16px 0 12px;}
.avatar{width:90px;height:90px;border-radius:50%;overflow:hidden;border:2px solid #ddd;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar-plus{position:absolute;bottom:0;right:0;width:24px;height:24px;background:#0095f6;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;border:2px solid #fff;z-index:10;}

.name-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;}
.p-name{font-size:18px;font-weight:700;color:#000;}
.edit-pen{font-size:16px;color:#0095f6;cursor:pointer;}
.p-badge{background:#ed4956;color:#fff;font-size:11px;padding:2px 6px;border-radius:10px;}

.p-user{font-size:14px;color:#666;margin-bottom:10px;}
.p-bio{font-size:14px;line-height:1.6;margin-bottom:16px;padding:0 15px;}

.stats{display:flex;justify-content:center;gap:40px;margin-bottom:16px;}
.stat{text-align:center;}
.stat-num{font-size:18px;font-weight:700;}
.stat-label{font-size:12px;color:#666;margin-top:2px;}

.action-btns{display:flex;flex-direction:column;gap:8px;align-items:center;margin-bottom:20px;}
.btn{padding:8px 24px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;border:none;background:transparent;color:#000;}
.btn-email{color:#d00;}
.btn-order{color:#d00;}

.tabs{display:flex;justify-content:space-around;border-top:1px solid #eee;margin-bottom:2px;}
.tab{padding:12px 0;font-size:20px;color:#888;cursor:pointer;}
.tab.active{color:#000;border-top:2px solid #000;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;}
.thumb{aspect-ratio:4/5;background:#f0f0f0;overflow:hidden;cursor:pointer;position:relative;}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;}
.play-count{position:absolute;bottom:6px;left:6px;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);display:flex;align-items:center;gap:4px;}
.empty{aspect-ratio:4/5;background:#f8f8f8;display:flex;align-items:center;justify-content:center;color:#aaa;border:1px dashed #ddd;font-size:12px;}

.player{position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column;}
.player.active{display:flex;}
.p-top{padding:12px 16px;display:flex;align-items:center;background:rgba(0,0,0,.7);}
.back{color:#fff;font-size:22px;cursor:pointer;margin-right:12px;}
.p-body{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;}
.p-media{max-width:100%;max-height:85vh;}

.bottom{position:fixed;bottom:0;left:0;right:0;height:60px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #eee;background:#fff;z-index:100;}
.b-item{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#888;gap:2px;cursor:pointer;}
.b-item.active{color:#000;}
.b-icon{font-size:22px;}
.b-badge{background:red;color:#fff;font-size:9px;padding:1px 4px;border-radius:10px;position:absolute;}

.hidden{display:none !important;}
</style>
</head>
<body>

<!-- แถบสีเทาด้านบนสุด — ตามรูปเป๊ะ -->
<div class="top-grey-bar">
  <div class="grey-left">
    <span class="grey-icon" onclick="history.back()">←</span>
    <span class="grey-icon">+</span>
    <span class="grey-icon" style="background:#ddd;border-radius:50%;padding:2px 6px;">P</span>
  </div>
  <div class="grey-center">ว่าไง</div>
  <div class="grey-right">
    <span class="grey-icon">👤</span>
    <span class="grey-icon">↗</span>
    <span class="grey-icon">☰</span>
  </div>
</div>

<!-- เนื้อหาโปรไฟล์ -->
<div style="text-align:center;padding:0 10px 20px;">
  <!-- โลโก้ + ปุ่ม + สีฟ้า -->
  <div class="avatar-wrap">
    <div class="avatar" id="avatarBtn">
      <img id="avatarImg" src="https://picsum.photos/id/1012/100/100" alt="โลโก้">
    </div>
    <div class="avatar-plus" id="avatarPlusBtn">+</div>
  </div>

  <!-- ชื่อ + ดินสอ -->
  <div class="name-row">
    <h1 class="p-name" id="dispName">THAIPODEE PRODUCT ENGINEERING</h1>
    <span class="p-badge">9+</span>
    <span class="edit-pen" id="nameEditBtn">✏️</span>
  </div>

  <div class="p-user" id="dispUser">@thaipodee-official</div>
  <div class="p-bio" id="dispBio">ใส่คำอธิบายของคุณตรงนี้</div>

  <!-- สถิติ -->
  <div class="stats">
    <div class="stat"><div class="stat-num" id="statFollowing">0</div><div class="stat-label">กำลังติดตาม</div></div>
    <div class="stat"><div class="stat-num" id="statFollowers">0</div><div class="stat-label">ผู้ติดตาม</div></div>
    <div class="stat"><div class="stat-num" id="statLikes">0</div><div class="stat-label">ถูกใจ</div></div>
  </div>

  <!-- ปุ่ม -->
  <div class="action-btns">
    <button class="btn btn-email" id="emailBtn">✉️ อีเมล</button>
    <button class="btn btn-order" id="orderBtn">🛒 คำสั่งซื้อของคุณ</button>
  </div>

  <!-- แท็บ -->
  <div class="tabs">
    <div class="tab active">☰</div>
    <div class="tab">🔒</div>
    <div class="tab">↕</div>
    <div class="tab">❤️</div>
  </div>
</div>

<!-- กริดโพสต์ -->
<div class="grid" id="postGrid"></div>

<!-- หน้าเล่น -->
<div class="player" id="playerPage">
  <div class="p-top"><span class="back" id="backBtn">←</span></div>
  <div class="p-body">
    <video id="playVid" controls playsinline class="p-media" style="display:none;"></video>
    <img id="playImg" class="p-media" style="display:none;">
  </div>
</div>

<!-- แถบล่าง -->
<div class="bottom">
  <div class="b-item"><span class="b-icon">🏠</span><span>หน้าหลัก</span></div>
  <div class="b-item"><span class="b-icon">🛒</span><span>ร้านค้า</span></div>
  <div class="b-item active"><span class="b-icon">➕</span><span>สร้าง</span></div>
  <div class="b-item" style="position:relative;">
    <span class="b-icon">💬</span>
    <span class="b-badge">99+</span>
    <span>กล่องข้อความ</span>
  </div>
  <div class="b-item"><span class="b-icon">👤</span><span>โปรไฟล์</span></div>
</div>

<input type="file" id="avatarInput" accept="image/*" class="hidden">
<input type="file" id="mediaInput" accept="image/*,video/*" class="hidden">

<script>
let profile = {
  avatar: localStorage.getItem('tp_avatar') || 'https://picsum.photos/id/1012/100/100',
  name: localStorage.getItem('tp_name') || 'THAIPODEE PRODUCT ENGINEERING',
  username: localStorage.getItem('tp_username') || '@thaipodee-official',
  bio: localStorage.getItem('tp_bio') || 'ใส่คำอธิบายของคุณตรงนี้',
  following: localStorage.getItem('tp_following') || '0',
  followers: localStorage.getItem('tp_followers') || '0',
  likes: localStorage.getItem('tp_likes') || '0'
};

let posts = JSON.parse(localStorage.getItem('tp_posts_list') || '[]');

function saveAll() {
  localStorage.setItem('tp_avatar', profile.avatar);
  localStorage.setItem('tp_name', profile.name);
  localStorage.setItem('tp_username', profile.username);
  localStorage.setItem('tp_bio', profile.bio);
  localStorage.setItem('tp_following', profile.following);
  localStorage.setItem('tp_followers', profile.followers);
  localStorage.setItem('tp_likes', profile.likes);
  localStorage.setItem('tp_posts_list', JSON.stringify(posts));
}

function renderAll() {
  document.getElementById('avatarImg').src = profile.avatar;
  document.getElementById('dispName').textContent = profile.name;
  document.getElementById('dispUser').textContent = profile.username;
  document.getElementById('dispBio').textContent = profile.bio;
  document.getElementById('statFollowing').textContent = profile.following;
  document.getElementById('statFollowers').textContent = profile.followers;
  document.getElementById('statLikes').textContent = profile.likes;

  const grid = document.getElementById('postGrid');
  grid.innerHTML = '';

  if (posts.length === 0) {
    for (let i = 0; i < 8; i++) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'กด + เพิ่ม';
      grid.appendChild(e);
    }
    return;
  }

  posts.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    if (p.type === 'video') {
      d.innerHTML = `
        <video src="${p.src}" muted preload="metadata"></video>
        <span class="play-count"><span>▶</span>${p.views || 0}</span>
      `;
    } else {
      d.innerHTML = `<img src="${p.src}">`;
    }
    d.onclick = () => openPost(i);
    grid.appendChild(d);
  });
}

function openPost(i) {
  const p = posts[i];
  document.getElementById('playVid').style.display = 'none';
  document.getElementById('playImg').style.display = 'none';
  document.getElementById('playVid').pause();
  if (p.type === 'video') {
    document.getElementById('playVid').src = p.src;
    document.getElementById('playVid').style.display = 'block';
    document.getElementById('playVid').play().catch(()=>{});
  } else {
    document.getElementById('playImg').src = p.src;
    document.getElementById('playImg').style.display = 'block';
  }
  document.getElementById('playerPage').classList.add('active');
}

document.getElementById('backBtn').onclick = () => {
  document.getElementById('playerPage').classList.remove('active');
  document.getElementById('playVid').pause();
  document.getElementById('playVid').src = '';
};

// เปลี่ยนรูปโลโก้ — ปุ่ม + สีฟ้า
document.getElementById('avatarPlusBtn').onclick = () => {
  document.getElementById('avatarInput').click();
};
document.getElementById('avatarInput').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    profile.avatar = ev.target.result;
    saveAll(); renderAll();
    alert('✅ เปลี่ยนโลโก้เรียบร้อย');
  };
  r.readAsDataURL(f);
};

// เปลี่ยนชื่อ — ปุ่มดินสอ
document.getElementById('nameEditBtn').onclick = () => {
  const n = prompt('ชื่อโปรไฟล์:', profile.name);
  if (n && n.trim()) profile.name = n.trim();

  const u = prompt('ชื่อผู้ใช้:', profile.username);
  if (u && u.trim()) {
    profile.username = u.trim().startsWith('@') ? u.trim() : '@' + u.trim();
  }

  const b = prompt('คำอธิบายโปรไฟล์:', profile.bio);
  if (b && b.trim()) profile.bio = b.trim();

  saveAll(); renderAll();
  alert('✅ อัปเดตเรียบร้อย');
};

// แชร์
const doShare = () => {
  navigator.clipboard.writeText(location.href).then(()=>alert('✅ คัดลอกลิงก์แล้ว'));
};
document.querySelector('.grey-right .grey-icon:nth-child(2)').onclick = doShare;

// เพิ่มโพสต์ — ปุ่ม + ด้านล่าง
document.querySelector('.b-item.active').onclick = () => {
  document.getElementById('mediaInput').click();
};
document.getElementById('mediaInput').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const isVid = f.type.startsWith('video/');
  const r = new FileReader();
  r.onload = ev => {
    posts.unshift({
      src: ev.target.result,
      type: isVid ? 'video' : 'image',
      views: Math.floor(Math.random() * 150) + 30
    });
    saveAll(); renderAll();
    alert('✅ เพิ่มโพสต์เรียบร้อย');
  };
  r.readAsDataURL(f);
};

renderAll();
</script>
</body>
</html>
