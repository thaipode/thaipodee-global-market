<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thaipodee Global Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    .hidden { display: none !important; }
    
    .feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; }
    .post-slide { min-height: 100vh; scroll-snap-align: start; position: relative; padding-bottom: 70px; }
    .media { width: 100%; height: calc(100vh - 70px); object-fit: cover; background: #111; }
    
    .info-left { position: absolute; bottom: 80px; left: 12px; max-width: 70%; }
    .username { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .caption { font-size: 14px; opacity: 0.9; }
    
    .side-menu { position: absolute; bottom: 100px; right: 12px; display: flex; flex-direction: column; gap: 24px; align-items: center; }
    .side-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .side-btn i { font-size: 26px; }
    .side-btn span { font-size: 11px; }
    
    .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
    .nav-btn i { font-size: 22px; }
    .nav-btn span { font-size: 10px; }
    .add-btn { background: #f00; width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; padding: 20px; overflow-y: auto; }
    .close-top { text-align: right; font-size: 24px; cursor: pointer; margin-bottom: 10px; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: none; border-radius: 8px; color: #fff; font-size: 15px; }
    button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; width: 100%; margin-top: 10px; }
    .btn-red { background: #f00; color: #fff; font-weight: bold; }
    .btn-gray { background: #333; color: #fff; }
    
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

<!-- หน้าหลัก ฟีด -->
<div id="feedPage">
  <div class="feed" id="feedList"></div>
  
  <div class="bottom-bar">
    <div class="nav-btn" onclick="goFeed()"><i class="fa fa-home"></i><span>หน้าแรก</span></div>
    <div class="nav-btn" onclick="goSearch()"><i class="fa fa-search"></i><span>ค้นหา</span></div>
    <div class="nav-btn add-btn" onclick="openPostBox()"><i class="fa fa-plus"></i></div>
    <div class="nav-btn" onclick="goNotify()"><i class="fa fa-bell-o"></i><span>แจ้งเตือน</span></div>
    <div class="nav-btn" onclick="goProfile()"><i class="fa fa-user-o"></i><span>ฉัน</span></div>
  </div>
</div>

<!-- กล่องโพสต์ใหม่ -->
<div id="postBox" class="overlay hidden">
  <div class="close-top" onclick="closePostBox()">&times;</div>
  <h2 class="text-xl font-bold mb-4">สร้างโพสต์</h2>
  
  <input type="file" id="fileChoose" accept="image/*,video/*" onchange="showPreview(this)">
  
  <div id="previewHere" class="w-full aspect-video bg-gray-900 rounded-lg flex items-center justify-center my-4">
    <span class="text-gray-400">ตัวอย่างจะแสดงที่นี่</span>
  </div>
  
  <input type="text" id="inputName" placeholder="ชื่อของคุณ" value="Thaipodee Master">
  <textarea id="inputDesc" rows="3" placeholder="เขียนคำอธิบาย..."></textarea>
  
  <button class="btn-red" onclick="doPublish()">เผยแพร่</button>
</div>

<script>
let postData = [];
let fileObj = null;
let fileBase64 = null;

// โหลดข้อมูลเก่า
function loadData() {
  try {
    const saved = localStorage.getItem('tpd_data');
    if (saved) postData = JSON.parse(saved);
  } catch(e) {
    postData = [];
  }
  showAllPosts();
}

// บันทึกข้อมูล
function saveData() {
  localStorage.setItem('tpd_data', JSON.stringify(postData));
}

// แสดงโพสต์ทั้งหมด
function showAllPosts() {
  const list = document.getElementById('feedList');
  list.innerHTML = '';
  
  if (postData.length === 0) {
    list.innerHTML = `
      <div class="post-slide">
        <div class="media flex items-center justify-center text-gray-400">
          <p>กดปุ่ม + เพื่อโพสต์</p>
        </div>
        <div class="info-left">
          <div class="username">Thaipodee Master</div>
          <div class="caption">ยินดีต้อนรับสู่ Thaipodee</div>
        </div>
        <div class="side-menu">
          <div class="side-btn" onclick="alert('ไปหน้าโปรไฟล์')"><i class="fa fa-user-circle-o"></i><span>โปรไฟล์</span></div>
          <div class="side-btn" onclick="alert('กดถูกใจ')"><i class="fa fa-heart-o"></i><span>0</span></div>
          <div class="side-btn" onclick="alert('เปิดคอมเมนต์')"><i class="fa fa-comment-o"></i><span>0</span></div>
          <div class="side-btn" onclick="alert('บันทึกแล้ว')"><i class="fa fa-bookmark-o"></i><span>บันทึก</span></div>
          <div class="side-btn" onclick="alert('คัดลอกลิงก์แล้ว')"><i class="fa fa-share-alt"></i><span>แชร์</span></div>
          <div class="side-btn" onclick="alert('ตัวเลือกเพิ่มเติม')"><i class="fa fa-ellipsis-h"></i><span>อื่นๆ</span></div>
        </div>
      </div>`;
    return;
  }
  
  postData.forEach((p, idx) => {
    const slide = document.createElement('div');
    slide.className = 'post-slide';
    slide.innerHTML = `
      ${p.isVideo
        ? `<video class="media" controls autoplay muted loop playsinline>
             <source src="${p.src}"></video>`
        : `<img class="media" src="${p.src}" alt="">`
      }
      <div class="info-left">
        <div class="username">${p.name}</div>
        <div class="caption">${p.desc || ''}</div>
      </div>
      <div class="side-menu">
        <div class="side-btn" onclick="alert('โปรไฟล์')"><i class="fa fa-user-circle-o"></i><span>โปรไฟล์</span></div>
        <div class="side-btn" onclick="alert('ถูกใจ')"><i class="fa fa-heart-o"></i><span>0</span></div>
        <div class="side-btn" onclick="alert('คอมเมนต์')"><i class="fa fa-comment-o"></i><span>0</span></div>
        <div class="side-btn" onclick="alert('บันทึก')"><i class="fa fa-bookmark-o"></i><span>บันทึก</span></div>
        <div class="side-btn" onclick="alert('แชร์')"><i class="fa fa-share-alt"></i><span>แชร์</span></div>
        <div class="side-btn" onclick="if(confirm('ลบโพสต์นี้?')){postData.splice(${idx},1);saveData();showAllPosts();}"><i class="fa fa-ellipsis-h"></i><span>อื่นๆ</span></div>
      </div>
    `;
    list.appendChild(slide);
  });
}

// เปิด-ปิด กล่องโพสต์
function openPostBox() {
  fileObj = null;
  fileBase64 = null;
  document.getElementById('fileChoose').value = '';
  document.getElementById('inputDesc').value = '';
  document.getElementById('previewHere').innerHTML = '<span class="text-gray-400">ตัวอย่างจะแสดงที่นี่</span>';
  document.getElementById('postBox').classList.remove('hidden');
}
function closePostBox() {
  document.getElementById('postBox').classList.add('hidden');
}

// แสดงตัวอย่างไฟล์
function showPreview(input) {
  if (!input.files || !input.files[0]) return;
  fileObj = input.files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
    fileBase64 = e.target.result;
    const box = document.getElementById('previewHere');
    if (fileObj.type.startsWith('video/')) {
      box.innerHTML = `<video src="${fileBase64}" class="w-full h-full object-contain" autoplay muted loop playsinline controls></video>`;
    } else {
      box.innerHTML = `<img src="${fileBase64}" class="w-full h-full object-contain" alt="">`;
    }
  };
  reader.readAsDataURL(fileObj);
}

// ✅ กดเผยแพร่ — ทำงานตรงๆ ไม่ซับซ้อน
function doPublish() {
  if (!fileBase64) {
    alert('⚠️ ก่อนอื่นให้กด "เลือกไฟล์" แล้วเลือกรูปหรือวิดีโอก่อนครับ');
    return;
  }
  
  const name = document.getElementById('inputName').value.trim() || 'Thaipodee Master';
  const desc = document.getElementById('inputDesc').value.trim();
  
  // เพิ่มโพสต์ใหม่ข้างบนสุด
  postData.unshift({
    src: fileBase64,
    isVideo: fileObj.type.startsWith('video/'),
    name: name,
    desc: desc,
    time: new Date().toLocaleString('th-TH')
  });
  
  // บันทึกและแสดงผล
  saveData();
  closePostBox();
  showAllPosts();
  
  alert('✅ เผยแพร่สำเร็จ! โพสต์ขึ้นแล้วครับ');
}

// เมนูด้านล่าง
function goFeed() { window.scrollTo({top:0,behavior:'smooth'}); }
function goSearch() { alert('🔍 ค้นหา — จะพัฒนาต่อครับ'); }
function goNotify() { alert('🔔 แจ้งเตือน — จะพัฒนาต่อครับ'); }
function goProfile() { alert('👤 โปรไฟล์ — จะพัฒนาต่อครับ'); }

// เริ่มทำงานทันที
document.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
