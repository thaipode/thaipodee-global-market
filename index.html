<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThaiPodee Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html,body { height:100%; background:#000; color:#fff; font-family:sans-serif; overflow:hidden; }
    .page { position:absolute; inset:0; z-index:10; overflow-y:auto; }
    .page.hidden { display:none; }
    .media { position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; }
    .media video, .media img { max-width:100%; max-height:100%; object-fit:contain; }
    .ui { position:absolute; inset:0; z-index:20; pointer-events:none; }
    .ui>* { pointer-events:auto; }
    .top { position:absolute; top:40px; left:16px; }
    .username { font-weight:bold; font-size:15px; }
    .desc { font-size:12px; margin-top:4px; opacity:0.9; }
    .sound { display:flex; align-items:center; gap:4px; margin-top:8px; font-size:12px; }
    .right { position:absolute; right:12px; bottom:120px; display:flex; flex-direction:column; gap:20px; align-items:center; }
    .icon { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
    .icon i { font-size:24px; }
    .icon span { font-size:11px; }
    .bottom { position:absolute; bottom:0; left:0; right:0; height:65px; background:rgba(0,0,0,0.7); display:flex; justify-content:space-around; align-items:center; }
    .nav { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
    .nav i { font-size:22px; }
    .nav span { font-size:10px; margin-top:2px; }
    .plus { width:45px; height:35px; background:#fff; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold; font-size:20px; }
    .back { position:absolute; top:16px; left:16px; font-size:20px; cursor:pointer; z-index:100; }
    .preview { width:calc(100% - 32px); height:200px; background:#111; border-radius:8px; display:flex; align-items:center; justify-content:center; margin:16px; cursor:pointer; overflow:hidden; }
    .inp { width:calc(100% - 32px); margin:0 16px 12px; background:#222; border:none; border-radius:8px; padding:12px; color:#fff; }
    .btn { width:calc(100% - 32px); margin:0 16px; background:#e91e63; border:none; border-radius:8px; padding:14px; color:#fff; font-weight:bold; cursor:pointer; }
    .progress { width:calc(100% - 32px); margin:0 16px; height:6px; background:#333; border-radius:3px; overflow:hidden; display:none; }
    .prog-bar { height:100%; background:#e91e63; width:0%; transition:width 0.3s; }
    input[type=file] { display:none; }
  </style>
</head>
<body>
  <div id="home" class="page">
    <div class="media" id="mediaArea"><p style="color:#666;">กด + เพื่อเผยแพร่</p></div>
    <div class="ui">
      <div class="top">
        <div class="username" id="un">ThaiPodee Master</div>
        <div class="desc" id="ds">ยินดีต้อนรับสู่ ThaiPodee Market</div>
        <div class="sound"><i class="fa-solid fa-music"></i> <span id="snd">เสียงต้นฉบับ</span></div>
      </div>
      <div class="right">
        <div class="icon"><i class="fa-regular fa-heart"></i><span>0</span></div>
        <div class="icon"><i class="fa-regular fa-comment"></i><span>0</span></div>
        <div class="icon"><i class="fa-regular fa-bookmark"></i><span>บันทึก</span></div>
        <div class="icon"><i class="fa-solid fa-share"></i><span>แชร์</span></div>
        <div class="icon" id="vol"><i class="fa-solid fa-volume-high"></i></div>
      </div>
      <div class="bottom">
        <div class="nav" data-goto="home"><i class="fa-solid fa-house"></i><span>หน้าแรก</span></div>
        <div class="nav" data-goto="market"><i class="fa-solid fa-basket-shopping"></i><span>ตลาด</span></div>
        <div class="nav" data-goto="upload"><div class="plus">+</div></div>
        <div class="nav" data-goto="msg"><i class="fa-solid fa-envelope"></i><span>ข้อความ</span></div>
        <div class="nav" data-goto="profile"><i class="fa-solid fa-user"></i><span>โปรไฟล์</span></div>
      </div>
    </div>
  </div>

  <div id="upload" class="page hidden" style="background:#000;">
    <i class="fa-solid fa-arrow-left back" data-goto="home"></i>
    <div style="padding-top:50px;">
      <div class="preview" id="prevBox">
        <div style="color:#888;text-align:center;">
          <i class="fa-solid fa-folder-open" style="font-size:32px;"></i>
          <p style="margin-top:8px;">แตะเพื่อเลือกไฟล์</p>
        </div>
        <input type="file" id="fIn" accept="video/*,image/*">
      </div>
      <div class="progress" id="progWrap"><div class="prog-bar" id="progBar"></div></div>
      <input type="text" class="inp" id="dIn" placeholder="ชื่อสินค้า...">
      <input type="text" class="inp" id="sIn" placeholder="เสียงประกอบ...">
      <button class="btn" id="pub">เผยแพร่ขึ้นคลาวด์</button>
      <p style="color:#666; font-size:11px; text-align:center; margin-top:10px;">
        💡 เก็บบนคลาวด์ — ทุกคนเห็นเหมือนกัน
      </p>
    </div>
  </div>

  <script>
    const CLOUD_NAME = 'erjpmyt';
    const UPLOAD_PRESET = 'thaipodee';

    let file, type, tempUrl, muted = true;
    const mediaArea = document.getElementById('mediaArea');

    function show(id) {
      document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>show(b.dataset.goto));
    document.getElementById('prevBox').onclick=()=>document.getElementById('fIn').click();

    document.getElementById('fIn').onchange=e=>{
      file = e.target.files[0];
      if(!file)return;
      type = file.type.startsWith('video')?'video':'image';
      if(tempUrl)URL.revokeObjectURL(tempUrl);
      tempUrl = URL.createObjectURL(file);
      
      const pb = document.getElementById('prevBox');
      pb.innerHTML = '';
      if(type==='video'){
        const v=document.createElement('video');
        v.src=tempUrl; v.controls=true; v.style.width='100%';
        pb.appendChild(v);
      }else{
        const i=document.createElement('img');
        i.src=tempUrl; i.style.maxWidth='100%';
        pb.appendChild(i);
      }
    };

    document.getElementById('pub').onclick=async ()=>{
      if(!file)return alert('เลือกไฟล์ก่อนครับ');

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);

      const progWrap = document.getElementById('progWrap');
      const progBar = document.getElementById('progBar');
      progWrap.style.display = 'block';
      progBar.style.width = '0%';

      const xhr = new XMLHttpRequest();
      xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`);

      xhr.upload.onprogress = e => {
        if(e.lengthComputable) progBar.style.width = Math.round((e.loaded/e.total)*100)+'%';
      };

      xhr.onload = () => {
        if(xhr.status === 200){
          const res = JSON.parse(xhr.responseText);
          const cloudUrl = res.secure_url;
          
          mediaArea.innerHTML = '';
          if(type==='video'){
            const v=document.createElement('video');
            v.src = cloudUrl;
            v.loop = true;
            v.playsInline = true;
            v.muted = true;
            v.style.width = '100%';
            v.style.height = '100%';
            mediaArea.appendChild(v);
            v.play().catch(()=>{});
          }else{
            const i=document.createElement('img');
            i.src = cloudUrl;
            i.style.maxWidth = '100%';
            mediaArea.appendChild(i);
          }
          
          document.getElementById('ds').textContent = document.getElementById('dIn').value || 'สินค้าใหม่';
          document.getElementById('snd').textContent = document.getElementById('sIn').value || 'เสียงต้นฉบับ';
          
          alert('✅ สำเร็จ! เก็บบนคลาวด์แล้ว\nทุกคนจะเห็นโพสต์นี้เหมือนกัน');
          progWrap.style.display = 'none';
          show('home');
          
          document.getElementById('fIn').value='';
          document.getElementById('dIn').value='';
          document.getElementById('sIn').value='';
          document.getElementById('prevBox').innerHTML=`<div style="color:#888;text-align:center;"><i class="fa-solid fa-folder-open" style="font-size:32px;"></i><p style="margin-top:8px;">แตะเพื่อเลือกไฟล์</p></div>`;
        }else{
          alert('❌ ไม่สำเร็จ\n\nเช็ค: สร้าง Preset ชื่อ "thaipodee" และเลือกเป็น Unsigned แล้วหรือยัง?\n\n' + xhr.responseText);
          progWrap.style.display = 'none';
        }
      };

      xhr.send(formData);
    };

    document.getElementById('vol').onclick=()=>{
      const v=mediaArea.querySelector('video');if(!v)return;
      muted=!muted;v.muted=muted;
      document.querySelector('#vol i').className=muted?'fa-solid fa-volume-mute':'fa-solid fa-volume-high';
    };
  </script>
</body>
</html>
