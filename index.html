<!-- ==============================================================
   ThaiPodee v1121-30-POSITION-FIXED
   ✅ ไอคอนขวา: อยู่ตรงกลางความสูงจอพอดี
   ✅ ข้อความซ้าย: ยกขึ้นสูงขึ้น ไม่ชิดล่าง
   ✅ แถบล่าง: ชิดขอบล่างสุด
   ✅ แนวตั้งเต็มจอ / แนวนอนตรงกลาง
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ThaiPodee v1121-30</title>

<link rel="icon" type="image/png" sizes="192x192" href="https://i.imgur.com/KJbRzQY.png?v=30">
<link rel="apple-touch-icon" sizes="180x180" href="https://i.imgur.com/KJbRzQY.png?v=30">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  background:#000;
  overflow:hidden;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
}

.version-tag{
  position:absolute;
  top:12px;
  right:12px;
  font-size:10px;
  color:#444;
  z-index:100;
}

/* ========================================
   วิดีโอ/ภาพ — ตรงกลางพอดี
   ======================================== */
.media-container{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1;
}

.media-container img,
.media-container video{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  object-position:center center;
  display:block;
}

/* แตะเล่น/หยุด */
.tap-layer{
  position:fixed;
  inset:0;
  z-index:2;
  cursor:pointer;
  background:transparent;
}

/* ========================================
   ส่วนควบคุมทั้งหมด — ทับบนสุด
   ======================================== */
.ui-layer{
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;
}
.ui-layer > *{pointer-events:auto}

/* ========================================
   1. ข้อความซ้าย — ยกขึ้นสูงขึ้น
   ======================================== */
.video-info{
  position:absolute;
  left:16px;
  bottom:80px;  /* ✅ ยกขึ้นจากก้นจอ */
  right:90px;
  color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}
.video-author{
  font-size:15px;
  font-weight:700;
  margin-bottom:6px;
}
.video-caption{
  font-size:13px;
  line-height:1.4;
  margin-bottom:8px;
}
.video-music{
  font-size:12px;
  display:flex;
  align-items:center;
  gap:6px;
}

/* ========================================
   2. ไอคอนขวา — อยู่ตรงกลางความสูงจอ
   ======================================== */
.side-icons{
  position:absolute;
  right:12px;
  top:50%;           /* ✅ กึ่งกลางจอ */
  transform:translateY(-50%);  /* ✅ จัดกึ่งกลางจริง */
  display:flex;
  flex-direction:column;
  gap:26px;          /* ✅ ระยะห่างพอดี */
  align-items:center;
}
.side-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  cursor:pointer;
  color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
}
.side-icon-wrap{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:28px;
}
.side-count{
  font-size:11px;
}
.side-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid #fff;
  overflow:hidden;
}
.side-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.side-music-disc{
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(#333,#111);
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #444;
  animation:spin 3s linear infinite;
}
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* แถบเวลา */
.progress-bar{
  position:absolute;
  bottom:55px;
  left:0;
  right:0;
  height:2px;
  background:rgba(255,255,255,.2);
}
.progress-bar-fill{
  height:100%;
  width:0%;
  background:#ff0050;
}

/* ========================================
   3. แถบล่าง — ชิดขอบล่างสุด
   ======================================== */
.nav-bottom{
  position:absolute;
  bottom:0;          /* ✅ ติดก้นจอเลย */
  left:0;
  right:0;
  height:55px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:transparent;
}
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  color:#999;
  font-size:10px;
  cursor:pointer;
}
.nav-item.active{color:#fff}
.nav-icon{font-size:22px}
.nav-center-btn{
  width:45px;
  height:35px;
  background:#fff;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  color:#000;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="version-tag">v1121-30</div>

<!-- วิดีโอ/ภาพ -->
<div class="media-container">
  <video id="videoPlayer" playsinline webkit-playsinline autoplay loop muted>
    <source src="" type="video/mp4">
  </video>
</div>

<!-- แตะเล่น/หยุด -->
<div class="tap-layer" id="tapLayer"></div>

<!-- ส่วนควบคุม -->
<div class="ui-layer">
  <div class="video-info">
    <div class="video-author">@ThaiPodee</div>
    <div class="video-caption">ยินดีต้อนรับสู่ ThaiPodee — แตะจอเพื่อเล่น/หยุด</div>
    <div class="video-music">
      <span>♪</span>
      <span>เสียงประกอบ — ThaiPodee Original</span>
    </div>
  </div>

  <div class="side-icons">
    <div class="side-btn" id="likeBtn">
      <div class="side-icon-wrap">❤️</div>
      <div class="side-count" id="likeCount">0</div>
    </div>
    <div class="side-btn">
      <div class="side-icon-wrap">💬</div>
      <div class="side-count">0</div>
    </div>
    <div class="side-btn">
      <div class="side-icon-wrap">↗️</div>
      <div class="side-count">แชร์</div>
    </div>
    <div class="side-btn" data-page="profile">
      <div class="side-avatar">
        <img src="https://i.imgur.com/KJbRzQY.png" alt="โปรไฟล์">
      </div>
    </div>
    <div class="side-btn">
      <div class="side-music-disc">🎵</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>

  <div class="nav-bottom">
    <div class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>หน้าแรก</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>ค้นหา</span>
    </div>
    <div class="nav-item" id="uploadBtn">
      <div class="nav-center-btn">+</div>
    </div>
    <div class="nav-item">
      <span class="nav-icon">📦</span>
      <span>กล่อง</span>
    </div>
    <div class="nav-item" data-page="profile">
      <span class="nav-icon">👤</span>
      <span>โปรไฟล์</span>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('videoPlayer');
const tapLayer = document.getElementById('tapLayer');
const progressFill = document.getElementById('progressFill');

// เล่น-หยุด
tapLayer.addEventListener('click', () => {
  if (video.paused) video.play();
  else video.pause();
});

// แถบเวลา
video.addEventListener('timeupdate', () => {
  if (video.duration) {
    progressFill.style.width = (video.currentTime / video.duration) * 100 + '%';
  }
});
</script>

</body>
</html>
