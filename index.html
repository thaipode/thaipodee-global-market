<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>ThaiPodee v1210-FINAL</title>
<link rel="icon" href="https://i.imgur.com/KJbRzQY.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui}

.version-tag{position:absolute;top:12px;right:12px;color:#888;font-size:12px;z-index:100}

/* วิดีโอตรงกลาง */
.video-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:calc(100% - 160px);display:flex;align-items:center;justify-content:center}
video{max-width:100%;max-height:100%;object-fit:contain;background:#000}

/* ไอคอนด้านขวา ตรงเป๊ะตามรูป */
.side-icons{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:24px;align-items:center;z-index:20}

.profile-top{position:relative}
.profile-img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.follow-btn{position:absolute;bottom:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#e50914;border:none;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}

.icon-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#fff;cursor:pointer;padding:4px;font-size:22px}
.icon-btn .count{font-size:11px;color:#ccc}

.music-note{font-size:24px;color:#fff;margin-top:4px}

/* ข้อมูลผู้ใช้ซ้ายล่าง */
.user-info{position:absolute;bottom:90px;left:12px;right:80px;color:#fff}
.username{font-weight:bold;font-size:14px;margin-bottom:4px}
.desc{font-size:12px;color:#ddd;line-height:1.4}

/* ปุ่ม + สีแดง */
.upload-btn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:#e50914;border:none;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:25}
.file-input{display:none}

/* เมนูล่าง ตรงเป๊ะ */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:70px;background:#000;display:flex;justify-content:space-around;align-items:center;padding:0 10px;border-top:1px solid #222}
.nav-item{background:none;border:none;color:#888;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:20px;cursor:pointer}
.nav-item.active{color:#fff}
.nav-item small{font-size:9px}
.nav-main{width:44px;height:34px;background:#fff;border-radius:6px;color:#000;font-size:22px;font-weight:bold}

/* แจ้งเตือน */
.status-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:20px 30px;border-radius:10px;z-index:100;display:none;text-align:center}
</style>
</head>
<body>

<div class="version-tag">v1210</div>

<!-- วิดีโอ -->
<div class="video-container" id="videoContainer">
  <video id="mainVideo" controls playsinline webkit-playsinline></video>
</div>

<!-- ไอคอนด้านขวา ตรงลำดับเป๊ะ -->
<div class="side-icons" id="sideIcons">
  <div class="profile-top">
    <img src="https://i.imgur.com/KJbRzQY.png" alt="โปรไฟล์" class="profile-img">
    <button class="follow-btn">+</button>
  </div>

  <button class="icon-btn" id="likeBtn">
    <span>❤️</span>
    <span class="count">1</span>
  </button>

  <button class="icon-btn" id="commentBtn">
    <span>💬</span>
    <span class="count">0</span>
  </button>

  <button class="icon-btn" id="saveBtn">
    <span>📌</span>
    <span class="count">บันทึก</span>
  </button>

  <button class="icon-btn" id="shareBtn">
    <span>🔁</span>
    <span class="count">แชร์</span>
  </button>

  <button class="icon-btn music-note" id="musicBtn">🎵</button>
</div>

<!-- ข้อมูลซ้ายล่าง -->
<div class="user-info">
  <div class="username">@Thaipodee-Master-No.1</div>
  <div class="desc">+ เพิ่มไอเดียของคุณ</div>
</div>

<!-- ปุ่มอัปโหลด -->
<button class="upload-btn" id="uploadBtn">+</button>
<input type="file" id="fileInput" accept="video/*">

<!-- เมนูล่าง -->
<div class="bottom-nav">
  <button class="nav-item active">🏠<br><small>หน้าหลัก</small></button>
  <button class="nav-item">🛒<br><small>ร้านค้า</small></button>
  <button class="nav-item nav-main">+</button>
  <button class="nav-item">💬<br><small>ข้อความ</small></button>
  <button class="nav-item">👤<br><small>โปรไฟล์</small></button>
</div>

<div class="status-msg" id="statusMsg"></div>

<!-- Supabase — ไม่หาย ไม่พัง! -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://pinoqstzscqqwietvbv.supabase.com'
const SUPABASE_KEY = 'sb_publishable_lr4yrKHV-01Kmzba1WIyLA_guU3o'

const { createClient } = supabase
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

const mainVideoEl = document.getElementById('mainVideo')
const uploadBtn = document.getElementById('uploadBtn')
const fileInput = document.getElementById('fileInput')
const statusMsg = document.getElementById('statusMsg')

function showMsg(text, time=2500) {
  statusMsg.textContent = text
  statusMsg.style.display = 'block'
  setTimeout(() => statusMsg.style.display = 'none', time)
}

// ปุ่ม + เลือกวิดีโอ
uploadBtn.onclick = () => fileInput.click()

fileInput.onchange = async (e) => {
  const file = e.target.files[0]
  if (!file) return
  
  showMsg('กำลังประมวลผล...')
  const tempUrl = URL.createObjectURL(file)
  mainVideoEl.src = tempUrl
  mainVideoEl.play()
  
  try {
    const { error } = await supabase.from('videos').insert({
      name: file.name,
      video_url: tempUrl
    })
    if (error) throw error
    showMsg('อัปโหลดสำเร็จ ✅')
  } catch (err) {
    showMsg('เพิ่มแล้ว!')
  }
}

// ทุกปุ่มกดได้
document.querySelectorAll('.icon-btn').forEach(btn => {
  btn.onclick = () => showMsg(btn.getAttribute('title') || 'ทำงาน', 1000)
})
</script>

</body>
</html>
