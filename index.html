<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<meta name="description" content="ThaiPodee Market — แอปแชร์วิดีโอและสินค้า">
<title>ThaiPodee Market v88</title>
<link rel="icon" type="image/png" sizes="192x192" href="https://picsum.photos/id/1012/192/192">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
html, body { height: 100%; background: #fff; color: #000; overflow: hidden; }

/* ===== แถบบน ===== */
.top-bar { position: fixed; top: 0; left: 0; right: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; z-index: 200; border-bottom: 1px solid #eee; }
.top-title { font-size: 17px; font-weight: 600; }
.top-actions { display: flex; gap: 16px; font-size: 20px; }

/* ===== หน้า ===== */
.page { position: absolute; top: 50px; bottom: 65px; left: 0; right: 0; display: none; overflow-y: auto; background: #fff; }
.page.active { display: block; }

/* ===== โปรไฟล์ ตรงตัวอย่าง ===== */
.profile-page { padding: 16px; }
.profile-header { text-align: center; }
.profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: #ddd; margin: 0 auto 12px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 0 0 1px #ccc; cursor: pointer; }
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.profile-name { font-size: 16px; font-weight: 700; color: #d00; margin-bottom: 4px; }
.profile-id { font-size: 13px; color: #666; margin-bottom: 12px; }
.profile-bio { font-size: 13px; color: #333; line-height: 1.5; margin-bottom: 12px; }

/* ===== สถิติโปรไฟล์ ===== */
.profile-stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 16px; }
.stat-item { text-align: center; }
.stat-number { font-size: 18px; font-weight: 700; }
.stat-label { font-size: 11px; color: #666; }

/* ===== ปุ่มกดติดตาม และแชร์ ===== */
.profile-buttons { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; }
.follow-btn { background: #d00; color: #fff; border: none; padding: 8px 24px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
.share-btn { background: #eee; color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; }

/* ===== แท็บโพสต์ ===== */
.post-tabs { display: flex; justify-content: center; border-top: 1px solid #eee; border-bottom: 1px solid #eee; margin-bottom: 3px; }
.post-tab { padding: 10px 16px; font-size: 13px; color: #666; cursor: pointer; }
.post-tab.active { color: #000; border-top: 2px solid #000; margin-top: -1px; font-weight: 600; }

/* ===== กริดโพสต์ ตรงตัวอย่าง ===== */
.post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 0 2px; }
.post-thumb { aspect-ratio: 9/16; background: #1a1a1a; overflow: hidden; cursor: pointer; position: relative; }
.post-thumb img, .post-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; color: #fff; opacity: 0.8; pointer-events: none; }
.post-duration { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.65); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; pointer-events: none; }

/* ===== หน้าเล่นวิดีโอ ===== */
.player-page { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 300; display: none; flex-direction: column; }
.player-page.active { display: flex; }
.player-top { padding: 12px 16px; display: flex; align-items: center; background: rgba(0,0,0,0.6); }
.back-btn { font-size: 20px; cursor: pointer; margin-right: 12px; color: #fff; }
.player-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
.player-media { width: 100%; max-width: 480px; max-height: 85vh; object-fit: contain; }

/* ===== แถบล่าง ตรงตัวอย่าง ===== */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; display: flex; justify-content: space-around; align-items: center; background: #fff; border-top: 1px solid #eee; z-index: 200; }
.nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #666; gap: 2px; cursor: pointer; position: relative; }
.nav-item.active { color: #000; }
.nav-icon { font-size: 22px; }
.nav-add { width: 48px; height: 36px; background: #000; color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; }

/* ===== ซ่อน input ===== */
.hidden-input { display: none; }
</style>
</head>
<body>

<!-- แถบบน -->
<div class="top-bar">
  <span></span>
  <span class="top-title">thaipodee</span>
  <div class="top-actions">
    <span>➕</span>
    <span>💬</span>
  </div>
</div>

<!-- ===== หน้าโปรไฟล์ ตรงตัวอย่าง ===== -->
<div id="profilePage" class="page active">
  <div class="profile-page">
    <div class="profile-header">
      <!-- รูปโปรไฟล์เปลี่ยนได้ -->
      <div class="profile-avatar" id="avatarChangeBtn">
        <img id="mainAvatarImg" src="https://picsum.photos/id/1012/100/100" alt="โปรไฟล์">
      </div>
      <div class="profile-name">THAIPODEE PRODUCT ENGINEERING</div>
      <div class="profile-id">@thaipodee-official</div>
      <div class="profile-bio">รับจ้างผลิตชิ้นงานกลึง มิลลิ่ง เชื่อม ประกอบชุดงาน ตามแบบของลูกค้าในเขตอำเภอพุทธมณฑล นครปฐม และใกล้เคียง</div>
      
      <!-- สถิติ ตรงตัวอย่าง -->
      <div class="profile-stats">
        <div class="stat-item">
          <div class="stat-number" id="statPost">3,279</div>
          <div class="stat-label">โพสต์</div>
        </div>
        <div class="stat-item">
          <div class="stat-number">1,238</div>
          <div class="stat-label">ผู้ติดตาม</div>
        </div>
        <div class="stat-item">
          <div class="stat-number">2,748</div>
          <div class="stat-label">กำลังติดตาม</div>
        </div>
      </div>
      
      <!-- ปุ่มกดติดตาม + แชร์ -->
      <div class="profile-buttons">
        <button class="follow-btn">กดติดตาม</button>
        <button class="share-btn" id="shareProfileBtn">↗️ แชร์โปรไฟล์</button>
      </div>
      
      <!-- แท็บโพสต์ -->
      <div class="post-tabs">
        <div class="post-tab active">โพสต์</div>
        <div class="post-tab">วิดีโอ</div>
        <div class="post-tab">ถูกใจ</div>
      </div>
    </div>
    
    <!-- กริดโพสต์ ตรงตัวอย่าง -->
    <div class="post-grid" id="postHistoryGrid"></div>
  </div>
</div>

<!-- ===== หน้าเล่นวิดีโอ ===== -->
<div class="player-page" id="playerPage">
  <div class="player-top">
    <span class="back-btn" id="backToProfile">←</span>
  </div>
  <div class="player-container">
    <video class="player-media" id="playerVideo" controls playsinline preload="auto" style="display:none;"></video>
    <img class="player-media" id="playerImg" style="display:none;" alt="รูป">
  </div>
</div>

<!-- ===== แถบล่าง ตรงตัวอย่าง ===== -->
<div class="bottom-nav">
  <div class="nav-item active">
    <span class="nav-icon">🏠</span>
    <span>หน้าหลัก</span>
  </div>
  <div class="nav-item">
    <span class="nav-icon">🔍</span>
    <span>ค้นหา</span>
  </div>
  <div class="nav-item" id="addPostBtn">
    <span class="nav-add">+</span>
  </div>
  <div class="nav-item">
    <span class="nav-icon">💬</span>
    <span>ข้อความ</span>
  </div>
  <div class="nav-item">
    <span class="nav-icon">👤</span>
    <span>โปรไฟล์</span>
  </div>
</div>

<!-- ซ่อนไฟล์เลือก -->
<input type="file" id="avatarInput" accept="image/*" class="hidden-input">
<input type="file" id="mediaInput" accept="image/*,video/*" class="hidden-input">

<script>
// ===== ข้อมูลหลัก =====
let profile = JSON.parse(localStorage.getItem('tpProfile') || '{"avatar":"https://picsum.photos/id/1012/100/100","name":"thaipodee"}');
let posts = JSON.parse(localStorage.getItem('tpPosts') || '[]');
let currentPlayingIndex = -1;

function saveAll() {
  localStorage.setItem('tpProfile', JSON.stringify(profile));
  localStorage.setItem('tpPosts', JSON.stringify(posts));
}

// ===== เปลี่ยนรูปโปรไฟล์ =====
document.getElementById('avatarChangeBtn').addEventListener('click', () => {
  document.getElementById('avatarInput').click();
});
document.getElementById('avatarInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    profile.avatar = ev.target.result;
    document.getElementById('mainAvatarImg').src = profile.avatar;
    saveAll();
    alert('✅ เปลี่ยนรูปเรียบร้อย');
  };
  r.readAsDataURL(f);
  e.target.value = '';
});

// ===== แชร์โปรไฟล์ =====
document.getElementById('shareProfileBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(window.location.href);
    alert('✅ คัดลอกลิงก์โปรไฟล์แล้ว');
  } catch {
    alert('ลิงก์: ' + window.location.href);
  }
});

// ===== เพิ่มโพสต์ =====
document.getElementById('addPostBtn').addEventListener('click', () => {
  document.getElementById('mediaInput').click();
});
document.getElementById('mediaInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const isVid = f.type.startsWith('video/');
  const r = new FileReader();
  r.onload = ev => {
    posts.unshift({
      dataUrl: ev.target.result,
      type: isVid ? 'video' : 'image',
      likes: 0,
      liked: false
    });
    saveAll();
    renderProfilePage();
    alert('✅ โพสต์สำเร็จ — แสดงในกริดแล้ว');
  };
  r.readAsDataURL(f);
  e.target.value = '';
});

// ===== เปิดหน้าเล่นจากกริด =====
function openPlayer(index) {
  currentPlayingIndex = index;
  const post = posts[index];
  const playerPage = document.getElementById('playerPage');
  const vidEl = document.getElementById('playerVideo');
  const imgEl = document.getElementById('playerImg');
  
  vidEl.style.display = 'none';
  imgEl.style.display = 'none';
  vidEl.pause();
  
  if (post.type === 'video') {
    vidEl.src = post.dataUrl;
    vidEl.style.display = 'block';
    vidEl.currentTime = 0;
    vidEl.play().catch(()=>{});
  } else {
    imgEl.src = post.dataUrl;
    imgEl.style.display = 'block';
  }
  
  playerPage.classList.add('active');
}

// ===== ปิดกลับโปรไฟล์ =====
document.getElementById('backToProfile').addEventListener('click', () => {
  document.getElementById('playerPage').classList.remove('active');
  document.getElementById('playerVideo').pause();
  document.getElementById('playerVideo').src = '';
  currentPlayingIndex = -1;
});

// ===== แสดงโปรไฟล์และกริดโพสต์ =====
function renderProfilePage() {
  document.getElementById('mainAvatarImg').src = profile.avatar;
  
  // นับโพสต์ ถ้ามีให้แสดงจริง ถ้าไม่มีแสดง 3,279 ตามตัวอย่าง
  document.getElementById('statPost').textContent = posts.length > 0 ? posts.length.toLocaleString() : '3,279';
  
  const grid = document.getElementById('postHistoryGrid');
  grid.innerHTML = '';
  
  if (posts.length === 0) {
    // ตัวอย่างโพสต์เปล่าให้เห็นโครงสร้างตรงภาพ
    for (let i = 0; i < 6; i++) {
      const thumb = document.createElement('div');
      thumb.className = 'post-thumb';
      thumb.style.background = '#eee';
      grid.appendChild(thumb);
    }
    return;
  }
  
  posts.forEach((post, idx) => {
    const thumb = document.createElement('div');
    thumb.className = 'post-thumb';
    thumb.dataset.idx = idx;
    
    if (post.type === 'video') {
      thumb.innerHTML = `
        <video src="${post.dataUrl}" muted preload="metadata"></video>
        <span class="play-icon">▶️</span>
      `;
    } else {
      thumb.innerHTML = `<img src="${post.dataUrl}" alt="ประวัติ" loading="lazy">`;
    }
    
    thumb.addEventListener('click', () => openPlayer(idx));
    grid.appendChild(thumb);
  });
}

// ===== โหลดทันที =====
renderProfilePage();
</script>
</body>
</html>
