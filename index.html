<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  min-width:100%;
  min-height:100%;
  margin:0;
  padding:0;
  background:#000;
  font-family:sans-serif;
  color:#fff;
  overflow:hidden;
  position:fixed;
  inset:0;
}

.splash{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:999;
  transition:opacity .4s ease;
}
.splash.hidden{opacity:0;pointer-events:none}
.splash-logo{font-size:2.5rem;font-weight:bold;color:#e60000;margin-bottom:.5rem}
.splash-text{font-size:.9rem;color:#888}

.version-tag{
  position:absolute;
  top:10px;
  right:10px;

  color:#666;
  z-index:50;
}

.main-screen{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
.main-screen.hidden{display:none}

/* ✅ คำสั่งขยาย-ย่อจอให้เต็มพอดี ทุกขนาด */
.video-container{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  z-index:1;
  display:grid;
  place-items:center center;
}

video{
  width:100%;
  height:100%;
  max-width:100vw;
  max-height:100vh;
  min-width:100%;
  min-height:100%;
  object-fit:contain;
  object-position:center center;
  background:#000;
  transform:none;
}

.tap-layer{
  position:absolute;
  inset:0;
  z-index:10;
  cursor:pointer;
}

.video-info{
  position:absolute;
  left:15px;
  bottom:130px;
  right:80px;
  z-index:20;
}
.video-title{font-size:15px;font-weight:bold;margin-bottom:3px}
.video-desc{font-size:12px;color:#aaa}

.controls-bar{
  position:absolute;
  left:15px;
  right:15px;
  bottom:90px;
  z-index:22;
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 10px;
  background:rgba(0,0,0,.5);
  border-radius:20px;
}
.sound-btn{font-size:18px;background:transparent;border:none;color:#fff;cursor:pointer;padding:2px 6px}
.time-slider{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:#444;border-radius:2px;outline:none}
.time-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;border:none}
.time-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;border:none}
.time-text{font-size:11px;color:#aaa;white-space:nowrap;min-width:70px;text-align:center}

.side-icons{
  position:absolute;
  right:12px;
  bottom:125px;
  display:flex;
  flex-direction:column;
  gap:20px;
  align-items:center;
  z-index:20;
}
.side-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.profile-circle{width:42px;height:42px;border-radius:50%;border:2px solid #fff;overflow:hidden;background:#333}
.profile-circle img{width:100%;height:100%;object-fit:cover}
.side-icon{font-size:22px}
.side-count{font-size:9px;color:#888}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:rgba(0,0,0,.85);
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:0 5px;
  z-index:30;
  border-top:1px solid #222;
}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:9px;color:#888}
.nav-item.active{color:#fff}
.nav-icon{font-size:22px;line-height:1}
.plus-btn{width:48px;height:34px;background:#e60000;border-radius:6px;border:none;color:#fff;font-size:22px;font-weight:bold;cursor:pointer}

#fileInput{display:none}

.profile-screen{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  z-index:40;
  display:none;
  overflow-y:auto;
}
.profile-screen.active{display:block}
.profile-top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:40px}
.profile-logo{display:flex;align-items:center;gap:8px}
.profile-logo img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.profile-logo span{font-size:16px;font-weight:bold}
.profile-edit-btn{border:1px solid #444;border-radius:6px;padding:6px 12px;font-size:13px;color:#fff;background:transparent;cursor:pointer}
.profile-info{padding:0 16px 16px}
.profile-name{font-size:18px;font-weight:bold;margin-bottom:4px}
.profile-stats{display:flex;gap:15px;font-size:13px;color:#888;margin-bottom:10px}
.profile-bio{font-size:13px;color:#aaa;line-height:1.4}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 2px 80px}
.profile-item{aspect-ratio:9/12;background:#222;position:relative;cursor:pointer;overflow:hidden}
.profile-thumb{width:100%;height:100%;object-fit:cover;display:block}
.profile-item-meta{position:absolute;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);font-size:11px;color:#ddd;display:flex;gap:8px}
.profile-delete{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);border:none;color:#fff;width:26px;height:26px;border-radius:50%;font-size:15px;font-weight:bold;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<input type="file" id="fileInput" accept="video/*">

<div class="splash" id="splash">
  <div class="splash-logo">ThaiPodee</div>
  <div class="splash-text">v1121-10</div>
</div>

<div class="main-screen" id="mainScreen">
  <div class="version-tag">v1121-10</div>

  <div class="video-container">
    <video id="videoPlayer" loop playsinline webkit-playsinline>
      <source src="" type="video/mp4">
    </video>
    <div class="tap-layer" id="tapLayer"></div>
  </div>

  <div class="video-info">
    <div class="video-title">ThaiPodee</div>
    <div class="video-desc">แตะหน้าจอ = หยุด / เล่น</div>
  </div>

  <div class="controls-bar">
    <button class="sound-btn" id="soundBtn">🔊</button>
    <span class="time-text" id="timeDisplay">0:00 / 0:00</span>
    <input type="range" class="time-slider" id="timeSlider" min="0" max="100" value="0">
  </div>

  <div class="side-icons">
    <div class="side-btn" data-page="profile">
      <div class="profile-circle">
        <img src="https://i.imgur.com/KJbRzQY.png?v=10" alt="โปรไฟล์">
      </div>
    </div>
    <div class="side-btn">
      <span class="side-icon">❤️</span>
      <span class="side-count" id="likeCount">0</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">💬</span>
      <span class="side-count">0</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">📌</span>
      <span class="side-count">0</span>
    </div>
    <div class="side-btn" id="shareBtn">
      <span class="side-icon">↗️</span>
      <span class="side-count">แชร์</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">🎵</span>
      <span class="side-count">เสียง</span>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" data-page="main">
      <span class="nav-icon">🏠</span>
      <span>หน้าแรก</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>ค้นหา</span>
    </div>
    <div class="nav-item">
      <button class="plus-btn" id="uploadBtn">+</button>
    </div>
    <div class="nav-item">
      <span class="nav-icon">📦</span>
      <span>กล่อง</span>
    </div>
    <div class="nav-item" data-page="profile">
      <span class="nav-icon">👤</span>
      <span>โปรไฟล์</span>
    </div>
  </nav>
</div>

<div class="profile-screen" id="profileScreen">
  <div class="profile-top-bar">
    <div class="profile-logo">
      <img src="https://i.imgur.com/KJbRzQY.png?v=10" alt="โลโก้">
      <span>ThaiPodee</span>
    </div>
    <button class="profile-edit-btn">แก้ไข</button>
  </div>
  <div class="profile-info">
    <div class="profile-name">ThaiPodee User</div>
    <div class="profile-stats">
      <span id="postCount">0 โพสต์</span>
      <span>0 ติดตาม</span>
      <span>0 ไลค์</span>
    </div>
    <div class="profile-bio">แพลตฟอร์มวิดีโอสั้นของไทย</div>
  </div>
  <div class="profile-grid" id="profileGrid"></div>
</div>

<script>
const VERSION = 'v1121-10';
let videoList = JSON.parse(localStorage.getItem('thaiPodeeVideos') || '[]');
let currentIndex = 0;
let isPlaying = true;
let isMuted = false;

const splash = document.getElementById('splash');
const mainScreen = document.getElementById('mainScreen');
const profileScreen = document.getElementById('profileScreen');
const videoPlayer = document.getElementById('videoPlayer');
const tapLayer = document.getElementById('tapLayer');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const shareBtn = document.getElementById('shareBtn');
const profileGrid = document.getElementById('profileGrid');
const postCount = document.getElementById('postCount');
const timeSlider = document.getElementById('timeSlider');
const timeDisplay = document.getElementById('timeDisplay');
const soundBtn = document.getElementById('soundBtn');

function hideSplash() {
  splash.classList.add('hidden');
  if (videoList.length > 0) { loadVideo(0); renderProfileGrid(); }
  updateProfileStats();
}
setTimeout(hideSplash, 800);

// ✅ ปรับอัตโนมัติเมื่อเปลี่ยนขนาดจอ / หมุนจอ
function fitVideoToScreen() {
  if (!videoPlayer.videoWidth || !videoPlayer.videoHeight) return;
  videoPlayer.style.width = '100%';
  videoPlayer.style.height = '100%';
}
window.addEventListener('resize', fitVideoToScreen);
window.addEventListener('orientationchange', fitVideoToScreen);
videoPlayer.addEventListener('loadedmetadata', fitVideoToScreen);

function formatTime(secs) {
  if (!secs || isNaN(secs)) return '0:00';
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

videoPlayer.addEventListener('timeupdate', () => {
  if (videoPlayer.duration) {
    const pct = (videoPlayer.currentTime / videoPlayer.duration) * 100;
    timeSlider.value = pct;
    timeDisplay.textContent = `${formatTime(videoPlayer.currentTime)} / ${formatTime(videoPlayer.duration)}`;
  }
});

timeSlider.addEventListener('input', () => {
  if (videoPlayer.duration) {
    videoPlayer.currentTime = (timeSlider.value / 100) * videoPlayer.duration;
  }
});

soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  isMuted = !isMuted;
  videoPlayer.muted = isMuted;
  soundBtn.textContent = isMuted ? '🔇' : '🔊';
});

function loadVideo(i) {
  if (!videoList.length) return;
  videoPlayer.src = videoList[i].url;
  videoPlayer.load();
  if (isPlaying) videoPlayer.play().catch(() => { isPlaying = false; });
}

tapLayer.addEventListener('click', () => {
  if (videoPlayer.paused) { videoPlayer.play(); isPlaying = true; }
  else { videoPlayer.pause(); isPlaying = false; }
});

videoPlayer.addEventListener('ended', () => {
  videoPlayer.currentTime = 0;
  videoPlayer.play();
});

function generateThumbnail(file, callback) {
  const video = document.createElement('video');
  video.src = URL.createObjectURL(file);
  video.muted = true;
  video.playsInline = true;
  video.preload = 'metadata';
  video.addEventListener('loadeddata', () => { video.currentTime = Math.min(0.3, video.duration / 5); });
  video.addEventListener('seeked', () => {
    const c = document.createElement('canvas');
    c.width = 320; c.height = 400;
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    try { callback(c.toDataURL('image/jpeg', 0.7)); } catch { callback(null); }
    try { URL.revokeObjectURL(video.src); } catch {}
  });
  video.addEventListener('error', () => callback(null));
}

uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const u = URL.createObjectURL(f);
  generateThumbnail(f, thumb => {
    videoList.unshift({ id: Date.now(), name: f.name, url: u, thumbnail: thumb || u, views: 0, likes: 0 });
    saveVideos(); renderProfileGrid(); updateProfileStats(); loadVideo(0); currentIndex = 0;
    fileInput.value = '';
  });
});

function saveVideos() { localStorage.setItem('thaiPodeeVideos', JSON.stringify(videoList)); }
function updateProfileStats() { postCount.textContent = `${videoList.length} โพสต์`; }

function renderProfileGrid() {
  profileGrid.innerHTML = '';
  videoList.forEach((v, idx) => {
    const item = document.createElement('div');
    item.className = 'profile-item';
    const thumb = v.thumbnail || 'https://i.imgur.com/KJbRzQY.png?v=10';
    item.innerHTML = `
      <button class="profile-delete" data-idx="${idx}">×</button>
      <img src="${thumb}" class="profile-thumb" alt="วิดีโอ" loading="lazy">
      <div class="profile-item-meta"><span>▶ ${v.views || 0}</span><span>❤️ ${v.likes || 0}</span></div>
    `;
    item.onclick = ev => {
      if (ev.target.classList.contains('profile-delete')) return;
      currentIndex = idx; loadVideo(idx); showPage('main');
    };
    profileGrid.appendChild(item);
  });
  document.querySelectorAll('.profile-delete').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.idx);
      if (!confirm('ลบ?')) return;
      try { URL.revokeObjectURL(videoList[i].url); } catch {}
      videoList.splice(i, 1); saveVideos(); renderProfileGrid(); updateProfileStats();
      if (currentIndex >= videoList.length) currentIndex = Math.max(0, videoList.length - 1);
      if (videoList.length) loadVideo(currentIndex);
    };
  });
}

function showPage(page) {
  mainScreen.classList.toggle('hidden', page === 'profile');
  profileScreen.classList.toggle('active', page === 'profile');
  if (page === 'profile') renderProfileGrid();
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
}

document.querySelectorAll('[data-page]').forEach(b => { b.onclick = () => showPage(b.dataset.page); });

shareBtn.onclick = async () => {
  const link = window.location.href.split('?')[0] + '?v=1121-10';
  try {
    if (navigator.share) await navigator.share({title:'ThaiPodee', url:link});
    else { await navigator.clipboard.writeText(link); alert('✅ คัดลอกแล้ว'); }
  } catch { alert(link); }
};
</script>
</body>
