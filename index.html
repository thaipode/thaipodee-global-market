<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="application-name" content="ThaiPodee">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<meta name="description" content="ThaiPodee — แอปวิดีโอและตลาดสินค้าไทย">
<meta name="theme-color" content="#000000">
<meta name="background-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/png" sizes="512x512" href="thaipodee_logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="thaipodee_logo.png">
<title>ThaiPodee</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
body{background:#000;color:#fff;height:100vh;overflow:hidden;}
.page{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;}
.page.active{display:flex;}
.main-page{z-index:1;}
.profile-page{z-index:2;background:#000;padding:15px;overflow-y:auto;}
.back-btn{background:transparent;color:#fff;border:none;font-size:16px;padding:10px 0;cursor:pointer;display:flex;align-items:center;gap:5px;margin-bottom:10px;}
.cloud-status{font-size:12px;text-align:center;padding:6px;margin-bottom:8px;border-radius:4px;}
.cloud-status.online{color:#4ade80;background:rgba(74,222,128,0.1);}
.cloud-status.offline{color:#facc15;background:rgba(250,204,21,0.1);}
.profile-header{text-align:center;margin-bottom:25px;padding-bottom:20px;border-bottom:1px solid #222;}
.profile-avatar-large{width:90px;height:90px;border-radius:50%;border:3px solid #fff;margin:0 auto 12px;overflow:hidden;cursor:pointer;background:#333;display:flex;align-items:center;justify-content:center;font-size:40px;}
.profile-avatar-large img{width:100%;height:100%;object-fit:cover;display:none;}
.profile-name{font-size:20px;font-weight:bold;margin-bottom:8px;}
.edit-name-input{background:#222;border:1px solid #444;color:#fff;padding:8px 12px;border-radius:8px;font-size:16px;text-align:center;width:220px;margin-bottom:10px;display:none;}
.save-name-btn,.change-avatar-btn{background:#ff2442;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer;margin:4px;}
.hidden-input{display:none;}
.profile-title{font-size:18px;font-weight:bold;margin-bottom:15px;}
.video-list{display:flex;flex-direction:column;gap:12px;}
.video-item{display:flex;align-items:center;gap:12px;padding:12px;background:#1a1a1a;border-radius:10px;}
.video-item-thumb{width:80px;height:45px;background:#333;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0;background-size:cover;background-position:center;}
.video-item-info{flex:1;cursor:pointer;}
.video-item-name{font-size:14px;margin-bottom:2px;}
.video-item-date{font-size:11px;color:#888;}
.video-delete-btn{background:#cc0000;color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.empty-text{text-align:center;color:#666;padding:40px 20px;}
.video-area{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:#000;width:100%;}
.play-box{text-align:center;width:100%;padding:20px;}
.play-icon{font-size:64px;color:#fff;margin-bottom:12px;}
.play-text{font-size:15px;color:#888;margin-bottom:20px;}
.video-player{max-width:100%;width:100%;max-height:65vh;border-radius:8px;display:none;background:#000;}
.has-video .play-box{display:none;}
.has-video .video-player{display:block;}
.upload-btn{background:#ff2442;color:#fff;border:none;padding:12px 24px;border-radius:25px;font-size:15px;cursor:pointer;}
.upload-input{display:none;}
.right-bar{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:24px;align-items:center;z-index:10;}
.side-btn{border:none;background:transparent;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.side-icon{font-size:28px;line-height:1;}
.side-num{font-size:11px;color:#fff;min-height:14px;}
.avatar-wrap{position:relative;width:44px;height:44px;overflow:hidden;border-radius:50%;border:2px solid #fff;background:#333;}
.avatar-wrap img{width:100%;height:100%;object-fit:cover;display:none;}
.avatar-circle{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.plus-red{position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:50%;background:#ff2442;color:#fff;font-size:13px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #000;line-height:1;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#000;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #222;z-index:10;}
.nav-btn{border:none;background:transparent;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nav-icon{font-size:22px;}
.nav-label{font-size:10px;color:#aaa;}
.nav-btn.active .nav-label{color:#fff;}
.plus-center{width:46px;height:34px;background:#ff2442;border-radius:8px;font-size:24px;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>

<div class="page main-page active" id="mainPage">
  <div class="cloud-status offline" id="cloudStatus">กำลังเชื่อมต่อ...</div>
  <div class="video-area" id="videoArea">
    <div class="play-box" id="playBox">
      <div class="play-icon">▶</div>
      <p class="play-text" id="playText">กดปุ่ม + ด้านล่างเพื่ออัปโหลดวิดีโอ</p>
      <button class="upload-btn" id="uploadBtn">📂 เลือกวิดีโอจากเครื่อง</button>
      <input type="file" class="upload-input" id="uploadInput" accept="video/*">
    </div>
    <video class="video-player" id="videoPlayer" controls playsinline preload="metadata"></video>
  </div>
  <div class="right-bar">
    <button class="side-btn" id="btnAvatar">
      <div class="avatar-wrap" id="avatarWrap">
        <div class="avatar-circle" id="avatarCircle">👤</div>
        <img id="avatarImg" alt="avatar">
        <div class="plus-red">+</div>
      </div>
    </button>
    <button class="side-btn" id="btnLike">
      <span class="side-icon" id="likeIcon">🤍</span>
      <span class="side-num" id="likeNum">0</span>
    </button>
    <button class="side-btn" id="btnComment">
      <span class="side-icon">💬</span>
      <span class="side-num" id="commentNum">0</span>
    </button>
    <button class="side-btn" id="btnSave">
      <span class="side-icon">🔖</span>
      <span class="side-num" id="saveNum">0</span>
    </button>
    <button class="side-btn" id="btnShare">
      <span class="side-icon">↗️</span>
      <span class="side-num" id="shareNum">0</span>
    </button>
    <button class="side-btn" id="btnMusic">
      <span class="side-icon">🎵</span>
    </button>
  </div>
</div>

<div class="page profile-page" id="profilePage">
  <button class="back-btn" id="backBtn">◀ กลับ</button>
  <div class="profile-header">
    <div class="profile-avatar-large" id="profileAvatarLarge">
      <span id="largeAvatarText">👤</span>
      <img id="largeAvatarImg" alt="รูปโปรไฟล์">
    </div>
    <h2 class="profile-name" id="profileNameDisplay">ผู้ใช้ ThaiPodee</h2>
    <input type="text" class="edit-name-input" id="editNameInput" placeholder="พิมพ์ชื่อของคุณ">
    <div>
      <button class="change-avatar-btn" id="changeAvatarBtn">📷 เปลี่ยนรูป</button>
      <button class="change-avatar-btn" id="editNameBtn" style="background:#222;">✏️ เปลี่ยนชื่อ</button>
      <button class="save-name-btn" id="saveNameBtn" style="display:none;">✅ บันทึกชื่อ</button>
    </div>
    <input type="file" class="hidden-input" id="avatarInput" accept="image/*">
  </div>
  <h3 class="profile-title">วิดีโอทั้งหมด <span id="postCountSpan">(0)</span></h3>
  <div class="video-list" id="videoList">
    <p class="empty-text">ยังไม่มีวิดีโอ — เป็นคนแรกที่โพสต์!</p>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="navHome">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">หน้าแรก</span>
  </button>
  <button class="nav-btn" id="navShop">
    <span class="nav-icon">🛍️</span>
    <span class="nav-label">ร้านค้า</span>
  </button>
  <button class="nav-btn" id="navAdd">
    <span class="plus-center">+</span>
  </button>
  <button class="nav-btn" id="navMsg">
    <span class="nav-icon">💬</span>
    <span class="nav-label">ข้อความ</span>
  </button>
  <button class="nav-btn" id="navProfile">
    <span class="nav-icon">👤</span>
    <span class="nav-label">โปรไฟล์</span>
  </button>
</nav>

<script>
const CONFIG = {
  username: 'thaipodee',
  repo: 'thaipodee-global-market',
  token: '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',
  branch: 'main'
};
const STORAGE_KEY = 'thaipodeeVideos';
const NAME_KEY = 'thaipodeeUserName';
const AVATAR_KEY = 'thaipodeeUserAvatar';
let savedVideos = [];
let lastSyncHash = '';
let isSyncing = false;
const cloudStatus = document.getElementById('cloudStatus');
const postCountSpan = document.getElementById('postCountSpan');
const videoPlayer = document.getElementById('videoPlayer');
const videoArea = document.getElementById('videoArea');

function loadProfile() {
  const n = localStorage.getItem(NAME_KEY);
  const a = localStorage.getItem(AVATAR_KEY);
  if (n) document.getElementById('profileNameDisplay').textContent = n;
  if (a) {
    document.getElementById('avatarImg').src = a;
    document.getElementById('avatarImg').style.display = 'block';
    document.getElementById('avatarCircle').style.display = 'none';
    document.getElementById('largeAvatarImg').src = a;
    document.getElementById('largeAvatarImg').style.display = 'block';
    document.getElementById('largeAvatarText').style.display = 'none';
  }
}

async function uploadToGitHub(file, fileName) {
  const reader = new FileReader();
  return new Promise((resolve, reject) => {
    reader.onload = async e => {
      const content = btoa(e.target.result);
      const path = `data/videos/${Date.now()}_${fileName}`;
      const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${path}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${CONFIG.token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Upload video: ${fileName}`,
          content: content,
          branch: CONFIG.branch
        })
      });
      const data = await res.json();
      if (data.content) resolve(data.content.download_url);
      else reject(new Error(data.message || 'Upload failed'));
    };
    reader.onerror = reject;
    reader.readAsBinaryString(file);
  });
}

async function syncFromCloud() {
  if (isSyncing) return;
  isSyncing = true;
  try {
    const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/data/videos.json?ref=${CONFIG.branch}`, {
      headers: { 'Authorization': `token ${CONFIG.token}` }
    });
    if (res.status === 404) {
      cloudStatus.textContent = '⚠️ ยังไม่มีข้อมูล';
      cloudStatus.className = 'cloud-status offline';
      isSyncing = false;
      return;
    }
    const data = await res.json();
    if (data.content) {
      const decoded = JSON.parse(atob(data.content));
      const h = JSON.stringify(decoded);
      if (h !== lastSyncHash) {
        savedVideos = decoded;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedVideos));
        lastSyncHash = h;
        renderVideoList();
      }
      cloudStatus.textContent = '✅ ออนไลน์';
      cloudStatus.className = 'cloud-status online';
    }
  } catch (err) {
    console.error(err);
    cloudStatus.textContent = '⚠️ ออฟไลน์';
    cloudStatus.className = 'cloud-status offline';
  }
  isSyncing = false;
}

async function saveToCloud() {
  try {
    const fileRes = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/data/videos.json?ref=${CONFIG.branch}`, {
      headers: { 'Authorization': `token ${CONFIG.token}` }
    });
    const body = {
      message: `Update: ${new Date().toLocaleString('th-TH')}`,
      content: btoa(JSON.stringify(savedVideos, null, 2)),
      branch: CONFIG.branch,
      path: 'data/videos.json'
    };
    if (fileRes.ok) {
      const fileData = await fileRes.json();
      body.sha = fileData.sha;
    }
    await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/data/videos.json`, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${CONFIG.token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(savedVideos));
    lastSyncHash = JSON.stringify(savedVideos);
  } catch (err) {
    console.error(err);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(savedVideos));
  }
}

function renderVideoList() {
  const list = document.getElementById('videoList');
  list.innerHTML = '';
  postCountSpan.textContent = `(${savedVideos.length})`;
  if (savedVideos.length === 0) {
    list.innerHTML = '<p class="empty-text">ยังไม่มีวิดีโอ</p>';
    return;
  }
  savedVideos.slice().reverse().forEach((vid, idx) => {
    const realIdx = savedVideos.length - 1 - idx;
    const el = document.createElement('div');
    el.className = 'video-item';
    el.innerHTML = `
      <div class="video-item-thumb" data-idx="${realIdx}" style="background-image:${vid.thumb ? `url(${vid.thumb})` : 'none'}">${!vid.thumb ? '▶' : ''}</div>
      <div class="video-item-info" data-idx="${realIdx}">
        <div class="video-item-name">${vid.name}</div>
        <div class="video-item-date">${vid.date} — ${vid.by}</div>
      </div>
      <button class="video-delete-btn" data-idx="${realIdx}">🗑️</button>
    `;
    list.appendChild(el);
  });
  document.querySelectorAll('.video-item-thumb, .video-item-info').forEach(b => {
    b.onclick = e => playVideo(parseInt(e.currentTarget.dataset.idx));
  });
  document.querySelectorAll('.video-delete-btn').forEach(b => {
    b.onclick = async e => {
      if (confirm('ลบวิดีโอนี้?')) {
        savedVideos.splice(parseInt(e.target.dataset.idx), 1);
        await saveToCloud();
        renderVideoList();
      }
    };
  });
}

function playVideo(idx) {
  const vid = savedVideos[idx];
  if (!vid) return;
  videoPlayer.removeAttribute('src');
  videoArea.classList.remove('has-video');
  if (vid.url) {
    videoPlayer.src = vid.url;
    videoArea.classList.add('has-video');
    showPage('main');
    videoPlayer.play().catch(() => {});
  } else {
    alert(`📺 ${vid.name}\n📅 ${vid.date}\n👤 โดย: ${vid.by}`);
    showPage('main');
  }
}

document.getElementById('uploadInput').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  const myName = localStorage.getItem(NAME_KEY) || 'ผู้ใช้';
  try {
    cloudStatus.textContent = 'กำลังอัปโหลด...';
    cloudStatus.className = 'cloud-status offline';
    const videoUrl = await uploadToGitHub(file, file.name);
    const tempVid = document.createElement('video');
    tempVid.src = videoUrl;
    tempVid.preload = 'metadata';
    tempVid.onloadeddata = () => { tempVid.currentTime = 1; };
    tempVid.onseeked = async () => {
      const c = document.createElement('canvas');
      c.width = 160; c.height = 90;
      const ctx = c.getContext('2d');
      ctx.drawImage(tempVid, 0, 0, 160, 90);
      savedVideos.push({
        name: file.name, date: dateStr, by: myName,
        url: videoUrl, thumb: c.toDataURL('image/png')
      });
      await saveToCloud();
      renderVideoList();
      playVideo(savedVideos.length - 1);
      cloudStatus.textContent = '✅ อัปโหลดสำเร็จ';
      cloudStatus.className = 'cloud-status online';
    };
  } catch (err) {
    alert('เกิดข้อผิดพลาด: ' + err.message);
    const localUrl = URL.createObjectURL(file);
    savedVideos.push({
      name: file.name, date: dateStr, by: myName,
      url: localUrl, thumb: null
    });
    saveToCloud();
    renderVideoList();
    playVideo(savedVideos.length - 1);
  }
  e.target.value = '';
};

document.getElementById('editNameBtn').onclick = () => {
  document.getElementById('editNameInput').value = document.getElementById('profileNameDisplay').textContent;
  document.getElementById('editNameInput').style.display = 'block';
  document.getElementById('saveNameBtn').style.display = 'inline-block';
  document.getElementById('editNameBtn').style.display = 'none';
  document.getElementById('profileNameDisplay').style.display = 'none';
};
document.getElementById('saveNameBtn').onclick = async () => {
  const name = document.getElementById('editNameInput').value.trim() || 'ผู้ใช้ ThaiPodee';
  localStorage.setItem(NAME_KEY, name);
  document.getElementById('profileNameDisplay').textContent = name;
  document.getElementById('editNameInput').style.display = 'none';
  document.getElementById('saveNameBtn').style.display = 'none';
  document.getElementById('editNameBtn').style.display = 'inline-block';
  document.getElementById('profileNameDisplay').style.display = 'block';
};
document.getElementById('changeAvatarBtn').onclick = () => {
  document.getElementById('avatarInput').click();
};
document.getElementById('avatarInput').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const d = ev.target.result;
    localStorage.setItem(AVATAR_KEY, d);
    document.getElementById('avatarImg').src = d;
    document.getElementById('avatarImg').style.display = 'block';
    document.getElementById('avatarCircle').style.display = 'none';
    document.getElementById('largeAvatarImg').src = d;
    document.getElementById('largeAvatarImg').style.display = 'block';
    document.getElementById('largeAvatarText').style.display = 'none';
  };
  r.readAsDataURL(f);
};

function showPage(p) {
  document.getElementById('mainPage').classList.toggle('active', p === 'main');
  document.getElementById('profilePage').classList.toggle('active', p === 'profile');
}
function setNav(id) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('navHome').onclick = () => { showPage('main'); setNav('navHome'); };
document.getElementById('navShop').onclick = () => setNav('navShop');
document.getElementById('navAdd').onclick = () => { document.getElementById('uploadInput').click(); };
document.getElementById('navMsg').onclick = () => setNav('navMsg');
document.getElementById('navProfile').onclick = () => { showPage('profile'); setNav('navProfile'); };
document.getElementById('backBtn').onclick = () => { showPage('main'); setNav('navHome'); };
document.getElementById('btnShare').onclick = () => {
  const url = window.location.href;
  if (navigator.share) navigator.share({title: 'ThaiPodee', url: url});
  else { navigator.clipboard.writeText(url); alert('คัดลอกลิงก์แล้ว ✅'); }
};

window.onload = () => {
  loadProfile();
  syncFromCloud();
  setInterval(syncFromCloud, 10000);
};
</script>
</body>
</html>
