        .center-plus { position: relative; }

        .page {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;

        .page.active { display: block; }
        .profile-header { padding: 20px 16px; text-align: center; }
        .profile-avatar-lg {
            width: 96px; height: 96px; border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #f76b1c); background-size: cover; background-position: center;
            border: 3px solid #fff; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 40px;

        }
        .profile-username { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .profile-handle { font-size: 14px; color: #888; margin-bottom: 12px; }
        .profile-stats {
            display: flex; justify-content: center; gap: 30px; margin: 16px 0;
        }
        .stat-item { text-align: center; }
        .stat-num { font-size: 18px; font-weight: 700; }
        .stat-label { font-size: 11px; color: #888; }
        .profile-bio {
            font-size: 13px; color: #ddd; line-height: 1.6; margin: 12px 16px; text-align: center;
        }
        .profile-actions { display: flex; justify-content: center; gap: 10px; margin: 16px; }
        .action-btn {

        }
        .btn-primary { background: #ff2442; color: #fff; }
        .btn-secondary { background: #333; color: #fff; }
        .profile-tabs {
            display: flex; border-top: 1px solid #222; margin-top: 10px;
        }
        .tab-item {

        }
        .tab-item.active { color: #fff; border-bottom-color: #fff; }
        .posts-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px;
        }
        .grid-item {
            aspect-ratio: 9/12; background: #111; position: relative; overflow: hidden; cursor: pointer;
        }
        .grid-item img, .grid-item video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .grid-item .play-icon {

        }
        .back-link { font-size: 18px; cursor: pointer; margin: 16px; display: inline-block; color: #fff; }
        .hidden { display: none; }

        /* --- หน้าโพสต์ --- */
        .form-wrap { padding: 0 16px 120px; }
        .form-title { text-align: center; margin: 20px 0; font-size: 18px; font-weight: 600; color: #fff; }
        .field-label { font-size: 13px; color: #aaa; margin: 20px 0 6px; display: block; }
        .field-input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background: #1a1a2e; color: #fff; font-size: 15px;
        }
        .audio-pick {
            background: #1a1a2e; border-radius: 12px; padding: 16px; margin: 16px; cursor: pointer;
        }

        .preview-img { width: 100%; max-height: 350px; object-fit: contain; margin: 16px 0; border-radius: 8px; background: #111; }
    </style>
</head>
<body>

<script>
const VER = '3.2';

// --- บีบอัดรูป ---
async function compressImage(file, maxWidth = 1080, quality = 0.82) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = URL.createObjectURL(file);
    });
}

// --- แจ้งเตือน ---
function showStatus(msg, type='ok') {
    const el = document.getElementById('status-bar');
    el.className = 'status-bar ' + (type==='warn'?'warn':type==='err'?'err':'');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3500);
}

// --- ระบบคลาวด์ ---
const CLOUD = {
    _key: 'thaipodee_cloud_v3_2',
    
    _getAll() {
        const data = localStorage.getItem(this._key);
        return data ? JSON.parse(data) : {
            posts: [], users: {}, updated: Date.now(),
            profile: {
                name: 'Thaipodee Global Market',
                handle: '@ThaipodeeGlobalMarket',
                bio: 'แพลตฟอร์มตลาดออนไลน์แห่งประเทศไทย\nThaipodee Global Market — Platform Founder ✨',
                avatar: 'LOGO',
                following: 0, likes: 0, followers: 0
            }
        };
    },
    _saveAll(obj) {
        obj.updated = Date.now();
        localStorage.setItem(this._key, JSON.stringify(obj));
        return true;
    },

    getMyId() {
        let id = localStorage.getItem('thaipodee_myid_v3');
        if (!id) {
            id = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            localStorage.setItem('thaipodee_myid_v3', id);
        }
        return id;
    },

    getProfile() {
        return this._getAll().profile;
    },
    saveProfile(updates) {
        const data = this._getAll();
        data.profile = { ...data.profile, ...updates };
        return this._saveAll(data);
    },

    addPost(type, dataUrl, caption, music) {
        const data = this._getAll();
        const post = {
            id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            type, data: dataUrl, caption, music,
            likes: 0, comments: 0, saves: 0, shares: 0, time: Date.now()
        };
        data.posts.unshift(post);
        // อัปเดตจำนวนถูกใจรวม
        data.profile.likes = data.posts.reduce((sum, p) => sum + p.likes, 0);
        this._saveAll(data);
        return post;
    },

    listPosts() { return this._getAll().posts; },
    
    likePost(pid) {
        const data = this._getAll();
        const p = data.posts.find(x => x.id === pid);
        if (p) { p.likes++; data.profile.likes = data.posts.reduce((s, x) => s + x.likes, 0); return this._saveAll(data); }
        return false;
    }
};

const ME = CLOUD.getMyId();
let pendingMedia = null, pendingAudio = null, pendingMediaDataUrl = null;

// --- แสดงรูปโปรไฟล์ ---
function renderAvatar(el, avatarData) {
    if (avatarData && avatarData !== 'LOGO') {
        el.style.backgroundImage = `url(${avatarData})`;
        el.textContent = '';
    } else {
        el.style.backgroundImage = '';
        el.textContent = '🛒';
    }
}

// --- เปลี่ยนหน้า ---
function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    if (pageId === 'feed') {
        document.getElementById('feed-container').style.display = 'block';
        document.getElementById('nav-home').classList.add('active');
        renderFeed();
    } else if (pageId === 'profile') {
        document.getElementById('feed-container').style.display = 'none';
        document.getElementById('page-profile').classList.add('active');
        document.getElementById('nav-profile').classList.add('active');
        renderProfilePage();
    } else if (pageId === 'page-sound') {
        document.getElementById('feed-container').style.display = 'none';
        document.getElementById('page-sound').classList.add('active');
    }
}

// --- แสดงหน้าโปรไฟล์ ---
function renderProfilePage() {
    const profile = CLOUD.getProfile();
    const posts = CLOUD.listPosts();
    
    // ข้อมูลหัวโปรไฟล์
    renderAvatar(document.getElementById('profile-avatar-main'), profile.avatar);
    document.getElementById('profile-name').textContent = profile.name;
    document.getElementById('profile-handle').textContent = profile.handle;
    document.getElementById('profile-bio').innerHTML = profile.bio.replace(/\n/g, '<br>');
    document.getElementById('stat-following').textContent = profile.following;
    document.getElementById('stat-likes').textContent = profile.likes;
    document.getElementById('stat-followers').textContent = profile.followers;
    
    // ตารางโพสต์
    const grid = document.getElementById('posts-grid');
    grid.innerHTML = '';
    
    if (posts.length === 0) {
        grid.innerHTML = '<p style="grid-column:span 3;text-align:center;color:#666;padding:40px 0;">ยังไม่มีโพสต์ กด + เพื่อสร้างโพสต์แรก ✨</p>';
        return;
    }
    
    posts.forEach(post => {
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.dataset.pid = post.id;
        
        if (post.type === 'video') {
            item.innerHTML = `
                <video src="${post.data}" muted loop playsinline></video>
                <span class="play-icon">▶</span>
            `;
        } else {
            item.innerHTML = `<img src="${post.data}" alt="โพสต์">`;
        }
        
        grid.appendChild(item);
    });
}

// --- แสดงฟีดหน้าหลัก ---
function renderFeed() {
    const box = document.getElementById('feed-container');
    const posts = CLOUD.listPosts();
    const profile = CLOUD.getProfile();
    box.innerHTML = '';

    if (posts.length === 0) {
        box.innerHTML = `
            <div class="post-item">
                <div class="media-area">
                    <div class="demo-screen">
                        <div>
                            <div class="demo-icon">🌏</div>
                            <div class="demo-title">Thaipodee Global Market</div>
                            <div class="demo-desc">ระบบคลาวด์พร้อมใช้งานแล้ว!<br>โพสต์ได้ไม่จำกัด ไม่ต้องลบรูปเก่า ✨</div>
                            <div class="demo-tip">👇 กด + ด้านล่าง เพื่อโพสต์ภาพแรกของคุณ</div>
                        </div>
                    </div>
                </div>
                <div class="post-info">
                    <div class="post-username" id="demo-avatar-link">${profile.handle} 👆 แตะเพื่อตั้งค่า</div>
                    <div class="post-caption">ยินดีต้อนรับสู่ Thaipodee Global Market — ไม่มีวันเต็ม! 🎉</div>
                    <div class="post-music">🎵 เพลงต้อนรับ</div>
                </div>
                <div class="side-buttons">
                    <div class="side-btn" id="demo-avatar-btn">
                        <div class="avatar-holder">
                            <div class="avatar-img" id="demo-avatar-icon"></div>
                        </div>
                    </div>
                    <div class="side-btn"><span class="icon">❤️</span><span class="count">0</span></div>
                    <div class="side-btn"><span class="icon">💬</span><span class="count">0</span></div>
                    <div class="side-btn"><span class="icon">⭐</span><span class="count">0</span></div>
                    <div class="side-btn"><span class="icon">↗️</span><span class="count">0</span></div>
                    <div class="side-btn"><span class="icon">🎵</span></div>
                </div>
            </div>
        `;
        renderAvatar(document.getElementById('demo-avatar-icon'), profile.avatar);
        document.getElementById('demo-avatar-btn').onclick = () => showPage('profile');
        document.getElementById('demo-avatar-link').onclick = () => showPage('profile');
        return;
    }

    posts.forEach(post => {
        const el = document.createElement('div');
        el.className = 'post-item';
        const media = post.type==='video'
            ? `<video src="${post.data}" loop playsinline controls></video>`
            : `<img src="${post.data}" alt="โพสต์">`;
        
        el.innerHTML = `
            <div class="media-area">${media}</div>
            <div class="post-info">
                <div class="post-username">${profile.handle}</div>
                <div class="post-caption">${post.caption}</div>
                <div class="post-music">🎵 ${post.music}</div>
            </div>
            <div class="side-buttons">
                <div class="side-btn" id="feed-avatar-click">
                    <div class="avatar-holder">
                        <div class="avatar-img" id="feed-avatar-icon"></div>
                    </div>
                </div>
                <div class="side-btn like-btn" data-pid="${post.id}" data-n="${post.likes}">
                    <span class="icon">❤️</span><span class="count">${post.likes}</span>
                </div>
                <div class="side-btn"><span class="icon">💬</span><span class="count">${post.comments}</span></div>
                <div class="side-btn"><span class="icon">⭐</span><span class="count">${post.saves}</span></div>
                <div class="side-btn"><span class="icon">↗️</span><span class="count">${post.shares}</span></div>
                <div class="side-btn"><span class="icon">🎵</span></div>
            </div>
        `;
        box.appendChild(el);
    });

    renderAvatar(document.getElementById('feed-avatar-icon'), profile.avatar);
    document.getElementById('feed-avatar-click').onclick = () => showPage('profile');
    bindLikes();
}

function bindLikes() {
    document.querySelectorAll('.like-btn').forEach(b => {
        b.onclick = () => {
            CLOUD.likePost(b.dataset.pid);
            const n = parseInt(b.dataset.n) + 1;
            b.dataset.n = n;
            b.querySelector('.count').textContent = n;
        };
    });
}

// --- อัปโหลดรูปโปรไฟล์ ---
document.getElementById('profile-avatar-main').onclick = () => {
    document.getElementById('avatar-file').click();
};
document.getElementById('avatar-file').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    const imgData = await compressImage(f, 300, 0.9);
    CLOUD.saveProfile({ avatar: imgData });
    renderAvatar(document.getElementById('profile-avatar-main'), imgData);
    showStatus('✅ อัปเดตรูปโปรไฟล์สำเร็จ');
};

// --- ปุ่มแก้ไขโปรไฟล์ ---
document.getElementById('btn-edit-profile').onclick = () => {
    const profile = CLOUD.getProfile();
    const newName = prompt('ตั้งชื่อแสดง:', profile.name);
    if (newName && newName.trim()) {
        const newHandle = '@' + newName.trim().replace(/\s+/g, '_').substring(0, 20);
        CLOUD.saveProfile({ name: newName.trim(), handle: newHandle });
        showStatus('✅ บันทึกสำเร็จ');
        renderProfilePage();
    }
};

// --- เลือกไฟล์เพื่อโพสต์ ---
document.getElementById('media-file').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    pendingMedia = { type: f.type.startsWith('video')?'video':'image', file:f };
    
    if (pendingMedia.type === 'image') {
        pendingMediaDataUrl = await compressImage(f, 1280, 0.82);
        document.getElementById('media-preview-area').innerHTML = `<img src="${pendingMediaDataUrl}" class="preview-img">`;
    } else {
        pendingMediaDataUrl = URL.createObjectURL(f);
        document.getElementById('media-preview-area').innerHTML = `<video src="${pendingMediaDataUrl}" class="preview-img" controls autoplay muted loop style="max-height:300px;"></video>`;
    }
    showPage('page-sound');
};

document.getElementById('audio-file').onchange = e => {
    pendingAudio = e.target.files[0] || null;
    document.getElementById('audio-status').textContent = pendingAudio ? '✅ เลือกแล้ว: '+pendingAudio.name : 'ยังไม่ได้เลือก — จะใช้เสียงต้นฉบับ';
};

// --- ยืนยันโพสต์ ---
document.getElementById('do-post').onclick = () => {
    if (!pendingMedia || !pendingMediaDataUrl) return alert('❌ กรุณาเลือกภาพก่อนครับ');
    
    const caption = prompt('เขียนคำอธิบาย:', 'แชร์สิ่งดี ๆ จาก Thaipodee Global Market ✨');
    if (caption === null) return;
    
    CLOUD.addPost(
        pendingMedia.type,
        pendingMediaDataUrl,
        caption || 'แชร์สิ่งดี ๆ จาก Thaipodee Global Market ✨',
        pendingAudio ? pendingAudio.name : 'เสียงต้นฉบับ'
    );
    
    pendingMedia = pendingAudio = pendingMediaDataUrl = null;
    document.getElementById('media-file').value = '';
    document.getElementById('audio-file').value = '';
    document.getElementById('audio-status').textContent = 'ยังไม่ได้เลือก — จะใช้เสียงต้นฉบับ';
    document.getElementById('media-preview-area').innerHTML = '';
    
    showStatus('✅ โพสต์สำเร็จ! ดูที่แท็บ "วิดีโอ" ในโปรไฟล์');
    showPage('feed');
};

// --- ปุ่มกลับ ---
document.getElementById('back-sound').onclick = () => {
    pendingMedia = pendingAudio = pendingMediaDataUrl = null;
    document.getElementById('media-file').value = '';
    document.getElementById('audio-file').value = '';
    document.getElementById('audio-status').textContent = 'ยังไม่ได้เลือก — จะใช้เสียงต้นฉบับ';
    document.getElementById('media-preview-area').innerHTML = '';
    showPage('feed');
};

// --- เมนูทั้งหมด ---
document.querySelectorAll('.nav-item[data-goto]').forEach(item => {
    item.onclick = () => {
        const t = item.dataset.goto;
        if (t==='market'||t==='messages') return alert('🚧 กำลังพัฒนา — ขอบคุณที่รอคอยครับ');
        showPage(t);
    };
});

// --- แท็บในโปรไฟล์ ---
document.querySelectorAll('.tab-item').forEach(tab => {
    tab.onclick = () => {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        // สำหรับตอนนี้แสดงโพสต์ทั้งหมด
    };
});

// เริ่มทำงาน
renderFeed();
console.log('✅ Thaipodee v3.2 — หน้าโปรไฟล์ตรงตามแบบแล้ว! 🎉');
</script>
</body>
</html>
