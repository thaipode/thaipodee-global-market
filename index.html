<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ThaiPodee — สำหรับคุณ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; overflow: hidden; background: #000; color: #fff; }

    /* === คอนเทนเนอร์วิดีโอแบบเต็มจอ === */
    .video-feed {
      height: 100vh; overflow-y: auto; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch;
    }
    .video-slide {
      height: 100vh; scroll-snap-align: start; position: relative; background: #000;
    }
    .video-bg {
      width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0;
      background: linear-gradient(135deg, #333, #111);
    }

    /* === แถบด้านบน === */
    .top-nav {
      position: absolute; top: 0; left: 0; right: 0; padding: 12px 16px; padding-top: 44px;
      display: flex; justify-content: center; gap: 24px; z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,.4), transparent);
    }
    .nav-tab { font-size: 15px; color: rgba(255,255,255,.7); cursor: pointer; }
    .nav-tab.active { color: #fff; font-weight: 600; border-bottom: 2px solid #fff; padding-bottom: 2px; }
    .search-icon { position: absolute; top: 50px; right: 16px; font-size: 22px; z-index: 10; cursor: pointer; }

    /* === ข้อมูลผู้ใช้ & คำอธิบาย === */
    .bottom-info {
      position: absolute; bottom: 100px; left: 16px; right: 100px; z-index: 10;
    }
    .username { font-size: 15px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .desc { font-size: 14px; line-height: 1.5; margin-bottom: 10px; color: #f1f1f1; }
    .music { font-size: 13px; display: flex; align-items: center; gap: 6px; color: #eee; }

    /* === ปุ่มสินค้า — เพิ่มเข้าไปใหม่ === */
    .product-card {
      background: #fff; color: #1d1d1f; border-radius: 12px; padding: 10px 12px;
      margin-top: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer;
    }
    .product-img { width: 50px; height: 50px; border-radius: 8px; background: #eee; }
    .product-meta { flex: 1; }
    .product-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .product-price { font-size: 15px; font-weight: 700; color: #e53935; }
    .buy-btn {
      background: linear-gradient(90deg, #fe28ea, #ff4d6d); color: #fff; border: none; border-radius: 20px;
      padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }

    /* === ปุ่มแถบด้านขวา — ของเดิมครบ + ตะกร้าสินค้า === */
    .side-actions {
      position: absolute; right: 12px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10;
    }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .action-icon { font-size: 28px; }
    .action-count { font-size: 11px; color: #fff; }
    .profile-pic { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; }
    .add-btn {
      width: 22px; height: 22px; border-radius: 50%; background: #fe28ea; color: #fff; font-size: 18px;
      display: flex; align-items: center; justify-content: center; margin-top: -12px;
    }
    .music-disc {
      width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(45deg, #25f4ee, #fe28ea);
      display: flex; align-items: center; justify-content: center; animation: spin 3s linear infinite; font-size: 20px;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* === แถบเมนูล่างสุด — ของเดิมครบ + ตะกร้าสินค้า === */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.85); backdrop-filter: blur(10px);
      display: flex; justify-content: space-around; align-items: center; padding: 8px 0; padding-bottom: env(safe-area-inset-bottom, 0);
      border-top: 1px solid rgba(255,255,255,.1); z-index: 10;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
    .nav-icon { font-size: 22px; }
    .nav-label { font-size: 10px; }
    .nav-item.active .nav-label { color: #fe28ea; }
    .nav-center {
      width: 50px; height: 30px; border-radius: 8px; background: linear-gradient(90deg, #25f4ee, #fe28ea);
      display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="video-feed">
    <!-- === วิดีโอ 1 === -->
    <div class="video-slide">
      <div class="video-bg"></div>

      <!-- แถบด้านบน -->
      <div class="top-nav">
        <div class="nav-tab">ติดตาม</div>
        <div class="nav-tab active">สำหรับคุณ</div>
      </div>
      <div class="search-icon">🔍</div>

      <!-- ข้อมูลด้านล่างซ้าย -->
      <div class="bottom-info">
        <div class="username">ชื่อผู้ใช้ ✅</div>
        <div class="desc">โพสต์ใหม่ — สินค้าโคมไฟโซล่าเซลล์ 600W ราคา 1,990 บาท สนใจกดซื้อได้เลยครับ!</div>
        <div class="music">🎵 เพลง__THAI PODEE ติดตาม...</div>
        
        <!-- ปุ่มสินค้า — เพิ่มเข้าไปใหม่ -->
        <div class="product-card" onclick="window.location.href='product.html'">
          <img class="product-img" src="https://picsum.photos/50/50" alt="สินค้า" />
          <div class="product-meta">
            <div class="product-name">โคมไฟโซล่าเซลล์ 600W แผงโซลาร์แยก H-3</div>
            <div class="product-price">฿1,990</div>
          </div>
          <button class="buy-btn">ซื้อเลย</button>
        </div>
      </div>

      <!-- ปุ่มด้านขวา — ของเดิมครบ + ตะกร้าสินค้า -->
      <div class="side-actions">
        <div class="action-btn">
          <img class="profile-pic" src="https://picsum.photos/44/44" alt="โปรไฟล์" />
          <div class="add-btn">+</div>
        </div>
        <div class="action-btn" onclick="toggleLike()">
          <span class="action-icon">❤️</span>
          <span class="action-count" id="like-count">1</span>
        </div>
        <div class="action-btn" onclick="window.location.href='comments.html'">
          <span class="action-icon">💬</span>
          <span class="action-count">0</span>
        </div>
        <!-- ปุ่มตะกร้าสินค้า — เพิ่มตรงนี้! -->
        <div class="action-btn" onclick="window.location.href='cart.html'">
          <span class="action-icon">🛒</span>
          <span class="action-count">0</span>
        </div>
        <div class="action-btn">
          <span class="action-icon">↗️</span>
          <span class="action-count">0</span>
        </div>
        <div class="action-btn">
          <div class="music-disc">🎵</div>
        </div>
      </div>

      <!-- แถบเมนูล่างสุด — ของเดิมครบ + ตะกร้าสินค้า -->
      <div class="bottom-nav">
        <div class="nav-item active">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">หน้าแรก</span>
        </div>
        <div class="nav-item" onclick="window.location.href='search.html'">
          <span class="nav-icon">🔍</span>
          <span class="nav-label">ค้นหา</span>
        </div>
        <div class="nav-center" onclick="window.location.href='upload.html'">+</div>
        <!-- ตะกร้าสินค้าในเมนูล่างด้วย -->
        <div class="nav-item" onclick="window.location.href='cart.html'">
          <span class="nav-icon">🛒</span>
          <span class="nav-label">ตะกร้า</span>
        </div>
        <div class="nav-item" onclick="window.location.href='profile.html'">
          <span class="nav-icon">👤</span>
          <span class="nav-label">ฉัน</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleLike() {
      const count = document.getElementById('like-count');
      count.textContent = count.textContent === '1' ? '0' : '1';
    }
  </script>

</body>
</html>
