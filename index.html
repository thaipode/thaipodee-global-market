<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, sans-serif;}
html,body{height:100%; overflow:hidden; background:#000; color:#fff;}

/* พื้นที่วิดีโอ */
.swiper{height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory;}
.slide{height:100vh; scroll-snap-align:start; position:relative; display:flex; align-items:center; justify-content:center;}
video{width:100%; height:100%; object-fit:cover; background:#000;}
video::-webkit-media-controls{display:none;}

/* ข้อความรอ */
.loading{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#888; text-align:center;}
.empty{color:#555; text-align:center; padding:30px;}

/* ข้อมูลล่างซ้าย */
.info{position:absolute; bottom:80px; left:15px; right:80px; z-index:10;}
.info h3{font-size:15px; margin-bottom:4px;}
.info p{font-size:13px; color:#ccc;}

/* ปุ่มด้านขวา */
.side{position:absolute; right:12px; bottom:100px; display:flex; flex-direction:column; gap:24px; align-items:center;}
.side-btn{display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;}
.side-icon{width:44px; height:44px; border-radius:50%; background:#222; display:flex; align-items:center; justify-content:center; font-size:20px;}
.side-text{font-size:10px; color:#fff;}

/* แถบล่าง */
.nav{position:fixed; bottom:0; left:0; right:0; height:60px; background:#000; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #222; z-index:20;}
.nav-btn{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:#fff; cursor:pointer;}
.nav-icon{font-size:20px;}
.nav-add{background:#ff4757; padding:4px 16px; border-radius:6px;}
</style>
</head>
<body>

<div class="swiper" id="swiper">
  <div class="loading" id="msg">กำลังโหลด...</div>
</div>

<nav class="nav">
  <div class="nav-btn"><span class="nav-icon">🏠</span><span>หน้าแรก</span></div>
  <div class="nav-btn"><span class="nav-icon">🔥</span><span>ฮิต</span></div>
  <div class="nav-btn nav-add"><span class="nav-icon">+</span><span>อัปโหลด</span></div>
  <div class="nav-btn"><span class="nav-icon">💬</span><span>ข้อความ</span></div>
  <div class="nav-btn"><span class="nav-icon">👤</span><span>ฉัน</span></div>
</nav>

<script>
const OWNER = 'thaipodee';
const REPO = 'thaipodee-global-market';
const FOLDER = 'videos';
const BRANCH = 'main';

const swiper = document.getElementById('swiper');
const msg = document.getElementById('msg');

async function init() {
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`);
    if (!res.ok) throw new Error('เชื่อมต่อไม่ได้');
    
    const files = await res.json();
    const videos = files.filter(f => /\.(mp4|webm|mov)$/i.test(f.name));
    
    if (!videos.length) {
      msg.outerHTML = '<div class="empty">ยังไม่มีวิดีโอ<br>อัปโหลดไฟล์ .mp4 เข้าโฟลเดอร์ videos</div>';
      return;
    }
    
    msg.remove();
    
    videos.forEach(v => {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.innerHTML = `
        <video src="${v.download_url}" loop muted playsinline></video>
        <div class="info">
          <h3>${v.name.replace(/\.[^.]+$/, '')}</h3>
          <p>@thaipodee</p>
        </div>
        <div class="side">
          <div class="side-btn"><div class="side-icon">❤️</div><div class="side-text">0</div></div>
          <div class="side-btn"><div class="side-icon">💬</div><div class="side-text">0</div></div>
          <div class="side-btn"><div class="side-icon">⭐</div><div class="side-text">บันทึก</div></div>
          <div class="side-btn"><div class="side-icon">↗️</div><div class="side-text">แชร์</div></div>
          <div class="side-btn"><div class="side-icon">🎵</div><div class="side-text">เสียง</div></div>
        </div>
      `;
      swiper.appendChild(slide);
    });

    // เล่นอัตโนมัติตอนเข้ามา
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        const video = e.target.querySelector('video');
        if (e.isIntersecting) video?.play();
        else video?.pause();
      });
    }, { threshold: 0.5 });

    document.querySelectorAll('.slide').forEach(s => observer.observe(s));

  } catch (err) {
    msg.textContent = 'ผิดพลาด: ' + err.message;
  }
}

init();
</script>
</body>
</html>
