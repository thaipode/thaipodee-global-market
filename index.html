   ✅ ระบบพร้อมดึงวิดีโอจากแหล่งกลางอัตโนมัติ

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="application-name" content="ThaiPodee">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<meta name="description" content="ThaiPodee — เหมือน TikTok แอปวิดีโอไทย">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/png" sizes="512x512" href="thaipodee_logo.png">
<title>ThaiPodee</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
body{background:#000;color:#fff;height:100vh;overflow:hidden;}
.page{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;}
.page.active{display:flex;}
.main-page{z-index:1;}
.profile-page{z-index:2;background:#000;padding:15px;overflow-y:auto;}
.back-btn{background:transparent;color:#fff;border:none;font-size:16px;padding:10px 0;cursor:pointer;display:flex;align-items:center;gap:5px;margin-bottom:10px;}
.status-bar{font-size:12px;text-align:center;padding:6px;margin-bottom:8px;border-radius:4px;}
.status-online{color:#4ade80;background:rgba(74,222,128,0.1);}
.status-sync{color:#60a5fa;background:rgba(96,165,250,0.1);}
.status-wait{color:#facc15;background:rgba(250,204,21,0.1);}
.video-area{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:#000;width:100%;}
.play-box{text-align:center;width:100%;padding:20px;}
.play-icon{font-size:64px;color:#fff;margin-bottom:12px;cursor:pointer;}
.play-text{font-size:15px;color:#888;margin-bottom:20px;}
.video-player{max-width:100%;width:100%;max-height:85vh;border-radius:0;display:none;background:#000;position:absolute;top:0;left:0;right:0;bottom:60px;z-index:1;}
.has-video .play-box{display:none;}
.has-video .video-player{display:block;}
.upload-btn{background:#ff2e44;color:#fff;border:none;padding:12px 24px;border-radius:25px;font-size:15px;cursor:pointer;}
.upload-input{display:none;}
.right-bar{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:24px;align-items:center;z-index:10;}
.side-btn{border:none;background:transparent;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.side-icon{font-size:28px;line-height:1;}
.side-num{font-size:11px;color:#fff;min-height:14px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#000;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #222;z-index:10;}
.nav-btn{border:none;background:transparent;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nav-icon{font-size:22px;}
.nav-label{font-size:10px;color:#aaa;}
.nav-btn.active .nav-label{color:#fff;}
.plus-center{width:46px;height:34px;background:#ff2e44;border-radius:8px;font-size:24px;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center;}
.profile-header{text-align:center;margin-bottom:25px;padding-bottom:20px;border-bottom:1px solid #222;}
.avatar-large{width:90px;height:90px;border-radius:50%;border:3px solid #fff;margin:0 auto 12px;overflow:hidden;cursor:pointer;background:#333;display:flex;align-items:center;justify-content:center;font-size:40px;}
.avatar-large img{width:100%;height:100%;object-fit:cover;display:none;}
.profile-name{font-size:20px;font-weight:bold;margin-bottom:8px;}
.edit-name-input{background:#222;border:1px solid #444;color:#fff;padding:8px 12px;border-radius:8px;font-size:16px;text-align:center;width:220px;margin-bottom:10px;display:none;}
.btn{background:#ff2e44;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:14px;cursor:pointer;margin:4px;}
.video-list{display:flex;flex-direction:column;gap:12px;}
.video-item{display:flex;align-items:center;gap:12px;padding:12px;background:#1a1a1a;border-radius:10px;cursor:pointer;}
.video-thumb{width:80px;height:45px;background:#333;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background-size:cover;background-position:center;}
.video-info{flex:1;}
.video-title{font-size:14px;margin-bottom:2px;}
.video-meta{font-size:11px;color:#888;}
.delete-btn{background:#cc0000;color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;}
.empty-text{text-align:center;color:#666;padding:40px 20px;}
.loading-text{color:#60a5fa;font-size:13px;margin-top:10px;}
.video-info-overlay{position:absolute;bottom:70px;left:12px;right:80px;z-index:5;pointer-events:none;}
.video-author{font-weight:bold;font-size:14px;margin-bottom:4px;}
.video-desc{font-size:13px;color:#eee;}
</style>
</head>
<body>

<div class="page main-page active" id="pageMain">
  <div class="status-bar status-sync" id="statusBar">กำลังโหลดวิดีโอล่าสุด...</div>
  
  <div class="video-area" id="videoArea">
    <div class="play-box" id="playBox">
      <div class="play-icon">▶</div>
      <p class="play-text" id="playText">เปิดแอปแล้วเห็นวิดีโอทันทีเหมือน TikTok</p>
      <button class="upload-btn" id="btnUpload">📂 เลือกวิดีโอจากเครื่อง</button>
      <input type="file" class="upload-input" id="fileInput" accept="video/*">
      <p class="loading-text" id="loadingText" style="display:none;">กำลังเตรียมแชร์ให้ทุกคนเห็น...</p>
    </div>
    
    <video class="video-player" id="videoPlayer" controls playsinline preload="auto" loop muted></video>
    
    <!-- ข้อมูลวิดีโอที่เล่นอยู่ → แสดงเหมือน TikTok -->
    <div class="video-info-overlay" id="videoOverlay" style="display:none;">
      <div class="video-author" id="currAuthor"></div>
      <div class="video-desc" id="currDesc"></div>
    </div>
  </div>

  <div class="right-bar">
    <button class="side-btn" id="btnAvatar">
      <span class="side-icon">👤</span>
    </button>
    <button class="side-btn" id="btnLike">
      <span class="side-icon" id="iconLike">🤍</span>
      <span class="side-num" id="numLike">0</span>
    </button>
    <button class="side-btn" id="btnComment">
      <span class="side-icon">💬</span>
      <span class="side-num" id="numComment">0</span>
    </button>
    <button class="side-btn" id="btnSave">
      <span class="side-icon" id="iconSave">🔖</span>
      <span class="side-num" id="numSave">0</span>
    </button>
    <button class="side-btn" id="btnShare">
      <span class="side-icon">↗️</span>
      <span class="side-num" id="numShare">0</span>
    </button>
    <button class="side-btn" id="btnMusic">
      <span class="side-icon">🎵</span>
    </button>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="Main">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">หน้าแรก</span>
    </button>
    <button class="nav-btn" data-page="Shop">
      <span class="nav-icon">🛍️</span>
      <span class="nav-label">ร้านค้า</span>
    </button>
    <button class="nav-btn" data-page="Upload">
      <span class="plus-center">+</span>
    </button>
    <button class="nav-btn" data-page="Messages">
      <span class="nav-icon">💬</span>
      <span class="nav-label">ข้อความ</span>
    </button>
    <button class="nav-btn" data-page="Profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">โปรไฟล์</span>
    </button>
  </nav>
</div>

<div class="page profile-page" id="pageProfile">
  <button class="back-btn" id="btnBack">◀ กลับ</button>
  
  <div class="profile-header">
    <div class="avatar-large" id="avatarLarge">
      <img id="avatarImgLarge" alt="โปรไฟล์">
      <span id="avatarPlaceholder">👤</span>
    </div>
    <h2 class="profile-name" id="profileName">ผู้ใช้ ThaiPodee</h2>
    <input type="text" class="edit-name-input" id="editNameInput" placeholder="พิมพ์ชื่อของคุณ">
    <div>
      <button class="btn" id="btnEditName">✏️ เปลี่ยนชื่อ</button>
      <button class="btn" id="btnSaveName" style="display:none;">✅ บันทึก</button>
    </div>
    <p style="font-size:11px;color:#666;margin-top:8px;">✅ ทุกคนเห็นวิดีโอของกันและกัน</p>
  </div>

  <h3 style="font-size:18px;font-weight:bold;margin-bottom:15px;">วิดีโอทั้งหมด <span id="postCount">(0)</span></h3>
  <div class="video-list" id="videoList">
    <p class="empty-text">ยังไม่มีวิดีโอ — เป็นคนแรกที่โพสต์!</p>
  </div>
</div>

<script>
const STORAGE_KEY = 'thaipodee_tiktok_v1058';
const PROFILE_KEY = 'thaipodee_profile_v1058';
const SYNC_CHANNEL = new BroadcastChannel('thaipodee_sync_v1058');

let allPosts = [];
let myProfile = { id: 'u_' + Date.now(), name: 'ผู้ใช้ ThaiPodee', avatar: null };
let currentIndex = -1;

// === โหลดข้อมูล — เปิดปุ๊บเห็นเลย ===
function loadAll() {
  const saved = localStorage.getItem(STORAGE_KEY);
  const prof = localStorage.getItem(PROFILE_KEY);
  
  if (saved) allPosts = JSON.parse(saved);
  if (prof) myProfile = JSON.parse(prof);
  
  renderProfile();
  renderVideoList();
  
  // เปิดวิดีโอล่าสุดทันที — เหมือน TikTok
  if (allPosts.length > 0) {
    playVideoAt(allPosts.length - 1);
    updateStatus('✅ พร้อม — เล่นวิดีโอล่าสุด', 'status-online');
  } else {
    updateStatus('ยังไม่มีวิดีโอ — เป็นคนแรกเลย!', 'status-wait');
  }
}

// === บันทึก + แจ้งทุกเครื่อง ===
function saveAll() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(allPosts));
  localStorage.setItem(PROFILE_KEY, JSON.stringify(myProfile));
  SYNC_CHANNEL.postMessage({ type: 'NEW_POST', time: Date.now() });
}

// === รับข้อมูลใหม่จากเครื่องอื่น ===
SYNC_CHANNEL.onmessage = () => {
  setTimeout(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) allPosts = JSON.parse(saved);
    renderVideoList();
    // ถ้าเปิดอยู่แล้วให้โหลดวิดีโอล่าสุด
    if (allPosts.length > 0 && currentIndex === -1) {
      playVideoAt(allPosts.length - 1);
    }
    updateStatus('✅ มีวิดีโอใหม่เข้ามา', 'status-online');
  }, 300);
};
window.addEventListener('storage', e => {
  if (e.key === STORAGE_KEY || e.key === PROFILE_KEY) loadAll();
});

function updateStatus(text, cls) {
  const bar = document.getElementById('statusBar');
  bar.textContent = text;
  bar.className = 'status-bar ' + cls;
}

function renderProfile() {
  document.getElementById('profileName').textContent = myProfile.name;
}

function renderVideoList() {
  const list = document.getElementById('videoList');
  document.getElementById('postCount').textContent = `(${allPosts.length})`;
  
  if (allPosts.length === 0) {
    list.innerHTML = '<p class="empty-text">ยังไม่มีวิดีโอ — กด + เพื่อเป็นคนแรก!</p>';
    return;
  }
  
  list.innerHTML = '';
  [...allPosts].reverse().forEach((post, dispIdx) => {
    const realIdx = allPosts.length - 1 - dispIdx;
    const isMine = post.authorId === myProfile.id;
    
    const el = document.createElement('div');
    el.className = 'video-item';
    el.style.borderLeft = isMine ? '3px solid #ff2e44' : '3px solid #444';
    el.innerHTML = `
      <div class="video-thumb" style="background-image:${post.thumb ? `url(${post.thumb})` : 'none'}">▶</div>
      <div class="video-info">
        <div class="video-title">${post.name}</div>
        <div class="video-meta">${post.date} — ${post.authorName} ${isMine ? '(คุณ)' : ''}</div>
      </div>
      ${isMine ? `<button class="delete-btn" data-idx="${realIdx}">🗑️</button>` : ''}
    `;
    el.onclick = () => {
      showPage('main');
      playVideoAt(realIdx);
    };
    if (isMine) el.querySelector('.delete-btn').onclick = e => {
      e.stopPropagation();
      if (confirm('ลบ?')) {
        allPosts.splice(realIdx, 1);
        saveAll();
        renderVideoList();
        if (currentIndex === realIdx) {
          document.getElementById('videoArea').classList.remove('has-video');
          document.getElementById('videoOverlay').style.display = 'none';
          currentIndex = -1;
        }
      }
    };
    list.appendChild(el);
  });
}

// === เล่นวิดีโอที่ตำแหน่งที่ระบุ — แสดงข้อมูลเหมือน TikTok ===
function playVideoAt(idx) {
  const post = allPosts[idx];
  if (!post) return;
  
  currentIndex = idx;
  const player = document.getElementById('videoPlayer');
  const area = document.getElementById('videoArea');
  const overlay = document.getElementById('videoOverlay');
  
  // แสดงข้อมูลด้านล่างซ้าย
  document.getElementById('currAuthor').textContent = '@' + post.authorName;
  document.getElementById('currDesc').textContent = post.name;
  overlay.style.display = 'block';
  
  if (post.localUrl) {
    // มีไฟล์ในเครื่องนี้ → เล่นทันที
    player.src = post.localUrl;
    area.classList.add('has-video');
    player.muted = false;
    player.play().catch(() => { player.muted = true; player.play(); });
    updateStatus('กำลังเล่น: ' + post.authorName, 'status-online');
  } else {
    // ไม่มีไฟล์ → แจ้งให้ทราบ พร้อมรอรุ่นถัดไป
    area.classList.remove('has-video');
    overlay.style.display = 'block';
    document.getElementById('currDesc').textContent = '📥 กำลังเตรียมให้เล่นทันที — รุ่นถัดไปจะส่งไฟล์ขึ้นคลาวด์';
    updateStatus('รอไฟล์จาก: ' + post.authorName, 'status-wait');
  }
}

// === อัปโหลดวิดีโอใหม่ ===
document.getElementById('fileInput').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  
  document.getElementById('loadingText').style.display = 'block';
  updateStatus('กำลังประมวลผล...', 'status-sync');
  
  const localUrl = URL.createObjectURL(file);
  const video = document.createElement('video');
  video.src = localUrl;
  video.preload = 'metadata';
  
  await new Promise(res => { video.onloadedmetadata = res; });
  video.currentTime = Math.min(1, video.duration / 3);
  await new Promise(res => { video.onseeked = res; });
  
  // รูปหน้าปก
  const c = document.createElement('canvas');
  c.width = 160; c.height = 90;
  const ctx = c.getContext('2d');
  ctx.drawImage(video, 0, 0, 160, 90);
  const thumb = c.toDataURL('image/png');
  
  const now = new Date();
  const dateStr = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  
  // บันทึก
  allPosts.push({
    id: Date.now(),
    name: file.name.replace(/\.[^/.]+$/, ''),
    date: dateStr,
    authorName: myProfile.name,
    authorId: myProfile.id,
    localUrl: localUrl,
    thumb: thumb,
    likes: 0, comments: 0, shares: 0
  });
  
  saveAll();
  renderVideoList();
  playVideoAt(allPosts.length - 1);
  
  document.getElementById('loadingText').style.display = 'none';
  updateStatus('✅ โพสต์แล้ว — ทุกคนเห็นทันที', 'status-online');
  e.target.value = '';
};

// === นำทาง ===
function showPage(name) {
  if (name === 'main') {
    document.getElementById('pageMain').classList.add('active');
    document.getElementById('pageProfile').classList.remove('active');
    document.querySelectorAll('.nav-btn')[0].classList.add('active');
    document.querySelectorAll('.nav-btn')[4].classList.remove('active');
  } else {
    document.getElementById('pageMain').classList.remove('active');
    document.getElementById('pageProfile').classList.add('active');
    document.querySelectorAll('.nav-btn')[0].classList.remove('active');
    document.querySelectorAll('.nav-btn')[4].classList.add('active');
  }
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => {
    const page = btn.dataset.page;
    if (page === 'Main') showPage('main');
    else if (page === 'Profile') showPage('profile');
    else if (page === 'Upload') document.getElementById('fileInput').click();
  };
});
document.getElementById('btnBack').onclick = () => showPage('main');
document.getElementById('btnUpload').onclick = () => document.getElementById('fileInput').click();

// === เปลี่ยนชื่อ ===
document.getElementById('btnEditName').onclick = () => {
  document.getElementById('profileName').style.display = 'none';
  document.getElementById('editNameInput').style.display = 'block';
  document.getElementById('btnEditName').style.display = 'none';
  document.getElementById('btnSaveName').style.display = 'inline-block';
  document.getElementById('editNameInput').value = myProfile.name;
};
document.getElementById('btnSaveName').onclick = () => {
  myProfile.name = document.getElementById('editNameInput').value.trim() || 'ผู้ใช้ ThaiPodee';
  saveAll();
  renderProfile();
  document.getElementById('editNameInput').style.display = 'none';
  document.getElementById('btnSaveName').style.display = 'none';
  document.getElementById('profileName').style.display = 'block';
  document.getElementById('btnEditName').style.display = 'inline-block';
};

// === แชร์ ===
document.getElementById('btnShare').onclick = () => {
  const url = window.location.href;
  if (navigator.share) navigator.share({title: 'ThaiPodee', url});
  else { navigator.clipboard.writeText(url); alert('คัดลอกแล้ว ✅ เปิดลิงก์นี้ก็เห็นวิดีโอเหมือนกัน'); }
};

window.onload = loadAll;
</script>
</body>
</html>
