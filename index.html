<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<title>ThaiPodee Global Market</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;height:100dvh;overflow:hidden}

.version-tag{position:fixed;top:8px;right:8px;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:4px;font-size:11px;color:#aaa;z-index:999}

.swiper{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}
.slide{height:100dvh;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
.slide video{width:100%;height:100%;object-fit:contain;background:#111;cursor:pointer}

.side-buttons{position:absolute;right:12px;bottom:120px;display:flex;flex-direction:column;gap:24px;align-items:center}
.side-btn{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.side-btn-icon{font-size:28px}
.side-btn-text{font-size:11px;color:#aaa;margin-top:2px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(0,0,0,.8);display:flex;justify-content:space-around;align-items:center;padding:0 10px}
.nav-btn{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.nav-icon{font-size:22px}
.nav-label{font-size:10px;color:#aaa;margin-top:2px}
.nav-center{width:56px;height:40px;border-radius:50%;background:#ff2b4a;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}

.video-info{position:absolute;bottom:80px;left:12px;right:60px}
.username{font-weight:bold;font-size:14px;margin-bottom:4px}
.desc{font-size:12px;color:#ddd;margin-bottom:4px}
.music{font-size:11px;color:#aaa;display:flex;align-items:center;gap:4px}
</style>
</head>
<body>

<div class="version-tag">v1139</div>

<div class="swiper">
  <div class="slide">
    <video id="mainVideo" src="https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_1mb.mp4" loop muted playsinline></video>
    
    <div class="side-buttons">
      <div class="side-btn"><div class="side-btn-icon">👤</div></div>
      <div class="side-btn"><div class="side-btn-icon">❤️</div><div class="side-btn-text">0</div></div>
      <div class="side-btn"><div class="side-btn-icon">💬</div><div class="side-btn-text">0</div></div>
      <div class="side-btn"><div class="side-btn-icon">💾</div><div class="side-btn-text">บันทึก</div></div>
      <div class="side-btn"><div class="side-btn-icon">↗️</div><div class="side-btn-text">แชร์</div></div>
      <div class="side-btn"><div class="side-btn-icon">🎵</div><div class="side-btn-text">เสียง</div></div>
    </div>
    
    <div class="video-info">
      <div class="username">@Thaipodee_Official</div>
      <div class="desc">สวัสดีจากไทยพอดี 🇹🇭 วิดีโอทดสอบระบบ</div>
      <div class="music">🎵 เสียงบรรเลงไทย — ทดสอบเสียง</div>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-btn"><div class="nav-icon">🏠</div><div class="nav-label">หน้า</div></div>
  <div class="nav-btn"><div class="nav-icon">🛒</div><div class="nav-label">ตลาด</div></div>
  <div class="nav-btn"><div class="nav-center">+</div></div>
  <div class="nav-btn"><div class="nav-icon">💬</div><div class="nav-label">ข้อความ</div></div>
  <div class="nav-btn"><div class="nav-icon">👤</div><div class="nav-label">ฉัน</div></div>
</div>

<script>
const video = document.getElementById('mainVideo');

// เปิดเสียงเมื่อโต้ตอบครั้งแรก
document.addEventListener('click', () => {
  video.muted = false;
  video.volume = 1;
}, { once: true });

// กดวิดีโอ = หยุด / เล่น
video.addEventListener('click', (e) => {
  e.stopPropagation();
  if (video.paused) {
    video.play();
    video.muted = false;
  } else {
    video.pause();
  }
});

// เล่นอัตโนมัติเมื่อโหลดเสร็จ
video.addEventListener('canplay', () => {
  video.play().catch(() => {});
});
</script>

</body>
</html>
