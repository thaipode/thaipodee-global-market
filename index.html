<!-- ==============================================================
   เวอร์ชัน: v91 แก้ตรง — เพิ่มรูป/วิดีโอขึ้นปกทันที
   วันที่: 24 ก.ย. 2569
   ปัญหา: กด + แล้วไม่มีอะไรขึ้น กริดว่างเปล่า
   แก้: ตรวจสอบ-บันทึก-แสดงผลทีละขั้น ชัดเจน
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiPodee v91</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;}
html,body{height:100%;background:#fff;}

/* แถบบน */
.top-bar{height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid #eee;}
.top-title{font-size:17px;font-weight:600;}

/* โปรไฟล์ */
.profile{padding:16px;text-align:center;}
.avatar{width:90px;height:90px;border-radius:50%;margin:0 auto 10px;overflow:hidden;cursor:pointer;background:#ddd;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.p-name{font-size:16px;font-weight:700;color:#d00;margin-bottom:4px;}
.p-user{font-size:13px;color:#666;margin-bottom:8px;}
.p-bio{font-size:13px;color:#333;line-height:1.5;margin-bottom:12px;}

/* สถิติ */
.stats{display:flex;justify-content:center;gap:32px;margin-bottom:12px;}
.stat-num{font-size:18px;font-weight:700;}
.stat-label{font-size:11px;color:#666;}

/* ปุ่ม */
.btns{display:flex;justify-content:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.btn-red{background:#d00;color:#fff;border:none;padding:8px 24px;border-radius:6px;font-size:14px;cursor:pointer;}
.btn-grey{background:#eee;border:none;padding:8px 16px;border-radius:6px;font-size:14px;cursor:pointer;}
.btn-edit{background:#fff9c4;border:1px solid #fdd835;padding:8px 16px;border-radius:6px;font-size:14px;cursor:pointer;}

/* แท็บ */
.tabs{display:flex;justify-content:center;border-bottom:1px solid #eee;margin-bottom:4px;}
.tab{padding:10px 16px;font-size:13px;color:#666;cursor:pointer;}
.tab.active{border-bottom:2px solid #000;color:#000;font-weight:700;}

/* กริดโพสต์ — ส่วนสำคัญที่สุด */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;min-height:200px;}
.thumb{aspect-ratio:9/16;background:#f5f5f5;overflow:hidden;cursor:pointer;position:relative;}
.thumb img, .thumb video{width:100%;height:100%;object-fit:cover;display:block;}
.play-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.7);pointer-events:none;}
.empty-slot{display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px;border:1px dashed #ddd;}

/* หน้าเล่น */
.player{position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column;}
.player.active{display:flex;}
.p-top{padding:12px 16px;display:flex;align-items:center;background:rgba(0,0,0,0.7);}
.back{color:#fff;font-size:22px;cursor:pointer;margin-right:12px;}
.p-body{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;}
.p-media{max-width:100%;max-height:85vh;}

/* แถบล่าง */
.bottom{position:fixed;bottom:0;left:0;right:0;height:65px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #eee;background:#fff;}
.b-item{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#666;gap:2px;cursor:pointer;}
.b-item.active{color:#000;}
.b-add{width:48px;height:36px;background:#000;color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;cursor:pointer;}

.hidden{display:none !important;}
</style>
</head>
<body>

<!-- แถบบน -->
<div class="top-bar">
  <span></span>
  <span class="top-title">thaipodee</span>
  <span>⋮</span>
</div>

<!-- โปรไฟล์ -->
<div class="profile">
  <div class="avatar" id="avatarBtn">
    <img id="avatarImg" src="https://picsum.photos/id/1012/100/100" alt="โปรไฟล์">
  </div>
  <div class="p-name" id="dispName">THAIPODEE PRODUCT ENGINEERING</div>
  <div class="p-user" id="dispUser">@thaipodee-official</div>
  <div class="p-bio" id="dispBio">รับจ้างผลิตชิ้นงานกลึง มิลลิ่ง เชื่อม ประกอบชุดงาน</div>

  <div class="stats">
    <div><div class="stat-num" id="statPost">0</div><div class="stat-label">โพสต์</div></div>
    <div><div class="stat-num" id="statFollowers">1,238</div><div class="stat-label">ผู้ติดตาม</div></div>
    <div><div class="stat-num" id="statFollowing">2,748</div><div class="stat-label">กำลังติดตาม</div></div>
  </div>

  <div class="btns">
    <button class="btn-red">กดติดตาม</button>
    <button class="btn-grey" id="shareBtn">แชร์โปรไฟล์</button>
    <button class="btn-edit" id="editBtn">✏️ แก้ไข</button>
  </div>

  <div class="tabs">
    <div class="tab active">โพสต์</div>
    <div class="tab">วิดีโอ</div>
    <div class="tab">ถูกใจ</div>
  </div>
</div>

<!-- กริดโพสต์ — สำคัญที่สุด -->
<div class="grid" id="postGrid"></div>

<!-- หน้าเล่น -->
<div class="player" id="playerPage">
  <div class="p-top"><span class="back" id="backBtn">←</span></div>
  <div class="p-body">
    <video id="playVid" controls playsinline class="p-media" style="display:none;"></video>
    <img id="playImg" class="p-media" style="display:none;" alt="รูป">
  </div>
</div>

<!-- แถบล่าง -->
<div class="bottom">
  <div class="b-item"><span>🏠</span><span>หน้าหลัก</span></div>
  <div class="b-item"><span>🔍</span><span>ค้นหา</span></div>
  <div class="b-item" id="addPostBtn"><span class="b-add">+</span></div>
  <div class="b-item"><span>💬</span><span>ข้อความ</span></div>
  <div class="b-item active"><span>👤</span><span>โปรไฟล์</span></div>
</div>

<!-- ซ่อนไฟล์ -->
<input type="file" id="avatarInput" accept="image/*" class="hidden">
<input type="file" id="mediaInput" accept="image/*,video/*" class="hidden">

<script>
// ===== ข้อมูลหลัก =====
let profile = {
  avatar: localStorage.getItem('tp_avatar') || 'https://picsum.photos/id/1012/100/100',
  name: localStorage.getItem('tp_name') || 'THAIPODEE PRODUCT ENGINEERING',
  username: localStorage.getItem('tp_username') || '@thaipodee-official',
  bio: localStorage.getItem('tp_bio') || 'รับจ้างผลิตชิ้นงานกลึง มิลลิ่ง เชื่อม ประกอบชุดงาน',
  followers: localStorage.getItem('tp_followers') || '1,238',
  following: localStorage.getItem('tp_following') || '2,748'
};

let posts = JSON.parse(localStorage.getItem('tp_posts') || '[]');

// ===== บันทึกทั้งหมด =====
function saveAll() {
  localStorage.setItem('tp_avatar', profile.avatar);
  localStorage.setItem('tp_name', profile.name);
  localStorage.setItem('tp_username', profile.username);
  localStorage.setItem('tp_bio', profile.bio);
  localStorage.setItem('tp_followers', profile.followers);
  localStorage.setItem('tp_following', profile.following);
  localStorage.setItem('tp_posts', JSON.stringify(posts));
}

// ===== แสดงทุกอย่าง — ตรงนี้สำคัญ =====
function renderPage() {
  // โปรไฟล์
  document.getElementById('avatarImg').src = profile.avatar;
  document.getElementById('dispName').textContent = profile.name;
  document.getElementById('dispUser').textContent = profile.username;
  document.getElementById('dispBio').textContent = profile.bio;
  document.getElementById('statPost').textContent = posts.length;
  document.getElementById('statFollowers').textContent = profile.followers;
  document.getElementById('statFollowing').textContent = profile.following;

  // กริดโพสต์ — แก้ตรงนี้โดยตรง
  const grid = document.getElementById('postGrid');
  grid.innerHTML = '';

  if (posts.length === 0) {
    // ยังไม่มีโพสต์ — แสดงช่องว่าง ไม่ค้าง ไม่ว่าง
    for (let i = 0; i < 3; i++) {
      const slot = document.createElement('div');
      slot.className = 'thumb empty-slot';
      slot.textContent = 'กด + เพิ่มรูป/วิดีโอ';
      grid.appendChild(slot);
    }
    return;
  }

  // มีโพสต์แล้ว — แสดงปกทีละอัน
  posts.forEach((post, index) => {
    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    if (post.type === 'video') {
      thumb.innerHTML = `
        <video src="${post.data}" muted preload="metadata"></video>
        <span class="play-badge">▶</span>
      `;
    } else {
      thumb.innerHTML = `<img src="${post.data}" alt="ปกโพสต์">`;
    }

    thumb.onclick = () => openPost(index);
    grid.appendChild(thumb);
  });
}

// ===== เปิดโพสต์ =====
function openPost(index) {
  const post = posts[index];
  const page = document.getElementById('playerPage');
  const vidEl = document.getElementById('playVid');
  const imgEl = document.getElementById('playImg');

  vidEl.style.display = 'none';
  imgEl.style.display = 'none';
  vidEl.pause();

  if (post.type === 'video') {
    vidEl.src = post.data;
    vidEl.style.display = 'block';
    vidEl.play().catch(() => {});
  } else {
    imgEl.src = post.data;
    imgEl.style.display = 'block';
  }

  page.classList.add('active');
}

// ปิดกลับ
document.getElementById('backBtn').onclick = () => {
  document.getElementById('playerPage').classList.remove('active');
  document.getElementById('playVid').pause();
  document.getElementById('playVid').src = '';
};

// ===== 1. เปลี่ยนรูปโปรไฟล์ =====
document.getElementById('avatarBtn').onclick = () => {
  document.getElementById('avatarInput').click();
};
document.getElementById('avatarInput').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    profile.avatar = ev.target.result;
    saveAll();
    renderPage();
    alert('✅ เปลี่ยนรูปเรียบร้อย');
  };
  reader.readAsDataURL(file);
};

// ===== 2. แก้ไขชื่อ/ทุกอย่าง =====
document.getElementById('editBtn').onclick = () => {
  const n = prompt('ชื่อแสดง:', profile.name);
  if (n) profile.name = n.trim();

  const u = prompt('ชื่อผู้ใช้:', profile.username);
  if (u) profile.username = u.trim();

  const b = prompt('คำอธิบาย:', profile.bio);
  if (b) profile.bio = b.trim();

  const f = prompt('ผู้ติดตาม:', profile.followers);
  if (f) profile.followers = f.trim();

  const g = prompt('กำลังติดตาม:', profile.following);
  if (g) profile.following = g.trim();

  saveAll();
  renderPage();
  alert('✅ อัปเดตเรียบร้อย');
};

// ===== 3. เพิ่มรูป/วิดีโอ — ตรงนี้สำคัญที่สุด =====
document.getElementById('addPostBtn').onclick = () => {
  document.getElementById('mediaInput').click();
};
document.getElementById('mediaInput').onchange = e => {
  const file = e.target.files[0];
  if (!file) {
    alert('⚠️ ไม่ได้เลือกไฟล์');
    return;
  }

  // ตรวจประเภทไฟล์
  const isVideo = file.type.startsWith('video/');
  const isImage = file.type.startsWith('image/');

  if (!isVideo && !isImage) {
    alert('⚠️ กรุณาเลือกไฟล์รูปหรือวิดีโอเท่านั้น');
    return;
  }

  const reader = new FileReader();
  reader.onload = event => {
    // เพิ่มลงรายการ — เอาไว้ด้านบนสุด
    posts.unshift({
      data: event.target.result,
      type: isVideo ? 'video' : 'image'
    });

    saveAll();
    renderPage(); // แสดงทันที
    alert('✅ เพิ่มเรียบร้อย! ปกแสดงแล้ว กดเพื่อเล่น');
  };

  reader.onerror = () => {
    alert('❌ อ่านไฟล์ไม่ได้ ลองใหม่อีกครั้ง');
  };

  reader.readAsDataURL(file);
  e.target.value = ''; // เคลียร์ค่าเดิม
};

// แชร์
document.getElementById('shareBtn').onclick = () => {
  navigator.clipboard.writeText(window.location.href)
    .then(() => alert('✅ คัดลอกลิงก์แล้ว'))
    .catch(() => alert('ลิงก์: ' + window.location.href));
};

// โหลดทันทีเมื่อเปิด
renderPage();
</script>
</body>
</html>
