<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai World Market</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #000; color: #fff; min-height: 100vh; overflow: hidden; }

    /* === หน้าแต่ละหน้า === */
    .page { display: none; min-height: 100vh; padding-bottom: 110px; }
    .page.active { display: block; }

    /* === หน้าแรก - ฟีดวิดีโอ === */
    .video-feed { height: 100vh; position: relative; }
    .video-bg { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .video-info { position: absolute; bottom: 100px; left: 15px; right: 80px; }
    .tabs { display: flex; justify-content: center; gap: 30px; padding: 15px 0; position: absolute; top: 0; left: 0; right: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); }
    .tab { font-size: 16px; color: #aaa; cursor: pointer; }
    .tab.active { color: #fff; font-weight: bold; border-bottom: 2px solid #fff; padding-bottom: 3px; }

    /* === เมนูด้านขวา === */
    .side-buttons { position: fixed; right: 12px; bottom: 120px; display: flex; flex-direction: column; align-items: center; gap: 24px; z-index: 100; }
    .side-btn { background: transparent; border: none; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .side-icon { font-size: 28px; }
    .side-text { font-size: 12px; }

    /* === หน้าตลาดสินค้า === */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 70vh; gap: 15px; color: #888; }
    .empty-icon { font-size: 48px; }
    .empty-title { font-size: 18px; }

    /* === หน้าโปรไฟล์ === */
    .profile-header { display: flex; flex-direction: column; align-items: center; padding-top: 60px; gap: 10px; }
    .profile-avatar { font-size: 60px; }
    .profile-name { font-size: 20px; font-weight: bold; }
    .profile-username { color: #888; }
    .stats-row { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 20px; font-weight: bold; }
    .stat-label { font-size: 12px; color: #888; }

    /* === เมนูด้านล่าง === */
    .nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 10px 0; background: #000; border-top: 1px solid #333; z-index: 200; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; color: #aaa; }
    .nav-item.active { color: #fff; }
    .nav-icon { font-size: 22px; }
    .plus-btn { background: linear-gradient(45deg, #ff0050, #00f2ea); padding: 5px 12px; border-radius: 8px; font-size: 18px; }
  </style>
</head>
<body>

  <!-- ===== หน้าแรก - ฟีดวิดีโอ ===== -->
  <div class="page active" id="page-home">
    <div class="tabs">
      <div class="tab active" onclick="switchTab(this)">ติดตาม</div>
      <div class="tab" onclick="switchTab(this)">สำหรับคุณ</div>
    </div>

    <div class="video-feed">
      <div style="width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#16213e);"></div>
      
      <div class="video-info">
        <h3>ชื่อผู้ใช้</h3>
        <p>คำอธิบายวิดีโอ #ThaiWorldMarket</p>
        <p>♪ เพลงตัวอย่าง - Thai World Market</p>
      </div>

      <!-- ===== เมนูด้านขวา ครบ 6 ปุ่ม ===== -->
      <div class="side-buttons">
        <button class="side-btn" onclick="goPage('profile',4)">
          <span class="side-icon">👤</span>
        </button>

        <button class="side-btn" id="likeBtn" onclick="toggleLike()">
          <span class="side-icon">❤️</span>
          <span class="side-text" id="likeCount">0</span>
        </button>

        <button class="side-btn" onclick="openComments()">
          <span class="side-icon">💬</span>
          <span class="side-text">0</span>
        </button>

        <button class="side-btn" id="saveBtn" onclick="toggleSave()">
          <span class="side-icon">⭐</span>
          <span class="side-text" id="saveCount">0</span>
        </button>

        <button class="side-btn" onclick="openShop()">
          <span class="side-icon">🛒</span>
          <span class="side-text">สินค้า</span>
        </button>

        <button class="side-btn" onclick="shareApp()">
          <span class="side-icon">➡️</span>
          <span class="side-text">แชร์</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== หน้าตลาดสินค้า ===== -->
  <div class="page" id="page-shop">
    <div class="empty-state">
      <div class="empty-icon">🛒</div>
      <div class="empty-title">ตลาดสินค้า</div>
      <div style="color:#666;">สินค้าแสนดี — ช้อปปิ้งทั่วโลก</div>
    </div>
  </div>

  <!-- ===== หน้าอัปโหลด ===== -->
  <div class="page" id="page-camera">
    <div class="empty-state">
      <div class="empty-icon">📷</div>
      <div class="empty-title">อัปโหลด</div>
      <div style="color:#666;">โพสต์วิดีโอและสินค้าของคุณ</div>
    </div>
  </div>

  <!-- ===== หน้าข้อความ ===== -->
  <div class="page" id="page-msg">
    <div class="empty-state">
      <div class="empty-icon">💬</div>
      <div class="empty-title">ข้อความ</div>
      <div style="color:#666;">แชทและการแจ้งเตือน</div>
    </div>
  </div>

  <!-- ===== หน้าโปรไฟล์ ===== -->
  <div class="page" id="page-profile">
    <div class="profile-header">
      <div class="profile-avatar">👤</div>
      <div class="profile-name">ผู้ใช้</div>
      <div class="profile-username">@user</div>
    </div>
    <div class="stats-row">
      <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">กำลังติดตาม</div></div>
      <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">ผู้ติดตาม</div></div>
      <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">ถูกใจ</div></div>
    </div>
  </div>

  <!-- ===== เมนูด้านล่าง ครบ 5 ปุ่ม ===== -->
  <div class="nav">
    <div class="nav-item active" onclick="goPage('home',0)"><span class="nav-icon">🏠</span></div>
    <div class="nav-item" onclick="goPage('shop',1)"><span class="nav-icon">🛒</span></div>
    <div class="nav-item" onclick="goPage('camera',2)"><span class="nav-icon plus-btn">+</span></div>
    <div class="nav-item" onclick="goPage('msg',3)"><span class="nav-icon">💬</span></div>
    <div class="nav-item" onclick="goPage('profile',4)"><span class="nav-icon">👤</span></div>
  </div>

  <script>
    const navItems = document.querySelectorAll('.nav-item');
    const tabs = document.querySelectorAll('.tab');

    function goPage(id, idx){
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.getElementById('page-'+id).classList.add('active');
      navItems.forEach((b,i)=>{
        b.classList.toggle('active',i===idx);
        b.style.color = i===idx ? '#fff' : '#aaa';
      });
    }

    function switchTab(el){
      tabs.forEach(t=>t.classList.remove('active'));
      el.classList.add('active');
    }

    // === เมนูด้านขวา ทำงาน ===
    let liked = false, likeNum = 0;
    let saved = false, saveNum = 0;

    function toggleLike() {
      liked = !liked;
      likeNum += liked ? 1 : -1;
      const btn = document.getElementById('likeBtn');
      if (btn) {
        btn.style.color = liked ? '#ff4757' : 'white';
        const cnt = document.getElementById('likeCount');
        if (cnt) cnt.textContent = likeNum;
      }
    }

    function toggleSave() {
      saved = !saved;
      saveNum += saved ? 1 : -1;
      const btn = document.getElementById('saveBtn');
      if (btn) {
        btn.style.color = saved ? '#ffd32a' : 'white';
        const cnt = document.getElementById('saveCount');
        if (cnt) cnt.textContent = saveNum;
      }
    }

    function openComments() { alert('💬 เปิดคอมเมนต์'); }
    function openShop() { goPage('shop', 1); }
    function shareApp() {
      navigator.clipboard.writeText(window.location.href);
      alert('✅ คัดลอกลิงก์แล้ว! แชร์ได้เลยครับ');
    }
  </script>

</body>
</html>
