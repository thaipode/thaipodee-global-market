<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>ThaiPodee — ของไทย ไปไกลทั่วโลก</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, sans-serif;}
html,body{height:100%; background:#000; color:#fff; overflow:hidden;}

.swiper{height:calc(100vh - 65px); overflow-y:auto; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;}
.slide{height:100vh; scroll-snap-align:start; position:relative; display:flex; align-items:center; justify-content:center; background:#000;}

video{width:100%; height:100%; object-fit:contain; background:#000;}
video::-webkit-media-controls{display:none;}

.welcome{text-align:center; padding:20px; z-index:10;}
.welcome h1{font-size:28px; color:#FFB800; margin-bottom:10px;}
.welcome p{font-size:14px; color:#aaa; margin:6px 0;}
.status{font-size:12px; margin-top:15px; padding:8px 12px; border-radius:6px; display:inline-block;}
.status.wait{background:#2a2410; color:#ffcc00;}
.status.ok{background:#0f2f1a; color:#4cd964;}
.status.err{background:#2f1010; color:#ff6b6b;}

.info{position:absolute; bottom:85px; left:16px; right:90px; z-index:10;}
.info h3{font-size:15px; margin-bottom:4px;}
.info p{font-size:12px; color:#999;}

.side{position:absolute; right:12px; bottom:120px; display:flex; flex-direction:column; gap:24px; align-items:center; z-index:20;}
.side-btn{display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;}
.side-icon{width:44px; height:44px; border-radius:50%; background:#222; display:flex; align-items:center; justify-content:center; font-size:20px; transition:transform .15s;}
.side-btn:active .side-icon{transform:scale(.9); background:#333;}
.side-txt{font-size:10px; color:#ccc;}

.nav{position:fixed; bottom:0; left:0; right:0; height:65px; background:#000; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #222; z-index:50;}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; cursor:pointer;}
.nav-icon{font-size:20px;}
.nav-add{background:#FF4757; padding:8px 24px; border-radius:6px; font-weight:600; color:#fff; font-size:12px;}

.progress{position:fixed; top:0; left:0; height:3px; background:#FF4757; width:0%; z-index:999; transition:width .2s;}

.modal{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; display:none;}
.modal.show{display:flex;}
.mbox{background:#111; border-radius:16px; padding:25px; width:100%; max-width:340px; border:1px solid #333;}
.mbox h4{font-size:17px; margin-bottom:15px; text-align:center;}
.mbtn{width:100%; padding:12px; border:none; border-radius:8px; font-size:15px; cursor:pointer; margin-top:10px;}
.mbtn.ok{background:#FF4757; color:#fff;}
.mbtn.close{background:#333; color:#fff;}

#fileInput{display:none;}
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<div class="swiper" id="swiper"></div>

<nav class="nav">
  <div class="nav-item" onclick="goTop()"><span class="nav-icon">🏠</span><span>หน้าแรก</span></div>
  <div class="nav-item"><span class="nav-icon">🧺</span><span>ตะกร้า</span></div>
  <div class="nav-item nav-add" onclick="document.getElementById('fileInput').click()">
    <span class="nav-icon">+</span><span>อัปโหลด</span>
  </div>
  <div class="nav-item" onclick="msgOpen()"><span class="nav-icon">💬</span><span>ข้อความ</span></div>
  <div class="nav-item" onclick="profileOpen()"><span class="nav-icon">👤</span><span>ฉัน</span></div>
</nav>

<input type="file" id="fileInput" accept="video/*">

<div class="modal" id="profileModal">
  <div class="mbox">
    <h4>โปรไฟล์</h4>
    <p style="color:#ccc; text-align:center;">ชื่อ: ผู้ใช้ ThaiPodee</p>
    <button class="mbtn close" onclick="profileModal.classList.remove('show')">ปิด</button>
  </div>
</div>

<div class="modal" id="msgModal">
  <div class="mbox">
    <h4>ข้อความ</h4>
    <p style="color:#888; text-align:center;">ยังไม่มีข้อความ</p>
    <button class="mbtn close" onclick="msgModal.classList.remove('show')">ปิด</button>
  </div>
</div>

<script>
// ==============================================================
// 🔑 ใส่ค่าที่เหลือตรงนี้ — ดึงจาก Firebase Console
// ==============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCt-wPPDeopLnjCv4QQvdYLQu2G___________", // ใส่เต็มตรงนี้
  authDomain: "thaipodee-market.firebaseapp.com",
  projectId: "thaipodee-market",
  storageBucket: "thaipodee-market.firebasestorage.app",
  messagingSenderId: "___________", // ใส่ตรงนี้
  appId: "___________" // ใส่ตรงนี้
};

let db, storage, videosRef;
let videoList = [];
let isReady = false;

// ==============================================================
// เริ่มทำงานทันที
// ==============================================================
function init(){
  renderWelcome();
  if(firebaseConfig.apiKey.includes('_')){
    updateStatus('⚠️ ใส่ apiKey เต็มก่อนครับ', 'wait');
    return;
  }

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    storage = firebase.storage();
    videosRef = db.collection('thaipodee_videos');
    isReady = true;
    updateStatus('✅ เชื่อมต่อศูนย์กลางแล้ว', 'ok');
    listenToCenter();
  } catch (e) {
    updateStatus('❌ ผิดพลาด: ' + e.message, 'err');
  }
}

function renderWelcome(){
  const sw = document.getElementById('swiper');
  sw.innerHTML = `
    <div class="slide">
      <div class="welcome">
        <h1>ThaiPodee</h1>
        <p>ของไทย ไปไกลทั่วโลก</p>
        <p style="color:#FF6B00; font-weight:600; margin-top:10px;">กด + อัปโหลด เพิ่มวิดีโอ</p>
        <p class="status wait" id="fbStatus">⏳ กำลังเชื่อมต่อ...</p>
        <p style="font-size:12px; color:#666; margin-top:10px;">เครื่องอื่นจะเห็นทันทีเมื่ออัปโหลด</p>
      </div>
      <div class="side">
        <div class="side-btn" onclick="profileOpen()"><div class="side-icon">👤</div><div class="side-txt">โปรไฟล์</div></div>
        <div class="side-btn"><div class="side-icon">❤️</div><div class="side-txt">0</div></div>
        <div class="side-btn"><div class="side-icon">💬</div><div class="side-txt">0</div></div>
        <div class="side-btn"><div class="side-icon">⭐</div><div class="side-txt">บันทึก</div></div>
        <div class="side-btn"><div class="side-icon">↗️</div><div class="side-txt">แชร์</div></div>
        <div class="side-btn"><div class="side-icon">🎵</div><div class="side-txt">เสียง</div></div>
      </div>
    </div>`;
}

function updateStatus(text, type){
  const el = document.getElementById('fbStatus');
  if(!el) return;
  el.textContent = text;
  el.className = 'status ' + type;
}

function listenToCenter(){
  videosRef.orderBy('createdAt', 'desc').onSnapshot(snapshot => {
    videoList = [];
    snapshot.forEach(doc => videoList.push({id:doc.id, ...doc.data()}));
    renderAll();
  }, err => updateStatus('❌ ' + err.message, 'err'));
}

function renderAll(){
  const sw = document.getElementById('swiper');
  if(videoList.length === 0){ renderWelcome(); return; }
  sw.innerHTML = '';
  
  videoList.forEach(v => {
    const s = document.createElement('div');
    s.className = 'slide';
    s.innerHTML = `
      <video src="${v.url}" loop muted playsinline preload="auto"></video>
      <div class="info">
        <h3>${v.name.replace(/\.[^.]+$/, '')}</h3>
        <p>@ThaiPodee</p>
      </div>
      <div class="side">
        <div class="side-btn" onclick="profileOpen()"><div class="side-icon">👤</div><div class="side-txt">โปรไฟล์</div></div>
        <div class="side-btn" onclick="likeVid('${v.id}')"><div class="side-icon">❤️</div><div class="side-txt">${v.likes||0}</div></div>
        <div class="side-btn"><div class="side-icon">💬</div><div class="side-txt">0</div></div>
        <div class="side-btn"><div class="side-icon">⭐</div><div class="side-txt">บันทึก</div></div>
        <div class="side-btn" onclick="shareVid('${v.name}','${v.url}')"><div class="side-icon">↗️</div><div class="side-txt">แชร์</div></div>
        <div class="side-btn"><div class="side-icon">🎵</div><div class="side-txt">เสียง</div></div>
      </div>`;
    sw.appendChild(s);
  });

  new IntersectionObserver(ents => {
    ents.forEach(e => {
      const vid = e.target.querySelector('video');
      e.isIntersecting ? vid?.play().catch(()=>{}) : vid?.pause();
    });
  }, {threshold:0.6}).observe(document.querySelectorAll('.slide'));
}

// อัปโหลด
document.getElementById('fileInput').onchange = async e => {
  const f = e.target.files[0];
  if(!f) return;
  if(!isReady){ alert('❌ ยังไม่เชื่อมต่อ Firebase'); e.target.value=''; return; }

  const bar = document.getElementById('progress');
  bar.style.width='0%';

  try {
    const ref = storage.ref('thaipodee_videos/' + Date.now() + '_' + f.name);
    const task = ref.put(f);
    task.on('state_changed', s => bar.style.width = (s.bytesTransferred/s.totalBytes)*100 + '%');
    await task;
    const url = await ref.getDownloadURL();
    await videosRef.add({
      name: f.name, url,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      likes: 0
    });
    bar.style.width='100%';
    setTimeout(()=>bar.style.width='0%',800);
    alert('✅ อัปโหลดสำเร็จ! เครื่องอื่นเห็นแล้ว');
  } catch(err){
    alert('❌ ' + err.message);
    bar.style.width='0%';
  }
  e.target.value='';
};

async function likeVid(id){
  if(!isReady) return;
  const d = await videosRef.doc(id).get();
  await videosRef.doc(id).update({likes:(d.data().likes||0)+1});
}

function shareVid(name,url){
  if(navigator.share) navigator.share({title:name,url});
  else {navigator.clipboard.writeText(url); alert('คัดลอกลิงก์แล้ว');}
}

function goTop(){ window.scrollTo({top:0,behavior:'smooth'}); }
function profileOpen(){ document.getElementById('profileModal').classList.add('show'); }
function msgOpen(){ document.getElementById('msgModal').classList.add('show'); }

init();
</script>
</body>
</html>
