<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thaipodee Market Online V2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
    .app-container { height: 100vh; display: flex; flex-direction: column; position: relative; }
    .video-container { flex: 1; position: relative; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .side-icons { position: absolute; right: 12px; bottom: 120px; display: flex; flex-direction: column; gap: 24px; align-items: center; }
    .side-icon { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .side-icon i { font-size: 28px; }
    .side-icon span { font-size: 11px; }
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
    .nav-item i { font-size: 22px; }
    .nav-item span { font-size: 10px; }
    .upload-btn { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 10; }
    .upload-btn i { font-size: 32px; color: white; cursor: pointer; }
    input[type="file"] { display: none; }
    .profile-pic { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
    .profile-pic-lg { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid white; }
    .profile-page { position: fixed; inset: 0; background: #000; z-index: 100; padding: 20px; overflow-y: auto; display: none; }
    .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 20px; }
    .video-thumb { aspect-ratio: 9/16; background: #222; border-radius: 4px; overflow: hidden; position: relative; cursor: pointer; }
    .video-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .close-btn { position: absolute; top: 10px; right: 10px; font-size: 24px; cursor: pointer; z-index: 10; }
  </style>
</head>
<body>
  <div class="app-container" id="mainApp">
    <div class="video-container" id="videoContainer">
      <video id="mainVideo" loop playsinline muted></video>
      <div id="noVideoMessage" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400">
        <i class="fa-solid fa-cloud-upload text-5xl mb-4"></i>
        <p>แตะเพื่อเลือกไฟล์วิดีโอ</p>
        <p class="text-sm">รองรับไฟล์ MP4, MOV</p>
      </div>
    </div>

    <div class="upload-btn">
      <label for="videoInput">
        <i class="fa-solid fa-plus"></i>
      </label>
      <input type="file" id="videoInput" accept="video/mp4,video/quicktime">
    </div>

    <div class="side-icons">
      <div class="side-icon" id="goProfile">
        <img id="profilePicDisplay" src="https://picsum.photos/seed/Thaipodee/40/40" class="profile-pic" alt="Profile">
        <span id="profileNameDisplay">Thaipodee_market</span>
      </div>
      <div class="side-icon"><i class="fa-solid fa-heart"></i><span>0</span></div>
      <div class="side-icon"><i class="fa-solid fa-comment"></i><span>0</span></div>
      <div class="side-icon"><i class="fa-solid fa-bookmark"></i><span>0</span></div>
      <div class="side-icon"><i class="fa-solid fa-music"></i><span>เสียง</span></div>
      <div class="side-icon"><i class="fa-solid fa-ellipsis-vertical"></i></div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item"><i class="fa-solid fa-home"></i><span>หน้าแรก</span></div>
      <div class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>ค้นหา</span></div>
      <div class="nav-item"><i class="fa-solid fa-plus-square"></i><span>สร้าง</span></div>
      <div class="nav-item"><i class="fa-solid fa-message"></i><span>ข้อความ</span></div>
      <div class="nav-item" id="openProfile">
        <i class="fa-solid fa-user"></i><span>ฉัน</span>
      </div>
    </div>

    <div class="profile-page" id="profilePage">
      <i class="fa-solid fa-xmark close-btn" id="closeProfile"></i>
      <div class="flex flex-col items-center pt-8">
        <div class="relative">
          <img id="profilePagePic" src="https://picsum.photos/seed/Thaipodee/40/40" class="profile-pic-lg" alt="Profile">
          <button id="btnChangePic" class="absolute bottom-0 right-0 w-8 h-8 bg-white text-black rounded-full flex items-center justify-center">
            <i class="fa-solid fa-camera text-sm"></i>
          </button>
          <input type="file" id="profilePicInput" accept="image/*" class="hidden">
        </div>
        <h3 id="profilePageName" class="text-xl font-bold mt-3 mb-1">Thaipodee_market</h3>
        <p class="text-gray-400 text-sm mb-6">@Thaipodee_market</p>
        <div class="flex gap-8 text-center">
          <div><div class="font-bold text-lg" id="videoCount">0</div><div class="text-xs text-gray-400">วิดีโอ</div></div>
          <div><div class="font-bold text-lg">0</div><div class="text-xs text-gray-400">ผู้ติดตาม</div></div>
          <div><div class="font-bold text-lg">0</div><div class="text-xs text-gray-400">กำลังติดตาม</div></div>
        </div>
      </div>
      <h4 class="w-full text-left font-semibold mb-3 mt-6">วิดีโอของฉัน</h4>
      <div id="myVideosGrid" class="w-full grid grid-cols-3 gap-1">
        <div class="aspect-square bg-gray-800/50 flex items-center justify-center col-span-3 py-8 text-gray-400">
          ยังไม่มีวิดีโอ กดปุ่ม + เพื่ออัปโหลด
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== ห้ามแก้ 3 บรรทัดนี้ ==========
    const CLOUD_NAME = 'orjpnytt';
    const UPLOAD_PRESET = 'Thaipodee_upload';
    const UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;

    let profileData = {
      name: 'Thaipodee_market',
      picture: 'https://picsum.photos/seed/Thaipodee/40/40',
      videos: []
    };

    const $ = id => document.getElementById(id);

    function loadProfile() {
      const saved = localStorage.getItem('Thaipodee_profile');
      if (saved) profileData = JSON.parse(saved);
      updateAllProfileViews();
    }
    function saveProfile() {
      localStorage.setItem('Thaipodee_profile', JSON.stringify(profileData));
      updateAllProfileViews();
    }
    function updateAllProfileViews() {
      $('profileNameDisplay').textContent = profileData.name;
      $('profilePicDisplay').src = profileData.picture;
      $('profilePageName').textContent = profileData.name;
      $('profilePagePic').src = profileData.picture;
      $('videoCount').textContent = profileData.videos.length;
      renderMyVideos();
    }

    function renderMyVideos() {
      const grid = $('myVideosGrid');
      if (profileData.videos.length === 0) {
        grid.innerHTML = `<div class="aspect-square bg-gray-800/50 flex items-center justify-center col-span-3 py-8 text-gray-400">ยังไม่มีวิดีโอ</div>`;
        return;
      }
      grid.innerHTML = profileData.videos.map((v, i) => `
        <div class="video-thumb" onclick="playFromProfile(${i})">
          <video src="${v.url}" muted></video>
        </div>
      `).join('');
    }

    $('btnChangePic').addEventListener('click', () => $('profilePicInput').click());
    $('profilePicInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      profileData.picture = URL.createObjectURL(file);
      saveProfile();
    });

    $('openProfile').addEventListener('click', () => {
      $('profilePage').style.display = 'block';
      renderMyVideos();
    });
    $('goProfile').addEventListener('click', () => {
      $('profilePage').style.display = 'block';
      renderMyVideos();
    });
    $('closeProfile').addEventListener('click', () => {
      $('profilePage').style.display = 'none';
    });

    function playFromProfile(index) {
      const v = profileData.videos[index];
      if (!v) return;
      $('mainVideo').src = v.url;
      $('mainVideo').play();
      $('noVideoMessage').style.display = 'none';
      $('profilePage').style.display = 'none';
    }

    $('videoInput').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;

      const localUrl = URL.createObjectURL(file);
      $('mainVideo').src = localUrl;
      $('mainVideo').play();
      $('noVideoMessage').style.display = 'none';

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      formData.append('cloud_name', CLOUD_NAME);

      try {
        const res = await fetch(UPLOAD_URL, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.secure_url) {
          profileData.videos.unshift({
            url: data.secure_url,
            publicId: data.public_id
          });
          saveProfile();
          alert('อัปโหลดสำเร็จ! ✅');
        } else {
          alert('อัปโหลดไม่สำเร็จ: ' + JSON.stringify(data));
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาด: ' + err.message);
      }
    });

    $('mainVideo').addEventListener('click', () => {
      $('mainVideo').muted = !$('mainVideo').muted;
    });

    loadProfile();
  </script>
</body>
</html>
