<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อัปโหลดวิดีโอ - ThaiPodee</title>
    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
    <style>
        <script>
  window.CLOUD_NAME = 'orjpnytt';
  window.UPLOAD_PRESET = 'Thaipodee_upload';
</script>

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; min-height: 100vh; padding: 20px; }

        .back-btn { 
            position: absolute; top: 15px; left: 15px; 
            color: #fff; text-decoration: none; font-size: 18px; z-index: 10;
        }
        .upload-container { max-width: 500px; margin: 60px auto 0; padding: 20px; }
        .upload-title { text-align: center; font-size: 22px; font-weight: bold; margin-bottom: 30px; }
        
        .upload-area { 
            border: 2px dashed #444; border-radius: 12px; padding: 50px 20px; 
            text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 20px;
        }
        .upload-area.has-file { border-color: #00ff88; background: rgba(0,255,136,0.05); }
        .upload-area:hover, .upload-area.dragover { border-color: #ffcc00; background: rgba(255,204,0,0.05); }
        .upload-icon { font-size: 56px; margin-bottom: 12px; }
        .upload-text { font-size: 16px; color: #ccc; }
        .upload-area.has-file .upload-text { color: #00ff88; font-weight: bold; }
        
        .preview-box { width: 100%; border-radius: 8px; margin-bottom: 15px; background: #111; display: none; }
        .preview-box.active { display: block; }
        
        .input-desc { 
            width: 100%; padding: 14px; background: #222; border: none; 
            border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 15px; outline: none;
        }
        .input-desc::placeholder { color: #777; }
        
        .btn-upload { 
            width: 100%; padding: 15px; background: #ffcc00; color: #000; 
            border: none; border-radius: 8px; font-size: 17px; font-weight: bold; 
            cursor: pointer; transition: all 0.2s;
        }
        .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-upload.ready { background: #00dd66; color: #fff; }
        .btn-upload.uploading { background: #ff9900; }
        
        .btn-cancel { 
            width: 100%; padding: 13px; background: #333; color: #fff; 
            border: none; border-radius: 8px; font-size: 15px; margin-top: 10px; cursor: pointer;
        }
        
        .status-msg { 
            text-align: center; padding: 14px; border-radius: 8px; 
            margin-top: 15px; display: none; font-size: 15px; line-height: 1.5;
        }
        .status-msg.success { display: block; background: rgba(0,200,100,0.2); color: #0f8; }
        .status-msg.error { display: block; background: rgba(255,50,50,0.2); color: #f55; }
        .status-msg.info { display: block; background: rgba(50,150,255,0.2); color: #5af; }

        #videoInput { display: none; }
        .file-info { font-size: 13px; color: #888; margin-top: 8px; }
        .file-selected { color: #00ff88; font-size: 14px; margin-top: 10px; display: none; }
        .file-selected.show { display: block; }
    </style>
</head>
<body>

<a href="javascript:history.back()" class="back-btn">← กลับ</a>

<div class="upload-container">
    <h1 class="upload-title">อัปโหลดวิดีโอ</h1>

    <div class="upload-area" id="uploadArea">
        <div class="upload-icon">🎥</div>
        <p class="upload-text">แตะเพื่อเลือกวิดีโอ หรือลากไฟล์มาวางที่นี่</p>
        <p class="file-info">รองรับทุกขนาดไฟล์ — ไม่จำกัดความยาววิดีโอ</p>
        <p class="file-selected" id="fileSelected">✅ เลือกไฟล์แล้ว — กดอัปโหลดได้เลย!</p>
    </div>
    <input type="file" id="videoInput" accept="video/*">

    <video class="preview-box" id="previewVid" controls muted></video>

    <input type="text" class="input-desc" id="descInput" placeholder="คำอธิบายวิดีโอ...">

    <button class="btn-upload" id="uploadBtn" disabled>กรุณาเลือกวิดีโอก่อน</button>
    <button class="btn-cancel" id="cancelBtn">ยกเลิก</button>

    <div class="status-msg" id="statusMsg"></div>
</div>

<script>
const CLOUD_NAME = 'orjpnytt';
const UPLOAD_PRESET = 'ml_default';

    const uploadArea = document.getElementById('uploadArea');
    const videoInput = document.getElementById('videoInput');
    const previewVid = document.getElementById('previewVid');
    const uploadBtn = document.getElementById('uploadBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const statusMsg = document.getElementById('statusMsg');
    const descInput = document.getElementById('descInput');
    const fileSelected = document.getElementById('fileSelected');

    let selectedFile = null;

    uploadArea.addEventListener('click', () => videoInput.click());

    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', e => {
        e.preventDefault(); uploadArea.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    videoInput.addEventListener('change', e => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (!file.type.startsWith('video/')) {
            showStatus('กรุณาเลือกไฟล์วิดีโอเท่านั้น', 'error');
            return;
        }
        selectedFile = file;
        
        // ✅ เปลี่ยนสถานะชัดเจน
        uploadArea.classList.add('has-file');
        fileSelected.classList.add('show');
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'อัปโหลดเลย';
        uploadBtn.classList.add('ready');
        
        showStatus(`✅ เลือกไฟล์: ${file.name} (${(file.size / (1024*1024)).toFixed(1)} MB)`, 'info');
        
        const url = URL.createObjectURL(file);
        previewVid.src = url;
        previewVid.classList.add('active');
    }

    uploadBtn.addEventListener('click', async () => {
        if (!selectedFile) { showStatus('กรุณาเลือกวิดีโอก่อน', 'error'); return; }
        
        uploadBtn.classList.remove('ready');
        uploadBtn.classList.add('uploading');
        uploadBtn.disabled = true;
        uploadBtn.textContent = 'กำลังอัปโหลด... กรุณารอ';
        showStatus('กำลังอัปโหลดวิดีโอ กรุณารอจนเสร็จ — อย่าปิดหน้านี้!', 'info');

        try {
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('folder', 'thaipodee_videos');

            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            
            if (data.secure_url) {
                showStatus('✅ อัปโหลดสำเร็จ! กำลังกลับไปหน้าแรก...', 'success');
                localStorage.setItem('latestVideo', JSON.stringify({
                    url: data.secure_url,
                    publicId: data.public_id,
                    description: descInput.value,
                    createdAt: new Date().toISOString()
                }));
                
                setTimeout(() => {
                    history.back();
                }, 1800);
            } else {
                throw new Error(data.error?.message || 'อัปโหลดไม่สำเร็จ');
            }
        } catch (err) {
            showStatus('❌ ผิดพลาด: ' + err.message, 'error');
            uploadBtn.classList.remove('uploading');
            uploadBtn.textContent = 'ลองอีกครั้ง';
            uploadBtn.disabled = false;
        }
    });

    cancelBtn.addEventListener('click', () => history.back());

    function showStatus(text, type) {
        statusMsg.textContent = text;
        statusMsg.className = `status-msg ${type}`;
    }
</script>

</body>
</html>
