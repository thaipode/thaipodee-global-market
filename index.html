<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<meta name="description" content="ThaiPodee — แอปวิดีโอและตลาดสินค้าไทย">

<meta name="background-color" content="#000000">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href='data:application/manifest+json,{"name":"ThaiPodee","short_name":"ThaiPodee","start_url":"./?v=1040","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"https://raw.githubusercontent.com/thaipodee/thaipodee-global-market/main/thaipodee_logo_icon.png?v=1040","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>

<title>ThaiPodee</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #000; color: #fff; height: 100vh; overflow: hidden; }

.page { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; }
.page.active { display: flex; }
.main-page { z-index: 1; }
.profile-page { z-index: 2; background: #000; padding: 15px; overflow-y: auto; }

.back-btn {
  background: transparent; color: #fff; border: none; font-size: 16px; padding: 10px 0; cursor: pointer;
  display: flex; align-items: center; gap: 5px; margin-bottom: 10px;
}

.profile-header { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #222; }
.profile-avatar-large {
  width: 90px; height: 90px; border-radius: 50%; border: 3px solid #fff;
  margin: 0 auto 12px; overflow: hidden; cursor: pointer; background: #333;
  display: flex; align-items: center; justify-content: center; font-size: 40px;
}
.profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; display: none; }
.profile-name { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
.edit-name-input {
  background: #222; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 8px;
  font-size: 16px; text-align: center; width: 220px; margin-bottom: 10px; display: none;
}
.save-name-btn, .change-avatar-btn {
  background: #ff2442; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; margin: 4px;
}
.hidden-input { display: none; }

.profile-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
.video-list { display: flex; flex-direction: column; gap: 12px; }
.video-item {
  display: flex; align-items: center; gap: 12px; padding: 12px; background: #1a1a1a; border-radius: 10px;
}
.video-item-thumb {
  width: 80px; height: 45px; background: #333; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px;
  cursor: pointer; flex-shrink: 0;
  background-size: cover; background-position: center;
}
.video-item-info { flex: 1; cursor: pointer; }
.video-item-name { font-size: 14px; margin-bottom: 2px; }
.video-item-date { font-size: 11px; color: #888; }
.video-delete-btn {
  background: #cc0000; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%;
  font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.empty-text { text-align: center; color: #666; padding: 40px 20px; }

.video-area {
  position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; width: 100%;
}
.play-box { text-align: center; width: 100%; padding: 20px; }
.play-icon { font-size: 64px; color: #fff; margin-bottom: 12px; }
.play-text { font-size: 15px; color: #888; margin-bottom: 20px; }
.video-player {
  max-width: 100%; width: 100%; max-height: 65vh; border-radius: 8px; display: none; background: #000;
}
.has-video .play-box { display: none; }
.has-video .video-player { display: block; }
.upload-btn {
  background: #ff2442; color: #fff; border: none; padding: 12px 24px; border-radius: 25px; font-size: 15px; cursor: pointer;
}
.upload-input { display: none; }

.right-bar {
  position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 28px; align-items: center; z-index: 10;
}
.side-btn {
  border: none; background: transparent; color: #fff; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.side-icon { font-size: 26px; line-height: 1; }
.side-num { font-size: 11px; color: #fff; min-height: 14px; }
.avatar-wrap { position: relative; width: 44px; height: 44px; overflow: hidden; border-radius: 50%; border: 2px solid #fff; background: #333; }
.avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: none; }
.avatar-circle {
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 22px;
}
.plus-red {
  position: absolute; bottom: -3px; right: -3px; width: 18px; height: 18px; border-radius: 50%;
  background: #ff2442; color: #fff; font-size: 13px; font-weight: bold;
  display: flex; align-items: center; justify-content: center; border: 2px solid #000; line-height: 1;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
  background: #000; display: flex; justify-content: space-around; align-items: center;
  border-top: 1px solid #222; z-index: 10;
}
.nav-btn {
  border: none; background: transparent; color: #fff; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.nav-icon { font-size: 22px; }
.nav-label { font-size: 10px; color: #aaa; }
.nav-btn.active .nav-label { color: #fff; }
.plus-center {
  width: 46px; height: 34px; background: #ff2442; border-radius: 8px;
  font-size: 24px; font-weight: bold; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>

<div class="page main-page active" id="mainPage">
  <div class="video-area" id="videoArea">
    <div class="play-box" id="playBox">
      <div class="play-icon">▶</div>
      <p class="play-text" id="playText">กดปุ่มล่างเพื่อเลือกวิดีโอ</p>
      <button class="upload-btn" id="uploadBtn">📂 เลือกวิดีโอจากเครื่อง</button>
      <input type="file" class="upload-input" id="uploadInput" accept="video/*">
    </div>
    <video class="video-player" id="videoPlayer" controls playsinline preload="metadata"></video>
  </div>

  <div class="right-bar">
    <button class="side-btn" id="btnAvatar">
      <div class="avatar-wrap" id="avatarWrap">
        <div class="avatar-circle" id="avatarCircle">👤</div>
        <img id="avatarImg" alt="avatar">
        <div class="plus-red">+</div>
      </div>
    </button>
    <button class="side-btn" id="btnLike">
      <span class="side-icon" id="likeIcon">🤍</span>
      <span class="side-num" id="likeNum">0</span>
    </button>
    <button class="side-btn" id="btnComment">
      <span class="side-icon">💬</span>
      <span class="side-num" id="commentNum">0</span>
    </button>
    <button class="side-btn" id="btnSave">
      <span class="side-icon">🔖</span>
      <span class="side-num" id="saveNum">0</span>
    </button>
    <button class="side-btn" id="btnShare">
      <span class="side-icon">↗️</span>
      <span class="side-num" id="shareNum">0</span>
    </button>
    <button class="side-btn" id="btnMusic">
      <span class="side-icon">🎵</span>
    </button>
  </div>
</div>

<div class="page profile-page" id="profilePage">
  <button class="back-btn" id="backBtn">◀ กลับ</button>
  
  <div class="profile-header">
    <div class="profile-avatar-large" id="profileAvatarLarge">
      <span id="largeAvatarText">👤</span>
      <img id="largeAvatarImg" alt="รูปโปรไฟล์">
    </div>
    <h2 class="profile-name" id="profileNameDisplay">ผู้ใช้ ThaiPodee master app</h2>
    <input type="text" class="edit-name-input" id="editNameInput" placeholder="พิมพ์ชื่อของคุณ">
    <div>
      <button class="change-avatar-btn" id="changeAvatarBtn">📷 เปลี่ยนรูป</button>
      <button class="change-avatar-btn" id="editNameBtn" style="background:#222;">✏️ เปลี่ยนชื่อ</button>
      <button class="save-name-btn" id="saveNameBtn" style="display:none;">✅ บันทึกชื่อ</button>
    </div>
    <input type="file" class="hidden-input" id="avatarInput" accept="image/*">
  </div>

  <h3 class="profile-title">วิดีโอที่บันทึกไว้</h3>
  <div class="video-list" id="videoList">
    <p class="empty-text" id="emptyText">ยังไม่มีวิดีโอที่บันทึก</p>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="navHome">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">หน้าหลัก</span>
  </button>
  <button class="nav-btn" id="navShop">
    <span class="nav-icon">🛍️</span>
    <span class="nav-label">ร้านค้า</span>
  </button>
  <button class="nav-btn" id="navAdd">
    <span class="plus-center">+</span>
  </button>
  <button class="nav-btn" id="navMsg">
    <span class="nav-icon">💬</span>
    <span class="nav-label">ข้อความ</span>
  </button>
  <button class="nav-btn" id="navProfile">
    <span class="nav-icon">👤</span>
    <span class="nav-label">โปรไฟล์</span>
  </button>
</nav>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `self.addEventListener('install', e => { e.waitUntil(self.skipWaiting()); }); self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });`;
    const blob = new Blob([swCode], {type: 'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob))
      .then(() => console.log('✅ SW registered'))
      .catch(err => console.log('SW:', err));
  });
}

let liked = false, likeCount = 0;
let commentCount = 0, saveCount = 0, shareCount = 0;
let savedVideos = [];
let currentVideoBlobUrl = null;
let activeVideoIndex = -1;

const STORAGE_KEY = 'thaipodeeVideoList_v1040';
const NAME_KEY = 'thaipodeeName_v1040';
const AVATAR_KEY = 'thaipodeeAvatar_v1040';

const mainPage = document.getElementById('mainPage');
const profilePage = document.getElementById('profilePage');
const videoArea = document.getElementById('videoArea');
const videoPlayer = document.getElementById('videoPlayer');
const uploadInput = document.getElementById('uploadInput');
const uploadBtn = document.getElementById('uploadBtn');
const videoList = document.getElementById('videoList');

const avatarImg = document.getElementById('avatarImg');
const avatarCircle = document.getElementById('avatarCircle');
const largeAvatarImg = document.getElementById('largeAvatarImg');
const largeAvatarText = document.getElementById('largeAvatarText');
const profileNameDisplay = document.getElementById('profileNameDisplay');
const editNameInput = document.getElementById('editNameInput');
const editNameBtn = document.getElementById('editNameBtn');
const saveNameBtn = document.getElementById('saveNameBtn');
const avatarInput = document.getElementById('avatarInput');

function loadProfile() {
  const savedName = localStorage.getItem(NAME_KEY);
  const savedAvatar = localStorage.getItem(AVATAR_KEY);
  if (savedName) profileNameDisplay.textContent = savedName;
  if (savedAvatar) {
    avatarImg.src = savedAvatar; avatarImg.style.display = 'block';
    avatarCircle.style.display = 'none';
    largeAvatarImg.src = savedAvatar; largeAvatarImg.style.display = 'block';
    largeAvatarText.style.display = 'none';
  }
}

document.getElementById('changeAvatarBtn').addEventListener('click', () => avatarInput.click());
avatarInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    localStorage.setItem(AVATAR_KEY, dataUrl);
    avatarImg.src = dataUrl; avatarImg.style.display = 'block';
    avatarCircle.style.display = 'none';
    largeAvatarImg.src = dataUrl; largeAvatarImg.style.display = 'block';
    largeAvatarText.style.display = 'none';
  };
  reader.readAsDataURL(file);
});

editNameBtn.addEventListener('click', () => {
  editNameInput.value = profileNameDisplay.textContent;
  editNameInput.style.display = 'block';
  saveNameBtn.style.display = 'inline-block';
  editNameBtn.style.display = 'none';
  profileNameDisplay.style.display = 'none';
  editNameInput.focus();
});
saveNameBtn.addEventListener('click', () => {
  const newName = editNameInput.value.trim() || 'ผู้ใช้ ThaiPodee';
  localStorage.setItem(NAME_KEY, newName);
  profileNameDisplay.textContent = newName;
  editNameInput.style.display = 'none';
  saveNameBtn.style.display = 'none';
  editNameBtn.style.display = 'inline-block';
  profileNameDisplay.style.display = 'block';
});

function showPage(page) {
  mainPage.classList.toggle('active', page === 'main');
  profilePage.classList.toggle('active', page === 'profile');
}

function saveVideoList() {
  const toSave = savedVideos.map(v => ({
    name: v.name,
    date: v.date,
    thumbnail: v.thumbnail
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
}

function renderVideoList() {
  videoList.innerHTML = '';
  if (savedVideos.length === 0) {
    videoList.innerHTML = '<p class="empty-text">ยังไม่มีวิดีโอที่บันทึก</p>';
    return;
  }
  savedVideos.forEach((vid, idx) => {
    const item = document.createElement('div');
    item.className = 'video-item';
    item.innerHTML = `
      <div class="video-item-thumb" data-idx="${idx}" style="background-image:${vid.thumbnail ? `url(${vid.thumbnail})` : 'none'}">
        ${!vid.thumbnail ? '▶' : ''}
      </div>
      <div class="video-item-info" data-idx="${idx}">
        <div class="video-item-name">${vid.name || 'วิดีโอ #' + (idx+1)}</div>
        <div class="video-item-date">${vid.date}</div>
      </div>
      <button class="video-delete-btn" data-idx="${idx}">🗑️</button>
    `;
    videoList.appendChild(item);
  });
  
  document.querySelectorAll('.video-item-thumb, .video-item-info').forEach(el => {
    el.addEventListener('click', (e) => {
      const idx = parseInt(e.currentTarget.dataset.idx);
      playSelectedVideo(idx);
    });
  });
  
  document.querySelectorAll('.video-delete-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = parseInt(e.currentTarget.dataset.idx);
      deleteVideo(idx);
    });
  });
}

function deleteVideo(index) {
  if (!confirm('ต้องการลบวิดีโอนี้หรือไม่?')) return;
  savedVideos.splice(index, 1);
  if (activeVideoIndex === index) {
    videoPlayer.src = '';
    videoArea.classList.remove('has-video');
    activeVideoIndex = -1;
    if (currentVideoBlobUrl) {
      URL.revokeObjectURL(currentVideoBlobUrl);
      currentVideoBlobUrl = null;
    }
  }
  saveVideoList();
  renderVideoList();
}

function playSelectedVideo(index) {
  const vid = savedVideos[index];
  if (!vid) return;
  
  if (vid.blob) {
    if (currentVideoBlobUrl) URL.revokeObjectURL(currentVideoBlobUrl);
    currentVideoBlobUrl = URL.createObjectURL(vid.blob);
    videoPlayer.src = currentVideoBlobUrl;
    videoArea.classList.add('has-video');
    activeVideoIndex = index;
    showPage('main');
    videoPlayer.play().catch(() => {});
  } else {
    alert('⚠️ วิดีโอนี้อยู่ในรายการ แต่ไฟล์ไม่ได้ถูกเก็บไว้ในหน่วยความจำชั่วคราว — ต้องเลือกไฟล์ใหม่หากปิดแอปไปนาน');
  }
}

window.addEventListener('load', () => {
  loadProfile();
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { savedVideos = JSON.parse(stored); } catch { savedVideos = []; }
  }
});

uploadBtn.addEventListener('click', () => uploadInput.click());
uploadInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const now = new Date();
  const dateStr = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  
  const newVid = {
    name: file.name,
    date: dateStr,
    blob: file,
    thumbnail: null
  };
  
  const tempVid = document.createElement('video');
  tempVid.src = URL.createObjectURL(file);
  tempVid.preload = 'metadata';
  tempVid.onloadeddata = () => {
    tempVid.currentTime = 1;
  };
  tempVid.onseeked = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 160; canvas.height = 90;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(tempVid, 0, 0, 160, 90);
    newVid.thumbnail = canvas.toDataURL('image/png');
    saveVideoList();
    renderVideoList();
  };
  
  savedVideos.push(newVid);
  saveVideoList();
  
  if (currentVideoBlobUrl) URL.revokeObjectURL(currentVideoBlobUrl);
  currentVideoBlobUrl = URL.createObjectURL(file);
  videoPlayer.src = currentVideoBlobUrl;
  videoArea.classList.add('has-video');
  activeVideoIndex = savedVideos.length - 1;
  
  renderVideoList();
  uploadInput.value = '';
});

document.getElementById('navProfile').addEventListener('click', () => {
  renderVideoList();
  showPage('profile');
  setActiveNav('navProfile');
});
document.getElementById('backBtn').addEventListener('click', () => {
  showPage('main');
  setActiveNav('navHome');
});

document.getElementById('btnLike').onclick = () => {
  liked = !liked; likeCount += liked ? 1 : -1;
  document.getElementById('likeNum').textContent = likeCount;
  document.getElementById('likeIcon').textContent = liked ? '❤️' : '🤍';
};
document.getElementById('btnComment').onclick = () => { commentCount++; document.getElementById('commentNum').textContent = commentCount; };
document.getElementById('btnSave').onclick = () => { saveCount++; document.getElementById('saveNum').textContent = saveCount; };
document.getElementById('btnShare').onclick = () => { shareCount++; document.getElementById('shareNum').textContent = shareCount; };
document.getElementById('btnMusic').onclick = () => alert('เปลี่ยนเพลงประกอบ');

function setActiveNav(id) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.getElementById('navHome').onclick = () => { showPage('main'); setActiveNav('navHome'); };
document.getElementById('navShop').onclick = () => setActiveNav('navShop');
document.getElementById('navAdd').onclick = () => alert('เพิ่มโพสต์วิดีโอ');
document.getElementById('navMsg').onclick = () => setActiveNav('navMsg');

window.addEventListener('beforeunload', () => {
  if (currentVideoBlobUrl) URL.revokeObjectURL(currentVideoBlobUrl);
});
</script>

</body>
</html>
