   ThaiPodee v1102 — แก้ด่วน! วิดีโอไม่แสดง แต่เสียงมา
   อัปเดต: 29 กันยายน 2569 20:27 น.
   --------------------------------------------------------------
   ✅ แก้ภาพวิดีโอไม่ขึ้นโดยตรง
   ✅ ปรับโครงสร้างให้วิดีโออยู่ชั้นล่างสุด แสดงก่อนทุกอย่าง
   ✅ object-fit ปลอดภัย แนวตั้งเต็มจอ แนวนอนครบ
   ✅ เสียงทำงาน + ข้อมูล/ปุ่มครบ
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff; font-family: -apple-system, sans-serif;
  }

  /* ---- พื้นที่หลัก ---- */
  #app {
    width: 100%; height: 100vh; position: relative; overflow: hidden;
  }

  /* ---- พื้นที่วิดีโอ — ชั้นที่ 1 (ล่างสุด) ---- */
  #videoArea {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 1; /* สำคัญ: อยู่ล่างสุดแต่แสดงได้แน่นอน */
  }

  .video-page {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0; visibility: hidden;
    transition: opacity 0.3s ease;
  }
  .video-page.active {
    opacity: 1; visibility: visible;
  }

  /* ===== แก้ตรงนี้โดยเฉพาะ ===== */
  video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    object-fit: contain; /* ถ้าไม่ขึ้น เปลี่ยนเป็น fill ลองดู */
  }
  video.portrait { object-fit: cover; }
  video.landscape { object-fit: contain; }

  /* ---- ชั้นที่ 2 — ส่วนควบคุมทั้งหมด ซ้อนบนวิดีโอ ---- */
  .ui-layer {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10; /* อยู่บนวิดีโอ */
    pointer-events: none;
  }
  .ui-layer > * { pointer-events: auto; }

  /* ---- บนสุด ---- */
  .top-bar {
    position: absolute; top: 12px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center;
    padding: 0 12px;
  }
  .tabs { display: flex; gap: 24px; }
  .tab { font-size: 15px; color: #aaa; padding-bottom: 4px; border-bottom: 2px solid transparent; }
  .tab.active { color: #fff; border-bottom-color: #fff; font-weight: 600; }
  .search { position: absolute; right: 12px; font-size: 20px; }
  .ver { position: absolute; right: 50px; font-size: 11px; color: #888; }

  /* ---- ข้อมูลล่างซ้าย ---- */
  .info-left {
    position: absolute; bottom: 85px; left: 12px; right: 80px;
  }
  .uname { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .follow-tag { background: #fff; color: #000; font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: bold; }
  .desc { font-size: 13px; margin-bottom: 4px; color: #eee; }
  .tags { font-size: 12px; color: #bbb; }

  /* ---- ไอคอนขวา ---- */
  .icons-right {
    position: absolute; right: 10px; bottom: 95px;
    display: flex; flex-direction: column; gap: 22px; align-items: center;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    font-size: 22px; cursor: pointer;
  }
  .icon-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .icon-num { font-size: 11px; }
  .prof-wrap { position: relative; }
  .plus-badge {
    position: absolute; bottom: -4px; right: -4px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #ff2d55; color: #fff; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }

  /* ---- เมนูล่าง ---- */
  .nav-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 65px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    display: flex; justify-content: space-around; align-items: center;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: #fff; font-size: 22px; border: none; background: none; cursor: pointer;
  }
  .nav-label { font-size: 10px; }
  .nav-plus {
    width: 52px; height: 36px; border-radius: 8px;
    background: #ff2d55; font-size: 24px; display: flex; align-items: center; justify-content: center;
  }

  #fileInput { display: none; }

  /* ---- ซ่อนข้อความกวนใจ ---- */
  [data-extra], [id*="silent"], [class*="meta"] { display: none !important; }
</style>
</head>
<body>

<input type="file" id="fileInput" accept="video/*">

<div id="app">
  <!-- ชั้นที่ 1: วิดีโอ อยู่ล่างสุด แสดงก่อนเลย -->
  <div id="videoArea"></div>

  <!-- ชั้นที่ 2: ส่วนควบคุม ซ้อนบนวิดีโอ -->
  <div class="ui-layer">
    <div class="top-bar">
      <span class="ver">v1102</span>
      <div class="tabs">
        <span class="tab">กำลังติดตาม</span>
        <span class="tab active">สำหรับคุณ</span>
      </div>
      <span class="search">🔍</span>
    </div>

    <div class="info-left">
      <div class="uname">@thaipodee <span class="follow-tag">ติดตาม</span></div>
      <div class="desc">ThaiPodee — แชร์วิดีโอและสินค้า</div>
      <div class="tags">#ThaiPodee #แชร์วิดีโอ #สินค้า #ไทย</div>
    </div>

    <div class="icons-right">
      <div class="icon-wrap">
        <div class="prof-wrap">
          <button class="icon-btn">👤</button>
          <span class="plus-badge">+</span>
        </div>
      </div>
      <div class="icon-wrap"><button class="icon-btn">❤️</button><span class="icon-num">0</span></div>
      <div class="icon-wrap"><button class="icon-btn">💬</button><span class="icon-num">0</span></div>
      <div class="icon-wrap"><button class="icon-btn">📌</button><span class="icon-num">0</span></div>
      <div class="icon-wrap"><button class="icon-btn">⬆️</button><span class="icon-num">0</span></div>
      <div class="icon-wrap"><button class="icon-btn">🎵</button></div>
    </div>

    <nav class="nav-bottom">
      <button class="nav-item">🏠<span class="nav-label">หน้าหลัก</span></button>
      <button class="nav-item">🛍️<span class="nav-label">ร้านค้า</span></button>
      <button class="nav-item nav-plus" id="uploadBtn">+</button>
      <button class="nav-item">💬<span class="nav-label">ข้อความ</span></button>
      <button class="nav-item">👤<span class="nav-label">โปรไฟล์</span></button>
    </nav>
  </div>
</div>

<script>
const videoArea = document.getElementById('videoArea');
const fileInput = document.getElementById('fileInput');

let pages = [];
let now = 0;

// ---- สร้างหน้าวิดีโอ ----
function makePage(src) {
  const page = document.createElement('div');
  page.className = 'video-page';
  const vid = document.createElement('video');
  vid.src = src;
  vid.loop = true;
  vid.playsInline = true;
  vid.preload = 'auto';
  vid.muted = true;

  // ตรวจสัดส่วนวิดีโอ
  vid.addEventListener('loadedmetadata', () => {
    const isP = vid.videoHeight > vid.videoWidth;
    vid.className = isP ? 'portrait' : 'landscape';
    console.log('✅ วิดีโอโหลดเสร็จ:', vid.videoWidth, '×', vid.videoHeight, isP ? 'ตั้ง' : 'นอน');
  });
  vid.addEventListener('error', e => console.error('❌ โหลดวิดีโอไม่ได้:', e));

  page.appendChild(vid);
  videoArea.appendChild(page);
  return { page, vid };
}

// ---- เปลี่ยนหน้า ----
function showPage(idx) {
  if (!pages.length) return;
  if (idx < 0) idx = 0;
  if (idx >= pages.length) idx = pages.length - 1;

  pages[now].page.classList.remove('active');
  pages[now].vid.pause();

  now = idx;
  pages[now].page.classList.add('active');
  pages[now].vid.muted = false;
  pages[now].vid.play().catch(e => console.log('เล่น:', e));
}

// ---- โหลดรายการวิดีโอ ----
function initVideos(list) {
  videoArea.innerHTML = '';
  pages = list.map(src => makePage(src));
  now = 0;
  setTimeout(() => showPage(0), 100);
}

// ---- ตัวอย่างเริ่มต้น ----
document.addEventListener('DOMContentLoaded', () => {
  initVideos([
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4'
  ]);
});

// ---- ปุ่มอัปโหลด ----
document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  pages.unshift(makePage(url));
  showPage(0);
});

// ---- เลื่อนหน้าจอ ----
let yStart = 0, dragging = false, moveY = 0;
document.addEventListener('touchstart', e => {
  yStart = e.touches[0].clientY;
  dragging = true;
});
document.addEventListener('touchmove', e => {
  if (!dragging) return;
  moveY = e.touches[0].clientY - yStart;
});
document.addEventListener('touchend', () => {
  if (!dragging) return;
  dragging = false;
  if (moveY < -60) showPage(now + 1);
  else if (moveY > 60) showPage(now - 1);
  moveY = 0;
});

// ปลดล็อกเสียง
document.addEventListener('click', () => {
  pages.forEach(p => {
    p.vid.muted = false;
    p.vid.play().catch(() => {});
  });
}, { once: true });
</script>

</body>
</html>
