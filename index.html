<div id="upload" class="page">
  <div class="p-4">
    <button class="mb-4 text-lg" data-page="home"><i class="fas fa-arrow-left"></i> กลับ</button>
    <h3 class="text-xl font-bold mb-4">โพสต์วิดีโอ / รูปภาพ</h3>
    <input type="file" id="fileInput" accept="video/*,image/*" class="w-full p-3 bg-gray-800 rounded-lg mb-3">

    </div>

  </div>

<div id="profile" class="page">
  <div class="p-4">
    <button class="mb-4 text-lg" data-page="home"><i class="fas fa-arrow-left"></i> กลับ</button>
    <h3 class="text-xl font-bold mb-3">โปรไฟล์</h3>
    <p class="text-gray-400 mb-2">ชื่อ: ThaiPodee Master</p>
    <p class="text-gray-400 mb-2">จำนวนโพสต์: <span id="postCount">0</span></p>
    <p class="text-gray-400 mb-4">เริ่มใช้งาน: 21 กันยายน 2569</p>
    
    <div class="danger-box">
      <p class="text-yellow-400 text-sm"><i class="fas fa-exclamation-triangle"></i> ลบทั้งหมด — เหลือเฉพาะล่าสุดอันเดียว</p>
      <button id="keepLatestBtn" class="del-btn mt-2">เหลืออันล่าสุดเพียง 1 รายการ</button>
    </div>
    
    <div id="profilePostsContainer"></div>
  </div>
</div>

<script>
let posts = [];

function loadPosts() {
  const saved = localStorage.getItem('thaipodee_posts');
  if (saved) {
    posts = JSON.parse(saved);
  }
  renderPosts();
  renderProfilePosts();
  updatePostCount();
}

function savePosts() {
  localStorage.setItem('thaipodee_posts', JSON.stringify(posts));
}

function updatePostCount() {
  const activeCount = posts.filter(p => !p.deleted).length;
  document.getElementById('postCount').textContent = activeCount;
}

function renderPosts() {
  const container = document.getElementById('postsContainer');
  container.innerHTML = '';
  
  posts.filter(p => !p.deleted).forEach(p => {
    let bg = p.thumbnail ? `background-image:url('${p.thumbnail}');` : '';
    container.innerHTML += `
      <div class="post-card">
        <div class="meta">${p.author} · ${p.date} · ${p.source}</div>
        <div class="title">${p.title}</div>
        <div class="media-box" style="${bg}">
          <i class="fas fa-${p.type==='video'?'play-circle':'image'}"></i>
          <div class="right-buttons">
            <div class="r-btn"><i class="fas fa-user"></i><span>${p.author}</span></div>
            <div class="r-btn"><i class="far fa-heart"></i><span>0</span></div>
            <div class="r-btn"><i class="far fa-comment"></i><span>0</span></div>
            <div class="r-btn"><i class="far fa-bookmark"></i><span>บันทึก</span></div>
            <div class="r-btn" onclick="shareThis()"><i class="fas fa-share"></i><span>แชร์</span></div>
            <div class="r-btn" onclick="deletePost('${p.id}')"><i class="fas fa-trash"></i><span>ลบ</span></div>
          </div>
        </div>
        <div class="meta">${p.aspect} · ${p.size || ''}</div>
      </div>
    `;
  });
}

function renderProfilePosts() {
  const container = document.getElementById('profilePostsContainer');
  if (!container) return;
  container.innerHTML = '';
  
  posts.filter(p => !p.deleted).forEach(p => {
    let bg = p.thumbnail ? `background-image:url('${p.thumbnail}');` : '';
    container.innerHTML += `
      <div class="post-card">
        <div class="meta">${p.author} · ${p.date} · ${p.source}</div>
        <div class="title">${p.title}</div>
        <div class="media-box" style="${bg}">
          <i class="fas fa-${p.type==='video'?'play-circle':'image'}"></i>
        </div>
        <div class="meta">${p.aspect} · ${p.size || ''}</div>
        <button class="del-btn" onclick="deletePost('${p.id}')">ลบรายการนี้</button>
      </div>
    `;
  });
}

function deletePost(id) {
  if (!confirm('ยืนยันการลบ?')) return;
  const idx = posts.findIndex(p => p.id === id);
  if (idx !== -1) {
    posts[idx].deleted = true;
    savePosts();
    renderPosts();
    renderProfilePosts();
    updatePostCount();
    showStatus('ลบเรียบร้อย ✅');
  }
}

function keepOnlyLatest() {
  if (!confirm('เหลือเฉพาะรายการล่าสุด? รายการอื่นจะหายไป')) return;
  const active = posts.filter(p => !p.deleted);
  if (active.length <= 1) {
    showStatus('มีรายการเดียวอยู่แล้ว ✅');
    return;
  }
  active.slice(1).forEach(p => {
    const idx = posts.findIndex(x => x.id === p.id);
    if (idx !== -1) posts[idx].deleted = true;
  });
  savePosts();
  renderPosts();
  renderProfilePosts();
  updatePostCount();
  showStatus('เหลือ 1 รายการเรียบร้อย ✅');
}

function showStatus(text, duration = 2000) {
  const bar = document.getElementById('statusBar');
  bar.textContent = text;
  bar.classList.add('show');
  if (duration > 0) setTimeout(() => bar.classList.remove('show'), duration);
}

function shareThis() {
  const txt = `✅ thaipodee Global Market
🔗 ลิงก์: ${window.location.href}
📌 เปิดใน Chrome → กดจุด 3 → เพิ่มไปที่หน้าจอหลัก`;
  if (navigator.share) {
    navigator.share({title: 'thaipodee', text: txt});
  } else {
    navigator.clipboard.writeText(txt).then(() => alert('คัดลอกลิงก์แล้ว ✅'));
  }
}

setTimeout(() => {
  document.getElementById('splash').classList.add('hide');
  loadPosts();
}, 1200);

document.querySelectorAll('[data-page]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(btn.dataset.page).classList.add('active');
    window.scrollTo(0, 0);
    if (btn.dataset.page === 'profile') {
      renderProfilePosts();
      updatePostCount();
    }
  });
});

document.getElementById('keepLatestBtn').addEventListener('click', keepOnlyLatest);

document.getElementById('postBtn').addEventListener('click', async () => {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return alert('เลือกไฟล์ก่อนครับ');

  showStatus('กำลังเตรียม...', 0);
  document.getElementById('progressBar').classList.add('show');

  let progress = 0;
  const fill = document.getElementById('progressFill');
  const timer = setInterval(() => {
    progress += Math.random() * 15;
    if (progress > 95) progress = 95;
    fill.style.width = progress + '%';
  }, 200);

  const isVideo = file.type.startsWith('video');
  const videoUrl = URL.createObjectURL(file);
  const sizeMB = (file.size / (1024 * 1024)).toFixed(1);

  setTimeout(() => {
    clearInterval(timer);
    fill.style.width = '100%';

    const now = new Date();
    const dateStr = `${now.getDate()} ก.ย. ${String(now.getFullYear()).slice(-2)}`;

    posts.unshift({
      id: Date.now().toString(),
      title: file.name.replace(/\.[^/.]+$/, ''),
      author: 'ThaiPodee Master',
      date: dateStr,
      type: isVideo ? 'video' : 'image',
      aspect: '9:16',
      source: 'ต้นฉบับ',
      size: sizeMB + ' MB',
      thumbnail: videoUrl,
      videoUrl: videoUrl,
      deleted: false
    });

    savePosts();
    renderPosts();
    renderProfilePosts();
    updatePostCount();

    showStatus('เผยแพร่สำเร็จ ✅');

    setTimeout(() => {
      document.getElementById('progressBar').classList.remove('show');
      fill.style.width = '0%';
      document.getElementById('fileInput').value = '';
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('home').classList.add('active');
    }, 1500);
  }, 2000);
});
</script>
