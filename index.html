<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THAIPODEE V2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: sans-serif; }

        /* Header */
        .header {
            position: fixed; top: 0; left: 0; right: 0; height: 50px;
            background: #000; display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; border-bottom: 1px solid #333; z-index: 100;
        }
        .title { font-size: 16px; font-weight: bold; }
        .version { font-size: 11px; color: #888; background: #222; padding: 2px 6px; border-radius: 4px; }
        .menu-btn { font-size: 24px; padding: 8px; cursor: pointer; }

        /* Video Area */
        .video-area {
            margin-top: 50px; width: 100%; height: calc(100vh - 120px);
            background: #000; display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .video-player { width: 100%; height: 100%; object-fit: contain; display: block; }
        .video-placeholder { color: #888; font-size: 16px; }
        .video-desc {
            position: absolute; bottom: 80px; left: 15px; right: 90px;
            font-size: 13px; line-height: 1.5;
            text-shadow: 0 1px 3px #000;
        }

        /* ✅ ปุ่มด้านขวา — แก้ตรงนี้โดยเฉพาะ */
        .side-buttons {
            position: fixed; right: 8px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 24px;
            z-index: 9999; /* สูงสุดแน่นอน */
        }
        .side-btn {
            width: 56px; height: 56px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5); border-radius: 50%;
            cursor: pointer;
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .side-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.95); }
        .side-icon { font-size: 24px; line-height: 1; }
        .side-label { font-size: 10px; color: #fff; margin-top: 2px; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: #000; border-top: 1px solid #333;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .nav-icon { font-size: 20px; }
        .nav-label { font-size: 11px; color: #aaa; }
        .plus-btn {
            width: 44px; height: 32px; background: #fff; border-radius: 6px;
            color: #000; font-size: 22px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }

        /* Upload Modal */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 99999; display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #111; border-radius: 12px; padding: 24px; width: 100%; max-width: 340px;
            border: 1px solid #333;
        }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .input-field {
            width: 100%; padding: 12px; margin-bottom: 12px;
            background: #222; border: 1px solid #444; border-radius: 8px;
            color: #fff; font-size: 14px;
        }
        .file-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
        .file-btn {
            padding: 10px 14px; background: #333; border: 1px solid #555;
            border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer;
        }
        .file-name { flex: 1; font-size: 13px; color: #90ee90; word-break: break-all; }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
        }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-close { background: #333; color: #fff; }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <span class="title">THAIPODEE</span>
    <span class="version">V2026</span>
    <div class="menu-btn" onclick="alert('เมนูทำงานแล้ว!')">☰</div>
</div>

<!-- Video Area -->
<div class="video-area">
    <div class="video-placeholder" id="videoPlaceholder">กด + เพื่ออัปโหลดวิดีโอ</div>
    <video class="video-player" id="videoPlayer" controls loop muted playsinline style="display:none;"></video>
    <p class="video-desc" id="videoDesc">THAIPODEE V2026 — แพลตฟอร์มตลาดโลก 🌍</p>
</div>

<!-- ✅ ปุ่มด้านขวา — กดได้แน่นอน -->
<div class="side-buttons">
    <button class="side-btn" onclick="alert('❤️ กดถูกใจแล้ว!')">
        <span class="side-icon">❤️</span>
        <span class="side-label">ถูกใจ</span>
    </button>
    <button class="side-btn" onclick="alert('💬 เปิดความคิดเห็น')">
        <span class="side-icon">💬</span>
        <span class="side-label">ความคิด</span>
    </button>
    <button class="side-btn" onclick="alert('↗️ แชร์แล้ว!')">
        <span class="side-icon">↗️</span>
        <span class="side-label">แชร์</span>
    </button>
    <button class="side-btn" onclick="alert('🛒 เข้าตะกร้าสินค้า')">
        <span class="side-icon">🛒</span>
        <span class="side-label">ตะกร้า</span>
    </button>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
    <div class="nav-item" onclick="alert('🏠 หน้าแรก')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าแรก</span>
    </div>
    <div class="nav-item" onclick="alert('🔍 ค้นหา')">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">ค้นหา</span>
    </div>
    <div class="nav-item" onclick="openUpload()">
        <div class="plus-btn">+</div>
    </div>
    <div class="nav-item" onclick="alert('💬 ข้อความ')">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
    </div>
    <div class="nav-item" onclick="alert('👤 โปรไฟล์')">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<!-- Upload Modal -->
<div class="modal" id="uploadModal">
    <div class="modal-content">
        <h3 class="modal-title">อัปโหลดวิดีโอ</h3>
        <input type="text" class="input-field" id="descInput" placeholder="คำอธิบายวิดีโอ...">
        <div class="file-row">
            <input type="file" accept="video/*" id="videoInput" style="display:none" onchange="pickFile(this)">
            <button class="file-btn" onclick="document.getElementById('videoInput').click()">เลือกไฟล์</button>
            <span class="file-name" id="fileName">ยังไม่ได้เลือก</span>
        </div>
        <button class="btn btn-primary" onclick="uploadVideo()">📤 อัปโหลด</button>
        <button class="btn btn-close" onclick="closeUpload()">ปิด</button>
    </div>
</div>

<script>
// ปิดป๊อปอัพ
window.addEventListener('beforeinstallprompt', e => e.preventDefault());

let selectedFile = null;

function openUpload() {
    document.getElementById('uploadModal').classList.add('show');
    selectedFile = null;
    document.getElementById('fileName').textContent = 'ยังไม่ได้เลือก';
    document.getElementById('descInput').value = '';
}
function closeUpload() {
    document.getElementById('uploadModal').classList.remove('show');
}
function pickFile(input) {
    if (input.files.length > 0) {
        selectedFile = input.files[0];
        document.getElementById('fileName').textContent = selectedFile.name;
    }
}
function uploadVideo() {
    if (!selectedFile) { alert('กรุณาเลือกไฟล์ก่อนครับ'); return; }
    const desc = document.getElementById('descInput').value || 'ไม่มีคำอธิบาย';
    
    const url = URL.createObjectURL(selectedFile);
    document.getElementById('videoPlaceholder').style.display = 'none';
    const player = document.getElementById('videoPlayer');
    player.src = url;
    player.style.display = 'block';
    document.getElementById('videoDesc').textContent = desc;
    
    alert('✅ อัปโหลดสำเร็จ! วิดีโอแสดงแล้วครับ');
    closeUpload();
}
</script>

</body>
</html>
