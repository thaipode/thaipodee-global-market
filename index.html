<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thaipodee Global Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    .hidden { display: none !important; }
    
    .feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; }
    .post-slide { min-height: 100vh; scroll-snap-align: start; position: relative; padding-bottom: 70px; }
    .media { width: 100%; height: calc(100vh - 70px); object-fit: contain; background: #111; }
    
    .info-left { position: absolute; bottom: 80px; left: 12px; max-width: 70%; }
    .username { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .caption { font-size: 14px; opacity: 0.9; margin-top: 4px; }
    .filename { font-size: 11px; color: #888; margin-top: 2px; }
    
    .side-menu { position: absolute; bottom: 100px; right: 12px; display: flex; flex-direction: column; gap: 24px; align-items: center; }
    .side-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .side-btn i { font-size: 26px; }
    .side-btn span { font-size: 11px; }
    
    .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
    .nav-btn i { font-size: 22px; }
    .nav-btn span { font-size: 10px; }
    .add-btn { background: #f00; width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; padding: 20px; overflow-y: auto; }
    .close-top { text-align: right; font-size: 24px; cursor: pointer; margin-bottom: 10px; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: none; border-radius: 8px; color: #fff; font-size: 15px; }
    button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; width: 100%; margin-top: 10px; }
    .btn-red { background: #f00; color: #fff; font-weight: bold; }
    .btn-red:active { background: #c00; }
    
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

<div id="feedPage">
  <div class="feed" id="feedList"></div>
  
  <div class="bottom-bar">
    <div class="nav-btn" onclick="goFeed()"><i class="fa fa-home"></i><span>หน้าแรก</span></div>
    <div class="nav-btn" onclick="goSearch()"><i class="fa fa-search"></i><span>ค้นหา</span></div>
    <div class="nav-btn add-btn" onclick="openPostBox()"><i class="fa fa-plus"></i></div>
    <div class="nav-btn" onclick="goNotify()"><i class="fa fa-bell-o"></i><span>แจ้งเตือน</span></div>
    <div class="nav-btn" onclick="goProfile()"><i class="fa fa-user-o"></i><span>ฉัน</span></div>
  </div>
</div>

<div id="postBox" class="overlay hidden">
  <div class="close-top" onclick="closePostBox()">&times;</div>
  <h2 class="text-xl font-bold mb-4">สร้างโพสต์</h2>
  
  <input type="file" id="fileChoose" accept="image/*,video/*" onchange="showPreview(this)">
  
  <div id="previewHere" class="w-full aspect-video bg-gray-900 rounded-lg flex items-center justify-center my-4">
    <span class="text-gray-400">เลือกไฟล์เพื่อดูตัวอย่าง</span>
  </div>
  
  <input type="text" id="inputName" placeholder="ชื่อผู้โพสต์" value="Thaipodee Master">
  <textarea id="inputDesc" rows="3" placeholder="คำอธิบาย..."></textarea>
  
  <button class="btn-red" onclick="doPublish()">เผยแพร่</button>
</div>

<script>
let postData = [];
let selectedFile = null;
let previewUrl = null;

// โหลดรายการโพสต์
function loadData() {
  try {
    const saved = localStorage.getItem('tpd_posts_v2');
    if (saved) postData = JSON.parse(saved);
  } catch(e) {
    postData = [];
  }
  renderFeed();
}

function saveData() {
  localStorage.setItem('tpd_posts_v2', JSON.stringify(postData));
}

// แสดงฟีด
function renderFeed() {
  const list = document.getElementById('feedList');
  list.innerHTML = '';
  
  if (postData.length === 0) {
    list.innerHTML = `
      <div class="post-slide">
        <div class="media flex items-center justify-center text-gray-400">
          <p>กดปุ่ม + เพื่อโพสต์</p>
        </div>
        <div class="info-left">
          <div class="username">Thaipodee Master</div>
          <div class="caption">ยินดีต้อนรับสู่ Thaipodee Global Market</div>
        </div>
        <div class="side-menu">
          <div class="side-btn"><i class="fa fa-user-circle-o"></i><span>โปรไฟล์</span></div>
          <div class="side-btn"><i class="fa fa-heart-o"></i><span>0</span></div>
          <div class="side-btn"><i class="fa fa-comment-o"></i><span>0</span></div>
          <div class="side-btn"><i class="fa fa-bookmark-o"></i><span>บันทึก</span></div>
          <div class="side-btn"><i class="fa fa-share-alt"></i><span>แชร์</span></div>
          <div class="side-btn"><i class="fa fa-ellipsis-h"></i><span>อื่นๆ</span></div>
        </div>
      </div>`;
    return;
  }
  
  postData.forEach((p, idx) => {
    const slide = document.createElement('div');
    slide.className = 'post-slide';
    
    let mediaHtml = '';
    if (p.previewUrl) {
      if (p.isVideo) {
        mediaHtml = `<video class="media" controls autoplay muted loop playsinline src="${p.previewUrl}"></video>`;
      } else {
        mediaHtml = `<img class="media" src="${p.previewUrl}" alt="">`;
      }
    } else {
      mediaHtml = `<div class="media flex items-center justify-center text-gray-400">
        <i class="fa ${p.isVideo ? 'fa-film' : 'fa-picture-o'}" style="font-size:48px;"></i>
      </div>`;
    }
    
    slide.innerHTML = `
      ${mediaHtml}
      <div class="info-left">
        <div class="username">${p.name}</div>
        <div class="filename">📄 ${p.filename}</div>
        <div class="caption">${p.desc || ''}</div>
      </div>
      <div class="side-menu">
        <div class="side-btn"><i class="fa fa-user-circle-o"></i><span>โปรไฟล์</span></div>
        <div class="side-btn"><i class="fa fa-heart-o"></i><span>0</span></div>
        <div class="side-btn"><i class="fa fa-comment-o"></i><span>0</span></div>
        <div class="side-btn"><i class="fa fa-bookmark-o"></i><span>บันทึก</span></div>
        <div class="side-btn"><i class="fa fa-share-alt"></i><span>แชร์</span></div>
        <div class="side-btn" onclick="if(confirm('ลบโพสต์นี้?')){postData.splice(${idx},1);saveData();renderFeed();}"><i class="fa fa-ellipsis-h"></i><span>อื่นๆ</span></div>
      </div>
    `;
    list.appendChild(slide);
  });
}

// เปิด-ปิด กล่องโพสต์
function openPostBox() {
  selectedFile = null;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = null;
  
  document.getElementById('fileChoose').value = '';
  document.getElementById('inputDesc').value = '';
  document.getElementById('previewHere').innerHTML = '<span class="text-gray-400">เลือกไฟล์เพื่อดูตัวอย่าง</span>';
  document.getElementById('postBox').classList.remove('hidden');
}

function closePostBox() {
  document.getElementById('postBox').classList.add('hidden');
  if (previewUrl) {
    URL.revokeObjectURL(previewUrl);
    previewUrl = null;
  }
}

// แสดงตัวอย่างอย่างปลอดภัย
function showPreview(input) {
  if (!input.files || !input.files[0]) return;
  
  selectedFile = input.files[0];
  
  // ใช้ URL.createObjectURL แทน base64 — ประหยัดหน่วยความจำ ไม่พัง
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(selectedFile);
  
  const box = document.getElementById('previewHere');
  if (selectedFile.type.startsWith('video/')) {
    box.innerHTML = `<video src="${previewUrl}" class="w-full h-full object-contain" autoplay muted loop playsinline controls></video>`;
  } else {
    box.innerHTML = `<img src="${previewUrl}" class="w-full h-full object-contain" alt="">`;
  }
}

// ✅ เผยแพร่ — ไม่แปลงไฟล์ ไม่ทำให้หน่วยความจำเต็ม
function doPublish() {
  if (!selectedFile) {
    alert('⚠️ กรุณาเลือกไฟล์ก่อนกดเผยแพร่');
    return;
  }
  
  const name = document.getElementById('inputName').value.trim() || 'Thaipodee Master';
  const desc = document.getElementById('inputDesc').value.trim();
  
  // บันทึกแค่ที่อยู่อ้างอิง ไม่บรรจุเนื้อหาลงตัวแปร
  postData.unshift({
    id: Date.now(),
    filename: selectedFile.name,
    filesize: (selectedFile.size / 1048576).toFixed(2) + ' MB',
    mimeType: selectedFile.type,
    isVideo: selectedFile.type.startsWith('video/'),
    previewUrl: previewUrl, // ใช้ URL อ้างอิง ไม่ใช่ base64
    name: name,
    desc: desc,
    time: new Date().toLocaleString('th-TH')
  });
  
  // ตัดการเชื่อมโยงก่อนบันทึก เพื่อไม่ให้เก็บไฟล์จริงลง localStorage
  const toSave = postData.map(p => ({
    id: p.id,
    filename: p.filename,
    filesize: p.filesize,
    mimeType: p.mimeType,
    isVideo: p.isVideo,
    name: p.name,
    desc: p.desc,
    time: p.time
  }));
  
  localStorage.setItem('tpd_posts_v2', JSON.stringify(toSave));
  
  previewUrl = null; // ปลดล้างหน่วยความจำ
  selectedFile = null;
  
  closePostBox();
  renderFeed();
  
  alert('✅ เผยแพร่สำเร็จ!\n📄 ไฟล์: ' + selectedFile?.name || 'ไม่ระบุชื่อ');
}

// เมนูด้านล่าง
function goFeed() { window.scrollTo({top:0,behavior:'smooth'}); }
function goSearch() { alert('🔍 ค้นหา — จะพัฒนาต่อครับ'); }
function goNotify() { alert('🔔 แจ้งเตือน — จะพัฒนาต่อครับ'); }
function goProfile() { alert('👤 โปรไฟล์ — จะพัฒนาต่อครับ'); }

document.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
