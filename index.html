<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;background:#000;overflow:hidden;
  position:fixed;top:0;left:0;right:0;bottom:0;
  font-family:-apple-system,system-ui,sans-serif;color:#fff;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

.top-nav{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0));left:12px;right:12px;
  display:flex;align-items:flex-start;justify-content:space-between;z-index:100;
}
.live-btn{font-size:16px;display:flex;align-items:center;gap:4px;margin-top:6px;cursor:pointer;}
.live-icon{font-size:20px;}

.nav-center-group{
  display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px;
}
.nav-tabs{display:flex;gap:20px;font-size:15px;}
.nav-tab{opacity:0.7;cursor:pointer;}
.nav-tab.active{opacity:1;font-weight:bold;border-bottom:2px solid #fff;padding-bottom:2px;}

/* ✅ ปุ่มสีแดง กดตรงๆ ติดตั้งได้เลย */
.install-btn-red{
  font-size:14px;color:#fff;background:#ff0050;border:none;
  cursor:pointer;padding:8px 20px;border-radius:25px;line-height:1;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(255,0,80,.4);
  transition:all 0.3s ease;
  display:block;
}
.install-btn-red:hover{transform:scale(1.05);}
.install-btn-red:active{transform:scale(0.97);}
.install-btn-red.installed{background:#00c853;box-shadow:none;}
.install-btn-red.hidden{display:none !important;}

.search-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.version-text{font-size:9px;color:#666;line-height:1;}
.search-icon{font-size:20px;cursor:pointer;}

.video-container{
  position:fixed;inset:0;background:#000;
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;z-index:1;
}
.video-container video{width:100%;height:100%;object-fit:cover;display:block;}

.tap-layer{position:fixed;inset:0;z-index:3;cursor:pointer;background:transparent;}
.ui-layer{position:fixed;inset:0;z-index:4;pointer-events:none;}
.ui-layer > *{pointer-events:auto}

.bottom-info{position:absolute;left:16px;bottom:85px;right:100px;text-shadow:0 1px 3px rgba(0,0,0,.8);}
.author{font-size:15px;font-weight:bold;margin-bottom:6px;}
.caption{font-size:13px;line-height:1.5;margin-bottom:6px;}
.music{font-size:12px;display:flex;align-items:center;gap:6px;}

/* ✅ ไอคอนด้านขวา ครบ 6 ตัว เรียงถูกต้อง */
.side-icons{position:absolute;right:12px;bottom:100px;display:flex;flex-direction:column;gap:22px;align-items:center;}
.side-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.side-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.side-count{font-size:11px;}

.profile-wrap{position:relative;}
.profile-avatar{width:44px;height:44px;border-radius:50%;border:2px solid #fff;overflow:hidden;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.plus-badge{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;background:#ff0050;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}

/* ตัวที่ 6: แผ่นเสียงอยู่ล่างสุด */
.disc-icon{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#666,#222);display:flex;align-items:center;justify-content:center;animation:spin 3s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.nav-bar{position:absolute;bottom:0;left:0;right:0;height:65px;display:flex;justify-content:space-around;align-items:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0));background:#000;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:#999;font-size:10px;cursor:pointer;}
.nav-item.active{color:#fff}
.nav-icon{font-size:22px}
.nav-center-plus{width:52px;height:38px;background:#ff0050;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;}

.file-input{display:none;}

<body>

<div class="top-nav">
  <div class="live-btn"><span class="live-icon">📺</span><span>ไลฟ์</span></div>
  <div class="nav-center-group">
    <div class="nav-tabs">
      <span class="nav-tab">นครราชสีมา</span>
      <span class="nav-tab">เพื่อน</span>
      <span class="nav-tab">กำลังติดตาม</span>
      <span class="nav-tab active">สำหรับคุณ</span>
    </div>
    <button class="install-btn-red" id="installBtn">📲 ติดตั้งแอปเลย</button>
  </div>
  <div class="search-wrap">
    <span class="version-text">v1145</span>
    <span class="search-icon">🔍</span>
  </div>
</div>

<div class="video-container">
  <video id="mainVideo" playsinline webkit-playsinline loop autoplay muted></video>
</div>

<div class="tap-layer" id="tapLayer"></div>

<div class="ui-layer">
  <div class="bottom-info">
    <div class="author">@ThaiPodee</div>
    <div class="caption">แตะจอเล่น/หยุด — กดปุ่มแดงติดตั้งเลย</div>
    <div class="music"><span>♪</span><span>เสียงประกอบ</span></div>
  </div>

  <!-- ✅ เรียงลำดับ 6 ตัวถูกต้อง: โปรไฟล์ — ถูกใจ — คอมเมนต์ — บันทึก — แชร์ — แผ่นเสียง -->
  <div class="side-icons">
    <div class="side-item"><div class="profile-wrap"><div class="profile-avatar"><img src="logo.png?v=1145" alt="โปรไฟล์"></div><div class="plus-badge">+</div></div></div>
    <div class="side-item"><div class="side-icon">❤️</div><div class="side-count">0</div></div>
    <div class="side-item"><div class="side-icon">💬</div><div class="side-count">0</div></div>
    <div class="side-item"><div class="side-icon">⬜</div><div class="side-count">บันทึก</div></div>
    <div class="side-item" id="shareBtn"><div class="side-icon">↗️</div><div class="side-count">แชร์</div></div>
    <div class="side-item"><div class="disc-icon">🎵</div></div>
  </div>

  <div class="nav-bar">
    <div class="nav-item active"><span class="nav-icon">🏠</span><span>หน้าหลัก</span></div>
    <div class="nav-item"><span class="nav-icon">🛒</span><span>ร้านค้า</span></div>
    <div class="nav-center-plus" id="uploadTrigger">+</div>
    <div class="nav-item"><span class="nav-icon">💬</span><span>ข้อความ</span></div>
    <div class="nav-item"><span class="nav-icon">👤</span><span>โปรไฟล์</span></div>
  </div>
  <input type="file" id="fileInput" accept="video/*" class="file-input">
</div>

<script>
const CURRENT_VERSION = 'v1145';
const STORAGE_KEY = 'thaipodee_last_version';

const video = document.getElementById('mainVideo');
const tapLayer = document.getElementById('tapLayer');
const fileInput = document.getElementById('fileInput');
const uploadTrigger = document.getElementById('uploadTrigger');
const installBtn = document.getElementById('installBtn');
const shareBtn = document.getElementById('shareBtn');

// ✅ ตรวจสอบอัปเดตอัตโนมัติ
const lastVersion = localStorage.getItem(STORAGE_KEY);
if (lastVersion && lastVersion !== CURRENT_VERSION) {
  localStorage.setItem(STORAGE_KEY, CURRENT_VERSION);
  window.location.reload(true);
} else {
  localStorage.setItem(STORAGE_KEY, CURRENT_VERSION);
}

// ตรวจว่าเปิดจากไอคอนแอปจริงหรือไม่
function isAppInstalled() {
  return (window.matchMedia('(display-mode: standalone)').matches) ||
         (window.navigator.standalone === true);
}

// ถ้าติดตั้งแล้ว → ซ่อนปุ่ม
if (isAppInstalled()) {
  installBtn.classList.add('hidden');
}

// เล่น/หยุด วิดีโอ
tapLayer.addEventListener('click', () => video.paused ? video.play() : video.pause());

// อัปโหลดวิดีโอ
uploadTrigger.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  video.src = URL.createObjectURL(f); video.load(); video.play();
});

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!isAppInstalled()) {
    installBtn.style.display = 'block';
  }
});

// ✅ กดปุ่มแดง → ติดตั้งเลย
installBtn.addEventListener('click', async () => {
  if (isAppInstalled()) {
    installBtn.classList.add('hidden');
    return;
  }

  if (!deferredPrompt) {
    alert('📱 กดเมนู ⋮ มุมขวาบน → เพิ่มหน้าจอหลัก → ติดตั้ง');
    return;
  }

  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;

  if (outcome === 'accepted') {
    installBtn.textContent = '✅ ติดตั้งแล้ว';
    installBtn.classList.add('installed');
    setTimeout(() => installBtn.classList.add('hidden'), 1200);
  }
  deferredPrompt = null;
});

// ตรวจซ้ำเมื่อโหลดเสร็จ
window.addEventListener('load', () => {
  setTimeout(() => {
    if (isAppInstalled()) installBtn.classList.add('hidden');
  }, 300);
});

// แชร์
shareBtn.addEventListener('click', async () => {
  const shareData = {
    title: `ThaiPodee ${CURRENT_VERSION}`,
    text: 'กดลิงก์ → กดปุ่มแดง ติดตั้งแอปเลย → มีไอคอนที่หน้าจอ',
    url: window.location.href
  };
  if (navigator.share) {
    try { await navigator.share(shareData); }
    catch { await navigator.clipboard.writeText(window.location.href); alert('คัดลอกลิงก์แล้ว ✅'); }
  } else {
    await navigator.clipboard.writeText(window.location.href);
    alert('คัดลอกลิงก์แล้ว ✅');
  }
});
</script>

</body>
