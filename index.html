<html lang="th">
<head>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>ThaiPodee v1161</title>

<link rel="apple-touch-icon" href="thaipodee_logo_icon.png?v=1161">
<link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22ThaiPodee%22%2C%22short_name%22%3A%22ThaiPodee%22%2C%22start_url%22%3A%22.%2F%3Fv%3D1161%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22thaipodee_logo_icon.png%3Fv%3D1161%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100vw;height:100vh;
  background:#000;
  overflow:hidden;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  font-family:-apple-system,sans-serif;color:#fff;
  padding:0;
  margin:0;
}

.top-nav{
  position:fixed;
  top:calc(12px + env(safe-area-inset-top,0px));
  left:12px;right:12px;
  display:flex;align-items:flex-start;justify-content:space-between;
  z-index:100;
}
.live-btn{font-size:16px;display:flex;align-items:center;gap:4px;margin-top:6px;cursor:pointer;}
.live-icon{font-size:20px;}

.nav-center-group{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px;}
.nav-tabs{display:flex;gap:16px;font-size:14px;}
.nav-tab{opacity:0.7;cursor:pointer;}
.nav-tab.active{opacity:1;font-weight:bold;border-bottom:2px solid #fff;padding-bottom:2px;}

.install-btn-red{
  font-size:14px;color:#fff;background:#ff0050;border:none;
  cursor:pointer;padding:10px 24px;border-radius:25px;
  font-weight:bold;box-shadow:0 2px 8px rgba(255,0,80,.4);
  transition:all .3s ease;
}
.install-btn-red.installed{background:#00c853}
.install-btn-red.hidden{display:none !important}

.search-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.version-text{font-size:9px;color:#666}
.search-icon{font-size:20px;cursor:pointer;}

/* ✅ เต็มจอ ไม่มีแถบดำ — ขอบชิดจอทุกด้าน */
.video-container{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:#000;
  display:flex;align-items:center;justify-content:center;
  z-index:1;
  margin:0;padding:0;
}
.video-container video{
  width:100vw;
  height:100vh;
  object-fit:cover; /* เต็มจอ ไม่มีขอบดำ */
  display:block;
  transition:all .3s ease;
  border:none;
  outline:none;
}
.video-container.contain-mode video{
  object-fit:contain;
}

/* ✅ เส้นเวลาขยับขึ้น ไม่บัง */
.progress-bar-wrap{
  position:absolute;
  bottom:80px;
  left:12px;right:12px;
  height:5px;
  background:rgba(255,255,255,.25);
  border-radius:3px;
  cursor:pointer;
  z-index:5;
  opacity:0;visibility:hidden;
  transition:all .3s ease;
}
.video-container.playing .progress-bar-wrap{
  opacity:1;visibility:visible;
}
.progress-bar{
  position:relative;height:100%;background:#fff;width:0%;
  border-radius:3px;transition:width .1s linear;
}
.progress-dot{
  position:absolute;right:-10px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;background:#fff;border-radius:50%;
  box-shadow:0 0 6px rgba(0,0,0,.5);
}

.zoom-controls{
  position:absolute;bottom:110px;right:16px;z-index:6;
  display:flex;flex-direction:column;gap:8px;
  opacity:0;visibility:hidden;transition:all .3s ease;
}
.video-container.playing .zoom-controls{
  opacity:1;visibility:visible;
}
.zoom-btn{
  width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);
  color:#fff;border:1px solid rgba(255,255,255,.3);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.zoom-btn:active{transform:scale(.95)}

.tap-layer{position:fixed;inset:0;z-index:3;cursor:pointer;background:transparent;}
.ui-layer{position:fixed;inset:0;z-index:4;pointer-events:none;}
.ui-layer > *{pointer-events:auto;}

.bottom-info{position:absolute;left:16px;bottom:130px;right:100px;text-shadow:0 1px 3px rgba(0,0,0,.8);z-index:4;}
.author{font-size:15px;font-weight:bold;margin-bottom:6px}
.caption{font-size:13px;margin-bottom:6px}
.music{font-size:12px;display:flex;align-items:center;gap:6px}

/* ไอคอนขวา 6 ตัว — ไม่มีปุ่มสี่เหลี่ยมเพิ่ม */
.side-icons{
  position:absolute;right:12px;bottom:160px;
  display:flex;flex-direction:column;gap:22px;
  align-items:center;z-index:4;
}
.side-item{
  display:flex;flex-direction:column;
  align-items:center;gap:4px;
  cursor:pointer;
}
.side-icon{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
}
.side-count{font-size:11px}

.profile-wrap{position:relative}
.profile-avatar{width:44px;height:44px;border-radius:50%;border:2px solid #fff;overflow:hidden;background:#222}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.plus-badge{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;background:#ff0050;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}

.disc-icon{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#666,#222);display:flex;align-items:center;justify-content:center;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ✅ แถบล่างชิดขอบ ไม่มีพื้นที่ดำเกิน */
.nav-bar{
  position:absolute;
  bottom:0;left:0;right:0;
  height:65px;
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));
  background:#000;
  z-index:10;
  margin:0;
}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:#999;font-size:10px;cursor:pointer}
.nav-item.active{color:#fff}
.nav-icon{font-size:22px}
.nav-center-plus{width:52px;height:38px;background:#ff0050;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px}

.file-input{display:none}
</style>
</head>
<body>

<div class="top-nav">
  <div class="live-btn"><span class="live-icon">📺</span><span>ไลฟ์</span></div>
  <div class="nav-center-group">
    <div class="nav-tabs">
      <span class="nav-tab">นครราชสีมา</span>
      <span class="nav-tab">เพื่อน</span>
      <span class="nav-tab">กำลังติดตาม</span>
      <span class="nav-tab active">สำหรับคุณ</span>
    </div>
    <button class="install-btn-red" id="installBtn">📲 ติดตั้งแอปเลย</button>
  </div>
  <div class="search-wrap">
    <span class="version-text">v1161</span>
    <span class="search-icon">🔍</span>
  </div>
</div>

<div class="video-container" id="videoContainer">
  <video id="mainVideo" playsinline webkit-playsinline loop autoplay></video>

  <div class="progress-bar-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar">
      <div class="progress-dot"></div>
    </div>
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="zoomInBtn" title="ขยายเต็มจอ">⛶</button>
    <button class="zoom-btn" id="zoomOutBtn" title="ย่อให้พอดี">⊡</button>
  </div>
</div>

<div class="tap-layer" id="tapLayer"></div>

<div class="ui-layer">
  <div class="bottom-info">
    <div class="author">@ThaiPodee</div>
    <div class="caption">แตะจอตรงไหนก็ได้ → เล่น/หยุด</div>
    <div class="music"><span>♪</span><span>เสียงประกอบ</span></div>
  </div>

  <!-- 6 ไอคอนพอดี ไม่มีปุ่มสี่เหลี่ยมเพิ่ม -->
  <div class="side-icons">
    <div class="side-item">
      <div class="profile-wrap">
        <div class="profile-avatar">
          <img src="thaipodee_logo_icon.png?v=1161" alt="ThaiPodee" onerror="this.parentElement.innerHTML='TP';this.parentElement.style.display='flex';this.parentElement.style.alignItems='center';this.parentElement.style.justifyContent='center';this.parentElement.style.fontWeight='bold'">
        </div>
        <div class="plus-badge">+</div>
      </div>
    </div>
    <div class="side-item"><div class="side-icon">❤️</div><div class="side-count">0</div></div>
    <div class="side-item"><div class="side-icon">💬</div><div class="side-count">0</div></div>
    <div class="side-item"><div class="side-icon">⬜</div><div class="side-count">บันทึก</div></div>
    <div class="side-item" id="shareBtn"><div class="side-icon">↗️</div><div class="side-count">แชร์</div></div>
    <div class="side-item"><div class="disc-icon">🎵</div></div>
  </div>

  <div class="nav-bar">
    <div class="nav-item active"><span class="nav-icon">🏠</span><span>หน้าหลัก</span></div>
    <div class="nav-item"><span class="nav-icon">🛒</span><span>ร้านค้า</span></div>
    <div class="nav-center-plus" id="uploadBtn">+</div>
    <div class="nav-item"><span class="nav-icon">💬</span><span>ข้อความ</span></div>
    <div class="nav-item"><span class="nav-icon">👤</span><span>โปรไฟล์</span></div>
  </div>
  <input type="file" id="fileInput" accept="video/*" class="file-input">
</div>

<script>
const CURRENT_VERSION = 'v1161';
const STORAGE_KEY = 'thaipodee_last_version';

const video = document.getElementById('mainVideo');
const videoContainer = document.getElementById('videoContainer');
const tapLayer = document.getElementById('tapLayer');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const installBtn = document.getElementById('installBtn');
const shareBtn = document.getElementById('shareBtn');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const progressBar = document.getElementById('progressBar');
const progressWrap = document.getElementById('progressWrap');

const lastVersion = localStorage.getItem(STORAGE_KEY);
if (lastVersion && lastVersion !== CURRENT_VERSION) {
  localStorage.setItem(STORAGE_KEY, CURRENT_VERSION);
  window.location.reload(true);
} else {
  localStorage.setItem(STORAGE_KEY, CURRENT_VERSION);
}

function isAppInstalled() {
  return (window.matchMedia('(display-mode: standalone)').matches) ||
         (window.navigator.standalone === true);
}
if (isAppInstalled()) installBtn.classList.add('hidden');

function updateProgress() {
  if (!video.duration) return;
  const pct = (video.currentTime / video.duration) * 100;
  progressBar.style.width = pct + '%';
}
video.addEventListener('timeupdate', updateProgress);
video.addEventListener('loadedmetadata', updateProgress);

let isDragging = false;
function seekTo(e) {
  if (!video.duration) return;
  const rect = progressWrap.getBoundingClientRect();
  const clientX = e.clientX || (e.touches && e.touches[0].clientX);
  const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  video.currentTime = pct * video.duration;
}
progressWrap.addEventListener('mousedown', (e) => { isDragging = true; seekTo(e); });
document.addEventListener('mousemove', (e) => { if (isDragging) seekTo(e); });
document.addEventListener('mouseup', () => { isDragging = false; });
progressWrap.addEventListener('touchstart', (e) => { isDragging = true; seekTo(e); });
document.addEventListener('touchmove', (e) => { if (isDragging) seekTo(e); });
document.addEventListener('touchend', () => { isDragging = false; });

function togglePlay() {
  if (video.paused) {
    video.play();
    videoContainer.classList.add('playing');
  } else {
    video.pause();
  }
}
tapLayer.addEventListener('click', togglePlay);

zoomInBtn.addEventListener('click', () => videoContainer.classList.add('contain-mode'));
zoomOutBtn.addEventListener('click', () => videoContainer.classList.remove('contain-mode'));

uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  video.src = URL.createObjectURL(f);
  video.load();
  video.play();
  videoContainer.classList.add('playing');
});

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!isAppInstalled()) installBtn.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
  if (isAppInstalled()) {
    installBtn.classList.add('hidden');
    return;
  }
  if (!deferredPrompt) {
    alert('📱 กดเมนู ⋮ → เพิ่มหน้าจอหลัก → ติดตั้ง');
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    installBtn.textContent = '✅ ติดตั้งแล้ว';
    installBtn.classList.add('installed');
    setTimeout(() => installBtn.classList.add('hidden'), 1200);
  }
  deferredPrompt = null;
});

shareBtn.addEventListener('click', async () => {
  const shareData = {
    title: `ThaiPodee ${CURRENT_VERSION}`,
    text: 'v1161 — เต็มจอ ไม่มีแถบดำรอบ ๆ',
    url: window.location.href
  };
  if (navigator.share) {
    try { await navigator.share(shareData); }
    catch { await navigator.clipboard.writeText(window.location.href); alert('คัดลอกลิงก์แล้ว ✅'); }
  } else {
    await navigator.clipboard.writeText(window.location.href);
    alert('คัดลอกลิงก์แล้ว ✅');
  }
});
</script>

</body>
</html>
