<!-- ===================================================== -->
<!-- Thaipodee Global Market -->
<!-- ลำดับที่ 36 | 16 กันยายน 2569 เวลา 21:00 -->
<!-- ✅ แต่ละเครื่องแก้ชื่อ+รูปโปรไฟล์ของตัวเองได้ -->
<!-- ✅ ปิดเปิดใหม่ไม่หาย (บันทึกในเครื่อง) -->
<!-- ✅ ไม่กระทบข้อมูลคนอื่น -->
<!-- ===================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Thaipodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        html, body {
            height: 100vh; height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background: #000;
            color: #fff;
            position: fixed;
            inset: 0;
        }

        .page {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh; height: 100dvh;
            overflow: hidden;
        }
        .page.active { display: block; }

        /* ===== วิดีโอ/รูป เต็มจอ ไม่มีแถบดำ ===== */
        .media-area {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh; height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }
        .media-area video, .media-area img {
            width: 100vw;
            height: 100vh; height: 100dvh;
            object-fit: cover;
            display: block;
        }
        .empty-hint {
            text-align: center;
            color: #888;
            line-height: 2;
            padding: 20px;
        }

        /* ===== ข้อมูลซ้ายล่าง — ปรับระยะไม่ให้ถูกตัด ===== */
        .info-left {
            position: absolute;
            left: 16px;
            bottom: calc(90px + env(safe-area-inset-bottom, 0px));
            right: 90px;
            z-index: 10;
            display: none;
        }
        .username { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .caption { font-size: 13px; color: #fff; margin-bottom: 4px; }
        .music-line { font-size: 12px; color: #ddd; display: flex; align-items: center; gap: 4px; margin-top: 4px; }

        /* ===== เมนูด้านขวา ===== */
        .menu-right {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
            z-index: 20;
        }
        .avatar-wrap {
            position: relative;
            margin-bottom: 2px;
            cursor: pointer;
        }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5a623, #f76b1c);
            border: 2px solid #fff;
            background-size: cover;
            background-position: center;
        }
        .avatar-plus {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 16px;
            height: 16px;
            background: #ff2442;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
        .menu-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }
        .icon { font-size: 26px; }
        .stat-num { font-size: 11px; color: #fff; }

        /* ===== เมนูล่าง — ปรับระยะรองรับทุกจอ ===== */
        .nav-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(60px + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #000;
            border-top: 1px solid #222;
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 70px;
            cursor: pointer;
        }
        .nav-icon { font-size: 22px; }
        .nav-label { font-size: 10px; color: #888; margin-top: 2px; }
        .nav-item.active .nav-label { color: #fff; font-weight: 600; }

        .plus-center {
            position: relative;
            width: 70px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .plus-btn {
            width: 48px;
            height: 32px;
            background: #fff;
            border-radius: 6px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .plus-btn::before, .plus-btn::after {
            content: '';
            position: absolute;
            background: #000;
        }
        .plus-btn::before { width: 20px; height: 2px; }
        .plus-btn::after { width: 2px; height: 20px; }
        .plus-overlay { position: absolute; inset: -10px; cursor: pointer; }
        .file-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        /* ===== หน้าเลือกเพลง ===== */
        .sound-page {
            background: #000;
            padding: 20px 16px;
            min-height: 100vh; min-height: 100dvh;
            padding-bottom: 90px;
            display: none;
        }
        .back-btn { font-size: 18px; cursor: pointer; margin-bottom: 20px; display: inline-block; }
        .section-title { font-size: 14px; font-weight: 600; margin: 20px 0 12px; color: #aaa; }
        .audio-picker {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .audio-name { font-size: 12px; color: #888; margin-top: 4px; }
        .hidden-input { display: none; }
        .post-btn {
            background: #ff2442;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-size: 15px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        /* ===== หน้าแก้ไขโปรไฟล์ ===== */
        .profile-page {
            background: #000;
            padding: 20px 16px;
            min-height: 100vh; min-height: 100dvh;
            padding-bottom: 90px;
            display: none;
        }
        .profile-avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 20px auto;
            background: linear-gradient(135deg, #f5a623, #f76b1c);
            border: 3px solid #fff;
            background-size: cover;
            background-position: center;
            cursor: pointer;
        }
        .profile-label {
            font-size: 13px; color: #aaa; margin-top: 20px; margin-bottom: 6px; display: block;
        }
        .profile-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a2e;
            color: #fff;
            font-size: 15px;
        }
        .save-btn {
            background: #ff2442;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-size: 15px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
        }
    </style>
</head>
<body>

<!-- หน้าแรก -->
<div id="page-feed" class="page active">
    <div class="media-area" id="media-area">
        <div class="empty-hint">
            <div style="font-size:24px;margin-bottom:10px;">☁️</div>
            กดปุ่ม + เพื่อเลือกวิดีโอ/รูป<br>
            แสดงผลจากไฟล์ในเครื่อง
        </div>
    </div>

    <div class="info-left" id="info-area">
        <div class="username" id="display-username">@thaipodee_master</div>
        <div class="caption">ทดสอบ ✨</div>
        <div class="music-line" id="music-line">🎵 เลือกเพลงจากในเครื่อง</div>
    </div>

    <div class="menu-right">
        <div class="menu-btn" id="avatar-btn">
            <div class="avatar-wrap">
                <div class="avatar" id="avatar-icon"></div>
                <div class="avatar-plus">+</div>
            </div>
        </div>
        <div class="menu-btn"><span class="icon">❤️</span><span class="stat-num">0</span></div>
        <div class="menu-btn"><span class="icon">💬</span><span class="stat-num">0</span></div>
        <div class="menu-btn"><span class="icon">⭐</span><span class="stat-num">0</span></div>
        <div class="menu-btn"><span class="icon">↗️</span><span class="stat-num">0</span></div>
        <div class="menu-btn"><span class="icon">🎵</span><span class="stat-num">0</span></div>
    </div>
</div>

<!-- หน้าเลือกเพลง -->
<div id="page-sound" class="page sound-page">
    <span class="back-btn" id="back-to-feed">← กลับ</span>
    <h3>เลือกเพลง/เสียง</h3>
    <div class="section-title">จากไฟล์ในเครื่อง</div>
    <label class="audio-picker">
        <span style="font-size:22px">🎵</span>
        <div>
            <div>แตะเลือกไฟล์เสียง</div>
            <div class="audio-name" id="audio-filename">ยังไม่ได้เลือก</div>
        </div>
        <input type="file" accept="audio/*" id="audio-input" class="hidden-input">
    </label>
    <button class="post-btn" id="confirm-btn">ยืนยัน → แสดงผล</button>
</div>

<!-- หน้าแก้ไขโปรไฟล์ ✅ เพิ่มใหม่ -->
<div id="page-profile" class="page profile-page">
    <span class="back-btn" id="back-from-profile">← กลับ</span>
    <h3 style="text-align:center;">แก้ไขโปรไฟล์</h3>
    
    <label style="display:block;cursor:pointer;">
        <div class="profile-avatar-preview" id="profile-avatar-preview"></div>
        <p style="text-align:center; color:#888; font-size:12px;">แตะเปลี่ยนรูปโปรไฟล์</p>
        <input type="file" accept="image/*" id="avatar-upload" class="hidden-input">
    </label>

    <label class="profile-label">ชื่อผู้ใช้</label>
    <input type="text" id="username-input" class="profile-input" placeholder="ใส่ชื่อของคุณ">

    <button class="save-btn" id="save-profile">บันทึกโปรไฟล์</button>
</div>

<!-- เมนูล่าง -->
<div class="nav-bottom">
    <div class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าหลัก</span>
    </div>
    <div class="nav-item">
        <span class="nav-icon">🛒</span>
        <span class="nav-label">ตลาด</span>
    </div>

    <div class="plus-center">
        <div class="plus-btn">
            <label class="plus-overlay">
                <input type="file" accept="video/*,image/*" id="media-input" class="file-input">
            </label>
        </div>
    </div>

    <div class="nav-item">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
    </div>
    <div class="nav-item" id="profile-nav-btn">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<script>
// ===== ข้อมูลโปรไฟล์ — บันทึกในเครื่อง =====
const STORAGE_KEYS = {
    username: 'thaipodee_username',
    avatar: 'thaipodee_avatar'
};

// โหลดค่าที่บันทึกไว้เมื่อเปิดหน้า
function loadProfile() {
    const savedName = localStorage.getItem(STORAGE_KEYS.username);
    const savedAvatar = localStorage.getItem(STORAGE_KEYS.avatar);
    
    if (savedName) {
        document.getElementById('display-username').textContent = savedName;
        document.getElementById('username-input').value = savedName.replace('@', '');
    }
    if (savedAvatar) {
        document.getElementById('avatar-icon').style.backgroundImage = `url(${savedAvatar})`;
        document.getElementById('profile-avatar-preview').style.backgroundImage = `url(${savedAvatar})`;
    }
}

// บันทึกโปรไฟล์
function saveProfile(username, avatarDataUrl) {
    const fullName = username.startsWith('@') ? username : '@' + username;
    localStorage.setItem(STORAGE_KEYS.username, fullName);
    if (avatarDataUrl) {
        localStorage.setItem(STORAGE_KEYS.avatar, avatarDataUrl);
    }
    loadProfile(); // อัปเดตทันที
}

// เปลี่ยนหน้า
function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
}

// ข้อมูลวิดีโอ/เพลง
let selectedMedia = null, selectedAudio = null;
let mediaObjectURL = null, audioObjectURL = null;
let mediaType = null;

// เปิดหน้าโปรไฟล์
document.getElementById('avatar-btn').addEventListener('click', () => {
    showPage('page-profile');
});
document.getElementById('profile-nav-btn').addEventListener('click', () => {
    showPage('page-profile');
});
document.getElementById('back-from-profile').addEventListener('click', () => {
    showPage('page-feed');
});

// อัปโหลดรูปโปรไฟล์
document.getElementById('avatar-upload').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
        const dataUrl = evt.target.result;
        document.getElementById('profile-avatar-preview').style.backgroundImage = `url(${dataUrl})`;
        // เก็บไว้ชั่วคราว จะบันทึกตอนกดปุ่ม
        window._tempAvatar = dataUrl;
    };
    reader.readAsDataURL(file);
});

// บันทึกโปรไฟล์
document.getElementById('save-profile').addEventListener('click', () => {
    const nameInput = document.getElementById('username-input').value.trim();
    if (!nameInput) return alert('กรุณาใส่ชื่อครับ');
    
    saveProfile(nameInput, window._tempAvatar || null);
    window._tempAvatar = null;
    
    alert('บันทึกเรียบร้อย ✅\nชื่อของคุณจะอยู่ในเครื่องนี้ตลอดไป');
    showPage('page-feed');
});

// เลือกวิดีโอ/รูป
document.getElementById('media-input').addEventListener('change', e => {
    selectedMedia = e.target.files[0];
    if (!selectedMedia) return;
    mediaType = selectedMedia.type.startsWith('video') ? 'video' : 'image';
    showPage('page-sound');
});

// เลือกเพลง
document.getElementById('audio-input').addEventListener('change', e => {
    selectedAudio = e.target.files[0];
    document.getElementById('audio-filename').textContent = selectedAudio ? selectedAudio.name : 'ยังไม่ได้เลือก';
});

// ยืนยันแสดงผล
document.getElementById('confirm-btn').addEventListener('click', () => {
    if (!selectedMedia) return alert('เลือกไฟล์ก่อนครับ');
    
    if (mediaObjectURL) URL.revokeObjectURL(mediaObjectURL);
    if (audioObjectURL) URL.revokeObjectURL(audioObjectURL);
    
    mediaObjectURL = URL.createObjectURL(selectedMedia);
    if (selectedAudio) {
        audioObjectURL = URL.createObjectURL(selectedAudio);
        document.getElementById('music-line').textContent = '🎵 ' + selectedAudio.name;
    } else {
        document.getElementById('music-line').textContent = '🎵 ไม่ได้เลือกเพลง';
    }
    
    const area = document.getElementById('media-area');
    area.innerHTML = '';
    
    if (mediaType === 'video') {
        const vid = document.createElement('video');
        vid.src = mediaObjectURL;
        vid.loop = true;
        vid.playsInline = true;
        vid.controls = true;
        vid.style.width = '100vw';
        vid.style.height = '100vh';
        vid.style.height = '100dvh';
        vid.style.objectFit = 'cover';
        if (audioObjectURL) {
            const aud = document.createElement('audio');
            aud.src = audioObjectURL;
            aud.loop = true;
            aud.controls = true;
            aud.style.position = 'absolute';
            aud.style.bottom = '10px';
            aud.style.left = '10px';
            vid.onplay = () => aud.play().catch(()=>{});
            vid.onpause = () => aud.pause();
            document.body.appendChild(aud);
        }
        area.appendChild(vid);
        vid.play().catch(()=>{});
    } else {
        const img = document.createElement('img');
        img.src = mediaObjectURL;
        img.style.width = '100vw';
        img.style.height = '100vh';
        img.style.height = '100dvh';
        img.style.objectFit = 'cover';
        area.appendChild(img);
        if (audioObjectURL) {
            const aud = document.createElement('audio');
            aud.src = audioObjectURL;
            aud.loop = true;
            aud.controls = true;
            aud.style.position = 'absolute';
            aud.style.bottom = '10px';
            aud.style.left = '10px';
            document.body.appendChild(aud);
            aud.play().catch(()=>{});
        }
    }
    
    document.getElementById('info-area').style.display = 'block';
    showPage('page-feed');
    
    mediaInput.value = '';
    audioInput.value = '';
    document.getElementById('audio-filename').textContent = 'ยังไม่ได้เลือก';
    selectedMedia = selectedAudio = null;
});

document.getElementById('back-to-feed').addEventListener('click', () => {
    selectedMedia = selectedAudio = null;
    mediaInput.value = '';
    audioInput.value = '';
    document.getElementById('audio-filename').textContent = 'ยังไม่ได้เลือก';
    showPage('page-feed');
});

// โหลดโปรไฟล์ทันทีที่เปิด
loadProfile();

console.log('✅ Thaipodee Global Market — พร้อมใช้งาน');
console.log('✅ โปรไฟล์บันทึกอัตโนมัติในเครื่อง — ปิดเปิดไม่หาย');
</script>
</body>
</html>
