<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ไทยโพธิ์ดี Market Online Platform v2026</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Noto Sans Thai, sans-serif; }
    body { background: #000; color: #fff; height: 100vh; overflow: hidden; }
    .app-container { position: relative; width: 100%; height: 100vh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }
    
    .header { position: relative; flex-shrink: 0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
    .logo-area { display: flex; flex-direction: column; align-items: center; }
    .logo-th { font-size: 18px; font-weight: 700; color: #FFD700; }
    .logo-en { font-size: 11px; color: #aaa; margin-top: 2px; }
    .icon-btn { font-size: 22px; cursor: pointer; }
    
    /* ===== ส่วนสำคัญ — ปรับให้ฟีดวิดีโอเหลือที่ว่างสำหรับเมนูล่าง ===== */
    .video-feed { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; position: relative; }
    .video-feed::-webkit-scrollbar { display: none; }
    .video-card { height: 100vh; position: relative; scroll-snap-align: start; }
    video { width: 100%; height: 100%; object-fit: cover; background: #111; }
    
    .empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .empty-state h3 { font-size: 18px; margin-bottom: 8px; }
    .empty-state p { color: #aaa; }
    
    .video-info { position: absolute; bottom: 100px; left: 16px; right: 70px; }
    .creator-name { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
    .video-desc { font-size: 13px; color: #eee; line-height: 1.4; margin-bottom: 8px; }
    .sound-tag { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #ddd; }
    
    .side-actions { position: absolute; right: 12px; bottom: 110px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .action-icon { font-size: 28px; }
    .action-count { font-size: 11px; color: #fff; }
    .profile-circle { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #333; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .music-disc { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(45deg, #FFD700, #FF6B00); display: flex; align-items: center; justify-content: center; font-size: 20px; animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* ===== เมนูล่าง — ล็อกตำแหน่ง 5 ปุ่ม แสดงชัดเจนเสมอ ===== */
    .bottom-nav { flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; padding: 8px 0 24px; background: rgba(0,0,0,0.9); border-top: 1px solid #222; position: relative; z-index: 50; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
    .nav-icon { font-size: 24px; }
    .nav-label { font-size: 10px; color: #aaa; }
    .nav-item.active .nav-label { color: #fff; }
    .create-btn { width: 44px; height: 32px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .create-btn::before { content: ''; position: absolute; width: 100%; height: 2px; background: #FF0000; transform: rotate(45deg); }
    .create-btn::after { content: ''; position: absolute; width: 2px; height: 100%; background: #FF0000; transform: rotate(45deg); }
    
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .modal.show { display: flex; }
    .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
    .upload-area { width: 100%; max-width: 360px; height: 200px; border: 2px dashed #666; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; cursor: pointer; }
    .upload-area:hover { border-color: #FFD700; }
    .upload-icon { font-size: 40px; color: #888; }
    .file-input { display: none; }
    .input-field { width: 100%; max-width: 360px; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; margin-bottom: 12px; font-size: 14px; }
    .btn { padding: 12px 24px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; max-width: 360px; }
    .btn-primary { background: #FFD700; color: #000; margin-bottom: 10px; }
    .btn-secondary { background: #333; color: #fff; }
    .preview-video { width: 100%; max-width: 360px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .progress-bar { width: 100%; max-width: 360px; height: 6px; background: #333; border-radius: 3px; margin-bottom: 16px; display: none; }
    .progress-fill { height: 100%; background: #FFD700; width: 0%; border-radius: 3px; transition: width 0.3s; }
    .version-tag { position: absolute; top: 12px; right: 12px; font-size: 11px; color: #888; z-index: 101; }
  </style>
</head>
<body>

<div class="app-container">
  <span class="version-tag">v2026</span>
  
  <div class="header">
    <div class="icon-btn" onclick="toggleProfile()">☰</div>
    <div class="logo-area">
      <div class="logo-th">ไทยโพธิ์ดี</div>
      <div class="logo-en">Thaipodee Market Online Platform</div>
    </div>
    <div class="icon-btn" onclick="searchContent()">🔍</div>
  </div>

  <div class="video-feed" id="videoFeed">
    <div class="empty-state">
      <h3>ยังไม่มีวิดีโอ</h3>
      <p>เป็นคนแรกที่อัปโหลดวิดีโอ!</p>
    </div>
  </div>

  <!-- ===== เมนูล่าง — แสดงทันที ไม่ซ่อน! ===== -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">หน้าแรก</span>
    </div>
    <div class="nav-item" onclick="switchTab('discover')">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">สำรวจ</span>
    </div>
    <div class="nav-item" onclick="openUploadModal()">
      <div class="create-btn"></div>
    </div>
    <div class="nav-item" onclick="switchTab('inbox')">
      <span class="nav-icon">💬</span>
      <span class="nav-label">ข้อความ</span>
    </div>
    <div class="nav-item" onclick="switchTab('profile')">
      <span class="nav-icon">👤</span>
      <span class="nav-label">โปรไฟล์</span>
    </div>
  </div>

  <div class="modal" id="uploadModal">
    <div class="modal-title">อัปโหลดวิดีโอ</div>
    <div class="upload-area" onclick="document.getElementById('videoFile').click()">
      <span class="upload-icon">📹</span>
      <span>แตะเพื่อเลือกวิดีโอ</span>
      <input type="file" id="videoFile" class="file-input" accept="video/*" onchange="handleFileSelect(event)">
    </div>
    <video id="previewVideo" class="preview-video" controls muted></video>
    <input type="text" id="videoDesc" class="input-field" placeholder="คำอธิบายวิดีโอ...">
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <button class="btn btn-primary" onclick="uploadVideo()">อัปโหลด</button>
    <button class="btn btn-secondary" onclick="closeUploadModal()">ยกเลิก</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCt-wPPDeopLnjCv4QQvdYLQ2uG_VxWYtE",
    authDomain: "thaipodee-market.firebaseapp.com",
    projectId: "thaipodee-market",
    storageBucket: "thaipodee-market.firebasestorage.app",
    messagingSenderId: "802626775100",
    appId: "1:802626775100:web:8b2f2914532d2c9e9c3b39"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();
  
  let selectedFile = null;

  async function loadVideos() {
    const feed = document.getElementById('videoFeed');
    const snapshot = await db.collection('videos').orderBy('createdAt', 'desc').get();
    
    if (snapshot.empty) {
      feed.innerHTML = `<div class="empty-state"><h3>ยังไม่มีวิดีโอ</h3><p>เป็นคนแรกที่อัปโหลดวิดีโอ!</p></div>`;
      return;
    }
    
    feed.innerHTML = '';
    snapshot.docs.forEach(doc => {
      const v = doc.data();
      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <video src="${v.videoUrl}" autoplay loop muted playsinline></video>
        <div class="video-info">
          <div class="creator-name">@${v.creator || 'thaipodee_user'}</div>
          <div class="video-desc">${v.description || ''}</div>
          <div class="sound-tag">🎵 เสียงต้นฉบับ - ไทยโพธิ์ดี</div>
        </div>
        <div class="side-actions">
          <div class="action-btn" onclick="likeVideo('${doc.id}')"><span class="action-icon">❤️</span><span class="action-count">${v.likes || 0}</span></div>
          <div class="action-btn"><span class="action-icon">💬</span><span class="action-count">${v.comments || 0}</span></div>
          <div class="action-btn"><span class="action-icon">↗️</span><span class="action-count">แชร์</span></div>
          <div class="action-btn"><div class="profile-circle">👤</div></div>
          <div class="music-disc">🎵</div>
        </div>
      `;
      feed.appendChild(card);
    });
  }

  function openUploadModal() { document.getElementById('uploadModal').classList.add('show'); }
  function closeUploadModal() { 
    document.getElementById('uploadModal').classList.remove('show'); 
    document.getElementById('previewVideo').style.display = 'none';
    document.getElementById('videoDesc').value = '';
    selectedFile = null;
  }
  function handleFileSelect(e) {
    selectedFile = e.target.files[0];
    if (selectedFile) {
      const preview = document.getElementById('previewVideo');
      preview.src = URL.createObjectURL(selectedFile);
      preview.style.display = 'block';
    }
  }

  async function uploadVideo() {
    if (!selectedFile) { alert('กรุณาเลือกวิดีโอ'); return; }
    const desc = document.getElementById('videoDesc').value || 'วิดีโอจาก ไทยโพธิ์ดี Market Online Platform';
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'กำลังอัปโหลด...';
    document.getElementById('progressBar').style.display = 'block';
    
    const fileRef = storage.ref(`videos/${Date.now()}_${selectedFile.name}`);
    const uploadTask = fileRef.put(selectedFile);
    
    uploadTask.on('state_changed', 
      (snap) => {
        const pct = (snap.bytesTransferred / snap.totalBytes) * 100;
        document.getElementById('progressFill').style.width = pct + '%';
      },
      (err) => { alert('อัปโหลดล้มเหลว: ' + err.message); btn.disabled = false; },
      async () => {
        const videoUrl = await uploadTask.snapshot.ref.getDownloadURL();
        await db.collection('videos').add({
          description: desc,
          videoUrl,
          creator: 'thaipodee_user',
          likes: 0,
          comments: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert('อัปโหลดสำเร็จ! ✅');
        closeUploadModal();
        btn.disabled = false;
        btn.textContent = 'อัปโหลด';
        document.getElementById('progressBar').style.display = 'none';
        loadVideos();
      }
    );
  }

  function likeVideo(id) {
    db.collection('videos').doc(id).update({ likes: firebase.firestore.FieldValue.increment(1) });
  }
  function switchTab(tab) { console.log('Switch:', tab); }
  function toggleProfile() { console.log('Profile'); }
  function searchContent() { console.log('Search'); }

  document.addEventListener('DOMContentLoaded', loadVideos);
</script>

</body>
</html>
