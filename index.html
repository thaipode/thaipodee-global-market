<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThaiPodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100vh; overflow: hidden; background: #000; color: #fff; }

        /* ===== พื้นที่ตรงกลาง ===== */
        .center-area {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #000;
        }
        .center-text {
            color: #777; font-size: 14px; text-align: center;
        }

        /* ===== ซ้ายล่าง: ชื่อ + คำอธิบาย + เสียง ===== */
        .info-left {
            position: absolute; left: 16px; bottom: 80px; right: 90px;
            z-index: 10;
        }
        .acc-name {
            font-weight: 700; font-size: 15px; margin-bottom: 4px;
        }
        .desc-text { font-size: 13px; margin-bottom: 4px; color: #ddd; }
        .music-row { font-size: 12px; color: #bbb; display: flex; align-items: center; gap: 6px; margin-top: 4px; }

        /* ===== เมนูด้านขวา — 6 อันครบ ===== */
        .menu-right {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 24px; z-index: 10; align-items: center;
        }
        .menu-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .avatar-box { position: relative; width: 44px; height: 44px; }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff;
            object-fit: cover; background: #555;
        }
        .follow-plus {
            position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 18px; background: #ff2442; border-radius: 50%;
            font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        .icon { font-size: 28px; line-height: 1; }
        .num { font-size: 11px; margin-top: 2px; color: #ccc; }

        /* ===== เมนูด้านล่าง — 5 อันครบ ===== */
        .nav-bottom {
            position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 8px 12px;
            z-index: 20;
            background: transparent;
        }
        .nav-col { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; min-width: 60px; }
        .nav-icon { font-size: 22px; }
        .nav-label { font-size: 10px; color: #aaa; }
        .upload-btn-box {
            width: 44px; height: 30px; background: #fff; border-radius: 6px;
            position: relative; cursor: pointer;
        }
        .upload-btn-box::before {
            content: ''; position: absolute; width: 18px; height: 2px; background: #000;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .upload-btn-box::after {
            content: ''; position: absolute; width: 2px; height: 18px; background: #000;
            left: 50%; top: 50%; transform: translate(-50%, -50%);
        }
        .badge {
            position: absolute; top: 0; right: 4px;
            background: #ff2442; color: #fff; font-size: 9px;
            min-width: 14px; height: 14px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<!-- ❌ ไม่มีแถบอะไรข้างบนเลย — ตรงตามที่ต้องการ -->

<!-- พื้นที่ตรงกลาง -->
<div class="center-area">
    <p class="center-text">กดอัปโหลดเพื่อเริ่มสร้างสรรค์</p>
</div>

<!-- ซ้ายล่าง ครบถ้วน -->
<div class="info-left">
    <div class="acc-name">@ThaiPodee_Master ✨</div>
    <div class="desc-text">ยินดีต้อนรับสู่ ThaiPodee</div>
    <div class="music-row">🎵 เสียงต้นฉบับ — ThaiPodee Original</div>
</div>

<!-- ขวา 6 ปุ่ม ครบตรงตำแหน่ง -->
<div class="menu-right">
    <div class="menu-btn">
        <div class="avatar-box">
            <img class="avatar" src="https://picsum.photos/seed/thaipodee2026/100/100" alt="โปรไฟล์">
            <span class="follow-plus">+</span>
        </div>
    </div>
    <div class="menu-btn">
        <span class="icon">🤍</span>
        <span class="num">0</span>
    </div>
    <div class="menu-btn">
        <span class="icon">💬</span>
        <span class="num">0</span>
    </div>
    <div class="menu-btn">
        <span class="icon">⭐</span>
        <span class="num">บันทึก</span>
    </div>
    <div class="menu-btn">
        <span class="icon">↗️</span>
        <span class="num">แชร์</span>
    </div>
    <div class="menu-btn">
        <span class="icon">🎵</span>
    </div>
</div>

<!-- ล่าง 5 ปุ่ม ครบตรงตำแหน่ง -->
<div class="nav-bottom">
    <div class="nav-col">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าหลัก</span>
    </div>
    <div class="nav-col">
        <span class="nav-icon">🛒</span>
        <span class="nav-label">ตลาด</span>
    </div>
    <div class="nav-col">
        <div class="upload-btn-box"></div>
        <span class="nav-label">อัปโหลด</span>
    </div>
    <div class="nav-col">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
        <span class="badge">99+</span>
    </div>
    <div class="nav-col">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

</body>
</html>
