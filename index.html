<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThaiPodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100vh; overflow: hidden; background: #000; color: #fff; position: fixed; inset: 0; width: 100%; }

        /* === วิดีโอเต็มจอถึงขอบทุกด้าน ไม่มีแถบดำ === */
        .video-wrap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        #main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* === ไม่มีแถบดำเลย ลบออกหมดแล้ว === */

        /* === ข้อมูลซ้าย ลอยอยู่บน — ขยับขึ้น พ้นแถบล่าง === */
        .info-left {
            position: absolute;
            left: 16px;
            bottom: 80px;
            right: 90px;
            z-index: 10;
        }
        .acc-name {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .desc-text {
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 6px;
            color: #eee;
        }
        .music-row {
            font-size: 12px;
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* === เมนูขวา ลอยอยู่บน — ขยับขึ้น พ้นแถบล่าง === */
        .menu-right {
            position: absolute;
            right: 10px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            z-index: 10;
        }
        .menu-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }
        .avatar-box {
            position: relative;
            width: 42px;
            height: 42px;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
        }
        .follow-plus {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 18px;
            background: #ff2442;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon { font-size: 26px; }
        .num { font-size: 11px; }
        .music-disc {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00c6ff, #ff0080);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 3s linear infinite;
            font-size: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* === แถบเมนูล่าง — อยู่ด้านล่างสุด วิดีโอลอยทับได้ ไม่มีพื้นหลังบัง === */
        .nav-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 8px 10px 12px;
            z-index: 20;
            /* ไม่มีพื้นหลังสีดำ — วิดีโอโชว์ข้างหลังได้ */
            background: transparent;
        }
        .nav-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }
        .nav-icon { font-size: 22px; }
        .nav-label { font-size: 10px; }
        .nav-add {
            width: 46px;
            height: 30px;
            background: #fff;
            border-radius: 6px;
            position: relative;
            margin-bottom: 4px;
        }
        .nav-add::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 2px;
            background: #000;
            top: 14px;
            left: 14px;
        }
        .nav-add::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 18px;
            background: #000;
            left: 22px;
            top: 6px;
        }
        .badge {
            position: absolute;
            top: -2px;
            right: -6px;
            background: #ff2442;
            color: #fff;
            font-size: 9px;
            min-width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<!-- วิดีโอเต็มจอ ไม่มีแถบดำบัง -->
<div class="video-wrap" onclick="toggleAudio()">
    <video id="main-video" autoplay loop muted playsinline>
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
    </video>
</div>

<!-- ข้อมูลซ้าย ลอยอยู่บน -->
<div class="info-left">
    <div class="acc-name">@ThaiPodee_Official</div>
    <div class="desc-text">ยินดีต้อนรับสู่ ThaiPodee Global Market — แพลตฟอร์มของคนไทย ✨</div>
    <div class="music-row">🎵 เสียงต้นฉบับ • ThaiPodee Original</div>
</div>

<!-- เมนูขวา ลอยอยู่บน -->
<div class="menu-right">
    <div class="menu-btn">
        <div class="avatar-box">
            <img class="avatar" src="https://picsum.photos/seed/thaipodee/100/100">
            <span class="follow-plus">+</span>
        </div>
    </div>
    <div class="menu-btn" onclick="toggleLike()">
        <span class="icon" id="likeIcon">🤍</span>
        <span class="num">0</span>
    </div>
    <div class="menu-btn">
        <span class="icon">💬</span>
        <span class="num">0</span>
    </div>
    <div class="menu-btn">
        <span class="icon">⭐</span>
        <span class="num">บันทึก</span>
    </div>
    <div class="menu-btn">
        <span class="icon">➡️</span>
        <span class="num">แชร์</span>
    </div>
    <div class="menu-btn">
        <div class="music-disc">🎵</div>
    </div>
</div>

<!-- แถบล่าง ไม่มีพื้นหลังดำ วิดีโอโชว์ข้างหลังได้เต็มที่ -->
<div class="nav-bottom">
    <div class="nav-col">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าหลัก</span>
    </div>
    <div class="nav-col">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">ค้นหา</span>
    </div>
    <div class="nav-col">
        <div class="nav-add"></div>
        <span class="nav-label">อัปโหลด</span>
    </div>
    <div class="nav-col">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
        <span class="badge">99+</span>
    </div>
    <div class="nav-col">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<script>
function toggleAudio() {
    const vid = document.getElementById('main-video');
    vid.muted = !vid.muted;
    document.getElementById('likeIcon').textContent = vid.muted ? '🤍' : '❤️';
}
function toggleLike() {
    const icon = document.getElementById('likeIcon');
    icon.textContent = icon.textContent === '❤️' ? '🤍' : '❤️';
}
</script>

</body>
</html>
