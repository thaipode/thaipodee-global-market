<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiPodee Market</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html,body { height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
.page { position: absolute; inset: 0; z-index: 1; overflow-y: auto; }
.page.hidden { display: none; }
.media { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: #000; }
.media video, .media img { max-width: 100%; max-height: 100%; object-fit: contain; }
.ui { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.ui * { pointer-events: auto; }
.top { position: absolute; top: 40px; left: 16px; }
.username { font-weight: bold; font-size: 15px; }
.desc { font-size: 12px; margin-top: 4px; opacity: 0.9; }
.sound { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.right { position: absolute; right: 12px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; }
.icon { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.icon i { font-size: 24px; }
.icon span { font-size: 11px; }
.bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 65px; display: flex; justify-content: space-around; align-items: center; background: #000; z-index: 30; }
.nav { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.nav i { font-size: 22px; }
.nav span { font-size: 10px; margin-top: 2px; }
.btn { background: linear-gradient(90deg, #ff2e55, #ff6b4a); border: none; padding: 12px; border-radius: 6px; color: white; font-weight: bold; width: 100%; cursor: pointer; font-size: 15px; }
.inp { background: #222; border: none; padding: 12px; border-radius: 6px; color: white; width: 100%; margin-bottom: 10px; font-size: 14px; }
.progress { height: 6px; background: #333; border-radius: 3px; margin: 15px 0; display: none; }
.prog-bar { height: 100%; background: #ff2e55; border-radius: 3px; width: 0%; transition: width 0.2s; }
.status { text-align: center; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; margin: 10px 0; white-space: pre-wrap; }
.status.error { color: #ff6b4a; background: rgba(255,46,85,0.15); }
.status.success { color: #4ade80; background: rgba(74,222,128,0.15); }
.status.info { color: #facc15; background: rgba(250,204,21,0.15); }
.post-item { border-bottom: 1px solid #222; padding: 12px; margin-bottom: 8px; cursor: pointer; }
.post-item:hover { background: #111; }
.post-item:last-child { border-bottom: none; }
</style>
</head>
<body>

<div id="page1" class="page">
  <div class="media" id="mediaArea">
    <div style="text-align:center;color:#888;padding-top:40px;">
      <i class="fa-solid fa-video fa-2x"></i>
      <p style="margin-top:10px;">กดปุ่ม + เพื่ออัปโหลด<br>หรือกดที่โพสต์ในโปรไฟล์เพื่อแสดง</p>
    </div>
  </div>
  <div class="ui">
    <div class="top" id="postInfo" style="display:none;">
      <p class="username">ThaiPodee Master</p>
      <p class="desc" id="dispDesc"></p>
      <div class="sound">
        <i class="fa-solid fa-music fa-xs"></i>
        <span id="dispSound" style="font-size:12px;"></span>
      </div>
    </div>
    <div class="right">
      <div class="icon" data-goto="pageProfile"><i class="fa-solid fa-user"></i></div>
      <div class="icon"><i class="fa-solid fa-heart"></i><span id="likeCount">0</span></div>
      <div class="icon"><i class="fa-solid fa-comment"></i><span>0</span></div>
      <div class="icon"><i class="fa-solid fa-bookmark"></i><span>บันทึก</span></div>
      <div class="icon"><i class="fa-solid fa-share"></i><span>แชร์</span></div>
    </div>
    <div class="bottom">
      <div class="nav" data-goto="page1"><i class="fa-solid fa-home"></i></div>
      <div class="nav"><i class="fa-solid fa-magnifying-glass"></i></div>
      <div class="nav" id="uploadBtn" style="background:linear-gradient(90deg,#ff2e55,#ff6b4a);width:45px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;">
        <i class="fa-solid fa-plus" style="font-size:16px;"></i>
      </div>
      <div class="nav"><i class="fa-solid fa-message"></i></div>
      <div class="nav" data-goto="pageProfile"><i class="fa-solid fa-user"></i></div>
    </div>
  </div>
</div>

<div id="pageUpload" class="page hidden">
  <div style="padding:20px;">
    <button onclick="show('page1')" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;margin-bottom:15px;">
      <i class="fa-solid fa-arrow-left"></i> กลับ
    </button>
    <h3 style="margin-bottom:15px;">อัปโหลดสื่อ</h3>
    <input type="file" id="fileInp" accept="video/*,image/*" class="inp">
    <input type="text" class="inp" id="titleInp" placeholder="ชื่อสินค้า/คำอธิบาย...">
    <input type="text" class="inp" id="soundInp" placeholder="เสียงประกอบ...">
    <button class="btn" id="pubBtn">เผยแพร่ขึ้นคลาวด์</button>
    <div id="progWrap" class="progress"><div id="progBar" class="prog-bar"></div></div>
    <p id="statusMsg" class="status" style="display:none;"></p>
  </div>
</div>

<div id="pageProfile" class="page hidden">
  <div style="padding:20px;">
    <button onclick="show('page1')" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;">
      <i class="fa-solid fa-arrow-left"></i> กลับ
    </button>
    <div style="text-align:center; margin:20px 0;">
      <div style="width:80px;height:80px;background:#333;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;">
        <i class="fa-solid fa-user fa-2x"></i>
      </div>
      <h2 style="margin-top:10px;">ThaiPodee Master</h2>
      <p style="color:#888;">@thaipodee_master</p>
      <div style="display:flex;justify-content:center;gap:30px;margin-top:15px;">
        <div style="text-align:center;"><strong id="postCount">0</strong><br><small>โพสต์</small></div>
        <div style="text-align:center;"><strong>0</strong><br><small>ผู้ติดตาม</small></div>
        <div style="text-align:center;"><strong>0</strong><br><small>กำลังติดตาม</small></div>
      </div>
    </div>
    <hr style="border:none;border-top:1px solid #333;margin:15px 0;">
    <div id="postList"></div>
    <p id="emptyMsg" style="text-align:center;color:#888;">ยังไม่มีโพสต์</p>
  </div>
</div>

<script>
const CLOUD_NAME = 'orjpnytt';
const UPLOAD_PRESET = 'thaipodee';

let file, type, cloudUrl = '';
let currentPost = null;
const mediaArea = document.getElementById('mediaArea');
let posts = JSON.parse(localStorage.getItem('thaiPodeePosts') || '[]');
renderPosts();

function show(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if (id === 'pageUpload') {
    document.getElementById('statusMsg').style.display = 'none';
    document.getElementById('progWrap').style.display = 'none';
  }
}

function showPost(post) {
  currentPost = post;
  cloudUrl = post.url;
  type = post.type;
  updateMainDisplay(post.title, post.sound);
  show('page1');
}

document.querySelectorAll('[data-goto]').forEach(b => 
  b.onclick = () => show(b.dataset.goto)
);
document.getElementById('uploadBtn').onclick = () => show('pageUpload');

document.getElementById('fileInp').onchange = e => {
  file = e.target.files[0];
  if (!file) return;
  type = file.type.startsWith('video') ? 'video' : 'image';
  const tempUrl = URL.createObjectURL(file);
  mediaArea.innerHTML = '';
  if (type === 'video') {
    const v = document.createElement('video');
    v.src = tempUrl; v.controls = true; v.autoplay = true; v.loop = true; v.muted = true;
    mediaArea.appendChild(v);
  } else {
    const img = document.createElement('img');
    img.src = tempUrl; mediaArea.appendChild(img);
  }
};

document.getElementById('pubBtn').onclick = () => {
  if (!file) return showStatus('⚠️ เลือกไฟล์ก่อน', 'error');
  
  const statusMsg = document.getElementById('statusMsg');
  const progWrap = document.getElementById('progWrap');
  const progBar = document.getElementById('progBar');
  
  progWrap.style.display = 'block';
  progBar.style.width = '0%';
  showStatus('⏳ กำลังส่งขึ้นคลาวด์...', 'info');
  
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', UPLOAD_PRESET);
  
  const xhr = new XMLHttpRequest();
  xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, true);
  
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      progBar.style.width = pct + '%';
      showStatus(`⏳ กำลังส่ง... ${pct}%`, 'info');
    }
  };
  
  xhr.onload = () => {
    progWrap.style.display = 'none';
    if (xhr.status === 200) {
      try {
        const data = JSON.parse(xhr.responseText);
        cloudUrl = data.secure_url;
        
        const title = document.getElementById('titleInp').value || 'ไม่มีชื่อ';
        const sound = document.getElementById('soundInp').value || 'เสียงต้นฉบับ';
        
        const newPost = {
          url: cloudUrl, 
          type: type, 
          title: title, 
          sound: sound,
          time: new Date().toLocaleString('th-TH')
        };
        
        posts.unshift(newPost);
        localStorage.setItem('thaiPodeePosts', JSON.stringify(posts));
        
        currentPost = newPost;
        updateMainDisplay(title, sound);
        showStatus('✅ อัปโหลดสำเร็จ!', 'success');
        
        file = null;
        document.getElementById('fileInp').value = '';
        document.getElementById('titleInp').value = '';
        document.getElementById('soundInp').value = '';
        
        renderPosts();
        setTimeout(() => show('page1'), 1500);
      } catch (err) {
        showStatus('❌ อ่านข้อมูลไม่ได้', 'error');
      }
    } else {
      showStatus(`❌ ไม่สำเร็จ\nโค้ด: ${xhr.status}`, 'error');
      console.log('Error:', xhr.responseText);
    }
  };
  
  xhr.onerror = () => {
    progWrap.style.display = 'none';
    showStatus('❌ ไม่เชื่อมต่อ', 'error');
  };
  
  xhr.send(formData);
};

function showStatus(text, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = text;
  el.className = `status ${type}`;
  el.style.display = 'block';
}

function updateMainDisplay(title, sound) {
  document.getElementById('postInfo').style.display = 'block';
  document.getElementById('dispDesc').textContent = title;
  document.getElementById('dispSound').textContent = sound;
  mediaArea.innerHTML = '';
  
  if (!cloudUrl) {
    mediaArea.innerHTML = '<div style="text-align:center;color:#888;"><i class="fa-solid fa-image fa-2x"></i><p style="margin-top:10px;">ไม่มีรูป</p></div>';
    return;
  }
  
  if (type === 'video') {
    const v = document.createElement('video');
    v.src = cloudUrl; 
    v.controls = true; 
    v.autoplay = true; 
    v.loop = true;
    v.muted = true;
    v.onerror = () => {
      mediaArea.innerHTML += `<p style="color:red;">❌ โหลดวิดีโอไม่ได้: ${cloudUrl}</p>`;
    };
    mediaArea.appendChild(v);
  } else {
    const img = document.createElement('img');
    img.src = cloudUrl;
    img.onerror = () => {
      mediaArea.innerHTML += `<p style="color:red;">❌ โหลดรูปไม่ได้: ${cloudUrl}</p>`;
    };
    mediaArea.appendChild(img);
  }
}

function renderPosts() {
  const list = document.getElementById('postList');
  document.getElementById('postCount').textContent = posts.length;
  
  if (posts.length === 0) {
    list.innerHTML = '';
    document.getElementById('emptyMsg').style.display = 'block';
    return;
  }
  
  document.getElementById('emptyMsg').style.display = 'none';
  list.innerHTML = posts.map((p, i) => `
    <div class="post-item" data-index="${i}">
      <strong>${p.title}</strong><br>
      <small style="color:#888;">${p.time}</small><br>
      <small style="color:#aaa;">🎵 ${p.sound}</small>
    </div>
  `).join('');
  
  document.querySelectorAll('.post-item').forEach(item => {
    item.onclick = () => {
      const idx = parseInt(item.dataset.index);
      showPost(posts[idx]);
    };
  });
}
</script>
</body>
</html>
