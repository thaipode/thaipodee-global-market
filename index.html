   อัปเดต: 29 กันยายน 2569 19:40 น.
   --------------------------------------------------------------
   ปัญหา: มีแถบดำด้านล่าง วิดีโอไม่เต็มจอ
   แก้ไข: ปรับขนาดวิดีโอให้เต็มพื้นที่ จัดกึ่งกลาง ลดแถบดำ
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff; font-family: sans-serif;
  }
  .version-tag {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.6); color: #fff;
    font-size: 13px; padding: 4px 10px; border-radius: 12px;
    z-index: 100;
  }
  #container {
    width: 100%; height: 100vh; overflow: hidden; position: relative;
  }
  #videoWrapper {
    width: 100%; height: 100%; transition: transform 0.15s ease-out;
  }
  .video-slide {
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  video {
    width: 100%; height: 100%;
    object-fit: cover; /* เต็มจอพอดี ตัดขอบนิดหน่อยไม่ให้มีช่องว่าง */
    background: #000;
  }
  .side-icons {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 20px; z-index: 90;
    align-items: center;
  }
  .icon-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: transparent; border: none; color: #fff;
    font-size: 24px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    display: flex; justify-content: space-around; align-items: center;
    z-index: 99;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-btn {
    background: none; border: none; color: #fff; font-size: 22px;
    cursor: pointer; padding: 6px 12px;
  }
  .nav-main {
    width: 56px; height: 56px; border-radius: 50%;
    background: #ff0000; display: flex; align-items: center;
    justify-content: center; transform: translateY(-10px);
    font-size: 28px; border: none; cursor: pointer;
  }
  #fileInput { display: none; }
</style>
</head>
<body>

<input type="file" id="fileInput" accept="video/*">

<div id="container">
  <div class="version-tag">v1085</div>

  <div id="videoWrapper"></div>

  <div class="side-icons">
    <button class="icon-btn">👤</button>
    <button class="icon-btn">❤️</button>
    <button class="icon-btn">💬</button>
    <button class="icon-btn">🔁</button>
    <button class="icon-btn">⬆️</button>
    <button class="icon-btn">📦</button>
    <button class="icon-btn">⋮</button>
  </div>
</div>

<script>
const container = document.getElementById('container');
const wrapper = document.getElementById('videoWrapper');
const fileInput = document.getElementById('fileInput');
let videos = [];
let currentIndex = 0;
let startY = 0;
let isDragging = false;
let offsetY = 0;
let soundUnlocked = false;

function unlockSound() {
  if (soundUnlocked) return;
  document.querySelectorAll('video').forEach(vid => {
    vid.muted = false;
    vid.play().catch(() => {});
  });
  soundUnlocked = true;
}

function goToSlide(index) {
  if (!videos || videos.length === 0) return;
  if (index < 0) index = 0;
  if (index >= videos.length) index = videos.length - 1;
  currentIndex = index;
  wrapper.style.transform = `translateY(-${currentIndex * 100}vh)`;
  updatePlayState();
}

function updatePlayState() {
  document.querySelectorAll('video').forEach((vid, idx) => {
    if (idx === currentIndex) {
      vid.muted = !soundUnlocked;
      vid.play().catch(() => {});
    } else {
      vid.pause();
      vid.currentTime = 0;
    }
  });
}

container.addEventListener('click', unlockSound);
container.addEventListener('touchstart', unlockSound);

if (container) {
  container.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    isDragging = true;
    offsetY = 0;
  });
  container.addEventListener('touchmove', e => {
    if (!isDragging) return;
    offsetY = e.touches[0].clientY - startY;
    wrapper.style.transform = `translateY(calc(-${currentIndex * 100}vh + ${offsetY * 0.3}px))`;
  });
  container.addEventListener('touchend', () => {
    if (!isDragging) return;
    isDragging = false;
    if (offsetY < -60 && currentIndex < videos.length - 1) goToSlide(currentIndex + 1);
    else if (offsetY > 60 && currentIndex > 0) goToSlide(currentIndex - 1);
    else goToSlide(currentIndex);
  });
}

async function loadVideos() {
  videos = [
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' }
  ];
  renderVideos();
  goToSlide(0);
}

function renderVideos() {
  wrapper.innerHTML = '';
  videos.forEach(v => {
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    slide.innerHTML = `<video src="${v.src}" loop playsinline preload="auto" ${soundUnlocked ? '' : 'muted'}></video>`;
    wrapper.appendChild(slide);
  });
  addBottomNav();
}

function addBottomNav() {
  const nav = document.createElement('nav');
  nav.className = 'bottom-nav';
  nav.innerHTML = `
    <button class="nav-btn">🏠</button>
    <button class="nav-btn">🔍</button>
    <button class="nav-btn nav-main" id="uploadBtn">+</button>
    <button class="nav-btn">📦</button>
    <button class="nav-btn">👤</button>
  `;
  document.body.appendChild(nav);

  document.getElementById('uploadBtn').addEventListener('click', () => {
    fileInput.click();
  });

  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    videos.unshift({ src: url });
    renderVideos();
    goToSlide(0);
  });
}

document.addEventListener('DOMContentLoaded', loadVideos);
</script>

</body>
</html>
