<script>
const DB_NAME = 'ThaiPodeeDB';
let videoList = [];
let currentIndex = 0;
let deferredPrompt = null; // เก็บคำสั่งติดตั้งไว้
let isAppInstalled = false; // เช็คว่าติดตั้งแล้วหรือยัง

// เช็คว่าติดตั้งแล้วหรือยัง
function checkInstalled() {
  // ถ้าเปิดในโหมดแอปอยู่แล้ว = ติดตั้งแล้ว
  if (window.matchMedia('(display-mode: standalone)').matches || 
      window.navigator.standalone === true) {
    isAppInstalled = true;
    return true;
  }
  return false;
}

// แสดง/ซ่อนแถบติดตั้ง
function updateInstallBar() {
  const bar = document.getElementById('installBar');
  if (isAppInstalled) {
    bar.classList.remove('show');
    bar.classList.add('hiding');
    // ซ่อนถาวรหลังจากหายไป
    setTimeout(() => { bar.style.display = 'none'; }, 300);
  } else if (deferredPrompt) {
    bar.classList.add('show');
    bar.classList.remove('hiding');
  }
}

// รอคำสั่งติดตั้งจากเบราว์เซอร์
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  isAppInstalled = false;
  updateInstallBar();
});

// ตรวจสอบสถานะติดตั้งเมื่อโหลดเสร็จ
window.addEventListener('appinstalled', () => {
  isAppInstalled = true;
  deferredPrompt = null;
  updateInstallBar();
});

// กดปุ่มติดตั้ง
document.getElementById('btnInstall').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  
  // แสดงหน้าต่างยืนยันการติดตั้ง
  const choiceResult = await deferredPrompt.prompt();
  
  // ผู้ใช้ตอบอะไรก็ตาม → ล้างข้อมูล
  deferredPrompt = null;
  
  // ซ่อนแถบทันที ไม่ให้ค้าง
  const bar = document.getElementById('installBar');
  bar.classList.add('hiding');
  setTimeout(() => { bar.style.display = 'none'; }, 300);
});

// กด "ภายหลัง" → ซ่อนไว้ชั่วคราว
document.getElementById('btnLater').addEventListener('click', () => {
  const bar = document.getElementById('installBar');
  bar.classList.add('hiding');
  setTimeout(() => { bar.style.display = 'none'; }, 300);
});

// เช็คสถานะตอนเริ่ม
if (checkInstalled()) {
  isAppInstalled = true;
  updateInstallBar();
}

// === ส่วนที่เหลือเหมือนเดิม ===
let profileName = localStorage.getItem('profileName') || 'ThaiPodee';
let profileUser = localStorage.getItem('profileUser') || '@thaipodee';

document.getElementById('profileName').textContent = profileName;
document.getElementById('dispUser').textContent = profileUser;
document.getElementById('profileUser').textContent = profileUser;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('videos')) {
        const store = db.createObjectStore('videos', { autoIncrement: true });
        store.createIndex('timestamp', 'timestamp');
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = reject;
  });
}

async function loadVideos() {
  const db = await openDB();
  const tx = db.transaction('videos', 'readonly');
  const store = tx.objectStore('videos');
  const req = store.getAll();
  return new Promise(resolve => {
    req.onsuccess = () => {
      let list = req.result || [];
      list.sort((a, b) => b.timestamp - a.timestamp);
      resolve(list);
    };
  });
}

async function saveVideo(file, name) {
  const db = await openDB();
  const tx = db.transaction('videos', 'readwrite');
  const store = tx.objectStore('videos');
  store.add({ file, name, timestamp: Date.now() });
  await new Promise(r => tx.oncomplete = r);
}

async function deleteVideo(id) {
  const db = await openDB();
  const tx = db.transaction('videos', 'readwrite');
  const store = tx.objectStore('videos');
  store.delete(id);
  await new Promise(r => tx.oncomplete = r);
}

function renderVideoList() {
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = '';
  videoList.forEach((vid, idx) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `
      <video muted loop playsinline src="${URL.createObjectURL(vid.file)}"></video>
      <button class="del-btn" data-idx="${idx}">✕</button>
    `;
    div.addEventListener('click', (e) => {
      if (!e.target.classList.contains('del-btn')) {
        playVideo(idx);
        document.getElementById('profilePage').style.display = 'none';
      }
    });
    grid.appendChild(div);
  });
  // ปุ่มลบ
  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      if (confirm('ลบวิดีโอนี้?')) {
        await deleteVideo(videoList[idx].id);
        videoList.splice(idx, 1);
        renderVideoList();
      }
    });
  });
}

function playVideo(idx) {
  if (videoList.length === 0) return;
  currentIndex = idx;
  const vid = document.getElementById('vid');
  const src = URL.createObjectURL(videoList[idx].file);
  vid.src = src;
  vid.style.display = 'block';
  document.getElementById('playSign').style.display = 'none';
  document.getElementById('vidDesc').textContent = videoList[idx].name;
  vid.play();
}

async function init() {
  videoList = await loadVideos();
  renderVideoList();
  if (videoList.length > 0) playVideo(0);
}

// เล่น/หยุด กดที่หน้าจอ
let isPlaying = true;
document.getElementById('vidWrap').addEventListener('click', () => {
  const vid = document.getElementById('vid');
  if (vid.style.display === 'none' || !vid.src) return;
  
  if (isPlaying) {
    vid.pause();
    document.getElementById('playSign').style.display = 'block';
    document.getElementById('playSign').textContent = '⏸';
  } else {
    vid.play();
    document.getElementById('playSign').style.display = 'none';
  }
  isPlaying = !isPlaying;
});

// อัปโหลด
document.getElementById('uploadBtn').addEventListener('click', () => {
  document.getElementById('fileIn').click();
});
document.getElementById('fileIn').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  await saveVideo(file, file.name);
  videoList = await loadVideos();
  renderVideoList();
  playVideo(videoList.findIndex(v => v.name === file.name));
});

// โปรไฟล์
document.getElementById('profBtn').addEventListener('click', openProfile);
document.getElementById('profBottomBtn').addEventListener('click', openProfile);
function openProfile() {
  document.getElementById('profilePage').style.display = 'flex';
  renderVideoList();
}
document.getElementById('closeProfile').addEventListener('click', () => {
  document.getElementById('profilePage').style.display = 'none';
});

// เปลี่ยนชื่อ
document.getElementById('editNameBtn').addEventListener('click', () => {
  document.getElementById('newNameInput').value = profileName;
  document.getElementById('namePop').style.display = 'block';
});
document.getElementById('cancelName').addEventListener('click', () => {
  document.getElementById('namePop').style.display = 'none';
});
document.getElementById('saveName').addEventListener('click', () => {
  const newName = document.getElementById('newNameInput').value.trim();
  if (newName) {
    profileName = newName;
    profileUser = '@' + newName.replace(/\s+/g, '_');
    localStorage.setItem('profileName', profileName);
    localStorage.setItem('profileUser', profileUser);
    document.getElementById('profileName').textContent = profileName;
    document.getElementById('dispUser').textContent = profileUser;
    document.getElementById('profileUser').textContent = profileUser;
  }
  document.getElementById('namePop').style.display = 'none';
});

// เปลี่ยนรูปโปรไฟล์
document.getElementById('profPic').addEventListener('click', () => {
  document.getElementById('avatarIn').click();
});
document.getElementById('avatarIn').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const src = ev.target.result;
    document.getElementById('profilePicImg').src = src;
    document.getElementById('profIconImg').src = src;
    localStorage.setItem('profilePic', src);
  };
  reader.readAsDataURL(file);
});
// โหลดรูปที่บันทึกไว้
const savedPic = localStorage.getItem('profilePic');
if (savedPic) {
  document.getElementById('profilePicImg').src = savedPic;
  document.getElementById('profIconImg').src = savedPic;
}

// แชร์
document.getElementById('shareBtn').addEventListener('click', async () => {
  const shareData = {
    title: 'ThaiPodee v1130-44',
    text: '✅ ใหม่ล่าสุด — แพลตฟอร์มวิดีโอไทย',
    url: 'https://thaipodee-global-market.onrender.com/?v=1130-44'
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch (e) {}
  } else {
    await navigator.clipboard.writeText(shareData.url);
    alert('✅ คัดลอกลิงก์แล้ว:\n' + shareData.url);
  }
});

// เริ่มทำงาน
init();
</script>
