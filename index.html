<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThaiPodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body {
            height: 100vh; overflow: hidden; background: #000; color: #fff;
            position: fixed; inset: 0; width: 100%;
        }

        /* ==========================================
           ✅ ล็อกส่วนแสดงภาพ — ห้ามแก้อีก
           ========================================== */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;       /* ตรงกลางแนวตั้ง ล็อก */
            justify-content: center;    /* ตรงกลางแนวนอน ล็อก */
            z-index: 1;
            cursor: pointer;
        }
        #main-media {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: cover;         /* เต็มจอ ไม่บัง ล็อก */
            object-position: center center;  /* ตรงกลางแน่นอน ล็อก */
            background: #000;
        }

        /* ✅ เงาขอบล่าง — ล็อก */
        .bottom-gradient {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* ✅ สัญญาณเสียงตรงกลาง — ล็อก */
        .sound-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: #fff;
            text-shadow: 0 0 12px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .sound-indicator.show { opacity: 1; }

        /* ==========================================
           ✅ ข้อความซ้ายล่าง — ตำแหน่งล็อกแล้ว
           ========================================== */
        .left-info {
            position: fixed;
            left: 16px;      /* ห่างซ้าย 16px ล็อก */
            bottom: 95px;    /* ห่างล่าง 95px ล็อก — ไม่บังภาพ */
            right: 96px;     /* ห่างขวา พ้นเมนู ล็อก */
            z-index: 10;
        }
        .username {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 6px;
        }
        .caption {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #f0f0f0;
        }
        .music-line {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #eee;
        }

        /* ==========================================
           ✅ เมนูด้านขวา — เรียงและระยะห่าง ล็อกแล้ว
           ========================================== */
        .right-menu {
            position: fixed;
            right: 10px;     /* ห่างขวา 10px ล็อก */
            bottom: 120px;   /* ห่างล่าง 120px ล็อก */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;       /* ระยะห่างแต่ละปุ่ม เท่ากัน ล็อก */
            z-index: 10;
        }
        .menu-item {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .avatar-wrap {
            position: relative;
            width: 44px;     /* ขนาดรูปโปรไฟล์ ล็อก */
            height: 44px;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
        }
        .follow-btn {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: #ff2442;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }
        .icon { font-size: 28px; pointer-events: none; }
        .count { font-size: 11px; pointer-events: none; color: #fff; }
        .music-disc {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00c6ff, #ff0080);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 3s linear infinite;
            font-size: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ==========================================
           ✅ แถบล่างสุด — ตำแหน่งและขนาด ล็อกแล้ว
           ========================================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;    /* สูง 70px ล็อก */
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 10px 15px 20px;
            border-top: 1px solid #222;
            z-index: 99;
        }
        .nav-item {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .nav-icon { font-size: 24px; pointer-events: none; }
        .nav-label { font-size: 10px; color: #fff; pointer-events: none; }
        .add-btn {
            width: 48px;
            height: 32px;
            background: #fff;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            margin-bottom: 5px;
        }
        .add-btn::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 2px;
            background: #000;
            top: 15px;
            left: 14px;
        }
        .add-btn::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 20px;
            background: #000;
            left: 23px;
            top: 6px;
        }
        .badge {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #ff2442;
            color: #fff;
            font-size: 9px;
            min-width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            pointer-events: none;
        }

        #file-upload { display: none; }
    </style>
</head>
<body>

<!-- ✅ ภาพตรงกลาง เต็มจอ ไม่บัง ล็อกแล้ว -->
<div class="video-container" id="vidContainer" onclick="toggleSound()">
    <video id="main-media" autoplay loop muted playsinline>
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
    </video>
</div>

<div class="bottom-gradient"></div>
<div class="sound-indicator" id="soundIndicator">🔇</div>

<!-- ✅ ข้อความซ้ายล่าง — ห่างจากขอบพอดี ไม่ทับภาพ ล็อกแล้ว -->
<div class="left-info">
    <div class="username">@ThaiPodee_Official</div>
    <div class="caption">ยินดีต้อนรับสู่ ThaiPodee Global Market — แพลตฟอร์มของคนไทย ✨</div>
    <div class="music-line">
        <span>🎵</span>
        <span>เสียงต้นฉบับ • ThaiPodee Original</span>
    </div>
</div>

<!-- ✅ เมนูขวา เรียงลำดับถูก ระยะห่างเท่ากัน ไม่ซ้อนกัน ล็อกแล้ว -->
<div class="right-menu">
    <div class="menu-item" onclick="alert('โปรไฟล์')">
        <div class="avatar-wrap">
            <img class="avatar" src="https://picsum.photos/seed/thaipodee/100/100" alt="โปรไฟล์">
            <span class="follow-btn" onclick="event.stopPropagation(); alert('ติดตาม')">+</span>
        </div>
    </div>
    <div class="menu-item" onclick="toggleLike(this)">
        <span class="icon">❤️</span>
        <span class="count">0</span>
    </div>
    <div class="menu-item" onclick="alert('คอมเมนต์')">
        <span class="icon">💬</span>
        <span class="count">0</span>
    </div>
    <div class="menu-item" onclick="toggleBookmark(this)">
        <span class="icon">⭐</span>
        <span class="count">บันทึก</span>
    </div>
    <div class="menu-item" onclick="doShare()">
        <span class="icon">➡️</span>
        <span class="count">แชร์</span>
    </div>
    <div class="menu-item" onclick="alert('เพลง')">
        <div class="music-disc">🎵</div>
        <span class="count" style="font-size:10px; margin-top:4px;">11</span>
    </div>
</div>

<!-- ✅ แถบล่างสุด ติดขอบล่าง ไม่ขยับ ล็อกแล้ว -->
<div class="bottom-nav">
    <div class="nav-item" onclick="alert('หน้าหลัก')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าหลัก</span>
    </div>
    <div class="nav-item" onclick="alert('ร้านค้า')">
        <span class="nav-icon">🛍️</span>
        <span class="nav-label">ร้านค้า</span>
    </div>
    <div class="nav-item" onclick="document.getElementById('file-upload').click()">
        <div class="add-btn"></div>
        <input type="file" id="file-upload" accept="video/*,image/*" onchange="handleUpload(event)">
    </div>
    <div class="nav-item" onclick="alert('ข้อความ')">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
        <span class="badge">99+</span>
    </div>
    <div class="nav-item" onclick="alert('โปรไฟล์')">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<script>
let isMuted = true;

function toggleSound() {
    const media = document.getElementById('main-media');
    const indicator = document.getElementById('soundIndicator');
    isMuted = !isMuted;
    media.muted = isMuted;
    indicator.textContent = isMuted ? '🔇' : '🔊';
    indicator.classList.add('show');
    setTimeout(() => indicator.classList.remove('show'), 700);
}

function toggleLike(el) {
    el.style.color = el.style.color === 'red' ? '' : 'red';
}

function toggleBookmark(el) {
    el.style.color = el.style.color === 'gold' ? '' : 'gold';
}

function doShare() {
    if (navigator.share) {
        navigator.share({title:'ThaiPodee Global Market', url:window.location.href});
    } else {
        prompt('คัดลอกลิงก์:', window.location.href);
    }
}

function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const container = document.getElementById('vidContainer');
        if (file.type.startsWith('video/')) {
            container.innerHTML = `<video id="main-media" autoplay loop muted playsinline style="width:100%;height:100%;object-fit:cover;object-position:center center;">
                <source src="${ev.target.result}" type="${file.type}">
            </video>`;
            isMuted = true;
        } else {
            container.innerHTML = `<img id="main-media" src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;object-position:center center;">`;
        }
    };
    reader.readAsDataURL(file);
}
</script>

</body>
</html>
