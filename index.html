<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="thaipodee">

  <link rel="icon" type="image/png" sizes="192x192" href="./thaipodee_logo_icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./thaipodee_logo_icon.png">

  <title>thaipodee Global Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; background: #000; color: #fff;
      font-family: sans-serif;
      -webkit-overflow-scrolling: touch;
    }
    .version-tag {
      position: fixed; top: 10px; right: 10px;
      background: rgba(0,0,0,0.6); color: #10b981;
      font-size: 11px; padding: 3px 8px; border-radius: 10px;
      z-index: 100;
    }
    .page {
      display: none; min-height: 100vh; padding-bottom: 80px;
    }
    .page.active { display: block; }
    .splash {
      position: fixed; inset: 0; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 200; transition: opacity 0.4s ease;
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .logo {
      width: 180px; height: 180px;
      background: url('./thaipodee_logo_icon.png') no-repeat center;
      background-size: contain; margin-bottom: 16px;
    }
    .logo-text { font-size: 22px; font-weight: bold; }
    .logo-sub { font-size: 13px; color: #888; margin-top: 6px; }

    .post-card {
      border-bottom: 1px solid #222; padding: 16px;
    }
    .media-box {
      width: 100%; aspect-ratio: 9/16; background: #111; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; margin: 10px 0;
    }
    .media-box i { font-size: 48px; color: #444; }
    .meta { font-size: 12px; color: #888; margin: 4px 0; }
    .title { font-weight: bold; font-size: 15px; margin: 6px 0; }

    .right-buttons {
      position: fixed; right: 12px; bottom: 15%;
      display: flex; flex-direction: column; gap: 22px; z-index: 50;
    }
    .r-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .r-btn i { font-size: 26px; }
    .r-btn span { font-size: 10px; margin-top: 3px; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000;
      display: flex; justify-content: space-around; align-items: center;
      border-top: 1px solid #222; z-index: 50;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .nav-item i { font-size: 22px; }
    .nav-item span { font-size: 10px; margin-top: 2px; }
    .plus-btn {
      width: 48px; height: 34px; background: linear-gradient(90deg, #ff2e55, #ff6b4a);
      border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
  </style>
</head>
<body>

<div class="version-tag">v4.7.3</div>

<!-- หน้าเริ่มต้น — แป๊บเดียวแล้วหายไปเอง -->
<div id="splash" class="splash">
  <div class="logo"></div>
  <div class="logo-text">thaipodee</div>
  <div class="logo-sub">Global Market — ตลาดโลก</div>
</div>

<!-- หน้าหลัก -->
<div id="home" class="page active">
  <div class="right-buttons">
    <div class="r-btn" data-to="profile"><i class="fas fa-user"></i><span>โปรไฟล์</span></div>
    <div class="r-btn"><i class="far fa-heart"></i><span>0</span></div>
    <div class="r-btn"><i class="far fa-comment"></i><span>0</span></div>
    <div class="r-btn"><i class="far fa-bookmark"></i><span>บันทึก</span></div>
    <div class="r-btn" id="share"><i class="fas fa-share"></i><span>แชร์</span></div>
    <div class="r-btn"><i class="fas fa-ellipsis-v"></i><span>เพิ่มเติม</span></div>
  </div>

  <div style="padding: 12px;">
    <div class="post-card">
      <div class="meta">thaipodee · 21 ก.ย. 69 · ต้นฉบับ</div>
      <div class="title">ยินดีต้อนรับสู่ thaipodee Global Market</div>
      <div class="media-box"><i class="fas fa-play-circle"></i></div>
      <div class="meta">9:16 · พร้อมใช้งาน</div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" data-to="home"><i class="fas fa-home"></i><span>หน้าแรก</span></div>
    <div class="nav-item"><i class="fas fa-search"></i><span>ค้นหา</span></div>
    <div class="nav-item" data-to="upload"><div class="plus-btn"><i class="fas fa-plus"></i></div></div>
    <div class="nav-item"><i class="far fa-comment-dots"></i><span>ข้อความ</span></div>
    <div class="nav-item" data-to="profile"><i class="far fa-user"></i><span>ฉัน</span></div>
  </div>
</div>

<!-- หน้าอัปโหลด -->
<div id="upload" class="page">
  <div class="p-4">
    <button class="mb-4 text-lg" data-to="home"><i class="fas fa-arrow-left"></i> กลับ</button>
    <h3 class="text-xl font-bold mb-4">โพสต์วิดีโอ / รูปภาพ</h3>
    <input type="file" id="fileInput" accept="video/*,image/*" class="w-full p-3 bg-gray-800 rounded-lg mb-3">
    <button id="postBtn" class="w-full py-3 rounded-lg font-bold bg-gradient-to-r from-pink-600 to-orange-500">เผยแพร่</button>
  </div>
</div>

<!-- หน้าโปรไฟล์ -->
<div id="profile" class="page">
  <div class="p-4">
    <button class="mb-4 text-lg" data-to="home"><i class="fas fa-arrow-left"></i> กลับ</button>
    <h3 class="text-xl font-bold mb-3">โปรไฟล์</h3>
    <p class="text-gray-400 mb-2">ชื่อ: thaipodee</p>
    <p class="text-gray-400">จำนวนโพสต์: 1</p>
  </div>
</div>

<script>
// === หน้าเริ่มต้นหายไปเอง — ไม่ค้าง ===
setTimeout(() => {
  document.getElementById('splash').classList.add('hide');
}, 1200);

// === เปลี่ยนหน้า — กลับได้ ออกได้ ปกติ ===
document.querySelectorAll('[data-to]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(btn.dataset.to).classList.add('active');
    window.scrollTo(0,0);
  });
});

// === แชร์ลิงก์ ===
document.getElementById('share').addEventListener('click', async () => {
  const link = `✅ Thaipodee Global Market
🔗 ลิงก์:
https://thaipodee-global-market-v2026-new.onrender.com/

📌 เปิดลิงก์ → กดจุด 3 มุมขวาบน → เพิ่มไปที่หน้าจอหลัก`;
  if (navigator.share) {
    await navigator.share({title: 'thaipodee', text: link});
  } else {
    await navigator.clipboard.writeText(link);
    alert('คัดลอกข้อความแล้ว ✅ วางส่งให้เพื่อนได้เลย');
  }
});

// === ปุ่มเผยแพร่ทำงาน ===
document.getElementById('postBtn').addEventListener('click', () => {
  if (!document.getElementById('fileInput').files.length) {
    alert('เลือกไฟล์วิดีโอหรือรูปภาพก่อนครับ');
    return;
  }
  alert('เผยแพร่สำเร็จ ✅');
  document.getElementById('fileInput').value = '';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('home').classList.add('active');
});
</script>
</body>
</html>
