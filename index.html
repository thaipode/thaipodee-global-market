<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thaipodee Market Online V2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #000; color: #fff; min-height: 100vh; }
    .page { display: none; min-height: 100vh; padding-bottom: 80px; }
    .page.active { display: block; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 999; }
    .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .nav-item.active { color: #fff; }
    .nav-icon { font-size: 22px; }
    .upload-btn { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(45deg, #ff0050, #ff4080); display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; }

    .video-container { position: relative; width: 100%; height: calc(100vh - 70px); background: #000; }
    .video-player { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
    .video-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e, #16213e); }
    .video-placeholder-content { text-align: center; color: #888; padding: 20px; }
    .video-placeholder-content .icon { font-size: 64px; margin-bottom: 15px; }
    .side-actions { position: absolute; right: 12px; bottom: 120px; display: flex; flex-direction: column; gap: 24px; align-items: center; z-index: 10; }
    .side-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .side-btn span { font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .side-icon { font-size: 28px; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8)); }
    .video-info { position: absolute; left: 16px; right: 80px; bottom: 100px; z-index: 10; display: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .video-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
    .video-desc { font-size: 14px; color: #ddd; }
    .status-box { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #4ade80; padding: 6px 16px; border-radius: 20px; font-size: 13px; z-index: 20; display: none; }

    .page-header { padding: 16px; text-align: center; font-size: 18px; border-bottom: 1px solid #222; position: relative; }
    .back-btn { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; cursor: pointer; }

    .upload-area { border: 2px dashed #444; border-radius: 12px; padding: 40px 20px; text-align: center; background: #1a1a1a; margin: 20px; cursor: pointer; }
    .upload-area input { display: none; }
    .form-group { margin: 20px; }
    .form-input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #2a2a2a; color: #fff; font-size: 15px; }
    .publish-btn { width: calc(100% - 40px); padding: 15px; border-radius: 8px; border: none; background: linear-gradient(45deg, #ff0050, #ff4080); color: #fff; font-size: 17px; font-weight: bold; cursor: pointer; margin: 0 20px; }
    .file-name { color: #4ade80; margin-top: 12px; display: none; word-break: break-all; }
  </style>
</head>
<body>

<!-- หน้าหลัก -->
<div class="page active" id="page-home">
  <div class="video-container">
    <div class="video-placeholder" id="video-placeholder">
      <div class="video-placeholder-content">
        <div class="icon">🎬</div>
        <div>กด + เพื่อเลือกวิดีโอ</div>
        <div style="font-size:13px; color:#666; margin-top:8px;">แค่ไฟล์เดียว — ระบบจะจดจำไว้ให้ครับ</div>
      </div>
    </div>
    <video class="video-player" id="video-player" controls playsinline muted></video>
    
    <div class="status-box" id="status-saved">✅ บันทึกแล้ว — จดจำไว้แล้ว</div>
    
    <div class="side-actions">
      <div class="side-btn"><div class="side-icon">👤</div><span>ฉัน</span></div>
      <div class="side-btn"><div class="side-icon">❤️</div><span>0</span></div>
      <div class="side-btn"><div class="side-icon">💬</div><span>0</span></div>
      <div class="side-btn"><div class="side-icon">⭐</div><span>0</span></div>
      <div class="side-btn"><div class="side-icon">➡️</div><span>แชร์</span></div>
    </div>
    
    <div class="video-info" id="video-info">
      <div class="video-title" id="vid-name">วิดีโอของฉัน</div>
      <div class="video-desc" id="vid-desc">-</div>
    </div>
  </div>
</div>

<!-- หน้าอัปโหลด -->
<div class="page" id="page-upload">
  <div class="page-header">
    <span class="back-btn" onclick="goBack()">←</span>
    เลือกวิดีโอ
  </div>
  
  <label class="upload-area">
    <input type="file" id="video-input" accept="video/*">
    <div style="font-size:48px; margin-bottom:10px;">📷</div>
    <div>แตะเพื่อเลือกไฟล์วิดีโอ</div>
    <div class="file-name" id="video-name"></div>
  </label>
  
  <div class="form-group">
    <textarea class="form-input" id="post-desc" placeholder="คำอธิบาย (ไม่จำเป็น)..."></textarea>
  </div>
  
  <button class="publish-btn" onclick="saveAndShow()">บันทึกและแสดง</button>
</div>

<!-- เมนูล่าง -->
<nav class="bottom-nav">
  <div class="nav-item active" onclick="goTo('page-home')"><span class="nav-icon">🏠</span><br>หน้าหลัก</div>
  <div class="nav-item" onclick="goTo('page-cart')"><span class="nav-icon">🛒</span><br>ร้านค้า</div>
  <div class="nav-item" onclick="goTo('page-upload')"><div class="upload-btn">+</div><br>อัปโหลด</div>
  <div class="nav-item" onclick="goTo('page-messages')"><span class="nav-icon">💬</span><br>ข้อความ</div>
  <div class="nav-item" onclick="goTo('page-profile')"><span class="nav-icon">👤</span><br>โปรไฟล์</div>
</nav>

<script>
let currentPage = 'page-home';
let history = [];
let currentVideoBlob = null;
let currentVideoName = '';
let currentDesc = '';

// เปลี่ยนหน้า
function goTo(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach((item, idx) => {
    const map = ['page-home', 'page-cart', 'page-upload', 'page-messages', 'page-profile'];
    item.classList.toggle('active', map[idx] === id);
  });
  if (currentPage !== id) history.push(currentPage);
  currentPage = id;
  window.scrollTo(0, 0);
}

function goBack() {
  if (history.length > 0) goTo(history.pop());
  else goTo('page-home');
}

// เมื่อเลือกไฟล์
document.addEventListener('DOMContentLoaded', function() {
  const input = document.getElementById('video-input');
  const nameDisplay = document.getElementById('video-name');
  
  if (input && nameDisplay) {
    input.addEventListener('change', function(e) {
      if (e.target.files.length > 0) {
        nameDisplay.textContent = '✅ ' + e.target.files[0].name;
        nameDisplay.style.display = 'block';
      }
    });
  }
  
  // โหลดวิดีโอที่เคยบันทึกไว้เมื่อเปิดหน้า
  loadSavedVideo();
});

// 🔑 ฟังก์ชันหลัก — บันทึกไฟล์เดียว จำไว้ตลอด
function saveAndShow() {
  const input = document.getElementById('video-input');
  const desc = document.getElementById('post-desc').value.trim();
  
  if (!input || !input.files.length) {
    alert('กรุณาเลือกไฟล์วิดีโอก่อนครับ');
    return;
  }
  
  const file = input.files[0];
  currentVideoName = file.name;
  currentDesc = desc || 'วิดีโอของฉัน';
  
  // อ่านไฟล์เป็น Base64 แล้วเก็บไว้ในเครื่อง — ไม่ต้องเซิร์ฟเวอร์!
  const reader = new FileReader();
  reader.onload = function(e) {
    const base64Data = e.target.result;
    
    // เก็บไว้ใน LocalStorage — ปิดเปิดเว็บใหม่ก็ยังอยู่!
    try {
      localStorage.setItem('savedVideoData', base64Data);
      localStorage.setItem('savedVideoName', currentVideoName);
      localStorage.setItem('savedVideoDesc', currentDesc);
      localStorage.setItem('savedVideoType', file.type);
    } catch (err) {
      alert('⚠️ พื้นที่เก็บไม่พอ — ไฟล์อาจใหญ่เกินไป ลองไฟล์สั้นๆ ครับ');
      return;
    }
    
    // แสดงวิดีโอทันที
    showVideo(base64Data, currentVideoName, currentDesc);
    
    // แจ้งว่าบันทึกเรียบร้อย
    const status = document.getElementById('status-saved');
    status.style.display = 'block';
    setTimeout(() => { status.style.display = 'none'; }, 3000);
    
    // กลับหน้าหลัก
    goTo('page-home');
    
    // ล้างฟอร์ม
    input.value = '';
    document.getElementById('video-name').style.display = 'none';
    document.getElementById('post-desc').value = '';
  };
  
  reader.readAsDataURL(file);
}

// แสดงวิดีโอที่หน้าหลัก
function showVideo(src, name, desc) {
  const placeholder = document.getElementById('video-placeholder');
  const player = document.getElementById('video-player');
  const info = document.getElementById('video-info');
  const vidName = document.getElementById('vid-name');
  const vidDesc = document.getElementById('vid-desc');
  
  if (placeholder) placeholder.style.display = 'none';
  if (player) {
    player.src = src;
    player.style.display = 'block';
    player.muted = false;
    player.play().catch(() => {});
  }
  if (info) info.style.display = 'block';
  if (vidName) vidName.textContent = name;
  if (vidDesc) vidDesc.textContent = desc;
}

// 🔑 โหลดวิดีโอที่เคยบันทึกไว้ — ตอนเปิดหน้าเว็บใหม่
function loadSavedVideo() {
  const savedData = localStorage.getItem('savedVideoData');
  const savedName = localStorage.getItem('savedVideoName');
  const savedDesc = localStorage.getItem('savedVideoDesc');
  
  if (savedData && savedName) {
    // มีไฟล์เก่าอยู่ — แสดงเลย!
    showVideo(savedData, savedName, savedDesc || 'วิดีโอของฉัน');
  }
}
</script>

</body>
</html>
