<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100vw;height:100vh;
  margin:0;padding:0;
  background:#000;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color:#fff;
  overflow:hidden;
  position:fixed;inset:0;
}

.splash{
  position:fixed;inset:0;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:999;transition:opacity .4s ease;
}
.splash.hidden{opacity:0;pointer-events:none}
.splash-logo{font-size:2.5rem;font-weight:bold;color:#e60000;margin-bottom:.5rem}
.splash-text{font-size:.9rem;color:#888}

.version-tag{position:absolute;top:10px;right:10px;font-size:10px;color:#444;z-index:100}

/* === หน้าจอหลัก วิดีโอเต็มจอ === */
.main-screen{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden}
.main-screen.hidden{display:none}

.video-container{
  position:absolute;inset:0;
  width:100vw;height:100vh;
  background:#000;overflow:hidden;z-index:1;
  display:grid;place-items:center;
}
video{
  width:100vw;height:100vh;
  object-fit:cover; /* วิดีโอเต็มจอ แนวตั้งพอดี */
  object-position:center center;
  background:#000;
}
.tap-layer{position:absolute;inset:0;z-index:10;cursor:pointer}

/* === ข้อมูลวิดีโอ ซ้ายล่าง ตรงตำแหน่งเหมือนตัวอย่าง === */
.video-info{
  position:absolute;
  left:16px;
  bottom:90px; /* เหนือแถบเวลา */
  right:100px; /* เว้นที่ไอคอนขวา */
  z-index:20;
}
.video-author{font-size:15px;font-weight:700;margin-bottom:4px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.video-caption{font-size:13px;line-height:1.4;color:#f0f0f0;margin-bottom:6px;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.video-music{font-size:12px;color:#eee;display:flex;align-items:center;gap:6px;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.music-roll{animation:roll 6s linear infinite;white-space:nowrap;overflow:hidden;max-width:200px;display:inline-block}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* === ไอคอนด้านขวา เรียงกัน เท่ากัน ตำแหน่งตรง === */
.side-icons{
  position:absolute;
  right:12px;
  bottom:110px; /* เหนือเมนูล่าง */
  display:flex;
  flex-direction:column;
  gap:24px; /* ระยะห่างเท่ากันทุกอัน */
  align-items:center;
  z-index:25;
}
.side-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;
}
.side-icon-wrap{
  width:48px;height:48px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:transparent;
  font-size:28px;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}
.side-avatar{
  width:48px;height:48px;
  border-radius:50%;
  border:2px solid #fff;
  overflow:hidden;
  background:#333;
  box-shadow:0 0 6px rgba(0,0,0,.5);
}
.side-avatar img{width:100%;height:100%;object-fit:cover}
.side-count{font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.side-music-disc{
  width:40px;height:40px;
  border-radius:50%;
  background:linear-gradient(#333,#111);
  display:flex;align-items:center;justify-content:center;
  border:2px solid #444;
  animation:spin 3s linear infinite;
}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* === แถบเวลา บางๆ ด้านล่าง === */
.progress-bar{
  position:absolute;
  bottom:65px;
  left:0;right:0;
  height:3px;
  background:rgba(255,255,255,.15);
  z-index:22;
}
.progress-fill{
  height:100%;
  width:0%;
  background:#fff;
  border-radius:2px;
  transition:width .1s linear;
}

/* === เมนูล่างสุด เหมือนตัวอย่าง === */
.bottom-nav{
  position:fixed;
  bottom:0;left:0;right:0;
  height:65px;
  background:transparent;
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:0 8px;
  z-index:30;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.nav-item .nav-icon{font-size:22px;line-height:1}
.nav-item span{font-size:10px}
.nav-item.active{font-weight:700}
.nav-center-btn{
  width:48px;height:36px;
  background:#fff;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:#000;font-size:24px;font-weight:bold;
  cursor:pointer;
}

#fileInput{display:none}

/* === หน้าโปรไฟล์ === */
.profile-screen{
  position:fixed;inset:0;width:100vw;height:100vh;
  background:#000;z-index:40;display:none;overflow-y:auto;
}
.profile-screen.active{display:block}
.profile-top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:40px}
.profile-title{font-size:18px;font-weight:bold}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 2px 80px;margin-top:16px}
.profile-item{aspect-ratio:9/12;background:#222;position:relative;cursor:pointer;overflow:hidden}
.profile-thumb{width:100%;height:100%;object-fit:cover;display:block}
.profile-delete{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:16px;font-weight:bold;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<input type="file" id="fileInput" accept="video/*">

<div class="splash" id="splash">
  <div class="splash-logo">ThaiPodee</div>
  <div class="splash-text">v1121-13</div>
</div>

<div class="main-screen" id="mainScreen">
  <div class="version-tag">v1121-13</div>

  <!-- วิดีโอเต็มจอ -->
  <div class="video-container">
    <video id="videoPlayer" loop playsinline webkit-playsinline muted>
      <source src="" type="video/mp4">
    </video>
    <div class="tap-layer" id="tapLayer"></div>
  </div>

  <!-- ข้อมูล ซ้ายล่าง -->
  <div class="video-info">
    <div class="video-author">@ThaiPodee</div>
    <div class="video-caption">ยินดีต้อนรับสู่ ThaiPodee 🇹🇭 แตะหน้าจอ = เล่น/หยุด</div>
    <div class="video-music">
      🎵 <span class="music-roll">เสียงต้นฉบับ — ThaiPodee • เสียงต้นฉบับ — ThaiPodee</span>
    </div>
  </div>

  <!-- แถบเวลา ด้านล่าง -->
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- ไอคอนด้านขวา เรียงกัน เท่ากัน -->
  <div class="side-icons">
    <div class="side-btn" data-page="profile">
      <div class="side-avatar">
        <img src="https://i.imgur.com/KJbRzQY.png?v=13" alt="โปรไฟล์">
      </div>
    </div>
    <div class="side-btn" id="likeBtn">
      <div class="side-icon-wrap">❤️</div>
      <div class="side-count" id="likeCount">0</div>
    </div>
    <div class="side-btn">
      <div class="side-icon-wrap">💬</div>
      <div class="side-count">0</div>
    </div>
    <div class="side-btn">
      <div class="side-icon-wrap">📌</div>
      <div class="side-count">0</div>
    </div>
    <div class="side-btn" id="shareBtn">
      <div class="side-icon-wrap">↗️</div>
      <div class="side-count">แชร์</div>
    </div>
    <div class="side-btn">
      <div class="side-music-disc">🎵</div>
    </div>
  </div>

  <!-- เมนูล่างสุด -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-page="main">
      <span class="nav-icon">🏠</span>
      <span>หน้าแรก</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>ค้นหา</span>
    </div>
    <div class="nav-item" id="uploadBtn">
      <div class="nav-center-btn">+</div>
    </div>
    <div class="nav-item">
      <span class="nav-icon">📦</span>
      <span>กล่อง</span>
    </div>
    <div class="nav-item" data-page="profile">
      <span class="nav-icon">👤</span>
      <span>โปรไฟล์</span>
    </div>
  </nav>
</div>

<div class="profile-screen" id="profileScreen">
  <div class="profile-top-bar">
    <span class="profile-title">โปรไฟล์</span>
    <button class="profile-edit-btn" style="background:transparent;border:1px solid #444;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer">แก้ไข</button>
  </div>
  <div style="padding:16px">
    <div style="font-size:20px;font-weight:bold">@ThaiPodee</div>
    <div style="color:#888;margin:8px 0">แพลตฟอร์มวิดีโอสั้นของไทย</div>
    <div style="display:flex;gap:20px;margin:12px 0">
      <div><b id="postCount">0</b> โพสต์</div>
      <div><b>0</b> ติดตาม</div>
      <div><b>0</b> ไลค์</div>
    </div>
  </div>
  <div class="profile-grid" id="profileGrid"></div>
</div>

<script>
const VERSION = 'v1121-13';
let videoList = JSON.parse(localStorage.getItem('thaiPodeeVideos') || '[]');
let currentIndex = 0;
let isPlaying = true;
let isLiked = false;

const splash = document.getElementById('splash');
const mainScreen = document.getElementById('mainScreen');
const profileScreen = document.getElementById('profileScreen');
const videoPlayer = document.getElementById('videoPlayer');
const tapLayer = document.getElementById('tapLayer');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const shareBtn = document.getElementById('shareBtn');
const likeBtn = document.getElementById('likeBtn');
const likeCount = document.getElementById('likeCount');
const progressFill = document.getElementById('progressFill');
const profileGrid = document.getElementById('profileGrid');
const postCount = document.getElementById('postCount');

function hideSplash() {
  splash.classList.add('hidden');
  if (videoList.length > 0) { loadVideo(0); renderProfileGrid(); }
  updateStats();
}
setTimeout(hideSplash, 800);

function loadVideo(i) {
  if (!videoList.length) return;
  const v = videoList[i];
  videoPlayer.src = v.url;
  videoPlayer.load();
  if (isPlaying) videoPlayer.play().catch(() => { isPlaying = false; });
  document.querySelector('.video-author').textContent = `@${v.name?.replace(/\.[^.]+$/,'') || 'ThaiPodee'}`;
}

// แตะหน้าจอ = เล่น/หยุด
tapLayer.addEventListener('click', () => {
  if (videoPlayer.paused) { videoPlayer.play(); isPlaying = true; }
  else { videoPlayer.pause(); isPlaying = false; }
});

// วนซ้ำเมื่อจบ
videoPlayer.addEventListener('ended', () => {
  videoPlayer.currentTime = 0;
  videoPlayer.play();
});

// แถบเวลา
videoPlayer.addEventListener('timeupdate', () => {
  if (videoPlayer.duration) {
    const pct = (videoPlayer.currentTime / videoPlayer.duration) * 100;
    progressFill.style.width = `${pct}%`;
  }
});

// กดไลค์
likeBtn.addEventListener('click', e => {
  e.stopPropagation();
  isLiked = !isLiked;
  const count = parseInt(likeCount.textContent || '0');
  likeCount.textContent = isLiked ? count + 1 : Math.max(0, count - 1);
  likeBtn.querySelector('.side-icon-wrap').style.color = isLiked ? '#ff2c55' : '#fff';
});

// อัปโหลดวิดีโอ
uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const u = URL.createObjectURL(f);
  generateThumbnail(f, thumb => {
    videoList.unshift({
      id: Date.now(),
      name: f.name,
      url: u,
      thumbnail: thumb || u,
      likes: 0,
      views: 0
    });
    saveVideos();
    renderProfileGrid();
    updateStats();
    loadVideo(0);
    currentIndex = 0;
    fileInput.value = '';
  });
});

function generateThumbnail(file, callback) {
  const v = document.createElement('video');
  v.src = URL.createObjectURL(file);
  v.muted = true;
  v.playsInline = true;
  v.preload = 'metadata';
  v.addEventListener('loadeddata', () => { v.currentTime = Math.min(0.5, v.duration / 4); });
  v.addEventListener('seeked', () => {
    const c = document.createElement('canvas');
    c.width = 300; c.height = 400;
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    try { callback(c.toDataURL('image/jpeg', 0.7)); } catch { callback(null); }
    try { URL.revokeObjectURL(v.src); } catch {}
  });
  v.addEventListener('error', () => callback(null));
}

function saveVideos() { localStorage.setItem('thaiPodeeVideos', JSON.stringify(videoList)); }
function updateStats() { postCount.textContent = videoList.length; }

function renderProfileGrid() {
  profileGrid.innerHTML = '';
  videoList.forEach((v, idx) => {
    const item = document.createElement('div');
    item.className = 'profile-item';
    item.innerHTML = `
      <button class="profile-delete" data-idx="${idx}">×</button>
      <img src="${v.thumbnail || 'https://i.imgur.com/KJbRzQY.png?v=13'}" class="profile-thumb" alt="">
    `;
    item.onclick = ev => {
      if (ev.target.classList.contains('profile-delete')) return;
      currentIndex = idx; loadVideo(idx); showPage('main');
    };
    profileGrid.appendChild(item);
  });
  document.querySelectorAll('.profile-delete').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.idx);
      if (!confirm('ลบ?')) return;
      try { URL.revokeObjectURL(videoList[i].url); } catch {}
      videoList.splice(i, 1);
      saveVideos(); renderProfileGrid(); updateStats();
      if (currentIndex >= videoList.length) currentIndex = Math.max(0, videoList.length - 1);
      if (videoList.length) loadVideo(currentIndex);
    };
  });
}

function showPage(page) {
  mainScreen.classList.toggle('hidden', page === 'profile');
  profileScreen.classList.toggle('active', page === 'profile');
  if (page === 'profile') renderProfileGrid();
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
}

document.querySelectorAll('[data-page]').forEach(b => {
  b.onclick = () => showPage(b.dataset.page);
});

shareBtn.onclick = async () => {
  const link = window.location.href.split('?')[0] + '?v=1121-13';
  try {
    if (navigator.share) await navigator.share({title:'ThaiPodee', url:link});
    else { await navigator.clipboard.writeText(link); alert('✅ คัดลอกแล้ว'); }
  } catch { alert(link); }
};
</script>
