<!-- ==============================================================
   ThaiPodee v1186 — ✅ คืนค่าทำงานได้เหมือนเดิม + จุดเวลาเล็ก
   อัปเดต: 3 ตุลาคม 2569 23:45 น.
   --------------------------------------------------------------
   ✅ ปุ่ม + โหลดวิดีโอได้ → เล่นได้
   ✅ ปุ่มแชร์ได้ → แชร์/คัดลอกลิงก์
   ✅ ปุ่มโปรไฟล์เข้าได้ → ดู/เล่น/ลบวิดีโอ
   ✅ เปลี่ยนรูปโปรไฟล์ได้
   ✅ จุดเวลา 2px เหมือน TikTok ไม่กระทบอย่างอื่น
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<meta name="application-name" content="ThaiPodee">
<meta name="theme-color" content="#000">
<meta name="description" content="แอปวิดีโอของคนไทย">
<title>ThaiPodee v1186</title>
<link rel="icon" type="image/png" sizes="512x512" href="thaipodee_logo_icon.png">
<link rel="apple-touch-icon" href="thaipodee_logo_icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;font-family:-apple-system,sans-serif;color:#fff;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
.page{position:absolute;inset:0;z-index:1;transition:opacity .2s ease;}
.page.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.top-bar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:50;}
.version-text{font-size:11px;opacity:0.5;}

/* === วิดีโอ === */
.video-wrap{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:1;}
video{width:100%;height:100%;object-fit:contain;display:block;}

/* === แถบเวลา — แค่เปลี่ยนจุดให้เล็ก === */
.progress-bar{position:absolute;bottom:80px;left:16px;right:16px;height:30px;z-index:10;cursor:pointer;}
.progress-bg{position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;height:2px;background:rgba(255,255,255,.2);border-radius:1px;}
.progress-dot{position:absolute;top:50%;transform:translateY(-50%);width:12px;height:12px;background:#fff;border-radius:50%;margin-left:-6px;box-shadow:0 0 4px rgba(0,0,0,.5);}

/* === ข้อมูลใต้วิดีโอ === */
.info-area{position:absolute;bottom:110px;left:16px;right:90px;z-index:5;}
.info-name{font-weight:bold;font-size:15px;margin-bottom:4px;}
.info-desc{font-size:13px;opacity:0.9;margin-bottom:4px;}

/* === ปุ่มด้านขวา === */
.side-buttons{position:absolute;right:12px;bottom:130px;display:flex;flex-direction:column;gap:20px;align-items:center;z-index:6;}
.side-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.side-icon{font-size:28px;line-height:1;}
.side-label{font-size:10px;opacity:0.7;}
.avatar-btn{width:44px;height:44px;border-radius:50%;border:2px solid #fff;overflow:hidden;position:relative;}
.avatar-btn img{width:100%;height:100%;object-fit:cover;}
.avatar-plus{position:absolute;bottom:-2px;right:-2px;background:#f44;color:#fff;width:16px;height:16px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;}

/* === แถบล่าง === */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;display:flex;justify-content:space-around;align-items:center;background:#000;border-top:1px solid #222;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.nav-icon{font-size:22px;}
.nav-add{width:46px;height:34px;background:#f44;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}

/* === หน้าโปรไฟล์ === */
.profile-page{background:#fff;color:#000;overflow-y:auto;padding-bottom:80px;z-index:3;}
.profile-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;}
.back-btn{font-size:22px;cursor:pointer;}
.profile-head{text-align:center;padding:20px 16px;}
.profile-avatar{width:90px;height:90px;border-radius:50%;border:2px solid #ddd;overflow:hidden;margin:0 auto 10px;position:relative;cursor:pointer;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-name{font-size:20px;font-weight:bold;margin-bottom:4px;}
.profile-uname{color:#666;font-size:14px;margin-bottom:15px;}
.profile-stats{display:flex;justify-content:center;gap:30px;margin-bottom:20px;}
.stat-num{font-weight:bold;font-size:18px;}
.stat-txt{font-size:11px;color:#888;}
.videos-list{padding:0 12px;}
.list-title{font-weight:bold;padding:12px 4px;}
.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.video-item{aspect-ratio:9/12;background:#eee;border-radius:4px;position:relative;overflow:hidden;cursor:pointer;}
.video-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.6);}
.video-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.empty-txt{text-align:center;padding:40px 20px;color:#999;grid-column:1/-1;}

.hidden-input{display:none;}
</style>
</head>
<body>
<input type="file" id="avatarInput" accept="image/*" class="hidden-input">
<input type="file" id="videoInput" accept="video/*" class="hidden-input">

<!-- หน้าเล่นวิดีโอ -->
<div class="page" id="homePage">
  <div class="top-bar">
    <div></div>
    <div class="version-text">v1186</div>
  </div>

  <div class="video-wrap" id="videoWrap">
    <video id="mainVideo" playsinline webkit-playsinline loop muted></video>
    <div class="progress-bar" id="progressBar">
      <div class="progress-bg"></div>
      <div class="progress-dot" id="progressDot"></div>
    </div>
  </div>

  <div class="info-area">
    <div class="info-name" id="dispName">@thaipodee</div>
    <div class="info-desc">ยินดีต้อนรับ</div>
  </div>

  <!-- ปุ่มด้านขวา เรียงถูก: รูปบนสุด -->
  <div class="side-buttons">
    <div class="side-btn" data-goto="profile" id="avatarSide">
      <div class="avatar-btn" id="avatarSideBtn">
        <img id="avatarSideImg" src="thaipodee_logo_icon.png" alt="ฉัน">
        <span class="avatar-plus">+</span>
      </div>
    </div>
    <div class="side-btn" id="likeBtn">
      <span class="side-icon" id="likeIcon">🤍</span>
      <span class="side-label" id="likeCount">0</span>
    </div>
    <div class="side-btn" id="cmtBtn">
      <span class="side-icon">💬</span>
      <span class="side-label">0</span>
    </div>
    <div class="side-btn" id="saveBtn">
      <span class="side-icon" id="saveIcon">⬜</span>
      <span class="side-label">บันทึก</span>
    </div>
    <div class="side-btn" id="shareBtn">
      <span class="side-icon">↗️</span>
      <span class="side-label">แชร์</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">🎵</span>
    </div>
  </div>

  <!-- แถบล่าง -->
  <div class="bottom-nav">
    <div class="nav-btn" data-goto="home"><span class="nav-icon">🏠</span></div>
    <div class="nav-btn" data-goto="shop"><span class="nav-icon">🛒</span></div>
    <div class="nav-btn" id="uploadBtn"><span class="nav-add">+</span></div>
    <div class="nav-btn" data-goto="msg"><span class="nav-icon">💬</span></div>
    <div class="nav-btn" data-goto="profile"><span class="nav-icon">👤</span></div>
  </div>
</div>

<!-- หน้าโปรไฟล์ -->
<div class="page hidden" id="profilePage">
  <div class="profile-top">
    <span class="back-btn" data-goto="home">←</span>
    <span id="shareProfile">↗️</span>
  </div>
  <div class="profile-head">
    <div class="profile-avatar" id="avatarBigBtn">
      <img id="avatarBigImg" src="thaipodee_logo_icon.png" alt="ฉัน">
      <span class="avatar-plus">+</span>
    </div>
    <div class="profile-name" id="profileName">ThaiPodee</div>
    <div class="profile-uname" id="profileUname">@thaipodee</div>
    <div class="profile-stats">
      <div><div class="stat-num" id="statFollow">9</div><div class="stat-txt">ติดตาม</div></div>
      <div><div class="stat-num" id="statFollower">0</div><div class="stat-txt">ผู้ติดตาม</div></div>
      <div><div class="stat-num" id="statLike">0</div><div class="stat-txt">ถูกใจ</div></div>
    </div>
  </div>
  <div class="videos-list">
    <div class="list-title">วิดีโอของฉัน</div>
    <div class="video-grid" id="videoGrid"></div>
  </div>
  <div class="bottom-nav">
    <div class="nav-btn" data-goto="home"><span class="nav-icon">🏠</span></div>
    <div class="nav-btn" data-goto="shop"><span class="nav-icon">🛒</span></div>
    <div class="nav-btn" id="uploadBtn2"><span class="nav-add">+</span></div>
    <div class="nav-btn" data-goto="msg"><span class="nav-icon">💬</span></div>
    <div class="nav-btn" data-goto="profile" style="opacity:1;"><span class="nav-icon">👤</span></div>
  </div>
</div>

<script>
const STORAGE = {
  avatar: 'tp_avatar',
  name: 'tp_name',
  uname: 'tp_uname',
  videos: 'tp_videos',
  likes: 'tp_likes'
};

// === ตัวแปรหลัก ===
let videoList = JSON.parse(localStorage.getItem(STORAGE.videos) || '[]');
let totalLikes = parseInt(localStorage.getItem(STORAGE.likes) || '0');
let isLiked = false;
let isDragging = false;

// === DOM ===
const video = document.getElementById('mainVideo');
const progressBar = document.getElementById('progressBar');
const progressDot = document.getElementById('progressDot');
const avatarInput = document.getElementById('avatarInput');
const videoInput = document.getElementById('videoInput');

// === ซิงค์ชื่อทุกจุด===
function syncNames(){
  const n = localStorage.getItem(STORAGE.name) || 'ThaiPodee';
  const u = localStorage.getItem(STORAGE.uname) || '@thaipodee';
  document.getElementById('profileName').textContent = n;
  document.getElementById('profileUname').textContent = u;
  document.getElementById('dispName').textContent = u;
}

// === ซิงค์รูปทุกจุด===
function syncAvatar(){
  const src = localStorage.getItem(STORAGE.avatar) || 'thaipodee_logo_icon.png';
  document.getElementById('avatarSideImg').src = src;
  document.getElementById('avatarBigImg').src = src;
}

// === เปลี่ยนหน้า ===
function goPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  if(name==='home') document.getElementById('homePage').classList.remove('hidden');
  if(name==='profile'){
    document.getElementById('profilePage').classList.remove('hidden');
    renderVideoList();
  }
}
document.querySelectorAll('[data-goto]').forEach(b=>{
  b.addEventListener('click',()=>goPage(b.dataset.goto));
});

// === โหลดวิดีโอ — ทำงานตรงนี้ ===
document.getElementById('uploadBtn').addEventListener('click',()=>videoInput.click());
document.getElementById('uploadBtn2').addEventListener('click',()=>videoInput.click());

videoInput.addEventListener('change',e=>{
  const f = e.target.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  video.src = url;
  video.load();
  video.play();
  
  // บันทึกลงรายการ
  const newVid = {
    id: Date.now().toString(),
    name: f.name,
    url: url,
    time: new Date().toLocaleString('th-TH')
  };
  videoList.unshift(newVid);
  localStorage.setItem(STORAGE.videos, JSON.stringify(videoList));
  renderVideoList();
  goPage('home');
});

// === แสดงรายการวิดีโอในโปรไฟล์ ===
function renderVideoList(){
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = '';
  if(videoList.length === 0){
    grid.innerHTML = '<div class="empty-txt">ยังไม่มีวิดีโอ</div>';
    return;
  }
  videoList.forEach((v,i)=>{
    const d = document.createElement('div');
    d.className = 'video-item';
    d.innerHTML = `
      <span class="video-play">▶</span>
      <button class="video-del" data-i="${i}">×</button>
    `;
    // กดเล่น
    d.addEventListener('click',e=>{
      if(e.target.classList.contains('video-del')) return;
      video.src = v.url;
      video.load();
      video.play();
      goPage('home');
    });
    // ลบ
    d.querySelector('.video-del').addEventListener('click',e=>{
      e.stopPropagation();
      if(confirm('ลบวิดีโอนี้?')){
        videoList.splice(i,1);
        localStorage.setItem(STORAGE.videos, JSON.stringify(videoList));
        renderVideoList();
      }
    });
    grid.appendChild(d);
  });
}

// === เปลี่ยนรูปโปรไฟล์ ===
document.getElementById('avatarSideBtn').addEventListener('click',()=>avatarInput.click());
document.getElementById('avatarBigBtn').addEventListener('click',()=>avatarInput.click());

avatarInput.addEventListener('change',e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = function(ev){
    localStorage.setItem(STORAGE.avatar, ev.target.result);
    syncAvatar();
  };
  r.readAsDataURL(f);
});

// === แชร์ ===
async function doShare(){
  const text = 'แอปวิดีโอของคนไทย ThaiPodee';
  if(navigator.share){
    try{
      await navigator.share({title:'ThaiPodee',text:text,url:location.href});
    }catch{
      await navigator.clipboard.writeText(location.href);
      alert('คัดลอกลิงก์แล้ว ✅');
    }
  }else{
    await navigator.clipboard.writeText(location.href);
    alert('คัดลอกลิงก์แล้ว ✅ ส่งให้เพื่อนได้เลย');
  }
}
document.getElementById('shareBtn').addEventListener('click',doShare);
document.getElementById('shareProfile').addEventListener('click',doShare);

// === จุดเวลาเล็ก ลากได้ ===
video.addEventListener('timeupdate',()=>{
  if(!video.duration || isDragging) return;
  const pct = video.currentTime / video.duration;
  progressDot.style.left = (pct*100) + '%';
});

function seekTo(x){
  if(!video.duration) return;
  const rect = progressBar.getBoundingClientRect();
  let pct = (x - rect.left) / rect.width;
  pct = Math.max(0, Math.min(1, pct));
  video.currentTime = pct * video.duration;
  progressDot.style.left = (pct*100) + '%';
}

progressBar.addEventListener('mousedown',e=>{isDragging=true;seekTo(e.clientX);});
progressBar.addEventListener('touchstart',e=>{isDragging=true;seekTo(e.touches[0].clientX);},{passive:true});
document.addEventListener('mousemove',e=>{if(!isDragging)return;seekTo(e.clientX);});
document.addEventListener('touchmove',e=>{if(!isDragging)return;seekTo(e.touches[0].clientX);},{passive:true});
document.addEventListener('mouseup',()=>isDragging=false);
document.addEventListener('touchend',()=>isDragging=false);

// เล่น/หยุด
document.getElementById('videoWrap').addEventListener('click',e=>{
  if(e.target.closest('.progress-bar')) return;
  if(video.paused || video.muted){
    video.muted = false;
    video.play();
  }else{
    video.pause();
  }
});

// === เริ่ม ===
syncNames();
syncAvatar();
document.getElementById('statLike').textContent = totalLikes;

// ถูกใจ
document.getElementById('likeBtn').addEventListener('click',()=>{
  isLiked = !isLiked;
  totalLikes += isLiked ? 1 : -1;
  localStorage.setItem(STORAGE.likes, totalLikes);
  document.getElementById('likeIcon').textContent = isLiked ? '❤️' : '🤍';
  document.getElementById('likeCount').textContent = totalLikes;
  document.getElementById('statLike').textContent = totalLikes;
});

// บันทึก
let saved = false;
document.getElementById('saveBtn').addEventListener('click',()=>{
  saved = !saved;
  document.getElementById('saveIcon').textContent = saved ? '⬛' : '⬜';
});
</script>
</body>
</html>
