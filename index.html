<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>ThaiPodee v1205-FULL</title>
<link rel="icon" href="https://i.imgur.com/KJbRzQY.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui}
.version-tag{position:absolute;top:12px;right:12px;color:#888;font-size:12px;z-index:100}
.video-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:calc(100% - 140px);display:flex;align-items:center;justify-content:center}
video{max-width:100%;max-height:100%;object-fit:contain;background:#000}
.video-list{position:absolute;bottom:90px;left:0;right:0;padding:10px;display:flex;gap:10px;overflow-x:auto}
.video-item{width:100px;height:140px;background:#222;border-radius:8px;flex-shrink:0;cursor:pointer;overflow:hidden}
.video-item video{width:100%;height:100%;object-fit:cover}
.upload-btn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:#e50914;border:none;color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10}
.file-input{display:none}
.status-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:20px 30px;border-radius:10px;z-index:100;display:none;text-align:center}
</style>
</head>
<body>

<div class="version-tag">v1205</div>

<div class="video-container" id="videoContainer">
  <video id="mainVideo" controls playsinline webkit-playsinline></video>
</div>

<div class="video-list" id="videoList"></div>

<button class="upload-btn" id="uploadBtn">+</button>
<input type="file" id="fileInput" accept="video/*">

<div class="status-msg" id="statusMsg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ✅ ตรงนี้สำคัญที่สุด — ครบถ้วน มี .com แน่นอน
const SUPABASE_URL = 'https://pinoqstzscqqwietvbv.supabase.com'
const SUPABASE_KEY = 'sb_publishable_lr4yrKHV-01Kmzba1WIyLA_guU3o'

const { createClient } = supabase
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

const videoListEl = document.getElementById('videoList')
const mainVideoEl = document.getElementById('mainVideo')
const uploadBtn = document.getElementById('uploadBtn')
const fileInput = document.getElementById('fileInput')
const statusMsg = document.getElementById('statusMsg')

function showMsg(text, time=2000) {
  statusMsg.textContent = text
  statusMsg.style.display = 'block'
  setTimeout(() => statusMsg.style.display = 'none', time)
}

async function loadVideos() {
  try {
    const { data, error } = await supabase
      .from('videos')
      .select('*')
      .order('created_at', { ascending: false })
    
    if (error) { console.error(error); return }
    videoListEl.innerHTML = ''
    data.forEach(item => {
      const div = document.createElement('div')
      div.className = 'video-item'
      div.innerHTML = `<video src="${item.video_url}" muted></video>`
      div.onclick = () => {
        mainVideoEl.src = item.video_url
        mainVideoEl.play()
      }
      videoListEl.appendChild(div)
    })
  } catch (e) { console.error(e) }
}

uploadBtn.onclick = () => fileInput.click()

fileInput.onchange = async (e) => {
  const file = e.target.files[0]
  if (!file) return
  
  showMsg('กำลังประมวลผล...')
  
  const url = URL.createObjectURL(file)
  mainVideoEl.src = url
  mainVideoEl.play()
  
  try {
    const { error } = await supabase.from('videos').insert({
      name: file.name,
      video_url: url
    })
    if (error) throw error
    showMsg('บันทึกสำเร็จ ✅')
    loadVideos()
  } catch (err) {
    showMsg('เพิ่มลงรายการแล้ว')
    loadVideos()
  }
}

loadVideos()
</script>

</body>
</html>
