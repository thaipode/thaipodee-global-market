   ThaiPodee v1107 — เหลือแค่ 9:16 กับ 16:9 ตามที่ต้องการ
   อัปเดต: 29 กันยายน 2569 20:54 น.
   --------------------------------------------------------------
   ✅ แสดงแค่ 9:16 กับ 16:9 เท่านั้น
   ✅ ไม่มีคำอธิบายเพิ่ม ไม่ใส่ขนาดพิกเซล
   ✅ ทุกอย่างทำงานเหมือนเดิมครบถ้วน
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff; font-family: -apple-system, sans-serif;
  }

  .version-tag {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.55); color: #fff;
    font-size: 12px; padding: 3px 8px; border-radius: 10px;
    z-index: 100;
  }

  /* === คู่มืออัตราส่วน — เหลือแค่ 9:16 กับ 16:9 === */
  .ratio-guide {
    position: absolute; top: 40px; right: 12px;
    background: rgba(0,0,0,0.65);
    color: #fff; font-size: 13px; line-height: 1.8;
    padding: 10px 12px; border-radius: 8px;
    z-index: 100; font-weight: 600;
  }

  .top-tabs {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 24px; z-index: 99;
  }
  .tab-item {
    font-size: 15px; color: #aaa; padding-bottom: 4px;
    border-bottom: 2px solid transparent;
  }
  .tab-item.active {
    color: #fff; border-bottom-color: #fff; font-weight: 600;
  }
  .search-icon {
    position: absolute; top: 12px; right: 130px; font-size: 20px; z-index: 99;
  }

  #container {
    width: 100%; height: 100vh; overflow: hidden; position: relative;
    background: #000;
  }
  #videoWrapper {
    width: 100%; height: 100%; transition: transform 0.15s ease-out;
    position: relative; z-index: 1;
  }
  .video-slide {
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000; position: relative;
  }

  video {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000; z-index: 2; display: block;
  }
  video.is-portrait { object-fit: cover; }
  video.is-landscape { object-fit: contain; }

  video::cue { display: none !important; }
  [id*="silent"], [class*="silent"], .debug, .meta {
    display: none !important; opacity: 0 !important; visibility: hidden !important; height: 0 !important;
  }

  .video-info {
    position: absolute; bottom: 85px; left: 12px; right: 70px;
    z-index: 5; pointer-events: none;
  }
  .info-username {
    font-weight: 600; font-size: 14px; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .follow-badge {
    background: #fff; color: #000; font-size: 10px; padding: 1px 6px;
    border-radius: 4px; font-weight: bold;
  }
  .info-title { font-size: 13px; margin-bottom: 4px; color: #f0f0f0; }
  .info-tags { font-size: 12px; color: #ccc; }

  .side-icons {
    position: absolute; right: 10px; bottom: 95px;
    display: flex; flex-direction: column; gap: 22px;
    z-index: 5; align-items: center;
  }
  .icon-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    font-size: 22px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .icon-count { font-size: 11px; color: #fff; }
  .profile-icon-wrap { position: relative; }
  .follow-plus {
    position: absolute; bottom: -4px; right: -4px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #ff2d55; color: #fff; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }

  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0; height: 65px;
    background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.7), transparent);
    display: flex; justify-content: space-around; align-items: center;
    z-index: 6;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-btn {
    background: none; border: none; color: #fff;
    font-size: 22px; cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
  }
  .nav-label { font-size: 10px; }
  .nav-main {
    width: 52px; height: 36px; border-radius: 8px;
    background: #ff2d55; display: flex; align-items: center;
    justify-content: center; font-size: 24px; border: none;
    cursor: pointer;
  }

  #fileInput { display: none; }
</style>
</head>
<body>

<input type="file" id="fileInput" accept="video/*">

<div id="container">
  <div class="version-tag">v1107</div>

  <!-- === แค่นี้พอแล้ว === -->
  <div class="ratio-guide">
    9 : 16<br>
    16 : 9
  </div>

  <div class="top-tabs">
    <span class="tab-item">กำลังติดตาม</span>
    <span class="tab-item active">สำหรับคุณ</span>
  </div>
  <span class="search-icon">🔍</span>

  <div id="videoWrapper"></div>

  <div class="video-info">
    <div class="info-username">
      @thaipodee
      <span class="follow-badge">ติดตาม</span>
    </div>
    <div class="info-title">ThaiPodee — แชร์วิดีโอและสินค้า</div>
    <div class="info-tags">#ThaiPodee #แชร์วิดีโอ #สินค้า #ไทย</div>
  </div>

  <div class="side-icons">
    <div class="icon-wrap">
      <div class="profile-icon-wrap">
        <button class="icon-btn">👤</button>
        <span class="follow-plus">+</span>
      </div>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">❤️</button>
      <span class="icon-count">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">💬</button>
      <span class="icon-count">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">📌</button>
      <span class="icon-count">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">⬆️</button>
      <span class="icon-count">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">🎵</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn">🏠<span class="nav-label">หน้าหลัก</span></button>
    <button class="nav-btn">🛍️<span class="nav-label">ร้านค้า</span></button>
    <button class="nav-btn nav-main" id="uploadBtn">+</button>
    <button class="nav-btn">💬<span class="nav-label">ข้อความ</span></button>
    <button class="nav-btn">👤<span class="nav-label">โปรไฟล์</span></button>
  </nav>
</div>

<script>
const container = document.getElementById('container');
const wrapper = document.getElementById('videoWrapper');
const fileInput = document.getElementById('fileInput');

let videos = [];
let currentIndex = 0;

function unlockSound() {
  document.querySelectorAll('video').forEach(vid => {
    vid.muted = false;
    vid.play().catch(() => {});
  });
}

function goToSlide(index) {
  if (!videos.length) return;
  if (index < 0) index = 0;
  if (index >= videos.length) index = videos.length - 1;
  currentIndex = index;
  wrapper.style.transform = `translateY(-${currentIndex * 100}vh)`;
  updatePlayState();
}

function updatePlayState() {
  document.querySelectorAll('video').forEach((vid, idx) => {
    if (idx === currentIndex) {
      vid.muted = false;
      vid.play().catch(() => {});
    } else {
      vid.pause();
      vid.currentTime = 0;
    }
  });
}

container.addEventListener('click', unlockSound);
container.addEventListener('touchstart', unlockSound);

let startY = 0, isDragging = false, offsetY = 0;
container.addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
  isDragging = true;
  offsetY = 0;
});
container.addEventListener('touchmove', e => {
  if (!isDragging) return;
  offsetY = e.touches[0].clientY - startY;
  wrapper.style.transform = `translateY(calc(-${currentIndex * 100}vh + ${offsetY * 0.3}px))`;
});
container.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  if (offsetY < -60 && currentIndex < videos.length - 1) goToSlide(currentIndex + 1);
  else if (offsetY > 60 && currentIndex > 0) goToSlide(currentIndex - 1);
  else goToSlide(currentIndex);
});

function setVideoFit(video) {
  video.addEventListener('loadedmetadata', () => {
    const isPortrait = video.videoHeight > video.videoWidth;
    video.classList.toggle('is-portrait', isPortrait);
    video.classList.toggle('is-landscape', !isPortrait);
  });
}

async function loadVideos() {
  videos = [
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' }
  ];
  renderVideos();
  goToSlide(0);
}

function renderVideos() {
  wrapper.innerHTML = '';
  videos.forEach(v => {
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    const video = document.createElement('video');
    video.src = v.src;
    video.loop = true;
    video.playsInline = true;
    video.preload = 'auto';
    video.muted = true;
    setVideoFit(video);
    slide.appendChild(video);
    wrapper.appendChild(slide);
  });
}

document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  videos.unshift({ src: url });
  renderVideos();
  goToSlide(0);
});

document.addEventListener('DOMContentLoaded', loadVideos);
</script>

</body>
</html>
