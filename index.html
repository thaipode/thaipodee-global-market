<!-- ==============================================================
   ThaiPodee v1079 — ปุ่มกดได้ชัดเจน + วิดีโอเล่นทันที
   อัปเดต: 29 กันยายน 2569 19:14 น.
   --------------------------------------------------------------
   ปัญหา: ปุ่มบวกสีแดงโดนบัง กดไม่ได้
   แก้ไข: ยก z-index สูงขึ้น ไม่มีอะไรบัง → กดได้เลย
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff; font-family: sans-serif;
  }
  #container {
    width: 100%; height: 100vh; overflow: hidden; position: relative;
  }
  #videoWrapper {
    width: 100%; transition: transform 0.15s ease-out;
  }
  .video-slide {
    width: 100%; height: 100vh; display: flex;
    align-items: center; justify-content: center;
    position: relative;
    background: #000;
  }
  video {
    width: 100%; height: 100%; object-fit: contain; background: #000;
  }
  .side-icons {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 24px;
    align-items: center; z-index: 15;
  }
  .icon-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: transparent; border: none; color: #fff;
    font-size: 26px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    pointer-events: auto;
  }
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: rgba(0,0,0,0.85); display: flex;
    justify-content: space-around; align-items: center;
    z-index: 99; /* สูงสุด ไม่มีอะไรบัง */
    pointer-events: auto;
  }
  .nav-btn {
    background: none; border: none; color: #fff; font-size: 22px;
    cursor: pointer; padding: 6px 12px;
    pointer-events: auto;
  }
  .nav-main {
    width: 56px; height: 56px; border-radius: 50%;
    background: #ff0000; display: flex; align-items: center;
    justify-content: center; transform: translateY(-10px);
    font-size: 28px; border: none; cursor: pointer;
    pointer-events: auto;
  }
</style>
</head>
<body>

<div id="container">
  <div id="videoWrapper"></div>

  <div class="side-icons">
    <button class="icon-btn">👤</button>
    <button class="icon-btn">❤️</button>
    <button class="icon-btn">💬</button>
    <button class="icon-btn">🔁</button>
    <button class="icon-btn">⬆️</button>
    <button class="icon-btn">📦</button>
    <button class="icon-btn">⋮</button>
  </div>
</div>

<script>
const container = document.getElementById('container');
const wrapper = document.getElementById('videoWrapper');
let videos = [];
let currentIndex = 0;
let startY = 0;
let isDragging = false;
let offsetY = 0;

function goToSlide(index) {
  if (!videos || videos.length === 0) return;
  if (index < 0) index = 0;
  if (index >= videos.length) index = videos.length - 1;
  currentIndex = index;
  wrapper.style.transform = `translateY(-${currentIndex * 100}vh)`;
  updatePlayState();
}

function updatePlayState() {
  document.querySelectorAll('video').forEach((vid, idx) => {
    if (idx === currentIndex) vid.play().catch(() => {});
    else { vid.pause(); vid.currentTime = 0; }
  });
}

if (container) {
  container.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    isDragging = true;
    offsetY = 0;
  });

  container.addEventListener('touchmove', e => {
    if (!isDragging) return;
    offsetY = e.touches[0].clientY - startY;
    wrapper.style.transform = `translateY(calc(-${currentIndex * 100}vh + ${offsetY * 0.3}px))`;
  });

  container.addEventListener('touchend', () => {
    if (!isDragging) return;
    isDragging = false;
    if (offsetY < -60 && currentIndex < videos.length - 1) goToSlide(currentIndex + 1);
    else if (offsetY > 60 && currentIndex > 0) goToSlide(currentIndex - 1);
    else goToSlide(currentIndex);
  });
}

async function loadVideos() {
  videos = [
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' }
  ];
  renderVideos();
  goToSlide(0);
}

function renderVideos() {
  wrapper.innerHTML = '';
  videos.forEach(v => {
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    slide.innerHTML = `<video src="${v.src}" autoplay muted loop playsinline preload="auto"></video>`;
    wrapper.appendChild(slide);
  });
  addBottomNav();
}

function addBottomNav() {
  const nav = document.createElement('nav');
  nav.className = 'bottom-nav';
  nav.innerHTML = `
    <button class="nav-btn">🏠</button>
    <button class="nav-btn">🔍</button>
    <button class="nav-btn nav-main" id="uploadBtn">+</button>
    <button class="nav-btn">📦</button>
    <button class="nav-btn">👤</button>
  `;
  document.body.appendChild(nav);

  // กดปุ่มบวก → แจ้งเตือนทำงาน
  const uploadBtn = document.getElementById('uploadBtn');
  if (uploadBtn) {
    uploadBtn.addEventListener('click', () => {
      alert('กำลังเปิดหน้าอัปโหลดวิดีโอ...');
    });
  }
}

document.addEventListener('DOMContentLoaded', loadVideos);
</script>

</body>
</html>
