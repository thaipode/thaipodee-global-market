<script>
const VER = '2.6';

// ==================== บีบอัดรูปอัตโนมัติ — กุญแจสำคัญ ====================
async function compressImage(file, maxWidth = 1080, quality = 0.85) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            
            // ปรับขนาดไม่ให้กว้างเกินไป
            if (w > maxWidth) {
                h = Math.round(h * maxWidth / w);
                w = maxWidth;
            }
            
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            
            // แปลงเป็น JPG บีบอัด
            resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
    });
}

// ==================== ระบบจัดเก็บ ====================
const DB = {
    _key: 'thaipodee_global_v2',
    
    _read() {
        try { 
            const data = localStorage.getItem(this._key);
            return data ? JSON.parse(data) : { posts:[], users:{} };
        } catch (e) { 
            console.error('อ่านข้อมูลไม่ได้:', e);
            return { posts:[], users:{} }; 
        }
    },
    
    _write(obj) {
        try {
            localStorage.setItem(this._key, JSON.stringify(obj));
            return true;
        } catch (e) {
            console.error('บันทึกไม่ได้:', e.name, e.message);
            alert('❌ พื้นที่เต็ม! ลองลบโพสต์เก่าบางรายการหรือใช้รูปขนาดเล็กลงครับ');
            return false;
        }
    },
    
    getMyId() {
        let id = localStorage.getItem('thaipodee_myid_v2');
        if (!id) {
            id = 'u_' + Math.random().toString(36).slice(2, 12);
            localStorage.setItem('thaipodee_myid_v2', id);
        }
        return id;
    },
    
    saveUser(uid, name, avatar) {
        const d = this._read();
        d.users[uid] = {
            name: name.startsWith('@') ? name : '@' + name,
            avatar: avatar || null,
            updated: Date.now()
        };
        return this._write(d);
    },
    
    getUser(uid) {
        const d = this._read();
        return d.users[uid] || { name: '@ผู้ใช้', avatar: null };
    },
    
    addPost(uid, type, dataUrl, caption, music) {
        const d = this._read();
        d.posts.unshift({
            id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            uid,
            type,
            data: dataUrl,
            caption: caption || 'แชร์สิ่งดี ๆ จาก Thaipodee Global Market ✨',
            music: music || 'เสียงต้นฉบับ',
            likes: 0, comments: 0, saves: 0, shares: 0,
            time: Date.now()
        });
        return this._write(d);
    },
    
    listPosts() {
        return this._read().posts;
    },
    
    likePost(pid, current) {
        const d = this._read();
        const p = d.posts.find(x => x.id === pid);
        if (p) { 
            p.likes = current; 
            return this._write(d);
        }
        return false;
    }
};

const ME = DB.getMyId();
let pendingMedia = null;
let pendingAudio = null;
let pendingMediaDataUrl = null;
let tempAvatar = null;

// ==================== เปลี่ยนหน้า ====================
function showPage(pageId) {
    console.log('ไปที่หน้า:', pageId);
    
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    if (pageId === 'feed') {
        document.getElementById('feed-container').style.display = 'block';
        document.getElementById('nav-home').classList.add('active');
        renderFeed();
    } else if (pageId === 'profile') {
        document.getElementById('feed-container').style.display = 'block';
        document.getElementById('page-profile').classList.add('active');
        document.getElementById('nav-profile').classList.add('active');
        loadMyProfile();
    } else if (pageId === 'page-sound') {
        document.getElementById('feed-container').style.display = 'block';
        document.getElementById('page-sound').classList.add('active');
    }
}

// ==================== แสดงโพสต์ ====================
function renderFeed() {
    const box = document.getElementById('feed-container');
    const posts = DB.listPosts();
    
    box.innerHTML = '';
    
    if (posts.length === 0) {
        const demo = document.createElement('div');
        demo.className = 'post-item';
        demo.innerHTML = `
            <div class="media-area">
                <div class="demo-screen">
                    <div>
                        <div class="demo-icon">🌏</div>
                        <div class="demo-title">Thaipodee Global Market</div>
                        <div class="demo-desc">แพลตฟอร์มแชร์และซื้อขายสินค้าของคนไทย<br>รอคุณเป็นคนแรกที่แชร์นะครับ ✨</div>
                        <div class="demo-tip">👇 กดปุ่ม + ด้านล่าง เพื่อโพสต์ภาพหรือวิดีโอ</div>
                    </div>
                </div>
            </div>
            
            <div class="post-info">
                <div class="post-username" id="demo-avatar-link">@Thaipodee_Official 👆 แตะเพื่อตั้งค่าโปรไฟล์</div>
                <div class="post-caption">ยินดีต้อนรับสู่ Thaipodee Global Market — แชร์สิ่งดี ๆ สู่สากล 🌏✨</div>
                <div class="post-music">🎵 เพลงประกอบต้อนรับ</div>
            </div>
            
            <div class="side-buttons">
                <div class="side-btn" id="demo-avatar-btn">
                    <div class="avatar-holder">
                        <div class="avatar-img" style="background:linear-gradient(135deg,#ffd700,#ff8c00)"></div>
                    </div>
                </div>
                <div class="side-btn"><span class="icon">❤️</span><span class="count">0</span></div>
                <div class="side-btn"><span class="icon">💬</span><span class="count">0</span></div>
                <div class="side-btn"><span class="icon">⭐</span><span class="count">0</span></div>
                <div class="side-btn"><span class="icon">↗️</span><span class="count">0</span></div>
                <div class="side-btn"><span class="icon">🎵</span></div>
            </div>
        `;
        box.appendChild(demo);
        
        document.getElementById('demo-avatar-btn').onclick = () => showPage('profile');
        document.getElementById('demo-avatar-link').onclick = () => showPage('profile');
        return;
    }
    
    posts.forEach(post => {
        const author = DB.getUser(post.uid);
        const el = document.createElement('div');
        el.className = 'post-item';
        
        let media = '';
        if (post.type === 'video') {
            media = `<video src="${post.data}" loop playsinline controls></video>`;
        } else {
            media = `<img src="${post.data}" alt="โพสต์">`;
        }
        
        const avatarBg = author.avatar ? `background-image:url(${author.avatar})` : '';
        
        el.innerHTML = `
            <div class="media-area">${media}</div>
            
            <div class="post-info">
                <div class="post-username" data-uid="${post.uid}">
                    ${author.name} ${post.uid === ME ? '👆' : ''}
                </div>
                <div class="post-caption">${post.caption}</div>
                <div class="post-music">🎵 ${post.music}</div>
            </div>
            
            <div class="side-buttons">
                <div class="side-btn avatar-clickable" data-uid="${post.uid}">
                    <div class="avatar-holder">
                        <div class="avatar-img" style="${avatarBg}"></div>
                        ${!author.avatar && post.uid === ME ? '<div class="avatar-badge">+</div>' : ''}
                    </div>
                </div>
                <div class="side-btn like-btn" data-pid="${post.id}" data-n="${post.likes}">
                    <span class="icon">❤️</span><span class="count">${post.likes}</span>
                </div>
                <div class="side-btn"><span class="icon">💬</span><span class="count">${post.comments}</span></div>
                <div class="side-btn"><span class="icon">⭐</span><span class="count">${post.saves}</span></div>
                <div class="side-btn"><span class="icon">↗️</span><span class="count">${post.shares}</span></div>
                <div class="side-btn"><span class="icon">🎵</span></div>
            </div>
        `;
        box.appendChild(el);
    });
    
    document.querySelectorAll('.avatar-clickable').forEach(btn => {
        if (btn.dataset.uid === ME) btn.onclick = () => showPage('profile');
    });
    document.querySelectorAll('.post-username[data-uid]').forEach(btn => {
        if (btn.dataset.uid === ME) btn.onclick = () => showPage('profile');
    });
    
    bindLikes();
}

function bindLikes() {
    document.querySelectorAll('.like-btn').forEach(b => {
        b.onclick = () => {
            const pid = b.dataset.pid;
            const n = parseInt(b.dataset.n) + 1;
            b.dataset.n = n;
            b.querySelector('.count').textContent = n;
            DB.likePost(pid, n);
        };
    });
}

// ==================== โปรไฟล์ ====================
function loadMyProfile() {
    const me = DB.getUser(ME);
    document.getElementById('name-input').value = me.name.replace('@', '');
    if (me.avatar) {
        document.getElementById('my-avatar-preview').style.backgroundImage = `url(${me.avatar})`;
    } else {
        document.getElementById('my-avatar-preview').style.backgroundImage = '';
    }
}

document.getElementById('avatar-file').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    // บีบอัดรูปโปรไฟล์ด้วย
    tempAvatar = await compressImage(f, 200, 0.9);
    document.getElementById('my-avatar-preview').style.backgroundImage = `url(${tempAvatar})`;
};

document.getElementById('avatar-tap-hint').onclick = () => {
    document.getElementById('avatar-file').click();
};

document.getElementById('save-profile').onclick = () => {
    const name = document.getElementById('name-input').value.trim();
    if (!name) return alert('กรุณาใส่ชื่อครับ');
    
    const ok = DB.saveUser(ME, name, tempAvatar);
    if (!ok) return;
    
    tempAvatar = null;
    alert('✅ บันทึกสำเร็จ!');
    showPage('feed');
};

// ==================== เลือกไฟล์โพสต์ — บีบอัดอัตโนมัติ ====================
document.getElementById('media-file').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    
    pendingMedia = {
        type: f.type.startsWith('video') ? 'video' : 'image',
        file: f
    };
    
    const previewArea = document.getElementById('media-preview-area');
    
    if (pendingMedia.type === 'image') {
        // บีบอัดรูปก่อนเก็บ — สำคัญมาก!
        pendingMediaDataUrl = await compressImage(f, 1280, 0.85);
        previewArea.innerHTML = `<img src="${pendingMediaDataUrl}" class="preview-img" alt="ตัวอย่าง">`;
    } else {
        // วิดีโอเก็บตามเดิม
        pendingMediaDataUrl = URL.createObjectURL(f);
        previewArea.innerHTML = `<video src="${pendingMediaDataUrl}" class="preview-img" controls autoplay muted loop style="max-height:300px;"></video>`;
    }
    
    showPage('page-sound');
};

document.getElementById('audio-file').onchange = e => {
    const f = e.target.files[0];
    pendingAudio = f || null;
    document.getElementById('audio-status').textContent = f ? '✅ เลือกแล้ว: ' + f.name : 'ยังไม่ได้เลือก — จะใช้เสียงต้นฉบับ';
};

// ==================== กดโพสต์ ====================
document.getElementById('do-post').onclick = () => {
    if (!pendingMedia || !pendingMediaDataUrl) {
        alert('❌ กรุณาเลือกภาพหรือวิดีโอก่อนครับ');
        return;
    }
    
    const ok = DB.addPost(
        ME,
        pendingMedia.type,
        pendingMediaDataUrl,
        null,
        pendingAudio ? pendingAudio.name : 'เสียงต้นฉบับ'
    );
    
    if (!ok) return; // แจ้งเตือนจากระบบแล้ว
    
    // เคลียร์
    pendingMedia = null;
    pendingAudio = null;
    pendingMediaDataUrl = null;
    document.getElementById('media-file').value = '';
    document.getElementById('audio-file').value = '';
    document.getElementById('audio-status').textContent = 'ยังไม่ได้เลือก — จะใช้เสียงต้นฉบับ';
    document.getElementById('media-preview-area').innerHTML = '';
    
    alert('✅ โพสต์สำเร็จ! เลื่อนขึ้นดูข้างบนนะครับ');
    showPage('feed');
};

// ==================== ปุ่มกลับ ====================
document.getElementById('back-sound').onclick = () => {
    pendingMedia = null;
    pendingAudio = null;
    pendingMediaDataUrl = null;
    document.getElementById('media-file').value = '';
    document.getElementById('audio-file').value = '';
    document.getElementById('audio-status').textContent = 'ยังไม่ได้เลือก — จะใช้เสียงต้นฉบับ';
    document.getElementById('media-preview-area').innerHTML = '';
    showPage('feed');
};

document.getElementById('back-profile').onclick = () => showPage('feed');

document.querySelectorAll('.nav-item[data-goto]').forEach(item => {
    item.onclick = () => {
        const target = item.dataset.goto;
        if (target === 'market' || target === 'messages') {
            alert('🚧 กำลังพัฒนา — ขอบคุณที่รอคอยครับ');
            return;
        }
        showPage(target);
    };
});

async function checkUpdate() {
    try {
        const res = await fetch(location.href, { cache: 'no-store' });
        const text = await res.text();
        if (!text.includes(`v${VER}`)) {
            document.getElementById('update-notice').style.display = 'block';
        }
    } catch (e) {}
}

renderFeed();
checkUpdate();
setInterval(checkUpdate, 30000);

console.log('✅ Thaipodee v2.6 — บีบอัดรูปอัตโนมัติ ปัญหาพื้นที่ลดลงแล้ว!');
</script>
</body>
</html>
