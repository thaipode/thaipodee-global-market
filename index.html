<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THAIPODEE V2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        html, body {
            background: #000; color: #fff;
            height: 100%; overflow: hidden;
            position: fixed; inset: 0;
        }

        /* Header */
        .header {
            position: absolute; top: 0; left: 0; right: 0; height: 50px;
            background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .logo { width: 28px; height: 28px; border-radius: 4px; background: #333; }
        .title { font-size: 16px; font-weight: bold; }
        .version { font-size: 11px; color: #888; background: #222; padding: 2px 6px; border-radius: 4px; }
        .menu-btn { font-size: 24px; cursor: pointer; padding: 8px; }

        /* Video Area — แสดงวิดีโอจริง */
        .video-area {
            position: absolute; top: 50px; left: 0; right: 0; bottom: 70px;
            background: linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            overflow: hidden;
        }
        .video-placeholder {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            color: #ddd; font-size: 16px;
            text-align: center; padding: 20px;
        }
        .video-player {
            width: 100%; height: 100%;
            object-fit: contain;
            display: none;
            background: #000;
        }
        .video-text {
            position: absolute; bottom: 90px; left: 16px; right: 80px;
            color: #fff; font-size: 13px; line-height: 1.5;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* Right Buttons */
        .side-buttons {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 28px; z-index: 60;
        }
        .side-btn {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; padding: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .side-btn:active { transform: scale(0.9); opacity: 0.8; }
        .side-icon { font-size: 28px; }
        .side-label { font-size: 11px; color: #fff; margin-top: 2px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        /* Bottom Nav */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            background: rgba(0,0,0,0.9); border-top: 1px solid #333;
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            cursor: pointer; padding: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-item:active { opacity: 0.7; }
        .nav-icon { font-size: 20px; }
        .nav-label { font-size: 11px; color: #aaa; }
        .plus-btn {
            width: 44px; height: 32px; background: #fff; border-radius: 6px;
            color: #000; font-size: 22px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }

        /* Upload Modal */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 300; display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #111; border-radius: 12px; padding: 24px; width: 100%; max-width: 360px;
            border: 1px solid #333;
        }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .input-field {
            width: 100%; padding: 12px; margin-bottom: 12px;
            background: #222; border: 1px solid #444; border-radius: 8px;
            color: #fff; font-size: 14px;
        }
        .file-select-row {
            display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
        }
        .file-select-btn {
            padding: 10px 14px; background: #333; border: 1px solid #555;
            border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer;
            white-space: nowrap;
        }
        .file-name {
            flex: 1; font-size: 13px; color: #90ee90;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .progress-container {
            width: 100%; height: 8px; background: #333; border-radius: 4px;
            margin: 12px 0; display: none;
        }
        .progress-bar {
            height: 100%; background: #2563eb; width: 0%; border-radius: 4px;
            transition: width 0.3s ease;
        }
        .status-text {
            font-size: 13px; color: #aaa; text-align: center; margin-top: 8px;
            display: none;
        }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            margin-top: 8px;
        }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:disabled { background: #333; opacity: 0.5; cursor: not-allowed; }
        .btn-close { background: #333; color: #fff; }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-left">
        <div class="logo"></div>
        <span class="title">THAIPODEE</span>
        <span class="version">V2026</span>
    </div>
    <div class="menu-btn" onclick="alert('เมนู: โปรไฟล์, ตะกร้า, คำสั่งซื้อ, คูปอง, ครีเอเตอร์, ข้อความ, โปรโมท, ขยายธุรกิจ')">☰</div>
</div>

<!-- Video Area — มีพื้นที่แสดงวิดีโอจริง -->
<div class="video-area">
    <div class="video-placeholder" id="videoPlaceholder">วิดีโอ / เนื้อหา<br>กด + เพื่ออัปโหลด</div>
    <video class="video-player" id="videoPlayer" controls loop muted playsinline></video>
    <p class="video-text" id="videoDesc">THAIPODEE V2026 — แพลตฟอร์มตลาดโลก จากไทยสู่ทั่วโลก 🌍</p>
</div>

<!-- Right Buttons -->
<div class="side-buttons">
    <div class="side-btn" onclick="alert('❤️ กดถูกใจแล้ว!')"><span class="side-icon">❤️</span><span class="side-label">ถูกใจ</span></div>
    <div class="side-btn" onclick="alert('💬 เปิดความคิดเห็น')"><span class="side-icon">💬</span><span class="side-label">ความคิด</span></div>
    <div class="side-btn" onclick="alert('↗️ แชร์แล้ว!')"><span class="side-icon">↗️</span><span class="side-label">แชร์</span></div>
    <div class="side-btn" onclick="alert('🛒 เข้าตะกร้าสินค้า')"><span class="side-icon">🛒</span><span class="side-label">ตะกร้า</span></div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
    <div class="nav-item" onclick="alert('🏠 หน้าแรก')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าแรก</span>
    </div>
    <div class="nav-item" onclick="alert('🔍 ค้นหา')">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">ค้นหา</span>
    </div>
    <div class="nav-item" onclick="openUpload()">
        <div class="plus-btn">+</div>
    </div>
    <div class="nav-item" onclick="alert('💬 ข้อความ')">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
    </div>
    <div class="nav-item" onclick="alert('👤 โปรไฟล์')">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<!-- Upload Modal -->
<div class="modal" id="uploadModal">
    <div class="modal-content">
        <h3 class="modal-title">อัปโหลดวิดีโอ / สร้างโพสต์</h3>
        <input type="text" class="input-field" id="descInput" placeholder="คำอธิบายวิดีโอ...">
        <div class="file-select-row">
            <input type="file" accept="video/*" id="videoInput" style="display:none" onchange="selectFile(this)">
            <button class="file-select-btn" onclick="document.getElementById('videoInput').click()">เลือกไฟล์</button>
            <span class="file-name" id="fileName">ยังไม่ได้เลือกไฟล์</span>
        </div>
        <div class="progress-container" id="progressBox">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="status-text" id="statusText"></p>
        <button class="btn btn-primary" id="uploadBtn" onclick="startUpload()">📤 อัปโหลด</button>
        <button class="btn btn-close" onclick="closeUpload()">ปิด</button>
    </div>
</div>

<script>
// ปิดป๊อปอัพติดตั้งแอป
window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    return false;
});

let selectedFile = null;
let videoBlobURL = null;

function openUpload() {
    document.getElementById('uploadModal').classList.add('show');
    resetUpload();
}
function closeUpload() {
    document.getElementById('uploadModal').classList.remove('show');
}
function resetUpload() {
    selectedFile = null;
    document.getElementById('fileName').textContent = 'ยังไม่ได้เลือกไฟล์';
    document.getElementById('descInput').value = '';
    document.getElementById('progressBox').style.display = 'none';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('statusText').style.display = 'none';
    document.getElementById('uploadBtn').disabled = false;
}
function selectFile(input) {
    if (input.files.length > 0) {
        selectedFile = input.files[0];
        document.getElementById('fileName').textContent = selectedFile.name;
    } else {
        selectedFile = null;
        document.getElementById('fileName').textContent = 'ยังไม่ได้เลือกไฟล์';
    }
}
function startUpload() {
    if (!selectedFile) {
        alert('กรุณาเลือกไฟล์วิดีโอก่อนครับ');
        return;
    }
    const desc = document.getElementById('descInput').value || 'ไม่มีคำอธิบาย';
    
    document.getElementById('uploadBtn').disabled = true;
    document.getElementById('progressBox').style.display = 'block';
    document.getElementById('statusText').style.display = 'block';
    document.getElementById('statusText').textContent = 'กำลังประมวลผล...';
    
    // จำลองความคืบหน้า
    let progress = 0;
    const bar = document.getElementById('progressBar');
    const timer = setInterval(() => {
        progress += Math.random() * 12;
        if (progress >= 100) {
            progress = 100;
            clearInterval(timer);
            document.getElementById('statusText').textContent = '✅ กำลังแสดงวิดีโอ...';
            showVideo(desc);
        }
        bar.style.width = progress + '%';
    }, 150);
}

// ✅ แสดงวิดีโอทันทีหลังอัปโหลด
function showVideo(desc) {
    // สร้าง URL ชั่วคราวจากไฟล์ที่เลือก
    if (videoBlobURL) URL.revokeObjectURL(videoBlobURL); // ลบเก่า
    videoBlobURL = URL.createObjectURL(selectedFile);
    
    // ซ่อนข้อความแจ้งเตือน + แสดงวิดีโอ
    document.getElementById('videoPlaceholder').style.display = 'none';
    const player = document.getElementById('videoPlayer');
    player.src = videoBlobURL;
    player.style.display = 'block';
    
    // อัปเดตคำอธิบาย
    document.getElementById('videoDesc').textContent = desc;
    
    // ปิดหน้าต่างอัปโหลด
    setTimeout(() => {
        closeUpload();
        alert('✅ อัปโหลดสำเร็จ!\nวิดีโอแสดงด้านบนแล้วครับ');
    }, 500);
}
</script>

</body>
</html>
