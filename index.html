<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ThaiPodee Global Market</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
html,body{height:100vh;overflow:hidden;background:#000;color:#fff;}
.page{display:none;position:absolute;inset:0;}
.page.active{display:block;}

/* พื้นที่วิดีโอ */
.video-wrap{position:absolute;inset:0;z-index:1;display:none;}
video{width:100%;height:100%;object-fit:contain;}

/* ข้อความต้อนรับตรงกลาง */
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:24px;}
.welcome-txt{color:#fff;font-size:16px;text-align:center;line-height:2;}

/* ข้อมูลด้านซ้ายล่าง */
.info-left{position:absolute;left:16px;bottom:90px;right:90px;z-index:8;display:none;}
.acc-name{font-weight:700;font-size:15px;margin-bottom:4px;}
.desc-txt{font-size:13px;color:#ddd;margin-bottom:6px;}
.music-line{font-size:12px;color:#aaa;display:flex;align-items:center;gap:6px;}

/* เมนูด้านขวา */
.menu-right{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:24px;align-items:center;z-index:15;}
.menu-btn{display:flex;flex-direction:column;align-items:center;gap:2px;}
.icon{font-size:28px;color:#fff;}
.num{font-size:11px;color:#fff;}

/* แถบเมนูด้านล่าง */
.nav-bottom{position:absolute;bottom:0;left:0;right:0;height:65px;display:flex;justify-content:space-around;align-items:flex-end;padding:8px 12px 16px;z-index:20;}
.nav-col{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px;}
.nav-icon{font-size:24px;color:#fff;}
.nav-label{font-size:10px;color:#aaa;}

/* ปุ่มอัปโหลดตรงกลางล่าง */
.upload-wrap{position:relative;cursor:pointer;}
.upload-btn{width:48px;height:32px;background:#fff;border-radius:6px;position:relative;}
.upload-btn::before{content:'';position:absolute;width:20px;height:2px;background:#000;top:50%;left:50%;transform:translate(-50%,-50%);}
.upload-btn::after{content:'';position:absolute;width:2px;height:20px;background:#000;left:50%;top:50%;transform:translate(-50%,-50%);}
#file-input{position:absolute;inset:0;opacity:0;cursor:pointer;}
</style>
</head>
<body>

<!-- หน้าหลัก -->
<div id="page-home" class="page active">
  <!-- พื้นที่วิดีโอ -->
  <div class="video-wrap" id="video-container">
    <video id="main-video" autoplay playsinline muted></video>
  </div>

  <!-- ข้อความต้อนรับ -->
  <div class="welcome" id="welcome-box">
    <p class="welcome-txt">🎥 กดปุ่ม + เพื่อเลือกวิดีโอ<br>เริ่มใช้งาน ThaiPodee Market</p>
  </div>

  <!-- ข้อมูลด้านซ้ายล่าง -->
  <div class="info-left" id="info-box">
    <div class="acc-name">@ThaiPodee_Master</div>
    <div class="desc-txt" id="caption">ยินดีต้อนรับสู่ ThaiPodee Market</div>
    <div class="music-line">🎵 เสียงต้นฉบับวิดีโอ</div>
  </div>

  <!-- เมนูด้านขวา -->
  <div class="menu-right" id="right-menu">
    <div class="menu-btn"><span class="icon">❤️</span><span class="num">0</span></div>
    <div class="menu-btn"><span class="icon">💬</span><span class="num">0</span></div>
    <div class="menu-btn"><span class="icon">⭐</span><span class="num">บันทึก</span></div>
    <div class="menu-btn"><span class="icon">↗️</span><span class="num">แชร์</span></div>
    <div class="menu-btn"><span class="icon">🎵</span></div>
  </div>

  <!-- แถบเมนูล่าง -->
  <div class="nav-bottom">
    <div class="nav-col"><span class="nav-icon">🏠</span><span class="nav-label">หน้าหลัก</span></div>
    <div class="nav-col"><span class="nav-icon">🛒</span><span class="nav-label">ตลาด</span></div>
    <div class="nav-col upload-wrap">
      <div class="upload-btn"></div>
      <input type="file" id="file-input" accept="video/*">
      <span class="nav-label">อัปโหลด</span>
    </div>
    <div class="nav-col"><span class="nav-icon">💬</span><span class="nav-label">ข้อความ</span></div>
    <div class="nav-col"><span class="nav-icon">👤</span><span class="nav-label">โปรไฟล์</span></div>
  </div>
</div>

<script>
// ตัวแปร
const fileInput = document.getElementById('file-input');
const videoContainer = document.getElementById('video-container');
const mainVideo = document.getElementById('main-video');
const welcomeBox = document.getElementById('welcome-box');
const infoBox = document.getElementById('info-box');
const rightMenu = document.getElementById('right-menu');

// เมื่อเลือกวิดีโอ
fileInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  // สร้างลิงก์ไฟล์
  const videoURL = URL.createObjectURL(file);
  
  // แสดงวิดีโอ ซ่อนข้อความต้อนรับ
  mainVideo.src = videoURL;
  videoContainer.style.display = 'block';
  welcomeBox.style.display = 'none';
  infoBox.style.display = 'block';
  rightMenu.style.display = 'flex';
  
  // เล่นวิดีโอ
  mainVideo.play().catch(err => console.log('Autoplay blocked:', err));
});
</script>

</body>
</html>
