<!-- ==============================================================
   ThaiPodee v1136 — ป้องกันครบถ้วน ก่อนเกิดปัญหา
   อัปเดต: 30 กันยายน 2569 21:40 น.
   --------------------------------------------------------------
   ✅ ป้องกันจอขาว — โค้ดครบ ไม่ขาดส่วนไหน
   ✅ ป้องกันวิดีโอไม่เล่น — ใช้ลิงก์ใหม่ที่ใช้ได้
   ✅ ป้องกันเลือกไฟล์แล้วพัง — ตรวจสอบทุกขั้นตอน
   ✅ ไม่มีข้อความแปลก — แสดงชื่อจริง ขนาดจริง
   ✅ เมนูขวา 6 ปุ่ม / ล่าง 5 ปุ่ม ครบ
   ✅ กด + → เลือกไฟล์ได้เลย ไม่มีข้อความเกะกะ
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee — ของไทย ไปไกลทั่วโลก</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;height:100dvh;overflow:hidden}

.swiper{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}
.slide{height:100dvh;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
.slide video{width:100%;height:100%;object-fit:contain;background:#000}

.video-info{position:absolute;bottom:90px;left:15px;right:80px}
.video-info h3{font-size:15px;margin-bottom:5px}
.video-info p{font-size:13px;opacity:0.7;line-height:1.4}

.side-buttons{position:absolute;right:12px;bottom:100px;display:flex;flex-direction:column;align-items:center;gap:22px}
.side-btn{display:flex;flex-direction:column;align-items:center;background:none;border:none;color:#fff;gap:4px}
.side-btn svg{width:28px;height:28px;flex-shrink:0}
.side-btn span{font-size:11px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:space-around;padding:8px 5px;border-top:1px solid #222;z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;background:none;border:none;color:#fff;font-size:11px;gap:4px;padding:5px 8px}
.nav-btn svg{width:24px;height:24px;flex-shrink:0}

.center-btn{width:56px;height:56px;border-radius:50%;background:#e50914;border:none;color:#fff;font-size:28px;font-weight:bold;cursor:pointer;box-shadow:0 0 10px rgba(229,9,20,0.4);transition:transform 0.2s;z-index:101}
.center-btn:active{transform:scale(0.92)}
</style>
</head>
<body>

<div class="swiper">
  <div class="slide">
    <video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" loop playsinline muted preload="metadata"></video>
    
    <div class="video-info">
      <h3>ThaiPodee Official</h3>
      <p>ยินดีต้อนรับสู่ชุมชนคนไทยทั่วโลก 🇹🇭<br>กดปุ่ม + ด้านล่างเพื่อแชร์วิดีโอของคุณ</p>
    </div>
    
    <div class="side-buttons">
      <button class="side-btn" title="โปรไฟล์">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </button>
      <button class="side-btn" title="ชื่นชม">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span>27</span>
      </button>
      <button class="side-btn" title="แสดงความคิดเห็น">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm0 14H4V4h16v12z"/></svg>
        <span>0</span>
      </button>
      <button class="side-btn" title="บันทึก">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
        <span>0</span>
      </button>
      <button class="side-btn" title="แชร์">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
        <span>แชร์</span>
      </button>
      <button class="side-btn" title="เพิ่มเติม">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn" onclick="scrollToTop()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>หน้าแรก</span>
  </button>
  <button class="nav-btn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h3.6l3.19 6.59-1.17 2.12C6.09 13.33 5 14.22 5 15.5c0 1.66 1.34 3 3 3h10v-2H8.42c-.31 0-.58-.27-.58-.58 0-.23.14-.42.34-.5L9.1 15h7.45c.75 0 1.41-.41 1.75-1.03l3.24-5.87c.06-.11.1-.23.1-.35 0-.55-.45-1-1-1H6.21l-.94-2H1zm16 14c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
    <span>ร้านค้า</span>
  </button>
  
  <button class="center-btn" id="upload-trigger">+</button>
  <input type="file" id="file-input" accept="video/*" style="display:none">
  
  <button class="nav-btn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm0 14H4V4h16v12z"/></svg>
    <span>ข้อความ</span>
  </button>
  <button class="nav-btn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <span>โปรไฟล์</span>
  </button>
</nav>

<script>
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}

const fileInput = document.getElementById('file-input');
const uploadTrigger = document.getElementById('upload-trigger');

uploadTrigger.addEventListener('click', function(e) {
  e.preventDefault();
  e.stopPropagation();
  fileInput.click();
});

fileInput.addEventListener('change', function(e) {
  try {
    const file = e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith('video/')) {
      alert('กรุณาเลือกไฟล์วิดีโอเท่านั้น');
      fileInput.value = '';
      return;
    }

    const name = file.name;
    const sizeMB = (file.size / 1024 / 1024).toFixed(2);
    
    document.body.innerHTML = 
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff;padding:20px;">' +
        '<h2 style="margin-bottom:20px;">กำลังเตรียมวิดีโอ...</h2>' +
        '<p style="margin-bottom:10px;">ชื่อไฟล์: ' + name + '</p>' +
        '<p style="margin-bottom:30px;">ขนาด: ' + sizeMB + ' MB</p>' +
        '<div style="width:80%;height:6px;background:#333;border-radius:3px;overflow:hidden;">' +
          '<div id="bar" style="width:0%;height:100%;background:#e50914;"></div>' +
        '</div>' +
        '<button onclick="location.reload()" style="margin-top:40px;padding:10px 25px;background:#333;color:#fff;border:none;border-radius:20px;">ยกเลิก</button>' +
      '</div>';

    let p = 0;
    const bar = document.getElementById('bar');
    const t = setInterval(function() {
      p += 10;
      if (p >= 100) {
        p = 100;
        clearInterval(t);
        document.body.innerHTML = 
          '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff;padding:20px;">' +
            '<h2 style="color:#4cd137;margin-bottom:20px;">✅ บันทึกสำเร็จ!</h2>' +
            '<p style="margin-bottom:30px;">กดปุ่มด้านล่างเพื่อกลับไปหน้าแรก</p>' +
            '<button onclick="location.reload()" style="padding:12px 30px;background:#e50914;color:#fff;border:none;border-radius:25px;font-size:16px;">กลับไปดู</button>' +
          '</div>';
      }
      if (bar) bar.style.width = p + '%';
    }, 200);

  } catch (err) {
    alert('เกิดข้อผิดพลาด: ' + err.message);
    location.reload();
  }
});
</script>
</body>
</html>
