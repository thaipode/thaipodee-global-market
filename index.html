<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THAIPODEE — หน้าหลัก</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100%; overflow: hidden;
        }

        /* === TOP BAR — ตรงรูปเป๊ะ === */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 48px;
            display: flex; align-items: center; justify-content: center;
            background: #000; z-index: 200;
            border-bottom: 1px solid #222;
        }
        .back-btn { position: absolute; left: 12px; font-size: 20px; cursor: pointer; color: #fff; }
        .live-label { position: absolute; left: 50px; font-size: 14px; font-weight: 500; }
        .tab-toggle {
            background: #333; border-radius: 16px; padding: 4px 12px; font-size: 13px; cursor: pointer; margin: 0 4px;
        }
        .tab-toggle.active { background: #fff; color: #000; font-weight: 500; }
        .tab-text { font-size: 14px; color: #999; cursor: pointer; margin: 0 12px; }
        .tab-text.active { color: #fff; font-weight: 500; position: relative; }
        .tab-text.active::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            width: 24px; height: 2px; background: #fff; border-radius: 1px;
        }
        .top-right { position: absolute; right: 12px; display: flex; gap: 14px; font-size: 20px; }
        .top-right span { cursor: pointer; }

        /* === VIDEO AREA === */
        .video-area {
            position: fixed; top: 48px; left: 0; right: 0; bottom: 75px;
            display: flex; align-items: center; justify-content: center;
            background: #000;
        }
        .placeholder-text { color: #666; font-size: 14px; text-align: center; }

        /* === BOTTOM NAV — ตรงรูปเป๊ะ === */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
            background: #000; display: flex; justify-content: space-around; align-items: center;
            padding: 0 8px; z-index: 200;
            border-top: 1px solid #222;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .nav-icon { font-size: 22px; }
        .nav-label { font-size: 10px; color: #aaa; }
        .nav-item.active .nav-label { color: #fff; }
        .center-btn {
            width: 50px; height: 35px; background: #fff; border-radius: 8px;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .center-btn::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 50%;
            background: #00f; border-radius: 8px 0 0 8px;
        }
        .center-btn span {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            font-size: 24px; font-weight: bold; color: #000; z-index: 1;
        }
        .badge-wrap { position: relative; }
        .badge-num {
            position: absolute; top: -4px; right: -8px; background: #ff0050; color: #fff;
            font-size: 9px; padding: 1px 4px; border-radius: 10px; min-width: 16px;
            text-align: center; font-weight: 600;
        }
        .shop-icon { position: relative; }
        .shop-dot {
            position: absolute; top: 0; right: 0; width: 8px; height: 8px;
            background: #ff0050; border-radius: 50%;
        }
    </style>
</head>
<body>

<!-- === TOP BAR === -->
<div class="top-bar">
    <span class="back-btn" id="backBtn">←</span>
    <span class="live-label">LIVE</span>
    <span class="tab-toggle active">ตัวอย่าง</span>
    <span class="tab-toggle">ฟีด</span>
    <span class="tab-text">ใกล้เคียง</span>
    <span class="tab-text">กำลังติดตาม</span>
    <span class="tab-text active">สำหรับคุณ</span>
    <div class="top-right">
        <span id="expandBtn">⛶</span>
        <span id="shareTopBtn">↗</span>
        <span id="searchBtn">🔍</span>
    </div>
</div>

<!-- === VIDEO AREA === -->
<div class="video-area">
    <p class="placeholder-text">กดปุ่มกลางล่างเพื่อโหลดวิดีโอ</p>
</div>

<!-- === BOTTOM NAV === -->
<div class="bottom-nav">
    <div class="nav-item active" id="navHome">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าหลัก</span>
    </div>
    <div class="nav-item shop-icon" id="navShop">
        <span class="nav-icon">🛒</span>
        <span class="shop-dot"></span>
        <span class="nav-label">ร้านค้า</span>
    </div>
    <div class="nav-item" id="navUpload">
        <div class="center-btn"><span>+</span></div>
    </div>
    <div class="nav-item badge-wrap" id="navInbox">
        <span class="nav-icon">💬</span>
        <span class="badge-num">99+</span>
        <span class="nav-label">กล่องข้อความ</span>
    </div>
    <div class="nav-item" id="navProfile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<script>
// === ทดสอบทำงาน — หน้าหลัก ===
document.addEventListener('DOMContentLoaded', function() {
    // ปุ่มบน
    document.getElementById('backBtn').addEventListener('click', () => alert('ย้อนกลับ'));
    document.getElementById('searchBtn').addEventListener('click', () => alert('ค้นหา'));
    document.getElementById('expandBtn').addEventListener('click', () => alert('ขยาย'));
    document.getElementById('shareTopBtn').addEventListener('click', () => alert('แชร์'));

    // สลับแท็บ ตัวอย่าง/ฟีด
    document.querySelectorAll('.tab-toggle').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.tab-toggle').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // สลับแท็บ ใกล้เคียง/ติดตาม/สำหรับคุณ
    document.querySelectorAll('.tab-text').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.tab-text').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // ปุ่มล่าง — แจ้งเตือน + เตรียมพร้อมสำหรับเชื่อมหน้าต่อไป
    document.getElementById('navHome').addEventListener('click', () => alert('อยู่ที่หน้าหลักแล้ว'));
    document.getElementById('navShop').addEventListener('click', () => alert('✅ ร้านค้า — พร้อมเชื่อมหน้า 2'));
    document.getElementById('navUpload').addEventListener('click', () => alert('✅ อัปโหลด — พร้อมเชื่อมหน้า 3'));
    document.getElementById('navInbox').addEventListener('click', () => alert('✅ กล่องข้อความ — พร้อมเชื่อมหน้า 4'));
    document.getElementById('navProfile').addEventListener('click', () => alert('✅ โปรไฟล์ — พร้อมเชื่อมหน้า 5'));
});
</script>

</body>
</html>
