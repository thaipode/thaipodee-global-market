<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiPodee</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
body{background:#000;color:#fff;height:100vh;overflow:hidden;}
.page{display:none;width:100%;height:100vh;position:absolute;top:0;left:0;}
.page.active{display:block;}
.video-area{width:100%;height:calc(100vh - 100px);display:flex;align-items:center;justify-content:center;}
video{max-width:100%;max-height:100%;}
.side-menu{position:absolute;right:15px;bottom:110px;display:flex;flex-direction:column;gap:20px;}
.side-btn{width:48px;height:48px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:22px;}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:70px;background:#111;display:flex;justify-content:space-around;align-items:center;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;opacity:0.7;}
.nav-btn.active{opacity:1;}
.nav-btn.plus{width:56px;height:40px;background:red;border-radius:8px;font-size:24px;line-height:40px;text-align:center;}
.upload-box{text-align:center;}
.upload-btn{background:red;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:16px;}
input[type="file"]{display:none;}
.profile{padding:20px;overflow-y:auto;height:100vh;}
.avatar{width:90px;height:90px;border-radius:50%;background:#333;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:40px;position:relative;}
.avatar .add{position:absolute;bottom:0;right:0;background:red;width:28px;height:28px;border-radius:50%;font-size:18px;line-height:28px;text-align:center;}
.username{text-align:center;margin:10px 0;font-size:20px;font-weight:bold;}
.edit-name{display:block;margin:5px auto;background:red;color:#fff;border:none;padding:6px 12px;border-radius:6px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:20px;}
.thumb{aspect-ratio:9/16;background:#222;border-radius:4px;overflow:hidden;}
.thumb video{width:100%;height:100%;object-fit:cover;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:100;}
.modal.active{display:flex;}
.modal-content{background:#222;padding:25px;border-radius:12px;width:85%;max-width:320px;}
.modal-content input{width:100%;padding:10px;margin:10px 0;background:#333;border:none;color:#fff;border-radius:6px;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;}
.modal-btns button{padding:8px 16px;border-radius:6px;border:none;}
.save{background:red;color:#fff;}
.cancel{background:#555;color:#fff;}
</style>
</head>
<body>

<div class="page active" id="page-home">
  <div class="video-area">
    <div class="upload-box" id="uploadBox">
      <p style="margin-bottom:15px;">ยินดีต้อนรับสู่ ThaiPodee</p>
      <button class="upload-btn" id="selBtn">เลือกวิดีโอจากเครื่อง</button>
      <input type="file" id="vidInput" accept="video/*">
    </div>
    <video id="mainVid" controls style="display:none;"></video>
  </div>
  <div class="side-menu">
    <div class="side-btn" id="goProfile">👤</div>
    <div class="side-btn">❤️</div>
    <div class="side-btn">💬</div>
    <div class="side-btn">🔖</div>
    <div class="side-btn">↗️</div>
    <div class="side-btn">🎵</div>
  </div>
</div>

<div class="page" id="page-profile">
  <div class="profile">
    <div class="avatar" id="avatarBox">
      <span id="avText">👤</span>
      <div class="add" id="avAdd">+</div>
      <input type="file" id="avInput" accept="image/*">
    </div>
    <h2 class="username" id="uName">ผู้ใช้ ThaiPodee</h2>
    <button class="edit-name" id="editBtn">เปลี่ยนชื่อ</button>
    <p style="text-align:center;margin:15px 0;">วิดีโอ: <span id="vidCount">0</span></p>
    <div class="grid" id="vidGrid">
      <p style="grid-column:1/-1;text-align:center;opacity:0.5;padding:30px;">ยังไม่มีวิดีโอ</p>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-btn active" data-to="home">🏠 หน้าแรก</div>
  <div class="nav-btn" data-to="shop">🛍️ ร้าน</div>
  <div class="nav-btn plus" id="plusBtn">+</div>
  <div class="nav-btn" data-to="msg">💬 ข้อความ</div>
  <div class="nav-btn" data-to="profile">👤 โปรไฟล์</div>
</div>

<div class="modal" id="nameModal">
  <div class="modal-content">
    <h3>เปลี่ยนชื่อ</h3>
    <input type="text" id="nameInput" placeholder="ใส่ชื่อใหม่">
    <div class="modal-btns">
      <button class="cancel" id="canBtn">ยกเลิก</button>
      <button class="save" id="saveBtn">บันทึก</button>
    </div>
  </div>
</div>

<script>
const KEY = "thaipodee_data";
let data = {name:"ผู้ใช้ ThaiPodee", av:"", videos:[]};

function load(){
  const s = localStorage.getItem(KEY);
  if(s) try{data = JSON.parse(s);}catch(e){}
  render();
}
function save(){
  localStorage.setItem(KEY, JSON.stringify(data));
  render();
}
function render(){
  document.getElementById("uName").textContent = data.name;
  document.getElementById("vidCount").textContent = data.videos.length;
  const g = document.getElementById("vidGrid");
  if(data.videos.length===0){
    g.innerHTML = `<p style="grid-column:1/-1;text-align:center;opacity:0.5;padding:30px;">ยังไม่มีวิดีโอ</p>`;
  }else{
    g.innerHTML = "";
    data.videos.forEach((v,i)=>{
      const d = document.createElement("div");
      d.className = "thumb";
      d.innerHTML = `<video src="${v.url}" muted></video>`;
      d.onclick = ()=>{playVid(v.url);go("home");};
      g.appendChild(d);
    });
  }
}
function go(pg){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page-"+pg).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector(`[data-to="${pg}"]`)?.classList.add("active");
}
function playVid(url){
  document.getElementById("uploadBox").style.display = "none";
  document.getElementById("mainVid").style.display = "block";
  document.getElementById("mainVid").src = url;
  document.getElementById("mainVid").play();
}

document.getElementById("selBtn").onclick = ()=>document.getElementById("vidInput").click();
document.getElementById("plusBtn").onclick = ()=>document.getElementById("vidInput").click();
document.getElementById("vidInput").onchange = e=>{
  const f = e.target.files[0]; if(!f)return;
  const url = URL.createObjectURL(f);
  data.videos.push({url:url});
  save();
  playVid(url);
  e.target.value = "";
};
document.getElementById("goProfile").onclick = ()=>go("profile");
document.querySelectorAll("[data-to]").forEach(b=>b.onclick=()=>go(b.dataset.to));

document.getElementById("editBtn").onclick = ()=>{
  document.getElementById("nameInput").value = data.name;
  document.getElementById("nameModal").classList.add("active");
};
document.getElementById("canBtn").onclick = ()=>{
  document.getElementById("nameModal").classList.remove("active");
};
document.getElementById("saveBtn").onclick = ()=>{
  const n = document.getElementById("nameInput").value.trim();
  if(n){data.name=n;save();}
  document.getElementById("nameModal").classList.remove("active");
};

load();
</script>
</body>
</html>
