<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ไทยโพธิ์ดี Market Online Platform v2026</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Noto Sans Thai, sans-serif; }
    html, body { background: #000; color: #fff; height: 100%; overflow: hidden; }
    .app-container { width: 100%; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
    
    .header { flex-shrink: 0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); z-index: 10; }
    .logo-area { text-align: center; }
    .logo-th { font-size: 18px; font-weight: 700; color: #FFD700; }
    .logo-en { font-size: 11px; color: #aaa; margin-top: 2px; }
    .icon-btn { font-size: 22px; cursor: pointer; }
    .version-tag { position: absolute; top: 12px; right: 12px; font-size: 11px; color: #888; z-index: 11; }
    
    .video-feed { flex: 1; overflow-y: auto; position: relative; scroll-snap-type: y mandatory; }
    .empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .empty-state h3 { font-size: 18px; margin-bottom: 8px; }
    .empty-state p { color: #aaa; font-size: 14px; }
    
    .video-card { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; scroll-snap-align: start; }
    video { width: 100%; height: 100%; object-fit: cover; background: #111; outline: none; }
    .video-info { position: absolute; bottom: 100px; left: 16px; right: 70px; z-index: 5; }
    .creator-name { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
    .video-desc { font-size: 13px; line-height: 1.4; margin-bottom: 8px; }
    .sound-tag { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #ddd; }
    
    .side-actions { position: absolute; right: 12px; bottom: 110px; display: flex; flex-direction: column; align-items: center; gap: 22px; z-index: 20; }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; position: relative; }
    .action-icon { font-size: 28px; }
    .action-count { font-size: 11px; color: #fff; }
    .profile-circle { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; background: #333; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .profile-plus-badge { position: absolute; bottom: -6px; right: -6px; width: 18px; height: 18px; background: #ff0000; color: #fff; border-radius: 50%; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .music-disc { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(45deg, #FFD700, #FF6B00); display: flex; align-items: center; justify-content: center; font-size: 20px; animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .bottom-nav { flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; padding: 8px 0 24px; background: rgba(0,0,0,0.95); border-top: 1px solid #333; position: relative; z-index: 100; min-height: 70px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; position: relative; }
    .nav-icon { font-size: 24px; }
    .nav-label { font-size: 10px; color: #aaa; }
    .nav-item.active .nav-label { color: #fff; }
    .nav-badge { position: absolute; top: -2px; right: -4px; background: #ff0000; color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 10px; }
    .create-btn { width: 48px; height: 32px; background: #ffffff; border: 1px solid #ff0000; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #ff0000; font-size: 26px; font-weight: bold; cursor: pointer; }
    
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
    .modal.show { display: flex; }
    .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
    .upload-area { width: 100%; max-width: 360px; min-height: 180px; border: 2px dashed #666; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; cursor: pointer; }
    .upload-area:hover { border-color: #FFD700; }
    .upload-icon { font-size: 40px; color: #888; }
    .file-input { display: none; }
    .input-field { width: 100%; max-width: 360px; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; margin-bottom: 12px; font-size: 14px; }
    .btn { padding: 12px 24px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; max-width: 360px; }
    .btn-primary { background: #FFD700; color: #000; margin-bottom: 10px; }
    .btn-secondary { background: #333; color: #fff; }
    .preview-video { width: 100%; max-width: 360px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .progress-bar { width: 100%; max-width: 360px; height: 6px; background: #333; border-radius: 3px; margin-bottom: 16px; display: none; }
    .progress-fill { height: 100%; background: #FFD700; width: 0%; border-radius: 3px; transition: width 0.3s; }
    .size-note { font-size: 12px; color: #888; margin-bottom: 12px; text-align: center; }
  </style>
</head>
<body>

<div class="app-container">
  <span class="version-tag">v2026</span>
  
  <div class="header">
    <div class="icon-btn" onclick="toggleProfile()">☰</div>
    <div class="logo-area">
      <div class="logo-th">ไทยโพธิ์ดี</div>
      <div class="logo-en">Thaipodee Market Online Platform</div>
    </div>
    <div class="icon-btn" onclick="searchContent()">🔍</div>
  </div>

  <div class="video-feed" id="videoFeed">
    <div class="empty-state">
      <h3>ยังไม่มีวิดีโอ</h3>
      <p>เป็นคนแรกที่อัปโหลดวิดีโอ!</p>
    </div>
  </div>

  <div class="side-actions">
    <div class="action-btn" onclick="switchTab('profile')">
      <div class="profile-circle">👤</div>
      <div class="profile-plus-badge">+</div>
    </div>
    <div class="action-btn" onclick="likeVideo('temp')">
      <span class="action-icon">❤️</span>
      <span class="action-count">0</span>
    </div>
    <div class="action-btn">
      <span class="action-icon">💬</span>
      <span class="action-count">0</span>
    </div>
    <div class="action-btn">
      <span class="action-icon">⭐</span>
      <span class="action-count">0</span>
    </div>
    <div class="action-btn">
      <span class="action-icon">↗️</span>
      <span class="action-count">แชร์</span>
    </div>
    <div class="action-btn">
      <div class="music-disc">🎵</div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">หน้าแรก</span>
    </div>
    <div class="nav-item" onclick="switchTab('shop')">
      <span class="nav-icon">🛒</span>
      <span class="nav-label">ร้านค้า</span>
      <div class="nav-badge"></div>
    </div>
    <div class="nav-item" onclick="openUploadModal()">
      <div class="create-btn">+</div>
    </div>
    <div class="nav-item" onclick="switchTab('inbox')">
      <span class="nav-icon">💬</span>
      <span class="nav-label">ข้อความ</span>
      <div class="nav-badge">99+</div>
    </div>
    <div class="nav-item" onclick="switchTab('profile')">
      <span class="nav-icon">👤</span>
      <span class="nav-label">โปรไฟล์</span>
    </div>
  </div>

  <div class="modal" id="uploadModal">
    <div class="modal-title">อัปโหลดวิดีโอ</div>
    <div class="upload-area" onclick="document.getElementById('videoFile').click()">
      <span class="upload-icon">📹</span>
      <span>แตะเพื่อเลือกวิดีโอ</span>
      <input type="file" id="videoFile" class="file-input" accept="video/*" onchange="handleFileSelect(event)">
    </div>
    <div class="size-note">💡 ไม่เกิน 1 นาที, ไม่เกิน 50MB</div>
    <video id="previewVideo" class="preview-video" controls muted playsinline></video>
    <input type="text" id="videoDesc" class="input-field" placeholder="คำอธิบายวิดีโอ...">
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <button class="btn btn-primary" id="uploadBtn" onclick="uploadVideo()">อัปโหลด</button>
    <button class="btn btn-secondary" onclick="closeUploadModal()">ยกเลิก</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCt-wPPDeopLnjCv4QQvdYLQ2uG_VxWYtE",
    authDomain: "thaipodee-market.firebaseapp.com",
    projectId: "thaipodee-market",
    storageBucket: "thaipodee-market.appspot.com",
    messagingSenderId: "802626775100",
    appId: "1:802626775100:web:8b2f2914532d2c9e9c3b39"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();
  let selectedFile = null;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target.querySelector('video');
      if (video) entry.isIntersecting ? video.play().catch(() => {}) : video.pause();
    });
  }, { threshold: 0.6 });

  async function loadVideos() {
    const feed = document.getElementById('videoFeed');
    try {
      const snapshot = await db.collection('videos').orderBy('createdAt', 'desc').limit(30).get();
      if (snapshot.empty) {
        feed.innerHTML = `<div class="empty-state"><h3>ยังไม่มีวิดีโอ</h3><p>เป็นคนแรกที่อัปโหลดวิดีโอ!</p></div>`;
        return;
      }
      feed.innerHTML = '';
      snapshot.docs.forEach(doc => {
        const v = doc.data();
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <video src="${v.videoUrl}" autoplay loop muted playsinline preload="metadata"></video>
          <div class="video-info">
            <div class="creator-name">@${v.creator || 'thaipodee_user'}</div>
            <div class="video-desc">${v.description || ''}</div>
            <div class="sound-tag">🎵 เสียงต้นฉบับ - ไทยโพธิ์ดี</div>
          </div>
          <div class="side-actions">
            <div class="action-btn" onclick="switchTab('profile')"><div class="profile-circle">👤</div><div class="profile-plus-badge">+</div></div>
            <div class="action-btn" onclick="likeVideo('${doc.id}')"><span class="action-icon">❤️</span><span class="action-count">${v.likes || 0}</span></div>
            <div class="action-btn"><span class="action-icon">💬</span><span class="action-count">${v.comments || 0}</span></div>
            <div class="action-btn"><span class="action-icon">⭐</span><span class="action-count">0</span></div>
            <div class="action-btn"><span class="action-icon">↗️</span><span class="action-count">แชร์</span></div>
            <div class="action-btn"><div class="music-disc">🎵</div></div>
          </div>
        `;
        feed.appendChild(card);
        observer.observe(card);
      });
    } catch (e) {
      feed.innerHTML = `<div class="empty-state"><h3>โหลดไม่สำเร็จ</h3><p>${e.message}</p></div>`;
    }
  }

  function openUploadModal() { document.getElementById('uploadModal').classList.add('show'); }
  function closeUploadModal() { 
    document.getElementById('uploadModal').classList.remove('show'); 
    document.getElementById('previewVideo').style.display = 'none';
    document.getElementById('videoDesc').value = '';
    selectedFile = null;
    document.getElementById('progressBar').style.display = 'none';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('uploadBtn').disabled = false;
    document.getElementById('uploadBtn').textContent = 'อัปโหลด';
  }

  function handleFileSelect(e) {
    selectedFile = e.target.files[0];
    if (!selectedFile) return;
    const maxSize = 50 * 1024 * 1024;
    if (selectedFile.size > maxSize) {
      alert('ไฟล์ใหญ่เกิน 50MB! เลือกไฟล์เล็กกว่านี้ครับ');
      selectedFile = null;
      e.target.value = '';
      return;
    }
    const preview = document.getElementById('previewVideo');
    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = 'block';
  }

  async function uploadVideo() {
    if (!selectedFile) { alert('กรุณาเลือกวิดีโอก่อนครับ'); return; }
    const desc = document.getElementById('videoDesc').value || 'วิดีโอจาก ไทยโพธิ์ดี Market Online Platform';
    const btn = document.getElementById('uploadBtn');

    btn.disabled = true;
    btn.textContent = 'กำลังอัปโหลด...';
    document.getElementById('progressBar').style.display = 'block';
    document.getElementById('progressFill').style.width = '0%';

    try {
      const timestamp = Date.now();
      const fileRef = storage.ref(`videos/${timestamp}_${selectedFile.name.replace(/[^\w.\-]/g, '_')}`);
      const metadata = { contentType: selectedFile.type };
      const uploadTask = fileRef.put(selectedFile, metadata);

      uploadTask.on('state_changed',
        (snap) => {
          const pct = (snap.bytesTransferred / snap.totalBytes) * 100;
          document.getElementById('progressFill').style.width = pct + '%';
        },
        (err) => {
          console.error('Upload error:', err);
          let msg = 'อัปโหลดล้มเหลว: ';
          if (err.code === 'storage/unauthorized') msg += 'ไม่มีสิทธิ์ — กรุณารอสักครู่แล้วลองใหม่';
          else if (err.code === 'storage/quota-exceeded') msg += 'พื้นที่เต็ม';
          else msg += err.message;
          alert(msg);
          btn.disabled = false;
          btn.textContent = 'อัปโหลด';
          document.getElementById('progressBar').style.display = 'none';
        },
        async () => {
          const videoUrl = await uploadTask.snapshot.ref.getDownloadURL();
          await db.collection('videos').add({
            description: desc,
            videoUrl,
            creator: 'thaipodee_user',
            likes: 0,
            comments: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert('✅ อัปโหลดสำเร็จ!');
          closeUploadModal();
          loadVideos();
        }
      );
    } catch (e) {
      alert('ผิดพลาด: ' + e.message);
      btn.disabled = false;
      btn.textContent = 'อัปโหลด';
    }
  }

  function likeVideo(id) {
    db.collection('videos').doc(id).update({ likes: firebase.firestore.FieldValue.increment(1) });
  }
  function switchTab(tab) { console.log('Switch:', tab); }
  function toggleProfile() { console.log('Profile'); }
  function searchContent() { console.log('Search'); }

  document.addEventListener('DOMContentLoaded', loadVideos);
</script>

</body>
</html>
