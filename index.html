   --------------------------------------------------------------
   ✅ วิดีโอแนวตั้ง 9:16 → เต็มจอเลย ไม่มีขอบดำ
   ✅ วิดีโอแนวนอน 16:9 → อยู่ตรงกลาง ไม่ยืด ไม่บิด

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff; font-family: -apple-system, sans-serif;
  }

  /* ---- เวอร์ชัน มุมขวาบน ---- */
  .version-tag {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.55); color: #fff;
    font-size: 12px; padding: 3px 8px; border-radius: 10px;
    z-index: 100;
  }

  /* ---- แถบหัวข้อ ด้านบน ---- */
  .top-tabs {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 24px; z-index: 99;
  }
  .tab-item {
    font-size: 15px; color: #aaa; padding-bottom: 4px;
    border-bottom: 2px solid transparent;
  }
  .tab-item.active {
    color: #fff; border-bottom-color: #fff; font-weight: 600;
  }
  .search-icon {
    position: absolute; top: 12px; right: 45px; font-size: 20px; z-index: 99;
  }

  /* ---- พื้นที่วิดีโอ ---- */
  #container {
    width: 100%; height: 100vh; overflow: hidden; position: relative;
    background: #000;
  }
  #videoWrapper {
    width: 100%; height: 100%; transition: transform 0.15s ease-out;
  }
  .video-slide {
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }

  /* 
    v1094:
    ถ้าเป็นแนวตั้ง จะเต็มจอเลย ไม่มีขอบดำ
    ถ้าเป็นแนวนอน จะอยู่ตรงกลาง ไม่ยืด
  */
  video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  video.is-portrait {
    object-fit: cover;
  }

  video.is-landscape {
    object-fit: contain;
  }

  /* ---- ข้อมูลด้านล่างซ้าย ---- */
  .video-info {
    position: absolute; bottom: 75px; left: 12px; right: 70px; z-index: 90;
  }
  .info-username {
    font-weight: 600; font-size: 14px; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .follow-badge {
    background: #fff; color: #000; font-size: 10px; padding: 1px 6px;
    border-radius: 4px; font-weight: bold;
  }
  .info-title {
    font-size: 13px; margin-bottom: 4px; color: #f0f0f0;
  }
  .info-tags {
    font-size: 12px; color: #ccc;
  }

  /* ---- ไอคอนด้านขวา แนวตั้ง ---- */
  .side-icons {
    position: absolute; right: 10px; bottom: 90px;
    display: flex; flex-direction: column; gap: 22px;
    z-index: 90; align-items: center;
  }
  .icon-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    font-size: 22px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .icon-count {
    font-size: 11px; color: #fff;
  }
  .profile-icon-wrap {
    position: relative;
  }
  .follow-plus {
    position: absolute; bottom: -4px; right: -4px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #ff2d55; color: #fff; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }

  /* ---- แถบเมนูด้านล่าง ---- */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0; height: 65px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    display: flex; justify-content: space-around; align-items: center;
    z-index: 99;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-btn {
    background: none; border: none; color: #fff;
    font-size: 22px; cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
  }
  .nav-label { font-size: 10px; }
  .nav-main {
    width: 52px; height: 36px; border-radius: 8px;
    background: #ff2d55; display: flex; align-items: center;
    justify-content: center; font-size: 24px; border: none;
    cursor: pointer;
  }

  /* ---- กล่องแก้ไขข้อมูล ---- */
  .edit-box {
    position: absolute; bottom: 80px; left: 12px; right: 12px;
    background: #1c1c1e; border-radius: 12px; padding: 16px;
    z-index: 101; display: none;
  }
  .edit-box.show { display: block; }
  .edit-box input, .edit-box textarea {
    width: 100%; padding: 10px; border-radius: 8px;
    border: none; background: #2c2c2e; color: #fff;
    font-size: 15px; margin-bottom: 8px;
  }
  .edit-buttons {
    display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px;
  }
  .edit-btn {
    padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
  }
  .cancel-btn { background: #444; color: #fff; }
  .save-btn { background: #ff2d55; color: #fff; }

  #fileInput { display: none; }
</style>
</head>
<body>

<input type="file" id="fileInput" accept="video/*">

<div id="container">
  <!-- เวอร์ชัน -->
  <div class="version-tag">v1094</div>

  <!-- แถบหัวข้อ ด้านบน -->
  <div class="top-tabs">
    <span class="tab-item">กำลังติดตาม</span>
    <span class="tab-item active">สำหรับคุณ</span>
  </div>
  <span class="search-icon">🔍</span>

  <!-- วิดีโอ -->
  <div id="videoWrapper"></div>

  <!-- ข้อมูลด้านล่างซ้าย -->
  <div class="video-info">
    <div class="info-username" id="infoUsername">
      @thaipodee
      <span class="follow-badge">ติดตาม</span>
    </div>
    <div class="info-title" id="infoTitle">ThaiPodee — แชร์วิดีโอและสินค้า</div>
    <div class="info-tags" id="infoTags">#ThaiPodee #แชร์วิดีโอ #สินค้า #ไทย</div>
  </div>

  <!-- ไอคอนด้านขวา -->
  <div class="side-icons">
    <div class="icon-wrap">
      <div class="profile-icon-wrap">
        <button class="icon-btn" id="editProfileBtn">👤</button>
        <span class="follow-plus">+</span>
        <bboxvoice id="followBbox"></bboxvoice>
      </div>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">❤️</button>
      <span class="icon-count" id="likeCount">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">💬</button>
      <span class="icon-count" id="commentCount">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">📌</button>
      <span class="icon-count" id="saveCount">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">⬆️</button>
      <span class="icon-count" id="shareCount">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">🎵</button>
    </div>
  </div>

  <!-- แถบเมนูล่าง -->
  <nav class="bottom-nav">
    <button class="nav-btn">
      🏠<span class="nav-label"><[SILENT_never_used_51bce0c785ca2f68081bfa7d91973934]></span>
    </button>
    <button class="nav-btn">
      🛍️<span class="nav-label">ร้านค้า</span>
    </button>
    <button class="nav-btn nav-main" id="uploadBtn">+</button>
    <button class="nav-btn">
      💬<span class="nav-label">ข้อความ</span>
    </button>
    <button class="nav-btn" id="profileMenuBtn">
      👤<span class="nav-label">โปรไฟล์</span>
    </button>
  </nav>

  <!-- ก<[SILENT_never_used_51bce0c785ca2f68081bfa7d91973934]>กล่องแก้ไขข้อมูล -->
  <div class="edit-box" id="editBox">
    <input type="text" id="usernameInput" placeholder="ชื่อแอคเคาท์ เช่น @thaipodee">
    <input type="text" id="titleInput" placeholder="คำอธิบายวิดีโอ/ช่อง">
    <textarea id="tagsInput" rows="2" placeholder="แฮชแท็ก คั่นด้วยเว้นวรรค"></textarea>
    <div class="edit-buttons">
      <button class="edit-btn cancel-btn" id="cancelBtn">ยกเลิก</button>
      <button class="edit-btn save-btn" id="saveBtn">บันทึก</button>
    </div>
  </div>
</div>

<script>
const container = document.getElementById('container');
const wrapper = document.getElementById('videoWrapper');
const fileInput = document.getElementById('fileInput');

// ---- ข้อมูลผู้ใช้ ----
let profileData = JSON.parse(localStorage.getItem('thaipodee_profile')) || {
  username: '@thaipodee',
  title: 'ThaiPodee — แชร์วิดีโอและสินค้า',
  tags: '#ThaiPodee #แชร์วิดีโอ #สินค้า #ไทย'
};

function renderProfile() {
  document.getElementById('infoUsername').textContent = profileData.username;
  document.getElementById('infoTitle').textContent = profileData.title;
  document.getElementById('infoTags').textContent = profileData.tags;
}
renderProfile();

// ---- ปลดล็อกเสียง ----
function unlockSound() {
  document.querySelectorAll('video').forEach(vid => {
    vid.muted = false;
    vid.play().catch(() => {});
  });
}

// ---- เลื่อนสไลด์วิดีโอ ----
let videos = [];
let currentIndex = 0;

function goToSlide(index) {
  if (!videos || videos.length === 0) return;
  if (index < 0) index = 0;
  if (index >= videos.length) index = videos.length - 1;
  currentIndex = index;
  wrapper.style.transform = `translateY(-${currentIndex * 100}vh)`;
  updatePlayState();
}

function updatePlayState() {
  document.querySelectorAll('video').forEach((vid, idx) => {
    if (idx === currentIndex) {
      vid.muted = false;
      vid.play().catch(() => {});
    } else {
      vid.pause();
      vid.currentTime = 0;
    }
  });
}

container.addEventListener('click', unlockSound);
container.addEventListener('touchstart', unlockSound);

// ---- เลื่อนหน้าจอสัมผัส ----
let startY = 0, isDragging = false, offsetY = 0;
container.addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
  isDragging = true;
  offsetY = 0;
});
container.addEventListener('touchmove', e => {
  if (!isDragging) return;
  offsetY = e.touches[0].clientY - startY;
  wrapper.style.transform = `translateY(calc(-${currentIndex * 100}vh + ${offsetY * 0.3}px))`;
});
container.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  if (offsetY < -60 && currentIndex < videos.length - 1) goToSlide(currentIndex + 1);
  else if (offsetY > 60 && currentIndex > 0) goToSlide(currentIndex - 1);
  else goToSlide(currentIndex);
});

// ---- ตรวจจับสัดส่วนวิดีโอ ----
function setVideoFit(video) {
  video.addEventListener('loadedmetadata', () => {
    const isPortrait = video.videoHeight > video.videoWidth;
    video.classList.toggle('is-portrait', isPortrait);
    video.classList.toggle('is-landscape', !isPortrait);
  });
}

// ---- โหลดวิดีโอตัวอย่าง ----
async function loadVideos() {
  videos = [
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
    { src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' }
  ];
  renderVideos();
  goToSlide(0);
}

function renderVideos() {
  wrapper.innerHTML = '';
  videos.forEach(v => {
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    const video = document.createElement('video');
    video.src = v.src;
    video.loop = true;
    video.playsInline = true;
    video.preload = 'auto';
    video.muted = true;
    setVideoFit(video);
    slide.appendChild(video);
    wrapper.appendChild(slide);
  });
}

// ---- อัปโหลดวิดีโอ ----
document.getElementById('uploadBtn').addEventListener('click', () => {
  fileInput.click();
});
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  videos.unshift({ src: url });
  renderVideos();
  goToSlide(currentIndex);
});

// ---- แก้ไขข้อมูล ----
function openEditBox() {
  document.getElementById('usernameInput').value = profileData.username;
  document.getElementById('titleInput').value = profileData.title;
  document.getElementById('tagsInput').value = profileData.tags;
  document.getElementById('editBox').classList.add('show');
}
document.getElementById('editProfileBtn').addEventListener('click', openEditBox);
document.getElementById('profileMenuBtn').addEventListener('click', openEditBox);
document.getElementById('cancelBtn').addEventListener('click', () => {
  document.getElementById('editBox').classList.remove('show');
});
document.getElementById('saveBtn').addEventListener('click', () => {
  profileData.username = document.getElementById('usernameInput').value.trim() || '@thaipodee';
  profileData.title = document.getElementById('titleInput').value.trim() || 'ThaiPodee — แชร์วิดีโอและสินค้า';
  profileData.tags = document.getElementById('tagsInput').value.trim() || '#ThaiPodee #แชร์วิดีโอ #สินค้า #ไทย';
  localStorage.setItem('thaipodee_profile', JSON.stringify(profileData));
  renderProfile();
  document.getElementById('editBox').classList.remove('show');
});

document.addEventListener('DOMContentLoaded', loadVideos);
</script>

</body>
</html>
