<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Thaipodee</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { 
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden; background: #000; color: #fff;
      position: fixed; inset: 0; overscroll-behavior: none;
    }

    .splash-screen { display: none !important; opacity: 0 !important; visibility: hidden !important; }
    .app { width: 100%; height: 100%; height: 100dvh; position: relative; background: #000; overflow: hidden; }

    .video-area {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden; z-index: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .video-area video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background: #000; display: block; transition: all 0.3s ease;
      /* ตรวจจับอัตโนมัติ — ไม่ให้ส่วนใดถูกบัง */
      object-fit: contain;
    }
    /* 9:16 แนวตั้ง → เต็มจอพอดี */
    .video-area video.ar-vertical { object-fit: cover; }
    /* 16:9 แนวนอน → ปรับพอดีจอ ไม่ตัดขอบ */
    .video-area video.ar-horizontal { object-fit: contain; width: 100%; height: 100%; }

    .video-placeholder {
      color: #888; font-size: 16px; text-align: center;
      padding: 40px 20px; line-height: 1.8; z-index: 2;
    }

    .play-pause-indicator {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); font-size: 64px; color: #fff;
      background: rgba(0,0,0,.5); width: 90px; height: 90px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 10;
    }
    .play-pause-indicator.show { opacity: 1; }

    .progress-line {
      position: absolute; bottom: calc(80px + env(safe-area-inset-bottom, 0px));
      left: 0; right: 0; height: 3px; background: rgba(255,255,255,.2); z-index: 12;
    }
    .progress-done {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #25f4ee, #fe28ea);
      border-radius: 0 2px 2px 0; transition: width 0.1s linear;
    }

    .right-menu {
      position: absolute; right: 12px;
      bottom: calc(140px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column; align-items: center;
      gap: 24px; z-index: 12;
    }
    .r-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; cursor: pointer; transition: transform 0.15s ease;
    }
    .r-btn:active { transform: scale(0.92); }
    .r-icon { font-size: 28px; }
    .r-num { font-size: 12px; margin-top: 2px; }
    .prof-box { position: relative; cursor: pointer; }
    .prof-img {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid #fff; background: url('https://picsum.photos/100/100') center/cover;
      cursor: pointer;
    }
    .follow-add {
      position: absolute; bottom: -6px; left: 50%;
      transform: translateX(-50%); width: 20px; height: 20px;
      border-radius: 50%; background: #ff0050;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: bold;
    }
    .music-cover {
      width: 48px; height: 48px; border-radius: 50%;
      background: #222; border: 2px solid #fff;
      animation: spin 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .info-left {
      position: absolute; left: 12px; right: 85px;
      bottom: calc(140px + env(safe-area-inset-bottom, 0px));
      z-index: 12; display: none;
    }
    .username {
      font-size: 16px; font-weight: 700; margin-bottom: 4px;
      cursor: pointer; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5);
    }
    .caption {
      font-size: 14px; line-height: 1.5; margin-bottom: 6px;
      color: #f0f0f0; text-shadow: 0 1px 3px rgba(0,0,0,.5);
    }
    .sound-name {
      font-size: 13px; display: flex; align-items: center; gap: 6px;
      opacity: 0.85; text-shadow: 0 1px 3px rgba(0,0,0,.5);
    }

    .top-bar {
      position: absolute; top: max(18px, env(safe-area-inset-top, 0px));
      left: 0; right: 0; display: flex; justify-content: center;
      align-items: center; z-index: 15;
    }
    .tab {
      font-size: 16px; color: rgba(255,255,255,.6);
      cursor: pointer; padding: 0 12px;
    }
    .tab.active {
      color: #fff; font-weight: 600;
      border-bottom: 2px solid #fff; padding-bottom: 3px;
    }
    .search-btn {
      position: absolute; right: 12px;
      top: max(18px, env(safe-area-inset-top, 0px));
      font-size: 22px; cursor: pointer; z-index: 15;
    }

    .view-toggle {
      position: absolute; left: 12px;
      top: max(18px, env(safe-area-inset-top, 0px));
      z-index: 15; cursor: pointer;
      background: rgba(0,0,0,.5); border-radius: 50%;
      width: 40px; height: 40px; display: flex;
      align-items: center; justify-content: center;
      font-size: 20px; color: #fff; border: 1px solid rgba(255,255,255,.3);
    }
    .view-toggle:active { transform: scale(0.9); }

    .sound-toggle {
      position: absolute; right: 12px;
      bottom: calc(240px + env(safe-area-inset-bottom, 0px));
      z-index: 13; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.5); border-radius: 50%;
      width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.3);
    }
    .sound-toggle svg {
      width: 24px; height: 24px; stroke-width: 2;
      stroke: currentColor; fill: none;
    }

    .bottom-bar {
      position: absolute; bottom: 0; left: 0; width: 100%;
      height: calc(80px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(0,0,0,.8); display: flex;
      justify-content: space-around; align-items: center;
      border-top: 1px solid #333; z-index: 12;
    }
    .b-nav {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; cursor: pointer; color: #fff;
      font-size: 11px; opacity: 0.6;
    }
    .b-nav.active { opacity: 1; }
    .b-icon { font-size: 24px; }
    .create-box {
      width: 45px; height: 32px; border-radius: 8px;
      background: linear-gradient(90deg, #25f4ee 0%, #fe28ea 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: bold; color: #000;
      cursor: pointer; border: none; z-index: 20; position: relative;
    }
    .create-box:active { transform: scale(0.95); }

    .upload-panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: #fff; border-radius: 20px 20px 0 0;
      padding: 20px 24px; padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px));
      z-index: 25; transform: translateY(100%);
      transition: transform 0.3s ease; max-height: 85vh;
      overflow-y: auto; overscroll-behavior: contain; color: #000;
    }
    .upload-panel.show { transform: translateY(0); }
    .panel-close {
      text-align: right; font-size: 24px;
      cursor: pointer; margin-bottom: 12px; color: #000;
    }
    .file-input-wrapper {
      border: 2px dashed #ccc; border-radius: 12px;
      padding: 24px 20px; text-align: center;
      cursor: pointer; margin-bottom: 16px;
    }
    .file-input-wrapper:hover { border-color: #fe28ea; }
    .file-input-wrapper p { margin-top: 10px; color: #666; font-size: 14px; }
    input[type="file"] { display: none; }
    .preview-container {
      width: 100%; max-height: 40vh; border-radius: 12px;
      margin-bottom: 16px; display: none; background: #000; overflow: hidden;
    }
    .preview-container video { 
      width: 100%; height: 100%; object-fit: contain;
      border-radius: 12px; display: block; 
    }
    .caption-input {
      width: 100%; min-height: 44px; padding: 12px 16px;
      border-radius: 10px; border: 1px solid #ddd;
      background: #f9f9f9; color: #000; margin-bottom: 14px;
      font-size: 15px; line-height: 1.5; resize: none; outline: none;
    }
    .upload-btn {
      width: 100%; padding: 14px; border-radius: 10px;
      border: none; background: linear-gradient(90deg, #25f4ee 0%, #fe28ea 100%);
      color: #fff; font-size: 17px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splashScreen"></div>
  <div class="app" id="app">
    <div class="video-area" id="videoArea">
      <div class="video-placeholder" id="videoPlaceholder">กดปุ่ม + เพื่ออัปโหลดวิดีโอ</div>
      <video id="mainVideo" playsinline muted loop style="display:none;" preload="auto" webkit-playsinline></video>
      <div class="play-pause-indicator" id="playPauseBtn">▶</div>
    </div>
    <div class="progress-line" id="progressBar"><div class="progress-done" id="progressFill"></div></div>
    
    <div class="view-toggle" id="viewToggle" title="สลับเต็มจอ/พอดีจอ">⛶</div>
    
    <div class="sound-toggle" id="soundToggle" title="เปิด/ปิดเสียง">
      <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19 7v10M23 10v4"></path>
      </svg>
    </div>
    
    <div class="top-bar">
      <span class="tab" id="tab1">กำลังติดตาม</span>
      <span class="tab active" id="tab2">สำหรับคุณ</span>
    </div>
    <div class="search-btn">🔍</div>
    <div class="right-menu">
      <div class="r-btn prof-box"><div class="prof-img"></div><div class="follow-add">+</div></div>
      <div class="r-btn" id="likeBtn"><div class="r-icon">❤️</div><div class="r-num" id="likeCount">0</div></div>
      <div class="r-btn"><div class="r-icon">💬</div><div class="r-num">0</div></div>
      <div class="r-btn"><div class="r-icon">⬜</div><div class="r-num">0</div></div>
      <div class="r-btn"><div class="r-icon">➤</div><div class="r-num">0</div></div>
      <div class="r-btn"><div class="music-cover">🎵</div></div>
    </div>
    <div class="info-left" id="postInfo">
      <div class="username">ชื่อผู้ใช้</div>
      <div class="caption" id="videoCaption"></div>
      <div class="sound-name">🎵 เสียงต้นฉบับ — Thaipodee</div>
    </div>
    <div class="bottom-bar">
      <div class="b-nav active"><div class="b-icon">🏠</div><div>หน้าหลัก</div></div>
      <div class="b-nav"><div class="b-icon">🛒</div><div>ร้านค้า</div></div>
      <button class="create-box" id="createBtn">+</button>
      <div class="b-nav"><div class="b-icon">💬</div><div>ข้อความ</div></div>
      <div class="b-nav"><div class="b-icon">👤</div><div>โปรไฟล์</div></div>
    </div>
    <div class="upload-panel" id="uploadPanel">
      <div class="panel-close" id="closeUpload">✕</div>
      <div class="file-input-wrapper" id="fileWrapper">
        <div style="font-size: 36px; margin-bottom: 8px;">📹</div>
        <p>กดเพื่อเลือกวิดีโอ<br>รองรับ MP4, MOV</p>
        <input type="file" id="videoInput" accept="video/*" />
      </div>
      <div class="preview-container" id="previewContainer">
        <video id="videoPreview" controls muted playsinline preload="auto" webkit-playsinline></video>
      </div>
      <textarea class="caption-input" id="captionInput" placeholder="เขียนคำบรรยายวิดีโอ..."></textarea>
      <button class="upload-btn" id="confirmBtn">โพสต์วิดีโอ</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('✅ โหลดเสร็จ — ล็อกเปิด-ปิดวิดีโอ + ปรับขนาดอัตโนมัติ');

      const createBtn = document.getElementById('createBtn');
      const uploadPanel = document.getElementById('uploadPanel');
      const closeUpload = document.getElementById('closeUpload');
      const fileWrapper = document.getElementById('fileWrapper');
      const videoInput = document.getElementById('videoInput');
      const previewContainer = document.getElementById('previewContainer');
      const videoPreview = document.getElementById('videoPreview');
      const captionInput = document.getElementById('captionInput');
      const confirmBtn = document.getElementById('confirmBtn');
      const videoArea = document.getElementById('videoArea');
      const videoPlaceholder = document.getElementById('videoPlaceholder');
      const mainVideo = document.getElementById('mainVideo');
      const postInfo = document.getElementById('postInfo');
      const videoCaption = document.getElementById('videoCaption');
      const progressFill = document.getElementById('progressFill');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const likeBtn = document.getElementById('likeBtn');
      const likeCount = document.getElementById('likeCount');
      const soundToggle = document.getElementById('soundToggle');
      const soundIcon = document.getElementById('soundIcon');
      const viewToggle = document.getElementById('viewToggle');

      let isMuted = true;
      let pendingVideo = null;
      let isLiked = false, likeNum = 0;

      // ✅ ปุ่ม + อัปโหลด — ล็อก
      if (createBtn) createBtn.addEventListener('click', e => { e.preventDefault(); uploadPanel.classList.add('show'); });
      if (closeUpload) closeUpload.addEventListener('click', () => { uploadPanel.classList.remove('show'); resetForm(); });
      if (fileWrapper) fileWrapper.addEventListener('click', () => videoInput.click());
      if (videoInput) videoInput.addEventListener('change', e => {
        const f = e.target.files[0]; if (!f) return;
        pendingVideo = { file: f, url: URL.createObjectURL(f) };
        videoPreview.src = pendingVideo.url;
        previewContainer.style.display = 'block';
        confirmBtn.style.display = 'block';
        fileWrapper.style.display = 'none';
      });
      if (confirmBtn) confirmBtn.addEventListener('click', () => {
        if (!pendingVideo) return alert('กรุณาเลือกวิดีโอก่อน');
        showVideo(pendingVideo.url, captionInput.value.trim());
        uploadPanel.classList.remove('show');
        resetForm();
      });
      function resetForm() {
        pendingVideo = null; videoInput.value = ''; videoPreview.src = '';
        previewContainer.style.display = 'none'; confirmBtn.style.display = 'none';
        fileWrapper.style.display = 'block'; captionInput.value = '';
      }

      // ✅ ตรวจจับอัตราส่วน 9:16 / 16:9 อัตโนมัติ
      function checkAspectRatio(videoEl) {
        videoEl.addEventListener('loadedmetadata', function() {
          const ratio = videoEl.videoWidth / videoEl.videoHeight;
          videoEl.classList.remove('ar-vertical', 'ar-horizontal');
          if (ratio < 1) {
            // 9:16 แนวตั้ง — เต็มจอ
            videoEl.classList.add('ar-vertical');
            console.log('✅ ตรวจพบวิดีโอแนวตั้ง 9:16 → เต็มจอ');
          } else {
            // 16:9 แนวนอน — พอดีจอ ไม่ตัดขอบ
            videoEl.classList.add('ar-horizontal');
            console.log('✅ ตรวจพบวิดีโอแนวนอน 16:9 → พอดีจอ');
          }
        });
      }

      function showVideo(url, captionText) {
        mainVideo.src = url;
        mainVideo.style.display = 'block';
        mainVideo.muted = isMuted;
        videoPlaceholder.style.display = 'none';
        postInfo.style.display = 'block';
        videoCaption.textContent = captionText || 'วิดีโอใหม่';
        
        // ตรวจจับอัตราส่วนอัตโนมัติ
        checkAspectRatio(mainVideo);
        
        mainVideo.ontimeupdate = () => {
          if (mainVideo.duration) progressFill.style.width = (mainVideo.currentTime / mainVideo.duration * 100) + '%';
        };
        mainVideo.play().catch(() => {});
      }

      // ✅ ปุ่มเปิด/ปิดเสียง — ล็อก
      if (soundToggle && mainVideo) {
        soundToggle.addEventListener('click', function() {
          isMuted = !isMuted;
          mainVideo.muted = isMuted;
          soundIcon.innerHTML = isMuted 
            ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>'
            : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19 7v10M23 10v4"></path>';
        });
      }

      // ✅ ปุ่มสลับขนาดจอ — ล็อก
      let fitMode = false;
      if (viewToggle && mainVideo) {
        viewToggle.addEventListener('click', function() {
          fitMode = !fitMode;
          mainVideo.style.objectFit = fitMode ? 'contain' : '';
          viewToggle.title = fitMode ? 'กลับเต็มจอ' : 'สลับพอดีจอ';
        });
      }

      // ✅ กดวิดีโอ เล่น/หยุด — ล็อกไว้แน่นอน
      if (videoArea && mainVideo) {
        videoArea.addEventListener('click', function(e) {
          if (e.target.closest('.r-btn') || e.target.closest('.bottom-bar') || 
              e.target.closest('.upload-panel') || e.target.closest('.sound-toggle') || 
              e.target.closest('.view-toggle')) return;
          if (!mainVideo.src) return;
          if (mainVideo.paused) {
            mainVideo.play();
            playPauseBtn.textContent = '⏸';
          } else {
            mainVideo.pause();
            playPauseBtn.textContent = '▶';
          }
          playPauseBtn.classList.add('show');
          setTimeout(() => playPauseBtn.classList.remove('show'), 1500);
        });
      }

      // ✅ ปุ่มหัวใจ — ล็อก
      if (likeBtn) {
        likeBtn.addEventListener('click', function() {
          isLiked = !isLiked;
          likeNum += isLiked ? 1 : -1;
          likeCount.textContent = likeNum;
          likeBtn.querySelector('.r-icon').style.color = isLiked ? '#ff0050' : '#fff';
        });
      }

      console.log('✅ ทุกอย่างล็อกเรียบร้อย — เต็มจออัตโนมัติตาม 9:16/16:9');
    });
  </script>
</body>
</html>
