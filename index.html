<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<meta name="theme-color" content="#000">
<title>ThaiPodee v1189</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;font-family:-apple-system,sans-serif;color:#fff;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
.page{position:absolute;inset:0;z-index:1;transition:opacity .25s ease;}
.page.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.top-bar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:50;font-size:11px;opacity:0.5;}
.video-wrap{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:1;}
video{width:100%;height:100%;object-fit:contain;display:block;}

.progress-bar{position:absolute;bottom:80px;left:16px;right:16px;height:30px;z-index:10;cursor:pointer;}
.progress-bg{position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;height:2px;background:rgba(255,255,255,.2);}
.progress-dot{position:absolute;top:50%;transform:translateY(-50%);width:12px;height:12px;background:#fff;border-radius:50%;margin-left:-6px;box-shadow:0 0 4px rgba(0,0,0,.5);}

.info-area{position:absolute;bottom:110px;left:16px;right:90px;z-index:5;}
.info-name{font-weight:bold;font-size:15px;margin-bottom:4px;cursor:pointer;}
.info-desc{font-size:13px;opacity:0.9;}

.side-buttons{position:absolute;right:12px;bottom:130px;display:flex;flex-direction:column;gap:20px;align-items:center;z-index:6;}
.side-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.side-icon{font-size:28px;}
.side-label{font-size:10px;opacity:0.7;}
.avatar-box{width:44px;height:44px;border-radius:50%;border:2px solid #fff;overflow:hidden;position:relative;cursor:pointer;}
.avatar-box img{width:100%;height:100%;object-fit:cover;}
.avatar-plus{position:absolute;bottom:-2px;right:-2px;background:#ff3355;color:#fff;width:16px;height:16px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;display:flex;justify-content:space-around;align-items:center;background:#000;border-top:1px solid #222;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.nav-icon{font-size:22px;}
.nav-add{width:46px;height:34px;background:#ff3355;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}

.profile-page{background:#fff;color:#000;overflow-y:auto;padding-bottom:80px;z-index:3;}
.profile-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;}
.back-btn{font-size:22px;cursor:pointer;}
.profile-head{text-align:center;padding:20px 16px;}
.profile-avatar-big{width:90px;height:90px;border-radius:50%;border:2px solid #ddd;overflow:hidden;margin:0 auto 12px;position:relative;cursor:pointer;}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover;}
.profile-name-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:4px;cursor:pointer;}
.profile-name{font-size:20px;font-weight:bold;}
.profile-uname-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:16px;cursor:pointer;}
.profile-uname{color:#666;font-size:14px;}
.edit-mark{color:#ff3355;font-size:14px;}
.profile-stats{display:flex;justify-content:center;gap:30px;margin-bottom:20px;}
.stat-num{font-weight:bold;font-size:18px;}
.stat-txt{font-size:11px;color:#888;}
.videos-head{padding:0 16px 8px;font-weight:bold;}
.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 20px;}
.video-card{aspect-ratio:9/12;background:#e8e8e8;border-radius:4px;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.play-icon{font-size:24px;color:#666;}
.del-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.empty-text{grid-column:1/-1;text-align:center;padding:40px 20px;color:#999;}

.hidden-input{display:none;}
</style>
</head>
<body>
<input type="file" id="avatarInput" accept="image/*" class="hidden-input">
<input type="file" id="videoInput" accept="video/*" class="hidden-input">

<div class="page" id="homePage">
  <div class="top-bar">v1189</div>
  <div class="video-wrap" id="videoTap">
    <video id="mainVideo" playsinline webkit-playsinline loop muted></video>
    <div class="progress-bar" id="progressBar">
      <div class="progress-bg"></div>
      <div class="progress-dot" id="progressDot"></div>
    </div>
  </div>
  <div class="info-area">
    <div class="info-name" id="dispUname">@thaipodee</div>
    <div class="info-desc">ยินดีต้อนรับสู่ ThaiPodee</div>
  </div>

  <div class="side-buttons">
    <div class="side-btn" data-go="profile">
      <div class="avatar-box" id="avSideBtn">
        <img id="avSideImg" src="" alt="ฉัน">
        <span class="avatar-plus">+</span>
      </div>
    </div>
    <div class="side-btn" id="likeBtn">
      <span class="side-icon" id="likeIcon">🤍</span>
      <span class="side-label" id="likeCount">0</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">💬</span>
      <span class="side-label">0</span>
    </div>
    <div class="side-btn" id="saveBtn">
      <span class="side-icon" id="saveIcon">⬜</span>
      <span class="side-label">บันทึก</span>
    </div>
    <div class="side-btn" id="shareBtn">
      <span class="side-icon">↗️</span>
      <span class="side-label">แชร์</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">🎵</span>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-btn" data-go="home"><span class="nav-icon">🏠</span></div>
    <div class="nav-btn" data-go="shop"><span class="nav-icon">🛒</span></div>
    <div class="nav-btn" id="upBtn"><span class="nav-add">+</span></div>
    <div class="nav-btn" data-go="msg"><span class="nav-icon">💬</span></div>
    <div class="nav-btn" data-go="profile"><span class="nav-icon">👤</span></div>
  </div>
</div>

<div class="page hidden" id="profilePage">
  <div class="profile-top">
    <span class="back-btn" data-go="home">←</span>
    <span id="shareProf">↗️</span>
  </div>
  <div class="profile-head">
    <div class="profile-avatar-big" id="avBigBtn">
      <img id="avBigImg" src="" alt="ฉัน">
      <span class="avatar-plus">+</span>
    </div>
    <div class="profile-name-row" id="nameRow">
      <span class="profile-name" id="pName">ThaiPodee</span>
      <span class="edit-mark">✏️</span>
    </div>
    <div class="profile-uname-row" id="unameRow">
      <span class="profile-uname" id="pUname">@thaipodee</span>
      <span class="edit-mark">✏️</span>
    </div>
    <div class="profile-stats">
      <div><div class="stat-num">9</div><div class="stat-txt">ติดตาม</div></div>
      <div><div class="stat-num" id="follCount">0</div><div class="stat-txt">ผู้ติดตาม</div></div>
      <div><div class="stat-num" id="totalLike">0</div><div class="stat-txt">ถูกใจ</div></div>
    </div>
  </div>
  <div class="videos-head">วิดีโอของฉัน</div>
  <div class="video-grid" id="vidGrid"></div>

  <div class="bottom-nav">
    <div class="nav-btn" data-go="home"><span class="nav-icon">🏠</span></div>
    <div class="nav-btn" data-go="shop"><span class="nav-icon">🛒</span></div>
    <div class="nav-btn" id="upBtn2"><span class="nav-add">+</span></div>
    <div class="nav-btn" data-go="msg"><span class="nav-icon">💬</span></div>
    <div class="nav-btn" data-go="profile" style="opacity:1;"><span class="nav-icon">👤</span></div>
  </div>
</div>

<script>
const K = {
  av: 'tp_av',
  name: 'tp_name',
  uname: 'tp_uname',
  vids: 'tp_vids',
  likes: 'tp_likes'
};

let vidList = JSON.parse(localStorage.getItem(K.vids) || '[]');
let totalLikes = parseInt(localStorage.getItem(K.likes) || '0');
let isLiked = false;
let isDrag = false;

function syncAll(){
  const n = localStorage.getItem(K.name) || 'ThaiPodee';
  const u = localStorage.getItem(K.uname) || '@thaipodee';
  const av = localStorage.getItem(K.av);

  document.getElementById('pName').textContent = n;
  document.getElementById('pUname').textContent = u;
  document.getElementById('dispUname').textContent = u;

  const defAv = 'thaipodee_logo_icon.png';
  document.getElementById('avSideImg').src = av || defAv;
  document.getElementById('avBigImg').src = av || defAv;

  document.getElementById('likeCount').textContent = totalLikes;
  document.getElementById('totalLike').textContent = totalLikes;
}

function goPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
  if(p==='home') document.getElementById('homePage').classList.remove('hidden');
  if(p==='profile'){
    document.getElementById('profilePage').classList.remove('hidden');
    renderVids();
  }
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>goPage(b.dataset.go));

document.getElementById('avSideBtn').onclick = ()=>avatarInput.click();
document.getElementById('avBigBtn').onclick = ()=>avatarInput.click();
document.getElementById('avatarInput').onchange = e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{
    localStorage.setItem(K.av, ev.target.result);
    syncAll();
  };
  r.readAsDataURL(f);
};

document.getElementById('nameRow').onclick = ()=>{
  const n = prompt('เปลี่ยนชื่อ', localStorage.getItem(K.name) || 'ThaiPodee');
  if(n && n.trim()){localStorage.setItem(K.name, n.trim());syncAll();}
};
document.getElementById('unameRow').onclick = ()=>{
  const u = prompt('เปลี่ยนชื่อผู้ใช้', (localStorage.getItem(K.uname) || '@thaipodee').replace('@',''));
  if(u && u.trim()){localStorage.setItem(K.uname, '@'+u.trim());syncAll();}
};

document.getElementById('upBtn').onclick = ()=>videoInput.click();
document.getElementById('upBtn2').onclick = ()=>videoInput.click();
document.getElementById('videoInput').onchange = e=>{
  const f = e.target.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  document.getElementById('mainVideo').src = url;
  document.getElementById('mainVideo').load();
  document.getElementById('mainVideo').play();
  vidList.unshift({id:Date.now().toString(), name:f.name, url:url});
  localStorage.setItem(K.vids, JSON.stringify(vidList));
  goPage('home');
};

function renderVids(){
  const g = document.getElementById('vidGrid');
  g.innerHTML = '';
  if(!vidList.length){g.innerHTML='<div class="empty-text">ยังไม่มีวิดีโอ</div>';return;}
  vidList.forEach((v,i)=>{
    const c = document.createElement('div');
    c.className='video-card';
    c.innerHTML='<span class="play-icon">▶</span><button class="del-btn" data-i="'+i+'">×</button>';
    c.onclick = e=>{
      if(e.target.classList.contains('del-btn')) return;
      document.getElementById('mainVideo').src = v.url;
      document.getElementById('mainVideo').load();
      document.getElementById('mainVideo').play();
      goPage('home');
    };
    c.querySelector('.del-btn').onclick = e=>{
      e.stopPropagation();
      if(confirm('ลบวิดีโอนี้?')){vidList.splice(i,1);localStorage.setItem(K.vids,JSON.stringify(vidList));renderVids();}
    };
    g.appendChild(c);
  });
}

async function share(){
  if(navigator.share){
    try{await navigator.share({title:'ThaiPodee',url:location.href});}
    catch{await navigator.clipboard.writeText(location.href);alert('คัดลอกลิงก์แล้ว ✅');}
  }else{await navigator.clipboard.writeText(location.href);alert('คัดลอกลิงก์แล้ว ✅');}
}
document.getElementById('shareBtn').onclick = share;
document.getElementById('shareProf').onclick = share;

const v = document.getElementById('mainVideo');
const dot = document.getElementById('progressDot');
v.addEventListener('timeupdate',()=>{
  if(!v.duration || isDrag) return;
  const p = v.currentTime / v.duration;
  dot.style.left = (p*100)+'%';
});
function seek(x){
  if(!v.duration) return;
  const r = document.getElementById('progressBar').getBoundingClientRect();
  let p = (x - r.left) / r.width;
  p = Math.max(0, Math.min(1, p));
  v.currentTime = p * v.duration;
  dot.style.left = (p*100)+'%';
}
document.getElementById('progressBar').onmousedown = e=>{isDrag=true;seek(e.clientX);};
document.getElementById('progressBar').ontouchstart = e=>{isDrag=true;seek(e.touches[0].clientX);};
document.onmousemove = e=>{if(!isDrag)return;seek(e.clientX);};
document.ontouchmove = e=>{if(!isDrag)return;seek(e.touches[0].clientX);};
document.onmouseup = document.ontouchend = ()=>isDrag=false;

document.getElementById('videoTap').onclick = e=>{
  if(e.target.closest('.progress-bar')) return;
  if(v.paused || v.muted){v.muted=false;v.play();}else{v.pause();}
};

document.getElementById('likeBtn').onclick = ()=>{
  isLiked = !isLiked;
  totalLikes += isLiked ? 1 : -1;
  localStorage.setItem(K.likes, totalLikes);
  document.getElementById('likeIcon').textContent = isLiked ? '❤️' : '🤍';
  syncAll();
};

let saved = false;
document.getElementById('saveBtn').onclick = ()=>{
  saved = !saved;
  document.getElementById('saveIcon').textContent = saved ? '⬛' : '⬜';
};

syncAll();
</script>
</body>
</html>
