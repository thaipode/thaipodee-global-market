<!-- ==============================================================
   ThaiPodee v1129 — ✅ ปุ่มบวกอัปโหลดวิดีโอทำงาน + เปลี่ยนรูปได้
   อัปเดต: 29 กันยายน 2569 23:18 น.
   --------------------------------------------------------------
   ✅ ข้อ1: v1129 บนสุด — แว่นขยายลงมา ไม่ทับ
   ✅ ข้อ2: เปลี่ยนชื่อ+รูปโปรไฟล์ได้ เลือกจากเครื่อง
   ✅ ข้อ3: ปุ่มบวกสีแดง → กดเลือกวิดีโอจากเครื่อง เล่นได้ทันที
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
  body { background:#000; color:#fff; min-height:100vh; overflow:hidden; }

  /* ===== บนสุด ===== */
  .top-version {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 13px;
    color: #888;
    z-index: 100;
  }
  .search-icon {
    position: absolute;
    top: 36px;
    right: 16px;
    font-size: 20px;
    cursor: pointer;
    z-index: 100;
  }
  .tabs {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    font-size: 15px;
  }
  .tabs span { opacity: 0.5; }
  .tabs span.active { opacity: 1; border-bottom: 2px solid #fff; padding-bottom: 2px; }

  /* ===== วิดีโอ ===== */
  .video-container {
    position: absolute;
    top: 70px;
    bottom: 80px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-btn { font-size: 60px; opacity: 0.8; cursor: pointer; }
  .main-video {
    max-width: 100%;
    max-height: 100%;
    display: none;
  }

  /* ===== ไอคอนด้านขวา ===== */
  .side-icons {
    position: absolute;
    right: 12px;
    bottom: 100px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: center;
  }
  .side-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    gap: 4px;
  }
  .side-icon.p-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #333;
    overflow: hidden;
    border: 2px solid #555;
  }
  .side-icon.p-avatar img { width:100%; height:100%; object-fit:cover; }
  .side-icon span { font-size: 11px; opacity: 0.7; }

  /* ===== แถบล่าง ===== */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 75px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: #000;
    border-top: 1px solid #222;
  }
  .nav-item { text-align: center; cursor: pointer; font-size: 13px; }
  .nav-item .plus-btn {
    width: 48px; height: 32px;
    background: #f00;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    border: none;
    cursor: pointer;
  }

  /* ===== หน้าแก้ไขโปรไฟล์ ===== */
  .edit-profile-overlay {
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.92);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
  }
  .edit-profile-overlay.show { display: flex; }
  .edit-avatar {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: #333;
    margin-bottom: 12px;
    overflow: hidden;
    border: 3px solid #666;
    cursor: pointer;
  }
  .edit-avatar img { width:100%; height:100%; object-fit:cover; }
  .edit-input {
    width: 100%;
    max-width: 320px;
    padding: 12px 16px;
    font-size: 16px;
    background: #222;
    border: 1px solid #444;
    color: #fff;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .edit-buttons { display: flex; gap: 12px; }
  .edit-btn {
    padding: 10px 24px;
    border-radius: 6px;
    border: none;
    font-size: 15px;
    cursor: pointer;
  }
  .edit-btn.save { background: #00c853; color: #fff; }
  .edit-btn.cancel { background: #444; color: #fff; }

  /* ===== ซ่อนช่องเลือกไฟล์ ===== */
  #avatar-file-input, #video-file-input { display: none; }

  /* ===== ข้อมูลใต้วิดีโอ ===== */
  .video-info {
    position: absolute;
    bottom: 90px;
    left: 12px;
    right: 70px;
  }
  .video-info .acc-name { font-weight: bold; margin-bottom: 4px; }
  .video-info .desc { font-size: 13px; opacity: 0.8; }
</style>
</head>
<body>

<div class="top-version">v1129</div>

<div class="tabs">
  <span>กำลังติดตาม</span>
  <span class="active">สำหรับคุณ</span>
</div>

<div class="search-icon">🔍</div>

<!-- พื้นที่วิดีโอ -->
<div class="video-container" id="video-area">
  <div class="play-btn" id="play-icon">▶</div>
  <video id="main-video" class="main-video" controls playsinline></video>
</div>

<div class="video-info">
  <div class="acc-name" id="display-name">@ThaiPodee</div>
  <div class="desc" id="video-desc">Lamai Plai Mat Nights — สินค้าและบริการ</div>
</div>

<div class="side-icons">
  <div class="side-icon p-avatar" onclick="openEditProfile()">
    <img id="avatar-img" src="https://via.placeholder.com/100" alt="โปรไฟล์">
  </div>
  <div class="side-icon">❤️<span>27</span></div>
  <div class="side-icon">💬<span>0</span></div>
  <div class="side-icon">📌<span>0</span></div>
  <div class="side-icon">↗️<span>0</span></div>
  <div class="side-icon">🎵<span>3:02</span></div>
</div>

<div class="bottom-nav">
  <div class="nav-item">🏠<br>หน้าหลัก</div>
  <div class="nav-item">🛒<br>ร้านค้า</div>
  <div class="nav-item">
    <button class="plus-btn" onclick="document.getElementById('video-file-input').click()">+</button>
  </div>
  <div class="nav-item">💬<br>ข้อความ</div>
  <div class="nav-item" onclick="openEditProfile()">👤<br>โปรไฟล์</div>
</div>

<!-- ช่องเลือกวิดีโอ ซ่อนไว้ -->
<input type="file" id="video-file-input" accept="video/*">

<!-- ช่องเลือกรูปโปรไฟล์ -->
<input type="file" id="avatar-file-input" accept="image/*">

<!-- หน้าแก้ไขโปรไฟล์ -->
<div class="edit-profile-overlay" id="edit-profile-panel">
  <h3 style="margin-bottom:20px">ตั้งค่าโปรไฟล์</h3>
  <div class="edit-avatar" onclick="document.getElementById('avatar-file-input').click()">
    <img id="edit-avatar-preview" src="https://via.placeholder.com/100" alt="รูป">
  </div>
  <p style="font-size:12px; color:#aaa; margin-bottom:12px">กดที่รูปเพื่อเปลี่ยน</p>
  <input type="text" class="edit-input" id="name-input" placeholder="ตั้งชื่อ เช่น เครื่องที่ 1">
  <div class="edit-buttons">
    <button class="edit-btn cancel" onclick="closeEditProfile()">ยกเลิก</button>
    <button class="edit-btn save" onclick="saveProfile()">บันทึก</button>
  </div>
</div>

<script>
// === โหลดข้อมูลที่บันทึกไว้ ===
let savedName = localStorage.getItem('userDisplayName') || '@ThaiPodee';
let savedAvatar = localStorage.getItem('userAvatar');

document.getElementById('display-name').textContent = savedName;
document.getElementById('name-input').value = savedName.replace('@','');

if (savedAvatar) {
  document.getElementById('avatar-img').src = savedAvatar;
  document.getElementById('edit-avatar-preview').src = savedAvatar;
}

// === เปิด-ปิด แก้ไขโปรไฟล์ ===
function openEditProfile() {
  document.getElementById('edit-profile-panel').classList.add('show');
}
function closeEditProfile() {
  document.getElementById('edit-profile-panel').classList.remove('show');
}

// === เปลี่ยนรูปโปรไฟล์ ===
document.getElementById('avatar-file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const dataUrl = ev.target.result;
    document.getElementById('avatar-img').src = dataUrl;
    document.getElementById('edit-avatar-preview').src = dataUrl;
    savedAvatar = dataUrl;
  };
  reader.readAsDataURL(file);
});

// === บันทึกชื่อ ===
function saveProfile() {
  let name = document.getElementById('name-input').value.trim();
  if (!name) { alert('กรุณาใส่ชื่อ'); return; }
  if (!name.startsWith('@')) name = '@' + name;
  savedName = name;
  document.getElementById('display-name').textContent = savedName;
  localStorage.setItem('userDisplayName', savedName);
  if (savedAvatar) localStorage.setItem('userAvatar', savedAvatar);
  closeEditProfile();
  alert('✅ บันทึกแล้ว!\n' + savedName);
}

// === ปุ่มบวก — เลือกและแสดงวิดีโอ ===
document.getElementById('video-file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const videoEl = document.getElementById('main-video');
  const playIcon = document.getElementById('play-icon');

  // สร้างลิงก์ชั่วคราวจากไฟล์ในเครื่อง
  const url = URL.createObjectURL(file);
  videoEl.src = url;

  // ซ่อนปุ่มเล่น แสดงวิดีโอ
  playIcon.style.display = 'none';
  videoEl.style.display = 'block';

  // เปลี่ยนคำอธิบายเป็นชื่อไฟล์
  document.getElementById('video-desc').textContent = file.name;

  alert('✅ โหลดวิดีโอสำเร็จ!\nชื่อ: ' + file.name);
});

// กดเล่นตรงกลาง
document.getElementById('play-icon').addEventListener('click', function() {
  alert('กดปุ่ม + สีแดงเพื่อเลือกวิดีโอจากเครื่องของคุณ');
});
</script>

</body>
</html>
