<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThaiPodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body {
            height: 100vh; overflow: hidden; background: #000; color: #fff;
            position: fixed; inset: 0; width: 100%;
        }

        /* === ตรวจจับอัตโนมัติ — ไม่ต้องเลือกเอง === */
        .video-wrap {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 1; cursor: pointer; background: #000;
        }
        #main-media {
            max-width: 100vw;
            max-height: 100vh;
            width: 100%;
            height: 100%;
            object-fit: contain; /* เห็นครบ ไม่ตัดขอบ ไม่ล้นจอ */
            object-position: center center;
            background: #000;
        }

        .shade-bottom {
            position: fixed; bottom: 0; left: 0; right: 0; height: 200px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            z-index: 2; pointer-events: none;
        }

        .sound-sign {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 48px; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; z-index: 20; text-shadow: 0 0 12px rgba(0,0,0,0.8);
        }
        .sound-sign.show { opacity: 1; }

        .info-left {
            position: fixed; left: 16px; bottom: 90px; right: 95px; z-index: 10;
        }
        .acc-name { font-weight: 700; font-size: 15px; margin-bottom: 6px; word-break: break-word; }
        .desc-text { font-size: 14px; line-height: 1.5; margin-bottom: 8px; color: #f0f0f0; word-break: break-word; }
        .music-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .menu-right {
            position: fixed; right: 10px; bottom: 115px;
            display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10;
        }
        .menu-btn { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .avatar-box { position: relative; width: 42px; height: 42px; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; object-fit: cover; }
        .follow-plus {
            position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 18px; background: #ff2442; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: #fff; line-height: 1;
        }
        .icon { font-size: 26px; pointer-events: none; }
        .num { font-size: 11px; pointer-events: none; color: #fff; }
        .music-disc {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(45deg, #00c6ff, #ff0080);
            display: flex; align-items: center; justify-content: center;
            animation: spin 3s linear infinite; font-size: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .nav-bottom {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: #000; display: flex; justify-content: space-around; align-items: flex-end;
            padding: 10px 15px 20px; border-top: 1px solid #222; z-index: 99;
        }
        .nav-col { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
        .nav-icon { font-size: 24px; pointer-events: none; }
        .nav-label { font-size: 10px; color: #fff; pointer-events: none; }
        .add-btn {
            width: 46px; height: 30px; background: #fff; border-radius: 8px;
            position: relative; cursor: pointer; margin-bottom: 5px;
        }
        .add-btn::before {
            content: ''; position: absolute; width: 18px; height: 2px; background: #000;
            top: 14px; left: 14px;
        }
        .add-btn::after {
            content: ''; position: absolute; width: 2px; height: 18px; background: #000;
            left: 22px; top: 6px;
        }
        .badge {
            position: absolute; top: -3px; right: -8px;
            background: #ff2442; color: #fff; font-size: 9px;
            min-width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; pointer-events: none;
        }

        #upload-input { display: none; }
    </style>
</head>
<body>

<!-- ไม่ต้องเลือกอะไร — เอาไฟล์เข้ามา มันจัดเอง -->
<div class="video-wrap" id="vidWrap" onclick="toggleAudio()">
    <video id="main-media" autoplay loop muted playsinline>
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
    </video>
</div>

<div class="shade-bottom"></div>
<div class="sound-sign" id="soundHint">🔇</div>

<div class="info-left">
    <div class="acc-name">@ThaiPodee_Official</div>
    <div class="desc-text">ยินดีต้อนรับสู่ ThaiPodee Global Market — แพลตฟอร์มของคนไทย ✨</div>
    <div class="music-row">
        <span>🎵</span>
        <span>เสียงต้นฉบับ • ThaiPodee Original</span>
    </div>
</div>

<div class="menu-right">
    <div class="menu-btn" onclick="alert('โปรไฟล์')">
        <div class="avatar-box">
            <img class="avatar" src="https://picsum.photos/seed/thaipodee/100/100" alt="โปรไฟล์">
            <span class="follow-plus" onclick="event.stopPropagation(); alert('ติดตาม')">+</span>
        </div>
    </div>
    <div class="menu-btn" onclick="toggleHeart(this)">
        <span class="icon">❤️</span>
        <span class="num">0</span>
    </div>
    <div class="menu-btn" onclick="alert('คอมเมนต์')">
        <span class="icon">💬</span>
        <span class="num">0</span>
    </div>
    <div class="menu-btn" onclick="toggleStar(this)">
        <span class="icon">⭐</span>
        <span class="num">บันทึก</span>
    </div>
    <div class="menu-btn" onclick="doShare()">
        <span class="icon">➡️</span>
        <span class="num">แชร์</span>
    </div>
    <div class="menu-btn" onclick="alert('เพลง')">
        <div class="music-disc">🎵</div>
        <span class="num" style="font-size:10px; margin-top:4px;">11</span>
    </div>
</div>

<div class="nav-bottom">
    <div class="nav-col" onclick="alert('หน้าหลัก')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าหลัก</span>
    </div>
    <div class="nav-col" onclick="alert('ร้านค้า')">
        <span class="nav-icon">🛍️</span>
        <span class="nav-label">ร้านค้า</span>
    </div>
    <div class="nav-col" onclick="document.getElementById('upload-input').click()">
        <div class="add-btn"></div>
        <input type="file" id="upload-input" accept="video/*,image/*" onchange="doUpload(event)">
    </div>
    <div class="nav-col" onclick="alert('ข้อความ')">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
        <span class="badge">99+</span>
    </div>
    <div class="nav-col" onclick="alert('โปรไฟล์')">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<script>
let isMuted = true;

function toggleAudio() {
    const vid = document.getElementById('main-media');
    const hint = document.getElementById('soundHint');
    isMuted = !isMuted;
    vid.muted = isMuted;
    hint.textContent = isMuted ? '🔇' : '🔊';
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 700);
}

function toggleHeart(el) {
    el.style.color = el.style.color === 'red' ? '' : 'red';
}

function toggleStar(el) {
    el.style.color = el.style.color === 'gold' ? '' : 'gold';
}

function doShare() {
    if (navigator.share) {
        navigator.share({title:'ThaiPodee Global Market', url:window.location.href});
    } else {
        prompt('คัดลอกลิงก์:', window.location.href);
    }
}

// === อัปโหลดแล้วจัดเองเลย ไม่ต้องสั่งอะไรเพิ่ม ===
function doUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const wrap = document.getElementById('vidWrap');
        if (file.type.startsWith('video/')) {
            wrap.innerHTML = `<video id="main-media" autoplay loop muted playsinline style="max-width:100vw; max-height:100vh; width:100%; height:100%; object-fit:contain;">
                <source src="${ev.target.result}" type="${file.type}">
            </video>`;
        } else {
            wrap.innerHTML = `<img id="main-media" src="${ev.target.result}" style="max-width:100vw; max-height:100vh; width:100%; height:100%; object-fit:contain;">`;
        }
        isMuted = true;
    };
    reader.readAsDataURL(file);
}
</script>

</body>
</html>
