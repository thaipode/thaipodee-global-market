   ✅ ชื่อผู้ใช้ + ชื่อวิดีโอ + ความยาว ที่ด้านล่างซ้าย — คืนมาแล้ว

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, sans-serif; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #fff; }

  /* ===== บาร์บน ตรงเป๊ะ ===== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 50px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; z-index: 100; background: #000;
  }
  .top-tabs { display: flex; gap: 24px; font-size: 14px; }
  .top-tabs span { color: #888; cursor: pointer; padding-bottom: 4px; }
  .top-tabs span.active { color: #fff; border-bottom: 1px solid #fff; }
  .top-right { display: flex; align-items: center; gap: 14px; font-size: 13px; color: #888; }
  .search-icon { font-size: 18px; cursor: pointer; }

  /* ===== พื้นที่วิดีโอ ===== */
  .video-wrap {
    position: absolute; inset: 0; padding-top: 50px; padding-bottom: 70px;
  }
  .video-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 48px; color: rgba(255,255,255,0.4); cursor: pointer;
  }
  video {
    width: 100%; height: 100%; object-fit: contain; display: none;
  }

  /* ===== ข้อมูลล่างซ้าย — คืนมาแล้ว ===== */
  .bottom-left-info {
    position: absolute; left: 12px; bottom: 80px; right: 90px;
  }
  .acc-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .vid-name { font-size: 13px; opacity: 0.85; margin-bottom: 2px; }
  .vid-meta { font-size: 11px; color: #888; }

  /* ===== ไอคอนขวาแนวตั้ง — ครบทุกอัน ===== */
  .right-col {
    position: absolute; right: 12px; bottom: 80px;
    display: flex; flex-direction: column; gap: 20px; align-items: center;
  }
  .r-icon {
    display: flex; flex-direction: column; align-items: center;
    gap: 2px; font-size: 22px;
  }
  .r-icon span { font-size: 11px; opacity: 0.7; }
  .compass {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }

  /* ===== แถบล่างแนวนอน — ครบทุกอัน ===== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
    background: #000; display: flex; justify-content: space-around;
    align-items: center; border-top: 1px solid #222; z-index: 100;
  }
  .nav-btn { text-align: center; cursor: pointer; }
  .nav-i { font-size: 20px; margin-bottom: 2px; }
  .nav-t { font-size: 10px; color: #aaa; }
  .plus-red {
    width: 48px; height: 34px; background: #ff0000; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: bold; cursor: pointer;
  }

  /* ===== ซ่อนไฟล์===== */
  #vid-input { display: none; }
</style>
</head>
<body>

<!-- บาร์บน -->
<div class="top-bar">
  <div class="top-tabs">
    <span>กำลังติดตาม</span>
    <span class="active">สำหรับคุณ</span>
  </div>
  <div class="top-right">
    <span>v1129</span>
    <span class="search-icon">🔍</span>
  </div>
</div>

<!-- พื้นที่หลัก -->
<div class="video-wrap">
  <div class="video-center" id="play-btn" onclick="playVid()">▶</div>
  <video id="vid-player" controls playsinline loop></video>

  <!-- ข้อมูลล่างซ้าย — ครบแล้ว -->
  <div class="bottom-left-info" id="info-block" style="display:none;">
    <div class="acc-name" id="u-name">@Thaipodee Master No1</div>
    <div class="vid-name" id="v-name">Lamai Plai Mat Nights – ลำปลายมาศนิทราฯ</div>
    <div class="vid-meta" id="v-meta">3:02</div>
  </div>

  <!-- ไอคอนขวาแนวตั้ง — ครบทุกอัน -->
  <div class="right-col">
    <div class="r-icon"><div class="compass">⊕</div></div>
    <div class="r-icon">❤️<span>27</span></div>
    <div class="r-icon">💬<span>0</span></div>
    <div class="r-icon">📌<span>0</span></div>
    <div class="r-icon">↗️<span>0</span></div>
    <div class="r-icon">🎵<span>3:02</span></div>
  </div>
</div>

<!-- แถบล่างแนวนอน — ครบทุกอัน -->
<div class="bottom-nav">
  <div class="nav-btn">
    <div class="nav-i">🏠</div>
    <div class="nav-t">หน้าหลัก</div>
  </div>
  <div class="nav-btn">
    <div class="nav-i">🛒</div>
    <div class="nav-t">ร้านค้า</div>
  </div>
  <div class="nav-btn" onclick="document.getElementById('vid-input').click()">
    <div class="plus-red">+</div>
  </div>
  <div class="nav-btn">
    <div class="nav-i">💬</div>
    <div class="nav-t">ข้อความ</div>
  </div>
  <div class="nav-btn">
    <div class="nav-i">👤</div>
    <div class="nav-t">โปรไฟล์</div>
  </div>
</div>

<input type="file" id="vid-input" accept="video/*">

<script>
const player = document.getElementById('vid-player');
const playBtn = document.getElementById('play-btn');
const infoBlock = document.getElementById('info-block');

// เลือกและโพสต์วิดีโอ
document.getElementById('vid-input').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;

  const reader = new FileReader();
  reader.onload = ev => {
    player.src = ev.target.result;
    playBtn.style.display = 'none';
    player.style.display = 'block';
    
    // แสดงชื่อและข้อมูล
    infoBlock.style.display = 'block';
    document.getElementById('v-name').textContent = f.name;
    
    alert('✅ อัปโหลดวิดีโอเรียบร้อย!');
  };
  reader.readAsDataURL(f);
});

function playVid() {
  if (player.src) player.play();
}
</script>

</body>
</html>
