<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THAIPODEE V2026</title>
    <link rel="icon" href="https://i.imgur.com/8ZxQrL9.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; padding-bottom: 80px; }

        /* Header */
        .header {
            position: fixed; top: 0; left: 0; right: 0; height: 50px;
            background: #000; display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; border-bottom: 1px solid #333; z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .logo { width: 28px; height: 28px; border-radius: 4px; }
        .title { font-size: 16px; font-weight: bold; }
        .version { font-size: 11px; color: #888; background: #222; padding: 2px 6px; border-radius: 4px; }
        .menu-btn { font-size: 24px; cursor: pointer; padding: 8px; }

        /* Video Area */
        .video-area {
            margin-top: 50px; width: 100%; min-height: 60vh;
            background: linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; padding: 20px;
        }
        .video-text { color: #ccc; font-size: 14px; text-align: center; margin-bottom: 20px; }
        .video-placeholder {
            width: 100%; max-width: 400px; aspect-ratio: 9/16;
            background: rgba(0,0,0,0.3); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #888; font-size: 14px;
            border: 2px dashed #555;
        }

        /* Right Buttons */
        .side-buttons {
            position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 28px; z-index: 50;
        }
        .side-btn {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; padding: 8px;
        }
        .side-icon { font-size: 26px; }
        .side-label { font-size: 10px; color: #aaa; margin-top: 2px; }

        /* Info Bar */
        .info-bar {
            padding: 12px; display: flex; align-items: flex-start; gap: 10px;
            border-bottom: 1px solid #222;
        }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #4f46e5; flex-shrink: 0; }
        .info-text { flex: 1; }
        .username { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .desc { font-size: 13px; color: #ccc; line-height: 1.4; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: #000; border-top: 1px solid #333;
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            cursor: pointer; padding: 8px;
        }
        .nav-icon { font-size: 20px; }
        .nav-label { font-size: 11px; color: #aaa; }
        .plus-btn {
            width: 44px; height: 32px; background: #fff; border-radius: 6px;
            color: #000; font-size: 22px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }

        /* Upload Modal */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 300; display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #111; border-radius: 12px; padding: 24px; width: 100%; max-width: 400px;
            border: 1px solid #333;
        }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .input-field {
            width: 100%; padding: 12px; margin-bottom: 12px;
            background: #222; border: 1px solid #444; border-radius: 8px;
            color: #fff; font-size: 14px;
        }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            margin-top: 8px;
        }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-close { background: #333; color: #fff; }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-left">
        <img src="https://i.imgur.com/8ZxQrL9.png" alt="Logo" class="logo">
        <span class="title">THAIPODEE</span>
        <span class="version">V2026</span>
    </div>
    <div class="menu-btn" onclick="alert('เมนูหลัก — โปรไฟล์, ตะกร้า, คำสั่งซื้อ, คูปอง, ครีเอเตอร์, ข้อความ, โปรโมท, ขยายธุรกิจ')">☰</div>
</div>

<!-- Video Area -->
<div class="video-area">
    <div class="video-placeholder">วิดีโอ / เนื้อหา</div>
    <p class="video-text">THAIPODEE V2026 — แพลตฟอร์มตลาดโลก จากไทยสู่ทั่วโลก 🌍</p>
</div>

<!-- Right Buttons -->
<div class="side-buttons">
    <div class="side-btn" onclick="alert('❤️ กดถูกใจแล้ว!')"><span class="side-icon">❤️</span><span class="side-label">ถูกใจ</span></div>
    <div class="side-btn" onclick="alert('💬 เปิดความคิดเห็น')"><span class="side-icon">💬</span><span class="side-label">ความคิด</span></div>
    <div class="side-btn" onclick="alert('↗️ แชร์แล้ว!')"><span class="side-icon">↗️</span><span class="side-label">แชร์</span></div>
    <div class="side-btn" onclick="alert('🛒 เข้าตะกร้าสินค้า')"><span class="side-icon">🛒</span><span class="side-label">ตะกร้า</span></div>
</div>

<!-- Info Bar -->
<div class="info-bar">
    <div class="avatar"></div>
    <div class="info-text">
        <div class="username">@thaipodee_official</div>
        <div class="desc">THAIPODEE V2026 — แพลตฟอร์มออนไลน์ระดับโลก ซื้อ ขาย แชร์ ได้ทุกที่ทั่วโลก 🌍 🇹🇭</div>
    </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
    <div class="nav-item" onclick="alert('🏠 หน้าแรก')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าแรก</span>
    </div>
    <div class="nav-item" onclick="alert('🔍 ค้นหา')">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">ค้นหา</span>
    </div>
    <div class="nav-item" onclick="openUpload()">
        <div class="plus-btn">+</div>
    </div>
    <div class="nav-item" onclick="alert('💬 ข้อความ')">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
    </div>
    <div class="nav-item" onclick="alert('👤 โปรไฟล์')">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<!-- Upload Modal -->
<div class="modal" id="uploadModal">
    <div class="modal-content">
        <h3 class="modal-title">อัปโหลดวิดีโอ / สร้างโพสต์</h3>
        <input type="text" class="input-field" placeholder="คำอธิบายวิดีโอ...">
        <input type="file" class="input-field" accept="video/*" id="videoInput">
        <button class="btn btn-primary" onclick="uploadVideo()">📤 อัปโหลด</button>
        <button class="btn btn-close" onclick="closeUpload()">ปิด</button>
    </div>
</div>

<script>
// ปิดป๊อปอัพติดตั้งแอปถาวร
window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    return false;
});

// อัปโหลดวิดีโอ
function openUpload() {
    document.getElementById('uploadModal').classList.add('show');
}
function closeUpload() {
    document.getElementById('uploadModal').classList.remove('show');
}
function uploadVideo() {
    const input = document.getElementById('videoInput');
    if (input.files.length === 0) {
        alert('กรุณาเลือกไฟล์วิดีโอก่อนครับ');
        return;
    }
    alert('✅ กำลังอัปโหลด: ' + input.files[0].name + '\n\n(ต่อไปจะแสดงความคืบหน้า)');
    closeUpload();
}
</script>

</body>
</html>
