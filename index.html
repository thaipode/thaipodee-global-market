<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Thaipodee Global Market</title>

<link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/thaipodee/thaipodee/main/icon-192.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/thaipodee/thaipodee/main/icon-192.png">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }

  .app-container { height: 100vh; display: flex; flex-direction: column; }
  .top-bar { padding: 10px 0; text-align: center; font-size: 15px; position: fixed; top: 0; left: 0; right: 0; background: #000; z-index: 100; }
  .top-bar span { margin: 0 10px; color: #999; }
  .top-bar span.active { color: #fff; font-weight: bold; border-bottom: 1px solid #fff; padding-bottom: 2px; }

  .content { flex: 1; overflow-y: auto; padding-top: 45px; padding-bottom: 60px; }
  .page { display: none; min-height: 100vh; padding: 10px; }
  .page.active { display: block; }

  .video-card { height: 70vh; display: flex; align-items: center; justify-content: center; color: #666; font-size: 16px; }
  .empty { color: #555; text-align: center; margin-top: 150px; }

  .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: #222; margin: 30px auto 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .profile-name { text-align: center; font-size: 18px; font-weight: bold; }
  .profile-stats { display: flex; justify-content: center; gap: 30px; margin: 20px 0; }
  .stat { text-align: center; }
  .stat-num { font-size: 18px; font-weight: bold; }
  .stat-label { font-size: 11px; color: #888; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; }
  .grid-item { aspect-ratio: 1/1; background: #222; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #555; font-size: 20px; }

  /* ===== เมนูล่าง — ตรงตามรูปเป๊ะ! ===== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 60px; background: #000;
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid #222;
    z-index: 99999;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center;
    color: #999;
    cursor: pointer;
    width: 18%;
  }
  .nav-item.active { color: #fff; }
  .nav-icon { font-size: 22px; }
  .nav-text { font-size: 10px; margin-top: 2px; }

  /* ปุ่มกลาง — + เหมือนรูป */
  .nav-middle {
    width: 28%; display: flex; justify-content: center;
  }
  .plus-btn {
    width: 45px; height: 32px; border-radius: 8px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: bold; color: #000;
    position: relative;
  }
  .plus-btn::before {
    content: '';
    position: absolute;
    width: 40px; height: 40px; border-radius: 50%;
    background: #fff;
    top: -4px;
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- แถบบน -->
  <div class="top-bar">
    <span>กำลังติดตาม</span>
    <span class="active">สำหรับคุณ</span>
  </div>

  <!-- เนื้อหา -->
  <div class="content">
    <div class="page active" id="pg-home">
      <div class="video-card">วิดีโอจะแสดงที่นี่</div>
    </div>

    <div class="page" id="pg-shop">
      <p class="empty">ร้านค้า — เร็วๆ นี้</p>
    </div>

    <div class="page" id="pg-inbox">
      <p class="empty">กล่องข้อความ — ยังไม่มี</p>
    </div>

    <div class="page" id="pg-profile">
      <div class="profile-avatar">👤</div>
      <p class="profile-name">Thaipodee</p>
      <div class="profile-stats">
        <div class="stat"><div class="stat-num">0</div><div class="stat-label">กำลังติดตาม</div></div>
        <div class="stat"><div class="stat-num">0</div><div class="stat-label">ผู้ติดตาม</div></div>
        <div class="stat"><div class="stat-num">0</div><div class="stat-label">ถูกใจ</div></div>
      </div>
      <div class="grid">
        <div class="grid-item">+</div>
      </div>
    </div>
  </div>

  <!-- ===== เมนูล่าง — ตรงตามรูปเป๊ะ! ===== -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-text">หน้าหลัก</span>
    </div>
    <div class="nav-item" data-page="shop">
      <span class="nav-icon">🛍️</span>
      <span class="nav-text">ร้านค้า</span>
    </div>
    <div class="nav-middle" id="addBtn">
      <div class="plus-btn">+</div>
    </div>
    <div class="nav-item" data-page="inbox">
      <span class="nav-icon">📥</span>
      <span class="nav-text">กล่องข้อความ</span>
    </div>
    <div class="nav-item" data-page="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-text">ฉัน</span>
    </div>
  </nav>
</div>

<script>
function goPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`pg-${name}`).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.page === name);
  });
}

function addPost() {
  alert('✅ เพิ่มวิดีโอใหม่!');
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nav-item[data-page]').forEach(n => {
    n.addEventListener('click', () => goPage(n.dataset.page));
  });
  document.getElementById('addBtn').addEventListener('click', addPost);
});
</script>

</body>
</html>
