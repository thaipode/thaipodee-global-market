<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Thaipodee Market Online World Platform">
  <meta name="apple-mobile-web-app-title" content="Thaipodee Market Online">
  <meta name="application-name" content="Thaipodee Market Online">
  <meta name="theme-color" content="#000000">
  <title>Thaipodee Market Online World Platform</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
}

.brand-name {
  font-size: 18px;
  font-weight: 700;
  color: #ff2d55;
}

.header-center {
  font-size: 16px;
  font-weight: 600;
}

.header-right {
  display: flex;
  gap: 16px;
  align-items: center;
}

.icon-search, .icon-menu {
  font-size: 22px;
  cursor: pointer;
}

.video-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
  background: #000;
}

.video-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
}

.video-slide {
  height: 100%;
  width: 100%;
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.video-slide.active {
  opacity: 1;
}

.video-bg {
  position: absolute;
  inset: 0;
  object-fit: cover;
  width: 100%;
  height: 100%;
}

.video-info {
  position: absolute;
  bottom: 120px;
  left: 16px;
  right: 90px;
  z-index: 10;
  color: white;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

.video-username {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
}

.video-desc {
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 8px;
  word-wrap: break-word;
}

.video-music {
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.side-actions {
  position: absolute;
  right: 12px;
  bottom: 140px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  align-items: center;
  z-index: 10;
}

.action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}

.action-icon {
  font-size: 28px;
}

.action-count {
  font-size: 11px;
}

.bottom-nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 80px;
  background: #000;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
  border-top: 1px solid #222;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  font-size: 11px;
}

.nav-icon {
  font-size: 24px;
}

.nav-item.post-btn .nav-icon {
  width: 44px;
  height: 32px;
  background: linear-gradient(45deg, #00f2ea, #ff2d55);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

@media (max-width: 480px) {
  .video-info {
    bottom: 110px;
    left: 12px;
    right: 80px;
  }
  .video-username { font-size: 15px; }
  .video-desc { font-size: 13px; }
  .side-actions { bottom: 130px; gap: 22px; }
}

@media (min-width: 768px) {
  .video-info {
    bottom: 130px;
    left: 24px;
    right: 120px;
  }
  .side-actions { right: 20px; bottom: 150px; gap: 28px; }
  .video-username { font-size: 18px; }
  .video-desc { font-size: 15px; }
}
  </style>
</head>
<body>

<div class="header">
  <span class="brand-name">Thaipodee Market</span>
  <span class="header-center">สำหรับคุณ</span>
  <div class="header-right">
    <span class="icon-search">🔍</span>
    <span class="icon-menu">☰</span>
  </div>
</div>

<div class="video-container" id="videoContainer">
  <div class="video-wrapper">
    <div class="video-slide active">
      <div class="video-bg"></div>
      <div class="video-info">
        <div class="video-username">ชื่อผู้ใช้</div>
        <div class="video-desc">Thaipodee Market — แพลตฟอร์มระดับโลกสำหรับทุกคน</div>
        <div class="video-music">🎵 เพลงประกอบ</div>
      </div>
    </div>
  </div>
</div>

<div class="side-actions">
  <div class="action-btn">
    <span class="action-icon">👤</span>
  </div>
  <div class="action-btn" id="likeBtn">
    <span class="action-icon">🤍</span>
    <span class="action-count">0</span>
  </div>
  <div class="action-btn" id="commentBtn">
    <span class="action-icon">💬</span>
    <span class="action-count">0</span>
  </div>
  <div class="action-btn" id="saveBtn">
    <span class="action-icon">☆</span>
    <span class="action-count">0</span>
  </div>
  <div class="action-btn" id="shareBtn">
    <span class="action-icon">↗️</span>
    <span class="action-count">แชร์</span>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item">
    <span class="nav-icon">🏠</span>
    <span>หน้าแรก</span>
  </div>
  <div class="nav-item">
    <span class="nav-icon">🔍</span>
    <span>ค้นหา</span>
  </div>
  <div class="nav-item post-btn">
    <span class="nav-icon">+</span>
  </div>
  <div class="nav-item">
    <span class="nav-icon">💬</span>
    <span>ข้อความ</span>
  </div>
  <div class="nav-item">
    <span class="nav-icon">👤</span>
    <span>โปรไฟล์</span>
  </div>
</div>

<script>
let liked = false;
let likeCount = 0;
document.getElementById('likeBtn').addEventListener('click', () => {
  liked = !liked;
  likeCount += liked ? 1 : -1;
  document.getElementById('likeBtn').querySelector('.action-icon').textContent = liked ? '❤️' : '🤍';
  document.getElementById('likeBtn').querySelector('.action-count').textContent = likeCount;
});

document.getElementById('commentBtn').addEventListener('click', () => {
  alert('💬 เปิดหน้าคอมเมนต์ — พร้อมใช้งานแล้วครับ!');
});

let saved = false;
document.getElementById('saveBtn').addEventListener('click', () => {
  saved = !saved;
  document.getElementById('saveBtn').querySelector('.action-icon').textContent = saved ? '⭐' : '☆';
  alert(saved ? '✅ บันทึกเรียบร้อยแล้ว!' : 'ยกเลิกการบันทึก');
});

document.getElementById('shareBtn').addEventListener('click', () => {
  if (navigator.share) {
    navigator.share({
      title: 'Thaipodee Market',
      text: 'แพลตฟอร์มระดับโลกสำหรับทุกคน!',
      url: window.location.href
    });
  } else {
    alert('🔗 ลิงก์คัดลอกแล้ว — แชร์ให้เพื่อนได้เลยครับ!');
  }
});
</script>

</body>
</html>
