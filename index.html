   ✅ ไอคอนขวา 6 อัน ตรงลำดับเป๊ะ:

      2. ❤️ 0 → กดไลก์ เปลี่ยนสี+นับ
      3. 💬 0 → คอมเมนต์

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ThaiPodee v1017</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }

/* ===== พื้นที่วิดีโอ ===== */
.video-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 65px;
  background: #000; display: flex; align-items: center; justify-content: center;
}

/* ===== ไอคอนด้านขวา — ตรงรูปเป๊ะ ===== */
.right-bar {
  position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 26px; align-items: center;
}
.action-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; border: none; background: transparent; color: #fff;
}
.action-icon { font-size: 26px; line-height: 1; }
.action-count { font-size: 11px; color: #fff; }

/* ===== รูปโปรไฟล์ + ปุ่มแดง ===== */
.avatar-box { position: relative; width: 44px; height: 44px; }
.avatar-img {
  width: 44px; height: 44px; border-radius: 50%; background: #333;
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  border: 2px solid #fff;
}
.red-plus {
  position: absolute; bottom: -3px; right: -3px;
  width: 18px; height: 18px; border-radius: 50%; background: #ff2442;
  color: #fff; font-size: 13px; font-weight: bold; display: flex;
  align-items: center; justify-content: center; border: 2px solid #000;
}

/* ===== แถบล่างเมนู — ตรงรูป ===== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
  background: #000; display: flex; justify-content: space-around; align-items: center;
  padding: 0 8px; border-top: 1px solid #222;
}
.nav-link {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: #fff; text-decoration: none; border: none; background: transparent;
  cursor: pointer;
}
.nav-icon { font-size: 22px; }
.nav-text { font-size: 10px; color: #aaa; }
.nav-link.active .nav-text { color: #fff; }
.plus-btn {
  width: 44px; height: 32px; background: #ff2442; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  font-weight: bold; color: #fff;
}
</style>
</head>
<body>

<!-- ===== พื้นที่วิดีโอ ===== -->
<div class="video-screen" id="videoArea">
  <!-- วิดีโอแสดงที่นี่ -->
</div>

<!-- ===== ไอคอนด้านขวา 6 อัน ตรงรูปเป๊ะ ===== -->
<div class="right-bar">
  <!-- 1. รูปโปรไฟล์ + ปุ่มแดง -->
  <button class="action-btn" id="avatarBtn">
    <div class="avatar-box">
      <div class="avatar-img">👤</div>
      <div class="red-plus">+</div>
    </div>
  </button>

  <!-- 2. หัวใจ -->
  <button class="action-btn" id="likeBtn">
    <span class="action-icon" id="likeIcon">❤️</span>
    <span class="action-count" id="likeNum">0</span>
  </button>

  <!-- 3. คอมเมนต์ -->
  <button class="action-btn" id="commentBtn">
    <span class="action-icon">💬</span>
    <span class="action-count" id="commentNum">0</span>
  </button>

  <!-- 4. บันทึก -->
  <button class="action-btn" id="saveBtn">
    <span class="action-icon">🔖</span>
    <span class="action-count" id="saveNum">0</span>
  </button>

  <!-- 5. แชร์ -->
  <button class="action-btn" id="shareBtn">
    <span class="action-icon">↗️</span>
    <span class="action-count" id="shareNum">0</span>
  </button>

  <!-- 6. เพลง -->
  <button class="action-btn" id="musicBtn">
    <span class="action-icon">🎵</span>
  </button>
</div>

<!-- ===== แถบล่าง 5 ปุ่ม ตรงรูป ===== -->
<nav class="bottom-nav">
  <button class="nav-link active" id="navHome">
    <span class="nav-icon">🏠</span>
    <span class="nav-text">หน้าหลัก</span>
  </button>
  <button class="nav-link" id="navShop">
    <span class="nav-icon">🛍️</span>
    <span class="nav-text">ร้านค้า</span>
  </button>
  <button class="nav-link" id="navAdd">
    <span class="plus-btn">+</span>
  </button>
  <button class="nav-link" id="navMsg">
    <span class="nav-icon">💬</span>
    <span class="nav-text">ข้อความ</span>
  </button>
  <button class="nav-link" id="navProfile">
    <span class="nav-icon">👤</span>
    <span class="nav-text">โปรไฟล์</span>
  </button>
</nav>

<script>
// ===== สถานะ =====
let isOwner = true; // เปลี่ยนเป็น false เมื่อดูของคนอื่น
let liked = false;
let likeCount = 0, commentCount = 0, saveCount = 0, shareCount = 0;

// ===== 1. เปลี่ยนรูปโปรไฟล์ =====
document.getElementById('avatarBtn').onclick = function() {
  alert('✅ เปลี่ยนรูปโปรไฟล์ — เลือกรูปจากเครื่อง');
};

// ===== 2. กดไลก์ =====
document.getElementById('likeBtn').onclick = function() {
  liked = !liked;
  likeCount += liked ? 1 : -1;
  document.getElementById('likeNum').textContent = likeCount;
  document.getElementById('likeIcon').style.color = liked ? '#ff2442' : '#fff';
};

// ===== 3. กดคอมเมนต์ =====
document.getElementById('commentBtn').onclick = function() {
  commentCount++;
  document.getElementById('commentNum').textContent = commentCount;
  alert('✅ เปิดกล่องคอมเมนต์ — แสดงรายการสนทนา');
};

// ===== 4. กดบันทึก =====
document.getElementById('saveBtn').onclick = function() {
  saveCount++;
  document.getElementById('saveNum').textContent = saveCount;
  alert('✅ บันทึกวิดีโอนี้เรียบร้อย');
};

// ===== 5. กดแชร์ =====
document.getElementById('shareBtn').onclick = function() {
  shareCount++;
  document.getElementById('shareNum').textContent = shareCount;
  alert('✅ แชร์ไปยังเครื่องอื่น — เครื่องที่ 2, 3, 4...');
};

// ===== 6. กดเพลง =====
document.getElementById('musicBtn').onclick = function() {
  if (isOwner) {
    alert('✅ เป็นวิดีโอของคุณ — เลือก/เปลี่ยนเพลงประกอบได้');
  } else {
    alert('ℹ️ เป็นวิดีโอของคนอื่น — ดูได้แต่ไม่สามารถเปลี่ยนเพลงได้');
  }
};

// ===== แถบล่าง — สลับหน้า =====
function setActiveNav(id) {
  document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.getElementById('navHome').onclick = () => setActiveNav('navHome');
document.getElementById('navShop').onclick = () => { setActiveNav('navShop'); alert('🛒 ร้านค้า'); };
document.getElementById('navAdd').onclick = () => { setActiveNav('navAdd'); alert('➕ เพิ่มโพสต์วิดีโอใหม่'); };
document.getElementById('navMsg').onclick = () => { setActiveNav('navMsg'); alert('💬 ข้อความ/คอมเมนต์'); };
document.getElementById('navProfile').onclick = () => { setActiveNav('navProfile'); alert('👤 โปรไฟล์ของคุณ'); };

console.log('✅ ThaiPodee v1017 — ตรงรูปเป๊ะ ทุกปุ่มทำงาน');
</script>

</body>
</html>
