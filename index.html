<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<meta name="description" content="ThaiPodee Market — แอปแชร์วิดีโอและสินค้า">
<title>ThaiPodee Market v86</title>
<link rel="icon" type="image/png" sizes="192x192" href="https://picsum.photos/id/1012/192/192">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
html, body { height: 100%; background: #000; color: #fff; overflow: hidden; }

/* ===== แถบบน ===== */
.top-bar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; align-items: center; padding: 12px 16px; z-index: 200; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); }
.top-tabs { display: flex; gap: 24px; }
.tab { font-size: 15px; color: #aaa; cursor: pointer; }
.tab.active { color: #fff; font-weight: 600; border-bottom: 2px solid #fff; padding-bottom: 2px; }
.top-search { position: absolute; right: 16px; font-size: 20px; cursor: pointer; }

/* ===== หน้า ===== */
.page { position: absolute; top: 50px; bottom: 65px; left: 0; right: 0; display: none; overflow-y: auto; }
.page.active { display: block; }

/* ===== ฟีดวิดีโอ ===== */
.video-swiper { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
.video-swiper::-webkit-scrollbar { display: none; }
.video-slide { height: 100%; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #000; padding: 10px; }
.media-container { width: 100%; max-width: 430px; aspect-ratio: 9/16; background: #111; border-radius: 4px; overflow: hidden; }
.media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; display: block; }
.placeholder { text-align: center; color: #666; padding: 60px 20px; }

/* ===== ข้อมูลซ้ายล่าง ===== */
.info-left { position: fixed; bottom: 100px; left: 12px; right: 90px; z-index: 150; display: block; }
.username { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.desc { font-size: 12px; color: #aaa; }

/* ===== ไอคอนด้านขวา 6 ตัว ตรงภาพ ===== */
.side-icons { position: fixed; right: 12px; bottom: 100px; z-index: 150; display: flex; flex-direction: column; align-items: center; gap: 24px; }
.icon-block { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.icon-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; }
.icon-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.icon { font-size: 24px; }
.icon-count { font-size: 11px; color: #aaa; }

/* ===== โปรไฟล์ ===== */
.profile-top { text-align: center; padding: 20px; }
.profile-avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 10px; overflow: hidden; border: 2px solid #fff; cursor: pointer; }
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.profile-stats { display: flex; justify-content: center; gap: 40px; margin: 15px 0; }
.stat-num { font-size: 20px; font-weight: bold; }
.stat-label { font-size: 11px; color: #777; margin-top: 2px; }
.post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; }
.post-thumb { aspect-ratio: 9/16; background: #1a1a1a; border-radius: 3px; overflow: hidden; }
.post-thumb img, .post-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ===== แถบล่าง ===== */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; display: flex; justify-content: space-around; align-items: center; background: #000; border-top: 1px solid #222; z-index: 200; }
.nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #777; gap: 2px; cursor: pointer; position: relative; }
.nav-item.active { color: #fff; }
.nav-icon { font-size: 22px; }
.nav-add { width: 48px; height: 36px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 24px; font-weight: bold; cursor: pointer; }
.nav-badge { position: absolute; top: -4px; right: -8px; background: #e53935; color: #fff; font-size: 9px; padding: 1px 5px; border-radius: 10px; line-height: 1; }

.hidden-input { display: none; }
</style>
</head>
<body>

<!-- แถบบน -->
<div class="top-bar">
  <div class="top-tabs">
    <div class="tab" data-page="feed">กำลังติดตาม</div>
    <div class="tab active" data-page="feed">สำหรับคุณ</div>
  </div>
  <div class="top-search">🔍</div>
</div>

<!-- ===== หน้าหลัก ===== -->
<div id="feedPage" class="page active">
  <div class="video-swiper" id="feedContainer"></div>
</div>

<!-- ===== หน้าร้านค้า ===== -->
<div id="shopPage" class="page">
  <div style="padding:15px; text-align:center; color:#666;">ร้านค้า — เร็ว ๆ นี้</div>
</div>

<!-- ===== หน้าข้อความ ===== -->
<div id="msgPage" class="page">
  <div style="padding:15px; text-align:center; color:#666;">กล่องข้อความ — เร็ว ๆ นี้</div>
</div>

<!-- ===== หน้าโปรไฟล์ ===== -->
<div id="profilePage" class="page">
  <div class="profile-top">
    <!-- กดเปลี่ยนรูปได้เลย -->
    <div class="profile-avatar" id="avatarChangeBtn">
      <img id="mainAvatarImg" src="https://picsum.photos/id/1012/100/100" alt="โปรไฟล์">
    </div>
    <h3 id="dispUsername">thaipodee</h3>
    <div class="profile-stats">
      <div><div class="stat-num" id="statPost">0</div><div class="stat-label">โพสต์</div></div>
      <div><div class="stat-num">0</div><div class="stat-label">ผู้ติดตาม</div></div>
      <div><div class="stat-num">0</div><div class="stat-label">กำลังติดตาม</div></div>
    </div>
  </div>
  <!-- ประวัติโพสต์ — ขึ้นทุกอัน ไม่จอดำ -->
  <div class="post-grid" id="postHistoryGrid"></div>
</div>

<!-- ===== ไอคอนด้านขวา 6 ตัว ตรงภาพ ===== -->
<div class="side-icons">
  <div class="icon-block">
    <div class="icon-avatar"><img id="sideAvatarImg" src="https://picsum.photos/id/1012/100/100" alt="ฉัน"></div>
  </div>
  <div class="icon-block" id="likeAction">
    <span class="icon" id="likeHeart">🤍</span>
    <span class="icon-count" id="likeNum">0</span>
  </div>
  <div class="icon-block">
    <span class="icon">💬</span>
    <span class="icon-count">0</span>
  </div>
  <div class="icon-block">
    <span class="icon">⭐</span>
    <span class="icon-count">0</span>
  </div>
  <div class="icon-block" id="shareAction">
    <span class="icon">↗️</span>
    <span class="icon-count">แชร์</span>
  </div>
  <div class="icon-block">
    <span class="icon">🎵</span>
    <span class="icon-count">เสียง</span>
  </div>
</div>

<!-- ข้อมูลซ้ายล่าง -->
<div class="info-left">
  <div class="username">@thaipodee</div>
  <div class="desc">10000053998</div>
</div>

<!-- แถบล่าง ตรงภาพ -->
<div class="bottom-nav">
  <div class="nav-item active" data-page="feed">
    <span class="nav-icon">🏠</span>
    <span>หน้าหลัก</span>
  </div>
  <div class="nav-item" data-page="shop">
    <span class="nav-icon">🎁</span>
    <span>ร้านค้า</span>
  </div>
  <div class="nav-item" id="addPostBtn">
    <span class="nav-add">+</span>
  </div>
  <div class="nav-item" data-page="msg">
    <span class="nav-icon">💬</span>
    <span>กล่องข้อความ</span>
    <span class="nav-badge">99+</span>
  </div>
  <div class="nav-item" data-page="profile">
    <span class="nav-icon">👤</span>
    <span>โปรไฟล์</span>
  </div>
</div>

<!-- ซ่อนไฟล์เลือก -->
<input type="file" id="avatarInput" accept="image/*" class="hidden-input">
<input type="file" id="mediaInput" accept="image/*,video/*" class="hidden-input">

<script>
// ===== ข้อมูลหลัก — บันทึกอัตโนมัติ =====
let profile = JSON.parse(localStorage.getItem('tpProfile') || '{"avatar":"https://picsum.photos/id/1012/100/100","name":"thaipodee"}');
let posts = JSON.parse(localStorage.getItem('tpPosts') || '[]');

function saveAll() {
  localStorage.setItem('tpProfile', JSON.stringify(profile));
  localStorage.setItem('tpPosts', JSON.stringify(posts));
}

// ===== เปลี่ยนรูปโปรไฟล์ — อัปเดตทุกจุดพร้อมกัน =====
document.getElementById('avatarChangeBtn').addEventListener('click', () => {
  document.getElementById('avatarInput').click();
});
document.getElementById('avatarInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    profile.avatar = ev.target.result;
    // อัปเดตทุกจุดที่มีรูปพร้อมกัน
    document.getElementById('mainAvatarImg').src = profile.avatar;
    document.getElementById('sideAvatarImg').src = profile.avatar;
    saveAll();
    alert('✅ เปลี่ยนรูปเรียบร้อย — ทุกจุดอัปเดตแล้ว');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

// ===== สลับหน้า =====
function goPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(name + 'Page').classList.add('active');
  document.querySelectorAll(`[data-page="${name}"]`).forEach(n => n.classList.add('active'));
  
  if (name === 'profile') renderProfilePage();
}
document.querySelectorAll('[data-page]').forEach(n => {
  n.addEventListener('click', () => goPage(n.dataset.page));
});

// ===== เพิ่มโพสต์รูป/วิดีโอ =====
document.getElementById('addPostBtn').addEventListener('click', () => {
  document.getElementById('mediaInput').click();
});
document.getElementById('mediaInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const isVideo = file.type.startsWith('video/');
  const reader = new FileReader();
  reader.onload = ev => {
    posts.unshift({
      dataUrl: ev.target.result,
      type: isVideo ? 'video' : 'image',
      likes: 0,
      liked: false
    });
    saveAll();
    renderFeedPage();
    renderProfilePage();
    alert('✅ โพสต์สำเร็จ — ขึ้นประวัติแล้ว');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

// ===== แสดงฟีด — ไม่จอดำ =====
function renderFeedPage() {
  const container = document.getElementById('feedContainer');
  container.innerHTML = '';
  
  if (posts.length === 0) {
    container.innerHTML = `<div class="placeholder"><p>กด + เพื่อเพิ่มรูปหรือวิดีโอ</p></div>`;
    document.getElementById('likeNum').textContent = '0';
    document.getElementById('likeHeart').textContent = '🤍';
    return;
  }
  
  posts.forEach((post, idx) => {
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    slide.innerHTML = `
      <div class="media-container">
        ${post.type === 'video' 
          ? `<video src="${post.dataUrl}" controls playsinline muted preload="metadata"></video>` 
          : `<img src="${post.dataUrl}" alt="โพสต์" loading="lazy">`
        }
      </div>
    `;
    container.appendChild(slide);
  });
  
  // อัปเดตไลก์จากโพสต์แรก
  updateLikeDisplay(posts[0]);
}

function updateLikeDisplay(post) {
  document.getElementById('likeNum').textContent = post.likes;
  document.getElementById('likeHeart').textContent = post.liked ? '❤️' : '🤍';
}

// ===== กดไลก์ =====
document.getElementById('likeAction').addEventListener('click', () => {
  if (posts.length === 0) return;
  posts[0].liked = !posts[0].liked;
  posts[0].likes += posts[0].liked ? 1 : -1;
  saveAll();
  updateLikeDisplay(posts[0]);
});

// ===== กดแชร์ =====
document.getElementById('shareAction').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(window.location.href);
    alert('✅ คัดลอกลิงก์แล้ว — ส่งให้เพื่อนได้เลย');
  } catch {
    alert('ลิงก์: ' + window.location.href);
  }
});

// ===== แสดงประวัติโพสต์ — ไม่จอดำ =====
function renderProfilePage() {
  // อัปเดตรูป
  document.getElementById('mainAvatarImg').src = profile.avatar;
  document.getElementById('sideAvatarImg').src = profile.avatar;
  // นับจำนวน
  document.getElementById('statPost').textContent = posts.length;
  // แสดงกริด
  const grid = document.getElementById('postHistoryGrid');
  grid.innerHTML = '';
  
  if (posts.length === 0) {
    grid.innerHTML = `<p style="grid-column:1/-1; padding:30px; color:#666; text-align:center;">ยังไม่มีโพสต์</p>`;
    return;
  }
  
  posts.forEach(post => {
    const thumb = document.createElement('div');
    thumb.className = 'post-thumb';
    thumb.innerHTML = post.type === 'video'
      ? `<video src="${post.dataUrl}" muted preload="metadata"></video>`
      : `<img src="${post.dataUrl}" alt="ประวัติ" loading="lazy">`;
    grid.appendChild(thumb);
  });
}

// ===== โหลดทันทีเมื่อเปิด =====
renderFeedPage();
renderProfilePage();
</script>
</body>
</html>
