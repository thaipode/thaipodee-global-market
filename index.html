<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThaiPodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        html, body { height: 100%; overflow: hidden; background: #000; color: #fff; }

        /* ==============================================
           SPLASH SCREEN — แยกออกมาต่างหาก ไม่กระทบเนื้อหา
           ============================================== */
        #splash {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #splash.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-logo {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .splash-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .splash-sub {
            font-size: 14px;
            color: #888;
        }

        /* ==============================================
           ส่วนเนื้อหาหลัก — LOCKED ตำแหน่งทั้งหมด
           ============================================== */
        .main-content {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        /* พื้นหลังวิดีโอ */
        .video-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,.15) 0%, transparent 35%, transparent 65%, rgba(0,0,0,.6) 100%);
            z-index: 2;
        }

        /* ===== กลุ่มชื่อผู้ใช้ & ข้อความ — LOCKED ===== */
        .user-info {
            position: fixed;
            left: 16px;
            right: 100px;
            bottom: 85px;
            z-index: 10;
        }
        .username {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .caption {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 8px;
            color: #f0f0f0;
        }
        .ai-tag {
            display: inline-block;
            background: rgba(255,255,255,.15);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            color: #ddd;
        }

        /* ===== เมนูด้านขวา 6 ตัว — LOCKED ===== */
        .right-menu {
            position: fixed;
            right: 12px;
            bottom: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 10;
        }
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }
        .avatar-wrap {
            position: relative;
            width: 48px;
            height: 48px;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
        }
        .plus-btn {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 20px;
            height: 20px;
            background: #ff2442;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
        .icon { font-size: 28px; }
        .count { font-size: 12px; font-weight: 500; }
        .music-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00c6ff, #ff0080);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 3s linear infinite;
            font-size: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== เมนูด้านล่าง 5 ตัว — LOCKED ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 99;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 25px;
            background: #000;
            border-top: 1px solid #222;
            height: 60px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            position: relative;
        }
        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 11px; color: #888; }
        .nav-badge {
            position: absolute;
            top: -2px;
            right: -8px;
            background: #ff2442;
            color: #fff;
            font-size: 10px;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .nav-add {
            width: 45px;
            height: 32px;
            background: #fff;
            border-radius: 8px;
            position: relative;
        }
        .nav-add::before, .nav-add::after {
            content: '';
            position: absolute;
            background: #000;
        }
        .nav-add::before { width: 18px; height: 2px; top: 15px; left: 13px; }
        .nav-add::after { width: 2px; height: 18px; left: 21px; top: 7px; }
    </style>
</head>
<body>

<!-- ==============================================
     SPLASH SCREEN — ขึ้นก่อน แล้วหายไปเอง
     ============================================== -->
<div id="splash">
    <div class="splash-logo">ท</div>
    <div class="splash-title">ThaiPodee</div>
    <div class="splash-sub">Global Market Online</div>
</div>

<!-- ==============================================
     หน้าหลัก — ทุกตำแหน่ง LOCKED
     ============================================== -->
<div class="main-content">
    <img class="video-bg" src="https://picsum.photos/seed/concert-stage/720/1280" alt="วิดีโอ">
    <div class="overlay"></div>

    <!-- กลุ่มชื่อผู้ใช้ & ข้อความ -->
    <div class="user-info">
        <div class="username">Bob Dominator</div>
        <div class="caption">«Viking Gods» by Bob Dominator is available now on all streaming platforms...</div>
        <div class="ai-tag">ประกอบด้วยสื่อที่สร้างด้วย AI</div>
    </div>

    <!-- เมนูด้านขวา 6 ตัว: โปรไฟล์, ถูกใจ, คอมเมนต์, แชร์, บันทึก, เพลง -->
    <div class="right-menu">
        <div class="menu-item">
            <div class="avatar-wrap">
                <img class="avatar" src="https://picsum.photos/seed/bobdominator/100/100" alt="โปรไฟล์">
                <span class="plus-btn">+</span>
            </div>
        </div>
        <div class="menu-item" onclick="this.style.color=this.style.color==='red'?'':'red'">
            <span class="icon">❤️</span>
            <span class="count">425</span>
        </div>
        <div class="menu-item">
            <span class="icon">💬</span>
            <span class="count">8</span>
        </div>
        <div class="menu-item">
            <span class="icon">↗️</span>
            <span class="count">22</span>
        </div>
        <div class="menu-item">
            <span class="icon">⭐</span>
            <span class="count">บันทึก</span>
        </div>
        <div class="menu-item">
            <div class="music-icon">🎵</div>
            <span class="count" style="font-size:10px; margin-top:2px;">11</span>
        </div>
    </div>

    <!-- เมนูด้านล่าง 5 ตัว: โฮม, ร้านค้า(อันดับ2), ปุ่มกลาง, ข้อความ, โปรไฟล์ -->
    <div class="bottom-nav">
        <div class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">หน้าหลัก</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">🛒</span>
            <span class="nav-label">ร้านค้า</span>
            <span class="nav-badge">99+</span>
        </div>
        <div class="nav-item">
            <div class="nav-add"></div>
        </div>
        <div class="nav-item">
            <span class="nav-icon">💬</span>
            <span class="nav-label">คล้องข้อความ</span>
            <span class="nav-badge">99+</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">👤</span>
            <span class="nav-label">โปรไฟล์</span>
        </div>
    </div>
</div>

<!-- Splash หายไปเอง ไม่กระทบเนื้อหา -->
<script>
    setTimeout(() => {
        document.getElementById('splash').classList.add('fade-out');
    }, 1500);
</script>

</body>
</html>
