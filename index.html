<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thaipodee Market Online V2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* ===== พื้นที่วิดีโอ — เต็มจอ ไม่มีอะไรซ้อนทับ ===== */
    .video-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video, .img-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hint {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #aaa;
      z-index: 5;
      cursor: pointer;
    }
    .hint i { font-size: 48px; margin-bottom: 12px; }

    /* ===== ✅ รูปโปรไฟล์คนกดถูกใจ — มุมซ้ายล่าง เลื่อนขึ้น วนลูป ===== */
    .likers-container {
      position: absolute;
      left: 12px;
      bottom: 100px;
      width: 48px;
      height: 200px;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    }
    .liker-avatar {
      position: absolute;
      left: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #333;
      background-size: cover;
      background-position: center;
      opacity: 0;
      animation: likerRise 12s ease-in-out infinite;
    }
    .liker-avatar:nth-child(1) { animation-delay: 0s; }
    .liker-avatar:nth-child(2) { animation-delay: 4s; }
    .liker-avatar:nth-child(3) { animation-delay: 8s; }
    @keyframes likerRise {
      0% { opacity: 0; transform: translateY(60px) scale(0.8); }
      15% { opacity: 1; transform: translateY(40px) scale(1); }
      85% { opacity: 1; transform: translateY(-100px) scale(1); }
      100% { opacity: 0; transform: translateY(-120px) scale(0.8); }
    }

    /* ===== ปุ่มด้านขวา — ตำแหน่งตรงกับ TikTok ===== */
    .side-actions {
      position: absolute;
      right: 12px;
      top: 35%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      z-index: 10;
    }
    .side-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    .side-btn i { font-size: 28px; }
    .side-btn span { font-size: 11px; }

    /* ===== จานเพลงหมุน ===== */
    .music-disc {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #333, #111);
      border: 3px solid #555;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 3s linear infinite;
      animation-play-state: paused;
    }
    .music-disc.playing { animation-play-state: running; }
    .music-disc img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ===== ปุ่มเต็มจอ ===== */
    .fullscreen-btn {
      position: absolute;
      right: 16px;
      bottom: 90px;
      font-size: 22px;
      color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.4);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 11;
    }

    /* ===== ข้อความล่างซ้าย — ชื่อ + เวลา + คำอธิบาย + ผู้ชม ===== */
    .caption {
      position: absolute;
      left: 76px;
      right: 80px;
      bottom: 90px;
      z-index: 10;
      pointer-events: none;
    }
    .caption .username { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .caption .time-ago { font-size: 13px; color: #aaa; margin-left: 8px; font-weight: 400; }
    .caption .desc { font-size: 14px; line-height: 1.4; margin-bottom: 4px; }
    .caption .meta { font-size: 12px; color: #aaa; margin-bottom: 4px; }
    .caption .views { font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 4px; }
    .caption .views i { font-size: 10px; }

    /* ===== แถบล่าง — ตรงกับ TikTok ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #222;
      z-index: 20;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: #999;
      font-size: 11px;
      cursor: pointer;
    }
    .nav-item i { font-size: 22px; }
    .nav-item.active { color: #fff; }
    .upload-btn {
      width: 44px;
      height: 32px;
      background: linear-gradient(180deg, #fff, #ddd);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 24px;
      font-weight: 600;
      position: relative;
    }
    .upload-btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(90deg, #25f4ee, #fe28ea);
      border-radius: 6px;
      z-index: -1;
    }

    /* ===== หน้าโปรไฟล์ ===== */
    .profile-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      overflow-y: auto;
      display: none;
    }
    .profile-header {
      padding: 20px 16px;
      text-align: center;
    }
    .profile-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #333;
      margin: 0 auto 12px;
      border: 2px solid #555;
      background-size: cover;
      background-position: center;
    }
    .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .profile-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin: 16px 0;
    }
    .stat-item { text-align: center; }
    .stat-num { font-size: 18px; font-weight: 700; }
    .stat-label { font-size: 12px; color: #999; }
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 0 3px 60px;
    }
    .video-cell {
      aspect-ratio: 9/16;
      background: #1a1a1a;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .video-cell video, .video-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cell-views {
      position: absolute;
      bottom: 4px;
      left: 4px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 3px;
      text-shadow: 0 0 3px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- ===== พื้นที่วิดีโอ — ไม่มีโลโก้ซ้อนทับ ===== -->
    <div class="video-container" id="videoContainer">
      <div class="hint" id="hint">
        <i class="fas fa-plus-circle"></i>
        <p>แตะเพื่ออัปโหลดวิดีโอ</p>
      </div>
      <video id="vid" loop playsinline style="display:none;"></video>
      <img class="img-content" id="pic" style="display:none;" alt="">

      <!-- ✅ รูปโปรไฟล์คนกดถูกใจ — มุมซ้ายล่าง วนลูป 3 อัน -->
      <div class="likers-container" id="likersContainer">
        <!-- จะเพิ่มรูปแบบไดนามิกผ่าน JS -->
      </div>

      <!-- ข้อความล่างซ้าย -->
      <div class="caption" id="caption" style="display:none;">
        <div class="username">Thaipodee_market <span class="time-ago" id="timeAgo">2 วันที่แล้ว</span></div>
        <div class="desc">วิดีโอแรกของเรา — Thaipodee Market Online</div>
        <div class="meta">เสียงต้นฉบับ · สร้างด้วย AI · ประกอบด้วยเสียง</div>
        <div class="views"><i class="fas fa-play"></i> ผู้ชม <span id="viewCount">0</span> ครั้ง</div>
      </div>

      <!-- ปุ่มด้านขวา -->
      <div class="side-actions">
        <div class="side-btn" id="avatarBtn">
          <div style="width:40px;height:40px;border-radius:50%;background:#333;border:2px solid #fff;overflow:hidden;">
            <img id="mainAvatarImg" style="width:100%;height:100%;object-fit:cover;display:none;">
            <i class="fas fa-user" style="line-height:36px;text-align:center;width:100%;" id="avatarPlaceholder"></i>
          </div>
        </div>
        <div class="side-btn" id="likeBtn">
          <i class="far fa-heart"></i>
          <span id="likeCount">0</span>
        </div>
        <div class="side-btn">
          <i class="far fa-comment"></i>
          <span id="commentCount">0</span>
        </div>
        <div class="side-btn">
          <i class="far fa-bookmark"></i>
          <span id="bookmarkCount">0</span>
        </div>
        <div class="side-btn">
          <i class="fas fa-share"></i>
          <span>17</span>
        </div>
        <div class="side-btn music-disc" id="musicDisc">
          <img src="https://picsum.photos/50/50" alt="">
        </div>
      </div>

      <!-- ปุ่มเต็มจอ -->
      <div class="fullscreen-btn" id="fullscreenBtn">
        <i class="fas fa-expand"></i>
      </div>
    </div>

    <!-- แถบล่าง -->
    <div class="bottom-nav">
      <div class="nav-item active" id="navHome"><i class="fas fa-home"></i><span>หน้าหลัก</span></div>
      <div class="nav-item" id="navShop"><i class="fas fa-shopping-bag"></i><span>ร้านค้า</span></div>
      <div class="nav-item upload-btn" id="uploadBtn">+</div>
      <div class="nav-item" id="navInbox"><i class="fas fa-inbox"></i><span>กล่องขาเข้า</span></div>
      <div class="nav-item" id="navProfile"><i class="fas fa-user"></i><span>โปรไฟล์</span></div>
    </div>

    <!-- ===== หน้าโปรไฟล์ ===== -->
    <div class="profile-screen" id="profileScreen">
      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar"></div>
        <div class="profile-name" id="profileName">Thaipodee Market</div>
        <div class="profile-stats">
          <div class="stat-item"><div class="stat-num" id="postCount">0</div><div class="stat-label">โพสต์</div></div>
          <div class="stat-item"><div class="stat-num">128</div><div class="stat-label">ผู้ติดตาม</div></div>
          <div class="stat-item"><div class="stat-num">342</div><div class="stat-label">กำลังติดตาม</div></div>
        </div>
      </div>
      <div class="videos-grid" id="videosGrid"></div>
    </div>

    <!-- ซ่อน input file -->
    <input type="file" id="fileInput" accept="video/*,image/*" style="display:none;">
    <input type="file" id="avatarInput" accept="image/*" style="display:none;">
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const vid = $('vid'), pic = $('pic'), hint = $('hint'), fileInput = $('fileInput');
    const caption = $('caption'), likeBtn = $('likeBtn'), likeCount = $('likeCount');
    const musicDisc = $('musicDisc'), viewCount = $('viewCount');
    const profileScreen = $('profileScreen'), videosGrid = $('videosGrid');
    const navProfile = $('navProfile'), navHome = $('navHome');
    const uploadBtn = $('uploadBtn'), fullscreenBtn = $('fullscreenBtn');
    const likersContainer = $('likersContainer');
    const timeAgo = $('timeAgo');

    let posts = [], isVideo = false, totalViews = 0, totalLikes = 0, isLiked = false;
    let postDate = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000); // เริ่มที่ 2 วันที่แล้ว
    let likers = [];
    let isFullscreen = false;

    // ===== ตัวอย่างรูปโปรไฟล์คนกดถูกใจ =====
    const sampleAvatars = [
      'https://i.pravatar.cc/100?img=1',
      'https://i.pravatar.cc/100?img=2',
      'https://i.pravatar.cc/100?img=3',
      'https://i.pravatar.cc/100?img=4',
      'https://i.pravatar.cc/100?img=5',
      'https://i.pravatar.cc/100?img=6',
    ];

    // ===== สร้างรูปโปรไฟล์คนกดถูกใจ วนลูป 3 อัน =====
    function renderLikers() {
      likersContainer.innerHTML = '';
      const displayLikers = likers.slice(0, 3);
      displayLikers.forEach((src, idx) => {
        const el = document.createElement('div');
        el.className = 'liker-avatar';
        el.style.backgroundImage = `url(${src})`;
        el.style.animationDelay = `${idx * 4}s`;
        likersContainer.appendChild(el);
      });
    }

    // ===== คำนวณเวลาที่โพสต์ =====
    function updateTimeAgo() {
      const now = new Date();
      const diffMs = now - postDate;
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      if (diffDays > 0) {
        timeAgo.textContent = `${diffDays} วันที่แล้ว`;
      } else if (diffHours > 0) {
        timeAgo.textContent = `${diffHours} ชม. ที่แล้ว`;
      } else {
        timeAgo.textContent = 'เมื่อสักครู่';
      }
    }
    setInterval(updateTimeAgo, 60000); // อัปเดตทุกนาที

    // ===== อัปโหลดวิดีโอ =====
    hint.addEventListener('click', () => fileInput.click());
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const url = URL.createObjectURL(f);
      hint.style.display = 'none';
      caption.style.display = 'block';
      totalViews = Math.floor(Math.random() * 50) + 10;
      viewCount.textContent = totalViews;
      postDate = new Date();
      updateTimeAgo();
      if (f.type.startsWith('video/')) {
        isVideo = true;
        vid.src = url;
        vid.style.display = 'block';
        pic.style.display = 'none';
        vid.play().catch(() => {});
        musicDisc.classList.add('playing');
      } else {
        isVideo = false;
        pic.src = url;
        pic.style.display = 'block';
        vid.style.display = 'none';
        musicDisc.classList.remove('playing');
      }
      posts.unshift({ type: isVideo ? 'video' : 'image', url, views: totalViews, date: new Date() });
      renderProfileGrid();
    });

    // ===== กดหัวใจ =====
    likeBtn.addEventListener('click', () => {
      if (!isLiked) {
        totalLikes++;
        isLiked = true;
        likeBtn.querySelector('i').className = 'fas fa-heart';
        likeBtn.querySelector('i').style.color = '#fe2c55';
        // เพิ่มคนกดถูกใจ
        const newAvatar = sampleAvatars[likers.length % sampleAvatars.length];
        likers.unshift(newAvatar);
        renderLikers();
      } else {
        totalLikes--;
        isLiked = false;
        likeBtn.querySelector('i').className = 'far fa-heart';
        likeBtn.querySelector('i').style.color = '#fff';
        likers.shift();
        renderLikers();
      }
      likeCount.textContent = totalLikes;
    });

    // ===== กดวิดีโอเพิ่มยอดดู =====
    $('videoContainer').addEventListener('click', e => {
      if ([hint, uploadBtn, fullscreenBtn].includes(e.target)) return;
      if (isVideo && vid.src) {
        if (vid.paused) {
          vid.play();
          musicDisc.classList.add('playing');
          totalViews++;
          viewCount.textContent = totalViews;
          if (posts[0]) posts[0].views = totalViews;
        } else {
          vid.pause();
          musicDisc.classList.remove('playing');
        }
      }
    });

    // ===== เต็มจอ =====
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        fullscreenBtn.querySelector('i').className = 'fas fa-compress';
      } else {
        document.exitFullscreen();
        fullscreenBtn.querySelector('i').className = 'fas fa-expand';
      }
    });

    // ===== สลับหน้าโปรไฟล์ =====
    navProfile.addEventListener('click', () => {
      profileScreen.style.display = 'block';
    });
    navHome.addEventListener('click', () => {
      profileScreen.style.display = 'none';
    });
    function renderProfileGrid() {
      $('postCount').textContent = posts.length;
      videosGrid.innerHTML = '';
      posts.forEach(p => {
        const cell = document.createElement('div');
        cell.className = 'video-cell';
        cell.innerHTML = `
          ${p.type === 'video'
            ? `<video src="${p.url}" muted loop playsinline></video>`
            : `<img src="${p.url}" alt="">`
          }
          <div class="cell-views"><i class="fas fa-play"></i>${p.views}</div>
        `;
        videosGrid.appendChild(cell);
      });
    }

    // ===== อัปเดตเวลาตอนโหลด =====
    updateTimeAgo();
  </script>
</body>
</html>
