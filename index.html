<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;

  .top-bar {

  .feed-container {

  .publish-btn:disabled { background: #666; cursor: not-allowed; }

  .profile-view {
    position: absolute; top: 44px; left: 0; right: 0; bottom: 60px;

  .profile-view.show { display: block; }
  .p-header { text-align: center; margin-bottom: 20px; }
  .p-avatar {

  .p-stats { display: flex; justify-content: center; gap: 35px; margin: 15px 0; }

  .p-count { text-align: center; color: #999; font-size: 13px; margin: 10px 0 15px; }

  .p-grid { display: flex; flex-direction: column; gap: 12px; }
  .p-item {
    width: 100%; background: #1a1a1a; border-radius: 8px; padding: 10px;

  .p-item-thumb {

  .p-item-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .p-item-filename {
    font-size: 14px; font-weight: 500; color: #fff;

  }
  .p-item-meta { font-size: 12px; color: #999; line-height: 1.6; }
  .p-item-del-btn {
    background: #ff3b30; color: #fff; border: none; border-radius: 4px;
    padding: 6px 16px; font-size: 14px; cursor: pointer; align-self: flex-start;
    margin-top: 4px;
  }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
    background: #000; display: grid; grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid #222; z-index: 99999;
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #999; cursor: pointer;
  }
  .nav-btn.active { color: #fff; }
  .nav-icon { font-size: 22px; line-height: 1; }
  .nav-label { font-size: 10px; margin-top: 2px; }

  .center-col { display: flex; align-items: center; justify-content: center; }
  .plus-btn {
    width: 48px; height: 34px; background: #fff; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: bold; color: #000;
    position: relative; cursor: pointer; border: none;
  }
  .plus-btn::before {
    content: ''; position: absolute; width: 42px; height: 42px;
    background: #fff; border-radius: 50%; top: -4px; z-index: -1;
  }
</style>

<script>
// ==============================================================
// ⚙️ ตั้งค่าคลาวด์ — เปลี่ยนเป็นของคุณเองเมื่อพร้อม
// ==============================================================
const CLOUD_NAME = 'djxqz8qzo';
const UPLOAD_PRESET = 'thaipodee_upload';
const BIN_URL = 'https://api.jsonbin.io/v3/b/66ed1340e41b4d34b90d4e76';
const BIN_KEY = '$2a$10$KxqU6/7bRYJHf0qVhWqT/.t5uKv5jZgU9LbD9aQoXaKzYqzH7q2m';

let postList = [];
let selectedFile = null;
let selectedPreviewUrl = null;

const feedContainer = document.getElementById('feedContainer');
const emptyText = document.getElementById('emptyText');
const fileInput = document.getElementById('fileInput');
const addBtn = document.getElementById('addBtn');
const uploadPanel = document.getElementById('uploadPanel');
const closeBtn = document.getElementById('closeBtn');
const previewVideo = document.getElementById('previewVideo');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const userNameInput = document.getElementById('userNameInput');
const captionInput = document.getElementById('captionInput');
const publishBtn = document.getElementById('publishBtn');
const cloudStatus = document.getElementById('cloudStatus');
const profilePage = document.getElementById('profilePage');
const postGrid = document.getElementById('postGrid');
const totalPosts = document.getElementById('totalPosts');
const gridCount = document.getElementById('gridCount');

// ========== โหลดข้อมูล — ไม่แตะของเดิม ==========
window.addEventListener('load', loadFromCloud);

async function loadFromCloud() {
  try {
    cloudStatus.textContent = '☁️ กำลังโหลด...';
    const res = await fetch(BIN_URL, {
      headers: { 'X-Master-Key': BIN_KEY }
    });
    
    if (res.ok) {
      const data = await res.json();
      if (data.record && Array.isArray(data.record.posts)) {
        postList = data.record.posts;
        cloudStatus.textContent = '☁️ ออนไลน์';
      } else {
        postList = [];
        cloudStatus.textContent = '☁️ พร้อม';
      }
    } else {
      postList = [];
      cloudStatus.textContent = '⚠️ ใช้เครื่องก่อน';
    }
  } catch (e) {
    console.log('โหลดคลาวด์ไม่ได้ ใช้ในเครื่องแทน:', e);
    const local = localStorage.getItem('thaipodee_offline');
    postList = local ? JSON.parse(local) : [];
    cloudStatus.textContent = '⚠️ ออฟไลน์';
  }

  renderFeed();
  renderHistory();
}

// ========== บันทึก — สำรองในเครื่องด้วย ไม่ให้หาย ==========
async function saveListToCloud() {
  try {
    cloudStatus.textContent = '☁️ กำลังบันทึก...';
    localStorage.setItem('thaipodee_offline', JSON.stringify(postList));

    const res = await fetch(BIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': BIN_KEY
      },
      body: JSON.stringify({ posts: postList })
    });

    if (res.ok) {
      cloudStatus.textContent = '☁️ บันทึกแล้ว';
      setTimeout(() => { cloudStatus.textContent = '☁️ ออนไลน์'; }, 2000);
    }
  } catch (e) {
    console.log('บันทึกคลาวด์ไม่ได้:', e);
    cloudStatus.textContent = '⚠️ บันทึกในเครื่อง';
  }
}

// ========== แสดงฟีด — เหมือนเดิมเป๊ะ ไม่เปลี่ยน ==========
function renderFeed() {
  feedContainer.innerHTML = '';
  
  if (postList.length === 0) {
    feedContainer.appendChild(emptyText);
    return;
  }

  postList.forEach((post, index) => {
    const slide = document.createElement('div');
    slide.className = 'post-slide';
    slide.dataset.index = index;

    slide.innerHTML = `
      <video 
        class="video-full"
        src="${post.videoUrl}"
        loop
        muted
        playsinline
        webkit-playsinline
        data-index="${index}"
      ></video>
      <div class="play-overlay" data-index="${index}">▶</div>
      
      <div class="post-info">
        <div class="post-username">${post.userName || 'thaipodee'}</div>
        <div class="post-caption">${post.caption}</div>
        <div class="post-meta">${post.localOnly ? '⚠️ ในเครื่อง' : '☁️ ออนไลน์'}</div>
      </div>
      
      <div class="side-actions">
        <div class="action-btn">
          <div class="action-profile">
            <img src="https://i.pravatar.cc/150?img=23" alt="โปรไฟล์">
          </div>
        </div>
        <div class="action-btn like-btn" data-index="${index}">
          <span class="action-icon">❤️</span>
          <span class="action-count">${post.likes || 0}</span>
        </div>
        <div class="action-btn">
          <span class="action-icon">💬</span>
          <span class="action-count">0</span>
        </div>
        <div class="action-btn">
          <span class="action-icon">⭐</span>
          <span class="action-count">0</span>
        </div>
        <div class="action-btn share-btn" data-index="${index}">
          <span class="action-icon">↗️</span>
          <span class="action-count">แชร์</span>
        </div>
        <div class="action-btn">
          <div class="action-music">🎵</div>
        </div>
      </div>
    `;

    feedContainer.appendChild(slide);
  });

  bindFeedEvents();
}

function bindFeedEvents() {
  document.querySelectorAll('.play-overlay').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.dataset.index;
      const video = document.querySelector(`.video-full[data-index="${idx}"]`);
      video.muted = true;
      video.play()
        .then(() => btn.classList.add('hidden'))
        .catch(() => alert('กดอีกครั้งเพื่อเล่น'));
    });
  });

  document.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.index);
      postList[idx].likes = (postList[idx].likes || 0) + 1;
      await saveListToCloud();
      renderFeed();
    });
  });

  document.querySelectorAll('.share-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const shareData = {
        title: 'ThaiPodee Market',
        text: 'มาดูวิดีโอกัน',
        url: window.location.href
      };
      if (navigator.share) {
        try {
          await navigator.share(shareData);
          alert('✅ แชร์แล้ว — เปิดได้เลย ติดตั้งได้เลย');
        } catch (e) {
          navigator.clipboard.writeText(window.location.href)
            .then(() => alert('✅ คัดลอกลิงก์แล้ว — ส่งให้เพื่อนได้เลย'));
        }
      } else {
        navigator.clipboard.writeText(window.location.href)
          .then(() => alert('✅ คัดลอกลิงก์แล้ว — ส่งให้เพื่อนได้เลย'));
      }
    });
  });
}

// ========== เลือกไฟล์ — เหมือนเดิม ==========
addBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  selectedFile = file;
  selectedPreviewUrl = URL.createObjectURL(file);
  
  previewVideo.src = selectedPreviewUrl;
  previewVideo.load();
  uploadPanel.classList.add('show');
});

closeBtn.addEventListener('click', () => {
  uploadPanel.classList.remove('show');
  previewVideo.pause(); previewVideo.src = '';
  userNameInput.value = 'thaipodee';
  captionInput.value = ''; fileInput.value = '';
  progressBar.classList.remove('show');
  progressFill.style.width = '0%';
  if (selectedPreviewUrl) URL.revokeObjectURL(selectedPreviewUrl);
  selectedFile = selectedPreviewUrl = null;
  publishBtn.disabled = false;
  publishBtn.textContent = '☁️ เผยแพร่ไปคลาวด์';
});

// ========== อัปโหลด — เพิ่มส่งขึ้นคลาวด์ ==========
publishBtn.addEventListener('click', async () => {
  if (!selectedFile) {
    alert('⚠️ เลือกวิดีโอก่อน');
    return;
  }

  publishBtn.disabled = true;
  publishBtn.textContent = 'กำลังอัปโหลด...';
  progressBar.classList.add('show');
  progressFill.style.width = '0%';

  const userName = userNameInput.value.trim() || 'thaipodee';
  const caption = captionInput.value.trim() || 'วิดีโอของฉัน';
  const now = new Date();
  const timeStr = now.getDate() + '/' + (now.getMonth()+1) + ' — ' + 
                  now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');

  try {
    const formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('upload_preset', UPLOAD_PRESET);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`);
    
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        progressFill.style.width = Math.round((e.loaded / e.total) * 100) + '%';
      }
    };

    const result = await new Promise((resolve, reject) => {
      xhr.onload = () => xhr.status === 200 ? resolve(JSON.parse(xhr.responseText)) : reject(new Error('อัปไม่สำเร็จ'));
      xhr.onerror = reject;
      xhr.send(formData);
    });

    const newPost = {
      id: Date.now(),
      videoUrl: result.secure_url,
      thumbUrl: result.thumbnail_url || result.secure_url,
      userName: userName,
      caption: caption,
      fileName: selectedFile.name,
      fileSize: (selectedFile.size / 1024 / 1024).toFixed(2) + ' MB',
      time: timeStr,
      likes: 0,
      localOnly: false
    };

    postList.unshift(newPost);
    await saveListToCloud();
    renderFeed();
    renderHistory();
    uploadPanel.classList.remove('show');
    alert('✅ เสร็จ! บนคลาวด์แล้ว — ทุกคนเห็นตรงกัน');

  } catch (err) {
    console.log('อัปคลาวด์ไม่ได้ เก็บในเครื่องแทน:', err);
    const newPost = {
      id: Date.now(),
      videoUrl: selectedPreviewUrl,
      thumbUrl: selectedPreviewUrl,
      userName: userName,
      caption: caption,
      fileName: selectedFile.name,
      fileSize: (selectedFile.size / 1024 / 1024).toFixed(2) + ' MB',
      time: timeStr,
      likes: 0,
      localOnly: true
    };
    postList.unshift(newPost);
    await saveListToCloud();
    renderFeed();
    renderHistory();
    uploadPanel.classList.remove('show');
    alert('⚠️ อัปคลาวด์ไม่ได้ → บันทึกในเครื่องก่อน');
  }
});

// ========== ประวัติ — เหมือนเดิม ==========
function renderHistory() {
  postGrid.innerHTML = '';
  
  postList.forEach((post, index) => {
    const item = document.createElement('div');
    item.className = 'p-item';
    
    item.innerHTML = `
      <div class="p-item-thumb">
        <img src="${post.thumbUrl}" alt="">
      </div>
      <div class="p-item-body">
        <div>
          <div class="p-item-filename">${post.userName || 'thaipodee'}</div>
          <div class="p-item-meta">
            ${post.caption}<br>
            📅 ${post.time} | ${post.localOnly ? '⚠️ ในเครื่อง' : '☁️ ออนไลน์'}
          </div>
        </div>
        <button class="p-item-del-btn" data-index="${index}">ลบ</button>
      </div>
    `;
    
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('p-item-del-btn')) return;
      switchPage('home');
      setTimeout(() => {
        feedContainer.children[index]?.scrollIntoView({ behavior: 'smooth' });
      }, 100);
    });
    
    item.querySelector('.p-item-del-btn').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('ลบโพสต์นี้?')) return;
      postList.splice(index, 1);
      await saveListToCloud();
      renderFeed();
      renderHistory();
    });
    
    postGrid.appendChild(item);
  });
  
  totalPosts.textContent = postList.length;
  gridCount.textContent = postList.length;
}

// ========== เปลี่ยนหน้า — เหมือนเดิม ==========
document.querySelectorAll('.nav-btn, .tab').forEach(btn => {
  btn.addEventListener('click', () => switchPage(btn.dataset.page));
});

function switchPage(page) {
  document.querySelectorAll('.nav-btn, .tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === page);
  });
  
  if (page === 'profile') {
    feedContainer.style.display = 'none';
    profilePage.classList.add('show');
  } else {
    profilePage.classList.remove('show');
    feedContainer.style.display = 'block';
  }
}
</script>
