<!DOCTYPE html>
<html lang="th">
<head>

<link rel="apple-touch-icon" sizes="180x180" href="thaipodee_logo_icon.png">

<title>ThaiPodee</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #000; color: #fff; height: 100vh; overflow: hidden; }

.page { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; }
.page.active { display: flex; }
.main-page { z-index: 1; }
.profile-page { z-index: 2; background: #000; padding: 15px; overflow-y: auto; }

.back-btn {
  background: transparent; color: #fff; border: none; font-size: 16px; padding: 10px 0; cursor: pointer;
  display: flex; align-items: center; gap: 5px; margin-bottom: 10px;
}

.cloud-status {
  font-size: 12px; text-align: center; padding: 6px; margin-bottom: 8px; border-radius: 4px;
}
.cloud-status.online { color: #4ade80; background: rgba(74,222,128,0.1); }
.cloud-status.offline { color: #facc15; background: rgba(250,204,21,0.1); }

.profile-header { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #222; }
.profile-avatar-large {
  width: 90px; height: 90px; border-radius: 50%; border: 3px solid #fff;
  margin: 0 auto 12px; overflow: hidden; cursor: pointer; background: #333;
  display: flex; align-items: center; justify-content: center; font-size: 40px;
}
.profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; display: none; }
.profile-name { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
.edit-name-input {
  background: #222; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 8px;
  font-size: 16px; text-align: center; width: 220px; margin-bottom: 10px; display: none;
}
.save-name-btn, .change-avatar-btn {
  background: #ff2442; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; margin: 4px;
}
.hidden-input { display: none; }

.profile-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
.video-list { display: flex; flex-direction: column; gap: 12px; }
.video-item {
  display: flex; align-items: center; gap: 12px; padding: 12px; background: #1a1a1a; border-radius: 10px;
}
.video-item-thumb {
  width: 80px; height: 45px; background: #333; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px;
  cursor: pointer; flex-shrink: 0;
  background-size: cover; background-position: center;
}
.video-item-info { flex: 1; cursor: pointer; }
.video-item-name { font-size: 14px; margin-bottom: 2px; }
.video-item-date { font-size: 11px; color: #888; }
.video-delete-btn {
  background: #cc0000; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%;
  font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.empty-text { text-align: center; color: #666; padding: 40px 20px; }

.video-area {
  position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; width: 100%;
}
.play-box { text-align: center; width: 100%; padding: 20px; }
.play-icon { font-size: 64px; color: #fff; margin-bottom: 12px; }
.play-text { font-size: 15px; color: #888; margin-bottom: 20px; }
.video-player {
  max-width: 100%; width: 100%; max-height: 65vh; border-radius: 8px; display: none; background: #000;
}
.has-video .play-box { display: none; }
.has-video .video-player { display: block; }
.upload-btn {
  background: #ff2442; color: #fff; border: none; padding: 12px 24px; border-radius: 25px; font-size: 15px; cursor: pointer;
}
.upload-input { display: none; }

.right-bar {
  position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 24px; align-items: center; z-index: 10;
}
.side-btn {
  border: none; background: transparent; color: #fff; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.side-icon { font-size: 28px; line-height: 1; }
.side-num { font-size: 11px; color: #fff; min-height: 14px; }

.avatar-wrap { position: relative; width: 44px; height: 44px; overflow: hidden; border-radius: 50%; border: 2px solid #fff; background: #333; }
.avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: none; }
.avatar-circle {
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 22px;
}
.plus-red {
  position: absolute; bottom: -3px; right: -3px; width: 18px; height: 18px; border-radius: 50%;
  background: #ff2442; color: #fff; font-size: 13px; font-weight: bold;
  display: flex; align-items: center; justify-content: center; border: 2px solid #000; line-height: 1;
}

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
  background: #000; display: flex; justify-content: space-around; align-items: center;
  border-top: 1px solid #222; z-index: 10;
}
.nav-btn {
  border: none; background: transparent; color: #fff; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.nav-icon { font-size: 22px; }
.nav-label { font-size: 10px; color: #aaa; }
.nav-btn.active .nav-label { color: #fff; }
.plus-center {
  width: 46px; height: 34px; background: #ff2442; border-radius: 8px;
  font-size: 24px; font-weight: bold; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>

<div class="page main-page active" id="mainPage">
  <div class="cloud-status offline" id="cloudStatus">กำลังเชื่อมต่อ...</div>
  <div class="video-area" id="videoArea">
    <div class="play-box" id="playBox">
      <div class="play-icon">▶</div>
      <p class="play-text" id="playText">กดปุ่มล่างเพื่อเลือกวิดีโอ</p>
      <button class="upload-btn" id="uploadBtn">📂 เลือกวิดีโอจากเครื่อง</button>
      <input type="file" class="upload-input" id="uploadInput" accept="video/*">
    </div>
    <video class="video-player" id="videoPlayer" controls playsinline preload="metadata"></video>
  </div>

  <div class="right-bar">
    <button class="side-btn" id="btnAvatar">
      <div class="avatar-wrap" id="avatarWrap">
        <div class="avatar-circle" id="avatarCircle">👤</div>
        <img id="avatarImg" alt="avatar">
        <div class="plus-red">+</div>
      </div>
    </button>
    <button class="side-btn" id="btnLike">
      <span class="side-icon" id="likeIcon">🤍</span>
      <span class="side-num" id="likeNum">0</span>
    </button>
    <button class="side-btn" id="btnComment">
      <span class="side-icon">💬</span>
      <span class="side-num" id="commentNum">0</span>
    </button>
    <button class="side-btn" id="btnSave">
      <span class="side-icon">🔖</span>
      <span class="side-num" id="saveNum">0</span>
    </button>
    <button class="side-btn" id="btnShare">
      <span class="side-icon">↗️</span>
      <span class="side-num" id="shareNum">0</span>
    </button>
    <button class="side-btn" id="btnMusic">
      <span class="side-icon">🎵</span>
    </button>
  </div>
</div>

<div class="page profile-page" id="profilePage">
  <button class="back-btn" id="backBtn">◀ กลับ</button>
  
  <div class="profile-header">
    <div class="profile-avatar-large" id="profileAvatarLarge">
      <span id="largeAvatarText">👤</span>
      <img id="largeAvatarImg" alt="รูปโปรไฟล์">
    </div>
    <h2 class="profile-name" id="profileNameDisplay">ผู้ใช้ ThaiPodee</h2>
    <input type="text" class="edit-name-input" id="editNameInput" placeholder="พิมพ์ชื่อของคุณ">
    <div>
      <button class="change-avatar-btn" id="changeAvatarBtn">📷 เปลี่ยนรูป</button>
      <button class="change-avatar-btn" id="editNameBtn" style="background:#222;">✏️ เปลี่ยนชื่อ</button>
      <button class="save-name-btn" id="saveNameBtn" style="display:none;">✅ บันทึกชื่อ</button>
    </div>
    <input type="file" class="hidden-input" id="avatarInput" accept="image/*">
  </div>

  <h3 class="profile-title">วิดีโอทั้งหมด <span id="postCountSpan">(0)</span></h3>
  <div class="video-list" id="videoList">
    <p class="empty-text" id="emptyText">ยังไม่มีวิดีโอ</p>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="navHome">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">หน้าหลัก</span>
  </button>
  <button class="nav-btn" id="navShop">
    <span class="nav-icon">🛍️</span>
    <span class="nav-label">ร้านค้า</span>
  </button>
  <button class="nav-btn" id="navAdd">
    <span class="plus-center">+</span>
  </button>
  <button class="nav-btn" id="navMsg">
    <span class="nav-icon">💬</span>
    <span class="nav-label">ข้อความ</span>
  </button>
  <button class="nav-btn" id="navProfile">
    <span class="nav-icon">👤</span>
    <span class="nav-label">โปรไฟล์</span>
  </button>
</nav>

<script>
// ===== คีย์เก็บข้อมูล — ไม่เปลี่ยนชื่อเดิม =====
const STORAGE_KEY = 'thaipodeeUserData';
const NAME_KEY = 'thaipodeeUserName';
const AVATAR_KEY = 'thaipodeeUserAvatar';

// ===== คลาวด์กลาง =====
const CLOUD_BIN_ID = '66ed1fadad19ca34f8e7d3a7';
const CLOUD_URL = 'https://api.jsonbin.io/v3/b/' + CLOUD_BIN_ID;
const CLOUD_KEY = '$2a$10$V8qfH0rM3bD8G9eF7hJ6kL5mN4bP3cQ2dR1eS0fT9gU8hI7jK6';

let savedVideos = [];
let lastSyncHash = '';
let isSaving = false;

const cloudStatus = document.getElementById('cloudStatus');
const postCountSpan = document.getElementById('postCountSpan');

// ===== โหลดจากเครื่องก่อน — ของเก่าไม่หาย =====
function loadLocalData() {
  try {
    const local = localStorage.getItem(STORAGE_KEY);
    if (local) savedVideos = JSON.parse(local);
  } catch (e) { savedVideos = []; }
  renderVideoList();
}

function loadProfile() {
  const savedName = localStorage.getItem(NAME_KEY);
  const savedAvatar = localStorage.getItem(AVATAR_KEY);
  
  if (savedName) document.getElementById('profileNameDisplay').textContent = savedName;
  if (savedAvatar) {
    document.getElementById('avatarImg').src = savedAvatar;
    document.getElementById('avatarImg').style.display = 'block';
    document.getElementById('avatarCircle').style.display = 'none';
    document.getElementById('largeAvatarImg').src = savedAvatar;
    document.getElementById('largeAvatarImg').style.display = 'block';
    document.getElementById('largeAvatarText').style.display = 'none';
  }
}

// ===== ซิงค์กับคลาวด์ =====
async function syncFromCloud() {
  try {
    const res = await fetch(CLOUD_URL + '/latest', {
      headers: { 'X-Master-Key': CLOUD_KEY }
    });
    if (!res.ok) throw new Error('ไม่เชื่อมต่อ');
    
    const data = await res.json();
    if (!data.record || !data.record.videos) return;
    
    const cloudVideos = data.record.videos;
    const cloudHash = JSON.stringify(cloudVideos);
    
    if (cloudHash !== lastSyncHash) {
      savedVideos = cloudVideos;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedVideos));
      lastSyncHash = cloudHash;
      renderVideoList();
    }
    
    cloudStatus.textContent = '✓ ออนไลน์ — ซิงค์แล้ว';
    cloudStatus.className = 'cloud-status online';
    
  } catch (e) {
    cloudStatus.textContent = '⚠️ ออฟไลน์ — ทำงานในเครื่อง';
    cloudStatus.className = 'cloud-status offline';
  }
}

async function saveToCloud() {
  if (isSaving) return;
  isSaving = true;
  cloudStatus.textContent = '⟳ กำลังบันทึก...';
  cloudStatus.className = 'cloud-status offline';
  
  try {
    const res = await fetch(CLOUD_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': CLOUD_KEY
      },
      body: JSON.stringify({ videos: savedVideos })
    });
    
    if (res.ok) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedVideos));
      lastSyncHash = JSON.stringify(savedVideos);
      cloudStatus.textContent = '✓ บันทึกแล้ว';
      cloudStatus.className = 'cloud-status online';
    }
  } catch (e) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(savedVideos));
    cloudStatus.textContent = '⚠️ บันทึกในเครื่อง';
    cloudStatus.className = 'cloud-status offline';
  }
  
  isSaving = false;
}

// ===== แสดงรายการ =====
function renderVideoList() {
  const list = document.getElementById('videoList');
  list.innerHTML = '';
  postCountSpan.textContent = `(${savedVideos.length})`;
  
  if (savedVideos.length === 0) {
    list.innerHTML = '<p class="empty-text">ยังไม่มีวิดีโอ — เป็นคนแรกที่โพสต์!</p>';
    return;
  }
  
  savedVideos.slice().reverse().forEach((vid, idx) => {
    const realIdx = savedVideos.length - 1 - idx;
    const item = document.createElement('div');
    item.className = 'video-item';
    item.innerHTML = `
      <div class="video-item-thumb" data-idx="${realIdx}" style="background-image:${vid.thumbnail ? `url(${vid.thumbnail})` : 'none'}">
        ${!vid.thumbnail ? '▶' : ''}
      </div>
      <div class="video-item-info" data-idx="${realIdx}">
        <div class="video-item-name">${vid.name || 'วิดีโอ'}</div>
        <div class="video-item-date">${vid.date} — โดย ${vid.author || 'ไม่ระบุ'}</div>
      </div>
      <button class="video-delete-btn" data-idx="${realIdx}">🗑️</button>
    `;
    list.appendChild(item);
  });
  
  document.querySelectorAll('.video-item-thumb, .video-item-info').forEach(el => {
    el.addEventListener('click', (e) => {
      const idx = parseInt(e.currentTarget.dataset.idx);
      alert(`เปิด: ${savedVideos[idx].name}`);
    });
  });
  
  document.querySelectorAll('.video-delete-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      if (confirm('ลบวิดีโอนี้?')) {
        savedVideos.splice(parseInt(e.target.dataset.idx), 1);
        saveToCloud();
        renderVideoList();
      }
    });
  });
}

// ===== อัปโหลดใหม่ =====
document.getElementById('uploadInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const now = new Date();
  const dateStr = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  const myName = localStorage.getItem(NAME_KEY) || 'ผู้ใช้ไม่ระบุ';
  
  const newVid = {
    name: file.name,
    date: dateStr,
    author: myName,
    thumbnail: null,
    type: file.type
  };
  
  // สร้างรูปหน้าปก
  const tempVid = document.createElement('video');
  tempVid.src = URL.createObjectURL(file);
  tempVid.preload = 'metadata';
  tempVid.onloadeddata = () => { tempVid.currentTime = 1; };
  tempVid.onseeked = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 160; canvas.height = 90;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(tempVid, 0, 0, 160, 90);
    newVid.thumbnail = canvas.toDataURL('image/png');
    
    savedVideos.push(newVid);
    saveToCloud();
    renderVideoList();
  };
  
  e.target.value = '';
});

// ===== เปลี่ยนชื่อ =====
document.getElementById('editNameBtn').addEventListener('click', () => {
  document.getElementById('editNameInput').value = document.getElementById('profileNameDisplay').textContent;
  document.getElementById('editNameInput').style.display = 'block';
  document.getElementById('saveNameBtn').style.display = 'inline-block';
  document.getElementById('editNameBtn').style.display = 'none';
  document.getElementById('profileNameDisplay').style.display = 'none';
  document.getElementById('editNameInput').focus();
});
document.getElementById('saveNameBtn').addEventListener('click', () => {
  const newName = document.getElementById('editNameInput').value.trim() || 'ผู้ใช้ ThaiPodee';
  localStorage.setItem(NAME_KEY, newName);
  document.getElementById('profileNameDisplay').textContent = newName;
  document.getElementById('editNameInput').style.display = 'none';
  document.getElementById('saveNameBtn').style.display = 'none';
  document.getElementById('editNameBtn').style.display = 'inline-block';
  document.getElementById('profileNameDisplay').style.display = 'block';
});

// ===== เปลี่ยนรูป =====
document.getElementById('changeAvatarBtn').addEventListener('click', () => {
  document.getElementById('avatarInput').click();
});
document.getElementById('avatarInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    localStorage.setItem(AVATAR_KEY, dataUrl);
    document.getElementById('avatarImg').src = dataUrl;
    document.getElementById('avatarImg').style.display = 'block';
    document.getElementById('avatarCircle').style.display = 'none';
    document.getElementById('largeAvatarImg').src = dataUrl;
    document.getElementById('largeAvatarImg').style.display = 'block';
    document.getElementById('largeAvatarText').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

// ===== สลับหน้า =====
function showPage(page) {
  document.getElementById('mainPage').classList.toggle('active', page === 'main');
  document.getElementById('profilePage').classList.toggle('active', page === 'profile');
}
function setActiveNav(id) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('navHome').onclick = () => { showPage('main'); setActiveNav('navHome'); };
document.getElementById('navShop').onclick = () => setActiveNav('navShop');
document.getElementById('navAdd').onclick = () => { document.getElementById('uploadInput').click(); };
document.getElementById('navMsg').onclick = () => setActiveNav('navMsg');
document.getElementById('navProfile').onclick = () => { showPage('profile'); setActiveNav('navProfile'); };
document.getElementById('backBtn').onclick = () => { showPage('main'); setActiveNav('navHome'); };

// ===== เริ่มทำงาน — โหลดของเก่าก่อน =====
window.addEventListener('load', () => {
  loadLocalData();  // ของเก่าขึ้นก่อน — ไม่หาย
  loadProfile();
  syncFromCloud();  // ต่อคลาวด์ทีหลัง
  setInterval(syncFromCloud, 8000); // ตรวจสอบใหม่ทุก 8 วินาที
});
</script>

</body>
</html>
