<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thaipodee Global Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    .hidden { display: none !important; }
    
    .feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; }
    .post-slide { min-height: 100vh; scroll-snap-align: start; position: relative; padding-bottom: 70px; }
    .media { width: 100%; height: calc(100vh - 70px); object-fit: contain; background: #111; }
    
    .info-left { position: absolute; bottom: 80px; left: 12px; max-width: 70%; }
    .username { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .caption { font-size: 14px; opacity: 0.9; margin-top: 4px; }
    .time { font-size: 11px; color: #888; margin-top: 2px; }
    
    .side-menu { position: absolute; bottom: 100px; right: 12px; display: flex; flex-direction: column; gap: 22px; align-items: center; }
    .side-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: transform 0.15s; }
    .side-btn:active { transform: scale(0.9); }
    .side-btn i { font-size: 26px; }
    .side-btn span { font-size: 11px; }
    .liked { color: #ff4757; }
    .bookmarked { color: #ffd32a; }
    
    .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 50; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
    .nav-btn i { font-size: 22px; }
    .nav-btn span { font-size: 10px; }
    .add-btn { background: #f00; width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; padding: 20px; overflow-y: auto; }
    .close-top { text-align: right; font-size: 24px; cursor: pointer; margin-bottom: 10px; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: none; border-radius: 8px; color: #fff; font-size: 15px; }
    button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; width: 100%; margin-top: 10px; transition: all 0.15s; }
    button:active { transform: scale(0.98); }
    .btn-red { background: #f00; color: #fff; font-weight: bold; }
    .btn-red:hover { background: #c00; }
    .btn-gray { background: #333; color: #fff; }
    
    .comment-list { max-height: 300px; overflow-y: auto; margin: 12px 0; }
    .comment-item { padding: 10px 0; border-bottom: 1px solid #333; }
    .comment-name { font-weight: bold; font-size: 14px; }
    .comment-text { font-size: 14px; margin-top: 4px; }
    
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

<div id="feedPage">
  <div class="feed" id="feedList"></div>
  
  <div class="bottom-bar">
    <div class="nav-btn" onclick="switchTab('feed')"><i class="fa fa-home"></i><span>หน้าแรก</span></div>
    <div class="nav-btn" onclick="switchTab('search')"><i class="fa fa-search"></i><span>ค้นหา</span></div>
    <div class="nav-btn add-btn" onclick="openPostBox()"><i class="fa fa-plus"></i></div>
    <div class="nav-btn" onclick="switchTab('notify')"><i class="fa fa-bell-o"></i><span>แจ้งเตือน</span></div>
    <div class="nav-btn" onclick="switchTab('profile')"><i class="fa fa-user-o"></i><span>ฉัน</span></div>
  </div>
</div>

<!-- หน้าค้นหา -->
<div id="searchPage" class="hidden fixed inset-0 bg-black z-40 p-5">
  <div class="close-top" onclick="switchTab('feed')">&times;</div>
  <h2 class="text-xl font-bold mb-4">ค้นหา</h2>
  <input type="text" id="searchInput" placeholder="ค้นหาชื่อ คำอธิบาย..." oninput="doSearch()">
  <div id="searchResult" class="mt-4"></div>
</div>

<!-- หน้าแจ้งเตือน -->
<div id="notifyPage" class="hidden fixed inset-0 bg-black z-40 p-5">
  <div class="close-top" onclick="switchTab('feed')">&times;</div>
  <h2 class="text-xl font-bold mb-4">การแจ้งเตือน</h2>
  <div id="notifyList">
    <div class="p-3 bg-gray-900 rounded-lg mb-2">
      <p class="text-gray-400">ยังไม่มีการแจ้งเตือน</p>
    </div>
  </div>
</div>

<!-- หน้าโปรไฟล์ -->
<div id="profilePage" class="hidden fixed inset-0 bg-black z-40 p-5">
  <div class="close-top" onclick="switchTab('feed')">&times;</div>
  <h2 class="text-xl font-bold mb-4">โปรไฟล์</h2>
  <div class="flex items-center gap-4 mb-6">
    <div class="w-20 h-20 rounded-full bg-gray-800 flex items-center justify-center text-3xl">
      <i class="fa fa-user"></i>
    </div>
    <div>
      <div class="font-bold text-lg" id="profileName">Thaipodee Master</div>
      <div class="text-gray-400 text-sm">ผู้สร้างแอป</div>
    </div>
  </div>
  <button class="btn-gray" onclick="changeProfileName()">เปลี่ยนชื่อผู้ใช้</button>
  <h3 class="font-bold mt-6 mb-3">โพสต์ทั้งหมด: <span id="myCount">0</span></h3>
  <div id="myPostsList"></div>
</div>

<!-- กล่องสร้างโพสต์ -->
<div id="postBox" class="overlay hidden">
  <div class="close-top" onclick="closePostBox()">&times;</div>
  <h2 class="text-xl font-bold mb-4">สร้างโพสต์</h2>
  
  <input type="file" id="fileChoose" accept="image/*,video/*" onchange="showPreview(this)">
  
  <div id="previewHere" class="w-full aspect-video bg-gray-900 rounded-lg flex items-center justify-center my-4">
    <span class="text-gray-400">เลือกไฟล์รูปหรือวิดีโอ</span>
  </div>
  
  <input type="text" id="inputName" placeholder="ชื่อผู้โพสต์" value="Thaipodee Master">
  <textarea id="inputDesc" rows="3" placeholder="เขียนคำอธิบาย..."></textarea>
  
  <button class="btn-red" onclick="doPublish()">เผยแพร่</button>
</div>

<!-- กล่องคอมเมนต์ -->
<div id="commentBox" class="overlay hidden">
  <div class="close-top" onclick="closeCommentBox()">&times;</div>
  <h2 class="text-xl font-bold mb-4">ความคิดเห็น</h2>
  <div id="commentList" class="comment-list"></div>
  <input type="text" id="commentInput" placeholder="เขียนความคิดเห็น...">
  <button class="btn-red" onclick="sendComment()">ส่งความคิดเห็น</button>
</div>

<script>
let postData = [];
let selectedFile = null;
let previewUrl = null;
let currentPostIndex = -1;
let myName = 'Thaipodee Master';

// โหลดข้อมูลทั้งหมด
function loadAllData() {
  try {
    const saved = localStorage.getItem('tpd_posts_v4');
    if (saved) postData = JSON.parse(saved);
  } catch(e) {
    postData = [];
  }
  const savedName = localStorage.getItem('tpd_my_name');
  if (savedName) myName = savedName;
  document.getElementById('inputName').value = myName;
  document.getElementById('profileName').textContent = myName;
  renderFeed();
  updateMyCount();
}

function saveAllData() {
  localStorage.setItem('tpd_posts_v4', JSON.stringify(postData));
  localStorage.setItem('tpd_my_name', myName);
}

// เปลี่ยนแท็บ
function switchTab(tab) {
  document.getElementById('feedPage').classList.add('hidden');
  document.getElementById('searchPage').classList.add('hidden');
  document.getElementById('notifyPage').classList.add('hidden');
  document.getElementById('profilePage').classList.add('hidden');
  
  if (tab === 'feed') {
    document.getElementById('feedPage').classList.remove('hidden');
    renderFeed();
  } else if (tab === 'search') {
    document.getElementById('searchPage').classList.remove('hidden');
  } else if (tab === 'notify') {
    document.getElementById('notifyPage').classList.remove('hidden');
  } else if (tab === 'profile') {
    document.getElementById('profilePage').classList.remove('hidden');
    renderMyPosts();
  }
}

// แสดงฟีดหลัก
function renderFeed() {
  const list = document.getElementById('feedList');
  list.innerHTML = '';
  
  if (postData.length === 0) {
    list.innerHTML = `
      <div class="post-slide">
        <div class="media flex items-center justify-center text-gray-400">
          <p>กดปุ่ม + เพื่อโพสต์</p>
        </div>
        <div class="info-left">
          <div class="username">Thaipodee Master</div>
          <div class="caption">ยินดีต้อนรับสู่ Thaipodee Global Market</div>
        </div>
        <div class="side-menu">
          <div class="side-btn"><i class="fa fa-user-circle-o"></i><span>โปรไฟล์</span></div>
          <div class="side-btn"><i class="fa fa-heart-o"></i><span>0</span></div>
          <div class="side-btn"><i class="fa fa-comment-o"></i><span>0</span></div>
          <div class="side-btn"><i class="fa fa-bookmark-o"></i><span>บันทึก</span></div>
          <div class="side-btn"><i class="fa fa-share-alt"></i><span>แชร์</span></div>
          <div class="side-btn"><i class="fa fa-ellipsis-h"></i><span>อื่นๆ</span></div>
        </div>
      </div>`;
    return;
  }
  
  postData.forEach((p, idx) => {
    const slide = document.createElement('div');
    slide.className = 'post-slide';
    
    let mediaHtml = '';
    if (p.previewUrl) {
      if (p.isVideo) {
        mediaHtml = `<video class="media" controls autoplay muted loop playsinline src="${p.previewUrl}"></video>`;
      } else {
        mediaHtml = `<img class="media" src="${p.previewUrl}" alt="">`;
      }
    } else {
      mediaHtml = `<div class="media flex items-center justify-center text-gray-500">
        <i class="fa ${p.isVideo ? 'fa-film' : 'fa-picture-o'}" style="font-size:48px;"></i>
      </div>`;
    }
    
    slide.innerHTML = `
      ${mediaHtml}
      <div class="info-left">
        <div class="username">${p.name}</div>
        <div class="caption">${p.desc || ''}</div>
        <div class="time">${p.time}</div>
      </div>
      <div class="side-menu">
        <div class="side-btn" onclick="switchTab('profile')"><i class="fa fa-user-circle-o"></i><span>โปรไฟล์</span></div>
        <div class="side-btn" onclick="toggleLike(${idx})">
          <i class="fa ${p.liked ? 'fa-heart liked' : 'fa-heart-o'}"></i>
          <span>${p.likeCount}</span>
        </div>
        <div class="side-btn" onclick="openCommentBox(${idx})">
          <i class="fa fa-comment-o"></i>
          <span>${p.comments.length}</span>
        </div>
        <div class="side-btn" onclick="toggleBookmark(${idx})">
          <i class="fa ${p.bookmarked ? 'fa-bookmark bookmarked' : 'fa-bookmark-o'}"></i>
          <span>${p.bookmarked ? 'บันทึกแล้ว' : 'บันทึก'}</span>
        </div>
        <div class="side-btn" onclick="doShare(${idx})">
          <i class="fa fa-share-alt"></i>
          <span>แชร์</span>
        </div>
        <div class="side-btn" onclick="openMoreMenu(${idx})">
          <i class="fa fa-ellipsis-h"></i>
          <span>อื่นๆ</span>
        </div>
      </div>
    `;
    list.appendChild(slide);
  });
}

// เปิด-ปิด กล่องโพสต์
function openPostBox() {
  selectedFile = null;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = null;
  
  document.getElementById('fileChoose').value = '';
  document.getElementById('inputDesc').value = '';
  document.getElementById('previewHere').innerHTML = '<span class="text-gray-400">เลือกไฟล์รูปหรือวิดีโอ</span>';
  document.getElementById('postBox').classList.remove('hidden');
}

function closePostBox() {
  document.getElementById('postBox').classList.add('hidden');
  if (previewUrl) {
    URL.revokeObjectURL(previewUrl);
    previewUrl = null;
  }
}

// แสดงตัวอย่างไฟล์
function showPreview(input) {
  if (!input.files || !input.files[0]) return;
  selectedFile = input.files[0];
  
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(selectedFile);
  
  const box = document.getElementById('previewHere');
  if (selectedFile.type.startsWith('video/')) {
    box.innerHTML = `<video src="${previewUrl}" class="w-full h-full object-contain" autoplay muted loop playsinline controls></video>`;
  } else {
    box.innerHTML = `<img src="${previewUrl}" class="w-full h-full object-contain" alt="">`;
  }
}

// ✅ เผยแพร่ — ทำงานจริง
function doPublish() {
  if (!selectedFile) {
    alert('⚠️ กรุณาเลือกไฟล์รูปหรือวิดีโอก่อน');
    return;
  }
  
  const name = document.getElementById('inputName').value.trim() || myName;
  const desc = document.getElementById('inputDesc').value.trim();
  
  postData.unshift({
    id: Date.now(),
    filename: selectedFile.name,
    previewUrl: previewUrl,
    isVideo: selectedFile.type.startsWith('video/'),
    name: name,
    desc: desc,
    time: new Date().toLocaleString('th-TH'),
    likeCount: 0,
    liked: false,
    bookmarked: false,
    comments: []
  });
  
  saveAllData();
  closePostBox();
  renderFeed();
  updateMyCount();
  
  alert('✅ เผยแพร่สำเร็จ!');
}

// กดถูกใจ
function toggleLike(idx) {
  postData[idx].liked = !postData[idx].liked;
  postData[idx].likeCount += postData[idx].liked ? 1 : -1;
  saveAllData();
  renderFeed();
}

// กดบันทึก
function toggleBookmark(idx) {
  postData[idx].bookmarked = !postData[idx].bookmarked;
  saveAllData();
  renderFeed();
}

// เปิดกล่องคอมเมนต์
function openCommentBox(idx) {
  currentPostIndex = idx;
  renderComments();
  document.getElementById('commentBox').classList.remove('hidden');
}

function closeCommentBox() {
  document.getElementById('commentBox').classList.add('hidden');
  currentPostIndex = -1;
}

function renderComments() {
  const list = document.getElementById('commentList');
  const p = postData[currentPostIndex];
  if (!p || !p.comments.length) {
    list.innerHTML = '<p class="text-gray-400 text-center py-4">ยังไม่มีความคิดเห็น เป็นคนแรกเลย!</p>';
    return;
  }
  list.innerHTML = p.comments.map(c => `
    <div class="comment-item">
      <div class="comment-name">${c.name}</div>
      <div class="comment-text">${c.text}</div>
    </div>
  `).join('');
}

// ส่งคอมเมนต์
function sendComment() {
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text) return;
  
  postData[currentPostIndex].comments.push({
    name: myName,
    text: text,
    time: new Date().toLocaleString('th-TH')
  });
  
  saveAllData();
  input.value = '';
  renderComments();
  renderFeed();
}

// แชร์
function doShare(idx) {
  const p = postData[idx];
  const shareText = `แชร์จาก Thaipodee Global Market\nโดย: ${p.name}\n${p.desc || ''}`;
  
  if (navigator.share) {
    navigator.share({ title: 'Thaipodee Global Market', text: shareText });
  } else {
    navigator.clipboard.writeText(shareText);
    alert('✅ คัดลอกข้อความแล้ว สามารถนำไปแชร์ต่อได้เลย');
  }
}

// เมนูเพิ่มเติม
function openMoreMenu(idx) {
  const p = postData[idx];
  const isOwner = p.name === myName;
  
  let options = ['ยกเลิก'];
  if (isOwner) options.unshift('ลบโพสต์นี้');
  
  const choice = prompt(isOwner ? 'พิมพ์ตัวเลือก:\n1. ลบโพสต์นี้\n2. ยกเลิก' : 'ตัวเลือก:\n1. ยกเลิก');
  if (choice === '1' && isOwner) {
    if (confirm('ยืนยันการลบ? ไม่สามารถกู้คืนได้')) {
      postData.splice(idx, 1);
      saveAllData();
      renderFeed();
      updateMyCount();
    }
  }
}

// ค้นหา
function doSearch() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const result = document.getElementById('searchResult');
  if (!q) { result.innerHTML = ''; return; }
  
  const found = postData.filter(p =>
    p.name.toLowerCase().includes(q) || (p.desc && p.desc.toLowerCase().includes(q))
  );
  
  if (!found.length) {
    result.innerHTML = '<p class="text-gray-400">ไม่พบผลลัพธ์</p>';
    return;
  }
  
  result.innerHTML = found.map(p => `
    <div class="p-3 bg-gray-900 rounded-lg mb-2" onclick="switchTab('feed')">
      <div class="font-bold">${p.name}</div>
      <div class="text-sm text-gray-400">${p.desc || 'ไม่มีคำอธิบาย'}</div>
    </div>
  `).join('');
}

// เปลี่ยนชื่อ
function changeProfileName() {
  const newName = prompt('ตั้งชื่อใหม่:', myName);
  if (newName && newName.trim()) {
    myName = newName.trim();
    document.getElementById('profileName').textContent = myName;
    document.getElementById('inputName').value = myName;
    saveAllData();
    alert('✅ เปลี่ยนชื่อเรียบร้อยแล้ว');
  }
}

// อัปเดตจำนวนโพสต์
function updateMyCount() {
  document.getElementById('myCount').textContent = postData.length;
}

// แสดงโพสต์ของฉันในหน้าโปรไฟล์
function renderMyPosts() {
  const list = document.getElementById('myPostsList');
  if (!postData.length) {
    list.innerHTML = '<p class="text-gray-400">ยังไม่มีโพสต์</p>';
    return;
  }
  list.innerHTML = postData.map((p, i) => `
    <div class="p-3 bg-gray-900 rounded-lg mb-2 flex justify-between items-center">
      <div>
        <div class="font-bold text-sm">${p.desc?.substring(0,20) || 'โพสต์'}${p.desc?.length>20?'...':''}</div>
        <div class="text-xs text-gray-400">${p.time}</div>
      </div>
      <button class="text-red-500 text-sm" onclick="openMoreMenu(${i});switchTab('feed')">จัดการ</button>
    </div>
  `).join('');
}

document.addEventListener('DOMContentLoaded', loadAllData);
</script>

</body>
</html>
