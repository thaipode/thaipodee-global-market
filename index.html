<!-- หน้าโปรไฟล์ -->
<div id="profilePage" class="page">
  <div class="p-5">
    <button class="mb-5 text-lg" data-page="home"><i class="fas fa-arrow-left"></i> กลับ</button>
    <h3 class="text-xl font-bold mb-3">โปรไฟล์</h3>
    <p class="text-gray-400">ข้อมูลจะแสดงที่นี่</p>
  </div>
</div>

<script>
const APP_VERSION = '4.6.9';
let deferredPrompt = null;

// เปลี่ยนหน้าหลังโหลด
setTimeout(() => {
  document.getElementById('splash').classList.remove('active');
  document.getElementById('homePage').classList.add('active');
}, 2000);

// เปลี่ยนหน้า
document.querySelectorAll('[data-page]').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.page + 'Page';
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(target).classList.add('active');
  });
});

// ติดตั้งแอปอัตโนมัติ
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').style.display = 'flex';
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log(`ผลติดตั้ง: ${outcome}`);
  deferredPrompt = null;
  document.getElementById('installBanner').style.display = 'none';
});

document.getElementById('dismissBtn').addEventListener('click', () => {
  document.getElementById('installBanner').style.display = 'none';
});

// แชร์
document.getElementById('shareBtn').addEventListener('click', async () => {
  const shareText = `✅ Thaipodee Global Market
📌 เวอร์ชัน: ${APP_VERSION} — ล่าสุด
📅 21 ก.ย. 69 18:34 น.

🔗 ลิงก์หลัก:
https://thaipodee-global-market-v2026-new.onrender.com/

⚠️ เปิดแล้วกดติดตั้งแอปเพื่อใช้งานทันที`;

  if (navigator.share) {
    await navigator.share({ title: `thaipodee v${APP_VERSION}`, text: shareText });
  } else {
    await navigator.clipboard.writeText(shareText);
    alert('คัดลอกข้อความแล้ว → วางส่งให้เพื่อนได้เลย');
  }
});
</script>
