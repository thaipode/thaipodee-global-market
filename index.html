<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thaipodee Global Market</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    html, body { height: 100%; background: #000; color: #fff; overflow: hidden; }

    /* พื้นที่วิดีโอตรงกลาง */
    .video-area {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .video-icon { font-size: 40px; color: #888; margin-bottom: 12px; }
    .hint-text { color: #888; font-size: 14px; }

    /* ปุ่มด้านขวา */
    .right-buttons {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 24px; align-items: center;
    }
    .right-btn { font-size: 24px; cursor: pointer; user-select: none; }
    .info-btn {
      background: linear-gradient(90deg, #c0f, #f08);
      border: none; border-radius: 20px; padding: 8px 14px;
      color: #fff; font-size: 12px; margin-top: 8px;
    }

    /* แถบด้านล่าง */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 0; background: #000;
    }
    .nav-btn { font-size: 22px; cursor: pointer; user-select: none; }
    .post-btn {
      background: #f33; border: none; border-radius: 6px;
      width: 36px; height: 36px; font-size: 22px; color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- พื้นที่ตรงกลาง -->
  <div class="video-area">
    <div class="video-icon">🎥</div>
    <div class="hint-text">กดปุ่ม + เพื่อโพสต์</div>
  </div>

  <!-- ปุ่มด้านขวา -->
  <div class="right-buttons">
    <div class="right-btn">👤</div>
    <div class="right-btn">🤍</div>
    <div class="right-btn">💬</div>
    <div class="right-btn">📌</div>
    <div class="right-btn">↗️</div>
    <button class="info-btn">ข้อมูลเพิ่ม</button>
  </div>

  <!-- แถบล่าง -->
  <div class="bottom-nav">
    <div class="nav-btn">🏠</div>
    <div class="nav-btn">🔍</div>
    <button class="post-btn">+</button>
    <div class="nav-btn">💬</div>
    <div class="nav-btn">👤</div>
  </div>

</body>
</html>
