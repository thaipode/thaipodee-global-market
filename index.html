<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thaipodee Global Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    .page { position: absolute; inset: 0; z-index: 1; }
    .page.hidden { display: none; }
    
    /* ฟีดเลื่อนแนวตั้ง */
    .feed-container { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; }
    .video-slide { height: 100vh; scroll-snap-align: start; position: relative; }
    .video-content { width: 100%; height: 100%; object-fit: cover; background: #111; }
    
    /* ข้อมูลด้านซ้ายล่าง */
    .info-left { position: absolute; bottom: 100px; left: 12px; max-width: 70%; }
    .username { font-weight: bold; margin-bottom: 4px; font-size: 15px; }
    .caption { font-size: 14px; line-height: 1.4; opacity: 0.9; }
    
    /* ปุ่มด้านขวา — ครบทุกอัน */
    .actions-right { position: absolute; bottom: 120px; right: 12px; display: flex; flex-direction: column; gap: 22px; align-items: center; z-index: 5; }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .action-btn i { font-size: 26px; }
    .action-btn span { font-size: 11px; }
    
    /* เมนูด้านล่าง */
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
    .nav-item i { font-size: 22px; }
    .nav-item span { font-size: 10px; }
    .nav-item.post-btn { background: #f00; width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    
    /* ซ่อนแถบเลื่อน*/
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

<!-- หน้าฟีดหลัก -->
<div id="feedPage" class="page">
  <div class="feed-container" id="feedContainer">
    <!-- โพสต์ตัวอย่าง -->
    <div class="video-slide">
      <video class="video-content" controls autoplay muted loop playsinline>
        <source src="video-sample-1.mp4" type="video/mp4">
      </video>
      
      <!-- ข้อมูลซ้าย -->
      <div class="info-left">
        <div class="username">thaipodee Master</div>
        <div class="caption">✨ ไม่ระบุ</div>
      </div>
      
      <!-- ปุ่มด้านขวา — ครบ 4 อันตรงนี้เลย -->
      <div class="actions-right">
        <div class="action-btn">
          <i class="fa fa-heart-o"></i>
          <span>0</span>
        </div>
        <div class="action-btn">
          <i class="fa fa-comment-o"></i>
          <span>0</span>
        </div>
        <div class="action-btn">
          <i class="fa fa-share-alt"></i>
          <span>แชร์</span>
        </div>
        <div class="action-btn">
          <i class="fa fa-user-circle-o"></i>
          <span>โปรไฟล์</span>
        </div>
      </div>
    </div>
  </div>

  <!-- เมนูล่าง — ครบถ้วน -->
  <nav class="bottom-nav">
    <div class="nav-item" onclick="switchPage('feed')">
      <i class="fa fa-home"></i>
      <span>หน้าแรก</span>
    </div>
    <div class="nav-item" onclick="switchPage('explore')">
      <i class="fa fa-search"></i>
      <span>ค้นหา</span>
    </div>
    <div class="nav-item post-btn" onclick="switchPage('post')">
      <i class="fa fa-plus"></i>
    </div>
    <div class="nav-item" onclick="switchPage('notifications')">
      <i class="fa fa-bell-o"></i>
      <span>แจ้งเตือน</span>
    </div>
    <div class="nav-item" onclick="switchPage('profile')">
      <i class="fa fa-user-o"></i>
      <span>ฉัน</span>
    </div>
  </nav>
</div>

<script>
// เปลี่ยนหน้า
function switchPage(page) {
  console.log('ไปที่:', page);
}

// โหลดโพสต์จากที่บันทึกไว้
let posts = JSON.parse(localStorage.getItem('tpd_posts') || '[]');

// แสดงรายการโพสต์
function renderPosts() {
  const container = document.getElementById('feedContainer');
  container.innerHTML = '';

  // ถ้ายังไม่มีโพสต์ ให้แสดงตัวอย่าง
  if (posts.length === 0) {
    container.innerHTML = `
      <div class="video-slide">
        <div class="video-content flex items-center justify-center text-gray-400">
          <p>ยังไม่มีโพสต์ กดปุ่ม + เพิ่มโพสต์แรก</p>
        </div>
        <div class="info-left">
          <div class="username">thaipodee Master</div>
          <div class="caption">✨ ยินดีต้อนรับสู่ Thaipodee</div>
        </div>
        <div class="actions-right">
          <div class="action-btn"><i class="fa fa-heart-o"></i><span>0</span></div>
          <div class="action-btn"><i class="fa fa-comment-o"></i><span>0</span></div>
          <div class="action-btn"><i class="fa fa-share-alt"></i><span>แชร์</span></div>
          <div class="action-btn"><i class="fa fa-user-circle-o"></i><span>โปรไฟล์</span></div>
        </div>
      </div>
    `;
    return;
  }

  // แสดงโพสต์ที่มีอยู่
  posts.forEach(post => {
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    slide.innerHTML = `
      ${post.type === 'video' 
        ? `<video class="video-content" controls autoplay muted loop playsinline>
             <source src="${post.src}" type="video/mp4">
           </video>`
        : `<img class="video-content" src="${post.src}" alt="">`
      }
      <div class="info-left">
        <div class="username">${post.author || 'thaipodee Master'}</div>
        <div class="caption">${post.caption || ''}</div>
      </div>
      <div class="actions-right">
        <div class="action-btn"><i class="fa fa-heart-o"></i><span>0</span></div>
        <div class="action-btn"><i class="fa fa-comment-o"></i><span>0</span></div>
        <div class="action-btn"><i class="fa fa-share-alt"></i><span>แชร์</span></div>
        <div class="action-btn"><i class="fa fa-user-circle-o"></i><span>โปรไฟล์</span></div>
      </div>
    `;
    container.appendChild(slide);
  });
}

// โหลดครั้งแรก
document.addEventListener('DOMContentLoaded', () => {
  renderPosts();
});
</script>

</body>
</html>
