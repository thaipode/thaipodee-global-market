<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thaipodee Market">
<meta name="description" content="Thaipodee Global Market — แอปแชร์วิดีโอและสินค้า">
<title>Thaipodee Global Market</title>

<!-- ไอคอนแอป -->
<link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/thaipodee/thaipodee/main/icon-192.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/thaipodee/thaipodee/main/icon-192.png">

<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
  .app-container { height: 100vh; display: flex; flex-direction: column; }
  .status-bar { padding: 8px 12px; font-size: 12px; }
  .status-online { color: #22c55e; }
  .status-offline { color: #eab308; }
  .content-area { flex: 1; overflow-y: auto; padding-bottom: 60px; }
  .post-card { border-bottom: 1px solid #222; padding: 12px; }
  .post-cover { width: 100%; aspect-ratio: 9/16; background: #111; border-radius: 8px; object-fit: cover; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
  .nav-icon { font-size: 24px; color: #888; cursor: pointer; }
  .nav-icon.active { color: #fff; }
  .btn-fab { position: fixed; bottom: 70px; right: 16px; width: 56px; height: 56px; border-radius: 50%; background: #ef4444; color: #fff; border: none; font-size: 24px; cursor: pointer; z-index: 100; }
</style>
</head>
<body>

<div class="app-container">
  <!-- แถบสถานะ -->
  <div class="status-bar" id="statusBar">
    <span id="statusText">กำลังเชื่อมต่อ...</span>
  </div>

  <!-- พื้นที่เนื้อหา -->
  <div class="content-area" id="contentArea">
    <div style="padding: 12px 16px;">
      <h3 id="postCountDisplay">จำนวนโพสต์: <span id="postCount">0</span></h3>
    </div>
    <div id="postsList" style="padding: 0 12px;"></div>
  </div>

  <!-- ปุ่มเผยแพร่ -->
  <button class="btn-fab" id="btnPublish">+</button>

  <!-- เมนูล่าง — รักษาลำดับเดิม: หน้าหลัก ค้นหา อัปโหลด ข้อความ โปรไฟล์ -->
  <nav class="bottom-nav">
    <span class="nav-icon active" data-page="home">🏠</span>
    <span class="nav-icon" data-page="search">🔍</span>
    <span class="nav-icon" data-page="upload">📤</span>
    <span class="nav-icon" data-page="messages">💬</span>
    <span class="nav-icon" data-page="profile">👤</span>
  </nav>
</div>

<script>
// ===== การตั้งค่าเชื่อมต่อคลาวด์ =====
const CLOUD_URL = 'https://thaipodee-global-market-v2026-new.onrender.com/';
const STORAGE_KEY = 'thaipodee_posts';

// ===== ตัวแปรกลาง =====
let localPosts = [];
let isOnline = false;

// ===== แสดงสถานะ =====
function setStatus(text, isOk) {
  const bar = document.getElementById('statusBar');
  const textEl = document.getElementById('statusText');
  textEl.textContent = text;
  bar.className = isOk ? 'status-bar status-online' : 'status-bar status-offline';
}

// ===== นับจำนวนโพสต์ที่ยังไม่ถูกลบ =====
function updatePostCount() {
  const valid = localPosts.filter(p => !p.deleted);
  document.getElementById('postCount').textContent = valid.length;
}

// ===== แสดงรายการโพสต์ =====
function renderPosts() {
  const container = document.getElementById('postsList');
  container.innerHTML = '';
  
  const valid = localPosts.filter(p => !p.deleted).reverse();
  valid.forEach(post => {
    const card = document.createElement('div');
    card.className = 'post-card';
    card.innerHTML = `
      <img src="${post.cover || ''}" alt="ปกวิดีโอ" class="post-cover" loading="lazy">
      <p style="margin-top:8px; font-size:14px;">${post.caption || 'ไม่มีข้อความ'}</p>
      <small style="color:#888;">${new Date(post.createdAt).toLocaleString('th-TH')}</small>
    `;
    container.appendChild(card);
  });
  
  updatePostCount();
}

// ===== โหลดข้อมูล =====
function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  localPosts = saved ? JSON.parse(saved) : [];
  renderPosts();
}

// ===== บันทึกข้อมูล =====
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(localPosts));
  renderPosts();
}

// ===== ตรวจสอบการเชื่อมต่อ =====
async function checkConnection() {
  try {
    const res = await fetch(CLOUD_URL, { mode: 'no-cors' });
    isOnline = true;
    setStatus('ออนไลน์ — พร้อมใช้งาน', true);
  } catch {
    isOnline = false;
    setStatus('ออฟไลน์ — แสดงเฉพาะในเครื่อง', false);
  }
}

// ===== กดปุ่มเผยแพร่ =====
document.getElementById('btnPublish').addEventListener('click', () => {
  const newPost = {
    id: Date.now(),
    caption: 'วิดีโอใหม่',
    cover: '',
    videoUrl: '',
    deleted: false,
    createdAt: new Date().toISOString()
  };
  localPosts.push(newPost);
  saveData();
  alert('เพิ่มโพสต์เรียบร้อย');
});

// ===== เมนูนำทาง =====
document.querySelectorAll('.nav-icon').forEach(icon => {
  icon.addEventListener('click', () => {
    document.querySelectorAll('.nav-icon').forEach(i => i.classList.remove('active'));
    icon.classList.add('active');
  });
});

// ===== เริ่มทำงาน =====
document.addEventListener('DOMContentLoaded', () => {
  loadData();
  checkConnection();
});
</script>

</body>
</html>
