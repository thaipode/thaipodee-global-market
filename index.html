<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<title>ThaiPodee v1008</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
html, body { height: 100%; overflow: hidden; background: #000; color: #fff; }

.page { display: none; width: 100%; min-height: 100vh; }
.page.active { display: block; }

/* ===== แถบบน ===== */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 12px 16px;
  display: flex; justify-content: center; align-items: center;
  gap: 24px; z-index: 100;
  background: rgba(0,0,0,0.9);
}
.top-tab {
  font-size: 15px; color: #999;
  cursor: pointer; padding-bottom: 4px;
}
.top-tab.active { color: #fff; border-bottom: 2px solid #fff; font-weight: 500; }
.top-search { position: absolute; right: 16px; font-size: 22px; cursor: pointer; color: #fff; }

/* ===== พื้นที่ฟีด — ไม่มีกล้อง ไม่มีข้อความ ===== */
.feed {
  height: 100vh; overflow-y: auto;
  scroll-snap-type: y mandatory; padding-top: 50px;
}
.feed-item {
  height: 100vh; scroll-snap-align: start;
  position: relative; background: #000;
}
.feed-placeholder { display: none !important; }
.feed-video {
  width: 100%; height: 100%; object-fit: cover;
  position: absolute; top: 0; left: 0; display: none;
}

/* ===== มุมล่างซ้าย — แสดงเมื่อมีวิดีโอ ===== */
.bottom-left {
  position: absolute; left: 16px; right: 100px; bottom: 80px;
  z-index: 10; display: none;
}
.bl-username {
  display: flex; align-items: center; gap: 6px;
  font-weight: 600; font-size: 14px; margin-bottom: 6px;
}
.bl-tag {
  background: #333; border-radius: 10px;
  padding: 2px 8px; font-size: 11px; margin-left: 8px;
}
.bl-desc { font-size: 13px; line-height: 1.5; margin-bottom: 6px; }
.bl-hashtag { font-size: 12px; color: #88c8ff; margin-bottom: 8px; }
.bl-search-bar {
  background: #222; border-radius: 4px; padding: 6px 10px;
  font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 6px;
}

/* ===== ด้านขวา — 6 ตัว ครบ ===== */
.side-bar {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column;
  align-items: center; gap: 22px;
  z-index: 10;
}
.s-avatar-wrap { position: relative; cursor: pointer; }
.s-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  overflow: hidden; border: 2px solid #fff; background: #333;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}
.s-add-btn {
  position: absolute; bottom: -6px; left: 50%;
  transform: translateX(-50%);
  width: 20px; height: 20px; background: #f02b2b;
  border-radius: 50%; display: flex;
  align-items: center; justify-content: center;
  font-size: 14px; font-weight: bold; color: #fff;
}
.s-btn {
  display: flex; flex-direction: column;
  align-items: center; gap: 2px; cursor: pointer;
}
.s-icon { font-size: 28px; }
.s-num { font-size: 11px; color: #fff; }
.s-music {
  width: 48px; height: 48px; border-radius: 50%;
  background: #222; display: flex;
  align-items: center; justify-content: center;
  font-size: 24px;
}

/* ===== หน้าอื่น ===== */
.page-inner { padding: 80px 16px 80px; text-align: center; }
.page-inner h2 { font-size: 20px; margin-bottom: 12px; }
.page-inner p { color: #888; }

/* ===== แถบล่าง ===== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 60px; display: flex;
  justify-content: space-around; align-items: center;
  background: #000; border-top: 1px solid #222; z-index: 100;
}
.nav-item {
  display: flex; flex-direction: column;
  align-items: center; gap: 2px; cursor: pointer;
  position: relative;
}
.nav-icon { font-size: 22px; }
.nav-label { font-size: 10px; color: #888; }
.nav-item.active .nav-label { color: #fff; }
.nav-center {
  width: 44px; height: 32px; background: #fff;
  border-radius: 6px; display: flex;
  align-items: center; justify-content: center;
  color: #000; font-size: 22px; font-weight: bold;
  cursor: pointer;
}
.nav-badge {
  position: absolute; top: -2px; right: -6px;
  background: #f02b2b; color: #fff;
  font-size: 9px; padding: 1px 5px;
  border-radius: 10px; display: none;
}

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- หน้าแรก -->
<div class="page active" id="page-home">
  <div class="top-bar">
    <span class="top-tab">กำลังติดตาม</span>
    <span class="top-tab active">สำหรับคุณ</span>
    <span class="top-search">🔍</span>
  </div>

  <div class="feed">
    <div class="feed-item">
      <!-- ไม่มีกล้อง ไม่มีข้อความ -- พื้นดำเปล่า -->
      <div class="feed-placeholder" id="placeholder"></div>

      <!-- วิดีโอ -->
      <video class="feed-video" id="videoPlayer" controls playsinline loop muted autoplay></video>

      <!-- ข้อมูลด้านล่างซ้าย -- แสดงตอนมีวิดีโอ -->
      <div class="bottom-left" id="postInfo">
        <div class="bl-username">
          <span>@thaipodee</span>
          <span class="bl-tag">ติดตาม</span>
        </div>
        <div class="bl-desc">ThaiPodee — แชร์วิดีโอและสินค้า</div>
        <div class="bl-hashtag">#ThaiPodee #แชร์วิดีโอ #สินค้าไทย</div>
        <div class="bl-search-bar">🔍 ค้นหาเนื้อหาที่เกี่ยวข้อง</div>
      </div>

      <!-- ด้านขวา -- 6 ตัว ครบ -->
      <div class="side-bar" id="sideButtons">
        <!-- 1. โปรไฟล์+ -->
        <div class="s-avatar-wrap" onclick="goPage('page-profile')">
          <div class="s-avatar">👤</div>
          <div class="s-add-btn">+</div>
        </div>
        <!-- 2. ถูกใจ -->
        <div class="s-btn" id="likeBtn">
          <span class="s-icon">🤍</span>
          <span class="s-num">0</span>
        </div>
        <!-- 3. คอมเมนต์ -->
        <div class="s-btn">
          <span class="s-icon">💬</span>
          <span class="s-num">0</span>
        </div>
        <!-- 4. บันทึก -->
        <div class="s-btn">
          <span class="s-icon">🔖</span>
          <span class="s-num">0</span>
        </div>
        <!-- 5. แชร์ -->
        <div class="s-btn">
          <span class="s-icon">↗️</span>
          <span class="s-num">0</span>
        </div>
        <!-- 6. เพลง -->
        <div class="s-music">🎵</div>
      </div>
    </div>
  </div>
</div>

<!-- หน้าร้านค้า -->
<div class="page" id="page-shop">
  <div class="page-inner">
    <h2>ร้านค้า</h2>
    <p>สินค้าจะแสดงที่นี่</p>
  </div>
</div>

<!-- หน้าข้อความ -->
<div class="page" id="page-inbox">
  <div class="page-inner">
    <h2>กล่องข้อความ</h2>
    <p>ยังไม่มีข้อความ</p>
  </div>
</div>

<!-- หน้าโปรไฟล์ -->
<div class="page" id="page-profile">
  <div class="page-inner">
    <h2>โปรไฟล์</h2>
    <p>ข้อมูลของคุณจะแสดงที่นี่</p>
  </div>
</div>

<!-- แถบล่าง -->
<div class="bottom-nav">
  <div class="nav-item active" data-page="page-home">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">หน้าหลัก</span>
  </div>
  <div class="nav-item" data-page="page-shop">
    <span class="nav-icon">🛍️</span>
    <span class="nav-label">ร้านค้า</span>
  </div>
  <div class="nav-center" id="uploadBtn">+</div>
  <div class="nav-item" data-page="page-inbox">
    <span class="nav-icon">💬</span>
    <span class="nav-label">ข้อความ</span>
    <span class="nav-badge" id="msgBadge"></span>
  </div>
  <div class="nav-item" data-page="page-profile">
    <span class="nav-icon">👤</span>
    <span class="nav-label">โปรไฟล์</span>
  </div>
</div>

<input type="file" id="fileInput" accept="video/*" class="hidden">

<script>
// เปลี่ยนหน้า
function goPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll(`[data-page="${pageId}"]`).forEach(n => n.classList.add('active'));
}

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => goPage(item.dataset.page));
});

// อัปโหลดวิดีโอ
document.getElementById('uploadBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  
  const url = URL.createObjectURL(file);
  const video = document.getElementById('videoPlayer');
  video.src = url;
  
  document.getElementById('placeholder').style.display = 'none';
  video.style.display = 'block';
  document.getElementById('postInfo').style.display = 'block';
});

// ปุ่มถูกใจ
let liked = false;
document.addEventListener('click', e => {
  if (e.target.closest('#likeBtn') && !liked) {
    liked = true;
    document.querySelector('#likeBtn .s-icon').textContent = '❤️';
    document.querySelector('#likeBtn .s-num').textContent = '1';
  }
});

// แจ้งเตือน
let unreadCount = 0;
function updateBadge() {
  const badge = document.getElementById('msgBadge');
  badge.style.display = unreadCount > 0 ? 'block' : 'none';
  if (unreadCount > 0) badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
}
updateBadge();
</script>

   ============================================================== -->
</body>
</html>
