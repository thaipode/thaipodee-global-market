<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>World Market v2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #000; color: #fff; height: 100vh; overflow: hidden; }
    .app-container { position: relative; width: 100%; height: 100vh; max-width: 480px; margin: 0 auto; }
    .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; }
    .video-placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .video-placeholder h2 { font-size: 24px; margin-bottom: 10px; }
    .video-placeholder p { color: #aaa; }
    
    .side-actions { position: absolute; right: 12px; bottom: 120px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .action-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .action-icon { font-size: 28px; margin-bottom: 4px; }
    .action-count { font-size: 12px; color: #fff; }
    .profile-icon { width: 48px; height: 48px; border-radius: 50%; background: #555; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
    .follow-btn { width: 24px; height: 24px; border-radius: 50%; background: #ff0050; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-top: -12px; border: 2px solid #000; }
    
    .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .nav-icon { font-size: 24px; margin-bottom: 2px; }
    .nav-label { font-size: 10px; color: #aaa; }
    .nav-item.active .nav-label { color: #fff; }
    .nav-item.active .nav-icon { transform: scale(1.1); }
    
    .post-btn { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); width: 56px; height: 56px; background: #ff0050; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 100; cursor: pointer; }
    .post-btn svg { width: 30px; height: 30px; }
    
    .video-info { position: absolute; bottom: 90px; left: 16px; right: 80px; }
    .author-name { font-weight: bold; font-size: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .desc { font-size: 14px; color: #eee; line-height: 1.4; margin-bottom: 8px; }
    .music-line { display: flex; align-items: center; font-size: 13px; color: #ddd; }
    .music-dot { width: 12px; height: 12px; border-radius: 50%; background: #ff0050; margin-right: 6px; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    
    .upload-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; padding: 20px; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-top: 10px; }
    .modal-title { font-size: 20px; font-weight: bold; }
    .close-btn { font-size: 28px; cursor: pointer; color: #fff; background: none; border: none; }
    .upload-area { border: 2px dashed #555; border-radius: 12px; padding: 40px 20px; text-align: center; margin-bottom: 25px; }
    .upload-area input { color: #fff; font-size: 16px; }
    .upload-note { color: #aaa; margin-top: 15px; }
    .post-submit { width: 100%; padding: 14px; background: #ff0050; color: #fff; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="video-container">
      <div class="video-placeholder">
        <h2>World Market</h2>
        <p>Scroll to explore videos</p>
      </div>
    </div>

    <div class="video-info">
      <div class="author-name">World Market <span>✓</span></div>
      <div class="desc">Welcome to World Market — Global buying & selling platform</div>
      <div class="music-line"><span class="music-dot"></span>Original Sound — World Market</div>
    </div>

    <div class="side-actions">
      <div class="action-item">
        <div class="profile-icon">👤</div>
        <div class="follow-btn">+</div>
      </div>
      <div class="action-item" id="likeBtn">
        <div class="action-icon">❤️</div>
        <div class="action-count" id="likeCount">1.2K</div>
      </div>
      <div class="action-item" id="commentBtn">
        <div class="action-icon">💬</div>
        <div class="action-count">345</div>
      </div>
      <div class="action-item" id="saveBtn">
        <div class="action-icon">🔖</div>
        <div class="action-count">210</div>
      </div>
      <div class="action-item" id="shareBtn">
        <div class="action-icon">↗️</div>
        <div class="action-count">Share</div>
      </div>
    </div>

    <div class="post-btn" onclick="openUploadModal()">
      <svg viewBox="0 0 24 24" fill="white"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active">
        <div class="nav-icon">🏠</div>
        <div class="nav-label">Home</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">🔍</div>
        <div class="nav-label">Discover</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">🛒</div>
        <div class="nav-label">Shop</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">💬</div>
        <div class="nav-label">Inbox</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">👤</div>
        <div class="nav-label">Profile</div>
      </div>
    </div>

    <div class="upload-modal" id="uploadModal">
      <div class="modal-header">
        <h3 class="modal-title">Upload Video</h3>
        <button class="close-btn" onclick="closeUploadModal()">✕</button>
      </div>
      <div class="upload-area">
        <input type="file" id="videoInput" accept="video/*">
        <p class="upload-note">Supports MP4, MOV, WebM</p>
      </div>
      <button class="post-submit" onclick="uploadVideo()">Post Video</button>
    </div>
  </div>

  <script>
    let liked = false;
    let likeCount = 1200;
    document.getElementById('likeBtn').addEventListener('click', () => {
      liked = !liked;
      likeCount += liked ? 1 : -1;
      document.getElementById('likeBtn').style.color = liked ? '#ff0050' : '#fff';
      document.getElementById('likeCount').textContent = likeCount > 1000 ? (likeCount/1000).toFixed(1)+'K' : likeCount;
    });

    document.getElementById('commentBtn').addEventListener('click', () => {
      alert('Comments feature coming soon!');
    });

    let saved = false;
    document.getElementById('saveBtn').addEventListener('click', () => {
      saved = !saved;
      document.getElementById('saveBtn').style.color = saved ? '#ffd700' : '#fff';
      alert(saved ? 'Saved to favorites!' : 'Removed from favorites');
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: 'World Market v2026',
          text: 'Check out World Market — Global Marketplace!',
          url: window.location.href
        });
      } else {
        alert('Link copied! Share with your friends!');
      }
    });

    function openUploadModal() {
      document.getElementById('uploadModal').style.display = 'block';
      document.body.style.overflow = 'hidden';
    }
    function closeUploadModal() {
      document.getElementById('uploadModal').style.display = 'none';
      document.body.style.overflow = 'auto';
    }
    function uploadVideo() {
      const fileInput = document.getElementById('videoInput');
      if (!fileInput.files.length) {
        alert('Please select a video file first');
        return;
      }
      const file = fileInput.files[0];
      alert(`Uploading: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)\n\nUpload successful!`);
      closeUploadModal();
    }
  </script>
</body>
</html>
