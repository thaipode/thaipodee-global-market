<title>ThaiPodee</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:-apple-system,sans-serif; }

  /* ===== หน้าเริ่มต้น — แป๊บเดียวแล้วหายเอง ===== */
  .splash {
    position:absolute; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity 0.5s ease;
  }
  .splash.fade-out { opacity:0; pointer-events:none; }
  .splash-icon {
    width:120px; height:120px; border-radius:50%; background:#e60000;
    display:flex; align-items:center; justify-content:center; font-size:60px; font-weight:bold; margin-bottom:16px;
  }
  .splash-name { font-size:24px; font-weight:bold; }
  .splash-desc { font-size:13px; opacity:0.6; margin-top:4px; }

  .version-tag { position:absolute; top:12px; right:12px; font-size:12px; color:#888; z-index:100; }

  /* ===== หน้าหลัก ===== */
  .main-screen {
    position:absolute; top:0; left:0; width:100%; height:100%;
    opacity:0; pointer-events:none; transition:opacity 0.5s ease;
  }
  .main-screen.show { opacity:1; pointer-events:auto; }

  .top-tabs { position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:24px; z-index:99; }
  .tab-item { font-size:15px; color:#888; padding-bottom:4px; border-bottom:2px solid transparent; cursor:pointer; }
  .tab-item.active { color:#fff; border-bottom-color:#fff; font-weight:600; }
  .search-icon { position:absolute; top:12px; right:45px; font-size:20px; z-index:99; }

  #videoWrapper { width:100%; height:100%; position:relative; z-index:1; touch-action:pan-y; }
  .empty-hint {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; color:#777; font-size:15px; z-index:5; pointer-events:none;
  }
  .video-slide {
    width:100%; height:100vh; display:flex; align-items:center; justify-content:center;
    background:#000; position:relative;
  }
  video {
    position:absolute; top:0; left:0; width:100%; height:100%; background:#000; z-index:2; display:block;
  }
  video.is-portrait { object-fit:cover; }
  video.is-landscape { object-fit:contain; }

  /* ปุ่มหยุด-เล่นตรงกลาง */
  .center-btn {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:100px; height:100px; border-radius:50%; background:rgba(0,0,0,0.5);
    color:#fff; font-size:42px; border:none; cursor:pointer; z-index:10;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease;
  }
  .center-btn.visible { opacity:1; pointer-events:auto; }

  /* ข้อมูลวิดีโอ */
  .video-info { position:absolute; bottom:55px; left:12px; right:70px; z-index:5; pointer-events:none; display:none; }
  .info-username { font-weight:600; font-size:14px; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .info-title { font-size:13px; margin-bottom:4px; color:#f0f0f0; }
  .info-tags { font-size:12px; color:#ccc; }

  /* ไอคอนด้านขวา — 6 ตัว ครบ */
  .side-icons {
    position:absolute; right:12px; bottom:100px; display:flex; flex-direction:column; gap:20px;
    z-index:6; align-items:center; display:none;
  }
  .icon-wrap { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .icon-btn {
    width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.1);
    border:none; color:#fff; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-count { font-size:11px; }
  .icon-btn.liked { color:#ff2d55; }

  /* แถบล่าง — 5 ปุ่ม ครบ */
  .bottom-nav {
    position:absolute; bottom:0; left:0; right:0; height:65px; background:rgba(0,0,0,0.8);
    display:flex; justify-content:space-around; align-items:center; z-index:20;
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  .nav-btn {
    background:none; border:none; color:#fff; font-size:22px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .nav-label { font-size:10px; }
  .nav-main {
    width:52px; height:38px; border-radius:6px; background:#e60000; border:none;
    font-size:26px; color:#fff; cursor:pointer;
  }

  #fileInput { display:none; }

  /* ===== หน้าโปรไฟล์ ===== */
  .profile-screen {
    position:absolute; top:0; left:0; width:100%; height:100%; background:#000;
    z-index:150; overflow-y:auto; transform:translateX(100%); transition:transform 0.3s ease;
  }
  .profile-screen.show { transform:translateX(0); }
  .back-btn { position:absolute; top:12px; left:12px; background:none; border:none; color:#fff; font-size:24px; cursor:pointer; }
  .p-avatar {
    width:90px; height:90px; border-radius:50%; background:#333; margin:50px auto 10px;
    display:flex; align-items:center; justify-content:center; font-size:40px;
  }
  .p-name { text-align:center; font-size:18px; font-weight:bold; }
  .p-stats { display:flex; justify-content:center; gap:30px; margin:16px 0; }
  .stat { text-align:center; }
  .stat-num { font-size:18px; font-weight:bold; }
  .stat-label { font-size:11px; color:#888; }
  .p-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px; }
  .p-grid-item { aspect-ratio:9/16; background:#222; cursor:pointer; overflow:hidden; position:relative; }
  .p-grid-item video { width:100%; height:100%; object-fit:cover; }
  .p-grid-likes { position:absolute; bottom:4px; left:4px; font-size:11px; background:rgba(0,0,0,0.5); padding:2px 6px; border-radius:10px; }
</style>
</head>
<body>

<input type="file" id="fileInput" accept="video/*">

<!-- ===== หน้าเริ่มต้น ===== -->
<div class="splash" id="splash">
  <div class="splash-icon">T</div>
  <div class="splash-name">ThaiPodee</div>
  <div class="splash-desc">Global Market — ตลาดโลก</div>
</div>

<!-- ===== หน้าหลัก ===== -->
<div class="main-screen" id="mainScreen">
  <div class="version-tag">v1121-4</div>

  <div class="top-tabs">
    <span class="tab-item">กำลังติดตาม</span>
    <span class="tab-item active">สำหรับคุณ</span>
  </div>
  <span class="search-icon">🔍</span>

  <div id="videoWrapper">
    <div class="empty-hint" id="emptyHint">กด + ด้านล่าง<br>เพื่ออัปโหลดวิดีโอ</div>
  </div>

  <button class="center-btn" id="centerBtn"></button>

  <div class="video-info" id="videoInfo">
    <div class="info-username">@thaipodee</div>
    <div class="info-title" id="vidTitle"></div>
    <div class="info-tags" id="vidTags"></div>
  </div>

  <div class="side-icons" id="sideIcons">
    <div class="icon-wrap"><button class="icon-btn" id="profIcon">👤</button></div>
    <div class="icon-wrap"><button class="icon-btn" id="likeBtn">❤️</button><span class="icon-count" id="likeCount">0</span></div>
    <div class="icon-wrap"><button class="icon-btn">💬</button><span class="icon-count">0</span></div>
    <div class="icon-wrap"><button class="icon-btn">📌</button><span class="icon-count">0</span></div>
    <div class="icon-wrap"><button class="icon-btn">↗️</button><span class="icon-count">0</span></div>
    <div class="icon-wrap"><button class="icon-btn">🎵</button></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn">🏠<br><span class="nav-label">หน้าหลัก</span></button>
    <button class="nav-btn">🛒<br><span class="nav-label">ร้านค้า</span></button>
    <button class="nav-main" id="upBtn">+</button>
    <button class="nav-btn">💬<br><span class="nav-label">ข้อความ</span></button>
    <button class="nav-btn" id="profileOpenBtn">👤<br><span class="nav-label">โปรไฟล์</span></button>
  </nav>
</div>

<!-- ===== หน้าโปรไฟล์ ===== -->
<div class="profile-screen" id="profileScreen">
  <button class="back-btn" id="backBtn">←</button>
  <div class="p-avatar">T</div>
  <h2 class="p-name">ThaiPodee</h2>
  <div class="p-stats">
    <div class="stat"><div class="stat-num" id="statVid">0</div><div class="stat-label">วิดีโอ</div></div>
    <div class="stat"><div class="stat-num">1,237</div><div class="stat-label">ผู้ติดตาม</div></div>
    <div class="stat"><div class="stat-num" id="statLike">0</div><div class="stat-label">ถูกใจ</div></div>
  </div>
  <div class="p-grid" id="pGrid"></div>
</div>

<script>
let videoList = [];
let currentIndex = 0;
let activeVideo = null;
let startY = 0;
let isBusy = false;

// ===== เปลี่ยนหน้าเองอัตโนมัติ =====
setTimeout(() => {
  document.getElementById('splash').classList.add('fade-out');
  setTimeout(() => {
    document.getElementById('mainScreen').classList.add('show');
  }, 500);
}, 1500);

// ===== ติดตั้งแอป =====
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

// ===== จัดการสถิติ =====
function updateStats() {
  document.getElementById('statVid').textContent = videoList.length;
  document.getElementById('statLike').textContent = videoList.reduce((s,v)=>s+v.likes,0);
}
function renderGrid() {
  const g = document.getElementById('pGrid');
  g.innerHTML = '';
  videoList.forEach((v,i)=>{
    const d = document.createElement('div');
    d.className='p-grid-item';
    d.innerHTML = `<video src="${v.url}" muted preload="metadata"></video><span class="p-grid-likes">❤️ ${v.likes}</span>`;
    d.onclick=()=>{ currentIndex=i; showMain(); };
    g.appendChild(d);
  });
  updateStats();
}

function showProfile() { renderGrid(); document.getElementById('profileScreen').classList.add('show'); }
function showMain() { document.getElementById('profileScreen').classList.remove('show'); }

function fmtTime(s) {
  if(isNaN(s)) return '0:00';
  const m=Math.floor(s/60), ss=Math.floor(s%60);
  return `${m}:${ss.toString().padStart(2,'0')}`;
}

function updateCenterBtn() {
  if(!activeVideo) return;
  document.getElementById('centerBtn').classList.toggle('visible', activeVideo.paused);
  document.getElementById('centerBtn').textContent = activeVideo.paused ? '▶' : '';
}

function togglePlay() {
  if(!activeVideo || isBusy) return;
  isBusy=true;
  if(activeVideo.paused) { activeVideo.play(); }
  else { activeVideo.pause(); }
  setTimeout(()=>isBusy=false,300);
}

function updateLikeUI() {
  const v=videoList[currentIndex];
  if(!v) return;
  document.getElementById('likeCount').textContent = v.likes;
  document.getElementById('likeBtn').classList.toggle('liked', v.liked);
  updateStats();
}

function toggleLike() {
  const v=videoList[currentIndex];
  if(!v) return;
  v.liked=!v.liked;
  v.likes += v.liked?1:-1;
  updateLikeUI();
  renderGrid();
}

function goToSlide(idx) {
  if(!videoList.length) return;
  if(idx<0) idx=0;
  if(idx>=videoList.length) idx=videoList.length-1;
  currentIndex=idx;
  document.getElementById('videoWrapper').style.transform = `translateY(-${currentIndex*100}vh)`;
  updateActiveVideo();
}

function updateActiveVideo() {
  document.getElementById('emptyHint').style.display='none';
  document.querySelectorAll('.video-slide video').forEach((v,i)=>{
    if(i===currentIndex) {
      v.muted=false; v.play(); activeVideo=v;
      document.getElementById('videoInfo').style.display='block';
      document.getElementById('sideIcons').style.display='flex';
      const d=videoList[currentIndex];
      document.getElementById('vidTitle').textContent=d.title||'';
      document.getElementById('vidTags').textContent=d.tags||'';
      updateLikeUI();
    } else { v.pause(); v.currentTime=0; }
  });
  updateCenterBtn();
}

function addVideo(file, url) {
  document.getElementById('emptyHint').style.display='none';
  const idx=videoList.length;
  videoList.push({
    url,
    title: file.name.replace(/\.[^/.]+$/,''),
    tags: '#ThaiPodee #วิดีโอ',
    likes:0, liked:false
  });
  const slide=document.createElement('div');
  slide.className='video-slide';
  slide.innerHTML=`<video src="${url}" loop playsinline preload="auto"></video>`;
  document.getElementById('videoWrapper').appendChild(slide);
  const v=slide.querySelector('video');
  v.addEventListener('loadedmetadata', ()=>{
    v.classList.add(v.videoHeight>v.videoWidth?'is-portrait':'is-landscape');
  });
  v.addEventListener('pause', updateCenterBtn);
  v.addEventListener('play', updateCenterBtn);
  renderGrid();
  if(idx===0) updateActiveVideo();
}

// ===== เหตุการณ์สัมผัส =====
let startYPos=0, dragging=false;
document.getElementById('videoWrapper').addEventListener('touchstart',e=>{
  startYPos=e.touches[0].clientY; dragging=false;
},{passive:true});

document.getElementById('videoWrapper').addEventListener('touchmove',e=>{
  const dy=e.touches[0].clientY-startYPos;
  if(Math.abs(dy)>8) {
    dragging=true;
    document.getElementById('videoWrapper').style.transform = `translateY(calc(-${currentIndex*100}vh + ${dy}px))`;
  }
},{passive:true});

document.getElementById('videoWrapper').addEventListener('touchend',e=>{
  if(!videoList.length) return;
  const dy=e.changedTouches[0].clientY-startYPos;
  if(!dragging && Math.abs(dy)<8) { togglePlay(); return; }
  if(dy<-50 && currentIndex<videoList.length-1) goToSlide(currentIndex+1);
  else if(dy>50 && currentIndex>0) goToSlide(currentIndex-1);
  else document.getElementById('videoWrapper').style.transform = `translateY(-${currentIndex*100}vh)`;
},{passive:false});

document.getElementById('centerBtn').addEventListener('click',e=>{e.stopPropagation(); if(activeVideo?.paused) activeVideo.play();});
document.getElementById('likeBtn').addEventListener('click',toggleLike);
document.getElementById('profIcon').addEventListener('click',showProfile);
document.getElementById('profileOpenBtn').addEventListener('click',showProfile);
document.getElementById('backBtn').addEventListener('click',showMain);

document.getElementById('upBtn').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const url=URL.createObjectURL(f);
  addVideo(f,url);
});
</script>
</body>
</html>
