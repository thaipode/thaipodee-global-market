<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThaiPodee Market</title>
    
    <!-- Cloudinary -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cloudinary-core/4.1.0/cloudinary-core-shrinkwrap.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        html, body { 
            height: 100vh; height: 100dvh; 
            width: 100vw; 
            overflow: hidden; 
            background: #000; 
            color: #fff;
        }

        .page { display: none; position: absolute; inset: 0; width: 100vw; height: 100dvh; overflow: hidden; }
        .page.active { display: block; }

        /* ฟีดหลัก */
        .feed-container { position: absolute; inset: 0; overflow: hidden; }
        .feed-slider { transition: transform 0.4s ease-out; height: 100%; }
        .post-slide { 
            position: relative; 
            width: 100vw; 
            height: 100dvh; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        /* พื้นที่แสดงวิดีโอ/รูป — เต็มจอ ไม่ล้น */
        .media-area { 
            position: relative; 
            width: 100vw; 
            height: 100dvh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #000;
        }
        .media-area img, .media-area video { 
            max-width: 100vw; 
            max-height: 100dvh; 
            width: auto; 
            height: auto; 
            object-fit: contain; 
            background: #000;
        }
        .bg-audio { position: absolute; opacity: 0; pointer-events: none; }

        /* ข้อความเมื่อยังไม่มีโพสต์ */
        .empty-state { 
            text-align: center; 
            padding-top: 50vh; 
            color: #888; 
            line-height: 2; 
            font-size: 16px;
        }

        /* ข้อมูลด้านซ้ายล่าง */
        .info-left { 
            position: absolute; 
            left: 16px; 
            bottom: 90px; 
            right: 90px; 
            z-index: 10;
        }
        .acc-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .desc-text { font-size: 13px; color: #ddd; margin-bottom: 4px; }
        .music-row { font-size: 12px; color: #bbb; margin-top: 6px; display: flex; align-items: center; gap: 4px; }

        /* เมนูด้านขวา */
        .menu-right { 
            position: absolute; 
            right: 12px; 
            top: 50%; 
            transform: translateY(-50%); 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
            align-items: center; 
            z-index: 20;
        }
        .menu-btn { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 2px; 
            cursor: pointer;
        }
        .avatar { 
            width: 48px; 
            height: 48px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #f5a623, #f76b1c); 
            margin-bottom: 4px;
            border: 2px solid #fff;
        }
        .icon { font-size: 28px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
        .num { font-size: 11px; margin-top: 2px; }

        /* หน้าโปรไฟล์ */
        .profile-page { background: #000; overflow-y: auto; padding-bottom: 80px; }
        .profile-header { padding: 40px 20px 20px; text-align: center; }
        .profile-avatar { 
            width: 90px; height: 90px; border-radius: 50%; 
            background: linear-gradient(135deg, #f5a623, #f76b1c); 
            margin: 0 auto 12px; border: 3px solid #fff;
        }
        .profile-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .profile-username { color: #888; font-size: 14px; margin-bottom: 20px; }
        .profile-stats { display: flex; justify-content: center; gap: 40px; margin-bottom: 20px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 20px; font-weight: 700; }
        .stat-label { font-size: 11px; color: #888; margin-top: 2px; }
        .posts-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 2px; 
            padding: 0 2px;
        }
        .grid-item { 
            aspect-ratio: 1; 
            overflow: hidden; 
            background: #1a1a1a; 
            cursor: pointer;
        }
        .grid-item img, .grid-item video { 
            width: 100%; height: 100%; object-fit: cover;
        }
        .empty-grid { 
            grid-column: 1 / -1; 
            text-align: center; 
            padding: 60px 20px; 
            color: #666; 
            line-height: 1.8;
        }

        /* หน้าเลือกเสียง */
        .sound-page { background: #000; padding: 16px; min-height: 100dvh; }
        .sound-header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 30px;
            padding-top: 10px;
        }
        .back-btn { font-size: 22px; cursor: pointer; padding: 8px; }
        .sound-title { font-size: 18px; font-weight: 600; }
        .section-title { 
            font-size: 15px; font-weight: 600; 
            margin: 20px 0 12px; color: #aaa;
        }
        .local-area { 
            background: #1a1a2e; 
            border-radius: 12px; 
            padding: 18px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            cursor: pointer; 
            margin-bottom: 16px;
        }
        .hidden-input { display: none; }
        .audio-name { font-size: 13px; color: #888; margin-top: 4px; }
        .post-btn { 
            background: #ff2442; 
            color: #fff; 
            border: none; 
            padding: 16px; 
            border-radius: 25px; 
            font-size: 16px; 
            width: 100%; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 20px;
            transition: opacity 0.2s;
        }
        .post-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { 
            margin-top: 12px; 
            font-size: 13px; 
            color: #4ade80; 
            text-align: center; 
            min-height: 24px;
        }

        /* เมนูล่างสุด */
        .nav-bottom { 
            position: absolute; 
            bottom: 0; left: 0; right: 0; 
            height: 65px; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding: 8px 12px 16px; 
            background: #000; 
            border-top: 1px solid #222; 
            z-index: 999;
        }
        .nav-col { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 2px; 
            min-width: 60px; 
            cursor: pointer;
        }
        .nav-col.active .nav-label { color: #fff; font-weight: 600; }
        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 10px; color: #888; }

        /* ปุ่ม + กลางล่าง */
        .upload-box { 
            width: 48px; height: 32px; 
            background: #fff; border-radius: 6px; 
            position: relative; cursor: pointer;
        }
        .upload-box::before, .upload-box::after { 
            content: ''; position: absolute; background: #000;
        }
        .upload-box::before { 
            width: 20px; height: 2px; 
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .upload-box::after { 
            width: 2px; height: 20px; 
            left: 50%; top: 50%; transform: translate(-50%, -50%);
        }
        .file-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    </style>
</head>
<body>

<!-- หน้าแรก: ฟีดวิดีโอ -->
<div id="page-feed" class="page active">
    <div class="feed-container">
        <div class="feed-slider" id="feed-slider">
            <div class="empty-state">
                ☁️ กดปุ่ม + ด้านล่างเพื่อโพสต์<br>
                ทุกคนเห็นจากทุกเครื่อง — ไม่เก็บที่เครื่อง
            </div>
        </div>
    </div>
</div>

<!-- หน้าโปรไฟล์ -->
<div id="page-profile" class="page profile-page">
    <div class="profile-header">
        <div class="profile-avatar"></div>
        <h1 class="profile-name">ThaiPodee Market</h1>
        <p class="profile-username">@thaipodee_market</p>
        <div class="profile-stats">
            <div class="stat-item"><div class="stat-num" id="stat-posts">0</div><div class="stat-label">โพสต์</div></div>
            <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">ผู้ติดตาม</div></div>
            <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">ถูกใจ</div></div>
        </div>
    </div>
    <div class="posts-grid" id="posts-grid">
        <div class="empty-grid">ยังไม่มีโพสต์<br>กด + ด้านล่างเพื่อโพสต์แรก</div>
    </div>
</div>

<!-- หน้าเลือกเสียง -->
<div id="page-sound" class="page sound-page">
    <div class="sound-header">
        <span class="back-btn" id="back-btn">← กลับ</span>
        <span class="sound-title">เพิ่มเสียงเพลง</span>
        <span></span>
    </div>
    <div class="section-title">🎵 จากไฟล์ในเครื่อง</div>
    <label class="local-area">
        <span style="font-size:24px">🎵</span>
        <div>
            <div>แตะเลือกไฟล์เสียง/เพลง</div>
            <div class="audio-name" id="audio-name">ยังไม่ได้เลือก</div>
        </div>
        <input type="file" accept="audio/*" id="audio-input" class="hidden-input">
    </label>
    <div class="status" id="status">พร้อมโพสต์</div>
    <button class="post-btn" id="post-btn">☁️ โพสต์ขึ้นคลาวด์เลย</button>
</div>

<!-- เมนูล่างสุด -->
<div class="nav-bottom">
    <div class="nav-col active" data-page="page-feed">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าแรก</span>
    </div>
    <div class="nav-col" data-page="">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">ค้นหา</span>
    </div>
    <div class="nav-col" id="upload-trigger">
        <div class="upload-box">
            <input type="file" accept="video/*,image/*" id="media-input" class="file-input">
        </div>
    </div>
    <div class="nav-col" data-page="">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
    </div>
    <div class="nav-col" data-page="page-profile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<script>
// =====================================================
// ☁️ Cloudinary — orpjnytt
// =====================================================
const cld = cloudinary.Cloudinary.new({ cloud_name: 'orpjnytt' });

// 🔥 Firebase — thaipodee-market
const firebaseConfig = {
  apiKey: "AIzaSyCt-wPPDeopLnjCv4QQvdYLQu2G_VxWYE",
  authDomain: "thaipodee-market.firebaseapp.com",
  projectId: "thaipodee-market",
  storageBucket: "thaipodee-market.firebasestorage.app",
  messagingSenderId: "802626775100",
  appId: "1:802626775100:web:c126e82059d124d19c39"
};

// เริ่มต้น Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const POSTS_COLLECTION = 'posts';

let posts = [];
let currentSlide = 0;
let pendingMedia = null;
let pendingAudio = null;
let isLoading = false;

// แสดงหน้า
function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-col').forEach(n => n.classList.remove('active'));
    if (pageId) {
        document.getElementById(pageId).classList.add('active');
        const activeNav = document.querySelector(`[data-page="${pageId}"]`);
        if (activeNav) activeNav.classList.add('active');
    }
}

// โหลดโพสต์จาก Firebase
async function loadPostsFromFirebase() {
    try {
        const snapshot = await db.collection(POSTS_COLLECTION)
            .orderBy('createdAt', 'desc')
            .get();
        
        posts = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
        }));
        
        renderFeed();
        renderProfile();
    } catch (err) {
        console.error('โหลดไม่ได้:', err);
        document.getElementById('feed-slider').innerHTML = `
            <div class="empty-state">
                ⚠️ กำลังตั้งค่าฐานข้อมูล...<br>
                รอสักครู่แล้วรีเฟรชหน้าใหม่
            </div>`;
    }
}

// อัปโหลดไฟล์ไป Cloudinary
async function uploadToCloudinary(file, resourceType) {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', 'ml_default');
    form.append('resource_type', resourceType);
    
    const res = await fetch(
        `https://api.cloudinary.com/v1_1/orpjnytt/${resourceType}/upload`,
        { method: 'POST', body: form }
    );
    
    if (!res.ok) throw new Error('อัปโหลดไม่สำเร็จ');
    return await res.json();
}

// บันทึกโพสต์ลง Firebase
async function savePostToFirebase(postData) {
    await db.collection(POSTS_COLLECTION).add({
        ...postData,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
}

// แสดงฟีด
function renderFeed() {
    const slider = document.getElementById('feed-slider');
    
    if (posts.length === 0) {
        slider.innerHTML = `
            <div class="empty-state">
                ☁️ กดปุ่ม + ด้านล่างเพื่อโพสต์วิดีโอ/รูป<br>
                ทุกคนเห็นจากทุกเครื่อง — ไม่เก็บที่เครื่องเลย
            </div>`;
        return;
    }
    
    slider.innerHTML = posts.map((p, i) => `
        <div class="post-slide" data-index="${i}" style="transform: translateY(${i * 100}dvh)">
            <div class="media-area">
                ${p.type === 'video'
                    ? `<video id="vid-${i}" loop playsinline muted controls style="max-width:100%; max-height:100%;">
                         <source src="${p.url}" type="video/mp4">
                       </video>`
                    : `<img src="${p.url}" alt="โพสต์" loading="lazy">`
                }
                ${p.audioUrl ? `<audio id="aud-${i}" loop src="${p.audioUrl}">` : ''}
            </div>
            <div class="info-left">
                <div class="acc-name">ThaiPodee Market</div>
                <div class="desc-text">โพสต์จากคลาวด์ — ทุกคนเห็นพร้อมกัน</div>
                ${p.audioName ? `<div class="music-row">🎵 ${p.audioName}</div>` : ''}
            </div>
            <div class="menu-right">
                <div class="menu-btn"><span class="avatar"></span></div>
                <div class="menu-btn"><span class="icon">❤️</span><span class="num">0</span></div>
                <div class="menu-btn"><span class="icon">💬</span><span class="num">0</span></div>
                <div class="menu-btn"><span class="icon">⭐</span><span class="num">0</span></div>
                <div class="menu-btn"><span class="icon">↗️</span><span class="num">0</span></div>
            </div>
        </div>`
    ).join('');
    
    goToSlide(0);
}

// เลื่อนไปสไลด์ที่ n
function goToSlide(index) {
    if (index < 0 || index >= posts.length) return;
    currentSlide = index;
    document.getElementById('feed-slider').style.transform = `translateY(-${index * 100}dvh)`;
    
    // หยุดทุกตัว แล้วเล่นตัวปัจจุบัน
    posts.forEach((_, i) => {
        const v = document.getElementById(`vid-${i}`);
        const a = document.getElementById(`aud-${i}`);
        if (v) {
            if (i === index) v.play().catch(() => {});
            else v.pause();
        }
        if (a) {
            if (i === index) a.play().catch(() => {});
            else a.pause();
        }
    });
}

// แสดงโปรไฟล์
function renderProfile() {
    const grid = document.getElementById('posts-grid');
    document.getElementById('stat-posts').textContent = posts.length;
    
    if (posts.length === 0) {
        grid.innerHTML = `<div class="empty-grid">ยังไม่มีโพสต์<br>กด + ด้านล่างเพื่อโพสต์แรก</div>`;
        return;
    }
    
    grid.innerHTML = posts.map((p, i) => `
        <div class="grid-item" data-idx="${i}">
            ${p.type === 'video'
                ? `<video src="${p.url}" muted preload="metadata"></video>`
                : `<img src="${p.url}" alt="" loading="lazy">`
            }
        </div>`
    ).join('');
    
    grid.querySelectorAll('.grid-item').forEach(item => {
        item.onclick = () => {
            goToSlide(parseInt(item.dataset.idx));
            showPage('page-feed');
        };
    });
}

// --- เหตุการณ์ ---

// เปลี่ยนหน้า
document.querySelectorAll('[data-page]').forEach(b => {
    b.onclick = () => showPage(b.dataset.page || 'page-feed');
});

// เลือกไฟล์วิดีโอ/รูป
document.getElementById('media-input').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    pendingMedia = file;
    showPage('page-sound');
};

// เลือกไฟล์เสียง
document.getElementById('audio-input').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    pendingAudio = file;
    document.getElementById('audio-name').textContent = file.name;
};

// กลับ
document.getElementById('back-btn').onclick = () => {
    pendingMedia = pendingAudio = null;
    document.getElementById('media-input').value = '';
    document.getElementById('audio-input').value = '';
    document.getElementById('audio-name').textContent = 'ยังไม่ได้เลือก';
    showPage('page-feed');
};

// โพสต์
document.getElementById('post-btn').onclick = async () => {
    if (!pendingMedia) {
        alert('กดปุ่ม + เลือกไฟล์ก่อนครับ');
        return;
    }
    if (isLoading) return;
    
    isLoading = true;
    const btn = document.getElementById('post-btn');
    const status = document.getElementById('status');
    
    btn.disabled = true;
    status.textContent = '☁️ กำลังอัปโหลด...';
    
    try {
        const type = pendingMedia.type.startsWith('video') ? 'video' : 'image';
        
        // อัปโหลดไฟล์หลัก
        status.textContent = '☁️ อัปโหลดไฟล์หลัก...';
        const mediaRes = await uploadToCloudinary(pendingMedia, type);
        if (!mediaRes.secure_url) throw new Error('ไม่ได้ที่อยู่ไฟล์');
        
        // อัปโหลดเสียง (ถ้ามี)
        let audioUrl = null, audioName = null;
        if (pendingAudio) {
            status.textContent = '☁️ อัปโหลดไฟล์เสียง...';
            const audioRes = await uploadToCloudinary(pendingAudio, 'raw');
            audioUrl = audioRes.secure_url;
            audioName = pendingAudio.name;
        }
        
        // บันทึกลง Firebase
        status.textContent = '☁️ บันทึกข้อมูล...';
        await savePostToFirebase({
            type,
            url: mediaRes.secure_url,
            audioUrl,
            audioName,
            uploadedAt: new Date()
        });
        
        // โหลดรายการใหม่
        status.textContent = '✅ สำเร็จ! ทุกคนเห็นแล้ว';
        await loadPostsFromFirebase();
        
        // เคลียร์
        pendingMedia = pendingAudio = null;
        document.getElementById('media-input').value = '';
        document.getElementById('audio-input').value = '';
        document.getElementById('audio-name').textContent = 'ยังไม่ได้เลือก';
        
        setTimeout(() => {
            showPage('page-feed');
            status.textContent = 'พร้อมโพสต์';
            btn.disabled = false;
            isLoading = false;
        }, 1500);
        
    } catch (err) {
        console.error('ผิดพลาด:', err);
        status.textContent = '⚠️ ผิดพลาด: ' + err.message;
        btn.disabled = false;
        isLoading = false;
    }
};

// เลื่อนฟีดด้วยนิ้ว
let touchStartY = 0;
document.addEventListener('touchstart', e => {
    if (!e.target.closest('.post-slide')) return;
    touchStartY = e.touches[0].clientY;
});
document.addEventListener('touchend', e => {
    if (!touchStartY) return;
    const touchEndY = e.changedTouches[0].clientY;
    const diff = touchStartY - touchEndY;
    
    if (Math.abs(diff) > 60) {
        if (diff > 0) goToSlide(currentSlide + 1); // เลื่อนขึ้น = ถัดไป
        else goToSlide(currentSlide - 1); // เลื่อนลง = ก่อนหน้า
    }
    touchStartY = 0;
});

// เริ่มทำงาน
window.onload = () => {
    loadPostsFromFirebase();
};
</script>
</body>
</html>
