<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thaipodee Global Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
    .page { position: absolute; inset: 0; z-index: 10; overflow-y: auto; }
    .page.hidden { display: none; }
    .video-container { position: absolute; inset: 0; z-index: 1; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .ui-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
    .ui-layer > * { pointer-events: auto; }
    .right-panel { position: absolute; right: 12px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
    .icon-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .icon-btn i { font-size: 24px; }
    .icon-btn span { font-size: 11px; }
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 65px; background: rgba(0,0,0,0.7); display: flex; justify-content: space-around; align-items: center; padding: 8px 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .nav-item i { font-size: 22px; }
    .nav-item span { font-size: 10px; margin-top: 2px; }
    .upload-btn { width: 45px; height: 35px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 20px; }
    .top-info { position: absolute; top: 40px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
    .user-info { max-width: 70%; }
    .username { font-weight: bold; font-size: 15px; }
    .desc { font-size: 12px; margin-top: 4px; opacity: 0.9; line-height: 1.4; }
    .sound-tag { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 12px; color: #eee; }
    .page-header { padding: 16px; display: flex; align-items: center; border-bottom: 1px solid #333; }
    .back-btn { font-size: 20px; cursor: pointer; margin-right: 12px; }
    .form-content { padding: 20px; }
    .form-label { font-size: 14px; color: #aaa; margin-bottom: 6px; display: block; }
    .form-input { width: 100%; background: #222; border: none; border-radius: 8px; padding: 12px; color: #fff; margin-bottom: 16px; font-size: 14px; }
    .submit-btn { width: 100%; background: #e91e63; border: none; border-radius: 8px; padding: 14px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 8px; }
    .preview-box { width: 100%; height: 200px; background: #111; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; overflow: hidden; }
    .preview-box img, .preview-box video { max-width: 100%; max-height: 100%; object-fit: contain; }
    .profile-header { padding: 24px 16px; text-align: center; border-bottom: 1px solid #333; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: #444; margin: 0 auto 12px; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .stats { display: flex; justify-content: space-around; margin-top: 16px; }
    .stat-item { text-align: center; }
    .stat-num { font-weight: bold; font-size: 18px; }
    .stat-label { font-size: 11px; color: #888; }
    .post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; }
    .post-item { aspect-ratio: 9/12; background: #222; border-radius: 4px; overflow: hidden; cursor: pointer; }
    .post-item img, .post-item video { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div id="homePage" class="page">
    <div class="video-container">
      <video id="mainVideo" loop playsinline muted></video>
    </div>
    <div class="ui-layer">
      <div class="top-info">
        <div class="user-info">
          <div class="username" id="displayUsername">Thaipodee Master</div>
          <div class="desc" id="displayDesc">ยินดีต้อนรับสู่ Thaipodee Global Market</div>
          <div class="sound-tag">
            <i class="fa fa-music"></i>
            <span id="displaySound">เสียงต้นฉบับ</span>
          </div>
        </div>
      </div>
      <div class="right-panel">
        <div class="icon-btn" id="likeBtn">
          <i class="fa fa-heart-o"></i>
          <span id="likeCount">0</span>
        </div>
        <div class="icon-btn" id="commentBtn">
          <i class="fa fa-comment-o"></i>
          <span>0</span>
        </div>
        <div class="icon-btn" id="saveBtn">
          <i class="fa fa-bookmark-o"></i>
          <span>บันทึก</span>
        </div>
        <div class="icon-btn" id="shareBtn">
          <i class="fa fa-share-alt"></i>
          <span>แชร์</span>
        </div>
        <div class="icon-btn" id="soundToggle">
          <i class="fa fa-volume-up"></i>
        </div>
      </div>
      <div class="bottom-nav">
        <div class="nav-item" data-target="home">
          <i class="fa fa-home"></i>
          <span>หน้าแรก</span>
        </div>
        <div class="nav-item" data-target="market">
          <i class="fa fa-shopping-basket"></i>
          <span>ตลาด</span>
        </div>
        <div class="nav-item" data-target="upload">
          <div class="upload-btn">+</div>
        </div>
        <div class="nav-item" data-target="messages">
          <i class="fa fa-envelope-o"></i>
          <span>ข้อความ</span>
        </div>
        <div class="nav-item" data-target="profile">
          <i class="fa fa-user-o"></i>
          <span>โปรไฟล์</span>
        </div>
      </div>
    </div>
  </div>

  <div id="uploadPage" class="page hidden" style="background:#000;z-index:30;">
    <div class="page-header">
      <i class="fa fa-arrow-left back-btn" data-back="home"></i>
      <h3>อัปโหลดวิดีโอ / รูปภาพ</h3>
    </div>
    <div class="form-content">
      <div class="preview-box" id="previewBox">
        <div style="text-align:center;color:#888;">
          <i class="fa fa-folder-open-o" style="font-size:32px;"></i>
          <p style="margin-top:8px;">แตะเพื่อเลือกไฟล์</p>
          <p style="font-size:12px;color:#666;">รองรับ .mp4, .jpg, .png</p>
        </div>
      </div>
      <input type="file" id="fileInput" accept="video/*,image/*" style="display:none;">
      
      <label class="form-label">คำอธิบาย</label>
      <input type="text" class="form-input" id="descInput" placeholder="เขียนคำอธิบาย...">
      
      <label class="form-label">ชื่อเพลง / เสียง</label>
      <input type="text" class="form-input" id="soundInput" placeholder="ชื่อเพลง/เสียง...">
      
      <button class="submit-btn" id="postBtn">เผยแพร่</button>
      <p id="uploadStatus" style="text-align:center;margin-top:12px;color:#888;font-size:13px;"></p>
    </div>
  </div>

  <div id="profilePage" class="page hidden" style="background:#000;z-index:30;">
    <div class="page-header">
      <i class="fa fa-arrow-left back-btn" data-back="home"></i>
      <h3>โปรไฟล์</h3>
    </div>
    <div class="profile-header">
      <div class="avatar">
        <img src="https://res.cloudinary.com/orjpnytt/image/upload/sample-avatar.png" id="avatarImg" alt="Avatar" onerror="this.src='https://picsum.photos/200/200'">
      </div>
      <h3 id="profileUsername">Thaipodee Master</h3>
      <div class="stats">
        <div class="stat-item">
          <div class="stat-num" id="postCount">0</div>
          <div class="stat-label">โพสต์</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">0</div>
          <div class="stat-label">ผู้ติดตาม</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">0</div>
          <div class="stat-label">กำลังติดตาม</div>
        </div>
      </div>
    </div>
    <div class="post-grid" id="userPostGrid"></div>
  </div>

  <script>
    const CLOUD_NAME = 'orjpnytt';
    const UPLOAD_PRESET = 'ml_default';
    const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;

    let posts = [];
    let selectedFile = null;
    let selectedPreviewUrl = null;
    let isMuted = true;

    const pages = {
      home: document.getElementById('homePage'),
      upload: document.getElementById('uploadPage'),
      profile: document.getElementById('profilePage')
    };
    const mainVideo = document.getElementById('mainVideo');
    const fileInput = document.getElementById('fileInput');
    const previewBox = document.getElementById('previewBox');
    const descInput = document.getElementById('descInput');
    const soundInput = document.getElementById('soundInput');
    const postBtn = document.getElementById('postBtn');
    const uploadStatus = document.getElementById('uploadStatus');

    function showPage(name) {
      Object.keys(pages).forEach(k => pages[k].classList.add('hidden'));
      pages[name].classList.remove('hidden');
    }

    document.querySelectorAll('[data-target]').forEach(el => {
      el.addEventListener('click', () => showPage(el.dataset.target));
    });
    document.querySelectorAll('[data-back]').forEach(el => {
      el.addEventListener('click', () => showPage(el.dataset.back));
    });

    previewBox.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      selectedFile = e.target.files[0];
      if (!selectedFile) return;
      
      if (selectedPreviewUrl) URL.revokeObjectURL(selectedPreviewUrl);
      selectedPreviewUrl = URL.createObjectURL(selectedFile);
      
      previewBox.innerHTML = '';
      if (selectedFile.type.startsWith('video/')) {
        const v = document.createElement('video');
        v.src = selectedPreviewUrl;
        v.controls = true;
        previewBox.appendChild(v);
      } else {
        const img = document.createElement('img');
        img.src = selectedPreviewUrl;
        previewBox.appendChild(img);
      }
    });

    async function uploadFile(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      
      const res = await fetch(CLOUDINARY_UPLOAD_URL, {
        method: 'POST',
        body: formData,
        mode: 'cors'
      });
      
      if (!res.ok) {
        const text = await res.text();
        console.error('Cloudinary Error:', res.status, text);
        throw new Error(`ผิดพลาด ${res.status}`);
      }
      return res.json();
    }

    postBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        alert('กรุณาเลือกไฟล์ก่อน');
        return;
      }
      
      postBtn.disabled = true;
      postBtn.textContent = 'กำลังอัปโหลด...';
      uploadStatus.textContent = 'กำลังส่งไปคลาวด์...';

      try {
        const data = await uploadFile(selectedFile);
        const post = {
          id: Date.now(),
          url: data.secure_url,
          type: data.resource_type,
          description: descInput.value || '',
          soundName: soundInput.value || 'เสียงต้นฉบับ',
          createdAt: new Date().toISOString()
        };
        
        posts.unshift(post);
        savePosts();
        loadFeed();
        
        uploadStatus.textContent = '✅ เผยแพร่สำเร็จ!';
        
        setTimeout(() => {
          descInput.value = '';
          soundInput.value = '';
          selectedFile = null;
          if (selectedPreviewUrl) URL.revokeObjectURL(selectedPreviewUrl);
          previewBox.innerHTML = `<div style="text-align:center;color:#888;"><i class="fa fa-folder-open-o" style="font-size:32px;"></i><p style="margin-top:8px;">แตะเพื่อเลือกไฟล์</p><p style="font-size:12px;color:#666;">รองรับ .mp4, .jpg, .png</p></div>`;
          uploadStatus.textContent = '';
          postBtn.disabled = false;
          postBtn.textContent = 'เผยแพร่';
          showPage('home');
        }, 1500);
        
      } catch (err) {
        console.error(err);
        uploadStatus.textContent = '❌ ' + err.message + ' — กรุณาตรวจสอบ Upload Preset ใน Cloudinary';
        postBtn.disabled = false;
        postBtn.textContent = 'เผยแพร่';
      }
    });

    function savePosts() {
      localStorage.setItem('thaipodee_posts', JSON.stringify(posts));
    }
    function loadPosts() {
      const saved = localStorage.getItem('thaipodee_posts');
      if (saved) posts = JSON.parse(saved);
    }

    function loadFeed() {
      if (posts.length === 0) {
        mainVideo.src = '';
        document.getElementById('displayDesc').textContent = 'ยังไม่มีโพสต์ — กด + เพื่อเผยแพร่อันแรก';
        document.getElementById('displaySound').textContent = 'เสียงต้นฉบับ';
        document.getElementById('postCount').textContent = '0';
        return;
      }
      
      const latest = posts[0];
      if (latest.type === 'video') {
        mainVideo.src = latest.url;
        mainVideo.muted = isMuted;
        mainVideo.play().catch(e => console.log('เล่นอัตโนมัติถูกปิด'));
      } else {
        mainVideo.src = '';
      }
      
      document.getElementById('displayDesc').textContent = latest.description || 'ไม่มีคำอธิบาย';
      document.getElementById('displaySound').textContent = latest.soundName || 'เสียงต้นฉบับ';
      document.getElementById('postCount').textContent = posts.length;
      
      const grid = document.getElementById('userPostGrid');
      grid.innerHTML = '';
      posts.forEach(p => {
        const div = document.createElement('div');
        div.className = 'post-item';
        div.innerHTML = p.type === 'video' 
          ? `<video src="${p.url}" muted preload="metadata"></video>`
          : `<img src="${p.url}" alt="">`;
        grid.appendChild(div);
      });
    }

    document.getElementById('soundToggle').addEventListener('click', () => {
      isMuted = !isMuted;
      mainVideo.muted = isMuted;
      document.querySelector('#soundToggle i').className = isMuted 
        ? 'fa fa-volume-off' 
        : 'fa fa-volume-up';
    });

    let liked = false, likes = 0;
    document.getElementById('likeBtn').addEventListener('click', () => {
      liked = !liked;
      likes += liked ? 1 : -1;
      document.querySelector('#likeBtn i').className = liked 
        ? 'fa fa-heart' 
        : 'fa fa-heart-o';
      document.getElementById('likeCount').textContent = likes;
    });

    loadPosts();
    loadFeed();
  </script>
</body>
</html>
