<script>
// ==============================================================
// ThaiPodee v1133 — FIX จอขาว + ตัวแปรไม่แสดง
// อัปเดต: 30 กันยายน 2569 20:50 น.
// ==============================================================

const fileInput = document.getElementById('file-input');
const uploadTrigger = document.getElementById('upload-trigger');

uploadTrigger.addEventListener('click', function(e) {
  e.preventDefault();
  e.stopPropagation();
  fileInput.click();
});

fileInput.addEventListener('change', async function(e) {
  try {
    const file = e.target.files[0];
    if (!file) return;

    if (!file.type.startsWith('video/')) {
      alert('กรุณาเลือกไฟล์วิดีโอเท่านั้น');
      fileInput.value = '';
      return;
    }

    const sizeMB = (file.size / 1024 / 1024).toFixed(2);
    showUploadUI(file.name, sizeMB);

  } catch (err) {
    console.error(err);
    alert('ผิดพลาด: ' + err.message);
    fileInput.value = '';
  }
});

function showUploadUI(name, size) {
  document.body.innerHTML = '\
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff;padding:20px;">\
      <h2 style="margin-bottom:20px;">กำลังเตรียมวิดีโอ...</h2>\
      <p style="margin-bottom:10px;">ชื่อไฟล์: ' + name + '</p>\
      <p style="margin-bottom:30px;">ขนาด: ' + size + ' MB</p>\
      <div style="width:80%;height:6px;background:#333;border-radius:3px;overflow:hidden;">\
        <div id="bar" style="width:0%;height:100%;background:#e50914;transition:width 0.3s;"></div>\
      </div>\
      <button onclick="location.reload()" style="margin-top:40px;padding:10px 25px;background:#333;color:#fff;border:none;border-radius:20px;">ยกเลิก</button>\
    </div>\
  ';

  let p = 0;
  const bar = document.getElementById('bar');
  const t = setInterval(() => {
    p += Math.random() * 15;
    if (p >= 100) {
      p = 100;
      clearInterval(t);
      finishUpload();
    }
    if (bar) bar.style.width = p + '%';
  }, 300);
}

function finishUpload() {
  document.body.innerHTML = '\
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#000;color:#fff;padding:20px;">\
      <h2 style="color:#4cd137;margin-bottom:20px;">✅ อัปโหลดสำเร็จ!</h2>\
      <p style="margin-bottom:30px;">กลับไปหน้าแรกเพื่อดูวิดีโอ</p>\
      <button onclick="location.reload()" style="padding:12px 30px;background:#e50914;color:#fff;border:none;border-radius:25px;font-size:16px;">กลับไปดู</button>\
    </div>\
  ';
}
</script>
</body>
</html>
