<!-- ==============================================================
   ThaiPodee v1122 — แก้จอดำ+ปุ่มโปรไฟล์ไม่ได้ ✅
   อัปเดต: 29 กันยายน 2569 21:47 น.
   --------------------------------------------------------------
   🔴 ปัญหา: สไลด์เปลี่ยนวิดีโอ → จอดำ ไม่แสดง
   🔴 ปัญหา: กดปุ่มโปรไฟล์ไม่ทำงาน
   🔴 ปัญหา: ต้องกดบวกเพื่อออก ไม่ถูกต้อง
   ✅ แก้: เลื่อนเปลี่ยน → วิดีโอโหลดทันที ไม่ดำ
   ✅ แก้: ปุ่มโปรไฟล์กดได้ทันที ทุกจังหวะ
   ✅ แก้: กลับมาจากโปรไฟล์ → ดูวิดีโอต่อได้ปกติ
   ✅ รักษา: หยุด-เล่น ⏸️→▶️ ทุกอย่างเหมือนเดิม
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, sans-serif;
  }

  .version-tag {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.55); color: #fff;
    font-size: 12px; padding: 3px 8px; border-radius: 10px; z-index: 100;
  }

  /* === หน้าจอหลัก === */
  .main-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    transition: transform 0.3s ease; z-index: 10;
  }
  .main-screen.hidden { transform: translateX(-100%); }

  .top-tabs {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 24px; z-index: 99;
  }
  .tab-item { font-size: 15px; color: #aaa; padding-bottom: 4px; border-bottom: 2px solid transparent; }
  .tab-item.active { color: #fff; border-bottom-color: #fff; font-weight: 600; }
  .search-icon { position: absolute; top: 12px; right: 45px; font-size: 20px; z-index: 99; }

  #videoWrapper {
    width: 100%; height: 100%; position: relative; z-index: 1;
    touch-action: pan-y;
  }

  .video-slide {
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000; position: absolute; top: 0; left: 0;
    transition: transform 0.3s ease;
  }

  video {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000; z-index: 2; display: block;
    object-fit: contain;
  }
  video.is-portrait { object-fit: cover; }
  video.is-landscape { object-fit: contain; }
  video::cue { display: none !important; }

  /* ปุ่มหยุด-เล่นตรงกลาง */
  .center-btn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 100px; height: 100px; border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: #fff; font-size: 42px;
    display: flex; align-items: center; justify-content: center;
    z-index: 10; border: none; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .center-btn.visible { opacity: 1; pointer-events: auto; }

  /* เส้นเวลา */
  .progress-container {
    position: absolute; bottom: 85px; left: 12px; right: 12px;
    z-index: 10; display: flex; align-items: center; gap: 8px;
    padding: 4px 0; pointer-events: auto;
  }
  .time-text { font-size: 11px; color: #ccc; min-width: 40px; text-align: center; }
  .progress-bar-bg {
    flex: 1; height: 3px; background: rgba(255,255,255,0.2);
    border-radius: 3px; cursor: pointer;
  }
  .progress-bar-fill {
    height: 100%; background: #ff2d55; width: 0%; border-radius: 3px;
  }

  /* ข้อมูลวิดีโอ */
  .video-info {
    position: absolute; bottom: 55px; left: 12px; right: 70px;
    z-index: 5; pointer-events: none;
  }
  .info-username {
    font-weight: 600; font-size: 14px; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .follow-badge {
    background: #fff; color: #000; font-size: 10px;
    padding: 1px 6px; border-radius: 4px; font-weight: bold;
  }
  .info-title { font-size: 13px; margin-bottom: 4px; color: #f0f0f0; }
  .info-tags { font-size: 12px; color: #ccc; }

  /* ไอคอนด้านขวา */
  .side-icons {
    position: absolute; right: 10px; bottom: 110px;
    display: flex; flex-direction: column; gap: 22px;
    z-index: 6; align-items: center;
  }
  .icon-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-count { font-size: 11px; color: #fff; }
  .icon-btn.liked { color: #ff2d55; }
  .profile-icon-wrap { position: relative; }
  .follow-plus {
    position: absolute; bottom: -4px; right: -4px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #ff2d55; color: #fff; font-size: 12px;
    display: flex; align-items: center; justify-content: center; font-weight: bold;
  }

  /* แถบเมนูล่าง — z-index สูงแน่นอน กดได้ทุกที่ */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0; height: 65px;
    background: rgba(0,0,0,0.8);
    display: flex; justify-content: space-around; align-items: center;
    z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-btn {
    background: none; border: none; color: #fff; font-size: 22px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
    pointer-events: auto;
  }
  .nav-label { font-size: 10px; }
  .nav-main {
    width: 52px; height: 36px; border-radius: 8px;
    background: #ff2d55; display: flex; align-items: center; justify-content: center;
    font-size: 24px; border: none; cursor: pointer;
  }

  #fileInput { display: none; }

  /* === หน้าโปรไฟล์ === */
  .profile-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 300; overflow-y: auto;
    transform: translateX(100%); transition: transform 0.3s ease;
  }
  .profile-screen.show { transform: translateX(0); }

  .profile-header {
    padding: 20px; text-align: center;
  }
  .back-btn {
    position: absolute; top: 12px; left: 12px;
    background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; z-index: 301;
  }
  .profile-avatar {
    width: 90px; height: 90px; border-radius: 50%;
    background: #333; margin: 20px auto 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
  }
  .profile-name {
    font-size: 18px; font-weight: bold; margin-bottom: 4px;
  }
  .profile-handle {
    color: #888; font-size: 13px; margin-bottom: 16px;
  }
  .profile-stats {
    display: flex; justify-content: center; gap: 30px; margin: 16px 0;
  }
  .stat-item { text-align: center; }
  .stat-num { font-size: 18px; font-weight: bold; }
  .stat-label { font-size: 11px; color: #888; }
  .profile-bio {
    padding: 0 20px 20px; font-size: 13px; line-height: 1.6; color: #ddd;
  }

  /* ตารางวิดีโอ */
  .profile-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    padding: 2px;
  }
  .grid-item {
    aspect-ratio: 9/16; background: #222;
    position: relative; overflow: hidden;
    cursor: pointer;
  }
  .grid-item video {
    width: 100%; height: 100%; object-fit: cover;
    position: relative;
  }
  .grid-likes {
    position: absolute; bottom: 4px; left: 4px;
    font-size: 11px; background: rgba(0,0,0,0.5);
    padding: 2px 6px; border-radius: 10px;
  }
</style>
</head>
<body>

<input type="file" id="fileInput" accept="video/*">

<!-- ===== หน้าจอหลัก ===== -->
<div id="mainScreen" class="main-screen">
  <div class="version-tag">v1122 🔒</div>

  <div class="top-tabs">
    <span class="tab-item">กำลังติดตาม</span>
    <span class="tab-item active">สำหรับคุณ</span>
  </div>
  <span class="search-icon">🔍</span>

  <div id="videoWrapper"></div>

  <!-- ปุ่มหยุด-เล่นตรงกลาง -->
  <button class="center-btn" id="centerBtn"></button>

  <!-- ข้อมูลวิดีโอ + ปุ่มกดถูกใจ -->
  <div class="video-info" id="videoInfo" style="display:none;">
    <div class="info-username">
      @thaipodee <span class="follow-badge">ติดตาม</span>
    </div>
    <div class="info-title" id="videoTitle"></div>
    <div class="info-tags" id="videoTags"></div>
  </div>

  <div class="side-icons" id="sideIcons" style="display:none;">
    <div class="icon-wrap">
      <button class="icon-btn" id="likeBtn">❤️</button>
      <span class="icon-count" id="likeCount">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">💬</button>
      <span class="icon-count">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">📌</button>
      <span class="icon-count">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">↗️</button>
      <span class="icon-count">0</span>
    </div>
    <div class="icon-wrap">
      <button class="icon-btn">🎵</button>
    </div>
  </div>

  <div class="progress-container" id="progressContainer" style="display:none;">
    <span class="time-text" id="currentTime">0:00</span>
    <div class="progress-bar-bg" id="progressBarBg">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
    <span class="time-text" id="totalTime">0:00</span>
  </div>

  <!-- แถบเมนูล่าง — กดได้แน่นอน -->
  <nav class="bottom-nav">
    <button class="nav-btn">🏠<span class="nav-label">หน้าหลัก</span></button>
    <button class="nav-btn">🛒<span class="nav-label">ร้านค้า</span></button>
    <button class="nav-main" id="uploadBtn">+</button>
    <button class="nav-btn">💬<span class="nav-label">ข้อความ</span></button>
    <button class="nav-btn" id="profileBtn">👤<span class="nav-label">โปรไฟล์</span></button>
  </nav>
</div>

<!-- ===== หน้าโปรไฟล์ ===== -->
<div id="profileScreen" class="profile-screen">
  <div class="profile-header">
    <button class="back-btn" id="backBtn">←</button>
    <div class="profile-avatar">P</div>
    <div class="profile-name">THAIPODEE PRODUCT ENGINEERING</div>
    <div class="profile-handle">@thaipodee</div>
    
    <!-- สถิติรวมทั้งหมด -->
    <div class="profile-stats">
      <div class="stat-item">
        <div class="stat-num" id="statVideos">0</div>
        <div class="stat-label">วิดีโอ</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statFollowers">1,237</div>
        <div class="stat-label">ผู้ติดตาม</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statLikes">0</div>
        <div class="stat-label">ถูกใจ</div>
      </div>
    </div>
  </div>

  <div class="profile-bio">
    บริการที่ปรึกษาบริหารโครงการ จัดหา ออกแบบเขียนแบบ ปรับปรุง ซ่อมแซม สร้างประกอบ ติดตั้งเครื่องจักรทุกชนิด
  </div>

  <!-- ตารางวิดีโอ -->
  <div class="profile-grid" id="profileGrid"></div>
</div>

<script>
const wrapper = document.getElementById('videoWrapper');
const fileInput = document.getElementById('fileInput');
const centerBtn = document.getElementById('centerBtn');
const profileScreen = document.getElementById('profileScreen');
const mainScreen = document.getElementById('mainScreen');
const profileGrid = document.getElementById('profileGrid');

// ข้อมูลวิดีโอทั้งหมด
let videoList = [];
let currentIndex = 0;
let activeVideo = null;
let startY = 0;
let startTransform = 0;
let isDragging = false;
let isBusy = false;

// ข้อมูลสถิติ
let totalFollowers = 1237;

// ===== อัปเดตสถิติรวม =====
function updateStats() {
  document.getElementById('statVideos').textContent = videoList.length;
  const totalLikes = videoList.reduce((sum, v) => sum + v.likes, 0);
  document.getElementById('statLikes').textContent = totalLikes.toLocaleString();
}

// ===== อัปเดตตารางในโปรไฟล์ =====
function renderProfileGrid() {
  profileGrid.innerHTML = '';
  videoList.forEach((vid, idx) => {
    const item = document.createElement('div');
    item.className = 'grid-item';
    item.innerHTML = `
      <video src="${vid.url}" muted preload="metadata"></video>
      <span class="grid-likes">❤️ ${vid.likes}</span>
    `;
    item.onclick = () => {
      currentIndex = idx;
      showMainScreen();
    };
    profileGrid.appendChild(item);
  });
  updateStats();
}

// ===== เปิด-ปิดหน้าโปรไฟล์ =====
function showProfileScreen() {
  renderProfileGrid();
  if (activeVideo) activeVideo.pause();
  profileScreen.classList.add('show');
}
function showMainScreen() {
  profileScreen.classList.remove('show');
  updateActiveVideo(true);
}

// ===== จัดการวิดีโอ =====
function formatTime(secs) {
  if (isNaN(secs)) return '0:00';
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function updateCenterBtn() {
  if (!activeVideo) return;
  if (activeVideo.paused) {
    centerBtn.textContent = '▶';
    centerBtn.classList.add('visible');
  } else {
    centerBtn.classList.remove('visible');
  }
}

function doPause() {
  if (!activeVideo || isBusy) return;
  isBusy = true;
  activeVideo.pause();
  centerBtn.textContent = '⏸';
  centerBtn.classList.add('visible');
  setTimeout(() => {
    centerBtn.textContent = '▶';
    isBusy = false;
  }, 400);
}

function doPlay() {
  if (!activeVideo || isBusy) return;
  isBusy = true;
  activeVideo.play().then(() => {
    centerBtn.classList.remove('visible');
  }).finally(() => { isBusy = false; });
}

function handleTap() {
  if (!activeVideo || isBusy) return;
  if (!activeVideo.paused) doPause();
}

function updateLikeUI() {
  const vid = videoList[currentIndex];
  if (!vid) return;
  document.getElementById('likeCount').textContent = vid.likes;
  const btn = document.getElementById('likeBtn');
  btn.classList.toggle('liked', vid.liked);
  updateStats();
}

function toggleLike() {
  const vid = videoList[currentIndex];
  if (!vid) return;
  vid.liked = !vid.liked;
  vid.likes += vid.liked ? 1 : -1;
  updateLikeUI();
  renderProfileGrid();
}

// ===== ย้ายวิดีโอเข้า-ออก ด้วย transform ไม่โหลดซ้ำ =====
function updateSlidePositions() {
  const slides = wrapper.querySelectorAll('.video-slide');
  slides.forEach((slide, i) => {
    slide.style.transform = `translateY(${(i - currentIndex) * 100}vh)`;
  });
}

function updateActiveVideo(autoPlay = false) {
  const slides = wrapper.querySelectorAll('.video-slide');
  
  slides.forEach((slide, i) => {
    const video = slide.querySelector('video');
    if (i === currentIndex) {
      // วิดีโอปัจจุบัน
      video.preload = 'auto';
      if (autoPlay) {
        video.muted = false;
        video.play().catch(() => {});
      }
      activeVideo = video;
      document.getElementById('videoInfo').style.display = 'block';
      document.getElementById('sideIcons').style.display = 'flex';
      document.getElementById('progressContainer').style.display = 'flex';
      const vidData = videoList[currentIndex];
      document.getElementById('videoTitle').textContent = vidData.title || '';
      document.getElementById('videoTags').textContent = vidData.tags || '';
      updateLikeUI();
    } else {
      // วิดีโออื่น — หยุดและลดภาระ
      video.pause();
      video.preload = 'metadata';
      video.muted = true;
    }
  });
  
  updateSlidePositions();
  updateCenterBtn();
}

function goToSlide(index) {
  if (!videoList.length) return;
  if (index < 0) index = 0;
  if (index >= videoList.length) index = videoList.length - 1;
  if (index === currentIndex) return;
  
  currentIndex = index;
  updateActiveVideo(true);
}

function addVideoSlide(file, url, title = null, tags = null, likes = null) {
  const slide = document.createElement('div');
  slide.className = 'video-slide';
  const idx = videoList.length;
  
  videoList.push({
    url,
    title: title || file.name.replace(/\.[^/.]+$/, ''),
    tags: tags || '#ThaiPodee #วิดีโอ',
    likes: likes ?? Math.floor(Math.random() * 100),
    liked: false
  });

  slide.innerHTML = `<video src="${url}" loop playsinline preload="metadata"></video>`;
  wrapper.appendChild(slide);
  
  const video = slide.querySelector('video');
  video.addEventListener('loadedmetadata', () => {
    video.classList.add(video.videoHeight > video.videoWidth ? 'is-portrait' : 'is-landscape');
    updateSlidePositions();
  });
  video.addEventListener('timeupdate', () => {
    if (video !== activeVideo) return;
    document.getElementById('currentTime').textContent = formatTime(video.currentTime);
    document.getElementById('totalTime').textContent = formatTime(video.duration);
    document.getElementById('progressBarFill').style.width = `${(video.currentTime / video.duration) * 100}%`;
  });
  video.addEventListener('pause', updateCenterBtn);
  video.addEventListener('play', updateCenterBtn);
  
  renderProfileGrid();
  updateSlidePositions();
  
  if (idx === 0) updateActiveVideo(true);
}

// ===== สไลด์ลื่นไม่ดำ =====
wrapper.addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
  startTransform = (currentIndex) * -100;
  isDragging = true;
}, { passive: true });

wrapper.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const moveY = e.touches[0].clientY - startY;
  const offset = startTransform + (moveY / window.innerHeight) * 100;
  wrapper.style.transform = `translateY(${offset}vh)`;
}, { passive: true });

wrapper.addEventListener('touchend', e => {
  if (!isDragging) return;
  isDragging = false;
  
  const endY = e.changedTouches[0].clientY - startY;
  
  // ถ้าเลื่อนน้อย = แตะ ไม่เลื่อน
  if (Math.abs(endY) < 30) {
    handleTap();
    return;
  }

  // เลื่อนขึ้น = วิดีโอถัดไป
  if (endY < -50 && currentIndex < videoList.length - 1) {
    goToSlide(currentIndex + 1);
  } 
  // เลื่อนลง = วิดีโอก่อนหน้า
  else if (endY > 50 && currentIndex > 0) {
    goToSlide(currentIndex - 1);
  } 
  // เลื่อนไม่พอ = กลับไปเดิม
  else {
    wrapper.style.transform = '';
    updateSlidePositions();
  }
}, { passive: false });

centerBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (activeVideo?.paused) doPlay();
});

wrapper.addEventListener('click', e => {
  if (e.target.closest('.icon-btn') || 
      e.target.closest('.nav-btn') || 
      e.target.closest('.progress-bar-bg') ||
      e.target.closest('.center-btn')) return;
  handleTap();
});

document.getElementById('likeBtn').addEventListener('click', toggleLike);

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  addVideoSlide(file, url);
});

document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
document.getElementById('profileBtn').addEventListener('click', showProfileScreen);
document.getElementById('backBtn').addEventListener('click', showMainScreen);

// ตัวอย่างวิดีโอเริ่มต้น
window.addEventListener('load', () => {
  const sampleVideos = [
    { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', title: 'Lamai Plai Mat Nights', tags: '#ThaiPodee #เพลง #วิดีโอ', likes: 66 },
    { url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', title: 'Chira Junction', tags: '#ThaiPodee #สถานีรถไฟ', likes: 132 }
  ];
  
  sampleVideos.forEach(v => {
    const fakeFile = { name: v.title };
    addVideoSlide(fakeFile, v.url, v.title, v.tags, v.likes);
  });
});
</script>

</body>
</html>
