<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thaipodee Market Online V2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    /* ===== ล็อกโครงสร้าง — ห้ามแก้! ===== */
    .app-container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* ===== พื้นที่วิดีโอ ===== */
    .video-wrapper {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    .upload-hint {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #aaa;
      cursor: pointer;
      pointer-events: auto;
    }
    .upload-hint i { font-size: 48px; margin-bottom: 12px; }
    /* ===== ไอคอนด้านขวา — ล็อกตำแหน่ง! ===== */
    .side-bar {
      position: absolute;
      right: 12px;
      bottom: 130px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
      z-index: 10;
    }
    .side-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .side-item i { font-size: 28px; }
    .side-item span { font-size: 11px; }
    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }
    /* ===== เมนูด้านล่าง — ล็อกจริง! flex-shrink:0 ห้ามหาย! ===== */
    .bottom-bar {
      position: relative;
      z-index: 20;
      height: 60px;
      min-height: 60px;
      flex-shrink: 0; /* 🔑 ล็อกหลัก — ห้ามหด ห้ามหาย! */
      background: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #222;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .nav-item i { font-size: 22px; }
    .nav-item span { font-size: 10px; }
    .nav-plus {
      width: 44px; height: 44px;
      border-radius: 8px;
      background: #fff; color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px; font-weight: bold;
    }
    /* ===== หน้าโปรไฟล์ ===== */
    .profile-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
      display: none;
    }
    .close-x {
      position: absolute;
      top: 10px; right: 10px;
      font-size: 24px;
      cursor: pointer;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-top: 20px;
    }
    .video-cell {
      aspect-ratio: 9/16;
      background: #222;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
    }
    .video-cell video { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="video-wrapper" id="videoWrapper">
      <div class="upload-hint" id="uploadHint">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>แตะเพื่อเลือกไฟล์วิดีโอ</p>
        <p style="font-size:13px; color:#888; margin-top:4px;">รองรับ MP4, MOV</p>
      </div>
      <video id="mainVideo" loop playsinline muted style="display:none;"></video>
    </div>

    <div class="side-bar">
      <div class="side-item" id="openProfileTop">
        <img src="https://picsum.photos/seed/thaipodee/100/100" class="avatar" id="topAvatar" alt="Profile">
        <span id="topName">Thaipodee_market</span>
      </div>
      <div class="side-item"><i class="far fa-heart"></i><span>0</span></div>
      <div class="side-item"><i class="far fa-comment"></i><span>0</span></div>
      <div class="side-item"><i class="far fa-bookmark"></i><span>0</span></div>
      <div class="side-item"><i class="fas fa-music"></i><span>เสียง</span></div>
      <div class="side-item"><i class="fas fa-ellipsis-v"></i></div>
    </div>

    <div class="bottom-bar">
      <div class="nav-item"><i class="fas fa-home"></i><span>หน้าแรก</span></div>
      <div class="nav-item"><i class="fas fa-search"></i><span>ค้นหา</span></div>
      <div class="nav-item nav-plus" id="openUpload">+</div>
      <div class="nav-item"><i class="far fa-paper-plane"></i><span>ข้อความ</span></div>
      <div class="nav-item" id="openProfileBottom"><i class="far fa-user"></i><span>ฉัน</span></div>
    </div>

    <input type="file" id="fileInput" accept="video/mp4,video/quicktime" style="display:none;">

    <div class="profile-screen" id="profileScreen">
      <i class="fas fa-times close-x" id="closeProfile"></i>
      <div class="flex flex-col items-center pt-8">
        <img src="https://picsum.photos/seed/thaipodee/200/200" class="w-20 h-20 rounded-full object-cover border-2 border-white mb-3" id="profileAvatar" alt="Profile">
        <h2 class="text-xl font-bold" id="profileName">Thaipodee_market</h2>
        <p class="text-gray-400 text-sm mb-6">@Thaipodee_market</p>
        <div class="flex gap-8 text-center">
          <div><div class="font-bold text-lg" id="countVideo">0</div><div class="text-xs text-gray-400">วิดีโอ</div></div>
          <div><div class="font-bold text-lg">0</div><div class="text-xs text-gray-400">ผู้ติดตาม</div></div>
          <div><div class="font-bold text-lg">0</div><div class="text-xs text-gray-400">กำลังติดตาม</div></div>
        </div>
      </div>
      <h4 class="w-full text-left font-semibold mt-8 mb-3">วิดีโอของฉัน</h4>
      <div class="video-grid" id="profileGrid">
        <div class="col-span-3 text-center py-8 text-gray-400">ยังไม่มีวิดีโอ</div>
      </div>
    </div>
  </div>

  <script>
    // ========== ล็อกค่าคงที่ — ห้ามแก้! ==========
    const CLOUD_NAME = 'orjpnytt';
    const UPLOAD_PRESET = 'Thaipodee_upload';
    const UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`;

    const $ = id => document.getElementById(id);
    let myVideos = [];

    $('openUpload').addEventListener('click', () => $('fileInput').click());
    $('uploadHint').addEventListener('click', () => $('fileInput').click());

    $('fileInput').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;

      const localUrl = URL.createObjectURL(file);
      $('mainVideo').src = localUrl;
      $('mainVideo').style.display = 'block';
      $('mainVideo').play();
      $('uploadHint').style.display = 'none';

      myVideos.unshift({ url: localUrl, name: file.name });
      updateGrid();

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      formData.append('cloud_name', CLOUD_NAME);

      try {
        const res = await fetch(UPLOAD_URL, { method: 'POST', body: formData });
        const data = await res.json();
        if (data.secure_url) {
          myVideos[0].cloudUrl = data.secure_url;
          alert('อัปโหลดสำเร็จ! ✅');
        } else {
          alert('ไม่สำเร็จ: ' + JSON.stringify(data));
        }
      } catch (err) {
        alert('ผิดพลาด: ' + err.message);
      }
    });

    function updateGrid() {
      const grid = $('profileGrid');
      $('countVideo').textContent = myVideos.length;
      if (myVideos.length === 0) {
        grid.innerHTML = '<div class="col-span-3 text-center py-8 text-gray-400">ยังไม่มีวิดีโอ</div>';
        return;
      }
      grid.innerHTML = myVideos.map((v, i) => `
        <div class="video-cell" onclick="playFromList(${i})">
          <video src="${v.url}" muted></video>
        </div>
      `).join('');
    }

    window.playFromList = function(i) {
      const v = myVideos[i];
      if (!v) return;
      $('mainVideo').src = v.url;
      $('mainVideo').style.display = 'block';
      $('mainVideo').play();
      $('profileScreen').style.display = 'none';
      $('uploadHint').style.display = 'none';
    };

    $('openProfileTop').addEventListener('click', () => {
      $('profileScreen').style.display = 'block';
      updateGrid();
    });
    $('openProfileBottom').addEventListener('click', () => {
      $('profileScreen').style.display = 'block';
      updateGrid();
    });
    $('closeProfile').addEventListener('click', () => {
      $('profileScreen').style.display = 'none';
    });

    $('mainVideo').addEventListener('click', function() {
      this.muted = !this.muted;
    });
  </script>
</body>
</html>
