<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAIPODEE V2026</title>
    <link rel="icon" href="https://i.imgur.com/8ZxQrL9.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; padding-bottom: 80px; }

        /* Header */
        .header {
            position: fixed; top: 0; left: 0; right: 0; height: 50px;
            background: #000; display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; border-bottom: 1px solid #333; z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .logo { width: 28px; height: 28px; border-radius: 4px; }
        .title { font-size: 16px; font-weight: bold; }
        .version { font-size: 11px; color: #888; background: #222; padding: 2px 6px; border-radius: 4px; }
        .menu-btn { font-size: 24px; cursor: pointer; padding: 10px; }

        /* Video Area */
        .video-area {
            margin-top: 50px; width: 100%; min-height: 60vh;
            background: linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
            display: flex; align-items: flex-start; justify-content: center;
            padding: 30px 20px;
        }
        .video-text { color: #ccc; font-size: 14px; text-align: center; }

        /* Right Buttons */
        .side-buttons {
            position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 30px; z-index: 50;
        }
        .side-btn {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; padding: 10px;
            background: rgba(0,0,0,0.5); border-radius: 50%;
            width: 50px; height: 50px; justify-content: center;
        }
        .side-icon { font-size: 24px; }
        .side-label { font-size: 10px; color: #aaa; margin-top: 4px; }

        /* Info Bar */
        .info-bar {
            padding: 12px; display: flex; align-items: flex-start; gap: 10px;
            border-bottom: 1px solid #222;
        }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #4f46e5; flex-shrink: 0; }
        .info-text { flex: 1; }
        .username { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .desc { font-size: 13px; color: #ccc; line-height: 1.4; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: #000; border-top: 1px solid #333;
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            cursor: pointer; padding: 8px;
        }
        .nav-icon { font-size: 20px; }
        .nav-label { font-size: 11px; color: #aaa; }
        .plus-btn {
            width: 44px; height: 32px; background: #fff; border-radius: 6px;
            color: #000; font-size: 22px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-left">
        <img src="https://i.imgur.com/8ZxQrL9.png" alt="Logo" class="logo">
        <span class="title">THAIPODEE</span>
        <span class="version">V2026</span>
    </div>
    <div class="menu-btn" onclick="testMenu()">☰</div>
</div>

<!-- Video Area -->
<div class="video-area">
    <p class="video-text">THAIPODEE V2026 — แพลตฟอร์มตลาดโลก จากไทยสู่ทั่วโลก 🌍</p>
</div>

<!-- Right Buttons -->
<div class="side-buttons">
    <div class="side-btn" onclick="testLike()">
        <span class="side-icon">❤️</span>
    </div>
    <div class="side-btn" onclick="testComment()">
        <span class="side-icon">💬</span>
    </div>
    <div class="side-btn" onclick="testShare()">
        <span class="side-icon">↗️</span>
    </div>
    <div class="side-btn" onclick="testCart()">
        <span class="side-icon">🛒</span>
    </div>
</div>

<!-- Info Bar -->
<div class="info-bar">
    <div class="avatar"></div>
    <div class="info-text">
        <div class="username">@thaipodee_official</div>
        <div class="desc">THAIPODEE V2026 — แพลตฟอร์มออนไลน์ระดับโลก ซื้อ ขาย แชร์ ได้ทุกที่ทั่วโลก 🌍 🇹🇭</div>
    </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
    <div class="nav-item" onclick="testHome()">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าแรก</span>
    </div>
    <div class="nav-item" onclick="testSearch()">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">ค้นหา</span>
    </div>
    <div class="nav-item" onclick="testCreate()">
        <div class="plus-btn">+</div>
    </div>
    <div class="nav-item" onclick="testMessage()">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
    </div>
    <div class="nav-item" onclick="testProfile()">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<script>
// ปิดป๊อปอัพติดตั้ง
window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    return false;
});

// ทุกฟังก์ชัน — เรียบง่าย ชัดเจน
function testMenu() { alert('☰ เปิดเมนูหลัก'); }
function testLike() { alert('❤️ กดถูกใจแล้ว!'); }
function testComment() { alert('💬 เปิดความคิดเห็น'); }
function testShare() { alert('↗️ แชร์แล้ว!'); }
function testCart() { alert('🛒 เข้าตะกร้าสินค้า'); }
function testHome() { alert('🏠 ไปหน้าแรก'); }
function testSearch() { alert('🔍 ค้นหา'); }
function testCreate() { alert('+ สร้างโพสต์ / อัปโหลดวิดีโอ'); }
function testMessage() { alert('💬 ข้อความ'); }
function testProfile() { alert('👤 โปรไฟล์'); }
</script>

</body>
</html>
