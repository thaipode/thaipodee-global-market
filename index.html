<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ThaiPodee</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
html, body { height: 100%; overflow: hidden; background: #000; color: #fff; }

/* จอวิดีโอ */
.video-container { position: relative; width: 100%; height: 100vh; }
video { width: 100%; height: 100%; object-fit: cover; background: #111; }

/* ข้อมูลด้านล่าง */
.video-info { position: absolute; bottom: 90px; left: 15px; right: 90px; z-index: 10; }
.username { font-weight: bold; font-size: 16px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.description { font-size: 14px; line-height: 1.4; color: #eee; }

/* แถบไอคอนด้านขวา — ครบ 5 อัน */
.side-icons { position: absolute; right: 12px; bottom: 100px; display: flex; flex-direction: column; gap: 22px; align-items: center; z-index: 15; }
.side-icon { font-size: 28px; cursor: pointer; text-align: center; }
.side-avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; padding: 0; overflow: hidden; }
.side-avatar img { width: 100%; height: 100%; object-fit: cover; }

/* แถบเมนูล่าง */
.bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; display: flex; justify-content: space-around; align-items: center; background: #000; z-index: 20; }
.nav-btn { display: flex; flex-direction: column; align-items: center; color: #fff; text-decoration: none; font-size: 11px; }
.nav-icon { font-size: 24px; margin-bottom: 2px; }
.nav-add { width: 52px; height: 52px; border-radius: 50%; background: #f00; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; line-height: 1; }

/* สถานะ */
#syncStatus { position: absolute; top: 10px; left: 10px; font-size: 13px; color: #0f0; z-index: 30; }

/* แถบเวลา */
.progress-bar { position: absolute; bottom: 75px; left: 10px; right: 10px; height: 3px; background: #444; border-radius: 3px; z-index: 12; }
.progress-fill { height: 100%; background: #fff; width: 0%; border-radius: 3px; position: relative; }
.progress-dot { position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; background: #fff; border-radius: 50%; cursor: grab; }
</style>
</head>
<body>

<div class="video-container">
  <div id="syncStatus">กำลังเชื่อมต่อ...</div>
  
  <video id="mainVideo" playsinline loop></video>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill">
      <div class="progress-dot"></div>
    </div>
  </div>
  
  <div class="video-info">
    <div class="username">
      <div class="avatar" id="infoAvatar">👤</div>
      <span id="username">@Thaipodee-Master-No.1</span>
    </div>
    <div class="description" id="vidDesc">กด + เพื่ออัปโหลดวิดีโอ</div>
  </div>
  
  <!-- ✅ ไอคอนด้านขวาครบ 5 อัน + รูปโปรไฟล์บนสุด -->
  <div class="side-icons">
    <div class="side-icon side-avatar" id="profileBtn">
      <span id="sideAvatar">👤</span>
    </div>
    <div class="side-icon" id="likeBtn">🤍</div>
    <div class="side-icon">💬</div>
    <div class="side-icon">📄</div>
    <div class="side-icon">↗️</div>
    <div class="side-icon">🎵</div>
  </div>
  
  <div class="bottom-nav">
    <a href="#" class="nav-btn"><span class="nav-icon">🏠</span></a>
    <a href="#" class="nav-btn"><span class="nav-icon">🛒</span></a>
    <a href="#" id="upBtn2" class="nav-btn"><span class="nav-add">+</span></a>
    <a href="#" class="nav-btn"><span class="nav-icon">💬</span></a>
    <a href="#" class="nav-btn"><span class="nav-icon">👤</span></a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<script>
// ==============================================================
// ThaiPodee — ครบทุกอย่าง: ไอคอน+รูปโปรไฟล์+Supabase
// ==============================================================

const SUPABASE_URL = 'https://pinoqstzlscqqwietvbv.supabase.com'
const SUPABASE_KEY = 'sb_publishable_lr4yrKHV-OiKmzba1WlyIA_guU3oxTi'

const { createClient } = supabase
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

const MY_ID = localStorage.getItem('tp_my_id') || ('u_' + Date.now())
localStorage.setItem('tp_my_id', MY_ID)

let vidList = [], currentIndex = 0, isLiked = false

const syncStatus = document.getElementById('syncStatus')
const mainVideo = document.getElementById('mainVideo')
const vidDesc = document.getElementById('vidDesc')
const upBtn = document.getElementById('upBtn2')
const likeBtn = document.getElementById('likeBtn')
const profileBtn = document.getElementById('profileBtn')
const infoAvatar = document.getElementById('infoAvatar')
const sideAvatar = document.getElementById('sideAvatar')
const usernameEl = document.getElementById('username')

// โหลดรูปโปรไฟล์จากเครื่อง
function loadAvatar() {
  const saved = localStorage.getItem('tp_avatar')
  if (saved) {
    infoAvatar.innerHTML = `<img src="${saved}" alt="โปรไฟล์">`
    sideAvatar.innerHTML = `<img src="${saved}" alt="โปรไฟล์">`
  }
  const savedName = localStorage.getItem('tp_name')
  if (savedName) usernameEl.textContent = '@' + savedName
}

// เปลี่ยนรูปโปรไฟล์
profileBtn.addEventListener('click', () => {
  const input = document.createElement('input')
  input.type = 'file'
  input.accept = 'image/*'
  input.onchange = e => {
    const file = e.target.files[0]
    if (!file) return
    const reader = new FileReader()
    reader.onload = ev => {
      const base64 = ev.target.result
      localStorage.setItem('tp_avatar', base64)
      loadAvatar()
    }
    reader.readAsDataURL(file)
  }
  input.click()
})

// โหลดวิดีโอ
async function loadVideos() {
  try {
    syncStatus.textContent = 'กำลังโหลด...'
    const { data, error } = await supabase
      .from('videos')
      .select('*')
      .order('created_at', { ascending: false })
    if (error) throw error
    vidList = data || []
    syncStatus.textContent = vidList.length === 0 
      ? 'ออนไลน์ ✅ กด + เพิ่มวิดีโอแรก' 
      : `ออนไลน์ ✅ ${vidList.length} รายการ`
    if (vidList.length > 0) showVideo(0)
  } catch (err) {
    console.error(err)
    syncStatus.textContent = 'เชื่อมต่อไม่ได้ ❌'
  }
}

function showVideo(index) {
  if (vidList.length === 0) return
  currentIndex = (index + vidList.length) % vidList.length
  const v = vidList[currentIndex]
  mainVideo.src = v.video_url
  vidDesc.textContent = v.description || 'ไม่มีคำอธิบาย'
  isLiked = false
  likeBtn.textContent = '🤍'
  mainVideo.play()
}

mainVideo.addEventListener('timeupdate', () => {
  if (mainVideo.duration) {
    document.getElementById('progressFill').style.width = 
      (mainVideo.currentTime / mainVideo.duration) * 100 + '%'
  }
})

// อัปโหลด
upBtn.addEventListener('click', () => {
  const input = document.createElement('input')
  input.type = 'file'
  input.accept = 'video/*'
  input.onchange = async e => {
    const file = e.target.files[0]
    if (!file) return
    const desc = prompt('คำอธิบายวิดีโอ:') || 'วิดีโอใหม่'
    syncStatus.textContent = 'กำลังอัปโหลด...'
    try {
      const fn = `${MY_ID}_${Date.now()}_${file.name}`
      const { error: upErr } = await supabase.storage
        .from('videos').upload(`${MY_ID}/${fn}`, file)
      if (upErr) throw upErr
      const { data: { publicUrl } } = supabase.storage
        .from('videos').getPublicUrl(`${MY_ID}/${fn}`)
      const { error: dbErr } = await supabase.from('videos').insert([{
        user_id: MY_ID, description: desc, video_url: publicUrl
      }])
      if (dbErr) throw dbErr
      syncStatus.textContent = 'อัปโหลดสำเร็จ ✅'
      await loadVideos()
    } catch (err) {
      alert('ล้มเหลว: ' + err.message)
      syncStatus.textContent = 'อัปโหลดไม่ได้ ❌'
    }
  }
  input.click()
})

// สไลด์เปลี่ยวิดีโอ
let startY = 0
mainVideo.addEventListener('touchstart', e => startY = e.touches[0].clientY)
mainVideo.addEventListener('touchend', e => {
  const diff = startY - e.changedTouches[0].clientY
  if (Math.abs(diff) > 60) showVideo(currentIndex + (diff > 0 ? 1 : -1))
})

likeBtn.addEventListener('click', () => {
  isLiked = !isLiked
  likeBtn.textContent = isLiked ? '❤️' : '🤍'
})

// เริ่ม
loadAvatar()
loadVideos()
</script>
</body>
</html>
