<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">

<title>ThaiPodee v1121-6</title>

<link rel="icon" type="image/png" sizes="192x192" href="https://i.imgur.com/KJbRzQY.png?v=6">
<link rel="apple-touch-icon" sizes="180x180" href="https://i.imgur.com/KJbRzQY.png?v=6">
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22ThaiPodee%22%2C%22short_name%22%3A%22ThaiPodee%22%2C%22start_url%22%3A%22.%2F%3Fv%3D1121-6%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23e60000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fi.imgur.com%2FKJbRzQY.png%3Fv%3D6%22%2C%22sizes%22%3A%22192x192%22%7D%2C%7B%22src%22%3A%22https%3A%2F%2Fi.imgur.com%2FKJbRzQY.png%3Fv%3D6%22%2C%22sizes%22%3A%22512x512%22%7D%5D%7D">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:sans-serif;color:#fff}

/* ---- หน้าเริ่มต้น ---- */
.splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
.splash.hidden{opacity:0;pointer-events:none}
.splash-logo{font-size:3rem;font-weight:bold;color:#e60000;margin-bottom:1rem}
.splash-text{font-size:1rem;color:#aaa}

/* ---- ป้ายเวอร์ชัน ---- */
.version-tag{position:absolute;top:10px;right:10px;font-size:11px;color:#888;z-index:50}

/* ---- หน้าหลัก ---- */
.main-screen{position:relative;width:100%;height:100vh;display:block}
.main-screen.hidden{display:none}

/* ✅ วิดีโอพอดีจอ ไม่ล้น */
.video-container{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;overflow:hidden;z-index:1}
video{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  max-width:100vw;
  max-height:100vh;
  width:auto;
  height:auto;
  object-fit:contain;
  background:#000;
}
.tap-layer{position:absolute;inset:0;z-index:10;cursor:pointer}

/* ---- ข้อมูลใต้วิดีโอ ---- */
.video-info{position:absolute;left:15px;bottom:100px;right:80px;z-index:20}
.video-title{font-size:15px;font-weight:bold;margin-bottom:4px}
.video-desc{font-size:12px;color:#ccc;line-height:1.4}

/* ---- ปุ่มด้านขวา 6 ตัว ---- */
.side-icons{position:absolute;right:12px;bottom:120px;display:flex;flex-direction:column;gap:22px;align-items:center;z-index:20}
.side-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.profile-circle{width:44px;height:44px;border-radius:50%;border:2px solid #fff;overflow:hidden;background:#333}
.profile-circle img{width:100%;height:100%;object-fit:cover}
.side-icon{font-size:22px}
.side-count{font-size:9px;color:#aaa}

/* ---- เมนูล่าง ---- */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:rgba(0,0,0,.85);display:flex;justify-content:space-around;align-items:center;padding:0 10px;z-index:30;border-top:1px solid #222}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:9px;color:#aaa}
.nav-item.active{color:#fff}
.nav-icon{font-size:22px;line-height:1}
.plus-btn{width:50px;height:36px;background:#e60000;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#fff;cursor:pointer;border:none}

/* ---- ซ่อนช่องเลือกไฟล์ ---- */
#fileInput{display:none}

/* ✅ หน้าโปรไฟล์ — บังคับรูปเต็มบล็อก */
.profile-screen{position:absolute;inset:0;background:#000;z-index:40;display:none;overflow-y:auto}
.profile-screen.active{display:block}
.back-btn{position:absolute;top:10px;left:10px;background:transparent;border:none;color:#fff;font-size:24px;cursor:pointer;z-index:10}
.profile-header{padding:20px;text-align:center;padding-top:60px}
.profile-header h2{font-size:20px;margin-bottom:4px}
.profile-header p{font-size:13px;color:#aaa}

/* ตาราง 4×2 บังคับขนาดชัดเจน */
.profile-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  grid-template-rows:repeat(2, 1fr);
  gap:6px;
  padding:6px;
  width:100%;
}
.profile-item{
  aspect-ratio:1/1;
  background:#222;
  position:relative;
  cursor:pointer;
  overflow:hidden;
  width:100%;
  min-height:90px;
  border-radius:4px;
}
/* ซ่อนแถวที่ 3 ขึ้นไป*/
.profile-item:nth-child(n+9){display:none}

/* ✅ รูปเต็มบล็อก ไม่ย่อ ไม่หาย */
.profile-thumb{
  width:100% !important;
  height:100% !important;
  object-fit:cover !important;
  background:#333;
  display:block;
  border:none;
}
.profile-delete{
  position:absolute;
  top:4px;
  right:4px;
  background:rgba(0,0,0,.8);
  border:none;
  color:#fff;
  width:26px;
  height:26px;
  border-radius:50%;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
</head>
<body>

<input type="file" id="fileInput" accept="video/*">

<div class="splash" id="splash">
  <div class="splash-logo">ThaiPodee</div>
  <div class="splash-text">v1121-6 กำลังโหลด...</div>
</div>

<div class="main-screen" id="mainScreen">
  <div class="version-tag">v1121-6</div>

  <div class="video-container">
    <video id="videoPlayer" loop playsinline webkit-playsinline>
      <source src="" type="video/mp4">
    </video>
    <div class="tap-layer" id="tapLayer"></div>
  </div>

  <div class="video-info">
    <div class="video-title">ThaiPodee</div>
    <div class="video-desc">แพลตฟอร์มวิดีโอสั้นของไทย — แชร์ไปได้ทุกเครื่อง</div>
  </div>

  <div class="side-icons">
    <div class="side-btn" data-page="profile">
      <div class="profile-circle">
        <img src="https://i.imgur.com/KJbRzQY.png?v=6" alt="โปรไฟล์">
      </div>
    </div>
    <div class="side-btn">
      <span class="side-icon">❤️</span>
      <span class="side-count" id="likeCount">0</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">💬</span>
      <span class="side-count">0</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">📌</span>
      <span class="side-count">0</span>
    </div>
    <div class="side-btn" id="shareBtn">
      <span class="side-icon">↗️</span>
      <span class="side-count">แชร์</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">🎵</span>
      <span class="side-count">เสียง</span>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" data-page="main">
      <span class="nav-icon">🏠</span>
      <span>หน้าแรก</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>ค้นหา</span>
    </div>
    <div class="nav-item">
      <button class="plus-btn" id="uploadBtn">+</button>
    </div>
    <div class="nav-item">
      <span class="nav-icon">📦</span>
      <span>กล่อง</span>
    </div>
    <div class="nav-item" data-page="profile">
      <span class="nav-icon">👤</span>
      <span>โปรไฟล์</span>
    </div>
  </nav>
</div>

<div class="profile-screen" id="profileScreen">
  <button class="back-btn" id="backBtn">←</button>
  <div class="profile-header">
    <h2>โปรไฟล์</h2>
    <p>ThaiPodee User</p>
  </div>
  <div class="profile-grid" id="profileGrid"></div>
</div>

<script>
const VERSION = 'v1121-6';
let videoList = JSON.parse(localStorage.getItem('thaiPodeeVideos') || '[]');
let currentIndex = 0;
let isPlaying = true;

const splash = document.getElementById('splash');
const mainScreen = document.getElementById('mainScreen');
const profileScreen = document.getElementById('profileScreen');
const videoPlayer = document.getElementById('videoPlayer');
const tapLayer = document.getElementById('tapLayer');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const shareBtn = document.getElementById('shareBtn');
const profileGrid = document.getElementById('profileGrid');
const backBtn = document.getElementById('backBtn');

setTimeout(() => splash.classList.add('hidden'), 1200);

function loadVideo(i) {
  if (!videoList.length) return videoPlayer.src = '';
  videoPlayer.src = videoList[i].url;
  videoPlayer.load();
  if (isPlaying) videoPlayer.play().catch(() => {});
}

tapLayer.addEventListener('click', () => {
  if (videoPlayer.paused) {
    videoPlayer.play();
  } else {
    videoPlayer.pause();
  }
  isPlaying = !videoPlayer.paused;
});

videoPlayer.addEventListener('ended', () => {
  videoPlayer.currentTime = 0;
  videoPlayer.play();
});

uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const u = URL.createObjectURL(f);
  // ✅ บันทึกทั้ง url และ thumbnail ให้ชัดเจน
  videoList.unshift({
    id: Date.now(),
    name: f.name,
    url: u,
    thumbnail: u  // ใช้ไฟล์เดียวกันเป็นรูปย่อโดยตรง
  });
  saveVideos();
  renderProfileGrid();
  loadVideo(0);
  currentIndex = 0;
  fileInput.value = '';
});

function saveVideos() {
  localStorage.setItem('thaiPodeeVideos', JSON.stringify(videoList));
}

// ✅ สร้างรูปย่อจากวิดีโอโดยตรง — แก้ปัญหารูปไม่ขึ้น
function renderProfileGrid() {
  profileGrid.innerHTML = '';
  const showList = videoList.slice(0, 8); // แสดงแค่ 8 อันแรก = 4×2

  showList.forEach((v, displayIndex) => {
    const item = document.createElement('div');
    item.className = 'profile-item';
    item.dataset.id = v.id;

    // ✅ ใช้แท็กวิดีโอเป็นภาพแทนถ้าเป็นไปได้ หรือใช้ img ปกติ
    item.innerHTML = `
      <button class="profile-delete" data-idx="${displayIndex}">×</button>
      <img src="${v.thumbnail}" class="profile-thumb" alt="วิดีโอ" loading="eager" onerror="this.style.background='#444'; this.alt='ไม่มีรูป'">
    `;

    // กดเพื่อเล่น
    item.addEventListener('click', (ev) => {
      if (ev.target.classList.contains('profile-delete')) return;
      const realIndex = videoList.findIndex(x => x.id === v.id);
      if (realIndex !== -1) {
        currentIndex = realIndex;
        loadVideo(realIndex);
        showPage('main');
      }
    });

    profileGrid.appendChild(item);
  });

  // ปุ่มลบ
  document.querySelectorAll('.profile-delete').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const displayIdx = parseInt(btn.dataset.idx);
      const targetId = showList[displayIdx]?.id;
      const realIdx = videoList.findIndex(x => x.id === targetId);
      
      if (realIdx === -1) return;
      if (!confirm('ลบวิดีโอนี้?')) return;

      // ปล่อย URL เพื่อประหยัดหน่วยความจำ
      try { URL.revokeObjectURL(videoList[realIdx].url); } catch {}
      
      videoList.splice(realIdx, 1);
      saveVideos();
      renderProfileGrid();
      
      if (currentIndex >= videoList.length) {
        currentIndex = Math.max(0, videoList.length - 1);
      }
      if (videoList.length > 0) loadVideo(currentIndex);
    });
  });
}

function showPage(page) {
  mainScreen.classList.toggle('hidden', page === 'profile');
  profileScreen.classList.toggle('active', page === 'profile');
  if (page === 'profile') {
    setTimeout(renderProfileGrid, 50); // รอปาดหน้าเสร็จแล้วค่อยวาด
  }
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
}

document.querySelectorAll('[data-page]').forEach(b => {
  b.onclick = () => showPage(b.dataset.page);
});
backBtn.onclick = () => showPage('main');

shareBtn.onclick = async () => {
  const shareUrl = window.location.href.split('?')[0] + '?v=1121-6';
  try {
    if (navigator.share) {
      await navigator.share({
        title: 'ThaiPodee v1121-6',
        text: 'แอปวิดีโอสั้นไทย — ติดตั้งได้เลย',
        url: shareUrl
      });
    } else {
      await navigator.clipboard.writeText(shareUrl);
      alert('✅ คัดลอกลิงก์แล้ว!\nส่งทางไลน์ไปเครื่องที่ 2 ได้เลย:\n' + shareUrl);
    }
  } catch {
    try {
      await navigator.clipboard.writeText(shareUrl);
      alert('✅ คัดลอกลิงก์แล้ว!\nส่งไลน์ไปเครื่องที่ 2:\n' + shareUrl);
    } catch {
      alert('📋 ก๊อปปี้ลิงก์นี้เองนะ:\n' + shareUrl);
    }
  }
};

renderProfileGrid();
if (videoList.length) loadVideo(0);
</script>

</body>
</html>
