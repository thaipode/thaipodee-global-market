<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ThaiPodee">
<meta name="theme-color" content="#000">
<title>ThaiPodee v1193</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;font-family:-apple-system,sans-serif;color:#fff;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
.page{position:absolute;inset:0;z-index:1;transition:opacity .25s ease;}
.page.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.top-bar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:50;font-size:11px;opacity:0.5;}
.video-wrap{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:1;overflow:hidden;}
video{width:100%;height:100%;object-fit:contain;display:block;}

.progress-bar{position:absolute;bottom:80px;left:16px;right:16px;height:30px;z-index:10;cursor:pointer;}
.progress-bg{position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;height:2px;background:rgba(255,255,255,.2);}
.progress-dot{position:absolute;top:50%;transform:translateY(-50%);width:12px;height:12px;background:#fff;border-radius:50%;margin-left:-6px;box-shadow:0 0 4px rgba(0,0,0,.5);}

.info-area{position:absolute;bottom:110px;left:16px;right:90px;z-index:5;}
.info-name{font-weight:bold;font-size:15px;margin-bottom:4px;cursor:pointer;}
.info-desc{font-size:13px;opacity:0.9;}

.side-buttons{position:absolute;right:12px;bottom:130px;display:flex;flex-direction:column;gap:20px;align-items:center;z-index:6;}
.side-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;user-select:none;}
.side-icon{font-size:28px;line-height:1;}
.side-label{font-size:10px;opacity:0.7;}
.avatar-box{width:44px;height:44px;border-radius:50%;border:2px solid #fff;overflow:hidden;position:relative;cursor:pointer;}
.avatar-box img{width:100%;height:100%;object-fit:cover;}
.avatar-plus{position:absolute;bottom:-2px;right:-2px;background:#ff3355;color:#fff;width:16px;height:16px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;display:flex;justify-content:space-around;align-items:center;background:#000;border-top:1px solid #222;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;user-select:none;}
.nav-icon{font-size:22px;line-height:1;}
.nav-add{width:46px;height:34px;background:#ff3355;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}

.profile-page{background:#000;color:#fff;overflow-y:auto;padding-bottom:80px;z-index:3;}
.profile-top{display:flex;align-items:center;justify-content:flex-end;padding:12px 16px;position:sticky;top:0;background:#000;}
.share-link{font-size:20px;cursor:pointer;}
.profile-head{text-align:center;padding:20px 16px;}
.profile-avatar-big{width:90px;height:90px;border-radius:50%;border:2px solid #fff;overflow:hidden;margin:0 auto 12px;position:relative;cursor:pointer;}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover;}
.profile-name-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:4px;cursor:pointer;}
.profile-name{font-size:20px;font-weight:bold;}
.profile-uname-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:16px;cursor:pointer;opacity:0.7;}
.profile-uname{font-size:14px;}
.edit-mark{color:#ff9500;font-size:14px;}
.profile-stats{display:flex;justify-content:center;gap:40px;margin-bottom:20px;}
.stat-col{text-align:center;}
.stat-num{font-weight:bold;font-size:18px;}
.stat-txt{font-size:11px;color:#888;}
.videos-head{padding:0 16px 8px;font-weight:bold;text-align:left;}
.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 20px;}
.video-card{aspect-ratio:9/12;background:#1a1a1a;border-radius:4px;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.video-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.play-icon{font-size:24px;color:#fff;opacity:0.8;z-index:1;pointer-events:none;}
.del-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:2;}
.empty-text{grid-column:1/-1;text-align:center;padding:60px 20px;color:#666;}

.hidden-input{display:none;}
</style>
</head>
<body>
<input type="file" id="avatarInput" accept="image/*" class="hidden-input">
<input type="file" id="videoInput" accept="video/*" class="hidden-input">

<!-- หน้าแรก -->
<div class="page" id="homePage">
  <div class="top-bar">v1193</div>
  <div class="video-wrap" id="videoSwipeArea">
    <video id="mainVideo" playsinline webkit-playsinline loop muted></video>
    <div class="progress-bar" id="progressBar">
      <div class="progress-bg"></div>
      <div class="progress-dot" id="progressDot"></div>
    </div>
  </div>
  <div class="info-area">
    <div class="info-name" id="dispUname">@Thaipodee-Master-No.1</div>
    <div class="info-desc">สไลด์ขึ้น=วิดีโอถัดไป | สไลด์ลง=ย้อนกลับ</div>
  </div>

  <div class="side-buttons">
    <div class="side-btn" data-go="profile">
      <div class="avatar-box" id="avSideBtn">
        <img id="avSideImg" src="" alt="ฉัน">
        <span class="avatar-plus">+</span>
      </div>
    </div>
    <div class="side-btn" id="likeBtn">
      <span class="side-icon" id="likeIcon">🤍</span>
      <span class="side-label" id="likeCount">0</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">💬</span>
      <span class="side-label">0</span>
    </div>
    <div class="side-btn" id="saveBtn">
      <span class="side-icon" id="saveIcon">⬜</span>
      <span class="side-label">บันทึก</span>
    </div>
    <div class="side-btn" id="shareBtn">
      <span class="side-icon">↗️</span>
      <span class="side-label">แชร์</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">🎵</span>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-btn" data-go="home"><span class="nav-icon">🏠</span></div>
    <div class="nav-btn" data-go="shop"><span class="nav-icon">🛒</span></div>
    <div class="nav-btn" id="upBtn"><span class="nav-add">+</span></div>
    <div class="nav-btn" data-go="msg"><span class="nav-icon">💬</span></div>
    <div class="nav-btn" data-go="profile"><span class="nav-icon">👤</span></div>
  </div>
</div>

<!-- หน้าโปรไฟล์ -->
<div class="page hidden profile-page" id="profilePage">
  <div class="profile-top">
    <span class="share-link" id="shareProf">↗️</span>
  </div>
  <div class="profile-head">
    <div class="profile-avatar-big" id="avBigBtn">
      <img id="avBigImg" src="" alt="ฉัน">
      <span class="avatar-plus">+</span>
    </div>
    <div class="profile-name-row" id="nameRow">
      <span class="profile-name" id="pName">Thaipodee-Master</span>
      <span class="edit-mark">✏️</span>
    </div>
    <div class="profile-uname-row" id="unameRow">
      <span class="profile-uname" id="pUname">@Thaipodee-Master-No.1</span>
      <span class="edit-mark">✏️</span>
    </div>
    <div class="profile-stats">
      <div class="stat-col"><div class="stat-num">9</div><div class="stat-txt">ติดตาม</div></div>
      <div class="stat-col"><div class="stat-num" id="follCount">0</div><div class="stat-txt">ผู้ติดตาม</div></div>
      <div class="stat-col"><div class="stat-num" id="totalLike">0</div><div class="stat-txt">ถูกใจ</div></div>
    </div>
  </div>
  <div class="videos-head">วิดีโอของฉัน</div>
  <div class="video-grid" id="vidGrid"></div>

  <div class="bottom-nav">
    <div class="nav-btn" data-go="home"><span class="nav-icon">🏠</span></div>
    <div class="nav-btn" data-go="shop"><span class="nav-icon">🛒</span></div>
    <div class="nav-btn" id="upBtn2"><span class="nav-add">+</span></div>
    <div class="nav-btn" data-go="msg"><span class="nav-icon">💬</span></div>
    <div class="nav-btn" data-go="profile" style="opacity:1;"><span class="nav-icon">👤</span></div>
  </div>
</div>

<script>
const K = {
  av: 'tp_av',
  name: 'tp_name',
  uname: 'tp_uname',
  vids: 'tp_vids',
  likes: 'tp_likes'
};

let vidList = JSON.parse(localStorage.getItem(K.vids) || '[]');
let totalLikes = parseInt(localStorage.getItem(K.likes) || '0');
let isLiked = false;
let isDrag = false;
let saved = false;
let currentIndex = 0;

// ===ซิงค์ทุกจุด===
function syncAll(){
  const n = localStorage.getItem(K.name) || 'Thaipodee-Master';
  const u = localStorage.getItem(K.uname) || '@Thaipodee-Master-No.1';
  const av = localStorage.getItem(K.av);

  document.getElementById('pName').textContent = n;
  document.getElementById('pUname').textContent = u;
  document.getElementById('dispUname').textContent = u;

  const defAv = '';
  document.getElementById('avSideImg').src = av || defAv;
  document.getElementById('avBigImg').src = av || defAv;

  document.getElementById('likeCount').textContent = totalLikes;
  document.getElementById('totalLike').textContent = totalLikes;
}

// ===สลับหน้า===
function goPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
  if(p==='home') document.getElementById('homePage').classList.remove('hidden');
  if(p==='profile'){
    document.getElementById('profilePage').classList.remove('hidden');
    renderVids();
  }
}
document.querySelectorAll('[data-go]').forEach(b=>{
  b.addEventListener('click', ()=>goPage(b.dataset.go));
});

// ===เปลี่ยนรูปโปรไฟล์===
document.getElementById('avSideBtn').addEventListener('click', ()=>avatarInput.click());
document.getElementById('avBigBtn').addEventListener('click', ()=>avatarInput.click());
document.getElementById('avatarInput').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{
    localStorage.setItem(K.av, ev.target.result);
    syncAll();
  };
  r.readAsDataURL(f);
});

// ===เปลี่ยนชื่อ===
document.getElementById('nameRow').addEventListener('click', ()=>{
  const curr = localStorage.getItem(K.name) || 'Thaipodee-Master';
  const n = prompt('เปลี่ยนชื่อ', curr);
  if(n && n.trim()){
    localStorage.setItem(K.name, n.trim());
    syncAll();
  }
});
document.getElementById('unameRow').addEventListener('click', ()=>{
  const curr = (localStorage.getItem(K.uname) || '@Thaipodee-Master-No.1').replace('@','');
  const u = prompt('เปลี่ยนชื่อผู้ใช้', curr);
  if(u && u.trim()){
    localStorage.setItem(K.uname, '@'+u.trim());
    syncAll();
  }
});

// ===เล่นวิดีโอตามลำดับ===
function playVideoAt(index){
  if(!vidList.length) return;
  if(index < 0) index = vidList.length - 1;
  if(index >= vidList.length) index = 0;
  currentIndex = index;
  
  const video = document.getElementById('mainVideo');
  video.src = vidList[index].url;
  video.load();
  video.play();
}

// ===สร้างรูปปกวิดีโอ===
function getVideoThumbnail(url){
  return new Promise(resolve=>{
    const v = document.createElement('video');
    v.src = url;
    v.crossOrigin = 'anonymous';
    v.currentTime = 1;
    v.addEventListener('loadeddata', ()=>{
      const c = document.createElement('canvas');
      c.width = 200;
      c.height = 267;
      const ctx = c.getContext('2d');
      ctx.drawImage(v, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/png'));
    });
    v.addEventListener('error', ()=>resolve(''));
  });
}

// ===อัปโหลดวิดีโอ===
document.getElementById('upBtn').addEventListener('click', ()=>videoInput.click());
document.getElementById('upBtn2').addEventListener('click', ()=>videoInput.click());
document.getElementById('videoInput').addEventListener('change', async e=>{
  const f = e.target.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  const thumb = await getVideoThumbnail(url);
  
  vidList.unshift({id:Date.now().toString(), name:f.name, url:url, thumb:thumb});
  localStorage.setItem(K.vids, JSON.stringify(vidList));
  
  currentIndex = 0;
  playVideoAt(0);
  goPage('home');
});

// ===แสดงรายการวิดีโอ===
async function renderVids(){
  const g = document.getElementById('vidGrid');
  g.innerHTML = '';
  if(!vidList.length){
    g.innerHTML='<div class="empty-text">ยังไม่มีวิดีโอ กด + เพิ่มได้เลย</div>';
    return;
  }
  for(let i=0; i<vidList.length; i++){
    const v = vidList[i];
    if(!v.thumb) v.thumb = await getVideoThumbnail(v.url);
    
    const c = document.createElement('div');
    c.className='video-card';
    c.innerHTML = v.thumb 
      ? `<img class="video-thumb" src="${v.thumb}" alt="">
         <span class="play-icon">▶</span>
         <button class="del-btn">×</button>`
      : `<span class="play-icon">▶</span>
         <button class="del-btn">×</button>`;
    
    c.addEventListener('click', e=>{
      if(e.target.classList.contains('del-btn')) return;
      playVideoAt(i);
      goPage('home');
    });
    
    c.querySelector('.del-btn').addEventListener('click', e=>{
      e.stopPropagation();
      if(confirm('ลบวิดีโอนี้?')){
        vidList.splice(i,1);
        if(currentIndex >= vidList.length) currentIndex = Math.max(0, vidList.length - 1);
        localStorage.setItem(K.vids, JSON.stringify(vidList));
        renderVids();
        if(vidList.length) playVideoAt(currentIndex);
      }
    });
    
    g.appendChild(c);
  }
}

// ==============================================================
// ✅ ปรับปรุง: สไลด์ขึ้น-ลงเปลี่ยนวิดีโอ — แก้เฉพาะส่วนนี้
// ==============================================================
let touchStartY = 0;
let touchStartTime = 0;
const SWIPE_THRESHOLD = 60;  // ปรับเกณฑ์ให้ชัดเจนขึ้น
const TIME_THRESHOLD = 300;  // มิลลิวินาที — สไลด์เร็วในเวลานี้เท่านั้น

document.getElementById('videoSwipeArea').addEventListener('touchstart', e=>{
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
}, {passive:true});

document.getElementById('videoSwipeArea').addEventListener('touchend', e=>{
  if(!vidList.length) return;
  
  const touchEndY = e.changedTouches[0].clientY;
  const touchEndTime = Date.now();
  const diffY = touchStartY - touchEndY;
  const elapsed = touchEndTime - touchStartTime;
  
  // ต้องเป็นสไลด์เร็วและระยะพอสมควร
  if(elapsed > TIME_THRESHOLD && Math.abs(diffY) < SWIPE_THRESHOLD) return;
  
  if(diffY > 0){
    // ✅ สไลด์ขึ้น → วิดีโอถัดไป
    playVideoAt(currentIndex + 1);
  }else if(diffY < 0){
    // ✅ สไลด์ลง → ย้อนกลับวิดีโอก่อนหน้า
    playVideoAt(currentIndex - 1);
  }
}, {passive:true});

// ===แชร์===
async function share(){
  if(navigator.share){
    try{await navigator.share({title:'ThaiPodee', url:location.href});}
    catch{await navigator.clipboard.writeText(location.href);alert('คัดลอกลิงก์แล้ว ✅');}
  }else{
    await navigator.clipboard.writeText(location.href);
    alert('คัดลอกลิงก์แล้ว ✅');
  }
}
document.getElementById('shareBtn').addEventListener('click', share);
document.getElementById('shareProf').addEventListener('click', share);

// ===แถบเวลา===
const video = document.getElementById('mainVideo');
const dot = document.getElementById('progressDot');

video.addEventListener('timeupdate', ()=>{
  if(!video.duration || isDrag) return;
  const p = video.currentTime / video.duration;
  dot.style.left = (p*100)+'%';
});

function seekTo(x){
  if(!video.duration) return;
  const bar = document.getElementById('progressBar');
  const r = bar.getBoundingClientRect();
  let p = (x - r.left) / r.width;
  p = Math.max(0, Math.min(1, p));
  video.currentTime = p * video.duration;
  dot.style.left = (p*100)+'%';
}

document.getElementById('progressBar').addEventListener('mousedown', e=>{isDrag=true;seekTo(e.clientX);});
document.getElementById('progressBar').addEventListener('touchstart', e=>{isDrag=true;seekTo(e.touches[0].clientX);}, {passive:true});
document.addEventListener('mousemove', e=>{if(!isDrag)return;seekTo(e.clientX);});
document.addEventListener('touchmove', e=>{if(!isDrag)return;seekTo(e.touches[0].clientX);}, {passive:true});
document.addEventListener('mouseup', ()=>isDrag=false);
document.addEventListener('touchend', ()=>isDrag=false);

// ===แตะจอ เล่น/หยุด===
document.getElementById('videoSwipeArea').addEventListener('click', e=>{
  if(e.target.closest('.progress-bar')) return;
  if(video.paused || video.muted){
    video.muted = false;
    video.play();
  }else{
    video.pause();
  }
});

// ===ถูกใจ===
document.getElementById('likeBtn').addEventListener('click', ()=>{
  isLiked = !isLiked;
  totalLikes += isLiked ? 1 : -1;
  localStorage.setItem(K.likes, totalLikes);
  document.getElementById('likeIcon').textContent = isLiked ? '❤️' : '🤍';
  syncAll();
});

// ===บันทึก===
document.getElementById('saveBtn').addEventListener('click', ()=>{
  saved = !saved;
  document.getElementById('saveIcon').textContent = saved ? '⬛' : '⬜';
});

// ===เริ่มทำงาน===
syncAll();
if(vidList.length) playVideoAt(0);
</script>
</body>
</html>
