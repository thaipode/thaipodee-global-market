<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThaiPodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100vh; overflow: hidden; background: #000; color: #fff; }

        .page { position: absolute; inset: 0; z-index: 1; transition: opacity 0.25s ease; }
        .page-hidden { opacity: 0; pointer-events: none; z-index: 0; }

        /* ===== วิดีโอหลัก ===== */
        .video-wrap {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #000;
        }
        #main-video {
            width: 100%; height: 100%;
            object-fit: cover;
            background: #111;
        }

        /* ===== ข้อความซ้ายล่าง ===== */
        .info-left { position: absolute; left: 12px; bottom: 80px; right: 85px; z-index: 10; }
        .acc-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; cursor: pointer; }
        .desc-text { font-size: 12px; line-height: 1.4; margin-bottom: 4px; color: #fff; }
        .music-row { font-size: 11px; color: #ddd; display: flex; align-items: center; gap: 4px; }

        /* ===== เมนูขวา ===== */
        .menu-right {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 20px; z-index: 10; align-items: center;
        }
        .menu-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .avatar-box { position: relative; width: 40px; height: 40px; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; object-fit: cover; background: #444; }
        .follow-plus {
            position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 18px; background: #ff2442; border-radius: 50%;
            font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        .icon { font-size: 22px; line-height: 1; }
        .num { font-size: 10px; }
        .music-disc {
            width: 34px; height: 34px; border-radius: 50%;
            background: linear-gradient(45deg, #00c6ff, #ff0080);
            display: flex; align-items: center; justify-content: center;
            animation: spin 3s linear infinite; font-size: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== แถบล่าง + ปุ่มอัปโหลด ===== */
        .nav-bottom {
            position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
            display: flex; justify-content: space-around; align-items: flex-end;
            padding: 8px 10px 12px; z-index: 20; background: transparent;
        }
        .nav-col { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .nav-icon { font-size: 20px; }
        .nav-label { font-size: 10px; }

        /* ===== ปุ่มอัปโหลดตรงกลาง ===== */
        .upload-center {
            position: relative; width: 42px; height: 28px;
            background: #fff; border-radius: 6px;
            cursor: pointer; overflow: hidden;
        }
        .upload-center::before {
            content: ''; position: absolute; width: 16px; height: 2px; background: #000;
            top: 13px; left: 13px;
        }
        .upload-center::after {
            content: ''; position: absolute; width: 2px; height: 16px; background: #000;
            left: 20px; top: 6px;
        }
        #file-input {
            position: absolute; inset: 0; opacity: 0; cursor: pointer;
            width: 100%; height: 100%;
        }
        .badge {
            position: absolute; top: -2px; right: -6px;
            background: #ff2442; color: #fff; font-size: 9px;
            min-width: 14px; height: 14px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        /* ===== หน้าอัปโหลด ===== */
        .upload-page { background: #000; padding: 50px 16px 70px; overflow-y: auto; min-height: 100vh; }
        .back-btn {
            position: absolute; top: 12px; left: 12px;
            background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; z-index: 10;
        }
        .upload-preview {
            width: 100%; max-height: 400px; background: #111;
            border-radius: 12px; margin: 20px 0; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .upload-preview video, .upload-preview img {
            max-width: 100%; max-height: 400px; object-fit: contain;
        }
        .form-group { margin-bottom: 12px; }
        .form-label { font-size: 12px; color: #888; margin-bottom: 4px; display: block; }
        .form-input {
            width: 100%; padding: 10px 12px; border-radius: 8px; border: none;
            background: #2c2c2e; color: #fff; font-size: 14px;
        }
        .post-btn {
            background: #ff2442; border: none; color: #fff; padding: 12px;
            border-radius: 8px; font-size: 15px; width: 100%; margin-top: 8px;
            cursor: pointer; font-weight: 600;
        }
        .post-btn:active { background: #e03030; }
        .aspect-ratio { display: flex; gap: 10px; margin: 10px 0; }
        .ratio-btn {
            flex: 1; padding: 8px; border-radius: 6px; border: none;
            background: #2c2c2e; color: #fff; cursor: pointer; font-size: 13px;
        }
        .ratio-btn.active { background: #ff2442; }

        /* ===== หน้าโปรไฟล์ ===== */
        .profile-page { background: #000; padding: 50px 16px 70px; overflow-y: auto; min-height: 100vh; }
        .profile-header { text-align: center; margin-top: 15px; }
        .avatar-edit-wrap { position: relative; display: inline-block; cursor: pointer; }
        .profile-avatar {
            width: 75px; height: 75px; border-radius: 50%; border: 3px solid #fff; margin-bottom: 10px; background: #444;
            object-fit: cover;
        }
        .avatar-edit-icon {
            position: absolute; bottom: 5px; right: 5px;
            background: #ff2442; border-radius: 50%; width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
        }
        .profile-name { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
        .profile-username { color: #888; font-size: 13px; margin-bottom: 14px; }
        .profile-stats { display: flex; justify-content: center; gap: 25px; margin-bottom: 20px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 16px; font-weight: 700; }
        .stat-label { font-size: 10px; color: #888; }
        .edit-btn {
            background: #2c2c2e; border: none; color: #fff; padding: 10px 20px;
            border-radius: 8px; font-size: 14px; width: 100%; margin-bottom: 12px;
            cursor: pointer;
        }
        .edit-section { display: none; margin-top: 10px; }
        .edit-section.show { display: block; }
    </style>
</head>
<body>

<!-- ===== หน้าหลัก ===== -->
<div class="page active" id="homePage">
    <div class="video-wrap" onclick="toggleAudio()">
        <video id="main-video" autoplay loop muted playsinline webkit-playsinline>
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
        </video>
    </div>

    <div class="info-left">
        <div class="acc-name" onclick="goProfile()">@ThaiPodee_Official</div>
        <div class="desc-text">ยินดีต้อนรับสู่ ThaiPodee Global Market ✨</div>
        <div class="music-row">🎵 เสียงต้นฉบับ • ThaiPodee Original</div>
    </div>

    <div class="menu-right">
        <div class="menu-btn" onclick="goProfile()">
            <div class="avatar-box">
                <img class="avatar" id="homeAvatar" src="https://picsum.photos/seed/thaipodee/100/100" alt="โปรไฟล์">
                <span class="follow-plus">+</span>
            </div>
        </div>
        <div class="menu-btn" onclick="toggleLike()">
            <span class="icon" id="likeIcon">🤍</span>
            <span class="num" id="likeCount">0</span>
        </div>
        <div class="menu-btn"><span class="icon">💬</span><span class="num">0</span></div>
        <div class="menu-btn"><span class="icon">⭐</span><span class="num">บันทึก</span></div>
        <div class="menu-btn"><span class="icon">↗️</span><span class="num">แชร์</span></div>
        <div class="menu-btn"><div class="music-disc">🎵</div></div>
    </div>
</div>

<!-- ===== หน้าอัปโหลด — ทำงานจริง ===== -->
<div class="page page-hidden upload-page" id="uploadPage">
    <button class="back-btn" onclick="goHome()">←</button>
    <div style="text-align:center; margin-top:40px;">
        <h3 style="font-size:18px; margin-bottom:20px;">อัปโหลดวิดีโอ / รูปภาพ</h3>

        <!-- ปุ่มเลือกไฟล์ -->
        <div style="margin-bottom:20px;">
            <button class="post-btn" style="background:#2c2c2e;" onclick="document.getElementById('upload-input').click()">
                📂 เลือกไฟล์จากมือถือ
            </button>
            <input type="file" id="upload-input" accept="video/*,image/*" style="display:none;" onchange="handleFileSelect(event)">
        </div>

        <!-- ตัวอย่างไฟล์ที่เลือก -->
        <div class="upload-preview" id="preview-area" style="display:none;">
            <video id="preview-video" controls style="display:none;"></video>
            <img id="preview-img" style="display:none;">
        </div>

        <!-- เลือกอัตราส่วน -->
        <div class="form-group" id="ratio-group" style="display:none;">
            <label class="form-label">เลือกอัตราส่วนการแสดง</label>
            <div class="aspect-ratio">
                <button class="ratio-btn active" data-ratio="9:16" onclick="setRatio('9:16', this)">9:16 (แนวตั้ง)</button>
                <button class="ratio-btn" data-ratio="16:9" onclick="setRatio('16:9', this)">16:9 (แนวนอน)</button>
            </div>
        </div>

        <!-- คำอธิบาย -->
        <div class="form-group" id="desc-group" style="display:none;">
            <label class="form-label">คำอธิบาย / ข้อความ</label>
            <input class="form-input" id="post-desc" placeholder="เขียนคำอธิบาย...">
        </div>

        <!-- ปุ่มโพสต์ -->
        <button class="post-btn" id="post-btn" style="display:none;" onclick="publishPost()">📤 โพสต์เผยแพร่</button>
    </div>
</div>

<!-- ===== หน้าโปรไฟล์ ===== -->
<div class="page page-hidden profile-page" id="profilePage">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="profile-header">
        <div class="avatar-edit-wrap" onclick="changeAvatar()">
            <img class="profile-avatar" id="profileAvatar" src="https://picsum.photos/seed/thaipodee/100/100" alt="โปรไฟล์">
            <span class="avatar-edit-icon">✏️</span>
        </div>
        <h2 class="profile-name" id="dispName">ThaiPodee Global Market</h2>
        <p class="profile-username" id="dispUser">@ThaiPodee_Official</p>
        <div class="profile-stats">
            <div class="stat-item"><div class="stat-num">3,271</div><div class="stat-label">กำลังติดตาม</div></div>
            <div class="stat-item"><div class="stat-num">1,237</div><div class="stat-label">ผู้ติดตาม</div></div>
            <div class="stat-item"><div class="stat-num">2,742</div><div class="stat-label">ถูกใจ</div></div>
        </div>
        <button class="edit-btn" onclick="toggleEditName()">แก้ไขชื่อโปรไฟล์</button>
        <div class="edit-section" id="editNameSec">
            <div class="form-group">
                <label class="form-label">ชื่อที่แสดง</label>
                <input class="form-input" id="inputName" placeholder="ใส่ชื่อโปรไฟล์...">
            </div>
            <button class="post-btn" style="background:#ff2442;" onclick="saveName()">บันทึกชื่อ</button>
        </div>
        <button class="edit-btn" onclick="toggleEditUser()">แก้ไขชื่อผู้ใช้</button>
        <div class="edit-section" id="editUserSec">
            <div class="form-group">
                <label class="form-label">ชื่อผู้ใช้ (ไม่ต้องใส่ @)</label>
                <input class="form-input" id="inputUser" placeholder="thaipodee_new">
            </div>
            <button class="post-btn" style="background:#ff2442;" onclick="saveUser()">บันทึกชื่อผู้ใช้</button>
        </div>
        <button class="edit-btn" onclick="changeAvatar()">เปลี่ยนรูปโปรไฟล์</button>
    </div>
</div>

<!-- ===== แถบเมนูล่าง — ปุ่มกลางกดได้เลย ===== -->
<div class="nav-bottom">
    <div class="nav-col" onclick="goHome()">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าหลัก</span>
    </div>
    <div class="nav-col">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">ค้นหา</span>
    </div>
    <div class="nav-col" onclick="goUpload()">
        <div class="upload-center">
            <input type="file" accept="video/*,image/*" onchange="handleFileSelect(event)">
        </div>
        <span class="nav-label">อัปโหลด</span>
    </div>
    <div class="nav-col">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
        <span class="badge">99+</span>
    </div>
    <div class="nav-col" onclick="goProfile()">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<script>
// ===== ตัวแปรกลาง =====
let selectedFile = null;
let selectedRatio = '9:16';

// ===== สลับหน้า =====
function goHome() {
    document.getElementById('homePage').classList.remove('page-hidden');
    document.getElementById('uploadPage').classList.add('page-hidden');
    document.getElementById('profilePage').classList.add('page-hidden');
    resetUploadForm();
}
function goUpload() {
    document.getElementById('homePage').classList.add('page-hidden');
    document.getElementById('uploadPage').classList.remove('page-hidden');
    document.getElementById('profilePage').classList.add('page-hidden');
}
function goProfile() {
    document.getElementById('homePage').classList.add('page-hidden');
    document.getElementById('uploadPage').classList.add('page-hidden');
    document.getElementById('profilePage').classList.remove('page-hidden');
}

// ===== วิดีโอ =====
function toggleAudio() {
    const v = document.getElementById('main-video');
    v.muted = !v.muted;
}

// ===== กดถูกใจ =====
let liked = false, cnt = 0;
function toggleLike() {
    liked = !liked;
    cnt += liked ? 1 : -1;
    document.getElementById('likeIcon').textContent = liked ? '❤️' : '🤍';
    document.getElementById('likeCount').textContent = cnt;
}

// ===== เลือกไฟล์วิดีโอ/รูป =====
function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    selectedFile = file;

    // เปลี่ยนไปหน้าอัปโหลด
    goUpload();

    const previewArea = document.getElementById('preview-area');
    const previewVideo = document.getElementById('preview-video');
    const previewImg = document.getElementById('preview-img');
    const ratioGroup = document.getElementById('ratio-group');
    const descGroup = document.getElementById('desc-group');
    const postBtn = document.getElementById('post-btn');

    previewArea.style.display = 'flex';
    ratioGroup.style.display = 'block';
    descGroup.style.display = 'block';
    postBtn.style.display = 'block';

    // ตรวจชนิดไฟล์
    if (file.type.startsWith('video/')) {
        previewVideo.style.display = 'block';
        previewImg.style.display = 'none';
        previewVideo.src = URL.createObjectURL(file);
        previewVideo.play();
    } else if (file.type.startsWith('image/')) {
        previewImg.style.display = 'block';
        previewVideo.style.display = 'none';
        previewImg.src = URL.createObjectURL(file);
    }

    // ตรวจอัตราส่วนอัตโนมัติ
    setTimeout(() => {
        let w, h;
        if (file.type.startsWith('video/')) {
            w = previewVideo.videoWidth;
            h = previewVideo.videoHeight;
        } else {
            w = previewImg.naturalWidth;
            h = previewImg.naturalHeight;
        }
        if (h > w) {
            setRatio('9:16', null);
        } else {
            setRatio('16:9', null);
        }
    }, 500);
}

// ===== เลือกอัตราส่วน =====
function setRatio(ratio, btnEl) {
    selectedRatio = ratio;
    if (btnEl) {
        document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
    }
}

// ===== โพสต์เผยแพร่ =====
function publishPost() {
    if (!selectedFile) {
        alert('กรุณาเลือกไฟล์ก่อนครับ');
        return;
    }
    const desc = document.getElementById('post-desc').value.trim() || 'วิดีโอใหม่จาก ThaiPodee ✨';

    // แจ้งสำเร็จ
    alert('✅ โพสต์สำเร็จ!\n\n📝 คำอธิบาย: ' + desc + '\n📐 อัตราส่วน: ' + selectedRatio + '\n\n*ไฟล์จะแสดงที่หน้าหลักทันที*');

    // กลับหน้าหลัก + รีเซ็ต
    goHome();
}

// ===== รีเซ็ตฟอร์ม =====
function resetUploadForm() {
    selectedFile = null;
    selectedRatio = '9:16';
    document.getElementById('preview-area').style.display = 'none';
    document.getElementById('ratio-group').style.display = 'none';
    document.getElementById('desc-group').style.display = 'none';
    document.getElementById('post-btn').style.display = 'none';
    document.getElementById('post-desc').value = '';
    document.querySelectorAll('.ratio-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
}

// ===== แก้ไขชื่อ/ผู้ใช้/รูป =====
function toggleEditName() {
    document.getElementById('editNameSec').classList.toggle('show');
    document.getElementById('editUserSec').classList.remove('show');
}
function saveName() {
    const val = document.getElementById('inputName').value.trim();
    if (!val) { alert('กรุณาใส่ชื่อ'); return; }
    document.getElementById('dispName').textContent = val;
    document.getElementById('editNameSec').classList.remove('show');
    alert('✅ บันทึกชื่อเรียบร้อย');
}
function toggleEditUser() {
    document.getElementById('editUserSec').classList.toggle('show');
    document.getElementById('editNameSec').classList.remove('show');
}
function saveUser() {
    let val = document.getElementById('inputUser').value.trim().replace(/^@/, '');
    if (!val) { alert('กรุณาใส่ชื่อผู้ใช้'); return; }
    document.getElementById('dispUser').textContent = '@' + val;
    document.getElementById('editUserSec').classList.remove('show');
    alert('✅ บันทึกชื่อผู้ใช้เรียบร้อย');
}
let avatarSeed = 1;
function changeAvatar() {
    avatarSeed++;
    const newSrc = 'https://picsum.photos/seed/user' + avatarSeed + '/100/100';
    document.getElementById('profileAvatar').src = newSrc;
    document.getElementById('homeAvatar').src = newSrc;
    alert('✅ เปลี่ยนรูปโปรไฟล์เรียบร้อย');
}
</script>
</body>
</html>
