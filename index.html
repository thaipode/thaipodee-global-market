<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .sync-status { padding: 8px 12px; border-radius: 6px; margin: 8px; font-size: 13px; }
  .sync-online { background: #062e1f; color: #4ade80; }
  .sync-offline { background: #2e1f06; color: #facc15; }

<body>

<!-- หน้าแรก -->
<div id="page-home">
  <div id="sync-status-bar" class="sync-status sync-offline">กำลังตรวจสอบการเชื่อมต่อ...</div>
  <h2 class="px-4 pt-4 pb-2 text-lg font-bold">วิดีโอล่าสุด</h2>

    <div class="text-center text-gray-500 py-10">รอโหลดข้อมูล...</div>
  </div>
</div>

<!-- หน้าโปรไฟล์/ประวัติ -->
<div id="page-profile" class="hide">
  <div class="p-4">
    <div class="flex items-center gap-4 mb-4">
      <div class="w-16 h-16 rounded-full bg-gray-700 flex items-center justify-center text-2xl">👤</div>
      <div>
        <h2 class="text-xl font-bold">thaipodee</h2>
        <div class="flex gap-6 mt-2 text-sm">
          <div><span id="postCount">0</span> โพสต์</div>
          <div>0 ผู้ติดตาม</div>
          <div>0 กำลังติดตาม</div>
        </div>
      </div>
    </div>
    <div id="profile-sync-status" class="sync-status sync-offline mb-4">กำลังโหลดจากคลาวด์...</div>
    <h3 class="font-bold mb-2">ประวัติการโพสต์</h3>
    <div id="profile-posts" class="pb-20">
      <div class="text-center text-gray-500 py-6">ยังไม่มีโพสต์</div>
    </div>
  </div>
</div>

<!-- ปุ่มอัปโหลด -->
<button id="uploadBtn" class="upload-btn">+</button>
<input type="file" id="fileInput" accept="video/*" class="hidden">

<!-- แถบเมนูล่าง -->
<nav class="bottom-nav">
  <button class="nav-item active" data-page="home">
    <span>🏠</span>
    <span>หน้าแรก</span>
  </button>
  <button class="nav-item" data-page="discover">
    <span>🔍</span>
    <span>ค้นหา</span>
  </button>
  <button class="nav-item" data-page="message">
    <span>💬</span>
    <span>ข้อความ</span>
  </button>
  <button class="nav-item" data-page="profile">
    <span>👤</span>
    <span>โปรไฟล์</span>
  </button>
</nav>

<script>
// ===== ตั้งค่าเชื่อมต่อคลาวด์ — อัปเดตใหม่ 22 ก.ย. 69 =====
const CLOUD_NAME = 'orjpytt';
const UPLOAD_PRESET = 'thaipodee';
const DB_URL = 'https://api.jsonbin.io/v3/b/6ab260effd5d1605322b4d5';
const DB_KEY = '$2a$10$4D792tmzHDuRi0KlueV9VeTWaxi9ZcVQA3JEgZnaWR183JGLm.otW';

let posts = [];
let currentPage = 'home';

// ===== แสดงข้อความสถานะเชื่อมต่อ =====
function setSyncStatus(mode, text) {
  const statusEls = [
    document.getElementById('sync-status-bar'),
    document.getElementById('profile-sync-status')
  ];
  statusEls.forEach(el => {
    if (!el) return;
    el.className = `sync-status ${mode === 'online' ? 'sync-online' : 'sync-offline'}`;
    el.textContent = text;
  });
}

// ===== โหลดข้อมูลจากคลาวด์ =====
async function loadFromCloud() {
  try {
    const res = await fetch(`${DB_URL}/latest`, {
      headers: { 'X-Master-Key': DB_KEY }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.record && Array.isArray(data.record.posts)) {
      posts = data.record.posts;
      saveToLocal(); // สำรองไว้ในเครื่อง
      setSyncStatus('online', `✅ ซิงค์ล่าสุด — ${posts.filter(p => !p.deleted).length} โพสต์`);
      renderAll();
      return true;
    }
  } catch (err) {
    console.warn('ติดต่อคลาวด์ไม่ได้ ใช้ข้อมูลในเครื่อง:', err.message);
    loadFromLocal();
    setSyncStatus('offline', '⚠️ ออฟไลน์ — แสดงเฉพาะในเครื่อง');
    return false;
  }
}

// ===== บันทึกขึ้นคลาวด์ =====
async function saveToCloud() {
  try {
    await fetch(DB_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': DB_KEY
      },
      body: JSON.stringify({
        posts: posts,
        updated: new Date().toISOString()
      })
    });
    setSyncStatus('online', `✅ ซิงค์ล่าสุด — ${posts.filter(p => !p.deleted).length} โพสต์`);
    return true;
  } catch (err) {
    console.warn('ส่งข้อมูลขึ้นคลาวด์ไม่ได้:', err);
    return false;
  }
}

// ===== บันทึก/โหลดในเครื่อง (สำรอง) =====
function saveToLocal() {
  localStorage.setItem('thaipodee_posts', JSON.stringify(posts));
}
function loadFromLocal() {
  const saved = localStorage.getItem('thaipodee_posts');
  if (saved) posts = JSON.parse(saved);
}

// ===== อัปโหลดวิดีโอ =====
document.getElementById('uploadBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', UPLOAD_PRESET);

  try {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    
    const newPost = {
      id: Date.now(),
      url: data.secure_url,
      thumb: data.thumbnail_url || data.secure_url,
      name: file.name,
      size: (file.size / 1024 / 1024).toFixed(2) + ' MB',
      time: new Date().toLocaleString('th-TH'),
      deleted: false
    };

    posts.unshift(newPost);
    saveToLocal();
    await saveToCloud();
    renderAll();
    alert('✅ เผยแพร่สำเร็จ!');
  } catch (err) {
    alert('❌ อัปโหลดไม่สำเร็จ: ' + err.message);
  }
  e.target.value = '';
});

// ===== ลบโพสต์ =====
window.deletePost = async function(id) {
  if (!confirm('ลบโพสต์นี้?')) return;
  const post = posts.find(p => p.id === id);
  if (post) {
    post.deleted = true;
    saveToLocal();
    await saveToCloud();
    renderAll();
  }
};

// ===== แสดงผลทั้งหมด =====
function renderAll() {
  renderFeed();
  renderProfile();
}

// ===== แสดงหน้าแรก =====
function renderFeed() {
  const list = document.getElementById('feed-list');
  const active = posts.filter(p => !p.deleted);
  
  if (active.length === 0) {
    list.innerHTML = '<div class="text-center text-gray-500 py-10">ยังไม่มีโพสต์ เป็นคนแรกที่แชร์นะ!</div>';
    return;
  }

  list.innerHTML = active.map(p => `
    <div class="post-item">
      <video class="video-cover" controls src="${p.url}" preload="metadata"></video>
      <div class="mt-2 text-sm text-gray-400">${p.name} · ${p.time}</div>
    </div>
  `).join('');
}

// ===== แสดงหน้าโปรไฟล์ =====
function renderProfile() {
  const list = document.getElementById('profile-posts');
  const active = posts.filter(p => !p.deleted);
  
  document.getElementById('postCount').textContent = active.length;
  
  if (active.length === 0) {
    list.innerHTML = '<div class="text-center text-gray-500 py-6">ยังไม่มีโพสต์</div>';
    return;
  }

  list.innerHTML = active.map(p => `
    <div class="post-item flex gap-3">
      <video class="w-24 h-36 object-cover rounded bg-gray-800" controls src="${p.url}" preload="metadata"></video>
      <div class="flex-1">
        <div class="font-medium text-sm">${p.name}</div>
        <div class="text-xs text-gray-400 mt-1">${p.size} · ${p.time}</div>
        <button class="del-btn" onclick="deletePost(${p.id})">ลบ</button>
      </div>
    </div>
  `).join('');
}

// ===== สลับหน้า =====
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const page = btn.dataset.page;
    currentPage = page;
    
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    document.getElementById('page-home').classList.toggle('hide', page !== 'home');
    document.getElementById('page-profile').classList.toggle('hide', page !== 'profile');
    
    if (page === 'profile') renderProfile();
  });
});

// ===== เริ่มทำงาน =====
loadFromCloud();
</script>
