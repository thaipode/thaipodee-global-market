<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThaiPodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        html, body {
            height: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            color: #fff;
            position: fixed;
            inset: 0;
            width: 100%;
        }

        /* ===== SPLASH SCREEN ===== */
        #splash {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #splash.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .splash-logo {
            width: 120px; height: 120px; border-radius: 24px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 60px; font-weight: bold; margin-bottom: 20px;
        }
        .splash-title { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
        .splash-sub { font-size: 14px; color: #888; }

        /* ===== แถบแสดงขนาดจอ ===== */
        .screen-size-label {
            position: fixed; top: 0; left: 0; right: 0; height: 28px;
            background: rgba(0,0,0,.75); color: #0f0;
            font-size: 13px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            z-index: 999; letter-spacing: 1px;
        }

        /* ==============================================
           ✅ จอวิดีโอ/ภาพ อยู่ตรงกลางแบบยืดหยุ่น
           ============================================== */
        .media-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;

            /* ✅ ตรงกลางแนวนอน + ปรับแนวตั้งอัตโนมัติ */
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 0;
        }

        #main-media {
            /* ✅ ขยายเต็มพื้นที่ แต่ไม่ตัดภาพ */
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;

            /* ✅ ไม่ตัดภาพ ไม่บังส่วนไหน */
            object-fit: contain;

            /* ✅ ตรงกลางแน่นอน */
            object-position: center center;

            background: #000;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,.15) 0%, transparent 35%, transparent 65%, rgba(0,0,0,.6) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* 🔊 ปุ่มเปิด/ปิดเสียง */
        .sound-btn {
            position: fixed; right: 16px; top: 50%;
            transform: translateY(-50%);
            width: 44px; height: 44px;
            background: rgba(0,0,0,.5); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; z-index: 15; cursor:: pointer;
            border: 2px solid #fff;
        }

        /* ===== ชื่อวิดีโอ/บริษัท ===== */
        .text-overlay {
            position: fixed; bottom: 140px; left: 16px; right: 80px;
            font-size: 14px;
            font-weight: 500; color: #fff;
            text-shadow: 11px 1px 3px rgba(0,00,0,.9);
            z-index: 9; line-height: 1.5;
            transition: opacity 0.3s;
        }

        /* ===== กลุ่มชื่อผ用户 ===== */
        .user-info {
            position: fixed; left: 16px; right: 100px; bottom: 85px;
            z-index: 10;
        }
        .username {
            font-weight: 700; font-size: 16px;
            margin-bottom: 6px;
        }
        .caption {
            font-size: 13px; line-height: 1.5; margin-bottom: 8px;
            color: #e0e0e0;
        }
        .ai-tag {
            display: inline-block; background: rgba(255,255,255,.15);
            padding: 3px 10px; border-radius: 4px;
            font-size: 11px; color: #ddd;
        }

        /* ===== เมนูด้านขวา 6 ตัว ===== */
        .right-menu {
            position: fixed; right: 12px; bottom: 160px;
            display: flex; flex-direction: column; align-items: center;
            gap: 24px; z-index: 10;
        }
        .menu-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 2px; cursor: pointer;
        }
        .avatar-wrap { position: relative; width: 48px; height: 48px; }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid #fff; object-fit: cover;
        }
        .plus-btn {
            position: absolute; bottom: -4px; right: -4px;
            width: 20px; height: 20px; background: #ff2442;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; color: #fff;
        }
        .icon { font-size: 28px; }
        .count { font-size: 12px; font-weight: 500; }
        .music-icon {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(45deg, #00c6ff, #ff0080);
            display: flex; align-items: center; justify-content: center;
            animation: spin 3s linear infinite; font-size: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== เมนูด้านล่าง 5 ตัว ===== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 99;
            display: flex; justify-content: space-around; align-items: center;
            padding: 8px 0 25px; background: #000;
            border-top: 1px solid #222;
            height: 60px;
            /*<[SILENT_never_used_51bce0c785ca2f68081bfa7d91973934]>จอภาพหลักและวิดีโอให้แ<[SILENT_never_used_51bce0c785ca2f68081bfa7d91973934]>*/
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 2px; cursor: pointer; position: relative;
        }
        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 11px; color: #fff; }
        .nav-badge {
            position: absolute; top: -2px; right: -8px;
            background: #ff2442; color: #fff;
            font-size: 10px; min-width: 18px; height: 18px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700;
        }
        .nav-add {
            width: 45px; height: 32px; background: #fff;
            border-radius: 8px; position: relative; cursor: pointer;
        }
        .nav-add::before, .nav-add::after {
            content: ''; position: absolute; background: #000;
        }
        .nav-add::before { width: 18px; height: 2px; top: 15px; left: 13px; }
        .nav-add::after { width: 2px; height: 18px; left: 21px; top: 7px; }
        }

        #file-upload { display: none; }
    </style>
</head>
<body>
