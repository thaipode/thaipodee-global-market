<!-- ==============================================================
   ThaiPodee — หน้าแรก พอแล้ว
   24 ก.ย. 2569
   มี: เล่นวิดีโอได้ + ไอคอน 6 ขวา + 5 ล่าง + ทุกปุ่มทำงาน
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000">
<title>ThaiPodee</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#000;color:#fff;height:100vh;overflow:hidden}

/* พื้นที่วิดีโอ */
.video-box{position:fixed;inset:0 0 65px 0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.play-icon{font-size:60px;opacity:0.7}
.play-text{color:#777;font-size:14px;margin-top:10px}
.playing .play-icon{opacity:1}

/* ไอคอนขวา 6 ตัว แนวตั้ง */
.right{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:28px;align-items:center}
.r-btn{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:0;color:#fff;cursor:pointer}
.r-i{font-size:26px}
.r-n{font-size:11px;height:14px}

/* รูป+ปุ่มแดง */
.avt{position:relative;width:44px;height:44px}
.avt-c{width:44px;height:44px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff}
.plus-r{position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:50%;background:#ff2442;color:#fff;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #000}

/* แถบล่าง 5 ปุ่ม */
.btm{position:fixed;bottom:0;left:0;right:0;height:60px;background:#000;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #222}
.b-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:0;color:#fff;cursor:pointer}
.b-i{font-size:22px}
.b-t{font-size:10px;color:#aaa}
.b-btn.active .b-t{color:#fff}
.plus-c{width:46px;height:34px;background:#ff2442;border-radius:8px;font-size:24px;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<!-- พื้นที่วิดีโอ — กดเล่นได้ -->
<div class="video-box" id="vBox">
  <div style="text-align:center">
    <div class="play-icon" id="pIcon">▶</div>
    <p class="play-text" id="pText">กดเพื่อเล่นวิดีโอ</p>
  </div>
</div>

<!-- ไอคอนขวา 6 ตัว ตรงรูป -->
<div class="right">
  <button class="r-btn" id="b1">
    <div class="avt"><div class="avt-c">👤</div><div class="plus-r">+</div></div>
  </button>
  <button class="r-btn" id="b2">
    <span class="r-i" id="i2">🤍</span>
    <span class="r-n" id="n2">0</span>
  </button>
  <button class="r-btn" id="b3">
    <span class="r-i">💬</span>
    <span class="r-n" id="n3">0</span>
  </button>
  <button class="r-btn" id="b4">
    <span class="r-i">🔖</span>
    <span class="r-n" id="n4">0</span>
  </button>
  <button class="r-btn" id="b5">
    <span class="r-i">↗️</span>
    <span class="r-n" id="n5">0</span>
  </button>
  <button class="r-btn" id="b6">
    <span class="r-i">🎵</span>
  </button>
</div>

<!-- แถบล่าง 5 ปุ่ม ตรงรูป -->
<div class="btm">
  <button class="b-btn active" id="h">
    <span class="b-i">🏠</span><span class="b-t">หน้าหลัก</span>
  </button>
  <button class="b-btn" id="s">
    <span class="b-i">🛍️</span><span class="b-t">ร้านค้า</span>
  </button>
  <button class="b-btn" id="a">
    <span class="plus-c">+</span>
  </button>
  <button class="b-btn" id="m">
    <span class="b-i">💬</span><span class="b-t">ข้อความ</span>
  </button>
  <button class="b-btn" id="p">
    <span class="b-i">👤</span><span class="b-t">โปรไฟล์</span>
  </button>
</div>

<script>
let play = false, like = false, lc=0, cc=0, sc=0, sh=0;

// เล่นวิดีโอ
document.getElementById('vBox').onclick = () => {
  play = !play;
  document.getElementById('vBox').classList.toggle('playing', play);
  document.getElementById('pIcon').textContent = play ? '⏸' : '▶';
  document.getElementById('pText').textContent = play ? 'กำลังเล่น...' : 'กดเพื่อเล่นวิดีโอ';
};

// ไลก์
document.getElementById('b2').onclick = () => {
  like = !like; lc += like ? 1 : -1;
  document.getElementById('n2').textContent = lc;
  document.getElementById('i2').textContent = like ? '❤️' : '🤍';
};

// คอมเมนต์
document.getElementById('b3').onclick = () => { cc++; document.getElementById('n3').textContent = cc; };

// บันทึก
document.getElementById('b4').onclick = () => { sc++; document.getElementById('n4').textContent = sc; };

// แชร์
document.getElementById('b5').onclick = () => { sh++; document.getElementById('n5').textContent = sh; };

// เพลง
document.getElementById('b6').onclick = () => alert('เปลี่ยนเพลง');

// รูป
document.getElementById('b1').onclick = () => alert('เปลี่ยนรูปโปรไฟล์');

// แถบล่าง
function set(id){document.querySelectorAll('.b-btn').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');}
document.getElementById('h').onclick=()=>set('h');
document.getElementById('s').onclick=()=>set('s');
document.getElementById('a').onclick=()=>alert('เพิ่มวิดีโอ');
document.getElementById('m').onclick=()=>set('m');
document.getElementById('p').onclick=()=>set('p');
</script>
</body>
</html>
