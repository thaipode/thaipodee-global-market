<script>
// ==============================================================
// ✅ ข้อมูล Firebase — ครบถูกต้อง
// ==============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCt-wPPDeopLnjCv4QQvdYLQu2G_VxWYtE",
  authDomain: "thaipodee-market.firebaseapp.com",
  databaseURL: "https://thaipodee-market-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "thaipodee-market",
  storageBucket: "thaipodee-market.firebasestorage.app",
  messagingSenderId: "802626775100",
  appId: "1:802626775100:web:8b2f2914532d2c9e9c3b39"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();
const videosRef = db.ref('thaipodee_videos');
const statsRef = db.ref('thaipodee_stats');

const MY_ID = localStorage.getItem('tp_my_id') || ('u_' + Date.now() + '_' + Math.random().toString(36).slice(2,9));
localStorage.setItem('tp_my_id', MY_ID);

let vidList = [];
let totalLikes = 0;
let isLiked = false;
let isDrag = false;
let saved = false;
let currentIndex = 0;
let loaded = false;

function setSyncStatus(txt){
  document.getElementById('syncStatus').textContent = txt;
  console.log('[Status]', txt);
}

function syncAll(){
  const n = localStorage.getItem('tp_name') || 'Thaipodee-Master';
  const u = localStorage.getItem('tp_uname') || '@Thaipodee-Master-No.1';
  const av = localStorage.getItem('tp_av');

  document.getElementById('pName').textContent = n;
  document.getElementById('pUname').textContent = u;
  document.getElementById('dispUname').textContent = u;

  if(av){
    document.getElementById('avSideImg').src = av;
    document.getElementById('avSideImg').style.display='block';
    document.getElementById('avBigImg').src = av;
    document.getElementById('avBigImg').style.display='block';
  }
  document.getElementById('likeCount').textContent = totalLikes;
  document.getElementById('totalLike').textContent = totalLikes;
}

function goPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
  if(p==='home') document.getElementById('homePage').classList.remove('hidden');
  if(p==='profile'){
    document.getElementById('profilePage').classList.remove('hidden');
    renderVids();
  }
}
document.querySelectorAll('[data-go]').forEach(b=>{
  b.addEventListener('click', ()=>goPage(b.dataset.go));
});

document.getElementById('avSideBtn').addEventListener('click', ()=>avatarInput.click());
document.getElementById('avBigBtn').addEventListener('click', ()=>avatarInput.click());
document.getElementById('avatarInput').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{
    localStorage.setItem('tp_av', ev.target.result);
    syncAll();
  };
  r.readAsDataURL(f);
});

document.getElementById('nameRow').addEventListener('click', ()=>{
  const curr = localStorage.getItem('tp_name') || 'Thaipodee-Master';
  const n = prompt('เปลี่ยนชื่อ', curr);
  if(n && n.trim()){
    localStorage.setItem('tp_name', n.trim());
    syncAll();
  }
});
document.getElementById('unameRow').addEventListener('click', ()=>{
  const curr = (localStorage.getItem('tp_uname') || '@Thaipodee-Master-No.1').replace('@','');
  const u = prompt('เปลี่ยนชื่อผู้ใช้', curr);
  if(u && u.trim()){
    localStorage.setItem('tp_uname', '@'+u.trim());
    syncAll();
  }
});

function playVideoAt(index){
  if(!vidList.length){
    document.getElementById('vidDesc').textContent = 'ยังไม่มีวิดีโอ กด + เพิ่มเป็นคนแรก!';
    return;
  }
  if(index < 0) index = vidList.length - 1;
  if(index >= vidList.length) index = 0;
  currentIndex = index;
  
  const v = vidList[index];
  document.getElementById('vidDesc').textContent = v.authorUname + ' — ' + (v.name || 'วิดีโอ');
  
  const video = document.getElementById('mainVideo');
  video.pause();
  video.src = v.url;
  video.load();
  video.play().catch(e=>console.log('เล่นอัตโนมัติถูกบล็อก:', e));
}

function getVideoThumbnail(url){
  return new Promise(resolve=>{
    const v = document.createElement('video');
    v.src = url;
    v.crossOrigin = 'anonymous';
    v.currentTime = 1;
    v.addEventListener('loadeddata', ()=>{
      const c = document.createElement('canvas');
      c.width = 200; c.height = 267;
      const ctx = c.getContext('2d');
      ctx.drawImage(v, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/png'));
    });
    v.addEventListener('error', ()=>resolve(''));
    setTimeout(()=>resolve(''), 5000);
  });
}

// ✅ อัปโหลดไฟล์ขึ้น Firebase Storage จริง ๆ
async function uploadVideoFile(file){
  setSyncStatus('กำลังอัปโหลดวิดีโอ...');
  
  const myName = localStorage.getItem('tp_name') || 'Thaipodee-Master';
  const myUname = localStorage.getItem('tp_uname') || '@Thaipodee-Master-No.1';
  const fileId = Date.now().toString() + '_' + Math.random().toString(36).slice(2,10);
  const storagePath = 'videos/' + fileId + '_' + file.name;
  
  // อัปโหลดไฟล์
  const uploadRef = storage.ref(storagePath);
  await uploadRef.put(file);
  const downloadURL = await uploadRef.getDownloadURL();
  
  // ทำรูปปก
  const tempUrl = URL.createObjectURL(file);
  const thumb = await getVideoThumbnail(tempUrl);
  URL.revokeObjectURL(tempUrl); // ลบไฟล์ชั่วคราวทิ้ง
  
  // บันทึกลงฐานข้อมูล
  const newVid = {
    id: fileId,
    authorId: MY_ID,
    authorName: myName,
    authorUname: myUname,
    name: file.name,
    url: downloadURL,
    thumb: thumb,
    storagePath: storagePath,
    time: Date.now()
  };
  
  setSyncStatus('กำลังบันทึก...');
  await videosRef.push(newVid);
  setSyncStatus('✅ เผยแพร่แล้ว! ทุกเครื่องเล่นได้');
  setTimeout(()=>setSyncStatus('เชื่อมต่อแล้ว ✅'), 3000);
  
  currentIndex = 0;
  playVideoAt(0);
  goPage('home');
}

document.getElementById('upBtn').addEventListener('click', ()=>videoInput.click());
document.getElementById('upBtn2').addEventListener('click', ()=>videoInput.click());
document.getElementById('videoInput').addEventListener('change', async e=>{
  const f = e.target.files[0];
  if(!f) return;
  await uploadVideoFile(f);
});

// รับข้อมูลเรียลไทม์
videosRef.on('value', snap=>{
  const data = snap.val();
  console.log('[Firebase] ข้อมูล:', data);
  vidList = data ? Object.values(data).sort((a,b)=>b.time - a.time) : [];
  
  if(!loaded){
    loaded = true;
    setSyncStatus('เชื่อมต่อแล้ว ✅');
    setTimeout(()=>setSyncStatus(''), 2500);
    if(vidList.length) playVideoAt(0);
  }
  renderVids();
  syncAll();
});

async function renderVids(){
  const g = document.getElementById('vidGrid');
  g.innerHTML = '';
  if(!vidList.length){
    g.innerHTML='<div class="empty-text">ยังไม่มีวิดีโอ<br>กด + เพิ่มเป็นคนแรก!</div>';
    return;
  }
  for(let i=0; i<vidList.length; i++){
    const v = vidList[i];
    const c = document.createElement('div');
    c.className='video-card';
    const delBtn = v.authorId === MY_ID 
      ? `<button class="del-btn" data-path="${v.storagePath||''}">×</button>` 
      : '';
    
    c.innerHTML = v.thumb 
      ? `<img class="video-thumb" src="${v.thumb}" alt=""><span class="play-icon">▶</span>${delBtn}`
      : `<span class="play-icon">▶</span>${delBtn}`;
    
    c.addEventListener('click', e=>{
      if(e.target.classList.contains('del-btn')) return;
      playVideoAt(i);
      goPage('home');
    });
    
    if(v.authorId === MY_ID){
      c.querySelector('.del-btn')?.addEventListener('click', async e=>{
        e.stopPropagation();
        if(confirm('ลบวิดีโอของคุณ?')){
          const path = e.target.dataset.path;
          if(path){
            try{ await storage.ref(path).delete(); }catch(err){console.log('ลบไฟล์ไม่ได้:', err);}
          }
          const snapshot = await videosRef.once('value');
          const all = snapshot.val() || {};
          for(const key in all){
            if(all[key].id === v.id){
              await videosRef.child(key).remove();
              break;
            }
          }
        }
      });
    }
    g.appendChild(c);
  }
}

// สไลด์เปลี่ยว
let touchStartY = 0;
const SWIPE_THRESHOLD = 35;
document.getElementById('videoSwipeArea').addEventListener('touchstart', e=>{
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.getElementById('videoSwipeArea').addEventListener('touchend', e=>{
  if(!vidList.length) return;
  const touchEndY = e.changedTouches[0].clientY;
  const diffY = touchStartY - touchEndY;
  if(Math.abs(diffY) < SWIPE_THRESHOLD) return;
  playVideoAt(diffY > 0 ? currentIndex + 1 : currentIndex - 1);
}, {passive:true});

// แชร์
async function share(){
  if(navigator.share){
    try{await navigator.share({title:'ThaiPodee', url:location.href});}
    catch{await navigator.clipboard.writeText(location.href);alert('คัดลอกลิงก์แล้ว ✅');}
  }else{
    await navigator.clipboard.writeText(location.href);
    alert('คัดลอกลิงก์แล้ว ✅');
  }
}
document.getElementById('shareBtn').addEventListener('click', share);
document.getElementById('shareProf').addEventListener('click', share);

// แถบเวลา
const video = document.getElementById('mainVideo');
const dot = document.getElementById('progressDot');
video.addEventListener('timeupdate', ()=>{
  if(!video.duration || isDrag) return;
  dot.style.left = (video.currentTime / video.duration * 100) + '%';
});
function seekTo(x){
  if(!video.duration) return;
  const bar = document.getElementById('progressBar');
  const r = bar.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (x - r.left) / r.width));
  video.currentTime = p * video.duration;
  dot.style.left = (p * 100) + '%';
}
document.getElementById('progressBar').addEventListener('mousedown', e=>{isDrag=true;seekTo(e.clientX);});
document.getElementById('progressBar').addEventListener('touchstart', e=>{isDrag=true;seekTo(e.touches[0].clientX);}, {passive:true});
document.addEventListener('mousemove', e=>{if(!isDrag)return;seekTo(e.clientX);});
document.addEventListener('touchmove', e=>{if(!isDrag)return;seekTo(e.touches[0].clientX);}, {passive:true});
document.addEventListener('mouseup', ()=>isDrag=false);
document.addEventListener('touchend', ()=>isDrag=false);

// แตะเล่น-หยุด
document.getElementById('videoSwipeArea').addEventListener('click', e=>{
  if(e.target.closest('.progress-bar')) return;
  if(video.paused || video.muted){
    video.muted = false;
    video.play();
  }else{
    video.pause();
  }
});

// ถูกใจ
document.getElementById('likeBtn').addEventListener('click', ()=>{
  isLiked = !isLiked;
  totalLikes += isLiked ? 1 : -1;
  statsRef.set({totalLikes});
  document.getElementById('likeIcon').textContent = isLiked ? '❤️' : '🤍';
  syncAll();
});

// บันทึก
document.getElementById('saveBtn').addEventListener('click', ()=>{
  saved = !saved;
  document.getElementById('saveIcon').textContent = saved ? '⬛' : '⬜';
});

// โหลดสถิติ
statsRef.on('value', snap=>{
  const d = snap.val();
