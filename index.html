<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thaipodee Global Market</title>

  <!-- ทำให้ติดตั้งเป็นแอปได้ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiVGhhaXBvZGUgR2xvYmFsIE1hcmtldCIsInNob3J0X25hbWUiOiJUaGFpcG9kZWUiLCJzdGFydF91cmwiOiIuLyIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMwMDAwMDAiLCJ0aGVtZV9jb2xvciI6IiMwMDAwMDAiLCJpY29ucyI6W3sic3JjIjoiLi90aGFpcG9kZV9sb2dvX2ljb24ucG5nIiwic2l6ZXMiOiIxOTJ4MTkyIiwidHlwZSI6ImltYWdlL3BuZyJ9XX0=">
  <link rel="icon" type="image/png" href="./thaipodee_logo_icon.png">
  <link rel="apple-touch-icon" href="./thaipodee_logo_icon.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* === ด้านบน: ล็อกระยะห่างพอดี ไม่ห่างเกินไป === */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0;
      height: 56px; padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .app-name { font-size: 18px; font-weight: 700; }
    .top-icons {
      display: flex;
      flex-direction: row;
      gap: 16px; /* ✅ ระยะห่างคงที่ พอดี */
      align-items: center;
    }
    .icon { font-size: 22px; line-height: 1; }
    .profile-circle {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid #ff0000;
      overflow: hidden;
      flex-shrink: 0; /* ✅ ไม่บีบ ไม่ขยับ */
    }
    .profile-circle img { width: 100%; height: 100%; object-fit: cover; }

    /* === กลางจอ: ตรงกลางพอดี === */
    .center-area {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 80px;
    }
    .center-icon { font-size: 48px; opacity: 0.7; margin-bottom: 12px; }
    .center-text {
      font-size: 14px; color: #aaaaaa;
      text-align: center;
      line-height: 1.8;
    }

    /* === ชื่อที่มุมล่างซ้าย: ตรงตำแหน่งเดิม === */
    .user-name {
      position: absolute; bottom: 90px; left: 16px;
      font-size: 15px;
    }

    /* === แถบล่าง: เรียงเท่ากันเต็มจอ ไม่กระจาย === */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 70px;
      display: flex;
      flex-direction: row;
      justify-content: space-around; /* ✅ กระจายเท่าๆ กัน */
      align-items: center;
      background: #000000;
      border-top: 1px solid #222222;
      padding-bottom: 8px;
      padding-left: 16px;
      padding-right: 16px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #ffffff;
      text-decoration: none;
      min-width: 50px; /* ✅ กำหนดความกว้างขั้นต่ำ ไม่บีบแคบ */
    }
    .nav-icon { font-size: 24px; line-height: 1; }
    .nav-label { font-size: 10px; }
    .plus-btn {
      width: 46px; height: 34px;
      background: linear-gradient(90deg, #ff0000, #ff9900);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      flex-shrink: 0; /* ✅ ปุ่ม + ไม่ขยับขนาด */
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="app-name">Thaipodee</div>
    <div class="top-icons">
      <span class="icon">🔍</span>
      <span class="icon">💬</span>
      <div class="profile-circle">
        <img src="./thaipodee_logo_icon.png" alt="Profile" onerror="this.style.background='#444'">
      </div>
    </div>
  </div>

  <div class="center-area">
    <div class="center-icon">🎥</div>
    <div class="center-text">
      กดปุ่ม + เพื่อโพสต์<br>
      เก็บลงคลาวด์ — ทุกคน ทุกเครื่อง เห็นเหมือนกัน
    </div>
  </div>

  <div class="user-name">Thaipodee Master</div>

  <nav class="bottom-nav">
    <a class="nav-item" href="#">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">หน้าแรก</span>
    </a>
    <a class="nav-item" href="#">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">ค้นหา</span>
    </a>
    <a class="nav-item" href="#">
      <span class="plus-btn">+</span>
    </a>
    <a class="nav-item" href="#">
      <span class="nav-icon">🔔</span>
      <span class="nav-label">แจ้งเตือน</span>
    </a>
    <a class="nav-item" href="#">
      <span class="nav-icon">👤</span>
      <span class="nav-label">โปรไฟล์</span>
    </a>
  </nav>

</body>
</html>
