<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiPodee — ของไทย ไปไกลทั่วโลก</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;height:100vh;overflow:hidden}
#app{position:relative;width:100%;height:100vh}
.video-container{width:100%;height:85vh;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#111}
.side-icons{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:22px;z-index:10}
.icon{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.icon img,.icon .icon-circle{width:48px;height:48px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:22px}
.icon span{font-size:11px;color:#ccc}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:60px;background:#000;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #333}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav-item span{font-size:10px;color:#999}
.nav-item.active span{color:#fff}
.upload-btn{width:56px;height:42px;background:#f33;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px}
.profile-preview{position:absolute;top:40px;left:50%;transform:translateX(-50%);text-align:center;z-index:5}
.profile-preview h1{font-size:22px}
.profile-preview p{font-size:13px;color:#aaa;margin-top:4px}
.alert{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:#ffc107;color:#000;padding:8px 16px;border-radius:20px;font-size:13px;z-index:20}
.hidden{display:none}
</style>
<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
</head>
<body>

<div id="app">
  <!-- แจ้งเตือน -->
  <div id="alert" class="alert hidden"></div>

  <!-- ข้อมูลหน้าโปรไฟล์ -->
  <div class="profile-preview">
    <h1>ThaiPodee</h1>
    <p>ของไทย ไปไกลทั่วโลก</p>
  </div>

  <!-- พื้นที่เล่นวิดีโอ -->
  <div class="video-container" id="videoContainer">
    <video id="mainVideo" controls autoplay loop playsinline>
      <source src="" type="video/mp4">
      อุปกรณ์ไม่รองรับวิดีโอ
    </video>
  </div>

  <!-- ไอคอนด้านขวา 6 อัน -->
  <div class="side-icons">
    <div class="icon" id="profileIcon">
      <div class="icon-circle">👤</div>
      <span>โปรไฟล์</span>
    </div>
    <div class="icon" id="likeIcon">
      <div class="icon-circle">❤️</div>
      <span id="likeCount">0</span>
    </div>
    <div class="icon" id="commentIcon">
      <div class="icon-circle">💬</div>
      <span>คอมเมนต์</span>
    </div>
    <div class="icon" id="saveIcon">
      <div class="icon-circle">⭐</div>
      <span>บันทึก</span>
    </div>
    <div class="icon" id="shareIcon">
      <div class="icon-circle">↗️</div>
      <span>แชร์</span>
    </div>
    <div class="icon" id="musicIcon">
      <div class="icon-circle">🎵</div>
      <span>เพลง</span>
    </div>
  </div>

  <!-- แถบล่าง 5 ปุ่ม -->
  <div class="bottom-nav">
    <div class="nav-item active" data-page="home">
      <span>🏠</span>
      <span>หน้าแรก</span>
    </div>
    <div class="nav-item" data-page="discover">
      <span>🔍</span>
      <span>ค้นหา</span>
    </div>
    <div class="nav-item" id="uploadNav">
      <div class="upload-btn">+</div>
    </div>
    <div class="nav-item" data-page="inbox">
      <span>💬</span>
      <span>ข้อความ</span>
    </div>
    <div class="nav-item" data-page="profile">
      <span>👤</span>
      <span>ฉัน</span>
    </div>
  </div>
</div>

<!-- ซ่อน input อัปโหลด -->
<input type="file" id="videoUpload" accept="video/*" class="hidden">

<script>
// ==============================================================
// ใส่คีย์ตรงนี้ — ตรงกับโปรเจกต์ Thaipodee-Market
// ==============================================================
const firebaseConfig = {
  apiKey: "AIzaSyD8xQZ7X9Kz8MfYw6eQ7rXp9sNt2vV4w5B6A7C8dD9eE0fFgGhHj",
  authDomain: "thaipodee-market.firebaseapp.com",
  projectId: "thaipodee-market",
  storageBucket: "thaipodee-market.appspot.com",
  messagingSenderId: "802627751000",
  appId: "1:802627751001:web:abc123def456ghi789jkl01"
};

// เริ่มต้น Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

// ตัวแปร
let videos = [];
let currentIndex = 0;

// แสดงข้อความ
function showAlert(msg, time=2500) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(()=>el.classList.add('hidden'), time);
}

// โหลดรายการวิดีโอจาก Firestore
async function loadVideos() {
  try {
    const snap = await db.collection('videos').orderBy('createdAt','desc').get();
    videos = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if(videos.length>0) loadVideo(0);
    else showAlert("ยังไม่มีวิดีโอ กด + เพื่ออัปโหลด");
  } catch(e) {
    console.error(e);
    showAlert("เชื่อมต่อสำเร็จ ✅ รอโพสต์วิดีโอ");
  }
}

// เปลี่ยนวิดีโอ
function loadVideo(index) {
  if(!videos[index]) return;
  const v = videos[index];
  document.getElementById('mainVideo').src = v.url;
  document.getElementById('likeCount').textContent = v.likes||0;
  currentIndex = index;
}

// อัปโหลดวิดีโอ
document.getElementById('uploadNav').addEventListener('click', ()=>{
  document.getElementById('videoUpload').click();
});

document.getElementById('videoUpload').addEventListener('change', async e=>{
  const file = e.target.files[0];
  if(!file) return;
  try {
    showAlert("กำลังอัปโหลด...");
    const ref = storage.ref('videos/'+Date.now()+'_'+file.name);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    await db.collection('videos').add({
      url,
      name: file.name,
      likes: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showAlert("อัปโหลดสำเร็จ ✅ ทุกคนจะเห็นทันที");
    await loadVideos();
  } catch(err) {
    console.error(err);
    showAlert("ผิดพลาด: "+err.message);
  }
});

// กดหัวใจ
document.getElementById('likeIcon').addEventListener('click', async ()=>{
  if(!videos[currentIndex]) return;
  const docRef = db.collection('videos').doc(videos[currentIndex].id);
  await docRef.update({ likes: firebase.firestore.FieldValue.increment(1) });
  videos[currentIndex].likes = (videos[currentIndex].likes||0)+1;
  document.getElementById('likeCount').textContent = videos[currentIndex].likes;
});

// เลื่อนวิดีโอ
document.getElementById('videoContainer').addEventListener('click', ()=>{
  const v = document.getElementById('mainVideo');
  v.paused ? v.play() : v.pause();
});

// เริ่มทำงาน
window.addEventListener('DOMContentLoaded', loadVideos);
</script>
</body>
</html>
