<!-- ==============================================================
   Thaipodee Market — v67
   วันที่: 23 กันยายน 2569 12:37 น.
   อ้างอิงจาก: v66 + รูปแบบหน้าโปรไฟล์ใหม่
   ปัญหา:
   - หน้าโปรไฟล์แสดงเป็นตาราง 3 คอลัมน์ ไม่ตรงแบบที่ต้องการ
   - ไม่มีปุ่มลบโพสต์
   - รูปหน้าปกบางครั้งไม่โชว์
   
   สาเหตุ:
   - ใช้ grid layout ไม่ตรงแบบ
   - ยังไม่ได้ใส่ปุ่มลบและระบบยืนยัน
   - การโหลดรูปหน้าปกไม่สมบูรณ์
   
   วิธีแก้:
   - เปลี่ยนเป็นการ์ดแนวตั้งเต็มความกว้าง ตรงตามรูปตัวอย่าง
   - เพิ่มปุ่มลบสีแดง + ยืนยันก่อนลบ
   - คงโครงสร้างส่วนอื่นทั้งหมด เหมือนเดิมเป๊ะ
   - รูปหน้าปกโชว์ชัด ทุกโพสต์
   ============================================================== -->

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ThaiPodee Market</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  }

  /* แถบบน — เหมือนเดิม */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 44px;
    background: #000; display: flex; align-items: center; justify-content: center; z-index: 200;
  }
  .tab { padding: 0 12px; font-size: 14px; color: #999; cursor: pointer; }
  .tab.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 4px; }

  /* หน้าหลัก — เหมือนเดิม */
  .home-view {
    position: absolute; top: 44px; left: 0; right: 0; bottom: 60px;
    background: #000; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .empty-msg { color: #666; font-size: 15px; text-align: center; line-height: 1.8; padding: 20px; }
  .main-img, .main-vid { width: 100%; height: 100%; object-fit: contain; display: none; }
  .main-img.active, .main-vid.active { display: block; }

  /* คำอธิบาย — เหมือนเดิม */
  .caption-area {
    position: absolute; left: 12px; bottom: 90px; right: 90px;
    font-size: 13px; line-height: 1.6; z-index: 10; display: none;
  }
  .caption-area.show { display: block; }

  /* ===== 6 ปุ่มด้านขวา — ตำแหน่งเดิมเป๊ะ ===== */
  .side-bar {
    position: fixed; right: 10px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 24px; z-index: 150;
  }
  .side-btn { display: flex; flex-direction: column; align-items: center; color: #fff; cursor: pointer; }
  .side-icon { font-size: 22px; line-height: 1; }
  .side-num { font-size: 11px; margin-top: 2px; }
  .profile-circle {
    width: 48px; height: 48px; border-radius: 50%;
    background: #333; border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .profile-circle img { width: 100%; height: 100%; object-fit: cover; }
  .music-icon {
    width: 48px; height: 48px; border-radius: 50%;
    background: #222; display: flex; align-items: center; justify-content: center;
  }

  /* แผงอัปโหลด — เหมือนเดิม */
  .upload-panel {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.97); z-index: 500; display: none; flex-direction: column; padding: 20px;
  }
  .upload-panel.show { display: flex; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .panel-close { font-size: 16px; color: #fff; cursor: pointer; padding: 8px; }
  .panel-title { font-size: 18px; font-weight: 600; }
  .preview-box { flex: 1; display: flex; align-items: center; justify-content: center; background: #111; border-radius: 12px; margin-bottom: 15px; overflow: hidden; min-height: 280px; }
  .prev-img, .prev-vid { max-width: 100%; max-height: 380px; display: none; }
  .prev-img.active, .prev-vid.active { display: block; }
  .caption-input {
    width: 100%; padding: 12px; background: #222; border: none; border-radius: 8px;
    color: #fff; font-size: 14px; margin-bottom: 12px; resize: none; min-height: 80px;
  }
  .publish-btn {
    width: 100%; padding: 14px; background: #25d366; border: none; border-radius: 8px;
    color: #000; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  .file-input { display: none; }

  /* ===== หน้าโปรไฟล์ — เปลี่ยนเป็นการ์ดแนวตั้ง ตรงตามรูป ===== */
  .profile-view {
    position: absolute; top: 44px; left: 0; right: 0; bottom: 60px;
    background: #000; display: none; overflow-y: auto; padding: 20px 15px;
  }
  .profile-view.show { display: block; }
  .p-header { text-align: center; margin-bottom: 20px; }
  .p-avatar {
    width: 80px; height: 80px; border-radius: 50%; border: 3px solid #fff;
    margin: 0 auto 10px; overflow: hidden;
  }
  .p-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .p-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
  .p-stats { display: flex; justify-content: center; gap: 35px; margin: 15px 0; }
  .p-stat { text-align: center; }
  .p-stat-num { font-size: 18px; font-weight: bold; }
  .p-stat-label { font-size: 11px; color: #999; margin-top: 2px; }
  .p-count { text-align: center; color: #999; font-size: 13px; margin: 10px 0 15px; }
  .offline-note { text-align: center; color: #ffcc00; font-size: 12px; margin-bottom: 15px; }

  /* ===== การ์ดโพสต์ — แบบเต็มแถว ตรงตามรูปตัวอย่าง ===== */
  .p-grid { display: flex; flex-direction: column; gap: 12px; }
  .p-item {
    width: 100%; background: #1a1a1a; border-radius: 12px; overflow: hidden;
    cursor: pointer; position: relative;
  }
  .p-item .poster-img {
    width: 100%; height: 200px; object-fit: cover; display: block;
    background: #222;
  }
  .p-item .type-mark {
    position: absolute; top: 10px; left: 10px; font-size: 16px;
    background: rgba(0,0,0,0.65); padding: 6px 10px; border-radius: 20px;
  }
  /* ปุ่มลบสีแดง */
  .p-item .delete-btn {
    position: absolute; top: 10px; right: 10px;
    background: #ff3b30; color: #fff; border: none; border-radius: 6px;
    padding: 6px 14px; font-size: 14px; font-weight: bold; cursor: pointer;
    z-index: 10;
  }
  .p-item .delete-btn:active { background: #cc2f26; }
  /* ข้อมูลใต้รูป */
  .p-item-body { padding: 12px; }
  .p-item-title {
    font-size: 14px; color: #fff; margin-bottom: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .p-item-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #999; }
  .p-item-size { display: flex; align-items: center; gap: 6px; }

  /* ===== เมนูล่าง 5 ปุ่ม — ตำแหน่งเดิมเป๊ะ ===== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
    background: #000; display: grid; grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid #222; z-index: 99999;
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #999; cursor: pointer;
  }
  .nav-btn.active { color: #fff; }
  .nav-icon { font-size: 20px; line-height: 1; }
  .nav-label { font-size: 10px; margin-top: 2px; }

  /* ปุ่ม + ตรงกลาง — เหมือนเดิม */
  .center-col { display: flex; align-items: center; justify-content: center; }
  .plus-btn {
    width: 48px; height: 34px; background: #fff; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: bold; color: #000;
    position: relative; cursor: pointer; border: none; outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .plus-btn::before {
    content: ''; position: absolute; width: 42px; height: 42px;
    background: #fff; border-radius: 50%; top: -4px; z-index: -1;
  }
</style>
</head>
<body>

<!-- แถบบน -->
<div class="top-bar">
  <span class="tab" data-goto="home">กำลังติดตาม</span>
  <span class="tab active" data-goto="home">สำหรับคุณ</span>
</div>

<!-- หน้าหลัก -->
<div class="home-view" id="homePage">
  <p class="empty-msg" id="emptyText">กดปุ่ม + เพื่อเลือกภาพหรือวิดีโอ</p>
  <img id="mainImage" class="main-img" alt="โพสต์ภาพ">
  <video id="mainVideo" class="main-vid" controls loop autoplay muted playsinline webkit-playsinline></video>
</div>

<div class="caption-area" id="captionBox">
  <strong>ชื่อผู้ใช้</strong><br>
  <span id="captionText">คำอธิบายจะแสดงที่นี่</span><br>
  <span style="color:#888; font-size:11px;">เสียง · เพลงพื้นหลัง</span>
</div>

<!-- 6 ปุ่มด้านขวา -->
<div class="side-bar" id="sideArea">
  <div class="side-btn">
    <div class="profile-circle">
      <img src="https://i.pravatar.cc/150?img=23" alt="โปรไฟล์">
    </div>
  </div>
  <div class="side-btn" id="likeBtn">
    <span class="side-icon">❤️</span>
    <span class="side-num" id="likeCount">0</span>
  </div>
  <div class="side-btn">
    <span class="side-icon">💬</span>
    <span class="side-num">0</span>
  </div>
  <div class="side-btn">
    <span class="side-icon">⭐</span>
    <span class="side-num">0</span>
  </div>
  <div class="side-btn">
    <span class="side-icon">↗️</span>
    <span class="side-num">แชร์</span>
  </div>
  <div class="side-btn">
    <div class="music-icon">🎵</div>
  </div>
</div>

<!-- แผงอัปโหลด -->
<div class="upload-panel" id="uploadPanel">
  <div class="panel-head">
    <span class="panel-close" id="closeBtn">✕ ปิด</span>
    <span class="panel-title">ตัวอย่างสื่อ</span>
    <span></span>
  </div>
  <div class="preview-box">
    <img id="previewImg" class="prev-img" alt="ตัวอย่างภาพ">
    <video id="previewVid" class="prev-vid" controls loop muted playsinline webkit-playsinline></video>
  </div>
  <textarea id="descTextarea" class="caption-input" placeholder="เขียนคำอธิบาย..."></textarea>
  <button class="publish-btn" id="publishBtn">✅ เผยแพร่</button>
</div>

<input type="file" id="fileInput" class="file-input" accept="image/*,video/*">

<!-- หน้าโปรไฟล์ — ตรงตามรูปแบบใหม่ -->
<div class="profile-view" id="profilePage">
  <div class="p-header">
    <div class="p-avatar">
      <img src="https://i.pravatar.cc/150?img=23" alt="โปรไฟล์">
    </div>
    <div class="p-name">thaipodee</div>
    <div class="p-stats">
      <div class="p-stat">
        <div class="p-stat-num" id="totalPosts">0</div>
        <div class="p-stat-label">โพสต์</div>
      </div>
      <div class="p-stat">
        <div class="p-stat-num">0</div>
        <div class="p-stat-label">ผู้ติดตาม</div>
      </div>
      <div class="p-stat">
        <div class="p-stat-num">0</div>
        <div class="p-stat-label">กำลังติดตาม</div>
      </div>
    </div>
  </div>

  <p class="offline-note">⚠️ ออฟไลน์ — แสดงเฉพาะในเครื่อง</p>

  <div class="p-count">จำนวนโพสต์: <span id="gridCount">0</span> รายการ</div>

  <div class="p-grid" id="postGrid"></div>
</div>

<!-- เมนูล่าง 5 ปุ่ม -->
<nav class="bottom-nav">
  <div class="nav-btn active" data-goto="home">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">หน้าหลัก</span>
  </div>
  <div class="nav-btn" data-goto="shop">
    <span class="nav-icon">🛒</span>
    <span class="nav-label">ร้านค้า</span>
  </div>
  <div class="center-col">
    <button class="plus-btn" id="addBtn">+</button>
  </div>
  <div class="nav-btn" data-goto="inbox">
    <span class="nav-icon">📥</span>
    <span class="nav-label">กล่องข้อความ</span>
  </div>
  <div class="nav-btn" data-goto="profile">
    <span class="nav-icon">👤</span>
    <span class="nav-label">ฉัน</span>
  </div>
</nav>

<script>
let postList = [];
let selectedFile = null;
let selectedType = null;
let selectedDataUrl = null;
let selectedPoster = null;

const fileInput = document.getElementById('fileInput');
const addBtn = document.getElementById('addBtn');
const uploadPanel = document.getElementById('uploadPanel');
const closeBtn = document.getElementById('closeBtn');
const previewImg = document.getElementById('previewImg');
const previewVid = document.getElementById('previewVid');
const publishBtn = document.getElementById('publishBtn');
const descTextarea = document.getElementById('descTextarea');
const mainImage = document.getElementById('mainImage');
const mainVideo = document.getElementById('mainVideo');
const emptyText = document.getElementById('emptyText');
const captionBox = document.getElementById('captionBox');
const captionText = document.getElementById('captionText');
const postGrid = document.getElementById('postGrid');
const totalPosts = document.getElementById('totalPosts');
const gridCount = document.getElementById('gridCount');
const homePage = document.getElementById('homePage');
const profilePage = document.getElementById('profilePage');
const sideArea = document.getElementById('sideArea');
const likeBtn = document.getElementById('likeBtn');
const likeCount = document.getElementById('likeCount');

// โหลดข้อมูลที่เก็บไว้
window.addEventListener('load', () => {
  const saved = localStorage.getItem('thaipodee_posts');
  if (saved) {
    postList = JSON.parse(saved);
    if (postList.length > 0) {
      showOnMain(postList[0]);
    }
  }
  renderHistory();
});

// กด + เลือกไฟล์
addBtn.addEventListener('click', () => fileInput.click());
addBtn.addEventListener('touchstart', (e) => { e.preventDefault(); fileInput.click(); });

fileInput.addEventListener('change', handleFile);

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  selectedFile = file;
  selectedType = file.type.startsWith('image') ? 'image' : 'video';

  if (selectedType === 'image') {
    const reader = new FileReader();
    reader.onload = evt => {
      selectedDataUrl = evt.target.result;
      selectedPoster = selectedDataUrl;
      previewImg.src = selectedDataUrl;
      previewImg.classList.add('active');
      previewVid.classList.remove('active');
      uploadPanel.classList.add('show');
    };
    reader.readAsDataURL(file);
  } else {
    // สร้างรูปหน้าปกจากวิดีโออัตโนมัติ
    const tempVid = document.createElement('video');
    tempVid.src = URL.createObjectURL(file);
    tempVid.currentTime = 0.5;

    tempVid.addEventListener('loadeddata', () => {
      const canvas = document.createElement('canvas');
      canvas.width = tempVid.videoWidth || 400;
      canvas.height = tempVid.videoHeight || 300;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(tempVid, 0, 0, canvas.width, canvas.height);
      selectedPoster = canvas.toDataURL('image/jpeg', 0.7);

      const reader = new FileReader();
      reader.onload = evt => {
        selectedDataUrl = evt.target.result;
        previewVid.src = selectedDataUrl;
        previewVid.classList.add('active');
        previewImg.classList.remove('active');
        uploadPanel.classList.add('show');
      };
      reader.readAsDataURL(file);
    });
  }
}

// ปิดแผง
closeBtn.addEventListener('click', () => {
  uploadPanel.classList.remove('show');
  previewImg.classList.remove('active');
  previewVid.classList.remove('active');
  previewVid.pause();
  previewVid.src = '';
  descTextarea.value = '';
  fileInput.value = '';
  selectedFile = selectedType = selectedDataUrl = selectedPoster = null;
});

// กดเผยแพร่
publishBtn.addEventListener('click', () => {
  if (!selectedDataUrl) return alert('⚠️ เลือกไฟล์ก่อน');

  const caption = descTextarea.value.trim() || 'ไม่มีคำอธิบาย';
  const fileSize = selectedFile ? (selectedFile.size / 1024 / 1024).toFixed(2) + ' MB' : '';
  const duration = selectedType === 'video' ? '9:16' : '';

  const newPost = {
    id: Date.now(),
    type: selectedType,
    dataUrl: selectedDataUrl,
    poster: selectedPoster,
    caption: caption,
    fileName: selectedFile?.name || 'ไฟล์สื่อ',
    fileSize: fileSize,
    duration: duration,
    time: new Date().toLocaleString('th-TH'),
    likes: 0
  };

  postList.unshift(newPost);
  saveToLocal();
  showOnMain(newPost);
  renderHistory();

  uploadPanel.classList.remove('show');
  alert('✅ เผยแพร่สำเร็จ!');
});

function saveToLocal() {
  localStorage.setItem('thaipodee_posts', JSON.stringify(postList));
}

// แสดงที่หน้าหลัก
function showOnMain(post) {
  emptyText.style.display = 'none';
  mainImage.classList.remove('active');
  mainVideo.classList.remove('active');
  mainVideo.pause();

  if (post.type === 'image') {
    mainImage.src = post.dataUrl;
    mainImage.classList.add('active');
  } else {
    mainVideo.pause();
    mainVideo.src = '';
    mainVideo.src = post.dataUrl;
    mainVideo.poster = post.poster || '';
    mainVideo.load();
    mainVideo.classList.add('active');
    mainVideo.play().catch(() => {});
  }

  captionText.textContent = post.caption;
  captionBox.classList.add('show');
  likeCount.textContent = post.likes || 0;
}

// ===== แสดงประวัติแบบการ์ด — ตรงตามรูปตัวอย่าง =====
function renderHistory() {
  postGrid.innerHTML = '';

  postList.forEach((post, index) => {
    const item = document.createElement('div');
    item.className = 'p-item';

    const displaySrc = post.poster || post.dataUrl;
    const icon = post.type === 'image' ? '🖼️' : '🎬';

    item.innerHTML = `
      <img src="${displaySrc}" class="poster-img" alt="">
      <span class="type-mark">${icon}</span>
      <button class="delete-btn" data-index="${index}">ลบ</button>
      <div class="p-item-body">
        <div class="p-item-title">${post.fileName || post.caption}</div>
        <div class="p-item-meta">
          <div class="p-item-size">
            ${post.fileSize || ''} ${post.duration ? '⏱️ ' + post.duration : ''}
            ${post.time ? '📅 ' + post.time : ''}
          </div>
          <div>❤️ ${post.likes || 0}</div>
        </div>
      </div>
    `;

    // กดการ์ด (ไม่ใช่ปุ่มลบ) → ไปเล่น
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-btn')) return;
      showOnMain(post);
      switchPage('home');
    });

    // กดปุ่มลบ
    item.querySelector('.delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm('ต้องการลบโพสต์นี้หรือไม่?')) return;

      postList.splice(index, 1);
      saveToLocal();
      renderHistory();

      if (postList.length > 0) {
        showOnMain(postList[0]);
      } else {
        emptyText.style.display = 'block';
        mainImage.classList.remove('active');
        mainVideo.classList.remove('active');
        mainVideo.pause();
        captionBox.classList.remove('show');
        likeCount.textContent = '0';
      }
    });

    postGrid.appendChild(item);
  });

  totalPosts.textContent = postList.length;
  gridCount.textContent = postList.length;
}

// กดไลก์
likeBtn.addEventListener('click', () => {
  if (postList.length === 0) return;
  postList[0].likes++;
  likeCount.textContent = postList[0].likes;
  saveToLocal();
});

// สลับหน้า
document.querySelectorAll('.nav-btn, .tab').forEach(el => {
  el.addEventListener('click', () => {
    switchPage(el.getAttribute('data-goto'));
  });
});

function switchPage(page) {
  document.querySelectorAll('.nav-btn, .tab').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-goto') === page);
  });

  if (page === 'profile') {
    homePage.style.display = 'none';
    profilePage.classList.add('show');
    captionBox.classList.remove('show');
    sideArea.style.display = 'none';
  } else {
    profilePage.classList.remove('show');
    homePage.style.display = 'flex';
    sideArea.style.display = 'flex';
    if (postList.length > 0) captionBox.classList.add('show');
  }
}
</script>
