<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThaiPodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        html, body { height: 100vh; overflow: hidden; background: #000; color: #fff; }

        .page { display: none; position: absolute; inset: 0; background: #000; }
        .page.active { display: block; }

        .video-container { position: absolute; inset: 0; background: #000; z-index: 1; display: none; }
        .video-container video { width: 100%; height: 100%; object-fit: contain; }

        .center-area { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; padding: 24px; }
        .center-text { color: #aaa; font-size: 15px; text-align: center; line-height: 1.8; }

        .info-left { position: absolute; left: 16px; bottom: 90px; right: 90px; z-index: 10; display: none; }
        .acc-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .desc-text { font-size: 13px; margin-bottom: 4px; color: #ddd; line-height: 1.4; }
        .music-row { font-size: 12px; color: #fff; display: flex; align-items: center; gap: 6px; margin-top: 6px; }
        .music-artist { color: #aaa; font-size: 11px; margin-left: 6px; }

        .menu-right {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 15;
            align-items: center;
        }
        .menu-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .avatar-box { position: relative; width: 48px; height: 48px; margin-bottom: 4px; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; object-fit: cover; background: #555; }
        .follow-plus { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; background: #ff2442; border-radius: 50%; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .icon { font-size: 28px; line-height: 1; }
        .num { font-size: 11px; margin-top: 2px; color: #fff; }

        .nav-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 8px 12px 16px;
            z-index: 20;
            background: transparent;
        }
        .nav-col { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 60px; position: relative; }
        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 10px; color: #aaa; }
        .badge { position: absolute; top: -2px; right: 8px; background: #ff2442; color: #fff; font-size: 9px; min-width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .upload-col { cursor: pointer; position: relative; }
        .upload-visual { width: 48px; height: 32px; background: #fff; border-radius: 6px; position: relative; }
        .upload-visual::before { content: ''; position: absolute; width: 20px; height: 2px; background: #000; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .upload-visual::after { content: ''; position: absolute; width: 2px; height: 20px; background: #000; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        #video-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5; }

        .back-btn { position: absolute; top: 12px; left: 12px; font-size: 22px; cursor: pointer; z-index: 50; color: #fff; }
        .sound-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: #222; border-radius: 20px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; z-index: 50; min-width: 300px; justify-content: space-between; }
        .change-link { color: #fff; font-size: 14px; padding: 2px 8px; cursor: pointer; }
        .change-link:hover { color: #ff2442; }
        .video-area { position: absolute; top: 60px; bottom: 140px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; background: #000; }
        .video-area video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .post-input { position: absolute; bottom: 100px; left: 16px; right: 16px; background: #222; border-radius: 8px; padding: 12px; color: #fff; border: none; font-size: 14px; }
        .post-btn { position: absolute; bottom: 30px; right: 16px; background: #ff2442; color: #fff; border: none; padding: 10px 24px; border-radius: 20px; font-size: 15px; cursor: pointer; }

        .sound-page { background: #000; padding: 16px; overflow-y: auto; height: 100vh; }
        .sound-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .sound-title { font-size: 18px; font-weight: bold; }
        .section-title { font-size: 15px; font-weight: bold; margin: 24px 0 12px; }
        .guide-box { background: #0f172a; border-radius: 10px; padding: 16px; margin-bottom: 20px; font-size: 13px; line-height: 1.8; color: #ccc; }
        .guide-box h4 { color: #25d1d0; margin-bottom: 8px; }

        .link-input-wrap { background: #111; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
        .link-input { width: 100%; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 12px; color: #fff; font-size: 14px; margin-bottom: 10px; }
        .name-input { width: 100%; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 10px; color: #fff; font-size: 13px; margin-bottom: 8px; }
        .link-btn { background: #ff2442; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; }
        .link-btn:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }

        .local-btn { display: block; cursor: pointer; }
        .local-box { padding: 14px; background: #1e1e1e; border-radius: 8px; text-align: center; color: #fff; }
        .hidden-input { display: none; }
    </style>
</head>
<body>

<audio id="bgMusic" loop>

<div id="page-home" class="page active">
    <div class="video-container" id="video-container">
        <video id="main-video" autoplay playsinline></video>
    </div>

    <div class="center-area" id="welcome-area">
        <p class="center-text">🎥 กดปุ่ม + เพื่อเลือกวิดีโอ<br><br>🎵 เลือกเพลงจากที่ใดก็ได้มาใช้งาน</p>
    </div>

    <div class="info-left" id="info-area">
        <div class="acc-name">@ThaiPodee_Master</div>
        <div class="desc-text" id="caption-text">ยินดีต้อนรับสู่ ThaiPodee</div>
        <div class="music-row" id="music-display">
            <span>🎵</span>
            <span id="music-name">Comedy Cartoon Funny Background Music</span>
            <span class="music-artist" id="artist-name">- STAROSTIN, Monume, APALONBeats</span>
        </div>
    </div>

    <div class="menu-right" id="menu-right">
        <div class="menu-btn">
            <div class="avatar-box">
                <img class="avatar" src="https://picsum.photos/id/1012/100/100" alt="โปรไฟล์">
                <span class="follow-plus">+</span>
            </div>
        </div>
        <div class="menu-btn"><span class="icon">❤️</span><span class="num">0</span></div>
        <div class="menu-btn"><span class="icon">💬</span><span class="num">0</span></div>
        <div class="menu-btn"><span class="icon">⭐</span><span class="num">บันทึก</span></div>
        <div class="menu-btn"><span class="icon">↗️</span><span class="num">แชร์</span></div>
        <div class="menu-btn"><span class="icon">🎵</span></div>
    </div>

    <div class="nav-bottom">
        <div class="nav-col"><span class="nav-icon">🏠</span><span class="nav-label">หน้าหลัก</span></div>
        <div class="nav-col"><span class="nav-icon">🛒</span><span class="nav-label">ตลาด</span></div>
        <div class="nav-col upload-col" id="upload-btn">
            <div class="upload-visual"></div>
            <input type="file" id="video-input" accept="video/*">
            <span class="nav-label">อัปโหลด</span>
        </div>
        <div class="nav-col"><span class="nav-icon">💬</span><span class="nav-label">ข้อความ</span><span class="badge">2</span></div>
        <div class="nav-col"><span class="nav-icon">👤</span><span class="nav-label">โปรไฟล์</span></div>
    </div>
</div>

<div id="page-post" class="page">
    <span class="back-btn" id="back-to-home">←</span>
    <div class="sound-bar">
        <span id="sound-bar-name">🎵 เลือกเพลง</span>
        <span class="change-link" id="change-sound">เปลี่ยน</span>
    </div>
    <div class="video-area">
        <video id="preview-video" controls playsinline></video>
    </div>
    <input type="text" class="post-input" id="caption-input" placeholder="เขียนคำอธิบาย...">
    <button class="post-btn" id="submit-post">โพสต์</button>
</div>

<div id="page-sound" class="page sound-page">
    <div class="sound-header">
        <span class="back-btn" id="back-to-post">←</span>
        <span class="sound-title">เลือกเพลง</span>
        <span></span>
    </div>

    <div class="guide-box">
        <h4>วิธีใช้</h4>
        <p>1. เลือกไฟล์เพลงจากเครื่อง หรือวางลิงก์เพลง</p>
        <p>2. ใส่ชื่อเพลงและชื่อผู้แต่ง</p>
        <p>3. กดยืนยันเพื่อใช้งาน</p>
    </div>

    <div class="section-title">📂 เลือกไฟล์เพลง</div>
    <div class="link-input-wrap">
        <label class="local-btn">
            <div class="local-box">กดเพื่อเลือกไฟล์ .mp3</div>
            <input type="file" accept=".mp3,audio/*" id="audio-local-input" class="hidden-input">
        </label>
    </div>

    <div class="section-title">🔗 หรือวางลิงก์เพลง</div>
    <div class="link-input-wrap">
        <input type="text" class="link-input" id="music-link" placeholder="วางลิงก์ไฟล์เพลงที่นี่">
        <input type="text" class="name-input" id="music-link-name" placeholder="ชื่อเพลง">
        <input type="text" class="name-input" id="music-link-artist" placeholder="ชื่อผู้แต่ง">
        <button class="link-btn" id="use-link-btn">ใช้เพลงนี้</button>
    </div>
</div>

<script>
let selectedSong = null;
let selectedArtist = null;
let selectedUrl = null;
let videoFile = null;
const bgMusic = document.getElementById('bgMusic');

function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
}

document.getElementById('video-input').addEventListener('change', e => {
    videoFile = e.target.files[0];
    if (!videoFile) return;
    const url = URL.createObjectURL(videoFile);
    document.getElementById('preview-video').src = url;
    showPage('page-post');
});

document.getElementById('change-sound').addEventListener('click', () => {
    bgMusic.pause();
    showPage('page-sound');
});

document.getElementById('back-to-home').addEventListener('click', () => {
    bgMusic.pause();
    showPage('page-home');
});

document.getElementById('back-to-post').addEventListener('click', () => {
    showPage('page-post');
});

document.getElementById('audio-local-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    selectedUrl = URL.createObjectURL(file);
    selectedSong = file.name.replace(/\.[^/.]+$/, '');
    selectedArtist = 'ไฟล์ในเครื่อง';
    document.getElementById('sound-bar-name').textContent = '🎵 ' + selectedSong;
    document.getElementById('music-name').textContent = selectedSong;
    document.getElementById('artist-name').textContent = '- ' + selectedArtist;
    showPage('page-post');
});

document.getElementById('use-link-btn').addEventListener('click', () => {
    selectedUrl = document.getElementById('music-link').value.trim();
    selectedSong = document.getElementById('music-link-name').value.trim() || 'เพลงจากลิงก์';
    selectedArtist = document.getElementById('music-link-artist').value.trim() || 'ไม่ระบุ';
    document.getElementById('sound-bar-name').textContent = '🎵 ' + selectedSong;
    document.getElementById('music-name').textContent = selectedSong;
    document.getElementById('artist-name').textContent = '- ' + selectedArtist;
    showPage('page-post');
});

document.getElementById('submit-post').addEventListener('click', () => {
    const caption = document.getElementById('caption-input').value || 'ยินดีต้อนรับสู่ ThaiPodee';
    const videoUrl = URL.createObjectURL(videoFile);
    
    document.getElementById('main-video').src = videoUrl;
    document.getElementById('video-container').style.display = 'block';
    document.getElementById('welcome-area').style.display = 'none';
    document.getElementById('info-area').style.display = 'block';
    document.getElementById('menu-right').style.display = 'flex';
    
    document.getElementById('caption-text').textContent = caption;
    
    if (selectedUrl) {
        bgMusic.src = selectedUrl;
        bgMusic.volume = 0.6;
        bgMusic.play().catch(() => {});
    }
    
    showPage('page-home');
});
</script>

</body>
</html>
