<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;background:#000;overflow:hidden;
  position:fixed;top:0;left:0;right:0;bottom:0;
  font-family:-apple-system,system-ui,sans-serif;
  color:#fff;
}

.top-nav{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0));left:12px;right:12px;
  display:flex;align-items:flex-start;justify-content:space-between;z-index:100;
}
.live-btn{
  font-size:16px;display:flex;align-items:center;gap:4px;margin-top:6px;cursor:pointer;
}
.live-icon{font-size:20px;}

/* กลุ่มตรงกลาง: เมนู + ปุ่มติดตั้ง (ซ่อนก่อนกดแชร์) */
.nav-center-group{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  margin-top:6px;
}
.nav-tabs{
  display:flex;gap:20px;font-size:15px;
}
.nav-tab{opacity:0.7;cursor:pointer;}
.nav-tab.active{opacity:1;font-weight:bold;border-bottom:2px solid #fff;padding-bottom:2px;}

/* ปุ่มติดตั้ง — ซ่อนตั้งแต่แรก ✅ */
.install-btn-red{
  font-size:11px;color:#fff;background:#ff0050;border:none;
  cursor:pointer;padding:3px 10px;border-radius:4px;line-height:1;
  display:none; /* ❌ ซ่อน ไม่โผล่ตั้งแต่แรก */
  margin-top:2px;
}

.search-wrap{
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.version-text{
  font-size:9px;color:#666;line-height:1;margin-bottom:1px;
}
.search-icon{font-size:20px;cursor:pointer;}

.video-container{
  position:fixed;inset:0;background:#000;
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;z-index:1;
}
.video-container video{
  width:100%;height:100%;
  object-fit:cover;display:block;
}

.tap-layer{
  position:fixed;inset:0;z-index:3;cursor:pointer;background:transparent;
}

.ui-layer{
  position:fixed;inset:0;z-index:4;pointer-events:none;
}
.ui-layer > *{pointer-events:auto}

.bottom-info{
  position:absolute;left:16px;bottom:85px;right:100px;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
}
.author{font-size:15px;font-weight:bold;margin-bottom:6px;}
.caption{font-size:13px;line-height:1.5;margin-bottom:6px;}
.music{font-size:12px;display:flex;align-items:center;gap:6px;}

/* ไอคอนด้านขวา — แชร์อยู่ที่เดิม ลำดับที่ 5 ✅ */
.side-icons{
  position:absolute;right:12px;bottom:100px;
  display:flex;flex-direction:column;gap:22px;align-items:center;
}
.side-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
}
.side-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.side-count{font-size:11px;}

.profile-wrap{position:relative;}
.profile-avatar{width:44px;height:44px;border-radius:50%;border:2px solid #fff;overflow:hidden;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.plus-badge{
  position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;background:#ff0050;
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;
}

.disc-icon{
  width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#666,#222);
  display:flex;align-items:center;justify-content:center;animation:spin 3s linear infinite;
}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.nav-bar{
  position:absolute;bottom:0;left:0;right:0;height:65px;
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom,0));
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;color:#999;font-size:10px;cursor:pointer;
}
.nav-item.active{color:#fff}
.nav-icon{font-size:22px}
.nav-center-plus{
  width:52px;height:38px;background:#ff0050;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;
}

.file-input{display:none;}

<body>

<div class="top-nav">
  <div class="live-btn">
    <span class="live-icon">📺</span>
    <span>ไลฟ์</span>
  </div>

  <!-- ตรงกลาง: เมนู + ปุ่มติดตั้ง (ซ่อนก่อนกดแชร์) -->
  <div class="nav-center-group">
    <div class="nav-tabs">
      <span class="nav-tab">นครราชสีมา</span>
      <span class="nav-tab">เพื่อน</span>
      <span class="nav-tab">กำลังติดตาม</span>
      <span class="nav-tab active">สำหรับคุณ</span>
    </div>
    <!-- ปุ่มติดตั้ง — โผล่ที่นี่เมื่อกดแชร์ ✅ -->
    <button class="install-btn-red" id="installBtn">ติดตั้งแอป</button>
  </div>

  <div class="search-wrap">
    <span class="version-text">v1133</span>
    <span class="search-icon">🔍</span>
  </div>
</div>

<div class="video-container">
  <video id="mainVideo" playsinline webkit-playsinline loop autoplay muted></video>
</div>

<div class="tap-layer" id="tapLayer"></div>

<div class="ui-layer">
  <div class="bottom-info">
    <div class="author">@ThaiPodee</div>
    <div class="caption">แตะจอเล่น/หยุด — ใส่ข้อความของคุณเอง</div>
    <div class="music"><span>♪</span><span>เสียงประกอบ</span></div>
  </div>

  <!-- ด้านขวา: แชร์อยู่ที่เดิม ลำดับที่ 5 ✅ -->
  <div class="side-icons">
    <div class="side-item">
      <div class="profile-wrap">
        <div class="profile-avatar"><img src="https://i.imgur.com/KJbRzQY.png" alt="โปรไฟล์"></div>
        <div class="plus-badge">+</div>
      </div>
    </div>
    <div class="side-item">
      <div class="side-icon">❤️</div>
      <div class="side-count">0</div>
    </div>
    <div class="side-item">
      <div class="side-icon">💬</div>
      <div class="side-count">0</div>
    </div>
    <div class="side-item">
      <div class="side-icon">⬜</div>
      <div class="side-count">บันทึก</div>
    </div>
    <div class="side-item" id="shareBtn">
      <div class="side-icon">↗️</div>
      <div class="side-count">แชร์</div>
    </div>
    <div class="side-item">
      <div class="disc-icon">🎵</div>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-item active">
      <span class="nav-icon">🏠</span><span>หน้าหลัก</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🛒</span><span>ร้านค้า</span>
    </div>
    <div class="nav-center-plus" id="uploadTrigger">+</div>
    <div class="nav-item">
      <span class="nav-icon">💬</span><span>ข้อความ</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">👤</span><span>โปรไฟล์</span>
    </div>
  </div>

  <input type="file" id="fileInput" accept="video/*" class="file-input">
</div>

<script>
const video = document.getElementById('mainVideo');
const tapLayer = document.getElementById('tapLayer');
const fileInput = document.getElementById('fileInput');
const uploadTrigger = document.getElementById('uploadTrigger');
const installBtn = document.getElementById('installBtn');
const shareBtn = document.getElementById('shareBtn');

tapLayer.addEventListener('click', () => {
  if (video.paused) video.play();
  else video.pause();
});

uploadTrigger.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  video.src = URL.createObjectURL(f);
  video.load();
  video.play();
});

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});

installBtn.addEventListener('click', async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt = null;
});

/* ==============================================================
   กดแชร์ปั๊บ → ปุ่มติดตั้งโผล่ทันทีตรงกลางบน ✅
   ============================================================== */
shareBtn.addEventListener('click', async () => {
  // โผล่ขึ้นมาเลย ทันที
  installBtn.style.display = 'block';

  const shareData = {
    title: 'ThaiPodee v1133',
    text: 'เปิดแล้วดูตรงกลางบน → กด "ติดตั้งแอป" ได้เลย',
    url: window.location.href
  };

  if (navigator.share) {
    try {
      await navigator.share(shareData);
    } catch (err) {
      await navigator.clipboard.writeText(window.location.href);
      alert('คัดลอกลิงก์แล้ว ✅ → ส่งให้เครื่องที่ 2, 3, 4...\nเปิดแล้วดูตรงกลางบน ปุ่มสีแดงจะโผล่ขึ้นมา');
    }
  } else {
    await navigator.clipboard.writeText(window.location.href);
    alert('คัดลอกลิงก์แล้ว ✅ → ส่งให้เครื่องที่ 2, 3, 4...\nเปิดแล้วปุ่มสีแดงจะโผล่ตรงกลางบน');
  }
});
</script>
