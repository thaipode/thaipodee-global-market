<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Thaipodee</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; background: #000; color: #fff; overflow: hidden; }
    body { position: fixed; inset: 0; }

    /* ===== คอนเทนเนอร์หลัก — ล็อก ไม่เปลี่ยน ===== */
    .app {
      width: 100%; height: 100vh; height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      position: relative; background: #000;
      overflow: hidden;
    }

    /* ===== วิดีโอ — ตรงกลาง เต็มจอ ล็อก ===== */
    .video-area {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
    }
    .video-area video {
      width: 100%; height: 100%;
      object-fit: cover;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .video-placeholder { color: #666; font-size: 16px; text-align: center; padding: 20px; }

    /* ===== แถบบน — ล็อก ===== */
    .top-bar {
      position: absolute; top: max(20px, env(safe-area-inset-top, 0px));
      left: 0; right: 0;
      display: flex; justify-content: center; align-items: center;
      z-index: 15;
    }
    .tab { font-size: 16px; color: rgba(255,255,255,.6); cursor: pointer; padding: 0 12px; }
    .tab.active { color: #fff; font-weight: 600; border-bottom: 2px solid #fff; padding-bottom: 3px; }
    .search-btn { position: absolute; right: 16px; top: max(20px, env(safe-area-inset-top, 0px)); font-size: 22px; cursor: pointer; z-index: 15; }

    /* ===== เมนูขวา 6 ปุ่ม — ล็อก ครบ ===== */
    .right-menu {
      position: absolute; right: 12px;
      bottom: calc(100px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column; align-items: center; gap: 24px;
      z-index: 12;
    }
    .r-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
    .r-icon { font-size: 28px; }
    .r-num { font-size: 12px; margin-top: 2px; }

    .prof-box { position: relative; }
    .prof-img {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid #fff;
      background: url('https://picsum.photos/100/100') center/cover;
      cursor: pointer;
    }
    .follow-add {
      position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
      width: 20px; height: 20px; border-radius: 50%; background: #ff0050;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: bold;
    }
    .music-cover {
      width: 48px; height: 48px; border-radius: 50%;
      background: #222; border: 2px solid #fff;
      animation: spin 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== ข้อมูลล่างซ้าย — ซ่อนไว้ก่อน ไม่โชว์ชื่อปลอม ===== */
    .info-left {
      position: absolute; left: 16px; right: 90px;
      bottom: calc(100px + env(safe-area-inset-bottom, 0px));
      z-index: 12; display: none;
    }
    .username { font-size: 16px; font-weight: 700; margin-bottom: 8px; cursor: pointer; color: #fff; }
    .caption { font-size: 14px; line-height: 1.5; margin-bottom: 6px; }
    .ai-tag { font-size: 11px; opacity: .5; margin-bottom: 8px; display: block; }
    .sound-name { font-size: 13px; display: flex; align-items: center; gap: 6px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ===== แถบความคืบหน้า ===== */
    .progress-line {
      position: absolute; bottom: calc(85px + env(safe-area-inset-bottom, 0px));
      left: 0; right: 0; height: 2px;
      background: rgba(255,255,255,.2); z-index: 12; display: none;
    }
    .progress-done { width: 0%; height: 100%; background: #fff; border-radius: 0 2px 2px 0; transition: width 0.1s linear; }

    /* ===== เมนูล่าง 5 ปุ่ม — ล็อก ครบ ===== */
    .bottom-bar {
      position: absolute; bottom: 0; left: 0; width: 100%;
      height: calc(80px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: #000; display: flex; justify-content: space-around; align-items: center;
      border-top: 1px solid #222; z-index: 12;
    }
    .b-nav { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: #fff; font-size: 11px; opacity: .6; }
    .b-nav.active { opacity: 1; }
    .b-icon { font-size: 24px; }
    .create-box {
      width: 45px; height: 32px; border-radius: 8px;
      background: linear-gradient(90deg, #25f4ee 0%, #fe28ea 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: bold; color: #000; cursor: pointer;
      border: none;
    }
    .dot-badge { position: relative; }
    .dot-red { position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; border-radius: 50%; background: #ff0050; }
    .num-badge { position: absolute; top: -8px; right: -12px; background: #ff0050; color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 10px; }

    /* ===== แผงอัปโหลด — ทำงานได้ ไม่บังเมนู ===== */
    .upload-panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: #121212; border-radius: 20px 20px 0 0;
      padding: 24px; padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      transform: translateY(100%); transition: transform 0.3s ease;
      max-height: 85vh; overflow-y: auto;
    }
    .upload-panel.show { transform: translateY(0); }
    .panel-close { text-align: right; font-size: 24px; cursor: pointer; margin-bottom: 20px; }
    .upload-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; text-align: center; }
    .file-input-wrapper {
      border: 2px dashed #555; border-radius: 12px; padding: 40px 20px;
      text-align: center; cursor: pointer; margin-bottom: 20px;
      transition: border-color 0.2s;
    }
    .file-input-wrapper:hover { border-color: #fe28ea; }
    .file-input-wrapper p { margin-top: 10px; color: #aaa; font-size: 14px; }
    input[type="file"] { display: none; }
    .preview-container { width: 100%; border-radius: 12px; margin-bottom: 16px; display: none; }
    .preview-container video { width: 100%; border-radius: 12px; }
    .input-field {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
      background: #222; color: #fff; margin-bottom: 12px; font-size: 14px;
    }
    .upload-btn {
      width: 100%; padding: 14px; border-radius: 8px; border: none;
      background: linear-gradient(90deg, #25f4ee 0%, #fe28ea 100%);
      color: #000; font-size: 16px; font-weight: 600; cursor: pointer;
    }

    /* ===== รองรับแนวนอน ===== */
    @media (orientation: landscape) {
      .app { max-width: 100%; max-height: 100vh; }
      .right-menu { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); gap: 20px; }
      .info-left { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- วิดีโอ -- ล็อก -->
    <div class="video-area" id="videoArea">
      <div class="video-placeholder" id="videoPlaceholder">กดปุ่ม + เพื่ออัปโหลดวิดีโอ</div>
    </div>

    <!-- แถบบน -- ล็อก -->
    <div class="top-bar">
      <span class="tab" id="tab1">กำลังติดตาม</span>
      <span class="tab active" id="tab2">สำหรับคุณ</span>
    </div>
    <div class="search-btn">🔍</div>

    <!-- เมนูขวา 6 ปุ่ม -- ล็อก ครบ -->
    <div class="right-menu">
      <div class="r-btn prof-box">
        <div class="prof-img"></div>
        <div class="follow-add">+</div>
      </div>
      <div class="r-btn" id="likeBtn">
        <div class="r-icon">❤️</div>
        <div class="r-num" id="likeCount">0</div>
      </div>
      <div class="r-btn">
        <div class="r-icon">💬</div>
        <div class="r-num">0</div>
      </div>
      <div class="r-btn">
        <div class="r-icon">⬜</div>
        <div class="r-num">0</div>
      </div>
      <div class="r-btn">
        <div class="r-icon">➤</div>
        <div class="r-num">0</div>
      </div>
      <div class="r-btn">
        <div class="music-cover"></div>
      </div>
    </div>

    <!-- ข้อมูลล่างซ้าย -- ซ่อนไว้ก่อน -->
    <div class="info-left" id="postInfo">
      <div class="username" id="postUsername"></div>
      <div class="caption" id="videoCaption"></div>
      <div class="ai-tag">ประกอบด้วยสื่อที่สร้างด้วย AI</div>
      <div class="sound-name">🎵 เสียงต้นฉบับ — Thaipodee</div>
    </div>

    <!-- แถบความคืบหน้า -->
    <div class="progress-line" id="progressBar">
      <div class="progress-done" id="progressFill"></div>
    </div>

    <!-- เมนูล่าง 5 ปุ่ม -- ล็อก ครบ -->
    <div class="bottom-bar">
      <div class="b-nav active">
        <div class="b-icon">🏠</div>
        <div>หน้าหลัก</div>
      </div>
      <div class="b-nav dot-badge">
        <div class="b-icon">🛒</div>
        <div>ร้านค้า</div>
        <div class="dot-red"></div>
      </div>
      <button class="create-box" id="createBtn">+</button>
      <div class="b-nav dot-badge">
        <div class="b-icon">💬</div>
        <div>ข้อความ</div>
        <div class="num-badge">99+</div>
      </div>
      <div class="b-nav">
        <div class="b-icon">👤</div>
        <div>โปรไฟล์</div>
      </div>
    </div>

    <!-- แผงอัปโหลด -- ทำงานได้ -->
    <div class="upload-panel" id="uploadPanel">
      <div class="panel-close" id="closeUpload">✕</div>
      <div class="upload-title">อัปโหลดวิดีโอ</div>
      
      <div class="file-input-wrapper" id="fileWrapper">
        <div style="font-size: 32px;">📹</div>
        <p>กดเพื่อเลือกวิดีโอ<br>รองรับ MP4, MOV</p>
        <input type="file" id="videoInput" accept="video/*" />
      </div>

      <div class="preview-container" id="previewContainer">
        <video id="videoPreview" controls muted></video>
      </div>

      <input type="text" class="input-field" id="captionInput" placeholder="เขียนคำบรรยายวิดีโอ..." />
      
      <button class="upload-btn" id="confirmBtn" style="display: none;">โพสต์วิดีโอ</button>
    </div>
  </div>

  <script>
    // สลับแท็บ
    const t1 = document.getElementById('tab1'), t2 = document.getElementById('tab2');
    t1.addEventListener('click', () => { t1.classList.add('active'); t2.classList.remove('active'); });
    t2.addEventListener('click', () => { t2.classList.add('active'); t1.classList.remove('active'); });

    // ปุ่มถูกใจ
    const likeBtn = document.getElementById('likeBtn'), likeCount = document.getElementById('likeCount');
    let isLiked = false, count = 0;
    likeBtn.addEventListener('click', () => {
      isLiked = !isLiked;
      count += isLiked ? 1 : -1;
      likeCount.textContent = count;
      likeBtn.querySelector('.r-icon').style.color = isLiked ? '#ff0050' : '#fff';
    });

    // เปิด-ปิด แผงอัปโหลด
    const createBtn = document.getElementById('createBtn');
    const uploadPanel = document.getElementById('uploadPanel');
    const closeUpload = document.getElementById('closeUpload');
    createBtn.addEventListener('click', () => uploadPanel.classList.add('show'));
    closeUpload.addEventListener('click', () => {
      uploadPanel.classList.remove('show');
      resetUpload();
    });

    // เลือกวิดีโอ + แสดงตัวอย่าง
    const fileWrapper = document.getElementById('fileWrapper');
    const videoInput = document.getElementById('videoInput');
    const previewContainer = document.getElementById('previewContainer');
    const videoPreview = document.getElementById('videoPreview');
    const captionInput = document.getElementById('captionInput');
    const confirmBtn = document.getElementById('confirmBtn');
    const videoArea = document.getElementById('videoArea');
    const videoPlaceholder = document.getElementById('videoPlaceholder');
    const postInfo = document.getElementById('postInfo');
    const videoCaption = document.getElementById('videoCaption');
    const progressBar = document.getElementById('progressBar');

    fileWrapper.addEventListener('click', () => videoInput.click());
    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      videoPreview.src = url;
      previewContainer.style.display = 'block';
      fileWrapper.style.display = 'none';
      confirmBtn.style.display = 'block';
    });

    // โพสต์วิดีโอ — แสดงข้อมูล ซ่อนชื่อจนกว่าจะมีระบบผู้ใช้
    confirmBtn.addEventListener('click', () => {
      const caption = captionInput.value || "วิดีโอใหม่";
      const videoSrc = videoPreview.src;

      videoPlaceholder.style.display = 'none';
      videoArea.innerHTML = `<video id="mainVideo" src="${videoSrc}" autoplay loop muted playsinline style="width:100%;height:100%;object-fit:cover;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);"></video>`;
      
      videoCaption.textContent = caption;
      postInfo.style.display = 'block';
      progressBar.style.display = 'block';
      
      uploadPanel.classList.remove('show');
      resetUpload();
    });

    function resetUpload() {
      videoInput.value = '';
      videoPreview.src = '';
      previewContainer.style.display = 'none';
      fileWrapper.style.display = 'block';
      confirmBtn.style.display = 'none';
      captionInput.value = '';
    }

    // แถบความคืบหน้า
    let progress = 0;
    setInterval(() => {
      const fill = document.getElementById('progressFill');
      if (fill) {
        progress = (progress + 0.5) % 100;
        fill.style.width = progress + '%';
      }
    }, 500);
  </script>
</body>
</html>
