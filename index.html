<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Thaipodee Market Online V2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; min-height: 100vh; overflow-x: hidden; }
    .page { display: none; min-height: 100vh; padding-bottom: 80px; }
    .page.active { display: block; }

    /* ==== ด้านบน: กำลังติดตาม / สำหรับคุณ — เหมือนรูปเป๊ะ ==== */
    .top-tabs { display: flex; justify-content: center; gap: 30px; padding: 12px 0; font-size: 15px; }
    .top-tabs span { padding-bottom: 4px; }
    .top-tabs span.active { border-bottom: 2px solid #fff; font-weight: 500; }
    .top-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 12px; align-items: center; }
    .top-actions img { width: 24px; height: 24px; }

    /* ==== กลางจอ: ข้อความ + วิดีโอ — เหมือนรูปเป๊ะ ==== */
    .video-placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #888; }
    .video-placeholder .icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
    .video-placeholder .title { font-size: 15px; margin-bottom: 6px; }
    .video-placeholder .sub { font-size: 13px; opacity: 0.6; }
    .video-player { width: 100%; height: calc(100vh - 80px); object-fit: contain; display: none; background: #000; }

    /* ==== ด้านขวา 6 ไอคอนเล็ก ๆ — เหมือนรูปเป๊ะ ==== */
    .side-actions { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 24px; align-items: center; z-index: 50; }
    .side-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .side-icon { font-size: 28px; }
    .side-label { font-size: 11px; color: #fff; }
    .profile-wrap { position: relative; }
    .profile-badge { position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px; background: #ff0050; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }

    /* ==== แถบเพลงล่างซ้าย — เหมือนรูปเป๊ะ ==== */
    .music-bar { position: fixed; bottom: 70px; left: 12px; right: 80px; display: flex; align-items: center; gap: 10px; z-index: 50; }
    .music-cover { width: 40px; height: 40px; border-radius: 4px; background: #333; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .music-info { flex: 1; font-size: 13px; line-height: 1.4; }
    .music-title { font-weight: 500; }
    .music-desc { font-size: 11px; color: #aaa; }
    .sound-toggle { font-size: 20px; cursor: pointer; padding: 4px; }

    /* ==== เมนูล่าง 5 ปุ่ม — เหมือนรูปเป๊ะ ==== */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: #fff; text-decoration: none; font-size: 11px; }
    .nav-icon { font-size: 24px; }
    .upload-btn { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(45deg, #ff0050, #ff4080); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; }
    .badge { position: absolute; top: -5px; right: -5px; background: #ff0050; color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 10px; }

    /* ==== หน้าอัปโหลด ==== */
    .upload-area { margin: 30px 20px; padding: 40px 20px; border: 2px dashed #555; border-radius: 12px; text-align: center; cursor: pointer; }
    .upload-area input { display: none; }
    .upload-area .icon { font-size: 48px; margin-bottom: 12px; }
    .form-input { width: calc(100% - 40px); margin: 0 20px 20px; padding: 12px; border-radius: 8px; border: none; background: #2a2a3a; color: #fff; font-size: 15px; }
    .publish-btn { width: calc(100% - 40px); margin: 0 20px; padding: 14px; border-radius: 8px; border: none; background: linear-gradient(45deg, #ff0050, #ff4080); color: #fff; font-size: 17px; font-weight: bold; cursor: pointer; }
    .file-name { text-align: center; margin-top: 10px; color: #4ade80; font-size: 13px; display: none; }
  </style>
</head>
<body>

<!-- ===== หน้าหลัก — เหมือนรูปเป๊ะ 100% ===== -->
<div class="page active" id="page-home">
  <div class="top-tabs">
    <span>กำลังติดตาม</span>
    <span class="active">สำหรับคุณ</span>
  </div>
  <div class="top-actions">
    <span>🔍</span>
  </div>

  <!-- วิดีโอ / ข้อความกลางจอ -->
  <div class="video-placeholder" id="videoPlaceholder">
    <div class="icon">🎬</div>
    <div class="title">วิดีโอจะแสดงที่นี่</div>
    <div class="sub">Thaipodee Market Online V2026</div>
  </div>
  <!-- ✅ เปิดเสียงโดยไม่ต้องกด — แก้แค่ตรงนี้ -->
  <video class="video-player" id="videoPlayer" controls playsinline loop preload="metadata"></video>

  <!-- ด้านขวา 6 ไอคอน — เหมือนรูปเป๊ะ -->
  <div class="side-actions">
    <div class="side-btn" onclick="goToProfile()">
      <div class="profile-wrap">
        <span class="side-icon">👤</span>
        <span class="profile-badge">+</span>
      </div>
    </div>
    <div class="side-btn">
      <span class="side-icon">❤️</span>
      <span class="side-label" id="likeCount">0</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">💬</span>
      <span class="side-label">0</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">⭐</span>
      <span class="side-label">0</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">➡️</span>
      <span class="side-label">แชร์</span>
    </div>
    <div class="side-btn">
      <span class="side-icon">🎵</span>
    </div>
  </div>

  <!-- แถบเพลงล่างซ้าย — เหมือนรูปเป๊ะ -->
  <div class="music-bar" id="musicBar">
    <div class="music-cover">🎵</div>
    <div class="music-info">
      <div class="music-title">D D Y M Music</div>
      <div class="music-desc">เพลงใหม่ — มาฟังกันนะ 🎵 #ดนตรี #เพลง</div>
    </div>
    <span class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</span>
  </div>
</div>

<!-- ===== หน้าอัปโหลด ===== -->
<div class="page" id="page-upload">
  <div style="padding:16px; text-align:center; font-size:18px; font-weight:600;">อัปโหลดวิดีโอ</div>
  <label class="upload-area">
    <input type="file" id="videoInput" accept="video/*">
    <div class="icon">📹</div>
    <div>แตะเพื่อเลือกวิดีโอ</div>
    <div class="file-name" id="fileName"></div>
  </label>
  <input type="text" class="form-input" id="descInput" placeholder="เขียนคำอธิบาย...">
  <button class="publish-btn" onclick="uploadVideo()">เผยแพร่</button>
</div>

<!-- ===== หน้าโปรไฟล์ ===== -->
<div class="page" id="page-profile">
  <div style="text-align:center; padding-top:40px;">
    <div style="width:90px; height:90px; border-radius:50%; background:#333; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:40px;" id="profileAvatar">👤</div>
    <div style="font-size:22px; font-weight:bold;" id="profileName">Komm
