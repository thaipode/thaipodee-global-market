<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ThaiPodee</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
html, body { height: 100%; overflow: hidden; background: #000; color: #fff; }

/* จอวิดีโอเต็มจอ */
.video-container { position: relative; width: 100%; height: 100vh; }
video { width: 100%; height: 100%; object-fit: cover; background: #111; }

/* ข้อมูลด้านล่างวิดีโอ */
.video-info { position: absolute; bottom: 90px; left: 15px; right: 70px; z-index: 10; }
.username { font-weight: bold; font-size: 16px; margin-bottom: 8px; }
.description { font-size: 14px; line-height: 1.4; color: #eee; }

/* แถบเมนูด้านล่าง */
.bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; display: flex; justify-content: space-around; align-items: center; background: #000; z-index: 20; padding: 0 10px; }
.nav-btn { display: flex; flex-direction: column; align-items: center; color: #fff; text-decoration: none; font-size: 12px; }
.nav-icon { font-size: 24px; margin-bottom: 2px; }
.nav-add { width: 50px; height: 50px; border-radius: 50%; background: #f00; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; line-height: 1; }

/* แถบไอคอนด้านขวา */
.side-icons { position: absolute; right: 12px; bottom: 100px; display: flex; flex-direction: column; gap: 22px; align-items: center; z-index: 15; }
.side-icon { font-size: 26px; cursor: pointer; }

/* สถานะเชื่อมต่อ */
#syncStatus { position: absolute; top: 10px; left: 10px; font-size: 13px; color: #0f0; z-index: 30; }

/* แถบเวลา */
.progress-bar { position: absolute; bottom: 75px; left: 10px; right: 10px; height: 3px; background: #444; border-radius: 3px; z-index: 12; }
.progress-fill { height: 100%; background: #fff; width: 0%; border-radius: 3px; position: relative; }
.progress-dot { position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; background: #fff; border-radius: 50%; cursor: grab; }
</style>
</head>
<body>

<div class="video-container">
  <div id="syncStatus">กำลังเชื่อมต่อ...</div>
  
  <video id="mainVideo" playsinline loop></video>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill">
      <div class="progress-dot" id="progressDot"></div>
    </div>
  </div>
  
  <div class="video-info">
    <div class="username" id="username">@Thaipodee-Master-No.1</div>
    <div class="description" id="vidDesc">กด + เพื่ออัปโหลดวิดีโอ</div>
  </div>
  
  <div class="side-icons">
    <div class="side-icon" id="likeBtn">🤍</div>
    <div class="side-icon">💬</div>
    <div class="side-icon">📄</div>
    <div class="side-icon">↗️</div>
    <div class="side-icon">🎵</div>
  </div>
  
  <div class="bottom-nav">
    <a href="#" class="nav-btn"><span class="nav-icon">🏠</span></a>
    <a href="#" class="nav-btn"><span class="nav-icon">🛒</span></a>
    <a href="#" id="upBtn2" class="nav-btn"><span class="nav-add">+</span></a>
    <a href="#" class="nav-btn"><span class="nav-icon">💬</span></a>
    <a href="#" class="nav-btn"><span class="nav-icon">👤</span></a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
<script>
// ==============================================================
// ThaiPodee v1205 — ครบทั้งระบบ เชื่อมต่อ Supabase ตรงเป๊ะ
// ==============================================================

const SUPABASE_URL = 'https://pinoqstzlscqqwietvbv.supabase.com'
const SUPABASE_KEY = 'sb_publishable_lr4yrKHV-OiKmzba1WlyIA_guU3oxTi'

// สร้างการเชื่อมต่อ
const { createClient } = supabase
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

// สร้างรหัสประจำเครื่อง
const MY_ID = localStorage.getItem('tp_my_id') || ('u_' + Date.now())
localStorage.setItem('tp_my_id', MY_ID)

// ตัวแปรหลัก
let vidList = []
let currentIndex = 0
let isLiked = false

// อ้างอิงองค์ประกอบ
const syncStatus = document.getElementById('syncStatus')
const mainVideo = document.getElementById('mainVideo')
const vidDesc = document.getElementById('vidDesc')
const upBtn = document.getElementById('upBtn2')
const likeBtn = document.getElementById('likeBtn')
const progressFill = document.getElementById('progressFill')

// ==============================================================
// โหลดรายการวิดีโอ
// ==============================================================
async function loadVideos() {
  try {
    syncStatus.textContent = 'กำลังโหลด...'
    
    const { data, error } = await supabase
      .from('videos')
      .select('*')
      .order('created_at', { ascending: false })
    
    if (error) throw error
    
    vidList = data || []
    
    if (vidList.length === 0) {
      syncStatus.textContent = 'ออนไลน์ ✅ ยังไม่มีวิดีโอ กด + เพิ่ม'
      vidDesc.textContent = 'กดปุ่ม + ด้านล่างเพื่ออัปโหลดวิดีโอแรก'
      return
    }
    
    syncStatus.textContent = `ออนไลน์ ✅ ${vidList.length} รายการ`
    showVideo(0)
    
  } catch (err) {
    console.error('โหลดไม่ได้:', err)
    syncStatus.textContent = 'เชื่อมต่อไม่ได้ ❌'
  }
}

// ==============================================================
// แสดงวิดีโอ
// ==============================================================
function showVideo(index) {
  if (vidList.length === 0) return
  currentIndex = (index + vidList.length) % vidList.length
  const v = vidList[currentIndex]
  
  mainVideo.src = v.video_url
  vidDesc.textContent = v.description || 'ไม่มีคำอธิบาย'
  isLiked = false
  likeBtn.textContent = '🤍'
  mainVideo.play()
}

// อัปเดตแถบเวลา
mainVideo.addEventListener('timeupdate', () => {
  if (mainVideo.duration) {
    const pct = (mainVideo.currentTime / mainVideo.duration) * 100
    progressFill.style.width = pct + '%'
  }
})

// ==============================================================
// อัปโหลดวิดีโอ
// ==============================================================
upBtn.addEventListener('click', () => {
  const input = document.createElement('input')
  input.type = 'file'
  input.accept = 'video/*'
  input.onchange = async e => {
    const file = e.target.files[0]
    if (!file) return
    
    const desc = prompt('ใส่คำอธิบายวิดีโอ:') || 'วิดีโอใหม่'
    syncStatus.textContent = 'กำลังอัปโหลด...'
    
    try {
      const fileName = `${MY_ID}_${Date.now()}_${file.name}`
      
      // อัปโหลดไฟล์
      const { error: upErr } = await supabase.storage
        .from('videos')
        .upload(`${MY_ID}/${fileName}`, file)
      
      if (upErr) throw upErr
      
      // ลิงก์สาธารณะ
      const { data: { publicUrl } } = supabase.storage
        .from('videos')
        .getPublicUrl(`${MY_ID}/${fileName}`)
      
      // บันทึกลงตาราง
      const { error: dbErr } = await supabase.from('videos').insert([{
        user_id: MY_ID,
        description: desc,
        video_url: publicUrl
      }])
      
      if (dbErr) throw dbErr
      
      syncStatus.textContent = 'อัปโหลดสำเร็จ ✅'
      await loadVideos()
      
    } catch (err) {
      console.error(err)
      alert('ล้มเหลว: ' + err.message)
      syncStatus.textContent = 'อัปโหลดไม่ได้ ❌'
    }
  }
  input.click()
})

// ==============================================================
// สไลด์เปลี่ยนวิดีโอ
// ==============================================================
let startY = 0
mainVideo.addEventListener('touchstart', e => { startY = e.touches[0].clientY })
mainVideo.addEventListener('touchend', e => {
  const diff = startY - e.changedTouches[0].clientY
  if (Math.abs(diff) > 60) {
    showVideo(currentIndex + (diff > 0 ? 1 : -1))
  }
})

// กดไลค์
likeBtn.addEventListener('click', () => {
  isLiked = !isLiked
  likeBtn.textContent = isLiked ? '❤️' : '🤍'
})

// เริ่มทำงาน
loadVideos()
</script>
</body>
</html>
