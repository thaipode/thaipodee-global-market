<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thaipodee Market Online V2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;overflow:hidden;background:#000;color:#fff;font-family:sans-serif}
    .app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
    .main{flex:1;position:relative;width:100%;overflow:hidden;background:#000;cursor:pointer}
    video,.img{width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0;background:#000}
    .hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#aaa;z-index:6;cursor:pointer}
    .hint i{font-size:48px;margin-bottom:12px}
    .side{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;gap:24px;z-index:10}
    .side-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
    .side-item i{font-size:28px}
    .bottom{height:60px;min-height:60px;background:#000;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #222;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);z-index:20}
    .nav{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#888}
    .nav.active{color:#fff}
    .plus{width:44px;height:44px;background:#fff;color:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;cursor:pointer}
    .profile{position:fixed;inset:0;background:#000;z-index:100;padding:20px;overflow-y:auto;display:none}
    .close{position:absolute;top:10px;right:10px;font-size:24px;cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:20px}
    .cell{aspect-ratio:9/16;background:#222;border-radius:4px;overflow:hidden}
  </style>
</head>
<body>
  <div class="app">
    <div class="main" id="main">
      <div class="hint" id="hint">
        <i class="fas fa-plus-circle"></i>
        <p>แตะเพื่ออัปโหลด</p>
      </div>
      <video id="vid" loop playsinline style="display:none;"></video>
      <img id="pic" class="img" style="display:none;" alt="">
    </div>
    <div class="side">
      <div class="side-item" id="pTop"><i class="fas fa-user-circle text-white text-2xl"></i></div>
      <div class="side-item" id="like"><i class="far fa-heart text-2xl"></i><span id="lc" class="text-xs mt-1">0</span></div>
      <div class="side-item"><i class="far fa-comment text-2xl"></i><span class="text-xs mt-1">0</span></div>
      <div class="side-item"><i class="far fa-bookmark text-2xl"></i></div>
      <div class="side-item"><i class="fas fa-music text-2xl"></i></div>
      <div class="side-item"><i class="fas fa-ellipsis-v text-2xl"></i></div>
    </div>
    <div class="bottom">
      <div class="nav active" id="nHome"><i class="fas fa-home text-xl"></i></div>
      <div class="nav" id="nSearch"><i class="fas fa-search text-xl"></i></div>
      <div class="nav plus" id="up">+</div>
      <div class="nav" id="nMsg"><i class="far fa-paper-plane text-xl"></i></div>
      <div class="nav" id="nProf"><i class="far fa-user text-xl"></i></div>
    </div>
    <input type="file" id="file" accept="video/*,image/*" style="display:none;">
    <div class="profile" id="profScr">
      <i class="fas fa-times close" id="closeP"></i>
      <div class="text-center mt-10">
        <div class="w-20 h-20 bg-gray-600 rounded-full mx-auto"></div>
        <h2 class="text-xl mt-3 font-bold">Thaipodee_market</h2>
        <p class="text-gray-400 mt-1">@Thaipodee_market</p>
        <div class="flex justify-center gap-8 mt-5">
          <div><div id="vc" class="font-bold">0</div><div class="text-xs text-gray-400">วิดีโอ</div></div>
          <div><div class="font-bold">0</div><div class="text-xs text-gray-400">ติดตาม</div></div>
        </div>
      </div>
      <h4 class="font-semibold mt-8 mb-3">ผลงานของฉัน</h4>
      <div class="grid" id="grid">
        <div class="col-span-3 text-center py-8 text-gray-400">ยังไม่มีโพสต์</div>
      </div>
    </div>
  </div>
  <script>
    const $=id=>document.getElementById(id);
    const main=$('main'), hint=$('hint'), vid=$('vid'), pic=$('pic'), file=$('file');
    const nHome=$('nHome'), nSearch=$('nSearch'), nMsg=$('nMsg'), nProf=$('nProf');
    const profScr=$('profScr'), closeP=$('closeP');
    const like=$('like'), lc=$('lc'), up=$('up'), grid=$('grid'), vc=$('vc');
    let posts=[], isVid=false, liked=false, likeCount=0;

    function closeAll(){
      profScr.style.display='none';
      document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
    }

    // ✅ ปุ่มบวกตรงกลางจอ — ทำงานแน่นอน
    hint.addEventListener('click', ()=>file.click());
    // ✅ ปุ่มบวกด้านล่าง — ทำงานแน่นอน
    up.addEventListener('click', ()=>file.click());

    // เลือกไฟล์ — ทั้งรูปและวิดีโอ
    file.addEventListener('change', (e)=>{
      const f=e.target.files[0];
      if(!f) return;
      const url=URL.createObjectURL(f);
      hint.style.display='none';
      vid.style.display='none';
      pic.style.display='none';
      isVid=f.type.startsWith('video/');
      if(isVid){
        vid.style.display='block';
        vid.src=url;
        vid.muted=false;
        vid.play().catch(()=>{});
      }else{
        pic.style.display='block';
        pic.src=url;
      }
      posts.unshift({type:isVid?'video':'image',url});
      vc.textContent=posts.length;
      grid.innerHTML=posts.map(p=>`<div class="cell">${p.type==='video'?'<video src="'+p.url+'" muted></video>':'<img src="'+p.url+'" alt="">'}</div>`).join('');
    });

    // กดวิดีโอเพื่อหยุด/เล่น
    main.addEventListener('click', (e)=>{
      if(e.target===hint || e.target===up) return;
      if(isVid && vid.src){
        if(vid.paused) vid.play();
        else vid.pause();
      }
    });

    // ไลค์
    like.addEventListener('click', ()=>{
      liked=!liked;
      likeCount+=liked?1:-1;
      lc.textContent=likeCount;
      like.querySelector('i').className=liked?'fas fa-heart text-red-500':'far fa-heart text-2xl';
    });

    // เมนูล่าง
    nHome.addEventListener('click', ()=>{closeAll();nHome.classList.add('active');});
    nSearch.addEventListener('click', ()=>{closeAll();nSearch.classList.add('active');});
    nMsg.addEventListener('click', ()=>{closeAll();nMsg.classList.add('active');});
    nProf.addEventListener('click', ()=>{closeAll();nProf.classList.add('active');profScr.style.display='block';});
    closeP.addEventListener('click', ()=>{profScr.style.display='none';nProf.classList.remove('active');});
  </script>
</body>
</html>
