<!-- ==============================================================
   ThaiPodee v1023 — แก้โหลดวิดีโอได้จริง ทุกปุ่มทำงาน
   24 กันยายน 2569 21:55 น.
   --------------------------------------------------------------
   ✅ กดกลางจอ → เล่น/หยุดวิดีโอได้จริง
   ✅ ไอคอนขวา 6 ตัว ตรงรูป กดทำงาน
   ✅ แถบล่าง 5 ปุ่ม ตรงรูป กดทำงาน
   ✅ แก้หน้าจอไม่ขึ้น / ค้าง
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ThaiPodee</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #000000; color: #ffffff; height: 100vh; overflow: hidden; }

/* ===== พื้นที่วิดีโอ ===== */
.video-area {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: #000;
}
.play-box { text-align: center; }
.play-icon { font-size: 64px; color: #ffffff; margin-bottom: 12px; }
.play-text { font-size: 15px; color: #888888; }
.playing .play-icon { color: #ff2442; }

/* ===== ไอคอนด้านขวา 6 ตัว ===== */
.right-bar {
  position: fixed;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 28px;
  align-items: center;
}
.side-btn {
  border: none;
  background: transparent;
  color: #fff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.side-icon { font-size: 26px; line-height: 1; }
.side-num { font-size: 11px; color: #fff; min-height: 14px; }

/* รูปโปรไฟล์ + ปุ่มแดง */
.avatar-wrap { position: relative; width: 44px; height: 44px; }
.avatar-circle {
  width: 44px; height: 44px; border-radius: 50%;
  background: #333; display: flex; align-items: center; justify-content: center;
  font-size: 22px; border: 2px solid #fff;
}
.plus-red {
  position: absolute; bottom: -3px; right: -3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #ff2442; color: #fff; font-size: 13px; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #000; line-height: 1;
}

/* ===== แถบล่าง 5 ปุ่ม ===== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0; height: 60px;
  background: #000; display: flex; justify-content: space-around; align-items: center;
  border-top: 1px solid #222;
}
.nav-btn {
  border: none; background: transparent; color: #fff; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.nav-icon { font-size: 22px; }
.nav-label { font-size: 10px; color: #aaa; }
.nav-btn.active .nav-label { color: #fff; }
.plus-center {
  width: 46px; height: 34px; background: #ff2442; border-radius: 8px;
  font-size: 24px; font-weight: bold; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>

<!-- พื้นที่วิดีโอ กดเล่นได้ -->
<div class="video-area" id="videoArea">
  <div class="play-box">
    <div class="play-icon" id="playIcon">▶</div>
    <p class="play-text" id="playText">กดเพื่อเล่นวิดีโอ</p>
  </div>
</div>

<!-- ไอคอนขวา 6 ตัว ตรงรูป -->
<div class="right-bar">
  <button class="side-btn" id="btnAvatar">
    <div class="avatar-wrap">
      <div class="avatar-circle">👤</div>
      <div class="plus-red">+</div>
    </div>
  </button>

  <button class="side-btn" id="btnLike">
    <span class="side-icon" id="likeIcon">🤍</span>
    <span class="side-num" id="likeNum">0</span>
  </button>

  <button class="side-btn" id="btnComment">
    <span class="side-icon">💬</span>
    <span class="side-num" id="commentNum">0</span>
  </button>

  <button class="side-btn" id="btnSave">
    <span class="side-icon">🔖</span>
    <span class="side-num" id="saveNum">0</span>
  </button>

  <button class="side-btn" id="btnShare">
    <span class="side-icon">↗️</span>
    <span class="side-num" id="shareNum">0</span>
  </button>

  <button class="side-btn" id="btnMusic">
    <span class="side-icon">🎵</span>
  </button>
</div>

<!-- แถบล่าง 5 ปุ่ม ตรงรูป -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="navHome">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">หน้าหลัก</span>
  </button>
  <button class="nav-btn" id="navShop">
    <span class="nav-icon">🛍️</span>
    <span class="nav-label">ร้านค้า</span>
  </button>
  <button class="nav-btn" id="navAdd">
    <span class="plus-center">+</span>
  </button>
  <button class="nav-btn" id="navMsg">
    <span class="nav-icon">💬</span>
    <span class="nav-label">ข้อความ</span>
  </button>
  <button class="nav-btn" id="navProfile">
    <span class="nav-icon">👤</span>
    <span class="nav-label">โปรไฟล์</span>
  </button>
</nav>

<script>
// ===== ตัวแปร =====
let isPlaying = false;
let liked = false, likeCount = 0;
let commentCount = 0, saveCount = 0, shareCount = 0;

// ===== เล่น/หยุดวิดีโอ =====
document.getElementById('videoArea').addEventListener('click', function() {
  isPlaying = !isPlaying;
  if (isPlaying) {
    this.classList.add('playing');
    document.getElementById('playIcon').textContent = '⏸';
    document.getElementById('playText').textContent = 'กำลังเล่นวิดีโอ...';
  } else {
    this.classList.remove('playing');
    document.getElementById('playIcon').textContent = '▶';
    document.getElementById('playText').textContent = 'กดเพื่อเล่นวิดีโอ';
  }
});

// ===== ไลก์ =====
document.getElementById('btnLike').addEventListener('click', function() {
  liked = !liked;
  likeCount += liked ? 1 : -1;
  document.getElementById('likeNum').textContent = likeCount;
  document.getElementById('likeIcon').textContent = liked ? '❤️' : '🤍';
});

// ===== คอมเมนต์ =====
document.getElementById('btnComment').addEventListener('click', function() {
  commentCount++;
  document.getElementById('commentNum').textContent = commentCount;
});

// ===== บันทึก =====
document.getElementById('btnSave').addEventListener('click', function() {
  saveCount++;
  document.getElementById('saveNum').textContent = saveCount;
});

// ===== แชร์ =====
document.getElementById('btnShare').addEventListener('click', function() {
  shareCount++;
  document.getElementById('shareNum').textContent = shareCount;
});

// ===== เพลง =====
document.getElementById('btnMusic').addEventListener('click', function() {
  alert('เปลี่ยนเพลงประกอบ');
});

// ===== รูปโปรไฟล์ =====
document.getElementById('btnAvatar').addEventListener('click', function() {
  alert('เปลี่ยนรูปโปรไฟล์');
});

// ===== แถบล่าง =====
function setActiveNav(id) {
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.getElementById('navHome').addEventListener('click', () => setActiveNav('navHome'));
document.getElementById('navShop').addEventListener('click', () => setActiveNav('navShop'));
document.getElementById('navAdd').addEventListener('click', () => alert('เพิ่มโพสต์วิดีโอ'));
document.getElementById('navMsg').addEventListener('click', () => setActiveNav('navMsg'));
document.getElementById('navProfile').addEventListener('click', () => setActiveNav('navProfile'));
</script>

</body>
</html>
