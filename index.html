   Thaipodee Market — v59
   วันที่: 23 กันยายน 2569 08:03 น.
   แก้: ปุ่ม + ตรงกลางกดไม่ได้ → ทำงานชัดเจนทันที
   ============================================================== -->

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ThaiPodee Market</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  /* แถบบน */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 44px;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
  }
  .tab { padding: 0 12px; font-size: 14px; color: #999; }
  .tab.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 4px; }

  /* พื้นที่วิดีโอ */
  .video-area {
    position: absolute;
    top: 44px; left: 0; right: 0; bottom: 60px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 15px;
  }

  /* ข้อความด้านซ้ายล่าง */
  .video-desc {
    position: absolute;
    left: 12px;
    bottom: 80px;
    right: 80px;
    font-size: 13px;
    line-height: 1.5;
  }

  /* ===== 6 ปุ่มด้านขวา ตรงรูป ===== */
  .side-buttons {
    position: fixed;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    z-index: 150;
  }
  .side-btn {
    display: flex; flex-direction: column; align-items: center;
    color: #fff; cursor: pointer;
  }
  .side-icon { font-size: 22px; line-height: 1; }
  .side-num { font-size: 11px; margin-top: 2px; }
  .profile-circle {
    width: 48px; height: 48px; border-radius: 50%;
    background: #333; border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .profile-circle img { width: 100%; height: 100%; object-fit: cover; }
  .music-icon {
    width: 48px; height: 48px; border-radius: 50%;
    background: #222; display: flex; align-items: center; justify-content: center;
  }

  /* ===== เมนูล่าง 5 ปุ่ม ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: #000;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid #222;
    z-index: 99999;
  }
  .nav-btn {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #999; cursor: pointer;
  }
  .nav-btn.active { color: #fff; }
  .nav-icon { font-size: 20px; line-height: 1; }
  .nav-label { font-size: 10px; margin-top: 2px; }

  /* ===== ปุ่ม + ตรงกลาง — กดได้แน่นอน! ===== */
  .center-col {
    display: flex; align-items: center; justify-content: center;
  }
  .plus-button {
    width: 48px; height: 34px;
    background: #ffffff;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: bold;
    color: #000000;
    position: relative;
    cursor: pointer;
    border: none;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .plus-button:active {
    transform: scale(0.95);
    background: #eeeeee;
  }
  .plus-button::before {
    content: '';
    position: absolute;
    width: 42px; height: 42px;
    background: #fff;
    border-radius: 50%;
    top: -4px; z-index: -1;
  }
</style>
</head>
<body>

<!-- แถบบน -->
<div class="top-bar">
  <span class="tab">กำลังติดตาม</span>
  <span class="tab active">สำหรับคุณ</span>
</div>

<!-- พื้นที่วิดีโอ -->
<div class="video-area" id="videoArea">
  เริ่มใช้งาน ThaiPodee Market
</div>

<!-- คำอธิบาย -->
<div class="video-desc">
  <strong>ชื่อผู้ใช้</strong><br>
  คำอธิบายวิดีโอจะแสดงที่นี่<br>
  <span style="color:#888; font-size:11px;">เสียง · ชื่อเพลง</span>
</div>

<!-- 6 ปุ่มด้านขวา -->
<div class="side-buttons">
  <div class="side-btn">
    <div class="profile-circle">
      <img src="https://i.pravatar.cc/150?img=23" alt="โปรไฟล์">
    </div>
  </div>
  <div class="side-btn"><span class="side-icon">❤️</span><span class="side-num">28.4K</span></div>
  <div class="side-btn"><span class="side-icon">💬</span><span class="side-num">412</span></div>
  <div class="side-btn"><span class="side-icon">⭐</span><span class="side-num">8.0K</span></div>
  <div class="side-btn"><span class="side-icon">↗️</span><span class="side-num">แชร์</span></div>
  <div class="side-btn"><div class="music-icon">🎵</div></div>
</div>

<!-- เมนูล่าง — ปุ่ม + กดได้แน่นอน! -->
<nav class="bottom-nav">
  <div class="nav-btn active" data-page="home">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">หน้าหลัก</span>
  </div>

  <div class="nav-btn" data-page="shop">
    <span class="nav-icon">🛒</span>
    <span class="nav-label">ร้านค้า</span>
  </div>

  <div class="center-col">
    <button class="plus-button" id="addBtn">+</button>
  </div>

  <div class="nav-btn" data-page="inbox">
    <span class="nav-icon">📥</span>
    <span class="nav-label">กล่องข้อความ</span>
  </div>

  <div class="nav-btn" data-page="profile">
    <span class="nav-icon">👤</span>
    <span class="nav-label">ฉัน</span>
  </div>
</nav>

<script>
// เปลี่ยนหน้าเมนูล่าง
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ===== ปุ่ม + ตรงกลาง — ทำงานชัดเจน! =====
const addButton = document.getElementById('addBtn');

// ทั้ง click และ touchstart รองรับมือถือจริง
addButton.addEventListener('click', openUpload);
addButton.addEventListener('touchstart', openUpload);

function openUpload(e) {
  e.preventDefault();
  alert('✅ กดปุ่มเพิ่มวิดีโอแล้ว!\n\nจะเปิดหน้าเลือกไฟล์วิดีโอที่นี่');
}
</script>

</body>
</html>
