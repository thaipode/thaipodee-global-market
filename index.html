<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee — ของไทย ไปไกลทั่วโลก</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
html,body{height:100%;background:#000;color:#fff;overflow:hidden}

.swiper{height:100dvh;width:100%;overflow-y:auto;scroll-snap-type:y mandatory;background:#111}
.slide{height:100dvh;width:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;border-bottom:1px solid #222}
.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}

.welcome{text-align:center;z-index:20;padding:20px}
.welcome h1{font-size:32px;color:#FFB800;margin-bottom:8px}
.status{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:20px;font-size:12px;max-width:92%}
.status.ok{background:#0f2f1a;color:#4cd964;border:1px solid #1a5c2a}
.status.wait{background:#2a2410;color:#ffcc00;border:1px solid #664d00}

.progress{position:fixed;top:0;left:0;height:3px;background:#FF4757;width:0%;z-index:200;transition:width .25s}
.msg{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 22px;border-radius:24px;font-size:12px;z-index:150;max-width:92%;text-align:center}
.msg.ok{background:#1a7a2e}
.msg.err{background:#a32020}
.msg.hidden{opacity:0;pointer-events:none}

.nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#000;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #1a1a1a;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#777;flex:1}
.nav-add-wrap{flex:1;display:flex;justify-content:center}
.nav-add{width:58px;height:38px;background:#FF4757;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;cursor:pointer}

#fileInput{display:none}
.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;color:#666;font-size:14px}
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<div id="msgBox" class="msg hidden"></div>

<div class="swiper" id="swiper">
  <div class="slide">
    <div class="welcome">
      <h1>ThaiPodee</h1>
      <p>ของไทย ไปไกลทั่วโลก</p>
      <p style="color:#FF6B00;font-weight:600;margin-top:10px;">กด + อัปโหลดวิดีโอแรกเลย</p>
      <p class="status ok" id="status">✅ พร้อมใช้งาน — เก็บที่ GitHub ฟรี</p>
      <p style="margin-top:10px;font-size:10px;color:#888">💡 อัปเดตอัตโนมัติทุก 5 วินาที — ทุกคนเห็นตรงกัน</p>
    </div>
  </div>
</div>

<nav class="nav">
  <div class="nav-item active"><span>🏠</span><span>หน้าแรก</span></div>
  <div class="nav-item"><span>🔍</span><span>ค้นหา</span></div>
  <div class="nav-add-wrap"><div class="nav-add" id="uploadBtn">+</div></div>
  <div class="nav-item"><span>💬</span><span>ข้อความ</span></div>
  <div class="nav-item"><span>👤</span><span>ฉัน</span></div>
</nav>

<input type="file" id="fileInput" accept="video/*">

<script>
// ===== ตั้งค่า GitHub — ใส่ครบแล้ว ✅ =====
const GITHUB_USER = 'thaipodee';
const GITHUB_REPO = 'thaipodee-global-market';
const GITHUB_BRANCH = 'main';
const GITHUB_TOKEN = 'ghp_grBkJzXv4u3r7owfouTp69LuAdaiK2KzGNI';

const DATA_FILE = 'data/videos.json';

const swiper = document.getElementById('swiper');
const msgBox = document.getElementById('msgBox');
const progress = document.getElementById('progress');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const statusEl = document.getElementById('status');

function showMsg(t, type='normal', dur=5000){ 
  msgBox.textContent = t; 
  msgBox.className = 'msg ' + type; 
  msgBox.classList.remove('hidden'); 
  if(dur > 0) setTimeout(() => msgBox.classList.add('hidden'), dur); 
}

uploadBtn.addEventListener('click', e => { 
  e.preventDefault(); 
  fileInput.click(); 
});

// --- โหลดรายการวิดีโอ ---
async function fetchVideos(){
  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DATA_FILE}?ref=${GITHUB_BRANCH}`);
    if(res.status === 404) return [];
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return JSON.parse(atob(data.content));
  } catch(err) {
    console.error('โหลดไม่ได้:', err);
    return [];
  }
}

// --- บันทึกรายการ ---
async function saveVideos(videos, sha=null){
  const body = {
    message: 'อัปเดตรายการวิดีโอ',
    content: btoa(JSON.stringify(videos, null, 2)),
    branch: GITHUB_BRANCH
  };
  if(sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DATA_FILE}`, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${GITHUB_TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error(`บันทึกไม่ได้: ${res.status}`);
}

// --- อัปโหลดไฟล์วิดีโอ ---
async function uploadVideoFile(file){
  const fileName = 'videos/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const reader = new FileReader();
  const base64 = await new Promise(r => { 
    reader.onload = e => r(e.target.result.split(',')[1]); 
    reader.readAsDataURL(file); 
  });

  const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${fileName}`, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${GITHUB_TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: `อัปโหลด: ${file.name}`,
      content: base64,
      branch: GITHUB_BRANCH
    })
  });
  if(!res.ok) throw new Error(`อัปโหลดไม่ได้: ${res.status}`);
  const data = await res.json();
  return { url: data.content.download_url, path: fileName };
}

// --- แสดงผลวิดีโอ ---
function renderVideos(videos){
  const welcome = swiper.querySelector('.slide');
  swiper.innerHTML = '';
  swiper.appendChild(welcome);

  videos.slice().reverse().forEach((v, idx) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    const shortName = v.name.length > 25 ? v.name.slice(0,25)+'...' : v.name;
    
    slide.innerHTML = `
      <div class="loader">⏳ กำลังโหลด...</div>
      <video src="${v.url}" loop playsinline muted preload="none" controls
             style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000"></video>
      <div style="position:absolute;top:14px;right:14px;z-index:40">
        <button onclick="deleteVideo(${idx})" 
                style="background:rgba(220,20,20,0.9);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer">🗑️</button>
      </div>
      <div style="position:absolute;bottom:90px;left:14px;right:14px;z-index:10">
        <h3 style="font-size:14px">${shortName}</h3>
        <p style="font-size:11px;color:#ccc">${v.sizeKB} KB • ${v.time}</p>
      </div>
    `;

    const vid = slide.querySelector('video');
    const loader = slide.querySelector('.loader');
    vid.addEventListener('loadeddata', () => loader && (loader.style.display='none'));
    slide.addEventListener('click', e => {
      if(e.target.tagName === 'BUTTON' || e.target.tagName === 'VIDEO') return;
      vid.paused ? vid.play() : vid.pause();
    });
    swiper.appendChild(slide);
  });
}

// --- อัปโหลดเมื่อเลือกไฟล์ ---
fileInput.addEventListener('change', async e => {
  const file = e.target.files[0];
  if(!file) return;

  const sizeKB = Math.round(file.size / 1024);
  showMsg(`📦 ${file.name} (${sizeKB} KB) → กำลังอัปโหลด...`, '', 0);
  progress.style.width = '10%';

  try {
    const {url, path} = await uploadVideoFile(file);
    progress.style.width = '60%';

    const videos = await fetchVideos();
    videos.push({
      name: file.name,
      url: url,
      path: path,
      sizeKB: sizeKB,
      time: new Date().toLocaleString('th-TH')
    });

    // เอา sha ไฟล์เดิม
    let sha = null;
    try {
      const r = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DATA_FILE}?ref=${GITHUB_BRANCH}`);
      if(r.ok) sha = (await r.json()).sha;
    } catch(e){}

    await saveVideos(videos, sha);
    progress.style.width = '100%';
    showMsg(`✅ อัปโหลดสำเร็จ!`, 'ok', 3000);
    
    setTimeout(() => { progress.style.width='0%'; loadAndRender(); }, 1500);
  } catch(err) {
    progress.style.width = '0%';
    showMsg(`❌ ผิดพลาด: ${err.message}`, 'err', 8000);
  }
  e.target.value = '';
});

// --- ลบวิดีโอ ---
window.deleteVideo = async function(idx){
  if(!confirm('ลบวิดีโอนี้?')) return;
  let videos = await fetchVideos();
  videos.splice(videos.length - 1 - idx, 1);
  let sha = null;
  try {
    const r = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DATA_FILE}?ref=${GITHUB_BRANCH}`);
    if(r.ok) sha = (await r.json()).sha;
  } catch(e){}
  await saveVideos(videos, sha);
  showMsg('✅ ลบแล้ว', 'ok');
  loadAndRender();
};

// --- โหลดและแสดงผล ---
async function loadAndRender(){
  const videos = await fetchVideos();
  renderVideos(videos);
  if(videos.length > 0){
    statusEl.textContent = `✅ มี ${videos.length} รายการ — ทุกคนเห็นตรงกัน`;
    statusEl.className = 'status ok';
  }
}

// --- รีเฟรชอัตโนมัติ ---
loadAndRender();
setInterval(loadAndRender, 5000);
</script>

</body>
</html>
