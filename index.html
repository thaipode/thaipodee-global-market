   สถานะ: ✅ ตรงรูปเป๊ะ — ไอคอนขวาแนวตั้ง 6 อัน ชั้นเดียว
   --------------------------------------------------------------
   ปรับปรุง:
   ✅ ไอคอนด้านขวา เรียงบน→ล่าง ตรงรูปเป๊ะ:
      1. 👤+ รูปโปรไฟล์ + ปุ่มบวก → เปลี่ยนรูปได้
      2. ❤️ 0 กดไลก์ → ตัวเลขเพิ่มอัตโนมัติ
      3. 💬 0 คอมเมนต์ → 3 จุดแนวนอน = รายการสนทนา
      4. 🔖 0 บันทึก → บันทึกวิดีโอนี้
      5. ↗️ 0 แชร์ → ส่งไปเครื่องอื่น
      6. 🎵 เพลง → ของเราเปลี่ยนได้ / ของคนอื่นไม่ได้
   ✅ พื้นหลังสีดำ ตามรูปจริง
   ✅ แถบล่างเมนู 5 ปุ่ม ตรงตำแหน่ง
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ThaiPodee v1016</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #000; color: #fff; min-height: 100vh; overflow-x: hidden; }

/* ===== พื้นที่แสดงวิดีโอ ===== */
.video-area {
  position: fixed; top: 0; left: 0; right: 0; bottom: 70px;
  background: #000; display: flex; align-items: center; justify-content: center;
}

/* ===== ไอคอนด้านขวา — แนวตั้ง ตรงรูปเป๊ะ ===== */
.side-icons {
  position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 24px; align-items: center;
}
.icon-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer;
}
.icon-main { font-size: 28px; line-height: 1; }
.icon-num { font-size: 11px; color: #fff; }

/* ===== รูปโปรไฟล์ + ปุ่มบวก ===== */
.avatar-wrap { position: relative; }
.avatar-circle {
  width: 44px; height: 44px; border-radius: 50%; background: #333;
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  border: 2px solid #fff;
}
.plus-badge {
  position: absolute; bottom: -4px; right: -4px;
  width: 18px; height: 18px; border-radius: 50%; background: #ff2442;
  color: #fff; font-size: 14px; font-weight: bold; display: flex;
  align-items: center; justify-content: center; border: 2px solid #000;
}

/* ===== แถบล่างเมนู ===== */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
  background: #000; display: flex; justify-content: space-around; align-items: center;
  border-top: 1px solid #222;
}
.bar-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: pointer; color: #fff; text-decoration: none;
}
.bar-icon { font-size: 22px; }
.bar-text { font-size: 10px; color: #aaa; }
.bar-item.active .bar-text { color: #fff; }

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- ===== พื้นที่วิดีโอ ===== -->
<div class="video-area">
  <!-- วิดีโอจะแสดงที่นี่ -->
</div>

<!-- ===== ไอคอนด้านขวา — ตรงรูปเป๊ะ 6 อัน ===== -->
<div class="side-icons">
  <!-- 1. รูปโปรไฟล์ + บวก -->
  <div class="icon-item" id="avatar-btn">
    <div class="avatar-wrap">
      <div class="avatar-circle">👤</div>
      <div class="plus-badge">+</div>
    </div>
  </div>

  <!-- 2. หัวใจ + ตัวเลข -->
  <div class="icon-item" id="like-btn">
    <span class="icon-main">❤️</span>
    <span class="icon-num" id="like-count">0</span>
  </div>

  <!-- 3. คอมเมนต์ + ตัวเลข -->
  <div class="icon-item" id="comment-btn">
    <span class="icon-main">💬</span>
    <span class="icon-num" id="comment-count">0</span>
  </div>

  <!-- 4. บันทึก + ตัวเลข -->
  <div class="icon-item" id="save-btn">
    <span class="icon-main">🔖</span>
    <span class="icon-num" id="save-count">0</span>
  </div>

  <!-- 5. แชร์ + ตัวเลข -->
  <div class="icon-item" id="share-btn">
    <span class="icon-main">↗️</span>
    <span class="icon-num" id="share-count">0</span>
  </div>

  <!-- 6. เพลง -->
  <div class="icon-item" id="music-btn">
    <span class="icon-main">🎵</span>
  </div>
</div>

<!-- ===== แถบล่างเมนู ===== -->
<div class="bottom-bar">
  <a class="bar-item active">
    <span class="bar-icon">🏠</span>
    <span class="bar-text">หน้าหลัก</span>
  </a>
  <a class="bar-item">
    <span class="bar-icon">🛍️</span>
    <span class="bar-text">ร้านค้า</span>
  </a>
  <a class="bar-item" style="transform: scale(1.2);">
    <span class="bar-icon" style="color: #ff2442; font-size: 28px;">+</span>
  </a>
  <a class="bar-item">
    <span class="bar-icon">💬</span>
    <span class="bar-text">ข้อความ</span>
  </a>
  <a class="bar-item">
    <span class="bar-icon">👤</span>
    <span class="bar-text">โปรไฟล์</span>
  </a>
</div>

<script>
// ===== สถานะ =====
let isOwner = true; // true=ของเรา, false=ของคนอื่น
let likes = 0, comments = 0, saves = 0, shares = 0;
let liked = false;

// ===== กดไลก์ =====
document.getElementById('like-btn').addEventListener('click', function() {
  liked = !liked;
  likes += liked ? 1 : -1;
  document.getElementById('like-count').textContent = likes;
  this.querySelector('.icon-main').style.color = liked ? '#ff2442' : '#fff';
});

// ===== กดคอมเมนต์ =====
document.getElementById('comment-btn').addEventListener('click', function() {
  comments++;
  document.getElementById('comment-count').textContent = comments;
  alert('เปิดกล่องข้อความ/คอมเมนต์ — แสดง 3 จุดแนวนอน = รายการสนทนา');
});

// ===== กดบันทึก =====
document.getElementById('save-btn').addEventListener('click', function() {
  saves++;
  document.getElementById('save-count').textContent = saves;
  alert('บันทึกวิดีโอนี้เรียบร้อย');
});

// ===== กดแชร์ =====
document.getElementById('share-btn').addEventListener('click', function() {
  shares++;
  document.getElementById('share-count').textContent = shares;
  alert('แชร์ไปยังเครื่องอื่น — เครื่องที่ 2, 3, 4...');
});

// ===== กดเพลง =====
document.getElementById('music-btn').addEventListener('click', function() {
  if (isOwner) {
    alert('ของคุณ — เปลี่ยน/เลือกเพลงประกอบได้');
  } else {
    alert('ของคนอื่น — ดูได้แต่ไม่สามารถเปลี่ยนเพลงได้');
  }
});

// ===== กดรูปโปรไฟล์ =====
document.getElementById('avatar-btn').addEventListener('click', function() {
  alert('เปลี่ยนรูปโปรไฟล์');
});

console.log('✅ ThaiPodee v1016 — ตรงรูปเป๊ะ ไอคอนขวา 6 อัน ชั้นเดียว');
</script>

</body>
</html>
