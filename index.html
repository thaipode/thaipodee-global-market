<!--
📌 โค้ดลำดับที่ 12-2 — ล็อกทุกส่วนไว้ แก้เฉพาะปุ่มโฮม
🔒 ล็อก: เมนูขวา, เมนูล่าง, รูปแสดง, เลือกเสียง, บันทึกข้อมูล — ไม่แตะต้อง
✅ แก้: ปุ่มโฮมกดแล้วกลับโพสต์แรกทันที
✅ ปุ่มข้ามหน้าเสียง → กลับได้ชัดเจน
✅ ทุกอย่างที่ทำได้แล้ว ยังคงอยู่ครบเหมือนเดิม
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThaiPodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        html, body { height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; background: #000; color: #fff; }
        .page { display: none; position: absolute; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
        .page.active { display: block; }

        .feed-container { position: absolute; inset: 0; overflow: hidden; }
        .feed-slider { transition: transform 0.4s ease-out; }
        .post-slide { position: relative; width: 100vw; height: 100vh; height: 100dvh; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

        .media-area { position: relative; width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .media-area video, .media-area img { max-width: 100vw; max-height: 100vh; object-fit: contain; background: #000; }
        .bg-audio { position: absolute; opacity: 0; pointer-events: none; }

        .info-left { position: absolute; left: 16px; bottom: 90px; right: 90px; z-index: 10; }
        .acc-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .desc-text { font-size: 13px; margin-bottom: 4px; color: #ddd; }
        .music-row { font-size: 12px; color: #bbb; margin-top: 6px; }

        /* 🔒 ล็อกเมนูด้านขวา — ไม่แก้ */
        .menu-right { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 20; }
        .menu-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: auto; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; background: #555; margin-bottom: 4px; }
        .icon { font-size: 28px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
        .num { font-size: 11px; margin-top: 2px; }

        /* 🔒 ล็อกเมนูด้านล่าง — ไม่แก้ */
        .nav-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 65px; display: flex; justify-content: space-around; align-items: flex-end; padding: 8px 12px 16px; z-index: 30; background: transparent; }
        .nav-col { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 60px; position: relative; pointer-events: auto; cursor: pointer; }
        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 10px; color: #aaa; }
        .upload-box { width: 48px; height: 32px; background: #fff; border-radius: 6px; position: relative; }
        .upload-box::before { content: ''; position: absolute; width: 20px; height: 2px; background: #000; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .upload-box::after { content: ''; position: absolute; width: 2px; height: 20px; background: #000; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .file-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        /* หน้าเลือกเสียง — ล็อกรูปแบบไว้ */
        .sound-page { background: #000; padding: 16px; height: 100vh; height: 100dvh; overflow-y: auto; }
        .sound-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { font-size: 22px; cursor: pointer; color: #fff; }
        .sound-title { font-size: 18px; font-weight: bold; }
        .section-title { font-size: 15px; font-weight: bold; margin: 20px 0 10px; }
        .local-area { background: #1a1a2e; border-radius: 10px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
        .local-text { display: flex; align-items: center; gap: 10px; }
        .hidden-input { display: none; }
        .select-btn { background: #ff2442; color: #fff; border: none; padding: 10px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        .select-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div id="page-feed" class="page active">
    <div class="feed-container" id="feed-container">
        <div class="feed-slider" id="feed-slider"></div>
    </div>
    <!-- 🔒 เมนูล่าง — ล็อกครบทุกปุ่ม -->
    <div class="nav-bottom">
        <div class="nav-col" id="home-btn">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">หน้าหลัก</span>
        </div>
        <div class="nav-col">
            <span class="nav-icon">🛒</span>
            <span class="nav-label">ตลาด</span>
        </div>
        <div class="nav-col" id="upload-trigger">
            <div class="upload-box"></div>
            <input type="file" id="media-input" accept="video/*,image/*" class="file-input">
            <span class="nav-label">อัปโหลด</span>
        </div>
        <div class="nav-col">
            <span class="nav-icon">💬</span>
            <span class="nav-label">ข้อความ</span>
        </div>
        <div class="nav-col">
            <span class="nav-icon">👤</span>
            <span class="nav-label">โปรไฟล์</span>
        </div>
    </div>
</div>

<div id="page-sound" class="page sound-page">
    <div class="sound-header">
        <span class="back-btn" id="skip-btn">← ข้าม / กลับ</span>
        <span class="sound-title">เลือกเสียงเพลง</span>
        <span></span>
    </div>

    <div class="section-title">📂 เลือกจากไฟล์ในเครื่อง</div>
    <label class="local-area">
        <div class="local-text">
            <span style="font-size:24px">🎵</span>
            <div>
                <div>แตะเพื่อเลือกเพลง</div>
                <div style="font-size:12px; color:#888">เช่น กำลังใจจากแนวหลัง.mp3</div>
            </div>
        </div>
        <input type="file" accept="audio/*" id="audio-input" class="hidden-input">
    </label>

    <button class="select-btn" id="post-confirm-btn">✅ โพสต์เลย</button>
</div>

<script>
const MY_ACCOUNT = '@ThaiPodee_Master ✨';
let posts = [];
let currentSlide = 0;
let pendingMedia = null;
let pendingMediaType = null;
let selectedAudioUrl = null;
let selectedAudioName = 'เสียงต้นฉบับ';

// 🔒 ระบบเก็บข้อมูล — ล็อกไว้
const DB = {
    KEY: 'thaipodee_posts_v12_final',
    getAll() { try { const d = localStorage.getItem(this.KEY); return d ? JSON.parse(d) : []; } catch { return []; } },
    save(list) { localStorage.setItem(this.KEY, JSON.stringify(list)); },
    add(post) { const all = this.getAll(); all.unshift(post); this.save(all); return all; }
};

// เปลี่ยนหน้า
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// สร้างโพสต์ — 🔒 ล็อกรูปแบบไว้
function renderPost(post, idx) {
    const hasAudio = !!post.audioUrl;
    const isVideo = post.type === 'video';
    return `
    <div class="post-slide" style="transform: translateY(${idx * 100}vh);">
        <div class="media-area">
            ${isVideo ? `
            <video id="vid-${idx}" loop playsinline ${idx === 0 ? 'autoplay' : ''} ${hasAudio ? 'muted' : ''}>
                <source src="${post.mediaUrl}">
            </video>
            ` : `<img src="${post.mediaUrl}" alt="โพสต์">`}
            ${hasAudio ? `<audio class="bg-audio" id="aud-${idx}" loop src="${post.audioUrl}">` : ''}
        </div>
        <div class="info-left">
            <div class="acc-name">${post.author}</div>
            <div class="desc-text">${post.caption}</div>
            <div class="music-row">🎵 ${post.audioName}</div>
        </div>
        <!-- 🔒 เมนูขวา — ครบเหมือนเดิม -->
        <div class="menu-right">
            <div class="menu-btn"><img class="avatar" src="https://picsum.photos/id/1012/100/100"></div>
            <div class="menu-btn"><span class="icon">❤️</span><span class="num">${post.likes}</span></div>
            <div class="menu-btn"><span class="icon">💬</span><span class="num">${post.comments}</span></div>
            <div class="menu-btn"><span class="icon">⭐</span><span class="num">${post.saves}</span></div>
            <div class="menu-btn"><span class="icon">↗️</span><span class="num">${post.shares}</span></div>
            <div class="menu-btn"><span class="icon">🎵</span></div>
        </div>
    </div>`;
}

// โหลดฟีด
function loadFeed() {
    posts = DB.getAll();
    const slider = document.getElementById('feed-slider');
    if (posts.length === 0) {
        slider.innerHTML = '<div style="text-align:center;padding-top:50vh;color:#888">กด + เพื่อโพสต์แรกของคุณ</div>';
        return;
    }
    slider.innerHTML = posts.map((p, i) => renderPost(p, i)).join('');
    goToSlide(0);
}

// 🎯 ปุ่มโฮมทำงานตรงนี้ — กลับโพสต์แรก
function goToSlide(index) {
    if (index < 0 || index >= posts.length) return;
    currentSlide = index;
    document.getElementById('feed-slider').style.transform = `translateY(-${index * 100}vh)`;
    
    // เล่น-หยุดให้ตรงกัน
    posts.forEach((_, i) => {
        const vid = document.getElementById(`vid-${i}`);
        const aud = document.getElementById(`aud-${i}`);
        if (!vid) return;
        if (i === index) {
            vid.play().catch(() => { vid.muted = true; vid.play(); });
            if (aud) { aud.currentTime = vid.currentTime; aud.play().catch(() => {}); }
        } else {
            vid.pause();
            if (aud) aud.pause();
        }
    });
}

// กดปุ่มโฮม
document.getElementById('home-btn').addEventListener('click', () => {
    goToSlide(0);
});

// เลื่อนด้วยนิ้ว
let startY = 0, dragging = false;
document.addEventListener('touchstart', e => { startY = e.touches[0].clientY; dragging = true; });
document.addEventListener('touchend', e => {
    if (!dragging) return; dragging = false;
    const diff = startY - e.changedTouches[0].clientY;
    if (Math.abs(diff) > 60) {
        if (diff > 0 && currentSlide < posts.length - 1) goToSlide(currentSlide + 1);
        else if (diff < 0 && currentSlide > 0) goToSlide(currentSlide - 1);
    }
});

// เลือกไฟล์วิดีโอ/รูป
document.getElementById('media-input').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    pendingMediaType = f.type.startsWith('video') ? 'video' : 'image';
    pendingMedia = URL.createObjectURL(f);
    selectedAudioUrl = null;
    selectedAudioName = 'เสียงต้นฉบับ';
    showPage('page-sound');
});

// เลือกไฟล์เสียง
document.getElementById('audio-input').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    selectedAudioUrl = URL.createObjectURL(f);
    selectedAudioName = '🎵 ' + f.name;
});

// ข้าม / กลับ
document.getElementById('skip-btn').addEventListener('click', () => {
    selectedAudioUrl = null;
    selectedAudioName = 'เสียงต้นฉบับ';
    pendingMedia = null;
    showPage('page-feed');
});

// ยืนยันโพสต์
document.getElementById('post-confirm-btn').addEventListener('click', () => {
    if (!pendingMedia) return;
    const newPost = {
        id: Date.now(),
        author: MY_ACCOUNT,
        caption: 'โพสต์ใหม่',
        mediaUrl: pendingMedia,
        type: pendingMediaType,
        audioUrl: selectedAudioUrl,
        audioName: selectedAudioName,
        likes: 0, comments: 0, saves: 0, shares: 0,
        time: new Date().toISOString()
    };
    posts = DB.add(newPost);
    // ล้างค่า
    pendingMedia = null;
    pendingMediaType = null;
    selectedAudioUrl = null;
    selectedAudioName = 'เสียงต้นฉบับ';
    // กลับหน้าหลัก + โชว์โพสต์ใหม่
    showPage('page-feed');
    loadFeed();
});

// เริ่มทำงาน
window.addEventListener('load', loadFeed);
</script>
</body>
</html>
