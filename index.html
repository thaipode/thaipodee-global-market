<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THAIPODEE V2026</title>
    <link rel="icon" href="https://i.imgur.com/8ZxQrL9.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        html, body { 
            background: #000; color: #fff; 
            height: 100vh; 
            height: 100dvh; /* รองรับจอโค้ง มือถือทุกรุ่น */
            overflow: hidden; /* ปิดการเลื่อนจอ */
            position: fixed; inset: 0;
        }

        /* Header — คงที่ ด้านบน */
        .header { 
            position: absolute; top: 0; left: 0; right: 0; 
            height: 50px; background: #000; 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 12px; padding-top: env(safe-area-inset-top, 0px);
            border-bottom: 1px solid #333; z-index: 100; 
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .logo { width: 28px; height: 28px; border-radius: 4px; }
        .title { font-size: 16px; font-weight: bold; }
        .version { font-size: 11px; color: #888; background: #222; padding: 2px 6px; border-radius: 4px; }
        .menu-btn { font-size: 22px; cursor: pointer; }

        /* Video Area — กลางจอ พอดี */
        .video-area { 
            position: absolute; top: 50px; left: 0; right: 0; bottom: 160px;
            background: linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
            display: flex; align-items: flex-start; justify-content: center; 
            padding-top: 20px;
        }
        .video-text { color: #ccc; font-size: 14px; text-align: center; padding: 0 20px; }

        /* Right Buttons — อยู่ในพื้นที่ ไม่ทับ ไม่หาย */
        .side-buttons { 
            position: absolute; right: 12px; bottom: 170px; 
            display: flex; flex-direction: column; gap: 24px; z-index: 50; 
        }
        .side-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .side-icon { font-size: 24px; }
        .side-label { font-size: 10px; color: #aaa; margin-top: 2px; }

        /* Info Bar — ด้านล่างวิดีโอ เห็นชัดเจน */
        .info-bar { 
            position: absolute; bottom: 80px; left: 0; right: 0;
            padding: 12px; display: flex; align-items: flex-start; gap: 10px; 
            border-top: 1px solid #222; background: #000;
        }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #4f46e5; flex-shrink: 0; }
        .info-text { flex: 1; }
        .username { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .desc { font-size: 13px; color: #ccc; line-height: 1.4; }

        /* Bottom Nav — ล่างสุด ไม่ถูกบัง */
        .bottom-nav { 
            position: absolute; bottom: 0; left: 0; right: 0; 
            height: 70px; padding-bottom: env(safe-area-inset-bottom, 0px);
            background: #000; border-top: 1px solid #333; 
            display: flex; justify-content: space-around; align-items: center; z-index: 100; 
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .nav-icon { font-size: 20px; }
        .nav-label { font-size: 11px; color: #aaa; }
        .nav-item.active .nav-label { color: #fff; }
        .plus-btn { 
            width: 40px; height: 28px; background: #fff; border-radius: 4px; 
            color: #000; font-size: 20px; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; 
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-left">
        <img src="https://i.imgur.com/8ZxQrL9.png" alt="Logo" class="logo">
        <span class="title">THAIPODEE</span>
        <span class="version">V2026</span>
    </div>
    <span class="menu-btn">☰</span>
</div>

<!-- Video Area -->
<div class="video-area">
    <p class="video-text">THAIPODEE V2026 — แพลตฟอร์มตลาดโลก จากไทยสู่ทั่วโลก 🌍</p>
</div>

<!-- Right Buttons -->
<div class="side-buttons">
    <div class="side-btn"><span class="side-icon">❤️</span><span class="side-label">ถูกใจ</span></div>
    <div class="side-btn"><span class="side-icon">💬</span><span class="side-label">ความคิด</span></div>
    <div class="side-btn"><span class="side-icon">↗️</span><span class="side-label">แชร์</span></div>
    <div class="side-btn"><span class="side-icon">🛒</span><span class="side-label">ตะกร้า</span></div>
</div>

<!-- Info Bar -->
<div class="info-bar">
    <div class="avatar"></div>
    <div class="info-text">
        <div class="username">@thaipodee_official</div>
        <div class="desc">THAIPODEE V2026 — แพลตฟอร์มออนไลน์ระดับโลก ซื้อ ขาย แชร์ ได้ทุกที่ทั่วโลก 🌍 🇹🇭</div>
    </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
    <div class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าแรก</span>
    </div>
    <div class="nav-item">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">ค้นหา</span>
    </div>
    <div class="nav-item">
        <span class="plus-btn">+</span>
    </div>
    <div class="nav-item">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
    </div>
    <div class="nav-item">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

</body>
</html>
