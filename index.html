  <div class="bottom-info">

    <div class="caption">แตะจอเล่น/หยุด — กดปุ่มแดงติดตั้งเลย</div>

  <!-- ✅ ใช้ชื่อไฟล์ตรงกับ GitHub -->
  <div class="side-icons">
    <div class="side-item">
      <div class="profile-wrap">
        <div class="profile-avatar">
          <img src="thaipodee_logo_icon.png?v=1147" alt="ThaiPodee" onerror="this.parentElement.innerHTML='TP';this.parentElement.style.display='flex';this.parentElement.style.alignItems='center';this.parentElement.style.justifyContent='center';this.parentElement.style.fontWeight='bold';this.parentElement.style.fontSize='18px'">

    <div class="side-item"><div class="side-icon">⬜</div><div class="side-count">บันทึก</div></div>
    <div class="side-item" id="shareBtn"><div class="side-icon">↗️</div><div class="side-count">แชร์</div></div>

    <div class="nav-item"><span class="nav-icon">🛒</span><span>ร้านค้า</span></div>
    <div class="nav-center-plus" id="uploadBtn">+</div>
    <div class="nav-item"><span class="nav-icon">💬</span><span>ข้อความ</span></div>
    <div class="nav-item"><span class="nav-icon">👤</span><span>โปรไฟล์</span></div>
  </div>
  <input type="file" id="fileInput" accept="video/*" class="file-input">
</div>

<script>
const CURRENT_VERSION = 'v1147';
const STORAGE_KEY = 'thaipodee_last_version';

const video = document.getElementById('mainVideo');
const tapLayer = document.getElementById('tapLayer');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const installBtn = document.getElementById('installBtn');
const shareBtn = document.getElementById('shareBtn');

// อัปเดตอัตโนมัติ
const lastVersion = localStorage.getItem(STORAGE_KEY);
if (lastVersion && lastVersion !== CURRENT_VERSION) {
  localStorage.setItem(STORAGE_KEY, CURRENT_VERSION);
  window.location.reload(true);
} else {
  localStorage.setItem(STORAGE_KEY, CURRENT_VERSION);
}

function isAppInstalled() {
  return (window.matchMedia('(display-mode: standalone)').matches) ||
         (window.navigator.standalone === true);
}

if (isAppInstalled()) {
  installBtn.classList.add('hidden');
}

tapLayer.addEventListener('click', () => {
  if (video.paused) video.play();
  else video.pause();
});

uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  video.src = URL.createObjectURL(f);
  video.load();
  video.play();
});

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!isAppInstalled()) installBtn.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
  if (isAppInstalled()) {
    installBtn.classList.add('hidden');
    return;
  }
  if (!deferredPrompt) {
    alert('📱 กดเมนู ⋮ ที่มุมขวาบน → เพิ่มหน้าจอหลัก → ติดตั้ง\n✅ เปิดจากลิงก์ GitHub รูปจะขึ้นเอง');
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    installBtn.textContent = '✅ ติดตั้งแล้ว';
    installBtn.classList.add('installed');
    setTimeout(() => installBtn.classList.add('hidden'), 1200);
  }
  deferredPrompt = null;
});

window.addEventListener('load', () => {
  setTimeout(() => {
    if (isAppInstalled()) installBtn.classList.add('hidden');
  }, 300);
});

shareBtn.addEventListener('click', async () => {
  const shareData = {
    title: `ThaiPodee ${CURRENT_VERSION}`,
    text: 'กดลิงก์ → กดปุ่มแดง ติดตั้งแอปเลย — ไอคอนรูปโลโก้ ThaiPodee',
    url: window.location.href
  };
  if (navigator.share) {
    try { await navigator.share(shareData); }
    catch { await navigator.clipboard.writeText(window.location.href); alert('คัดลอกลิงก์แล้ว ✅'); }
  } else {
    await navigator.clipboard.writeText(window.location.href);
    alert('คัดลอกลิงก์แล้ว ✅');
  }
});
</script>
