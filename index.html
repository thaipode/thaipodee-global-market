<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Thaipodee</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    body { position: fixed; inset: 0; }

    /* ===== SPLASH SCREEN ===== */
    .splash-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #000 0%, #1a1a2e 50%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease, transform 0.5s ease;
    }
    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 30%;
      background: linear-gradient(135deg, #25f4ee 0%, #fe28ea 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      font-weight: bold;
      color: #000;
      margin-bottom: 24px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .splash-name {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(90deg, #25f4ee, #fe28ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .splash-sub {
      font-size: 14px;
      color: rgba(255,255,255,.5);
      letter-spacing: 1px;
    }
    .splash-fade {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }

    /* ===== แอปหลัก ===== */
    .app {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 100%;
      margin: 0 auto;
      position: relative;
      background: #000;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.4s ease 0.2s;
    }
    .app.show { opacity: 1; }

    /* ===== วิดีโอ — รักษาสัดส่วนเดิมเป๊ะ! ห้ามเปลี่ยน ห้ามหมุน ===== */
    .video-area {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    .video-area video {
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center center;
      background: #000;
      transform: rotate(0deg) !important;
      pointer-events: none;
    }

    .video-placeholder {
      color: #666;
      font-size: 16px;
      text-align: center;
      padding: 20px;
    }

    /* ===== ป้ายบอกสัดส่วน ===== */
    .aspect-ratio-badge {
      position: absolute;
      top: max(60px, env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.7);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      z-index: 14;
      display: none;
      border: 1px solid rgba(255,255,255,.2);
    }
    .aspect-ratio-badge.tall { border-color: #25f4ee; color: #25f4ee; }
    .aspect-ratio-badge.wide { border-color: #fe28ea; color: #fe28ea; }

    /* ===== ปุ่มเปิด/ปิดเสียง — ไอคอนเล็กๆ ไม่มีพื้นหลัง แบบ TikTok ===== */
    .sound-toggle {
      position: absolute;
      right: 12px;
      bottom: calc(235px + env(safe-area-inset-bottom, 0px));
      font-size: 22px;
      z-index: 13;
      cursor: pointer;
      color: #fff;
      background: transparent;
      width: auto;
      height: auto;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      line-height: 1;
    }
    .sound-toggle svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
    }

    /* ===== แถบบน ===== */
    .top-bar {
      position: absolute;
      top: max(18px, env(safe-area-inset-top, 0px));
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 15;
      padding: 0 8px;
    }

    .tab {
      font-size: 16px;
      color: rgba(255,255,255,.6);
      cursor: pointer;
      padding: 0 12px;
    }
    .tab.active {
      color: #fff;
      font-weight: 600;
      border-bottom: 2px solid #fff;
      padding-bottom: 3px;
    }

    .search-btn {
      position: absolute;
      right: 12px;
      top: max(18px, env(safe-area-inset-top, 0px));
      font-size: 22px;
      cursor: pointer;
      z-index: 15;
    }

    /* ===== เมนูขวา 6 ปุ่ม ===== */
    .right-menu {
      position: absolute;
      right: 8px;
      bottom: calc(95px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 12;
    }

    .r-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .r-icon { font-size: 28px; }
    .r-num { font-size: 12px; margin-top: 2px; }

    .prof-box { position: relative; cursor: pointer; }
    .prof-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: url('https://picsum.photos/100/100') center/cover;
      cursor: pointer;
    }
    .follow-add {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ff0050;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }
    .music-cover {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #222;
      border: 2px solid #fff;
      animation: spin 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== ข้อมูลล่างซ้าย ===== */
    .info-left {
      position: absolute;
      left: 12px;
      right: 85px;
      bottom: calc(95px + env(safe-area-inset-bottom, 0px));
      z-index: 12;
      display: none;
    }
    .username {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      cursor: pointer;
      color: #fff;
      transition: opacity 0.2s;
    }
    .username:hover { opacity: 0.8; }
    .caption {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 6px;
      color: #f0f00f;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .ai-tag { font-size: 11px; opacity: 0.5; margin-bottom: 8px; display: block; }
    .sound-name {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== แถบความคืบหน้า ===== */
    .progress-line {
      position: absolute;
      bottom: calc(80px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255,255,255,.2);
      z-index: 12;
      display: none;
    }
    .progress-done {
      width: 0%;
      height: 100%;
      background: #fff;
      border-radius: 0 2px 2px 0;
      transition: width 0.1s linear;
    }

    /* ===== เมนูล่าง 5 ปุ่ม ===== */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(80px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #222;
      z-index: 12;
    }

    .b-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #fff;
      font-size: 11px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .b-nav:hover { opacity: 1; }
    .b-nav.active { opacity: 1; }
    .b-icon { font-size: 24px; }
    .create-box {
      width: 45px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(90deg, #25f4ee 0%, #fe28ea 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      border: none;
    }
    .dot-badge { position: relative; }
    .dot-red {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff0050;
    }
    .num-badge {
      position: absolute;
      top: -8px;
      right: -12px;
      background: #ff0050;
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
    }

    /* ===== หน้าโปรไฟล์ ===== */
    .profile-page {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 30;
      display: none;
      flex-direction: column;
      padding: 20px;
      padding-top: max(40px, env(safe-area-inset-top, 0px));
      color: #fff;
      overflow-y: auto;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: url('https://picsum.photos/200/200') center/cover;
    }
    .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 5px; }
    .profile-stats { display: flex; gap: 25px; margin: 15px 0; }
    .stat-item {
      text-align: center;
      color: #fff;
      text-decoration: none;
    }
    .stat-num { font-size: 18px; font-weight: 700; }
    .stat-label { font-size: 12px; opacity: 0.7; }
    .profile-desc { font-size: 14px; line-height: 1.6; opacity: 0.8; margin-bottom: 20px; }
    .profile-back {
      position: absolute;
      top: max(15px, env(safe-area-inset-top, 0px));
      left: 15px;
      font-size: 24px;
      cursor: pointer;
      z-index: 31;
    }
    .profile-videos-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
      margin-top: 102px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }
    .profile-videos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .profile-video-item {
      aspect-ratio: 9/16;
      background: #1a1a1a;
      borderR: 6px;
      overflow: hidden;
      cursor: pointer;
    }
    .profile-video-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .no-videos {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 14px;
    }

    /* ===== แผงอัปโหลด ===== */
    .upload-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #121212;
      border-radius: 20px 20px 0 0;
      padding: 24px;
      padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      max-height: 90vh;
      overflow-y: auto;
    }
    .upload-panel.show { transform: translateY(0); }
    .panel-close {
      text-align: right;
      font-size: 24px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .upload-title {
      display: none;
    }
    .aspect-guide {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.6;
      color: #fff;
      text-align: center;
    }
    .aspect-guide strong {
      display: none;
    }
    .aspect-guide span {
      display: inline-block;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 20px;
      padding: 4px 10px;
      margin: 0 4px;
      font-size: 12px;
      color: #fff;
    }
    .file-input-wrapper {
      border: 2px dashed #555;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }
    .file-input-wrapper:hover { border-color: #fe28ea; }
    .file-input-wrapper p { margin-top: 10px; color: #aaa; font-size: 14px; }
    input[type="file"] { display: none; }
    .preview-container {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
      background: #000;
      overflow: hidden;
    }
    .preview-container video { width: 100%; border-radius: 12px; display: block; }
    .caption-input {
      width: 100%;
      min-height: 50px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #1e1e1e;
      color: #fff;
      margin-bottom: 16px;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    .caption-input:focus {
      border-color: #fe28ea;
      background: #252525;
    }
    .upload-btn {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, #25f4ee 0%, #fe28ea 100%);
      color: #000;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .upload-btn:active { transform: scale(0.98); }

    /* ===== แนวนอน — เนื้อหาขยับขึ้น วิดีโอยังเป็นแนวเดิม ===== */
    @media (orientation: landscape) {
      .app { max-width: 100%; max-height: 100vh; }
      .video-area video {
        max-width: 100vw;
        max-height: 100vh;
        width: auto;
        height: auto;
        object-fit: contain;
        transform: rotate(0deg) !important;
      }
      .right-menu { bottom: calc(75px + env(safe-area-inset-bottom, 0px)); gap: 20px; }
      .info-left { bottom: calc(75px + env(safe-area-inset-bottom, 0px)); }
      .progress-line { bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
      .bottom-bar { height: calc(60px + env(safe-area-inset-bottom, 0px)); }
      .sound-toggle {
        bottom: calc(200px + env(safe-area-inset-bottom, 0px));
      }
    }
  </style>
</head>
