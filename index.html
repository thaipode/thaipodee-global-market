<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFB800">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="thaipodee_logo_icon.png">
  <title>ThaiPodee</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
    .screen{width:100vw;height:100vh;display:flex;flex-direction:column}
    .video-area{flex:1;display:flex;align-items:center;justify-content:center;background:#111;position:relative}
    video{max-width:100%;max-height:85%;object-fit:contain}
    .info{padding:12px 16px}
    .username{font-weight:bold;font-size:16px;margin-bottom:4px}
    .caption{font-size:14px;opacity:0.9;line-height:1.4}
    .side-menu{position:absolute;right:12px;bottom:120px;display:flex;flex-direction:column;gap:20px;align-items:center}
    .icon-btn{width:48px;height:48px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:none;color:#fff}
    .bottom-nav{height:60px;background:#111;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #333}
    .nav-item{text-align:center;opacity:0.7;font-size:12px}
    .nav-item.active{opacity:1}
    .upload-btn{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:#FFB800;display:flex;align-items:center;justify-content:center;font-size:30px;color:#000;font-weight:bold;cursor:pointer;border:none}
  </style>
</head>
<body>
  <div class="screen">
    <div class="video-area" id="videoArea">
      <video id="mainVideo" controls autoplay loop playsinline></video>
      <div class="side-menu">
        <button class="icon-btn">❤️</button>
        <button class="icon-btn">💬</button>
        <button class="icon-btn">↗️</button>
      </div>
      <div class="info" id="videoInfo" style="position:absolute;bottom:20px;left:16px;right:80px">
        <div class="username" id="vidUser">ThaiPodee</div>
        <div class="caption" id="vidDesc">ยินดีต้อนรับสู่ชุมชนของเรา</div>
      </div>
    </div>
    <button class="upload-btn" id="uploadBtn">+</button>
    <div class="bottom-nav">
      <div class="nav-item active">หน้าแรก</div>
      <div class="nav-item">ค้นหา</div>
      <div class="nav-item">กล่องจดหมาย</div>
      <div class="nav-item">โปรไฟล์</div>
    </div>
  </div>
  <script>
    let videos = [];
    let currentIndex = 0;

    async function loadVideos() {
      try {
        const res = await fetch('data/videos.json');
        videos = await res.json();
        if(videos.length > 0) showVideo(0);
      } catch (e) {
        console.log('รอข้อมูล...');
      }
    }

    function showVideo(index) {
      const v = videos[index];
      if(!v) return;
      document.getElementById('mainVideo').src = v.url;
      document.getElementById('vidUser').textContent = '@' + v.username;
      document.getElementById('vidDesc').textContent = v.description;
    }

    document.getElementById('uploadBtn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'video/*';
      input.onchange = e => {
        const file = e.target.files[0];
        if(!file) return;
        const url = URL.createObjectURL(file);
        videos.unshift({
          username: 'คุณ',
          description: 'วิดีโอใหม่ของฉัน',
          url: url
        });
        showVideo(0);
        alert('อัปโหลดแล้ว! (บันทึกสู่ระบบจะทำในขั้นตอนต่อไป)');
      };
      input.click();
    });

    loadVideos();
  </script>
</body>
</html>
