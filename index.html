<!-- ===================================================== -->
<!-- ThaiPodee Market -->
<!-- ลำดับที่ 30 | 16 กันยายน 2569 เวลา 20:16 -->
<!-- ตามรูป: หน้าตา+ไอคอนตรงเป๊ะ → เลือกไฟล์เล่นได้ก่อน -->
<!-- ยังไม่ส่งคลาวด์ ยังไม่บันทึก — แค่แสดงผลให้ได้ก่อน -->
<!-- ===================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Thaipodee Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        html, body { height: 100dvh; width: 100vw; overflow: hidden; background: #000; color: #fff; }

        .page { display: none; position: absolute; inset: 0; width: 100vw; height: 100dvh; }
        .page.active { display: block; }

        /* ===== พื้นที่แสดงวิดีโอ ===== */
        .feed-container { position: absolute; inset: 0; overflow: hidden; }
        .feed-slider { height: 100%; position: relative; }
        .post-slide { position: relative; width: 100vw; height: 100dvh; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

        .media-container { width: 100vw; height: 100dvh; display: flex; align-items: center; justify-content: center; background: #000; }
        .media-container video, .media-container img { max-width: 100vw; max-height: 100dvh; width: auto; height: auto; object-fit: contain; }

        .empty-hint { text-align: center; color: #888; line-height: 2; font-size: 15px; }
        .empty-hint .cloud-icon { font-size: 22px; margin-bottom: 10px; }

        /* ===== ข้อมูลซ้ายล่าง ===== */
        .info-left { position: absolute; left: 16px; bottom: 90px; right: 90px; z-index: 10; }
        .username { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .caption { font-size: 13px; color: #ddd; margin-bottom: 4px; }
        .music-line { font-size: 12px; color: #bbb; display: flex; align-items: center; gap: 4px; }

        /* ===== เมนูด้านขวา — ตรงลำดับเป๊ะ ===== */
        .menu-right {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 24px; align-items: center; z-index: 20;
        }
        .menu-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .avatar-wrap { position: relative; margin-bottom: 4px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #f5a623, #f76b1c); border: 2px solid #fff; }
        .avatar-plus {
            position: absolute; bottom: -2px; right: -2px;
            width: 16px; height: 16px; background: #ff2442; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold;
        }
        .icon { font-size: 26px; }
        .stat-num { font-size: 11px; color: #fff; }
        .btn-label { font-size: 10px; color: #fff; margin-top: 1px; }

        /* ===== เมนูล่าง — ตรงเป๊ะ ===== */
        .nav-bottom {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 65px; display: flex; justify-content: space-around;
            align-items: center; padding: 6px 4px 12px;
            background: #000; border-top: 1px solid #222;
            z-index: 999;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 2px; min-width: 65px; cursor: pointer;
        }
        .nav-icon { font-size: 22px; }
        .nav-label { font-size: 10px; color: #888; margin-top: 2px; }
        .nav-item.active .nav-label { color: #fff; font-weight: 600; }

        /* ปุ่ม + กลาง */
        .plus-center { position: relative; width: 70px; height: 45px; display: flex; align-items: center; justify-content: center; }
        .plus-btn {
            width: 48px; height: 32px; background: #fff; border-radius: 6px;
            position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .plus-btn::before, .plus-btn::after { content: ''; position: absolute; background: #000; }
        .plus-btn::before { width: 20px; height: 2px; }
        .plus-btn::after { width: 2px; height: 20px; }
        .plus-overlay { position: absolute; inset: -10px; cursor: pointer; }
        .file-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    </style>
</head>
<body>

<!-- หน้าแรก ตรงตามรูป -->
<div id="page-feed" class="page active">
    <div class="feed-container">
        <div class="feed-slider" id="feed-slider">
            <div class="post-slide" id="current-post">
                <div class="media-container" id="media-area">
                    <div class="empty-hint">
                        <div class="cloud-icon">☁️</div>
                        กดปุ่ม + เพื่อเลือกวิดีโอ<br>
                        แสดงผลก่อน — ยังไม่ส่งคลาวด์
                    </div>
                </div>

                <div class="info-left" id="info-area" style="display:none;">
                    <div class="username">@thaipodee-master</div>
                    <div class="caption">ทดสอบ ✨</div>
                    <div class="music-line">🎵 เสียงต้นฉบับ • ThaiPodee Original</div>
                </div>

                <div class="menu-right">
                    <div class="menu-btn">
                        <div class="avatar-wrap">
                            <div class="avatar"></div>
                            <div class="avatar-plus">+</div>
                        </div>
                    </div>
                    <div class="menu-btn"><span class="icon">❤️</span><span class="stat-num">0</span></div>
                    <div class="menu-btn"><span class="icon">💬</span><span class="stat-num">0</span></div>
                    <div class="menu-btn"><span class="icon">⭐</span><span class="btn-label">บันทึก</span></div>
                    <div class="menu-btn"><span class="icon">↗️</span><span class="btn-label">แชร์</span></div>
                    <div class="menu-btn"><span class="icon">🎵</span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- เมนูล่าง ตรงเป๊ะ -->
<div class="nav-bottom">
    <div class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">หน้าหลัก</span>
    </div>
    <div class="nav-item">
        <span class="nav-icon">🛒</span>
        <span class="nav-label">ตลาด</span>
    </div>

    <div class="plus-center">
        <div class="plus-btn">
            <label class="plus-overlay">
                <input type="file" accept="video/*,image/*" id="media-input" class="file-input">
            </label>
        </div>
    </div>

    <div class="nav-item">
        <span class="nav-icon">💬</span>
        <span class="nav-label">ข้อความ</span>
    </div>
    <div class="nav-item">
        <span class="nav-icon">👤</span>
        <span class="nav-label">โปรไฟล์</span>
    </div>
</div>

<script>
// แค่เลือกไฟล์ → แสดงผล — ยังไม่ส่งคลาวด์
const mediaInput = document.getElementById('media-input');
const mediaArea = document.getElementById('media-area');
const infoArea = document.getElementById('info-area');

mediaInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    
    // ล้างของเก่า
    mediaArea.innerHTML = '';
    
    // แสดงวิดีโอหรือรูป
    if (file.type.startsWith('video/')) {
        const video = document.createElement('video');
        video.src = url;
        video.loop = true;
        video.playsInline = true;
        video.controls = true;
        video.style.maxWidth = '100vw';
        video.style.maxHeight = '100dvh';
        video.style.width = 'auto';
        video.style.height = 'auto';
        video.onloadedmetadata = () => {
            video.play().catch(() => {});
        };
        mediaArea.appendChild(video);
    } else {
        const img = document.createElement('img');
        img.src = url;
        img.style.maxWidth = '100vw';
        img.style.maxHeight = '100dvh';
        mediaArea.appendChild(img);
    }

    // แสดงข้อมูลซ้ายล่าง
    infoArea.style.display = 'block';
    
    console.log('✅ โหลดไฟล์แสดงผลสำเร็จ — ยังไม่ส่งคลาวด์');
});
</script>
</body>
</html>
