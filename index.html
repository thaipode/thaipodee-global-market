<!-- ในส่วน <body> ส่วนล่าง -->

   <!-- เมนูนำทางล่าง -->
   <nav class="bottom-nav">

       <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
         <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
       </svg>
       <span>หน้าแรก</span>
     </button>
     <button class="nav-btn">
       <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
         <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h3.6l3.19 6.59-1.17 2.12C6.09 13.33 5 14.22 5 15.5c0 1.66 1.34 3 3 3h10v-2H8.42c-.31 0-.58-.27-.58-.58 0-.23.14-.42.34-.5L9.1 15h7.45c.75 0 1.41-.41 1.75-1.03l3.24-5.87c.06-.11.1-.23.1-.35 0-.55-.45-1-1-1H6.21l-.94-2H1zm16 14c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
       </svg>
       <span>ร้านค้า</span>
     </button>
     
     <!-- ปุ่มตรงกลาง — กดเลือกไฟล์ได้ทันทีเลย -->
     <button class="center-btn" id="upload-trigger" title="อัปโหลดวิดีโอ">+</button>
     <input type="file" id="file-input" accept="video/*" style="display:none">
     
     <button class="nav-btn">
       <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
         <path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm0 14H4V4h16v12z"/>
       </svg>
       <span>ข้อความ</span>
     </button>
     <button class="nav-btn">
       <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
         <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
       </svg>
       <span>โปรไฟล์</span>
     </button>
   </nav>

<!-- ส่วนจาวาสคริปต์ทำให้กด + ได้เลย -->
<script>
  // กดปุ่ม + → เปิดหน้าเลือกไฟล์ทันที
  document.getElementById('upload-trigger').addEventListener('click', function() {
    document.getElementById('file-input').click();
  });

  // เมื่อเลือกไฟล์แล้ว → ทำการอัปโหลดตามปกติ
  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    uploadVideo(file); // ฟังก์ชันอัปโหลดที่มีอยู่แล้ว
  });
</script>

<style>
/* === ปรับแต่งให้สวยเหมือน TikTok === */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70px;
  background: rgba(0,0,0,0.9);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 8px 5px;
  z-index: 100;
  border-top: 1px solid #222;
}

.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 11px;
  gap: 4px;
  padding: 5px 8px;
}

.nav-btn svg {
  width: 24px;
  height: 24px;
}

/* ปุ่มตรงกลางโดดเด่น */
.center-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #e50914;
  border: none;
  color: white;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(229,9,20,0.4);
  transition: transform 0.2s;
}

.center-btn:active {
  transform: scale(0.92);
}
</style>
