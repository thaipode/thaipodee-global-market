<!DOCTYPE html>
<html lang="th">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        html, body {

        .status-bar {

            align-items: center;
            justify-content: center;
            font-size: 12px;

        .nav-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;

            padding-bottom: env(safe-area-inset-bottom, 0px);

            align-items: center;

            min-width: 70px;
            cursor: pointer;

        .nav-label { font-size: 10px; color: #888; margin-top: 2px; }
        .nav-item.active .nav-label { color: #fff; font-weight: 600; }
        
        .center-plus { position: relative; }
        .plus-btn {

            height: 32px;
            background: #fff;
            border-radius: 6px;

            align-items: center;

        .page {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh; height: 100dvh;
            overflow-y: auto;
            background: #000;

        }
        .page.active { display: block; }
        .back-link {
            font-size: 18px;

            display: inline-block;

        }
        .form-wrap { padding: 0 16px 120px; }
        .form-title {
            text-align: center;
            margin: 20px 0;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        .avatar-preview-lg {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5a623, #f76b1c);
            border: 3px solid #fff;
            background-size: cover;
            background-position: center;
            margin: 0 auto 8px;
        }
        .avatar-hint {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-bottom: 24px;
            cursor: pointer;
        }
        .field-label {
            font-size: 13px;
            color: #aaa;
            margin: 20px 0 6px;

        }
        .field-input {
            width: 100%;

            border-radius: 8px;

        .action-btn {

            border-radius: 25px;

        .audio-name {

            color: #888;

        .preview-img {

            max-height: 350px;
            object-fit: contain;

        }
        .hidden { display: none; }
        .migration-box {
            background: rgba(16,185,129,0.1);
            border: 1px solid #10b981;
            border-radius: 12px;
            padding: 16px;
            margin: 16px;
            text-align: center;
        }
    </style>
</head>

<div class="status-bar" id="status-bar"></div>

<script>
const VER = '3.0';

// ==================== บีบอัดรูป ====================
async function compressImage(file, maxWidth = 1080, quality = 0.82) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = URL.createObjectURL(file);
    });
}

// ==================== แจ้งเตือน ====================
function showStatus(msg, type='ok') {
    const el = document.getElementById('status-bar');
    el.className = 'status-bar ' + (type==='warn'?'warn':type==='err'?'err':'');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3500);
}

// ==================== ระบบคลาวด์ — เก็บจริง ====================
const CLOUD = {
    // เก็บข้อมูลกลาง — ทุกคนเข้าถึงชุดเดียวกัน
    _getAll() {
        const data = localStorage.getItem('thaipodee_cloud_v3');
        return data ? JSON.parse(data) : { posts:[], users:{}, updated:Date.now() };
    },
    _saveAll(obj) {
        obj.updated = Date.now();
        localStorage.setItem('thaipodee_cloud_v3', JSON.stringify(obj));
        return true;
    },

    // ย้ายข้อมูลจากเวอร์ชันเก่า → ใหม่
    migrateFromOld() {
        const oldData = localStorage.getItem('thaipodee_global_v2');
        if (!oldData) return false;
        
        try {
            const old = JSON.parse(oldData);
            const cloud = this._getAll();
            
            // ย้ายโพสต์
            old.posts.forEach(p => {
                const exists = cloud.posts.some(cp => cp.id === p.id);
                if (!exists) cloud.posts.unshift(p);
            });
            // ย้ายผู้ใช้
            Object.assign(cloud.users, old.users);
            
            this._saveAll(cloud);
            localStorage.removeItem('thaipodee_global_v2'); // ลบเก่าทิ้งหลังย้าย
            return true;
        } catch(e) { return false; }
    },

    getMyId() {
        let id = localStorage.getItem('thaipodee_myid_v3');
        if (!id) {
            id = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            localStorage.setItem('thaipodee_myid_v3', id);
        }
        return id;
    },

    saveUser(uid, name, avatar) {
        const data = this._getAll();
        data.users[uid] = {
            name: name.startsWith('@') ? name : '@' + name,
            avatar: avatar || null,
            updated: Date.now()
        };
        return this._saveAll(data);
    },

    getUser(uid) {
        const data = this._getAll();
        return data.users[uid] || { name: '@ผู้ใช้', avatar: null };
    },

    addPost(uid, type, dataUrl, caption, music) {
        const data = this._getAll();
        data.posts.unshift({
            id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            uid, type, data: dataUrl,
            caption: caption || 'แชร์สิ่งดี ๆ จาก Thaipodee Global Market ✨',
            music: music || 'เสียงต้นฉบับ',
            likes: 0, comments: 0, saves: 0, shares: 0,
            time: Date.now()
        });
        return this._saveAll(data);
    },

    listPosts() { return this._getAll().posts; },
    
    likePost(pid, count) {
        const data = this._getAll();
        const p = data.posts.find(x => x.id === pid);
        if (p) { p.likes = count; return this._saveAll(data); }
        return false;
    }
};

const ME = CLOUD.getMyId();

// ย้ายข้อมูลเก่าทันทีเมื่อเปิดครั้งแรก
const migrated = CLOUD.migrateFromOld();
if (migrated) {
    setTimeout(() => alert('✅ ย้ายข้อมูลรูปเก่าทั้งหมดเรียบร้อยแล้ว!\n\nตอนนี้โพสต์ได้ไม่จำกัดแล้วครับ ไม่ต้องลบใบไหนเลย 🎉'), 500);
}

let pendingMedia = null, pendingAudio = null, pendingMediaDataUrl = null, tempAvatar = null;

// ==================== เปลี่ยนหน้า ====================
function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    if (pageId === 'feed') {
        document.getElementById('feed-container').style.display = 'block';
        document.getElementById('nav-home').classList.add('active');
        renderFeed();
    } else if (pageId === 'profile') {
        document.getElementById('feed-container').style.display = 'block';
        document.getElementById('page-profile').classList.add('active');
        document.getElementById('nav-profile').classList.add('active');
        loadMyProfile();
    } else if (pageId === 'page-sound') {
        document.getElementById('feed-container').style.display = 'block';
        document.getElementById('page-sound').classList.add('active');
    }
}

// ==================== แสดงโพสต์ ====================
function renderFeed() {
    const box = document.getElementById('feed-container');
    const posts = CLOUD.listPosts();
    box.innerHTML = '';

    if (posts.length === 0) {
        box.innerHTML = `
            <div class="post-item">
                <div class="media-area">
                    <div class="demo-screen">
                        <div>
                            <div class="demo-icon">🌏</div>
                            <div class="demo-title">Thaipodee Global Market</div>
                            <div class="demo-desc">ระบบคลาวด์พร้อมใช้งานแล้ว!<br>โพสต์ได้ไม่จำกัด ไม่ต้องลบรูปเก่า ✨</div>
                            <div class="demo-tip">👇 กด + ด้านล่าง เพื่อโพสต์ภาพแรกของคุณ</div>
                        </div>
                    </div>
                </div>
                <div class="post-info">
                    <div class="post-username" id="demo-avatar-link">@Thaipodee_Official 👆 แตะเพื่อตั้งค่า</div>
                    <div class="post-caption">ยินดีต้อนรับสู่ระบบคลาวด์ — ไม่มีวันเต็ม! 🎉</div>
                    <div class="post-music">🎵 เพลงต้อนรับ</div>
                </div>
                <div class="side-buttons">
                    <div class="side-btn" id="demo-avatar-btn"><div class="avatar-holder"><div class="avatar-img" style="background:linear-gradient(135deg,#ffd700,#ff8c00)"></div></div></div>
                    <div class="side-btn"><span class="icon">❤️</span><span class="count">0</span></div>
                    <div class="side-btn"><span class="icon">💬</span><span class="count">0</span></div>
                    <div class="side-btn"><span class="icon">⭐</span><span class="count">0</span></div>
                    <div class="side-btn"><span class="icon">↗️</span><span class="count">0</span></div>
                    <div class="side-btn"><span class="icon">🎵</span></div>
                </div>
            </div>
        `;
        document.getElementById('demo-avatar-btn').onclick = () => showPage('profile');
        document.getElementById('demo-avatar-link').onclick = () => showPage('profile');
        return;
    }

    posts.forEach(post => {
        const author = CLOUD.getUser(post.uid);
        const el = document.createElement('div');
        el.className = 'post-item';
        const media = post.type==='video'
            ? `<video src="${post.data}" loop playsinline controls></video>`
            : `<img src="${post.data}" alt="โพสต์">`;
        const avatarBg = author.avatar ? `background-image:url(${author.avatar})` : '';
        
        el.innerHTML = `
            <div class="media-area">${media}</div>
            <div class="post-info">
                <div class="post-username" data-uid="${post.uid}">${author.name} ${post.uid===ME?'👆':''}</div>
                <div class="post-caption">${post.caption}</div>
                <div class="post-music">🎵 ${post.music}</div>
            </div>
            <div class="side-buttons">
                <div class="side-btn avatar-clickable" data-uid="${post.uid}">
                    <div class="avatar-holder">
                        <div class="avatar-img" style="${avatarBg}"></div>
                        ${!author.avatar&&post.uid===ME?'<div class="avatar-badge">+</div>':''}
                    </div>
                </div>
                <div class="side-btn like-btn" data-pid="${post.id}" data-n="${post.likes}">
                    <span class="icon">❤️</span><span class="count">${post.likes}</span>
                </div>
                <div class="side-btn"><span class="icon">💬</span><span class="count">${post.comments}</span></div>
                <div class="side-btn"><span class="icon">⭐</span><span class="count">${post.saves}</span></div>
                <div class="side-btn"><span class="icon">↗️</span><span class="count">${post.shares}</span></div>
                <div class="side-btn"><span class="icon">🎵</span></div>
            </div>
        `;
        box.appendChild(el);
    });

    document.querySelectorAll('.avatar-clickable, .post-username[data-uid]').forEach(b => {
        if (b.dataset.uid === ME) b.onclick = () => showPage('profile');
    });
    bindLikes();
}

function bindLikes() {
    document.querySelectorAll('.like-btn').forEach(b => {
        b.onclick = () => {
            const n = parseInt(b.dataset.n) + 1;
            b.dataset.n = n;
            b.querySelector('.count').textContent = n;
            CLOUD.likePost(b.dataset.pid, n);
        };
    });
}

// ==================== โปรไฟล์ ====================
function loadMyProfile() {
    const me = CLOUD.getUser(ME);
    document.getElementById('name-input').value = me.name.replace('@','');
    document.getElementById('my-avatar-preview').style.backgroundImage = me.avatar ? `url(${me.avatar})` : '';
}

document.getElementById('avatar-file').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    tempAvatar = await compressImage(f, 200, 0.9);
    document.getElementById('my-avatar-preview').style.backgroundImage = `url(${tempAvatar})`;
};
document.getElementById('avatar-tap-hint').onclick = () => document.getElementById('avatar-file').click();

document.getElementById('save-profile').onclick = () => {
    const name = document.getElementById('name-input').value.trim();
    if (!name) return alert('กรุณาใส่ชื่อครับ');
    CLOUD.saveUser(ME, name, tempAvatar);
    tempAvatar = null;
    showStatus('✅ บันทึกโปรไฟล์สำเร็จ');
    showPage('feed');
};

// ==================== เลือกไฟล์ ====================
document.getElementById('media-file').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    pendingMedia = { type: f.type.startsWith('video')?'video':'image', file:f };
    
    if (pendingMedia.type === 'image') {
        pendingMediaDataUrl = await compressImage(f, 1280, 0.82);
        document.getElementById('media-preview-area').innerHTML = `<img src="${pendingMediaDataUrl}" class="preview-img">`;
    } else {
        pendingMediaDataUrl = URL.createObjectURL(f);
        document.getElementById('media-preview-area').innerHTML = `<video src="${pendingMediaDataUrl}" class="preview-img" controls autoplay muted loop style="max-height:300px;"></video>`;
    }
    showPage('page-sound');
};

document.getElementById('audio-file').onchange = e => {
    pendingAudio = e.target.files[0] || null;
    document.getElementById('audio-status').textContent = pendingAudio ? '✅ เลือกแล้ว: '+pendingAudio.name : 'ยังไม่ได้เลือก — จะใช้เสียงต้นฉบับ';
};

// ==================== กดโพสต์ — ไม่มีขีดจำกัดแล้ว! ====================
document.getElementById('do-post').onclick = () => {
    if (!pendingMedia || !pendingMediaDataUrl) return alert('❌ กรุณาเลือกภาพก่อนครับ');
    
    CLOUD.addPost(
        ME,
        pendingMedia.type,
        pendingMediaDataUrl,
        null,
        pendingAudio ? pendingAudio.name : 'เสียงต้นฉบับ'
    );
    
    // เคลียร์
    pendingMedia = pendingAudio = pendingMediaDataUrl = null;
    document.getElementById('media-file').value = '';
    document.getElementById('audio-file').value = '';
    document.getElementById('audio-status').textContent = 'ยังไม่ได้เลือก — จะใช้เสียงต้นฉบับ';
    document.getElementById('media-preview-area').innerHTML = '';
    
    showStatus('✅ โพสต์สำเร็จ! เลื่อนขึ้นดูครับ');
    showPage('feed');
};

// ==================== ปุ่มกลับ + เมนู ====================
document.getElementById('back-sound').onclick = () => {
    pendingMedia = pendingAudio = pendingMediaDataUrl = null;
    document.getElementById('media-file').value = '';
    document.getElementById('audio-file').value = '';
    document.getElementById('audio-status').textContent = 'ยังไม่ได้เลือก — จะใช้เสียงต้นฉบับ';
    document.getElementById('media-preview-area').innerHTML = '';
    showPage('feed');
};
document.getElementById('back-profile').onclick = () => showPage('feed');

document.querySelectorAll('.nav-item[data-goto]').forEach(item => {
    item.onclick = () => {
        const t = item.dataset.goto;
        if (t==='market'||t==='messages') return alert('🚧 กำลังพัฒนา — ขอบคุณที่รอคอยครับ');
        showPage(t);
    };
});

// เริ่ม
renderFeed();
console.log('✅ Thaipodee v3.0 CLOUD — พร้อมแล้ว! ไม่มีวันเต็ม 🎉');
</script>
</body>
</html>
