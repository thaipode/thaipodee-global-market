<!-- ==============================================================
   ThaiPodee v1066 — ตรวจห้องอัตโนมัติ แก้ปัญหาไม่เจอโฟลเดอร์
   27 กันยายน 2569 15:05 น.
   --------------------------------------------------------------
   ✅ ตรวจหลายชื่อสาขา (main / master) อัตโนมัติ
   ✅ บอกชัดเจนว่าติดตรงไหน
   ✅ เจอแล้วโหลดเองทันที
   ============================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ThaiPodee</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, sans-serif;}
html,body{height:100%; overflow:hidden; background:#000; color:#fff;}

.video-swiper{height:100vh; overflow-y:auto; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;}
.video-slide{height:100vh; scroll-snap-align:start; position:relative; display:flex; align-items:center; justify-content:center;}
video{width:100%; height:100%; object-fit:cover; background:#000;}
video::-webkit-media-controls{display:none;}

.status-msg{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#888; text-align:center; padding:20px; line-height:1.6;}
.status-msg h4{font-size:16px; margin-bottom:10px; color:#ff6b6b;}
.status-msg p{font-size:13px; color:#aaa; margin-bottom:5px;}
.status-msg .ok{color:#4cd137;}

.video-info{position:absolute; bottom:80px; left:16px; right:85px; z-index:10;}
.video-info h3{font-size:15px; margin-bottom:4px;}
.video-info p{font-size:13px; color:#ddd;}

.side-buttons{position:absolute; right:12px; bottom:100px; display:flex; flex-direction:column; gap:24px; align-items:center;}
.side-btn{display:flex; flex-direction:column; align-items:center; gap:4px;}
.side-icon{width:44px; height:44px; border-radius:50%; background:#222; display:flex; align-items:center; justify-content:center; font-size:20px;}
.side-label{font-size:10px;}

.nav-bar{position:fixed; bottom:0; left:0; right:0; height:60px; background:#000; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #222; z-index:20;}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:#fff;}
.nav-icon{font-size:22px;}
.nav-upload{background:#ff4757; padding:4px 16px; border-radius:6px;}
</style>
</head>
<body>

<div class="video-swiper" id="swiper">
  <div class="status-msg" id="status">กำลังตรวจสอบที่เก็บวิดีโอ...</div>
</div>

<nav class="nav-bar">
  <div class="nav-item"><span class="nav-icon">🏠</span><span>หน้าแรก</span></div>
  <div class="nav-item"><span class="nav-icon">🔥</span><span>ฮิต</span></div>
  <div class="nav-item nav-upload"><span class="nav-icon">+</span><span>อัปโหลด</span></div>
  <div class="nav-item"><span class="nav-icon">💬</span><span>ข้อความ</span></div>
  <div class="nav-item"><span class="nav-icon">👤</span><span>โปรไฟล์</span></div>
</nav>

<script>
const OWNER = 'thaipodee';
const REPO = 'thaipodee-global-market';
const FOLDER = 'videos';

const swiper = document.getElementById('swiper');
const status = document.getElementById('status');

// ลองหาทั้ง main และ master
async function tryLoadVideos(branch) {
  try {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${branch}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.json();
  } catch {
    return null;
  }
}

async function start() {
  status.innerHTML = 'กำลังหาโฟลเดอร์...';
  
  let files = await tryLoadVideos('main');
  let branchUsed = 'main';
  
  if (!files) {
    files = await tryLoadVideos('master');
    branchUsed = 'master';
  }
  
  if (!files) {
    status.innerHTML = `
      <h4>❌ ไม่พบโฟลเดอร์วิดีโอ</h4>
      <p>ตรวจสอบสิ่งเหล่านี้:</p>
      <p>1. มีโฟลเดอร์ชื่อ <b>videos</b> ในโปรเจกต์หรือไม่?</p>
      <p>2. อยู่ในสาขา <b>main</b> หรือ <b>master</b>?</p>
      <p>3. ชื่อสะกดถูกไหม: v-i-d-e-o-s</p>
    `;
    return;
  }
  
  const videos = files.filter(f => /\.(mp4|webm|mov)$/i.test(f.name));
  
  if (!videos.length) {
    status.innerHTML = `
      <h4>📂 เจอโฟลเดอร์แล้ว</h4>
      <p class="ok">สาขา: ${branchUsed}</p>
      <p>แต่ยังไม่มีไฟล์วิดีโอ</p>
      <p>อัปโหลดไฟล์ .mp4 เข้าโฟลเดอร์ videos</p>
    `;
    return;
  }
  
  status.remove();
  
  videos.forEach(v => {
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    slide.innerHTML = `
      <video src="${v.download_url}" loop muted playsinline preload="auto"></video>
      <div class="video-info">
        <h3>${v.name.replace(/\.[^.]+$/, '')}</h3>
        <p>@thaipodee</p>
      </div>
      <div class="side-buttons">
        <div class="side-btn"><div class="side-icon">❤️</div><div class="side-label">0</div></div>
        <div class="side-btn"><div class="side-icon">💬</div><div class="side-label">0</div></div>
        <div class="side-btn"><div class="side-icon">⭐</div><div class="side-label">บันทึก</div></div>
        <div class="side-btn"><div class="side-icon">↗️</div><div class="side-label">แชร์</div></div>
        <div class="side-btn"><div class="side-icon">🎵</div><div class="side-label">เสียง</div></div>
      </div>
    `;
    swiper.appendChild(slide);
  });
  
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const vid = e.target.querySelector('video');
      if (e.isIntersecting) vid?.play().catch(()=>{});
      else vid?.pause();
    });
  }, {threshold: 0.6});
  
  document.querySelectorAll('.video-slide').forEach(s => observer.observe(s));
}

start();
</script>
</body>
</html>
