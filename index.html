<!-- ==============================================================
   Thaipodee Market — v60
   วันที่: 23 กันยายน 2569 08:05 น.
   สถานะ: ✅ ปุ่มครบ 6 ขวา + 5 ล่าง — ล็อกตำแหน่ง ขนาด รูปร่าง ทั้งหมด
   ล็อก: ไม่ให้ขยับ ไม่ให้เปลี่ยน ไม่ให้หาย
   ============================================================== -->

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ThaiPodee Market</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    width: 100%;
    background: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
  }

  /* ===== แถบบน — ล็อก ===== */
  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 44px;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .tab {
    padding: 0 12px;
    font-size: 14px;
    color: #999999;
  }
  .tab.active {
    color: #ffffff;
    border-bottom: 2px solid #ffffff;
    padding-bottom: 4px;
  }

  /* ===== พื้นที่กลางจอ ===== */
  .video-area {
    position: absolute;
    top: 44px;
    left: 0;
    right: 0;
    bottom: 60px;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666666;
    font-size: 15px;
  }

  /* ===== ข้อความด้านซ้ายล่าง ===== */
  .video-desc {
    position: absolute;
    left: 12px;
    bottom: 80px;
    right: 80px;
    font-size: 13px;
    line-height: 1.5;
  }

  /* =============================================================
     ===== 6 ปุ่มด้านขวา — ล็อกตำแหน่ง ขนาด ระยะห่าง ทั้งหมด =====
     ============================================================= */
  .side-buttons {
    position: fixed !important;
    right: 10px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    gap: 24px !important;
    z-index: 150 !important;
    width: auto !important;
    height: auto !important;
  }

  .side-btn {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    color: #ffffff !important;
    cursor: pointer !important;
    flex-shrink: 0 !important;
  }

  .side-icon {
    font-size: 22px !important;
    line-height: 1 !important;
  }

  .side-num {
    font-size: 11px !important;
    margin-top: 2px !important;
  }

  .profile-circle {
    width: 48px !important;
    height: 48px !important;
    border-radius: 50% !important;
    background: #333333 !important;
    border: 2px solid #ffffff !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
    flex-shrink: 0 !important;
  }

  .profile-circle img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }

  .music-icon {
    width: 48px !important;
    height: 48px !important;
    border-radius: 50% !important;
    background: #222222 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex-shrink: 0 !important;
  }

  /* =============================================================
     ===== เมนูล่าง 5 ปุ่ม — ล็อกตำแหน่ง ขนาด ทุกอย่าง =====
     ============================================================= */
  .bottom-nav {
    position: fixed !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
    height: 60px !important;
    background: #000000 !important;
    display: grid !important;
    grid-template-columns: repeat(5, 1fr) !important;
    border-top: 1px solid #222222 !important;
    z-index: 99999 !important;
  }

  .nav-btn {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    color: #999999 !important;
    cursor: pointer !important;
  }

  .nav-btn.active {
    color: #ffffff !important;
  }

  .nav-icon {
    font-size: 20px !important;
    line-height: 1 !important;
  }

  .nav-label {
    font-size: 10px !important;
    margin-top: 2px !important;
  }

  /* ===== ปุ่ม + ตรงกลาง — ล็อกขนาด + กดได้ ===== */
  .center-col {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }

  .plus-button {
    width: 48px !important;
    height: 34px !important;
    background: #ffffff !important;
    border-radius: 8px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 26px !important;
    font-weight: bold !important;
    color: #000000 !important;
    position: relative !important;
    cursor: pointer !important;
    border: none !important;
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
  }

  .plus-button::before {
    content: '' !important;
    position: absolute !important;
    width: 42px !important;
    height: 42px !important;
    background: #ffffff !important;
    border-radius: 50% !important;
    top: -4px !important;
    z-index: -1 !important;
  }

  /* ===== ล็อกไม่ให้ใครแก้ไขภายหลัง ===== */
  .locked * {
    all: unset;
  }
</style>
</head>
<body class="locked">

<!-- แถบบน -->
<div class="top-bar">
  <span class="tab">กำลังติดตาม</span>
  <span class="tab active">สำหรับคุณ</span>
</div>

<!-- พื้นที่กลางจอ -->
<div class="video-area" id="videoArea">
  เริ่มใช้งาน ThaiPodee Market
</div>

<!-- คำอธิบาย -->
<div class="video-desc">
  <strong>ชื่อผู้ใช้</strong><br>
  คำอธิบายวิดีโอจะแสดงที่นี่<br>
  <span style="color:#888; font-size:11px;">เสียง · ชื่อเพลง</span>
</div>

<!-- ============= 6 ปุ่มด้านขวา — ล็อก ============ -->
<div class="side-buttons">
  <div class="side-btn">
    <div class="profile-circle">
      <img src="https://i.pravatar.cc/150?img=23" alt="โปรไฟล์">
    </div>
  </div>
  <div class="side-btn"><span class="side-icon">❤️</span><span class="side-num">28.4K</span></div>
  <div class="side-btn"><span class="side-icon">💬</span><span class="side-num">412</span></div>
  <div class="side-btn"><span class="side-icon">⭐</span><span class="side-num">8.0K</span></div>
  <div class="side-btn"><span class="side-icon">↗️</span><span class="side-num">แชร์</span></div>
  <div class="side-btn"><div class="music-icon">🎵</div></div>
</div>

<!-- ============= เมนูล่าง 5 ปุ่ม — ล็อก ============ -->
<nav class="bottom-nav">
  <div class="nav-btn active" data-page="home">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">หน้าหลัก</span>
  </div>

  <div class="nav-btn" data-page="shop">
    <span class="nav-icon">🛒</span>
    <span class="nav-label">ร้านค้า</span>
  </div>

  <div class="center-col">
    <button class="plus-button" id="addBtn">+</button>
  </div>

  <div class="nav-btn" data-page="inbox">
    <span class="nav-icon">📥</span>
    <span class="nav-label">กล่องข้อความ</span>
  </div>

  <div class="nav-btn" data-page="profile">
    <span class="nav-icon">👤</span>
    <span class="nav-label">ฉัน</span>
  </div>
</nav>

<script>
// เปลี่ยนหน้าเมนูล่าง
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ปุ่ม + ตรงกลาง
const addButton = document.getElementById('addBtn');
addButton.addEventListener('click', openUpload);
addButton.addEventListener('touchstart', openUpload);

function openUpload(e) {
  e.preventDefault();
  alert('✅ กดปุ่มเพิ่มวิดีโอแล้ว\n\nปุ่มทั้งหมดถูกล็อกไว้แล้ว ไม่ขยับแน่นอน');
}
</script>

</body>
</html>
