<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thaipodee</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; background: #000; color: #fff; overflow: hidden; }
    .app { width: 100%; height: 100vh; max-width: 430px; margin: 0 auto; position: relative; background: #000; }

    /* ===== พื้นที่วิดีโอ เต็มจอ ===== */
    .video-area {
      width: 100%; height: 100%;
      background: #000;
      position: relative;
    }

    /* ===== แถบบน ===== */
    .top-bar {
      position: absolute; top: 48px; left: 0; width: 100%;
      display: flex; justify-content: center; align-items: center;
      z-index: 10;
    }
    .tab { font-size: 16px; color: rgba(255,255,255,.6); cursor: pointer; padding: 0 12px; }
    .tab.active { color: #fff; font-weight: 600; border-bottom: 2px solid #fff; padding-bottom: 3px; }
    .search-btn { position: absolute; right: 16px; top: 48px; font-size: 22px; cursor: pointer; }

    /* ===== ปุ่มด้านขวา ===== */
    .right-menu {
      position: absolute; right: 12px; bottom: 125px;
      display: flex; flex-direction: column; align-items: center; gap: 24px;
      z-index: 10;
    }
    .r-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
    .r-icon { font-size: 28px; }
    .r-text { font-size: 11px; opacity: .8; }
    .r-num { font-size: 12px; margin-top: 2px; }

    .prof-box { position: relative; }
    .prof-img {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid #fff; background: #333;
      background: url('https://picsum.photos/100/100') center/cover;
    }
    .follow-add {
      position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
      width: 20px; height: 20px; border-radius: 50%; background: #ff0050;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: bold;
    }
    .music-cover {
      width: 48px; height: 48px; border-radius: 50%;
      background: #222; border: 2px solid #fff;
      animation: spin 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== ข้อมูลล่างซ้าย ===== */
    .info-left {
      position: absolute; left: 16px; right: 90px; bottom: 125px;
      z-index: 10;
    }
    .username { font-size: 16px; font-weight: 700; margin-bottom: 8px; cursor: pointer; }
    .caption { font-size: 14px; line-height: 1.5; margin-bottom: 6px; }
    .ai-tag { font-size: 11px; opacity: .5; margin-bottom: 8px; display: none; }
    .sound-name { font-size: 13px; display: flex; align-items: center; gap: 6px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ===== แถบความคืบหน้า ===== */
    .progress-line {
      position: absolute; bottom: 100px; left: 0; right: 0; height: 2px;
      background: rgba(255,255,255,.2); z-index: 10;
    }
    .progress-done { width: 30%; height: 100%; background: #fff; border-radius: 0 2px 2px 0; }

    /* ===== เมนูล่าง ===== */
    .bottom-bar {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 80px;
      background: #000; display: flex; justify-content: space-around; align-items: center;
      border-top: 1px solid #222; z-index: 10; padding-bottom: env(safe-area-inset-bottom);
    }
    .b-nav { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: #fff; font-size: 11px; opacity: .6; }
    .b-nav.active { opacity: 1; }
    .b-icon { font-size: 24px; }
    .create-box {
      width: 45px; height: 32px; border-radius: 8px;
      background: linear-gradient(90deg, #25f4ee 0%, #fe28ea 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: bold; color: #000; cursor: pointer;
    }
    .dot-badge { position: relative; }
    .dot-red {
      position: absolute; top: -4px; right: -4px;
      width: 8px; height: 8px; border-radius: 50%; background: #ff0050;
    }
    .num-badge {
      position: absolute; top: -8px; right: -12px;
      background: #ff0050; color: #fff; font-size: 10px;
      padding: 1px 5px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- พื้นที่วิดีโอ -->
    <div class="video-area"></div>

    <!-- แถบบน -->
    <div class="top-bar">
      <span class="tab" id="tab1">กำลังติดตาม</span>
      <span class="tab active" id="tab2">สำหรับคุณ</span>
    </div>
    <div class="search-btn">🔍</div>

    <!-- ปุ่มด้านขวา -->
    <div class="right-menu">
      <div class="r-btn prof-box">
        <div class="prof-img"></div>
        <div class="follow-add">+</div>
      </div>
      <div class="r-btn" id="likeBtn">
        <div class="r-icon">❤️</div>
        <div class="r-num" id="likeCount">0</div>
      </div>
      <div class="r-btn">
        <div class="r-icon">💬</div>
        <div class="r-num">0</div>
      </div>
      <div class="r-btn">
        <div class="r-icon">⬜</div>
        <div class="r-num">0</div>
      </div>
      <div class="r-btn">
        <div class="r-icon">➤</div>
        <div class="r-num">0</div>
      </div>
      <div class="r-btn">
        <div class="music-cover"></div>
      </div>
    </div>

    <!-- ข้อมูลล่างซ้าย -->
    <div class="info-left">
      <div class="username">@soundcraftrguy</div>
      <div class="caption">"ปกป้องประเทศไทย" "Protect Thailand"</div>
      <div class="ai-tag" id="aiLabel">ประกอบด้วยสื่อที่สร้างด้วย AI</div>
      <div class="sound-name">🎵 เสียงต้นฉบับ — soundcraftrguy</div>
    </div>

    <!-- แถบความคืบหน้า -->
    <div class="progress-line">
      <div class="progress-done"></div>
    </div>

    <!-- เมนูล่าง -->
    <div class="bottom-bar">
      <div class="b-nav active">
        <div class="b-icon">🏠</div>
        <div>หน้าหลัก</div>
      </div>
      <div class="b-nav dot-badge">
        <div class="b-icon">🛒</div>
        <div>ร้านค้า</div>
        <div class="dot-red"></div>
      </div>
      <div class="create-box">+</div>
      <div class="b-nav dot-badge">
        <div class="b-icon">💬</div>
        <div>ข้อความ</div>
        <div class="num-badge">99+</div>
      </div>
      <div class="b-nav">
        <div class="b-icon">👤</div>
        <div>โปรไฟล์</div>
      </div>
    </div>
  </div>

  <!-- การทำงาน -->
  <script>
    // สลับแท็บ
    const t1 = document.getElementById('tab1'), t2 = document.getElementById('tab2');
    t1.addEventListener('click', () => { t1.classList.add('active'); t2.classList.remove('active'); });
    t2.addEventListener('click', () => { t2.classList.add('active'); t1.classList.remove('active'); });

    // ปุ่มถูกใจ
    const likeBtn = document.getElementById('likeBtn');
    const likeCount = document.getElementById('likeCount');
    let isLiked = false, count = 0;
    likeBtn.addEventListener('click', () => {
      isLiked = !isLiked;
      count += isLiked ? 1 : -1;
      likeCount.textContent = count;
      likeBtn.querySelector('.r-icon').style.color = isLiked ? '#ff0050' : '#fff';
    });

    // ป้าย AI — แสดงเมื่อตรวจพบ
    const aiLabel = document.getElementById('aiLabel');
    const isAIContent = true; // ค่าจริงมาจากระบบ
    if (isAIContent) aiLabel.style.display = 'block';
  </script>
</body>
</html>
