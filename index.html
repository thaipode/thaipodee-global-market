<!--
📌 แก้ล่าสุด — รูปไม่หายอีกต่อไป
✅ แปลงข้อมูลเก็บถาวร — รีเฟรช/ปิดเปิด ยังเห็นภาพชัดเจน
✅ หน้าโปรไฟล์แสดงรูปครบ ไม่ดำ
✅ ทุกฟังก์ชันเดิมทำงานเหมือนเดิม
🔒 ล็อกทุกส่วนที่ดีแล้ว
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThaiPodee Global Market</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        html, body { height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; background: #000; color: #fff; }
        .page { display: none; position: absolute; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
        .page.active { display: block; }

        /* ===== หน้าฟีดหลัก ===== */
        .feed-container { position: absolute; inset: 0; overflow: hidden; }
        .feed-slider { transition: transform 0.4s ease-out; }
        .post-slide { position: relative; width: 100vw; height: 100vh; height: 100dvh; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

        .media-area { position: relative; width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
        .media-area video, .media-area img { max-width: 100vw; max-height: 100vh; object-fit: contain; background: #000; }
        .bg-audio { position: absolute; opacity: 0; pointer-events: none; }

        .info-left { position: absolute; left: 16px; bottom: 90px; right: 90px; z-index: 10; }
        .acc-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .desc-text { font-size: 13px; margin-bottom: 4px; color: #ddd; }
        .music-row { font-size: 12px; color: #bbb; margin-top: 6px; }

        /* เมนูขวา */
        .menu-right { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 20; }
        .menu-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: auto; cursor: pointer; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; background: #555; margin-bottom: 4px; }
        .icon { font-size: 28px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
        .num { font-size: 11px; margin-top: 2px; }

        /* ===== หน้าโปรไฟล์ ===== */
        .profile-page { background: #000; overflow-y: auto; padding-bottom: 80px; }
        .profile-header { padding: 20px 16px; text-align: center; }
        .profile-avatar-wrap { position: relative; display: inline-block; margin-bottom: 12px; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; background: #333; }
        .add-avatar-btn { position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; background: #0095f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; cursor: pointer; }
        .profile-name { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
        .profile-username { color: #888; font-size: 14px; margin-bottom: 16px; }
        .profile-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 12px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 18px; font-weight: bold; }
        .stat-label { font-size: 11px; color: #888; }
        .profile-bio { font-size: 13px; line-height: 1.5; padding: 0 20px 16px; color: #ddd; }
        .profile-actions { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .action-btn { background: #222; border: none; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }

        /* ตารางโพสต์ */
        .posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 0 3px; }
        .grid-item { aspect-ratio: 1; position: relative; cursor: pointer; overflow: hidden; background: #111; }
        .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; }
        .grid-placeholder { display: flex; align-items: center; justify-content: center; color: #444; font-size: 24px; }
        .empty-grid { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: #666; font-size: 14px; }

        /* เมนูล่าง */
        .nav-bottom { 
            position: absolute; bottom: 0; left: 0; right: 0; height: 65px; 
            display: flex; justify-content: space-around; align-items: center; 
            padding: 8px 12px 16px; z-index: 99999; background: #000; border-top: 1px solid #222; 
        }
        .nav-col { 
            display: flex; flex-direction: column; align-items: center; gap: 2px; 
            min-width: 60px; cursor: pointer; user-select: none; 
        }
        .nav-col:active { opacity: 0.6; transform: scale(0.95); }
        .nav-col.active .nav-label { color: #fff; font-weight: bold; }
        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 10px; color: #888; }
        .upload-box { width: 48px; height: 32px; background: #fff; border-radius: 6px; position: relative; }
        .upload-box::before { content: ''; position: absolute; width: 20px; height: 2px; background: #000; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .upload-box::after { content: ''; position: absolute; width: 2px; height: 20px; background: #000; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .file-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        /* หน้าเลือกเสียง */
        .sound-page { background: #000; padding: 16px; height: 100vh; height: 100dvh; overflow-y: auto; }
        .sound-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { font-size: 22px; cursor: pointer; color: #fff; padding: 8px; }
        .sound-title { font-size: 18px; font-weight: bold; }
        .section-title { font-size: 15px; font-weight: bold; margin: 20px 0 10px; }
        .local-area { background: #1a1a2e; border-radius: 10px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
        .local-text { display: flex; align-items: center; gap: 10px; }
        .hidden-input { display: none; }
        .post-btn { background: #ff2442; color: #fff; border: none; padding: 12px 16px; border-radius: 20px; font-size: 15px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        .post-btn:active { transform: scale(0.98); }
        .status-text { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 11px; padding: 6px 12px; border-radius: 12px; background: rgba(0,150,0,0.5); z-index: 99999; }
    </style>
</head>
<body>

<div id="page-feed" class="page">
    <div class="feed-container" id="feed-container">
        <div class="feed-slider" id="feed-slider"></div>
    </div>
</div>

<div id="page-profile" class="page profile-page">
    <div class="profile-header">
        <div class="profile-avatar-wrap">
            <img class="profile-avatar" id="profile-avatar-img" src="https://picsum.photos/id/1012/200/200" alt="โลโก้">
            <label class="add-avatar-btn">+<input type="file" accept="image/*" id="avatar-input" class="hidden-input"></label>
        </div>
        <h1 class="profile-name">THAIPODEE PRODUCT ENGINEERING</h1>
        <p class="profile-username">@podee.office.cancel</p>
        
        <div class="profile-stats">
            <div class="stat-item"><div class="stat-num">3,271</div><div class="stat-label">กำลังติดตาม</div></div>
            <div class="stat-item"><div class="stat-num">1,237</div><div class="stat-label">ผู้ติดตาม</div></div>
            <div class="stat-item"><div class="stat-num">2,742</div><div class="stat-label">ถูกใจ</div></div>
        </div>
        
        <p class="profile-bio">บริการที่ปรึกษาบริหารโครงการ จัดหา ออกแบบเขียนแบบ ปรับปรุง ซ่อมแซม สร้างประกอบ ติดตั้งเครื่องจักรทุกชนิด</p>
        
        <div class="profile-actions">
            <button class="action-btn">📧 อีเมล</button>
            <button class="action-btn">🛒 คำสั่งซื้อของคุณ</button>
        </div>
    </div>
    
    <div class="posts-grid" id="posts-grid"></div>
</div>

<div id="page-sound" class="page sound-page">
    <div class="sound-header">
        <span class="back-btn" id="back-to-feed">← กลับ</span>
        <span class="sound-title">เลือกเสียงเพลง</span>
    </div>
    <div class="section-title">📂 จากไฟล์ในเครื่อง</div>
    <label class="local-area">
        <div class="local-text">
            <span style="font-size:24px">🎵</span>
            <div><div>แตะเพื่อเลือกเพลง</div><div style="font-size:12px; color:#888">เช่น เพลงที่คุณชอบ.mp3</div></div>
        </div>
        <input type="file" accept="audio/*" id="audio-input" class="hidden-input">
    </label>
    <button class="post-btn" id="do-post">✅ โพสต์เลย</button>
</div>

<div class="nav-bottom">
    <div class="nav-col" id="nav-home"><span class="nav-icon">🏠</span><span class="nav-label">หน้าหลัก</span></div>
    <div class="nav-col" id="nav-shop"><span class="nav-icon">🛒</span><span class="nav-label">ร้านค้า</span></div>
    <div class="nav-col" id="nav-upload">
        <div class="upload-box"></div>
        <input type="file" id="media-input" accept="video/*,image/*" class="file-input">
    </div>
    <div class="nav-col" id="nav-inbox"><span class="nav-icon">💬</span><span class="nav-label">กล่องข้อความ</span></div>
    <div class="nav-col" id="nav-profile"><span class="nav-icon">👤</span><span class="nav-label">โปรไฟล์</span></div>
</div>

<script>
const MY_NAME = 'THAIPODEE PRODUCT ENGINEERING';
let posts = [];
let currentSlide = 0;
let pendingData = null;
let pendingType = null;
let selectedAudioData = null;
let selectedAudioName = 'เสียงต้นฉบับ';

// ==========================================
// 💾 แก้แล้ว — แปลงข้อมูลเก็บถาวร ไม่หายอีกต่อไป
// ==========================================
function fileToBase64(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(file);
    });
}

const DB = {
    KEY: 'thaipodee_v12_8_permanent',
    
    getAll() {
        try {
            const d = localStorage.getItem(this.KEY);
            return d ? JSON.parse(d) : [];
        } catch { return []; }
    },
    
    save(list) {
        localStorage.setItem(this.KEY, JSON.stringify(list));
    },
    
    add(post) {
        const all = this.getAll();
        all.unshift(post);
        this.save(all);
        return all;
    }
};

function showPage(pageId, activeNavId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    document.querySelectorAll('.nav-col').forEach(n => n.classList.remove('active'));
    if (activeNavId) document.getElementById(activeNavId).classList.add('active');
}

function renderFeedPost(post, idx) {
    const hasAudio = !!post.audioData;
    const isVideo = post.type === 'video';
    return `
    <div class="post-slide" style="transform: translateY(${idx * 100}vh);">
        <div class="media-area">
            ${isVideo ? `
            <video id="vid-${idx}" loop playsinline ${idx === 0 ? 'autoplay' : ''} ${hasAudio ? 'muted' : ''}>
                <source src="${post.mediaData}">
            </video>
            ` : `<img src="${post.mediaData}" alt="โพสต์">`}
            ${hasAudio ? `<audio class="bg-audio" id="aud-${idx}" loop src="${post.audioData}">` : ''}
        </div>
        <div class="info-left">
            <div class="acc-name">${MY_NAME}</div>
            <div class="desc-text">โพสต์ใหม่</div>
            <div class="music-row">🎵 ${post.audioName}</div>
        </div>
        <div class="menu-right">
            <div class="menu-btn"><img class="avatar" src="https://picsum.photos/id/1012/100/100"></div>
            <div class="menu-btn"><span class="icon">❤️</span><span class="num">0</span></div>
            <div class="menu-btn"><span class="icon">💬</span><span class="num">0</span></div>
            <div class="menu-btn"><span class="icon">⭐</span><span class="num">0</span></div>
            <div class="menu-btn"><span class="icon">↗️</span><span class="num">0</span></div>
            <div class="menu-btn"><span class="icon">🎵</span></div>
        </div>
    </div>`;
}

function goToSlide(index) {
    if (index < 0 || index >= posts.length) return;
    currentSlide = index;
    document.getElementById('feed-slider').style.transform = `translateY(-${index * 100}vh)`;
    posts.forEach((_, i) => {
        const vid = document.getElementById(`vid-${i}`);
        const aud = document.getElementById(`aud-${i}`);
        if (!vid) return;
        if (i === index) {
            vid.play().catch(() => { vid.muted = true; vid.play(); });
            if (aud) aud.play().catch(() => {});
        } else { vid.pause(); if (aud) aud.pause(); }
    });
}

function loadFeed() {
    posts = DB.getAll();
    const slider = document.getElementById('feed-slider');
    if (posts.length === 0) {
        slider.innerHTML = '<div style="text-align:center;padding-top:50vh;color:#888">กด + เพื่อโพสต์แรก<br>รูปจะคงอยู่ตลอด ไม่หาย ✅</div>';
        return;
    }
    slider.innerHTML = posts.map((p, i) => renderFeedPost(p, i)).join('');
    goToSlide(0);
}

function renderProfileGrid() {
    const grid = document.getElementById('posts-grid');
    if (posts.length === 0) {
        grid.innerHTML = '<div class="empty-grid">ยังไม่มีโพสต์<br>กด + เพื่อโพสต์แรก</div>';
        return;
    }
    grid.innerHTML = posts.map((post, idx) => {
        const isVideo = post.type === 'video';
        return `
        <div class="grid-item" data-idx="${idx}">
            ${isVideo 
                ? `<video src="${post.mediaData}" muted></video>` 
                : `<img src="${post.mediaData}" alt="โพสต์">`}
        </div>`;
    }).join('');
    
    grid.querySelectorAll('.grid-item').forEach(item => {
        item.addEventListener('click', () => {
            const idx = parseInt(item.dataset.idx);
            currentSlide = idx;
            showPage('page-feed', 'nav-home');
            setTimeout(() => goToSlide(idx), 50);
        });
    });
}

function refreshAll() {
    posts = DB.getAll();
    loadFeed();
    renderProfileGrid();
}

// ปุ่มเมนู
document.getElementById('nav-home').addEventListener('click', () => { showPage('page-feed', 'nav-home'); goToSlide(0); });
document.getElementById('nav-profile').addEventListener('click', () => { showPage('page-profile', 'nav-profile'); renderProfileGrid(); });
document.getElementById('nav-shop').addEventListener('click', () => alert('ร้านค้า — จะเพิ่มเติม ✅'));
document.getElementById('nav-inbox').addEventListener('click', () => alert('กล่องข้อความ — จะเพิ่มเติม ✅'));

// เลือกไฟล์วิดีโอ/รูป
document.getElementById('media-input').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    pendingType = f.type.startsWith('video') ? 'video' : 'image';
    pendingData = await fileToBase64(f);
    selectedAudioData = null;
    selectedAudioName = 'เสียงต้นฉบับ';
    showPage('page-sound');
});

// เลือกเสียง
document.getElementById('audio-input').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    selectedAudioData = await fileToBase64(f);
    selectedAudioName = '🎵 ' + f.name;
});

// กลับ
document.getElementById('back-to-feed').addEventListener('click', () => {
    pendingData = null;
    selectedAudioData = null;
    selectedAudioName = 'เสียงต้นฉบับ';
    showPage('page-feed', 'nav-home');
});

// โพสต์ — เก็บถาวรจริง
document.getElementById('do-post').addEventListener('click', () => {
    if (!pendingData) return;
    const newPost = {
        id: Date.now(),
        type: pendingType,
        mediaData: pendingData,
        audioData: selectedAudioData,
        audioName: selectedAudioName,
        likes: 0, comments: 0, saves: 0, shares: 0,
        time: new Date().toISOString()
    };
    posts = DB.add(newPost);
    pendingData = null;
    selectedAudioData = null;
    selectedAudioName = 'เสียงต้นฉบับ';
    showPage('page-feed', 'nav-home');
    refreshAll();
    alert('✅ บันทึกสำเร็จ — รูปจะไม่หายอีกต่อไป!');
});

// เลื่อนฟีด
let startY = 0, dragging = false;
document.addEventListener('touchstart', e => { startY = e.touches[0].clientY; dragging = true; });
document.addEventListener('touchend', e => {
    if (!dragging) return; dragging = false;
    const diff = startY - e.changedTouches[0].clientY;
    if (Math.abs(diff) > 60) {
        if (diff > 0 && currentSlide < posts.length - 1) goToSlide(currentSlide + 1);
        else if (diff < 0 && currentSlide > 0) goToSlide(currentSlide - 1);
    }
});

window.addEventListener('load', () => {
    showPage('page-feed', 'nav-home');
    refreshAll();
});
</script>
</body>
</html>
